name: Deploy MaxPlay to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/max-adventure/package-lock.json

      # Portail gabarit BLOQUANT (2026-07-15) — audit statique pur node (zéro navigateur,
      # zéro dépendance). Un mini-jeu du menu au cadre cassé (cloud.js manquant, thème
      # absent, emoji bus, charset) arrête le déploiement. Portée = catalog.js (jeux au menu).
      - name: Portail gabarit mini-jeux (bloquant)
        run: node audit-gabarit.mjs
        working-directory: studio/minijeux/tests

      - run: npm ci
        working-directory: studio/max-adventure

      - run: npm run build
        working-directory: studio/max-adventure
        env:
          CI: true

      - name: Assemble site
        run: |
          mkdir -p _site/max-adventure
          cp -r site/* _site/
          cp -r studio/max-adventure/dist/* _site/max-adventure/
          TZ=Europe/Paris date '+%Y-%m-%d %H:%M' > _site/max-adventure/version.txt

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - id: deployment
        uses: actions/deploy-pages@v4
