name: Deploy MaxPlay to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      # Portail check BLOQUANT (HO-R08) — build à jour (générateurs déterministes),
      # audit gabarit statique (pur node, zéro navigateur), référentiel, liens md.
      # Un mini-jeu du menu au cadre cassé (cloud.js manquant, thème absent, emoji
      # bus, charset) ou un générateur désynchronisé arrête le déploiement.
      - name: Portail check (bloquant)
        run: npm run check

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - id: deployment
        uses: actions/deploy-pages@v4
