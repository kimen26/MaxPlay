<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦺 Pose-tes-tiles - Petit Ouvrier 🚧</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mp-theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100dvh; overflow: hidden; }
  body { font-family: 'Comic Sans MS', 'Marker Felt', sans-serif; color: var(--ink);
         display: flex; flex-direction: column;
         touch-action: manipulation; user-select: none; }

  /* ── En-tête compact ── */
  .topbar { display: flex; align-items: center; gap: 6px;
            padding: 4px 8px; flex-shrink: 0; }
  .topbar h1 { font-size: 0.8rem; opacity: 0.85; flex: 1; color: var(--ink); }
  .topbar select { font-size: 0.78rem; font-family: inherit; border-radius: 6px;
                   border: 2px solid var(--line); padding: 6px 4px; background: #fff;
                   color: #2a2a4a; cursor: pointer; flex-shrink: 0; min-height: 32px; }

  /* ── Layout principal ── */
  .layout { display: flex; flex: 1; min-height: 0; gap: 8px; padding: 0 8px 8px; }

  /* Paysage : grille à gauche, palette à droite */
  @media (orientation: landscape) {
    .layout { flex-direction: row; }
    .game-zone { flex-shrink: 0; }
    .palette { flex: 1; min-width: 220px; }
  }
  /* Portrait : grille en haut, palette en bas */
  @media (orientation: portrait) {
    .layout { flex-direction: column; }
    .game-zone { flex-shrink: 0; display: flex; justify-content: center; }
    .palette { flex: 1; min-height: 0; }
  }

  /* ── Grille ── */
  .grid { display: grid; gap: 2px; background: #4a8a20; padding: 2px; border-radius: 8px;
          border: 4px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
  @media (orientation: portrait) {
    .grid { width: min(calc(44dvh - 8px), calc(100vw - 16px)); aspect-ratio: 1; }
  }
  @media (orientation: landscape) {
    .grid { height: calc(100dvh - 56px); aspect-ratio: 1; }
  }
  .cell { background: #6abe30; border-radius: 2px; position: relative;
          aspect-ratio: 1; cursor: pointer; }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%;
              image-rendering: pixelated; image-rendering: crisp-edges;
              pointer-events: none; }
  .cell.selected { outline: 3px solid #ffe066; z-index: 2; }

  /* ── Palette ── */
  .palette { background: #fff; border-radius: 12px; padding: 6px;
             border: 4px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
             display: flex; flex-direction: column; gap: 5px; overflow: hidden; }

  .cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; flex-shrink: 0; }
  .cat-btn { background: #f0f0f0; border: 2px solid transparent; border-radius: 7px;
             padding: 4px 2px; cursor: pointer; font-size: 0.6rem; text-align: center;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             min-height: 44px; gap: 1px; }
  .cat-btn .emoji { font-size: 1.3rem; line-height: 1; }
  .cat-btn.active { background: #ffe066; border-color: #2a2a4a; }
  .cat-btn:active { transform: scale(0.95); }

  /* Tile sélectionnée (affichage nom) */
  .selected-display { display: flex; align-items: center; gap: 6px; font-size: 0.78rem;
                      padding: 3px 6px; background: #ffe066; border-radius: 5px;
                      flex-shrink: 0; min-height: 30px; }
  .selected-display img { width: 24px; height: 24px; image-rendering: pixelated; }

  /* Grille de tiles — scroll activé */
  .tiles-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
                gap: 5px; overflow-y: scroll; padding: 4px;
                background: #f0f0f0; border-radius: 6px;
                flex: 1; min-height: 0;
                -webkit-overflow-scrolling: touch; }
  .tile-btn { background: #fff; border: 2px solid transparent; border-radius: 5px;
              padding: 3px; cursor: pointer; position: relative;
              display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tile-btn .thumb { width: 100%; aspect-ratio: 1; position: relative; overflow: hidden; }
  .tile-btn.wide .thumb { aspect-ratio: 2; }
  .tile-btn img { width: 100%; height: 100%; image-rendering: pixelated;
                  image-rendering: crisp-edges; pointer-events: none; object-fit: contain; }
  .tile-btn .tname { font-size: 0.55rem; color: #555; text-align: center;
                     line-height: 1.1; max-width: 100%; overflow: hidden;
                     white-space: nowrap; text-overflow: ellipsis; }
  .tile-btn.active { border-color: #ff6b35; background: #ffe5d9; transform: scale(1.05); }
  .tile-btn:active { transform: scale(0.95); }

  /* ── Toolbar ── */
  .toolbar { display: flex; gap: 4px; flex-shrink: 0; }
  .tool-btn { background: #fff; border: 2px solid #2a2a4a; border-radius: 7px;
              padding: 6px 4px; cursor: pointer; font-size: 0.78rem; font-weight: bold;
              font-family: inherit; flex: 1; min-height: 40px;
              box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .tool-btn:active { transform: translateY(2px); box-shadow: none; }
  .tool-btn.lisser { background: #ffe066; }
  .tool-btn.gomme  { background: #ff8b8b; }
  .tool-btn.fini   { background: #6abe30; color: #fff; }
  .tool-btn.fini.success { background: #4caf50; animation: bounce 0.5s ease; }
  @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

  /* Flèche retour */
  .back { color: #2a2a4a; text-decoration: none; font-size: 1.3rem; font-weight: 900;
          background: rgba(255,255,255,0.7); border-radius: 8px; padding: 4px 8px;
          flex-shrink: 0; }
</style>

let COLS = 8, ROWS = 8;
let grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
let selectedTile = null;
let currentCat = 'rue';

function tileURL(file) { return ASSET + file; }

// ── Resize grid (pad or crop) ──────────────────────────────────────────────
function resizeGrid(n) {
  const oldGrid = grid;
  const oldR = ROWS, oldC = COLS;
  ROWS = n; COLS = n;
  grid = Array.from({length: ROWS}, (_, r) =>
    Array.from({length: COLS}, (_, c) =>
      (r < oldR && c < oldC) ? (oldGrid[r][c] || null) : null
    )
  );
  // Sync select
  const sel = document.getElementById('grid-size-select');
  if (sel) sel.value = n;
  // Update CSS columns
  const gridEl = document.getElementById('grid');
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  save();
  buildGrid();
}

function buildCats() {
  const div = document.getElementById('cats');
  div.innerHTML = '';
  for (const [key, cat] of Object.entries(CATEGORIES)) {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (key === currentCat ? ' active' : '');
    b.innerHTML = `<div class="emoji">${cat.emoji}</div><div>${cat.label}</div>`;
    b.onclick = () => { currentCat = key; buildCats(); buildTiles(); };
    div.appendChild(b);
  }
}

function buildTiles() {
  const list = document.getElementById('tiles-list');
  list.innerHTML = '';
  list.scrollTop = 0;
  const tiles = CATEGORIES[currentCat].tiles;
  for (const t of tiles) {
    const b = document.createElement('button');
    const isWide = t.size && t.size.w === 2;
    b.className = 'tile-btn' + (isWide ? ' wide' : '') +
                  (selectedTile && selectedTile.file === t.file ? ' active' : '');
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = tileURL(t.file);
    img.alt = t.name;
    thumb.appendChild(img);
    if (t.file2) {
      const img2 = document.createElement('img');
      img2.src = tileURL(t.file2);
      img2.alt = '';
      img2.style.cssText = 'position:absolute;left:50%;top:0;width:50%;height:100%;';
      img.style.cssText = 'position:absolute;left:0;top:0;width:50%;height:100%;';
      thumb.style.position = 'relative';
      thumb.appendChild(img2);
    }
    const lbl = document.createElement('div');
    lbl.className = 'tname';
    lbl.textContent = t.name;
    b.appendChild(thumb);
    b.appendChild(lbl);
    b.onclick = () => selectTile(t);
    list.appendChild(b);
  }
}

function selectTile(t) {
  selectedTile = t;
  buildTiles();
  const disp = document.getElementById('selected-display');
  disp.innerHTML = '';
  const img = document.createElement('img');
  img.src = tileURL(t.file);
  img.alt = t.name;
  const span = document.createElement('span');
  span.textContent = t.name;
  disp.appendChild(img);
  disp.appendChild(span);
}

function buildGrid() {
  const div = document.getElementById('grid');
  div.innerHTML = '';
  div.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.onclick = () => placeOnCell(r, c);
      cell.oncontextmenu = e => { e.preventDefault(); clearCell(r, c); };
      let pressTimer;
      cell.ontouchstart = () => { pressTimer = setTimeout(() => clearCell(r, c), 600); };
      cell.ontouchend = () => clearTimeout(pressTimer);
      div.appendChild(cell);
    }
  }
  redraw();
}

function placeOnCell(r, c) {
  if (!selectedTile) return;
  const t = selectedTile;
  const w = t.size ? t.size.w : 1;
  const h = t.size ? t.size.h : 1;
  if (c + w > COLS || r + h > ROWS) return;
  grid[r][c] = { file: t.file, size: t.size };
  if (t.file2 && w === 2) {
    grid[r][c+1] = { file: t.file2, size: {w:1,h:1}, _part2: true };
  }
  save();
  redraw();
}

function clearCell(r, c) {
  grid[r][c] = null;
  save();
  redraw();
}

function clearAll() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  save();
  redraw();
}

function redraw() {
  const cells = document.querySelectorAll('.cell');
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = cells[r * COLS + c];
      if (!cell) continue;
      const t = grid[r][c];
      cell.innerHTML = '';
      if (t) {
        const img = document.createElement('img');
        img.src = tileURL(t.file);
        img.alt = '';
        cell.appendChild(img);
      }
    }
  }
}

// ── Lisser : pose trottoir autour de chaque case asphalte ─────────────────
function lisser() {
  const ASPHALTES = ['Asphalt_1_Variation_20.png', 'Asphalt_1_Variation_14.png', 'Asphalt_1_Variation_15.png',
                     'Asphalt_1_Variation_2.png', 'Asphalt_1_Variation_8.png', 'Asphalt_1_Variation_4.png',
                     'Asphalt_1_Variation_1.png', 'Asphalt_1_Variation_3.png', 'Asphalt_1_Variation_5.png',
                     'Asphalt_1_Variation_6.png', 'Asphalt_1_Variation_7.png', 'Asphalt_1_Variation_9.png',
                     'Asphalt_1_Variation_24.png', 'Asphalt_1_Variation_25.png', 'Asphalt_1_Variation_26.png',
                     'Asphalt_1_Variation_27.png'];
  const isSW = t => t && t.file && (t.file.endsWith(SW_N) || t.file.endsWith(SW_S) || t.file.endsWith(SW_W) || t.file.endsWith(SW_E));
  const isAsph = t => t && t.file && ASPHALTES.some(a => t.file.endsWith(a));
  const newGrid = grid.map(row => row.map(c => c ? {...c} : null));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!isAsph(grid[r][c])) continue;
      const neighbors = [
        [r-1,c, SW_N], [r+1,c, SW_S], [r,c-1, SW_W], [r,c+1, SW_E]
      ];
      for (const [nr, nc, sw] of neighbors) {
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        if (!grid[nr][nc]) newGrid[nr][nc] = {file: sw};
      }
    }
  }
  grid = newGrid;
  save();
  redraw();
}

function celebrer() {
  const btn = document.getElementById('fini-btn');
  btn.classList.add('success');
  btn.textContent = '🎉 Bravo !';
  try { if (window.playEndSound) playEndSound(10, 10); } catch(e) {}
  try { if (window.confettiBurst) confettiBurst(40); } catch(e) {}
  setTimeout(() => { btn.classList.remove('success'); btn.textContent = '🎉 Fini !'; }, 2500);
}

function save() {
  try { localStorage.setItem('mj-pose-tiles', JSON.stringify({cols: COLS, rows: ROWS, grid})); } catch(e) {}
}
function load() {
  try {
    const s = localStorage.getItem('mj-pose-tiles');
    if (!s) return;
    const data = JSON.parse(s);
    // Support ancien format (tableau direct) et nouveau format {cols, rows, grid}
    if (Array.isArray(data)) {
      if (data.length === ROWS && data[0] && data[0].length === COLS) grid = data;
    } else if (data && data.grid && data.cols && data.rows) {
      COLS = data.cols; ROWS = data.rows;
      grid = data.grid;
      const sel = document.getElementById('grid-size-select');
      if (sel) sel.value = COLS;
    }
  } catch(e) {}
}

load();
buildCats();
buildTiles();
buildGrid();

// Exposées sur window : appelées par les attributs onclick/onchange du markup HTML
// (select#grid-size-select, boutons Lisser/Effacer/Fini) — restent visibles hors
// de la closure MJ.ready malgré le wrap gabarit.
window.resizeGrid = resizeGrid;
window.lisser = lisser;
window.clearAll = clearAll;
window.celebrer = celebrer;

}); // fin MJ.ready
</script>
</body>
</html>
