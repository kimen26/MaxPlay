// ─── Chargement des images ─────────────────────────────────────
const imgCache = {};
function loadImg(src) {
  if (imgCache[src]) return Promise.resolve(imgCache[src]);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { imgCache[src] = img; resolve(img); };
    img.onerror = () => { imgCache[src] = null; resolve(null); };
    img.src = src;
  });
}

async function loadAll(keys) {
  const srcs = keys.map(k => TILES[k]).filter(Boolean);
  await Promise.all(srcs.map(loadImg));
}

// ─── Dessin d'une tile sur canvas ─────────────────────────────
const S = 48; // taille tile de base

// Sol : toujours 48×48 (forcer la taille)
function drawTile(ctx, key, col, row) {
  const src = TILES[key];
  if (!src) return;
  const img = imgCache[src];
  if (!img) return;
  ctx.drawImage(img, col * S, row * S, S, S);
}

// Objet : taille NATIVE (bâtiments modulaires 48×144, props 96×96, poteaux 48×192…)
function drawObject(ctx, key, col, row) {
  const src = TILES[key];
  if (!src) return;
  const img = imgCache[src];
  if (!img) return;
  ctx.drawImage(img, col * S, row * S);
}

function fillRect(ctx, key, c0, r0, cw, rh) {
  for (let r = r0; r < r0 + rh; r++)
    for (let c = c0; c < c0 + cw; c++)
      drawTile(ctx, key, c, r);
}

// ─── Rendu d'une map multi-layer (ground / objects / decoration) ───
// ground : zéro null — toutes les cases ont un tile de sol
// objects : null = case vide (bâtiments, props, arbres)
// decoration : null = case vide (fleurs, petits détails)
// RÈGLES :
//   • Même style sidewalk dans toute la map (ne pas mélanger sidewalk1 et sidewalk3)
//   • drawTile() pour ground (force 48×48), drawObject() pour objects (taille native)
//   • asphalt → sidewalk → bâtiment (jamais asphalt direct → bâtiment)
//   • max 4 tiles identiques consécutifs sur ground
function drawLayeredMap(ctx, map) {
  const { ground, objects, decoration } = map;
  for (let r = 0; r < ground.length; r++)
    for (let c = 0; c < ground[r].length; c++)
      if (ground[r][c]) drawTile(ctx, ground[r][c], c, r);
  if (objects)
    for (let r = 0; r < objects.length; r++)
      for (let c = 0; c < objects[r].length; c++)
        if (objects[r][c]) drawObject(ctx, objects[r][c], c, r);
  if (decoration)
    for (let r = 0; r < decoration.length; r++)
      for (let c = 0; c < decoration[r].length; c++)
        if (decoration[r][c]) drawObject(ctx, decoration[r][c], c, r);
}

  // ─── ⑪ Max Adventure — reproduction tile-based de SandboxScene ──
  // Original Phaser : monde 2400×1600 px, routes en croix au centre (140 px),
  // 3 arrêts de bus, 4-6 bâtiments, ~11 arbres, 5 paires de lampadaires.
  // Reproduction : 25×17 tiles (1200×816 px native, échelle ~1:2 du monde réel).
  {
    id: 'max_adventure',
    title: '⑪ Petit quartier propre (base future Max Adventure)',
    desc: 'Bloc 16×12 : route H + route V + 4 virages aux coins formant un anneau, herbe au centre, 1 toyhouse. Tous les bords trottoir lisses. Base remplaçant la grosse croix au pif.',
    cols: 16, rows: 12,
    async draw(ctx) {
      await loadAll([
        'sw_9','sw_25','sw_26','swN','swS','swW','swE',
        'intSE','intSW','intNE','intNW','extSE','extSW','extNE','extNW',
        'asphalt','dashV','dashH','lineH','lineV',
        'grass1','grass2','grass3',
        'bush1','bush2','bush3',
        'toyhouse1','flower_r','flower_y','flower_b','flower_p',
      ]);

      // Anneau routier 16x12 :
      // Trottoir externe : row 0 + row 11 + col 0 + col 15 (plain)
      // Bord externe trottoir : row 1 (swN), row 10 (swS), col 1 (swW), col 14 (swE)
      // Asphalte exterieure : row 2 (route H haute), col 2 (route V gauche), col 13 (route V droite), row 9 (route H basse)
      // Au centre : row 3-8 cols 3-12 = pelouse + maison
      // Coins : 4 virages (extNE/extNW/extSE/extSW + intSW/intSE/intNW/intNE)
      const grassMix = ['grass1','grass2','grass3'];
      const swPlain = ['sw_9','sw_25','sw_26'];
      const COLS = 16, ROWS = 12;
      const ground = Array.from({length: ROWS}, () => Array(COLS).fill(null));

      // Default = pelouse pour le centre
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        ground[r][c] = grassMix[(r * 7 + c * 3) % 3];
      }
      // Asphalte route H haute : row 2 cols 2-13
      for (let c = 2; c < 14; c++) ground[2][c] = 'asphalt';
      // Asphalte route H basse : row 9 cols 2-13
      for (let c = 2; c < 14; c++) ground[9][c] = 'asphalt';
      // Asphalte route V gauche : rows 2-9 col 2
      for (let r = 2; r < 10; r++) ground[r][2] = 'asphalt';
      // Asphalte route V droite : rows 2-9 col 13
      for (let r = 2; r < 10; r++) ground[r][13] = 'asphalt';
      // Pointillee centre H haute : row 2 cols 3-12 (sauf coins)
      for (let c = 3; c < 13; c++) ground[2][c] = 'dashH';
      // Pointillee centre H basse : row 9 cols 3-12
      for (let c = 3; c < 13; c++) ground[9][c] = 'dashH';
      // Pointillee centre V gauche : rows 3-8 col 2
      for (let r = 3; r < 9; r++) ground[r][2] = 'dashV';
      // Pointillee centre V droite : rows 3-8 col 13
      for (let r = 3; r < 9; r++) ground[r][13] = 'dashV';

      // Bords trottoir 1×1 (les bords trottoir-cote-route, vers le CENTRE = pelouse)
      // swN = bord N (trottoir-en-haut/asph-en-bas) -> pose AU-DESSUS de l'asphalte = row 1
      // Mais ici on a aussi de l'asphalte au-dessus de la pelouse interne -> swS (trottoir-en-bas) cote interne row 3
      // Et swN cote externe row 1
      // Externe : entoure tout le bloc routier (rows 1+10, cols 1+14)
      for (let c = 1; c < 15; c++) ground[1][c] = 'swN';   // bord N externe
      for (let c = 1; c < 15; c++) ground[10][c] = 'swS';  // bord S externe
      for (let r = 1; r < 11; r++) ground[r][1] = 'swW';   // bord W externe
      for (let r = 1; r < 11; r++) ground[r][14] = 'swE';  // bord E externe
      // Interne : entoure la pelouse centrale (rows 3+8, cols 3+12)
      for (let c = 3; c < 13; c++) ground[3][c] = 'swS';   // bord S de l'asph haut, cote interne
      // Mais wait, ground[3][c] etait asph dashH ?? Non row 3 c'est centre, pas asph.
      // Re-reflechissons : row 2 = asph H, row 3 = pelouse centrale interne.
      // Donc le bord interne est ENTRE row 2 (asph) et row 3 (pelouse), c'est-a-dire SUR row 3 ? Non.
      // Le bord est sur ROW 2 ou ROW 3 selon la convention de la tile.
      // sw_S = trottoir-en-bas + asphalte-en-haut : se pose SUR la cellule asphalte qui a du trottoir au sud.
      // -> Mais row 2 doit avoir l'ASPHALTE+POINTILLEE, pas du trottoir.
      // Donc le bord interne se pose sur ROW 3 (cote pelouse) = sw_N (trottoir-en-haut/asph-en-bas)
      for (let c = 3; c < 13; c++) ground[3][c] = 'swN';   // bord N de la pelouse interne (asph au-dessus) cote nord
      for (let c = 3; c < 13; c++) ground[8][c] = 'swS';   // bord S idem cote sud
      for (let r = 3; r < 9; r++) ground[r][3] = 'swW';    // bord W de la pelouse cote ouest
      for (let r = 3; r < 9; r++) ground[r][12] = 'swE';   // bord E idem cote est

      // 4 coins EXTERIEURS (au coins du bloc, gros arcs trottoir)
      ground[1][1]  = 'extNW';   // coin NW
      ground[1][14] = 'extNE';   // coin NE
      ground[10][1] = 'extSW';   // coin SW
      ground[10][14]= 'extSE';   // coin SE

      // 4 coins INTERIEURS (autour de la pelouse, petits triangles trottoir)
      ground[3][3]  = 'intSE';   // coin INT SE de la pelouse (vue depuis la pelouse)... non
      // Recap : la pelouse est au centre. Les 4 coins de la pelouse sont :
      //   (3,3) = NW de pelouse, mais la chaussee est au nord (row 2) et a l'ouest (col 2)
      //   -> a cette cellule il faut un trottoir au coin NW (vers le coin EXT du quartier)
      //   -> intNW (petit triangle trottoir NW) sera pose
      ground[3][3]  = 'intNW';
      ground[3][12] = 'intNE';
      ground[8][3]  = 'intSW';
      ground[8][12] = 'intSE';

      // Pelouse au centre (rows 4-7, cols 4-11) : remplace par grass
      for (let r = 4; r < 8; r++) for (let c = 4; c < 12; c++) {
        ground[r][c] = grassMix[(r * 7 + c * 3) % 3];
      }
      // Trottoirs externes plain (row 0 et row 11) - varier
      for (let c = 0; c < COLS; c++) {
        ground[0][c] = swPlain[(c * 2) % 3];
        ground[11][c] = swPlain[(c * 3 + 1) % 3];
      }
      // Trottoirs externes col 0 et 15 plain
      for (let r = 0; r < ROWS; r++) {
        ground[r][0] = swPlain[(r * 2 + 1) % 3];
        ground[r][15] = swPlain[(r * 3) % 3];
      }

      // 1 toyhouse au centre de la pelouse (4x5)
      const objects = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      objects[4][5] = 'toyhouse1';  // ancre top-left, couvre rows 4-8 cols 5-8

      // Quelques bushes autour de la pelouse
      const bushes = [[5,10],[6,4],[7,11],[4,11]];
      bushes.forEach(([r,c]) => { if (objects[r][c] === null) objects[r][c] = ['bush1','bush2','bush3'][(r+c)%3]; });

      // Fleurs sur les trottoirs externes
      const decoration = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      [[0,3,'flower_r'],[0,11,'flower_y'],[11,3,'flower_p'],[11,11,'flower_b']]
        .forEach(([r,c,f]) => decoration[r][c] = f);

      drawLayeredMap(ctx, { ground, objects, decoration });
    }
  },

  // ─── ⑩ Rue commerçante (entraînement) ───────────────────────
  // 3 modules 1×3 (boulangerie, condo, glacier) ancrés row 0 → couvrent rows 0-2
  {
    id: 'rue_commercante',
    title: '⑩ Rue commerçante',
    desc: 'Façades modulaires (bakery + condo + icecream), trottoir et route 2 voies.',
    cols: 9, rows: 6,
    async draw(ctx) {
      await loadAll(['sidewalk1','sidewalk2','asphalt','asphalt2','asphalt3','bush1','bush2','bush3','flower_r','flower_y','flower_p','bakery_m1','bakery_m2','condo_m1','condo_m2','icecream_m1','icecream_m2']);
      drawLayeredMap(ctx, {
        ground: [
          // Rows 0-2 : sol sous façades
          ['sidewalk1','sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk1'],
          ['sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1'],
          ['sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1','sidewalk1'],
          // Row 3 : trottoir avant
          ['sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1','sidewalk1','sidewalk2','sidewalk1'],
          // Rows 4-5 : route 2 voies
          ['asphalt', 'asphalt2','asphalt3','asphalt', 'asphalt2','asphalt3','asphalt', 'asphalt2','asphalt3'],
          ['asphalt2','asphalt3','asphalt', 'asphalt2','asphalt3','asphalt', 'asphalt2','asphalt3','asphalt'],
        ],
        objects: [
          // Row 0 : façades modulaires (chaque 1×3 couvre rows 0-2)
          [null,'bakery_m1','bakery_m2','condo_m1','condo_m2','icecream_m1','icecream_m2',null,null],
          [null,null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null,null],
          // Row 3 : décorations trottoir (entre façades et route)
          ['bush1',null,null,'bush2',null,null,null,'bush3',null],
          [null,null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null,null],
        ],
        decoration: [
          [null,null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null,null],
          [null,'flower_r',null,null,'flower_y',null,'flower_p',null,'flower_r'],
          [null,null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null,null],
        ],
      });
    }
  },

];

// ─── Rendu ────────────────────────────────────────────────────
async function renderAll() {
  const grid = document.getElementById('grid');

  if (MOCKUPS.length === 0) {
    const msg = document.createElement('p');
    msg.style.cssText = 'color:#555;text-align:center;padding:40px;grid-column:1/-1;';
    msg.textContent = 'Aucune map — pipeline en cours…';
    grid.appendChild(msg);
    return;
  }

  for (const m of MOCKUPS) {
    const card = document.createElement('div');
    card.className = 'card';

    const titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.textContent = m.title;

    const descEl = document.createElement('div');
    descEl.className = 'card-desc';
    descEl.textContent = m.desc;

    const canvas = document.createElement('canvas');
    canvas.width = m.cols * 48;
    canvas.height = m.rows * 48;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';

    card.appendChild(titleEl);
    card.appendChild(descEl);
    card.appendChild(canvas);
    grid.appendChild(card);

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#3d7a3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    try {
      await m.draw(ctx);
    } catch(e) {
      ctx.fillStyle = '#ff000055';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '11px sans-serif';
      ctx.fillText('Erreur: ' + e.message, 4, 20);
    }
  }
}

renderAll();
</script>
