<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Dinos — MaxPlay</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100dvh; overflow:hidden;
  font-family:'Nunito',sans-serif;
  background:#0d1117; color:#fff;
  display:flex; flex-direction:column;
}

/* ── Shared header ── */
.hdr {
  flex-shrink:0; height:52px;
  background:rgba(0,0,0,0.5); border-bottom:2px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; padding:0 12px; gap:10px;
}
.hdr-back {
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
  border-radius:10px; color:#fff; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.95rem; padding:6px 14px; cursor:pointer;
  touch-action:manipulation;
}
.hdr-title { font-weight:900; font-size:1rem; flex:1; }
.hdr-speak {
  background:rgba(255,220,0,0.2); border:1px solid rgba(255,220,0,0.4);
  border-radius:10px; color:#ffe066; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.95rem; padding:6px 12px; cursor:pointer;
  touch-action:manipulation;
}

/* ── Screens ── */
.screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
.screen.active { display:flex; }

/* ══════════════ MENU CATÉGORIES ══════════════ */
#menu-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 12px;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
#menu-scroll.mode-periode {
  display:flex; flex-direction:column; padding:0; overflow:hidden;
}
.cat-card {
  border-radius:18px; padding:18px 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation; user-select:none;
  min-height:130px; position:relative; overflow:hidden;
  transition:transform 0.15s;
}
.cat-card:active { transform:scale(0.94); }
.cat-emoji { font-size:2.8rem; margin-bottom:8px; line-height:1; }
.cat-label { font-size:0.95rem; font-weight:900; text-align:center; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
.cat-count { display:none; }

/* ══════════════ GRILLE DINOS ══════════════ */
#grid-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden; padding:12px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px;
}
.dino-card {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:14px; padding:12px 8px 10px;
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; touch-action:manipulation; user-select:none;
  position:relative; overflow:hidden;
  transition:transform 0.12s, box-shadow 0.12s;
}
.dino-card:active { transform:scale(0.93); }
.dino-card.bounce { animation:cardBounce 0.4s ease-out; }
@keyframes cardBounce {
  0%   { transform:scale(1); }
  30%  { transform:scale(1.08) translateY(-10px); }
  60%  { transform:scale(0.96) translateY(2px); }
  100% { transform:scale(1); }
}
.card-img {
  width:90px; height:70px; object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  margin-bottom:8px;
}
.card-name { font-size:0.85rem; font-weight:900; color:#fff; text-align:center; margin-bottom:2px; }
.card-regime { font-size:0.68rem; color:rgba(255,255,255,0.55); text-align:center; }
.card-region { font-size:0.62rem; color:rgba(255,255,255,0.38); text-align:center; margin-top:2px; }
.card-bar { position:absolute; bottom:0; left:0; right:0; height:3px; }

/* ══════════════ FICHE DINO ══════════════ */
#fiche-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:0 0 30px 0;
}

/* Hero */
.fiche-hero {
  position:relative; display:flex; align-items:center; justify-content:center;
  padding:20px 16px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,0.3),transparent);
}
.fiche-hero-img {
  max-height:200px; max-width:100%; object-fit:contain;
  filter:drop-shadow(0 4px 20px rgba(0,0,0,0.7));
}

/* Name block */
.fiche-name-block {
  padding:0 16px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.fiche-name { font-size:1.8rem; font-weight:900; color:#ffe066; flex:1; min-width:0; }
.fiche-full { font-size:0.8rem; color:rgba(255,255,255,0.4); font-style:italic; width:100%; }

/* Info sections */
.fiche-section {
  margin:0 12px 10px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start;
}
.fiche-section-icon { font-size:1.5rem; flex-shrink:0; margin-top:2px; }
.fiche-section-body { flex:1; min-width:0; }
.fiche-section-title {
  font-size:0.72rem; font-weight:900; color:rgba(255,255,255,0.45);
  text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;
}
.fiche-section-text {
  font-size:0.92rem; font-weight:700; color:#fff; line-height:1.45;
}
.fiche-section-sub {
  font-size:0.78rem; color:rgba(255,255,255,0.55); margin-top:3px;
}

/* Stats row */
.fiche-stats {
  margin:0 12px 10px;
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.stat-box {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:10px 12px;
}
.stat-label { font-size:0.68rem; font-weight:900; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
.stat-val { font-size:1rem; font-weight:900; color:#ffe066; }
.stat-comp { font-size:0.72rem; color:rgba(255,255,255,0.5); margin-top:2px; line-height:1.3; }

/* Speak button inside section */
.speak-btn {
  background:rgba(255,220,0,0.12); border:1px solid rgba(255,220,0,0.3);
  border-radius:8px; color:#ffe066; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.8rem; padding:4px 10px;
  cursor:pointer; touch-action:manipulation; flex-shrink:0;
  align-self:center;
}
.speak-btn:active { background:rgba(255,220,0,0.25); }

/* Highlight box (fait/superpower) */
.fiche-highlight {
  margin:0 12px 10px;
  background:rgba(255,220,0,0.08); border:1px solid rgba(255,220,0,0.25);
  border-radius:14px; padding:14px;
  display:flex; gap:10px; align-items:flex-start;
}
.fiche-highlight-text {
  font-size:0.95rem; font-weight:700; color:#ffe066; line-height:1.5; flex:1;
}

/* Extra gallery */
.fiche-gallery-title {
  margin:16px 12px 8px;
  font-size:0.78rem; font-weight:900; color:rgba(255,255,255,0.4);
  text-transform:uppercase; letter-spacing:0.07em;
}
.fiche-gallery {
  margin:0 12px 10px;
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
}
.fiche-gallery::-webkit-scrollbar { display:none; }
.gallery-thumb {
  flex-shrink:0; width:100px; height:75px; border-radius:10px;
  object-fit:cover; border:1px solid rgba(255,255,255,0.15);
  cursor:pointer; touch-action:manipulation;
  background:rgba(255,255,255,0.05);
}
.gallery-thumb:active { opacity:0.7; }

/* Carousel plein écran */
#carousel {
  display:none; position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0.96); flex-direction:column;
  align-items:center; justify-content:center;
}
#carousel.open { display:flex; }
#carousel-track {
  display:flex; align-items:center;
  width:100%; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
  padding:0 16px; gap:16px;
}
#carousel-track::-webkit-scrollbar { display:none; }
.carousel-slide {
  flex-shrink:0; scroll-snap-align:center;
  width:calc(100vw - 32px); display:flex;
  align-items:center; justify-content:center;
}
.carousel-slide img {
  max-width:100%; max-height:72dvh; border-radius:14px;
  object-fit:contain;
}
#carousel-label {
  margin-top:14px; font-size:0.9rem; font-weight:700;
  color:rgba(255,255,255,0.6); text-align:center;
}
#carousel-dots {
  display:flex; gap:7px; margin-top:10px; justify-content:center;
}
.c-dot {
  width:8px; height:8px; border-radius:50%;
  background:rgba(255,255,255,0.25); transition:background 0.2s;
}
.c-dot.active { background:#ffe066; }
#carousel-close {
  position:absolute; top:14px; right:14px;
  background:rgba(255,255,255,0.15); border:none; border-radius:50%;
  color:#fff; font-size:1.4rem; width:44px; height:44px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-family:'Nunito',sans-serif; touch-action:manipulation;
}

/* Speech pulse */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.speaking { animation:pulse 0.8s infinite; }

/* ══════════════ MODE SELECTOR ══════════════ */
#mode-selector {
  flex-shrink:0; display:flex; gap:6px; padding:8px 12px;
  background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(255,255,255,0.06);
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
#mode-selector::-webkit-scrollbar { display:none; }
.mode-btn {
  flex-shrink:0; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15); border-radius:20px;
  color:rgba(255,255,255,0.6); font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.82rem; padding:6px 14px;
  cursor:pointer; touch-action:manipulation; white-space:nowrap;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
}
.mode-btn.active {
  background:rgba(255,220,0,0.18); border-color:rgba(255,220,0,0.5);
  color:#ffe066;
}
.mode-btn:active { transform:scale(0.93); }

/* ══════════════ CHRONOMAP ══════════════ */
#chrono-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 12px 20px;
}
.chrono-periode {
  margin-bottom:16px; border-radius:16px; overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
}
.chrono-header {
  padding:12px 14px; display:flex; align-items:center; gap:10px;
  cursor:pointer; touch-action:manipulation; user-select:none;
}
.chrono-header:active { opacity:0.8; }
.chrono-emoji { font-size:2rem; }
.chrono-info { flex:1; }
.chrono-label { font-size:1.1rem; font-weight:900; color:#fff; }
.chrono-range { font-size:0.75rem; color:rgba(255,255,255,0.5); margin-top:1px; }
.chrono-desc  { font-size:0.78rem; color:rgba(255,255,255,0.65); margin-top:2px; }
.chrono-count { font-size:0.75rem; font-weight:900; padding:4px 10px; border-radius:12px; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); flex-shrink:0; }

.chrono-bar-container {
  padding:0 14px 8px;
  background:rgba(0,0,0,0.2);
}
.chrono-bar-track {
  height:6px; border-radius:3px; background:rgba(255,255,255,0.08);
  position:relative; margin-bottom:2px;
}
.chrono-bar-fill { height:100%; border-radius:3px; }
.chrono-bar-label { font-size:0.62rem; color:rgba(255,255,255,0.3); text-align:right; }

.chrono-dinos {
  padding:6px 10px 10px;
  background:rgba(0,0,0,0.15);
  display:grid; grid-template-columns:repeat(auto-fill, minmax(90px,1fr)); gap:6px;
}
.chrono-dino-thumb {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; padding:8px 6px 6px;
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; touch-action:manipulation; user-select:none;
  transition:transform 0.12s;
}
.chrono-dino-thumb:active { transform:scale(0.9); }
.chrono-dino-img { width:60px; height:44px; object-fit:contain; margin-bottom:4px; filter:drop-shadow(0 1px 4px rgba(0,0,0,0.5)); }
.chrono-dino-name { font-size:0.66rem; font-weight:900; color:#fff; text-align:center; line-height:1.2; }

/* Frise chronologique visuelle */
.chrono-timeline {
  display:flex; align-items:stretch; margin:0 12px 12px;
  border-radius:10px; overflow:hidden; height:22px;
}
.chrono-tl-seg {
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; font-weight:900; color:rgba(255,255,255,0.8);
  cursor:pointer; touch-action:manipulation; transition:opacity 0.15s;
  white-space:nowrap; overflow:hidden;
}
.chrono-tl-seg:hover { opacity:0.8; }

/* Scroll area */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:2px; }
</style>
</head>
<body>

<!-- ══════════════ SCREEN: MENU ══════════════ -->
<div id="screen-menu" class="screen active">
  <div class="hdr">
    <button class="hdr-back" onclick="location.href='index.html'">← Menu</button>
    <span class="hdr-title">🦕 Les Dinosaures</span>
    <button class="hdr-speak" id="menu-speak-btn" onclick="speakMenuIntro()">🔊</button>
  </div>
  <!-- Sélecteur de mode -->
  <div id="mode-selector">
    <button class="mode-btn active" id="mode-btn-regime"   onclick="setMode('regime')"   >🍽️ Ce qu'il mange</button>
    <button class="mode-btn"        id="mode-btn-continent" onclick="setMode('continent')">🌍 Où il vivait</button>
    <button class="mode-btn"        id="mode-btn-periode"   onclick="setMode('periode')"  >⏳ Quand il vivait</button>
  </div>
  <div id="menu-scroll"></div>
</div>

<!-- ══════════════ SCREEN: GRILLE ══════════════ -->
<div id="screen-grid" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showMenu()">← Retour</button>
    <span class="hdr-title" id="grid-title"></span>
    <button class="hdr-speak" id="grid-speak-btn" onclick="speakCatIntro()">🔊</button>
  </div>
  <div id="grid-scroll"></div>
</div>

<!-- ══════════════ SCREEN: FICHE ══════════════ -->
<div id="screen-fiche" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showGrid()">← Retour</button>
    <span class="hdr-title" id="fiche-hdr-name"></span>
    <button class="hdr-speak" id="fiche-speak-btn" onclick="speakFicheDesc()">🔊</button>
  </div>
  <div id="fiche-scroll"></div>
</div>

<!-- Carousel plein écran -->
<div id="carousel">
  <button id="carousel-close" onclick="closeCarousel()">✕</button>
  <div id="carousel-track"></div>
  <div id="carousel-label"></div>
  <div id="carousel-dots"></div>
</div>

<script src="js/dinos-data.js"></script>
<script>

/* ── TTS ── */
const synth = window.speechSynthesis;

function speakText(txt) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'fr-FR'; u.rate = 0.88; u.pitch = 1.1;
  synth.speak(u);
}
function stopSpeak() { if (synth) synth.cancel(); }

/* ── State ── */
let currentMode   = 'regime';
let currentCatId  = null;
let currentDino   = null;

/* ── Screens ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  stopSpeak();
}

/* ── Mode selector ── */
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-btn-' + mode).classList.add('active');
  buildMenu();
  // TTS
  const labels = { regime: 'Ce qu\'il mange !', continent: 'Où il vivait !', periode: 'Quand il vivait !' };
  speakText(labels[mode] || '');
}

function speakMenuIntro() {
  const labels = { regime: 'Les dinosaures ! Choisis ce que tu veux découvrir !', continent: 'Sur quel continent vivait le dinosaure ?', periode: 'À quelle époque vivait le dinosaure ?' };
  speakText(labels[currentMode] || 'Les dinosaures !');
}

/* ── MENU principal ── */
function showMenu() {
  showScreen('menu');
  buildMenu();
}

function buildMenu() {
  const el = document.getElementById('menu-scroll');
  el.innerHTML = '';
  el.classList.remove('mode-periode');

  if (currentMode === 'regime') {
    buildMenuRegime(el);
  } else if (currentMode === 'continent') {
    buildMenuContinent(el);
  } else if (currentMode === 'periode') {
    buildMenuPeriode(el);
  }
}

/* ── MENU régime (existant) ── */
function buildMenuRegime(el) {
  DINO_CATEGORIES.forEach(cat => {
    const count = DINOS.filter(d => d.cat === cat.id).length;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.background = cat.bg;
    card.innerHTML = `
      <div class="cat-emoji">${cat.emoji}</div>
      <div class="cat-label">${cat.label}</div>
      <div class="cat-count" style="display:block;font-size:0.72rem;opacity:0.6;margin-top:4px">${count} dinos</div>
    `;
    card.addEventListener('click', () => {
      speakText(cat.label);
      setTimeout(() => showGridRegime(cat.id), 400);
    });
    el.appendChild(card);
  });
}

/* ── MENU continent ── */
function buildMenuContinent(el) {
  DINO_CONTINENTS.forEach(cont => {
    const count = DINOS.filter(d => d.continent === cont.id).length;
    if (!count) return;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.background = cont.bg;
    card.innerHTML = `
      <div class="cat-emoji">${cont.emoji}</div>
      <div class="cat-label">${cont.label}</div>
      <div class="cat-count" style="display:block;font-size:0.72rem;opacity:0.6;margin-top:4px">${count} dinos</div>
    `;
    card.addEventListener('click', () => {
      speakText(cont.label);
      setTimeout(() => showGridContinent(cont.id), 400);
    });
    el.appendChild(card);
  });
}

/* ── MENU période = chronomap inline ── */
function buildMenuPeriode(el) {
  el.classList.add('mode-periode');

  // Frise proportionnelle
  const totalMa = 280 - 66;
  const friseHtml = `
    <div class="chrono-timeline" style="margin:10px 12px 6px">
      ${DINO_PERIODES.map(p => {
        const span = p.ma_start - p.ma_end;
        const pct  = Math.round(span / totalMa * 100);
        return `<div class="chrono-tl-seg" style="width:${pct}%;background:${p.color};min-width:14px"
          onclick="scrollToPeriode('${p.id}')">${p.emoji}</div>`;
      }).join('')}
    </div>
  `;

  const wrapper = document.createElement('div');
  wrapper.id = 'chrono-scroll';
  wrapper.style.cssText = 'flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 30px 0;';

  wrapper.innerHTML = friseHtml + DINO_PERIODES.map(p => {
    const dinos = DINOS.filter(d => d.periode === p.id);
    if (!dinos.length) return '';
    const dinosHtml = dinos.map(d => `
      <div class="chrono-dino-thumb" onclick="speakText('${esc(d.name)}');setTimeout(()=>showFiche2('${d.id}'),300)">
        <img class="chrono-dino-img" src="img/dinos/${d.png}" alt="${d.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="chrono-dino-name">${d.name}</div>
      </div>
    `).join('');
    return `
      <div class="chrono-periode" id="periode-${p.id}">
        <div class="chrono-header" style="background:${p.color}22" onclick="speakText('${esc(p.label)}. ${esc(p.desc)}. ${dinos.length} dinosaures.')">
          <div class="chrono-emoji">${p.emoji}</div>
          <div class="chrono-info">
            <div class="chrono-label">${p.label}</div>
            <div class="chrono-range">il y a ${p.range}</div>
            <div class="chrono-desc">${p.desc}</div>
          </div>
          <div class="chrono-count">${dinos.length} dinos</div>
        </div>
        <div class="chrono-dinos">${dinosHtml}</div>
      </div>
    `;
  }).join('');

  el.appendChild(wrapper);
}

function scrollToPeriode(id) {
  const el = document.getElementById('periode-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showFiche2(dinoId) {
  const dino = DINOS.find(d => d.id === dinoId);
  if (dino) showFiche(dino);
}

/* ── GRID régime ── */
function showGridRegime(catId) {
  currentCatId = catId;
  showScreen('grid');
  buildGrid(catId);
  const cat = DINO_CATEGORIES.find(c => c.id === catId);
  document.getElementById('grid-title').textContent = cat.emoji + ' ' + cat.label;
  setTimeout(() => speakText(cat.label + ' ! Tape sur un dino pour tout savoir !'), 200);
}

/* ── GRID continent ── */
function showGridContinent(contId) {
  currentCatId = contId;
  showScreen('grid');
  const cont = DINO_CONTINENTS.find(c => c.id === contId);
  document.getElementById('grid-title').textContent = cont.emoji + ' ' + cont.label;
  const el = document.getElementById('grid-scroll');
  el.innerHTML = '';
  const dinos = DINOS.filter(d => d.continent === contId);
  dinos.forEach(d => {
    const card = document.createElement('div');
    card.className = 'dino-card';
    card.innerHTML = `
      <img class="card-img" src="img/dinos/${d.png}" alt="${d.name}" loading="lazy" onerror="this.style.display='none'">
      <div class="card-name">${d.name}</div>
      <div class="card-regime">${d.regime}</div>
      <div class="card-region">⏳ ${DINO_PERIODES.find(p=>p.id===d.periode)?.label||d.epoque}</div>
      <div class="card-bar" style="background:${cont.color}"></div>
    `;
    card.addEventListener('click', () => {
      card.classList.remove('bounce'); void card.offsetWidth; card.classList.add('bounce');
      speakText(d.name);
      setTimeout(() => showFiche(d), 350);
    });
    el.appendChild(card);
  });
  setTimeout(() => speakText(cont.label + ' ! Tape sur un dino pour tout savoir !'), 200);
}

      <div class="card-region">📍 ${d.region}</div>

/* ── Retour depuis grille ── */
function showGrid(catId) {
  if (catId) currentCatId = catId;
  showScreen('grid');
  if (currentMode === 'continent') {
    showGridContinent(currentCatId);
  } else {
    showGridRegime(currentCatId);
  }
}

/* ── Build fiche ── */
function speakFicheDesc() {
  if (!currentDino) return;
  speakFiche(currentDino);
}

function regimeIcon(cat) {
  const icons = { carnivores:'🥩', herbivores:'🌿', piscivores:'🐟', omnivores:'🍃', volants_marins:'🌊' };
  return icons[cat] || '🍽️';
}
function regimelabel(regime) {
  return regime.replace(/[🥩🌿🐟🍃🌊]/g,'').replace(/\(.*?\)/g,'').trim();
}
function speakFiche(d) {
  const poids = d.poids_t >= 1 ? d.poids_t + ' tonnes' : Math.round(d.poids_t*1000) + ' kilos';
  const txt = `${d.name} ! ${d.nom_etym||''} `
    + `Il mesurait ${d.taille_m} mètres de long et ${d.hauteur_m||'?'} mètres de haut. `
    + `Il pesait ${poids}. `
    + `C'est un ${regimelabel(d.regime).toLowerCase()}. `
    + `Il mange ${d.proies}. `
    + `${d.amis}. `
    + `Le savais-tu ? ${d.fait}`;
  speakText(txt);
}

    </div>

    <!-- Nom + étymologie -->

      </div>
      <button class="speak-btn" style="border-color:rgba(180,130,255,0.3);color:#d4aaff;background:rgba(180,130,255,0.1)"

    <!-- Époque & région -->

      <div class="fiche-section-body">

        <div class="fiche-section-sub">📍 ${d.region}</div>

  if (thumbs.length) {
    const srcs = Array.from(thumbs).map(img => ({ src: img.src, label: img.title || img.alt || '' }));
    thumbs.forEach((img, i) => {
      img.addEventListener('click', () => openCarousel(srcs, i));

}

function buildGalleryHTML(extras, name) {
  const thumbs = extras.map(e =>
    `<img class="gallery-thumb" src="${e.src}" alt="${e.label || name}" title="${e.label || ''}" loading="lazy">`
  ).join('');
  const labels = extras.map(e => `<span>${e.label || '?'}</span>`).join(' · ');
  return `
    <div class="fiche-gallery-title">📸 Plus d'images — <small style="font-weight:400;color:rgba(255,255,255,0.35)">${labels}</small></div>
    <div class="fiche-gallery">${thumbs}</div>
  `;
}

function esc(s) {
  return (s || '').replace(/'/g, '\\\'').replace(/"/g, '&quot;');
}

/* ── Carousel ── */
let carouselSrcs = [];
let carouselIdx = 0;

function openCarousel(srcs, idx) {
  carouselSrcs = srcs;
  carouselIdx = idx;
  const track = document.getElementById('carousel-track');
  const dots  = document.getElementById('carousel-dots');
  track.innerHTML = srcs.map(s =>
    `<div class="carousel-slide"><img src="${s.src}" alt="${s.label||''}"></div>`
  ).join('');
  dots.innerHTML = srcs.map((_, i) =>
    `<div class="c-dot${i===idx?' active':''}"></div>`
  ).join('');
  document.getElementById('carousel').classList.add('open');
  // Scroll to initial image
  requestAnimationFrame(() => {
    const slide = track.children[idx];
    if (slide) slide.scrollIntoView({ behavior:'auto', block:'nearest', inline:'center' });
  });
  updateCarouselLabel(idx);
  // Track scroll to update dots
  track.addEventListener('scroll', onCarouselScroll, { passive:true });
}

function onCarouselScroll() {
  const track = document.getElementById('carousel-track');
  const slideWidth = track.clientWidth;
  const newIdx = Math.round(track.scrollLeft / slideWidth);
  if (newIdx !== carouselIdx) {
    carouselIdx = newIdx;
    updateCarouselLabel(newIdx);
    document.querySelectorAll('.c-dot').forEach((d,i) => d.classList.toggle('active', i===newIdx));
  }
}

function updateCarouselLabel(idx) {
  const src = carouselSrcs[idx];
  document.getElementById('carousel-label').textContent = src && src.label ? src.label : '';
}

function closeCarousel() {
  document.getElementById('carousel').classList.remove('open');
  document.getElementById('carousel-track').removeEventListener('scroll', onCarouselScroll);
}
