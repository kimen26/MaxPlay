// ─── Chargement des images ─────────────────────────────────────
const imgCache = {};
function loadImg(src) {
  if (imgCache[src]) return Promise.resolve(imgCache[src]);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { imgCache[src] = img; resolve(img); };
    img.onerror = () => { imgCache[src] = null; resolve(null); };
    img.src = src;
  });
}

async function loadAll(keys) {
  const srcs = keys.map(k => TILES[k]).filter(Boolean);
  await Promise.all(srcs.map(loadImg));
}

// ─── Dessin d'une tile sur canvas ─────────────────────────────
const S = 48; // taille tile de base

// Sol : toujours 48×48 (forcer la taille)
function drawTile(ctx, key, col, row) {
  const src = TILES[key];
  if (!src) return;
  const img = imgCache[src];
  if (!img) return;
  ctx.drawImage(img, col * S, row * S, S, S);
}

// Objet : taille NATIVE (bâtiments modulaires 48×144, props 96×96, poteaux 48×192…)
function drawObject(ctx, key, col, row) {
  const src = TILES[key];
  if (!src) return;
  const img = imgCache[src];
  if (!img) return;
  ctx.drawImage(img, col * S, row * S);
}

function fillRect(ctx, key, c0, r0, cw, rh) {
  for (let r = r0; r < r0 + rh; r++)
    for (let c = c0; c < c0 + cw; c++)
      drawTile(ctx, key, c, r);
}

// ─── Rendu d'une map multi-layer (ground / objects / decoration) ───
// ground : zéro null — toutes les cases ont un tile de sol
// objects : null = case vide (bâtiments, props, arbres)
// decoration : null = case vide (fleurs, petits détails)
// RÈGLES :
//   • Même style sidewalk dans toute la map (ne pas mélanger sidewalk1 et sidewalk3)
//   • drawTile() pour ground (force 48×48), drawObject() pour objects (taille native)
//   • asphalt → sidewalk → bâtiment (jamais asphalt direct → bâtiment)
//   • max 4 tiles identiques consécutifs sur ground
function drawLayeredMap(ctx, map) {
  const { ground, objects, decoration } = map;
  for (let r = 0; r < ground.length; r++)
    for (let c = 0; c < ground[r].length; c++)
      if (ground[r][c]) drawTile(ctx, ground[r][c], c, r);
  if (objects)
    for (let r = 0; r < objects.length; r++)
      for (let c = 0; c < objects[r].length; c++)
        if (objects[r][c]) drawObject(ctx, objects[r][c], c, r);
  if (decoration)
    for (let r = 0; r < decoration.length; r++)
      for (let c = 0; c < decoration[r].length; c++)
        if (decoration[r][c]) drawObject(ctx, decoration[r][c], c, r);
}

  // ─── ⑪ Max Adventure — reproduction tile-based de SandboxScene ──
  // Original Phaser : monde 2400×1600 px, routes en croix au centre (140 px),
  // 3 arrêts de bus, 4-6 bâtiments, ~11 arbres, 5 paires de lampadaires.
  // Reproduction : 25×17 tiles (1200×816 px native, échelle ~1:2 du monde réel).
  {
    id: 'max_adventure',
    title: '⑪ Max Adventure (carte tilée)',
    desc: 'Reproduction de SandboxScene Phaser : routes en croix, 3 arrêts bus, bâtiments, arbres.',
    cols: 25, rows: 17,
    async draw(ctx) {
      await loadAll([
        'asphalt','asphalt2','asphalt3','sidewalk1','sidewalk2','sidewalk5',
        'grass1','grass2','grass3',
        'bush1','bush2','bush3',
        'toyhouse1','toyhouse2','toyhouse3','toyhouse4',
        'bench_city','flower_r','flower_y','flower_b','flower_p',
      ]);

      // Construction algorithmique du ground (plus lisible que 17×25 littéraux)
      const ground = [];
      const grassMix = ['grass1','grass2','grass3'];
      const asphMix  = ['asphalt','asphalt2','asphalt3'];
      const swMix    = ['sidewalk1','sidewalk2'];
      // Routes : H sur rows 7-9, V sur cols 11-13. Trottoirs : rows 6/10 et cols 10/14.
      for (let r = 0; r < 17; r++) {
        const row = [];
        for (let c = 0; c < 25; c++) {
          const isHRoad = (r >= 7 && r <= 9);
          const isVRoad = (c >= 11 && c <= 13);
          const isHSidewalk = (r === 6 || r === 10);
          const isVSidewalk = (c === 10 || c === 14);
          if (isHRoad || isVRoad) {
            row.push(asphMix[(r + c) % 3]);
          } else if (isHSidewalk || isVSidewalk) {
            row.push(swMix[(r + c) % 2]);
          } else {
            row.push(grassMix[(r * 7 + c * 3) % 3]);
          }
        }
        ground.push(row);
      }

      // Layer objects : null partout par défaut
      const objects = Array.from({ length: 17 }, () => Array(25).fill(null));
      // Arrêts de bus (sidewalk5 + bench_city) — 3 positions inspirées du jeu
      // Arrêt 162 : col 3, row 6 (trottoir nord-ouest)
      ground[6][3] = 'sidewalk5'; ground[6][4] = 'sidewalk5';
      objects[5][3] = 'bench_city'; // 2×2 → rows 5-6 cols 3-4 (sur grass+sidewalk5)
      // Arrêt M7 : col 12 trop sur la route. Mettre col 8 row 6
      ground[6][8] = 'sidewalk5'; ground[6][9] = 'sidewalk5';
      objects[5][8] = 'bench_city';
      // Arrêt 380 : col 20 row 10 (trottoir sud-est)
      ground[10][19] = 'sidewalk5'; ground[10][20] = 'sidewalk5';
      objects[10][19] = 'bench_city'; // rows 10-11 cols 19-20

      // Bâtiments (toyhouse 4×5) — 4 quadrants. Ancrés sur grass.
      // NO : trop grand pour 17 rows. Place 2 toyhouses, ailleurs juste bushes.
      objects[0][1]  = 'toyhouse1'; // NO : cols 1-4 rows 0-4
      objects[0][20] = 'toyhouse2'; // NE : cols 20-23 rows 0-4
      objects[12][1]  = 'toyhouse3'; // SO : cols 1-4 rows 12-16
      objects[12][20] = 'toyhouse4'; // SE : cols 20-23 rows 12-16

      // Arbres (bushes) éparpillés sur grass (zones non couvertes par toyhouses)
      const trees = [
        [1,6],[2,15],[5,7],[5,18],
        [11,7],[11,18],
        [15,6],[15,8],[15,15],[15,17],
        [13,7],[13,18],
      ];
      trees.forEach(([r,c]) => {
        if (objects[r][c] === null) objects[r][c] = ['bush1','bush2','bush3'][(r+c)%3];
      });

      // Decoration : fleurs autour des bâtiments et arrêts
      const decoration = Array.from({ length: 17 }, () => Array(25).fill(null));
      const flowers = [
        [5,5,'flower_r'],[5,16,'flower_y'],
        [11,5,'flower_p'],[11,16,'flower_b'],
        [16,7,'flower_r'],[16,17,'flower_y'],
        [0,8,'flower_b'],[0,15,'flower_p'],
      ];
      flowers.forEach(([r,c,f]) => { if (decoration[r][c] === null) decoration[r][c] = f; });

      drawLayeredMap(ctx, { ground, objects, decoration });
    }
  },

// ─── Rendu ────────────────────────────────────────────────────
async function renderAll() {
  const grid = document.getElementById('grid');

  if (MOCKUPS.length === 0) {
    const msg = document.createElement('p');
    msg.style.cssText = 'color:#555;text-align:center;padding:40px;grid-column:1/-1;';
    msg.textContent = 'Aucune map — pipeline en cours…';
    grid.appendChild(msg);
    return;
  }

  for (const m of MOCKUPS) {
    const card = document.createElement('div');
    card.className = 'card';

    const titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.textContent = m.title;

    const descEl = document.createElement('div');
    descEl.className = 'card-desc';
    descEl.textContent = m.desc;

    const canvas = document.createElement('canvas');
    canvas.width = m.cols * 48;
    canvas.height = m.rows * 48;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';

    card.appendChild(titleEl);
    card.appendChild(descEl);
    card.appendChild(canvas);
    grid.appendChild(card);

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#3d7a3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    try {
      await m.draw(ctx);
    } catch(e) {
      ctx.fillStyle = '#ff000055';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '11px sans-serif';
      ctx.fillText('Erreur: ' + e.message, 4, 20);
    }
  }
}

renderAll();
