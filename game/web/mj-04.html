<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-04 â€“ Compte les passagers</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #gameScr { background: linear-gradient(160deg, #1a3a2a, #1a2a3a); }
    .pax-group {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #ffffff10;
      border-radius: 12px;
      margin: 4px;
    }
    .pax {
      font-size: 2.2rem;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .groups-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
    }
  </style>
</head>
<body data-mp-intro-emoji="🚌" data-mp-intro-title="Compte les passagers" data-mp-intro-hint="Combien sont montés ?">
  <div id="app">
    <!-- Header -->
    <div class="hdr">
      <a href="index.html" class="back">â†</a>
      <span class="htitle">ðŸ‘¥ Compte les passagers</span>
    </div>
    
    <!-- Score -->
    <div class="scorebar">
      <span class="scoretxt">Score</span>
      <span class="scoreval" id="score">0</span>
      <span class="streak" id="streak"></span>
    </div>
    
    <!-- Question -->
    <div class="qbox" style="padding:20px 12px;">
      <div class="groups-container" id="groups">
        <!-- Groupes gÃ©nÃ©rÃ©s par JS -->
      </div>
      <div class="qtxt" style="font-size:1.2rem;margin-top:12px;">
        Combien de passagers en tout ?
      </div>
    </div>
    
    <!-- Choices -->
    <div class="choices" id="choices" style="grid-template-columns:repeat(4,1fr);padding:0 12px;">
      <!-- GÃ©nÃ©rÃ© par JS -->
    </div>
  </div>
  
  <!-- Feedback overlay -->
  <div id="fbOverlay"></div>
  
  <!-- Scripts -->
  <script src="js/sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/data.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script>
    // â”€â”€â”€ MJ-03a: Compte les passagers â”€â”€â”€
    // Des passagers arrivent par GROUPES â†’ Max compte le total
    // Groupements visuels: 2+3+3 plutÃ´t que 8 en ligne

    const MAX_QUESTIONS = 10;
    let score = 0;
    let streak = 0;
    let questionCount = 0;
    let qcm = null;
    let correctAnswer = 0;
    
    const EMOJIS = ['ðŸ§', 'ðŸ§â€â™‚ï¸', 'ðŸ§â€â™€ï¸', 'ðŸ‘¨', 'ðŸ‘©', 'ðŸ‘´', 'ðŸ‘µ'];
    
    function init() {
      score = 0;
      streak = 0;
      questionCount = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('streak').textContent = '';
      nextQuestion();
    }

    function nextQuestion() {
      if (questionCount >= MAX_QUESTIONS) { showEndScreen(); return; }
      questionCount++;
      qcm = QcmRetry.create();
      
      // GÃ©nÃ©rer un total entre 3 et 10
      const total = 3 + Math.floor(Math.random() * 8);
      correctAnswer = total;
      
      // DÃ©composer en groupes (max 3 par groupe)
      const groups = decomposeIntoGroups(total);
      
      // Afficher les groupes
      const container = document.getElementById('groups');
      container.innerHTML = '';
      
      const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      
      groups.forEach((count, i) => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'pax-group';
        groupDiv.style.animationDelay = `${i * 0.2}s`;
        
        for (let j = 0; j < count; j++) {
          const span = document.createElement('span');
          span.className = 'pax';
          span.textContent = emoji;
          span.style.animationDelay = `${i * 0.2 + j * 0.05}s`;
          groupDiv.appendChild(span);
        }
        
        container.appendChild(groupDiv);
      });
      
      // GÃ©nÃ©rer les choix
      const wrongs = [];
      for (let v = 1; v <= 12; v++) {
        if (v !== correctAnswer) wrongs.push(v);
      }
      const options = [correctAnswer, ...shuffle(wrongs).slice(0, 3)];
      
      // Afficher les choix
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      
      shuffle(options).forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'ch';
        btn.style.fontSize = '1.4rem';
        btn.style.minHeight = '60px';
        btn.textContent = num;
        if (num === correctAnswer) btn.dataset.correct = '1';
        btn.onclick = () => answer(num === correctAnswer, btn);
        choicesDiv.appendChild(btn);
      });
    }
    
    // DÃ©compose un nombre en groupes de max 3
    function decomposeIntoGroups(n) {
      const groups = [];
      let remaining = n;
      
      while (remaining > 0) {
        // Groupe alÃ©atoire entre 2 et 3 (ou 1 si reste 1)
        let groupSize;
        if (remaining === 1) {
          groupSize = 1;
        } else if (remaining === 2) {
          groupSize = 2;
        } else {
          groupSize = 2 + Math.floor(Math.random() * 2); // 2 ou 3
        }
        groups.push(groupSize);
        remaining -= groupSize;
      }
      
      return groups;
    }
    
    function answer(isCorrect, btn) {
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, isCorrect);
      if (res.outcome === 'ignored') return;
      if ((res.outcome === 'correct' || res.outcome === 'reveal') && typeof Tracker !== 'undefined') Tracker.logAnswer(res.outcome === 'correct');

      if (res.outcome === 'correct') {
        btn.classList.add('ok');
        score += res.points;
        if (res.streakInc) streak++; else streak = 0;
        if (streak >= 3) confetti();
        sndDing(); showFB(true);
        updateBar();
        setTimeout(nextQuestion, 1200);
      } else if (res.outcome === 'reveal') {
        btn.classList.add('ko'); btn.disabled = true;
        streak = 0;
        QcmRetry.revealCorrect(document.getElementById('choices'));
        sndBuzz(); showFB(false);
        updateBar();
        setTimeout(nextQuestion, 1600);
      } else {
        btn.classList.add('ko'); btn.disabled = true;
        streak = 0;
        sndBuzz(); showFB(false);
        updateBar();
      }
    }

    function updateBar() {
      document.getElementById('score').textContent = score;
      document.getElementById('streak').textContent = streak >= 2 ? `ðŸ”¥Ã—${streak}` : '';
    }

    function showEndScreen() {
      if (typeof Tracker !== 'undefined') Tracker.endSession(score, MAX_QUESTIONS * 10);
      if (typeof playEndSound === 'function') playEndSound(score, MAX_QUESTIONS * 10);
      if (typeof confetti === 'function') confetti();
      document.getElementById('app').innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;text-align:center;padding:20px;">
          <div style="font-size:5rem;margin-bottom:20px;">ðŸ†</div>
          <h2 style="font-size:2rem;margin-bottom:20px;color:#ffe066;">Super !</h2>
          <p style="font-size:1.4rem;margin-bottom:30px;">Tu as fait <strong>${score}</strong> points !</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
            <a href="mj-04.html" style="background:#00c47a;color:#fff;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:900;font-size:1.1rem;">ðŸ”„ Rejouer</a>
            <a href="index.html" style="background:#ffffff22;color:#fff;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:900;font-size:1.1rem;">ðŸ“‹ Menu</a>
          </div>
        </div>`;
    }

    // DÃ©marrer
    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/intro-splash.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
