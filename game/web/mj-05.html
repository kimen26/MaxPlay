<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-05 – La bonne place</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #gameScr { background: linear-gradient(160deg, #3a1a2a, #1a2a3a); }
    .bus-scene {
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #90EE90 50%, #228B22 100%);
      border-radius: 16px;
      padding: 16px;
      margin: 0 12px 12px;
      position: relative;
      min-height: 180px;
    }
    .bus-visual {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      animation: busBounce 2s ease-in-out infinite;
    }
    .bus-visual svg { width: 100%; height: auto; }
    @keyframes busBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-3px); }
    }
    .people-waiting {
      display: flex;
      justify-content: center;
      gap: 4px;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 20px;
    }
    .person { font-size: 1.8rem; animation: personBob 1s ease-in-out infinite; }
    .person:nth-child(2) { animation-delay: 0.1s; }
    .person:nth-child(3) { animation-delay: 0.2s; }
    .person:nth-child(4) { animation-delay: 0.3s; }
    .person:nth-child(5) { animation-delay: 0.4s; }
    @keyframes personBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .bus-seats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 12px;
      background: #ffffff10;
      border-radius: 12px;
      margin: 0 12px 12px;
    }
    .seat {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: #00c47a33;
      border: 2px solid #00c47a;
      transition: all 0.3s;
    }
    .seat.occupied { background: #ff445533; border-color: #ff4455; }
    .seat.available { background: #ffffff22; border-color: #ffffff44; }
    .seat.boarding { animation: boardAnim 0.5s ease-out; }
    @keyframes boardAnim {
      0% { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .problem-text {
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
      padding: 12px;
      background: #ffffff10;
      border-radius: 12px;
      margin: 0 12px 12px;
    }
    .problem-text strong { color: #ffe066; font-size: 1.2rem; }
    .question-counter { text-align: center; font-size: 0.9rem; opacity: 0.7; margin-bottom: 8px; }
    #levelbar { margin-left:auto; font-weight:900; color:#ffe066; background:#ffffff1f; border-radius:10px; padding:3px 12px; font-size:0.85rem; }
    #hintline { text-align:center; color:#ffe066; font-weight:900; font-size:0.92rem; min-height:22px; margin:2px 12px 8px; }
  </style>
</head>
<body data-mp-intro-emoji="🪑" data-mp-intro-title="La bonne place" data-mp-intro-hint="Compte les places !">
  <div id="app">
    <!-- Header -->
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🪑 La bonne place</span>
    </div>

    <!-- Score + niveau -->
    <div class="scorebar">
      <span class="scoretxt">Score</span>
      <span class="scoreval" id="score">0</span>
      <span class="streak" id="streak"></span>
      <span id="levelbar">Niveau 1</span>
    </div>

    <!-- Problem -->
    <div class="problem-text" id="problem"><!-- Généré par JS --></div>

    <!-- Bus visualization with people -->
    <div class="bus-scene" id="busScene">
      <div class="bus-visual" id="busVisual"></div>
      <div class="people-waiting" id="peopleWaiting"><!-- Généré par JS --></div>
    </div>

    <!-- Seats visualization -->
    <div class="bus-seats" id="busSeats"><!-- Généré par JS --></div>

    <!-- Choices -->
    <div class="choices" id="choices" style="grid-template-columns:repeat(4,1fr);padding:0 12px;"><!-- Généré par JS --></div>

    <!-- Indice de méthode (jamais la réponse) -->
    <div id="hintline"></div>
  </div>

  <!-- Feedback overlay -->
  <div id="fbOverlay"></div>

  <!-- Scripts -->
  <script src="js/sounds.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/data.js"></script>
  <script src="js/bus-svg.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script>
    // ─── MJ-05 : La bonne place ───
    // Problèmes places / monter / descendre / combo. 5 paliers (doc _PALIERS-DIFFICULTE.md).
    // Niveau = Stars.get('mj-05') + 1. Manche mixte 8 questions (4 palier courant + 4 plus faciles).
    const POOL_MJ05 = LIGNES.filter(l => ['162','172','185','380','V7','131','125','132','180','47','186'].includes(l.num));

    const MAX_QUESTIONS = 8;
    const level = Math.max(0, Math.min(4, (window.Stars ? Stars.get('mj-05') : 0)));

    function shuffle(a) { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
    function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
    function buildSchedule() {
      const hard = Array(4).fill(level);
      const easy = [];
      for (let i = 0; i < 4; i++) easy.push(level <= 0 ? 0 : Math.floor(Math.random() * level));
      return shuffle([...hard, ...easy]);
    }

    let schedule = buildSchedule();
    let score = 0, streak = 0, questionCount = 0, locked = false, correctCount = 0;
    let qcm = null, correctAnswer = 0, currentProblem = null;

    // Opérations autorisées par palier (N1 = places seules)
    const POOLS = [
      ['places'],
      ['places', 'monter'],
      ['places', 'monter', 'descendre'],
      ['monter', 'descendre', 'combo'],
      ['combo', 'combo', 'monter', 'descendre'],
    ];

    function setLevelBadge() { const lb = document.getElementById('levelbar'); if (lb) lb.textContent = 'Niveau ' + (level + 1); }

    function init() {
      score = 0; streak = 0; questionCount = 0; correctCount = 0; locked = false;
      schedule = buildSchedule();
      document.getElementById('score').textContent = '0';
      document.getElementById('streak').textContent = '';
      setLevelBadge();
      const d = POOL_MJ05[Math.floor(Math.random() * POOL_MJ05.length)];
      document.getElementById('busVisual').innerHTML = busSVG(d.color, d.textColor, d.num, 160);
      nextQuestion();
    }

    function generateProblem(lv) {
      const type = POOLS[lv][Math.floor(Math.random() * POOLS[lv].length)];
      if (type === 'places') {
        const total = rnd(6, [10, 12, 12, 16, 20][lv]);
        const occupied = rnd(1, total - 1);
        return { type, total, occupied, waiting: 0, answer: total - occupied,
          text: `Le bus a <strong>${total}</strong> places.<br><strong>${occupied}</strong> sont occupées.<br>Combien de places libres ?`,
          hint: 'Enlève les places occupées du total.' };
      }
      if (type === 'monter') {
        const total = [8, 10, 12, 14, 18][lv];
        const occupied = rnd(2, total - 3);
        const waiting = rnd(2, 7);
        const free = total - occupied;
        return { type, total, occupied, waiting, answer: Math.min(waiting, free),
          text: `Le bus a <strong>${total}</strong> places.<br><strong>${occupied}</strong> occupées.<br><strong>${waiting}</strong> attendent.<br>Combien peuvent monter ?`,
          hint: 'Compte les places libres — sans dépasser le nombre qui attend.' };
      }
      if (type === 'descendre') {
        const total = rnd(6, [10, 12, 14, 16, 22][lv]);
        const leaving = rnd(1, total - 1);
        return { type, total, occupied: 0, waiting: leaving, answer: total - leaving,
          text: `Il y a <strong>${total}</strong> passagers.<br><strong>${leaving}</strong> descendent.<br>Combien restent ?`,
          hint: 'Enlève ceux qui descendent.' };
      }
      // combo : descendre puis monter
      const start = rnd(8, [12, 12, 14, 16, 22][lv]);
      const leaving = rnd(2, start - 3);
      const boarding = rnd(2, 6);
      return { type: 'combo', total: start, occupied: 0, waiting: boarding, answer: start - leaving + boarding,
        text: `Il y a <strong>${start}</strong> passagers.<br><strong>${leaving}</strong> descendent.<br>Puis <strong>${boarding}</strong> montent.<br>Combien sont dans le bus ?`,
        hint: "D'abord enlève ceux qui descendent, puis ajoute ceux qui montent." };
    }

    function generateChoices(correct, lv) {
      const range = [2, 3, 3, 4, 5][lv];
      const set = new Set([correct]);
      let g = 0;
      while (set.size < 4 && g++ < 60) { const d = correct + rnd(-range, range); if (d >= 0 && d !== correct) set.add(d); }
      let n = 0; while (set.size < 4) { if (n !== correct) set.add(n); n++; }
      return shuffle([...set]);
    }

    function nextQuestion() {
      if (questionCount >= MAX_QUESTIONS) { showEndScreen(); return; }
      const lv = schedule[questionCount];
      questionCount++;
      locked = false;
      qcm = QcmRetry.create();
      const p = generateProblem(lv);
      currentProblem = p; correctAnswer = p.answer;

      document.getElementById('problem').innerHTML =
        `<div class="question-counter">Question ${questionCount} / ${MAX_QUESTIONS} · Niveau ${level + 1}</div>` + p.text;
      document.getElementById('hintline').textContent = '';

      renderPeopleWaiting(p.waiting || 0);
      renderSeats(p.total, p.occupied);

      const choices = generateChoices(correctAnswer, lv);
      const c = document.getElementById('choices');
      c.innerHTML = '';
      choices.forEach(num => {
        const b = document.createElement('button');
        b.className = 'ch';
        b.style.fontSize = '1.3rem';
        b.style.minHeight = '56px';
        b.textContent = num;
        if (num === correctAnswer) b.dataset.correct = '1';
        b.onclick = () => answer(num === correctAnswer, b);
        c.appendChild(b);
      });
    }

    function renderPeopleWaiting(count) {
      const container = document.getElementById('peopleWaiting');
      container.innerHTML = '';
      if (count === 0) { container.style.display = 'none'; return; }
      container.style.display = 'flex';
      const emojis = ['🧍', '🧍‍♀️', '🧍‍♂️', '👧', '👦', '👵', '👴'];
      for (let i = 0; i < Math.min(count, 6); i++) {
        const person = document.createElement('span');
        person.className = 'person';
        person.textContent = emojis[i % emojis.length];
        container.appendChild(person);
      }
      if (count > 6) {
        const more = document.createElement('span');
        more.className = 'person';
        more.textContent = `+${count - 6}`;
        more.style.fontSize = '1rem';
        more.style.fontWeight = 'bold';
        container.appendChild(more);
      }
    }

    function renderSeats(total, occupied) {
      const container = document.getElementById('busSeats');
      container.innerHTML = '';
      const displayTotal = Math.min(total, 12);
      const displayOccupied = Math.min(occupied, displayTotal);
      for (let i = 0; i < displayTotal; i++) {
        const seat = document.createElement('div');
        seat.className = 'seat';
        if (i < displayOccupied) { seat.classList.add('occupied'); seat.textContent = '🧍'; }
        else { seat.classList.add('available'); seat.textContent = ''; }
        container.appendChild(seat);
      }
      if (total > 12) {
        const more = document.createElement('div');
        more.style.fontSize = '0.8rem';
        more.style.opacity = '0.6';
        more.textContent = `+${total - 12} places`;
        container.appendChild(more);
      }
    }

    function animateBoarding() {
      const seats = document.querySelectorAll('.seat.available');
      let count = 0;
      seats.forEach(seat => {
        if (count < correctAnswer) {
          setTimeout(() => {
            seat.classList.remove('available');
            seat.classList.add('occupied', 'boarding');
            seat.textContent = '🧍';
            if (typeof sndPorte === 'function') sndPorte();
          }, count * 200);
          count++;
        }
      });
    }

    // ── Réponse : retry avec indice, jamais la réponse gratuite (QcmRetry) ──
    function answer(isCorrect, btn) {
      if (locked) return;
      const res = QcmRetry.handle(qcm, isCorrect);
      if (res.outcome === 'ignored') return;

      if (res.outcome === 'correct') {
        locked = true;
        btn.classList.add('ok');
        document.querySelectorAll('#choices .ch').forEach(b => b.style.pointerEvents = 'none');
        correctCount++; streak++;
        if (streak >= 3) confetti();
        sndDing(); showFB(true);
        if (typeof Tracker !== 'undefined') Tracker.logAnswer(true);
        if (currentProblem && (currentProblem.type === 'monter' || currentProblem.type === 'combo')) animateBoarding();
        score += res.points;
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak >= 2 ? `🔥×${streak}` : '';
        setTimeout(nextQuestion, 1700);
      } else if (res.outcome === 'reveal') {
        locked = true;
        btn.classList.add('ko');
        const bs = [...document.querySelectorAll('#choices .ch')];
        const cb = bs.find(b => +b.textContent === correctAnswer);
        if (cb) cb.classList.add('ok');
        bs.forEach(b => b.style.pointerEvents = 'none');
        streak = 0; playErrorSound(); sndBuzz(); showFB(false);
        if (typeof Tracker !== 'undefined') Tracker.logAnswer(false);
        document.getElementById('streak').textContent = '';
        setTimeout(nextQuestion, 1900);
      } else {
        // mauvaise réponse mais on peut réessayer → indice de méthode, jamais la réponse
        btn.classList.add('ko'); btn.disabled = true;
        playErrorSound();
        document.getElementById('hintline').textContent = '💡 ' + (currentProblem.hint || 'Essaie encore !');
      }
    }

    function showEndScreen() {
      if (typeof Tracker !== 'undefined') Tracker.endSession(correctCount, MAX_QUESTIONS);
      playEndSound(correctCount, MAX_QUESTIONS);
      confetti();
      const perfect = correctCount >= MAX_QUESTIONS;
      const app = document.getElementById('app');
      app.innerHTML = `
        <div id="endscreen" data-perfect="${perfect ? 1 : 0}" data-correct="${correctCount}"
             style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;text-align:center;padding:20px;">
          <div style="font-size:5rem;margin-bottom:14px;">${perfect ? '🏆' : '🎉'}</div>
          <h2 style="font-size:2rem;margin-bottom:10px;color:#ffe066;">${perfect ? 'Parfait !' : 'Bien joué !'}</h2>
          <p style="font-size:1.3rem;margin-bottom:8px;">${correctCount} / ${MAX_QUESTIONS} bonnes réponses</p>
          ${perfect
            ? '<p style="font-size:1rem;margin-bottom:20px;color:#9be7c4;">⭐ Tu gagnes une étoile !</p>'
            : '<p style="font-size:0.95rem;margin-bottom:20px;opacity:0.8;">Réussis tout sans te tromper pour gagner une étoile ⭐</p>'}
          <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
            <a href="mj-05.html" style="background:#00c47a;color:#fff;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:900;font-size:1.1rem;">🔄 Rejouer</a>
            <a href="index.html" style="background:#ffffff22;color:#fff;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:900;font-size:1.1rem;">📋 Menu</a>
          </div>
        </div>`;
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/intro-splash.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
