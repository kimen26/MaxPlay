    let score = 0;
    let qcm = null;

    // â”€â”€â”€ Mode â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function setMode(m) {
      mode = m;
      document.getElementById('modeKnown').classList.toggle('active', m === 'known');
      document.getElementById('modeAll').classList.toggle('active', m === 'all');
      startGame();
    }

    // â”€â”€â”€ DÃ©marrer / rejouer â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function startGame() {
      round = 0;
      score = 0;
      document.getElementById('victoryScreen').classList.remove('show');
      pool = shuffle(mode === 'known' ? PAYS.filter(p => p.known) : PAYS);
      nextRound();
    }

    // â”€â”€â”€ Tour suivant â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function nextRound() {
      if (round >= ROUND_COUNT) { showVictory(); return; }
      qcm = QcmRetry.create();
      currentPays = pool[round % pool.length];

      // Score bar
      renderScoreBar();

      // Bus SVG (carrosserie turquoise standard, fenÃªtre sera masquÃ©e par le drapeau)
      const busHTML = busSVG('#cccccc', '#333', '', 300);
      document.getElementById('busSVGContainer').innerHTML = busHTML;

      // Drapeau dans la fenÃªtre du bus
      document.getElementById('flagInBus').innerHTML =
        `<span class="fi fi-${currentPays.code}" style="width:100%;height:100%;background-size:cover;background-position:center;display:block;border-radius:3px"></span>`;

      // Parler automatiquement (aide)
      setTimeout(speakCountry, 600);

      // GÃ©nÃ©rer 4 choix
      renderChoices();
    }

    // â”€â”€â”€ Choix â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderChoices() {
      const usedPool = mode === 'known' ? PAYS.filter(p => p.known) : PAYS;
      const distractors = shuffle(usedPool.filter(p => p.code !== currentPays.code)).slice(0, 3);
      const options = shuffle([currentPays, ...distractors]);

      const container = document.getElementById('choices');
      container.innerHTML = options.map(pays => {
        const isCorrect = pays.code === currentPays.code;
        return `
        <button class="choice-btn" data-code="${pays.code}"${isCorrect ? ' data-correct="1"' : ''} onclick="answer('${pays.code}', this)">
          <div class="choice-name">${pays.nom}</div>
        </button>
      `;
      }).join('');
    }

    // â”€â”€â”€ RÃ©ponse â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function answer(code, btn) {
      if (btn.disabled) return;
      const isCorrect = code === currentPays.code;
      const res = QcmRetry.handle(qcm, isCorrect);
      if (res.outcome === 'ignored') return;
      if ((res.outcome === 'correct' || res.outcome === 'reveal') && typeof Tracker !== 'undefined') Tracker.logAnswer(res.outcome === 'correct');

      if (res.outcome === 'correct') {
        btn.classList.add('correct');
        document.querySelectorAll('.choice-btn').forEach(b => { b.style.pointerEvents = 'none'; });
        if (res.points === 10) score++;
        sndDing();
        showFeedback('ðŸŽ‰');
        round++;
        // ChaÃ®ne TTS : "France" â†’ pause â†’ "Bonjour comment Ã§a va ?" â†’ pause â†’ round suivant.
        // On attend la fin rÃ©elle de la salutation (onEnd) au lieu d'un setTimeout fixe,
        // sinon la phrase est coupÃ©e par le speakCountry() du round suivant.
        let advanced = false;
        const advance = () => { if (advanced) return; advanced = true; nextRound(); };
        const safety  = setTimeout(advance, 7000); // filet si onEnd ne tombe pas
        setTimeout(() => speak(currentPays.nom), 300);
        setTimeout(() => {
          speakGreetingThen(currentPays.code, () => {
            clearTimeout(safety);
            setTimeout(advance, 500); // mini pause aprÃ¨s la salutation
          });
        }, 1400);
      } else if (res.outcome === 'reveal') {
        btn.classList.add('wrong'); btn.disabled = true;
        QcmRetry.revealCorrect(document.getElementById('choices'), 'correct');
        document.querySelectorAll('.choice-btn').forEach(b => { b.style.pointerEvents = 'none'; });
        sndBuzz(); playErrorSound();
        showFeedback('ðŸ’ª');
        setTimeout(() => speak(currentPays.nom), 300);
        round++;
        setTimeout(nextRound, 1800);
      } else {
        btn.classList.add('wrong'); btn.disabled = true;
        sndBuzz(); playErrorSound();
        showFeedback('ðŸ¤”');
        setTimeout(() => speak('Essaie encore !'), 200);
      }
    }

    // â”€â”€â”€ Feedback â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showFeedback(emoji) {
      const el = document.getElementById('feedback');
      document.getElementById('feedbackEmoji').textContent = emoji;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1200);
    }

    // â”€â”€â”€ Score bar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderScoreBar() {
      const bar = document.getElementById('scoreBar');
      let html = '';
      for (let i = 0; i < ROUND_COUNT; i++) {
        const cls = i < round ? (i < score ? 'ok' : 'miss') :
                    i === round ? '' : '';
        html += `<div class="score-pip ${cls}"></div>`;
      }
      html += `<div class="score-label">${score}/${round}</div>`;
      bar.innerHTML = html;
    }

    // â”€â”€â”€ Victoire â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const VICTORY_DATA = [
      // 10/10
      { min:10, max:10, emoji:'ðŸ†', title:'PARFAIT !!!', msg:'10 sur 10 ! Tu es un champion des drapeaux !', confetti:true, sound:'victory' },
      // 8-9
      { min:8,  max:9,  emoji:'ðŸŒŸ', title:'Super Max !', msg:'Presque parfait ! Tu connais super bien les drapeaux !', confetti:false, sound:'bravo' },
      // 6-7
      { min:6,  max:7,  emoji:'ðŸ˜Š', title:'Bien jouÃ© !', msg:'C\'est bien ! Continue comme Ã§a, tu progresses !', confetti:false, sound:'ding' },
      // 4-5
      { min:4,  max:5,  emoji:'ðŸ’ª', title:'Pas mal !', msg:'Tu peux faire encore mieux la prochaine fois !', confetti:false, sound:'ding' },
      // 0-3
      { min:0,  max:3,  emoji:'ðŸšŒ', title:'On rÃ©essaie ?', msg:'C\'est difficile ! Essaie encore, tu vas progresser !', confetti:false, sound:'buzz' },
    ];

    function showVictory() {
      if (typeof Tracker !== 'undefined') Tracker.endSession(score, ROUND_COUNT);
      renderScoreBar();
      const data = VICTORY_DATA.find(d => score >= d.min && score <= d.max);
      document.getElementById('victoryEmoji').textContent = data.emoji;
      document.getElementById('victoryTitle').textContent = data.title;
      document.getElementById('victoryMsg').textContent = data.msg;
      document.getElementById('victoryScore').textContent = `${score} / ${ROUND_COUNT}`;
      document.getElementById('victoryScreen').classList.add('show');
      // Son
      if (data.sound === 'victory') sndVictory();
      else if (data.sound === 'bravo') sndBravo();
      else if (data.sound === 'ding') sndDing();
      else sndBuzz();
      // Confettis drapeaux uniquement au sans-faute
      if (data.confetti) launchFlagConfetti();
    }

    // â”€â”€â”€ Confettis drapeaux â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // 40 drapeaux Ã©moji tombent en arc depuis le haut
    function launchFlagConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.classList.add('show');
      const ctx = canvas.getContext('2d');

      // Emojis drapeaux des pays connus
      const flags = PAYS.filter(p => p.known).map(p => {
        // Convertit code ISO â†’ emoji drapeau (regional indicator symbols)
        const base = 0x1F1E6 - 'a'.charCodeAt(0);
        return String.fromCodePoint(base + p.code.charCodeAt(0), base + p.code.charCodeAt(1));
      });

      const particles = [];
      const COUNT = 40;
      for (let i = 0; i < COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: -40 - Math.random() * 200,
          vy: 2 + Math.random() * 3,
          vx: (Math.random() - 0.5) * 2,
          rot: Math.random() * Math.PI * 2,
          rotV: (Math.random() - 0.5) * 0.1,
          flag: flags[Math.floor(Math.random() * flags.length)],
          size: 28 + Math.random() * 18,
          opacity: 1,
        });
      }

      let frame = 0;
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotV;
          if (frame > 120) p.opacity = Math.max(0, p.opacity - 0.012);
          if (p.y < canvas.height + 60 && p.opacity > 0) alive = true;
          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.font = `${p.size}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.flag, 0, 0);
          ctx.restore();
        }
        frame++;
        if (alive) requestAnimationFrame(tick);
        else { canvas.classList.remove('show'); ctx.clearRect(0,0,canvas.width,canvas.height); }
      }
      requestAnimationFrame(tick);
    }

    // â”€â”€â”€ TTS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function speakCountry() {
      if (!currentPays) return;
      speak(currentPays.nom);
    }

    function speak(text) {
      TTS.speak(text, { rate: 0.85 });
    }

    function speakGreeting(code) {
      const g = GREETINGS[code];
      if (!g) return;
      const [text, lang] = g;
      // queued (pas de cancel) pour enchaÃ®ner aprÃ¨s speakCountry()
      TTS.speak(text, { lang, rate: 0.85, priority: false });
    }

    // Variante qui appelle onEnd Ã  la fin de la salutation (pour enchaÃ®ner le round suivant).
    function speakGreetingThen(code, onEnd) {
      const g = GREETINGS[code];
      if (!g) { onEnd && onEnd(); return; }
      const [text, lang] = g;
      TTS.speak(text, { lang, rate: 0.85, priority: false, onEnd });
    }

    // â”€â”€â”€ Utilitaires â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // â”€â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    startGame();
  </script>
