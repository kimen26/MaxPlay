<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-21 — Peins les bus !</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body { font-family:'Nunito',sans-serif; background:linear-gradient(160deg,#0f1a2e 0%,#1a2338 50%,#0a0f1a 100%); height:100dvh; overflow:hidden; touch-action:none; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:480px; margin:0 auto; }

    .hdr { display:flex; align-items:center; gap:10px; padding:6px 12px; background:rgba(0,0,0,0.25); border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0; }
    .back { color:#fff; text-decoration:none; font-size:1.3rem; font-weight:900; padding:4px 10px; border-radius:8px; background:rgba(255,255,255,0.12); flex-shrink:0; }
    .back:active { background:rgba(255,255,255,0.25); }
    .htitle { color:#fff; font-size:1rem; font-weight:900; flex:1; }

    .progress-zone { display:flex; justify-content:center; align-items:center; gap:6px; padding:5px 16px 3px; flex-shrink:0; }
    .prog-dot { width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.25); transition:all 0.3s; }
    .prog-dot.done { background:#00c47a; border-color:#00c47a; box-shadow:0 0 6px #00c47a88; }
    .prog-dot.current { background:rgba(255,220,80,0.25); border-color:#ffe066; animation:dotPulse 1.2s ease-in-out infinite alternate; }
    @keyframes dotPulse { from{box-shadow:0 0 0px rgba(255,220,80,0.3);} to{box-shadow:0 0 8px rgba(255,220,80,0.8);} }

    /* Bus cible en haut */
    .cible-zone { display:flex; justify-content:center; align-items:center; padding:4px 16px 2px; flex-shrink:0; }
    .cible-bus-wrap { position:relative; display:inline-flex; align-items:center; justify-content:center; transition:all 0.4s; }
    .cible-dot { position:absolute; bottom:-6px; right:-6px; width:26px; height:26px; border-radius:50%; border:3px solid rgba(255,255,255,0.9); box-shadow:0 2px 8px rgba(0,0,0,0.5); }
    .cible-label { color:rgba(255,255,255,0.7); font-size:0.7rem; font-weight:900; text-align:center; letter-spacing:0.5px; margin-top:4px; }

    /* Pots de couleur */
    .pots-zone { display:flex; justify-content:center; gap:8px; padding:6px 12px 4px; flex-shrink:0; }
    .pot { width:72px; height:72px; border-radius:18px; border:none; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:900; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 6px 20px rgba(0,0,0,0.5); transition:transform 0.1s, box-shadow 0.1s; }
    .pot:active { transform:scale(0.88) translateY(3px); box-shadow:0 3px 8px rgba(0,0,0,0.4); }
    .pot-rouge { background:radial-gradient(circle at 35% 30%, #FF5555, #CC0000); color:#fff; }
    .pot-jaune { background:radial-gradient(circle at 35% 30%, #FFE855, #CCAA00); color:#333; }
    .pot-bleu  { background:radial-gradient(circle at 35% 30%, #5577FF, #0033CC); color:#fff; }
    .pot-blanc { background:radial-gradient(circle at 35% 30%, #FFFFFF, #CCCCCC); color:#333; border:2px solid rgba(0,0,0,0.12); }
    .pot-emoji { font-size:1.5rem; line-height:1; }
    .pot-lbl   { font-size:0.65rem; letter-spacing:0.5px; }

    /* Zone centrale : tube + bus preview */
    .central-zone { display:flex; flex-direction:column; align-items:center; gap:6px; padding:4px 0; flex:1; justify-content:center; }

    .tube-col { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .tube-wrap { cursor:pointer; position:relative; border-radius:10px; }
    @keyframes tubeShake {
      0%,100%{transform:rotate(0) scale(1);}
      15%{transform:rotate(-13deg) scale(1.04);}
      35%{transform:rotate(13deg) scale(1.04);}
      55%{transform:rotate(-9deg) scale(1.02);}
      75%{transform:rotate(9deg) scale(1.02);}
    }
    .tube-wrap.shaking { animation:tubeShake 0.55s ease; }
    .tube-result { color:#ffe066; font-size:0.8rem; font-weight:900; min-height:1.2em; text-align:center; }

    .tube-actions { display:flex; gap:8px; }
    .btn-tube { border-radius:14px; font-family:'Nunito',sans-serif; font-weight:900; font-size:0.8rem; padding:8px 14px; cursor:pointer; color:#fff; }
    .btn-tube:active { opacity:0.72; transform:scale(0.91); }
    .btn-vider { background:rgba(255,255,255,0.09); border:2px solid rgba(255,255,255,0.22); }
    .btn-mixer { background:rgba(80,220,255,0.2); border:2px solid rgba(80,220,255,0.5); }

    /* Bus preview sous le tube */
    .bus-preview { min-height:60px; display:flex; align-items:center; justify-content:center; }
    @keyframes busPop { 0%{transform:scale(0.6);opacity:0;} 60%{transform:scale(1.1);} 100%{transform:scale(1);opacity:1;} }
    .bus-preview.pop { animation:busPop 0.4s ease; }

    .hint-row { display:flex; justify-content:center; padding:4px 0; flex-shrink:0; }
    .btn-hint { background:rgba(255,220,80,0.15); border:2px solid rgba(255,220,80,0.5); color:#ffe066; border-radius:20px; font-family:'Nunito',sans-serif; font-weight:900; font-size:0.8rem; padding:5px 16px; cursor:pointer; animation:hintPulse 1.5s ease-in-out infinite alternate; }
    @keyframes hintPulse { from{box-shadow:0 0 0px rgba(255,220,80,0.3);} to{box-shadow:0 0 10px rgba(255,220,80,0.7);} }

    /* Overlays */
    .brun-overlay { position:fixed; inset:0; background:rgba(60,30,0,0.93); display:flex; align-items:center; justify-content:center; z-index:99; opacity:0; visibility:hidden; transition:all 0.3s; }
    .brun-overlay.show { opacity:1; visibility:visible; }
    .brun-content { text-align:center; padding:20px; }
    .brun-emoji { font-size:4.5rem; display:block; animation:wobble 0.55s infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-12deg) scale(1);} 50%{transform:rotate(12deg) scale(1.08);} }
    .brun-text { color:#fff; font-size:1.3rem; font-weight:900; margin-top:10px; line-height:1.5; }
    .btn-laver { background:rgba(255,255,255,0.2); color:#fff; border:2px solid rgba(255,255,255,0.4); border-radius:22px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1rem; padding:10px 28px; cursor:pointer; margin-top:16px; display:inline-block; }
    .btn-laver:active { background:rgba(255,255,255,0.35); }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; visibility:hidden; transition:all 0.4s; }
    .overlay.show { opacity:1; visibility:visible; }
    .ov-box { background:linear-gradient(135deg,#1a1a2e,#16213e); border-radius:24px; border:2px solid rgba(255,255,255,0.1); padding:28px 24px; text-align:center; max-width:320px; width:90%; }
    .ov-emoji { font-size:3rem; margin-bottom:8px; }
    .ov-title { font-size:1.6rem; color:#ffe066; font-weight:900; margin-bottom:8px; }
    .ov-text  { color:#fff; font-size:1rem; margin-bottom:20px; line-height:1.4; }
    .ov-btn   { background:linear-gradient(135deg,#00c47a,#00a86b); color:#fff; border:none; border-radius:20px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.1rem; padding:12px 28px; cursor:pointer; }
    .ov-btn:active { opacity:0.8; }
  </style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <a href="index.html" class="back">&#8592;</a>
    <span class="htitle">🎨 Peins les bus !</span>
  </div>

  <div class="progress-zone" id="progress"></div>

  <div class="cible-zone">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div class="cible-bus-wrap" id="cible-bus-wrap"><!-- injecté --></div>
      <div class="cible-label" id="cible-label"></div>
    </div>
  </div>

  <div class="pots-zone">
    <button class="pot pot-rouge" onclick="addCouleur('r')">
      <span class="pot-emoji">&#128308;</span>
      <span class="pot-lbl">ROUGE</span>
    </button>
    <button class="pot pot-jaune" onclick="addCouleur('j')">
      <span class="pot-emoji">&#128993;</span>
      <span class="pot-lbl">JAUNE</span>
    </button>
    <button class="pot pot-bleu" onclick="addCouleur('b')">
      <span class="pot-emoji">&#128309;</span>
      <span class="pot-lbl">BLEU</span>
    </button>
    <button class="pot pot-blanc" onclick="addCouleur('w')">
      <span class="pot-emoji">&#11036;</span>
      <span class="pot-lbl">BLANC</span>
    </button>
  </div>

  <div class="central-zone">
    <div class="tube-col">
      <div class="tube-wrap" id="tube-wrap-0"></div>
      <div class="tube-result" id="tube-result-0"></div>
      <div class="tube-actions">
        <button class="btn-tube btn-vider" onclick="viderTube()">&#128703; Vider</button>
        <button class="btn-tube btn-mixer" onclick="mixerTube()">&#128256; Mixer !</button>
      </div>
    </div>
    <div class="bus-preview" id="bus-preview"></div>
  </div>

  <div class="hint-row">
    <button class="btn-hint" id="btn-hint" onclick="showHint()">&#128161; Indice</button>
  </div>

</div>

<div class="brun-overlay" id="brun-overlay">
  <div class="brun-content">
    <span class="brun-emoji">&#128169;</span>
    <div class="brun-text">Prrrout !<br>C'est du marron !<br>Lave le tube !</div>
    <button class="btn-laver" onclick="viderTube()">&#128703; Laver !</button>
  </div>
</div>

<div class="overlay" id="hint-overlay" style="z-index:102;">
  <div class="ov-box">
    <div class="ov-emoji">&#128161;</div>
    <div class="ov-title" style="font-size:1.2rem;">Voil&#224; le secret !</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;">
      <div id="hint-cible-cercle" style="width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,0.85);flex-shrink:0;"></div>
      <div style="color:#fff;font-size:1rem;font-weight:900;" id="hint-cible-label"></div>
    </div>
    <div class="ov-text" id="hint-text" style="font-size:1.3rem;letter-spacing:2px;"></div>
    <button class="ov-btn" onclick="document.getElementById('hint-overlay').classList.remove('show')">OK !</button>
  </div>
</div>

<div class="overlay" id="fin-overlay" style="z-index:101;">
  <div class="ov-box">
    <div class="ov-emoji">&#128652;</div>
    <div class="ov-title">Tous les bus sont peints !</div>
    <div class="ov-text">Tu es un super peintre !</div>
    <button class="ov-btn" onclick="resetPartie()">&#127912; Rejouer !</button>
  </div>
</div>

<script src="js/bus-svg.js"></script>
<script src="js/data.js"></script>
<script src="js/sounds.js"></script>
<script>
// ── DÉFIS (recettes proportionnelles r/j/b/w + couleur IDFM exacte) ──
const DEFIS = [
  { r:1, j:0, b:0, w:0, hex:'#E2231A', label:'rouge',       num:'RER A', textColor:'#fff'  },
  { r:0, j:1, b:0, w:0, hex:'#FFCD00', label:'jaune',       num:'M1',    textColor:'#333'  },
  { r:0, j:0, b:1, w:0, hex:'#0064B1', label:'bleu',        num:'162',   textColor:'#fff'  },
  { r:0, j:1, b:1, w:0, hex:'#008C59', label:'vert',        num:'172',   textColor:'#fff'  },
  { r:1, j:0, b:1, w:0, hex:'#652C90', label:'violet',      num:'132',   textColor:'#fff'  },
  { r:1, j:0, b:0, w:1, hex:'#FF82B4', label:'rose',        num:'47',    textColor:'#333'  },
  { r:0, j:1, b:3, w:0, hex:'#75CE89', label:'vert clair',  num:'380',   textColor:'#333'  },
  { r:0, j:0, b:3, w:1, hex:'#4FA3DC', label:'bleu ciel',   num:'RER B', textColor:'#fff'  },
  { r:1, j:1, b:0, w:0, hex:'#F58443', label:'orange',      num:'185',   textColor:'#333'  },
  { r:1, j:3, b:0, w:0, hex:'#DCAC27', label:'or',          num:'184',   textColor:'#333'  },
  { r:1, j:0, b:0, w:2, hex:'#FA9ABA', label:'rose pâle',   num:'M7',    textColor:'#333'  },
  { r:1, j:0, b:1, w:2, hex:'#C9A2CD', label:'lavande',     num:'286',   textColor:'#333'  },
  { r:2, j:2, b:1, w:0, hex:'#8D653A', label:'brun',        num:'131',   textColor:'#fff'  },
];

const BASE_RGB = { r:[232,25,44], j:[255,205,0], b:[0,60,166], w:[238,238,238] };
const QCOL     = { r:'#E8192C', j:'#FFD700', b:'#3344CC', w:'#EEEEEE' };

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// Trouve le défi dont les proportions matchent le mieux le tube
function findBestDefi(t) {
  const tot = t.r+t.j+t.b+t.w;
  if (tot===0) return null;
  let best=null, bestDist=Infinity;
  for (const d of DEFIS) {
    const dTot = d.r+d.j+d.b+d.w;
    let dist=0;
    for (const k of ['r','j','b','w']) dist += Math.abs(t[k]/tot - d[k]/dTot);
    if (dist<bestDist) { bestDist=dist; best=d; }
  }
  return { defi:best, dist:bestDist };
}

function isBrun(t) {
  const tot=t.r+t.j+t.b+t.w;
  if (tot===0) return false;
  return t.r/tot>0.18 && t.j/tot>0.15 && t.b/tot>0.15;
}

// ── ÉTAT ─────────────────────────────────────────────────────────
function newTube() { return {r:0,j:0,b:0,w:0,doses:[],mixed:null}; }
let tube     = newTube();
let defiIdx  = 0;
let solved   = 0;
let victoire = false;
let brunShown= false;
let order    = shuffle(DEFIS.map((_,i)=>i));
let defi     = DEFIS[order[0]];

// ── TUBE SVG ─────────────────────────────────────────────────────
function renderTubeSVG(t) {
  const SW=64, SH=150, RIMH=14, BOT=SH, RX=12, FILL_H=BOT-RIMH;
  const path=`M0,${RIMH} L0,${BOT-RX} Q0,${BOT} ${RX},${BOT} L${SW-RX},${BOT} Q${SW},${BOT} ${SW},${BOT-RX} L${SW},${RIMH} Z`;
  let layers='';
  if (t.mixed) {
    const bgHex = t.mixed==='BRUN' ? '#6B4226' : t.mixed.hex;
    const tot=t.r+t.j+t.b+t.w;
    const fH=Math.max(Math.min(tot/8,1)*FILL_H, 28);
    const fY=(BOT-fH).toFixed(1);
    layers=`<rect x="0" y="${fY}" width="${SW}" height="${(fH+1).toFixed(1)}" fill="${bgHex}"/>`;
  } else if (t.doses.length>0) {
    const vis=t.doses.slice(-8);
    const dH=FILL_H/Math.max(vis.length,4);
    vis.forEach((q,i)=>{
      const qY=(BOT-dH*(i+1)).toFixed(1);
      layers+=`<rect x="0" y="${qY}" width="${SW}" height="${(dH+1).toFixed(1)}" fill="${QCOL[q]}"/>`;
    });
  }
  const emptyHint = t.doses.length===0 && !t.mixed
    ? `<text x="${SW/2}" y="${RIMH+FILL_H/2+5}" text-anchor="middle" fill="rgba(255,255,255,0.18)" font-size="10" font-family="Nunito">vide</text>` : '';
  return `<svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">
  <defs><clipPath id="tc"><path d="${path}"/></clipPath></defs>
  <path d="${path}" fill="rgba(150,210,255,0.08)" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
  <g clip-path="url(#tc)">${layers}</g>
  <rect x="5" y="${RIMH+5}" width="6" height="${FILL_H-20}" rx="3" fill="rgba(255,255,255,0.16)" clip-path="url(#tc)"/>
  <rect x="2" y="0" width="${SW-4}" height="${RIMH}" rx="5" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  ${emptyHint}
</svg>`;
}

function renderTube() {
  const wrap = document.getElementById('tube-wrap-0');
  wrap.innerHTML = renderTubeSVG(tube);
  const res = document.getElementById('tube-result-0');
  if (tube.mixed && tube.mixed !== 'BRUN') {
    res.textContent = tube.mixed.label;
    res.style.color = '#ffe066';
  } else if (tube.mixed === 'BRUN') {
    res.innerHTML = '💩 marron';
    res.style.color = '#cc8844';
  } else {
    res.textContent = '';
  }
}

function renderCible(hex) {
  // hex = null → bus blanc (défi en cours), hex → bus coloré (victoire)
  const busHex = hex || '#FFFFFF';
  const busText = hex ? defi.textColor : '#333';
  const wrap = document.getElementById('cible-bus-wrap');
  wrap.innerHTML = `${busSVG(busHex, busText, defi.num, 170)}<div class="cible-dot" style="background:${defi.hex};${hex?'box-shadow:0 0 14px '+defi.hex+';':''}"></div>`;
  document.getElementById('cible-label').textContent = hex
    ? `✓ ${defi.label} !`
    : `Bus ${defi.num} — peins-le en ${defi.label} !`;
  document.getElementById('cible-label').style.color = hex ? '#00c47a' : 'rgba(255,255,255,0.7)';
}

function renderBusPreview(hex) {
  const zone = document.getElementById('bus-preview');
  if (!hex) { zone.innerHTML=''; zone.classList.remove('pop'); return; }
  zone.classList.remove('pop');
  zone.offsetWidth;
  zone.innerHTML = busSVG(hex, hex === '#FFCD00' ? '#333' : '#fff', defi.num, 130);
  zone.classList.add('pop');
}

function renderProgress() {
  let html='';
  for (let i=0;i<DEFIS.length;i++) {
    const cls=i<solved?'done':i===solved?'current':'';
    html+=`<div class="prog-dot ${cls}"></div>`;
  }
  document.getElementById('progress').innerHTML=html;
}

// ── ACTIONS ───────────────────────────────────────────────────────
function addCouleur(type) {
  if (victoire) return;
  tube[type]++;
  tube.doses.push(type);
  tube.mixed = null; // reset le mix si on rajoute
  renderTube();
  renderBusPreview(null);
}

let mixerLocked = false;
function mixerTube() {
  if (victoire || mixerLocked) return;
  const tot = tube.r+tube.j+tube.b+tube.w;
  if (tot===0) return;
  mixerLocked = true;
  playMix();
  const wrap = document.getElementById('tube-wrap-0');
  wrap.classList.remove('shaking');
  wrap.offsetWidth;
  wrap.classList.add('shaking');
  const defiBrun = defi.label==='brun';
  setTimeout(() => {
    mixerLocked = false;
    wrap.classList.remove('shaking');
    if (isBrun(tube) && !defiBrun) {
      tube.mixed = 'BRUN';
      renderTube();
      renderBusPreview(null);
      if (!brunShown) { brunShown=true; document.getElementById('brun-overlay').classList.add('show'); playBrun(); }
      return;
    }
    // Cherche le défi dont les proportions matchent le mieux
    const { defi:matched, dist } = findBestDefi(tube);
    const hex = dist < 0.5 ? matched.hex : '#888888'; // couleur du défi matché ou gris si rien ne colle
    const label = dist < 0.5 ? matched.label : '?';
    tube.mixed = { hex, label };
    renderTube();
    renderBusPreview(hex);
    // Victoire si le défi matché = défi en cours
    if (matched === defi && dist < 0.5 && !victoire) {
      victoire = true;
      setTimeout(showVictoire, 500);
    }
  }, 500);
}

function viderTube() {
  tube = newTube();
  brunShown = false;
  document.getElementById('brun-overlay').classList.remove('show');
  renderTube();
  renderBusPreview(null);
}

// ── VICTOIRE ──────────────────────────────────────────────────────
function showVictoire() {
  solved++;
  renderProgress();
  playKlaxon();
  renderCible(defi.hex); // colorie le bus en haut
  // auto-next après 2s
  setTimeout(() => {
    defiIdx++;
    if (defiIdx >= DEFIS.length) { document.getElementById('fin-overlay').classList.add('show'); return; }
    defi = DEFIS[order[defiIdx]];
    tube = newTube();
    victoire = false; brunShown = false; mixerLocked = false;
    document.getElementById('brun-overlay').classList.remove('show');
    renderTube();
    renderBusPreview(null);
    renderCible(null);
    renderProgress();
  }, 2200);
}

function resetPartie() {
  document.getElementById('fin-overlay').classList.remove('show');
  solved=0; defiIdx=0;
  order=shuffle(DEFIS.map((_,i)=>i));
  defi=DEFIS[order[0]];
  tube=newTube(); victoire=false; brunShown=false; mixerLocked=false;
  document.getElementById('brun-overlay').classList.remove('show');
  renderTube();
  renderBusPreview(null);
  renderCible(null);
  renderProgress();
}

function showHint() {
  const parts=[];
  if(defi.r>0)parts.push(`${defi.r} 🔴`);
  if(defi.j>0)parts.push(`${defi.j} 🟡`);
  if(defi.b>0)parts.push(`${defi.b} 🔵`);
  if(defi.w>0)parts.push(`${defi.w} ⬜`);
  document.getElementById('hint-cible-cercle').style.background=defi.hex;
  document.getElementById('hint-cible-label').textContent=`Bus ${defi.num} — ${defi.label}`;
  document.getElementById('hint-text').textContent=parts.join(' + ');
  document.getElementById('hint-overlay').classList.add('show');
}

// ── SHAKE ─────────────────────────────────────────────────────────
let lastShakeTime=0, shakeAttached=false;
function initShake() {
  if (shakeAttached || !window.DeviceMotionEvent) return;
  shakeAttached=true;
  window.addEventListener('devicemotion', e => {
    const a=e.acceleration; if (!a) return;
    const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
    if (m>25 && Date.now()-lastShakeTime>800) { lastShakeTime=Date.now(); mixerTube(); }
  }, true);
}

// ── SONS ──────────────────────────────────────────────────────────
function playKlaxon() {
  try {
    const ac=new AudioContext();
    [523,659,784,1047].forEach((freq,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.value=freq; o.type='triangle';
      const t=ac.currentTime+i*0.1;
      g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.start(t); o.stop(t+0.15);
    });
  } catch(e){}
}
function playBrun() {
  try {
    const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination); o.type='sawtooth';
    o.frequency.setValueAtTime(180,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(35,ac.currentTime+0.55);
    g.gain.setValueAtTime(0.4,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);
    o.start(); o.stop(ac.currentTime+0.6);
  } catch(e){}
}
function playMix() {
  try {
    const ac=new AudioContext();
    [400,600,350,700,300].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination); o.type='sine'; o.frequency.value=f;
      const t=ac.currentTime+i*0.06;
      g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.start(t); o.stop(t+0.1);
    });
  } catch(e){}
}

// ── INIT ──────────────────────────────────────────────────────────
renderTube();
renderBusPreview(null);
renderCible(null);
renderProgress();
initShake();
