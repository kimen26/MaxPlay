<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-21 — Peins les bus !</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body { font-family:'Nunito',sans-serif; background:linear-gradient(160deg,#0f1a2e 0%,#1a2338 50%,#0a0f1a 100%); height:100dvh; overflow:hidden; touch-action:none; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:600px; margin:0 auto; }

    .hdr { display:flex; align-items:center; padding:10px 16px; background:rgba(255,255,255,0.08); border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
    .back { color:#fff; text-decoration:none; font-size:1.5rem; padding:4px 10px; border-radius:8px; }
    .back:active { background:rgba(255,255,255,0.2); }
    .htitle { color:#fff; font-size:1.2rem; font-weight:900; }

    .cible-zone { text-align:center; padding:10px 16px 6px; flex-shrink:0; }
    .cible-text { color:#fff; font-size:1rem; font-weight:700; margin-bottom:8px; line-height:1.3; }
    .cible-row { display:flex; align-items:center; justify-content:center; gap:12px; }
    .cible-cercle { width:54px; height:54px; border-radius:50%; border:4px solid rgba(255,255,255,0.85); box-shadow:0 0 18px rgba(255,255,255,0.25); transition:background 0.3s; flex-shrink:0; }
    .cible-num { color:#ffe066; font-size:1.1rem; font-weight:900; }
    .cible-lbl { color:rgba(255,255,255,0.7); font-size:0.85rem; }

    .pots-zone { display:flex; justify-content:center; gap:14px; padding:10px 16px 6px; flex-shrink:0; }
    .pot { width:100px; height:108px; border-radius:22px; border:none; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:900; font-size:0.95rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 8px 24px rgba(0,0,0,0.5); transition:transform 0.1s, box-shadow 0.1s; position:relative; overflow:hidden; }
    .pot:active { transform:scale(0.92) translateY(2px); box-shadow:0 4px 10px rgba(0,0,0,0.4); }
    .pot-rouge { background:radial-gradient(circle at 35% 30%, #FF5555, #CC0000); color:#fff; }
    .pot-jaune { background:radial-gradient(circle at 35% 30%, #FFE855, #CCAA00); color:#333; }
    .pot-bleu  { background:radial-gradient(circle at 35% 30%, #5577FF, #0033CC); color:#fff; }
    .pot-emoji { font-size:2rem; line-height:1; }
    .pot-lbl   { font-size:0.8rem; letter-spacing:0.5px; }
    .pot-plus  { position:absolute; top:7px; right:11px; font-size:1.1rem; opacity:0.85; }

    .tube-zone { display:flex; align-items:center; justify-content:center; gap:8px; padding:6px 16px; flex-shrink:0; min-height:56px; }
    .tube-lbl { color:rgba(255,255,255,0.45); font-size:0.8rem; flex-shrink:0; }
    .quarts-row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; flex:1; }
    .quart { width:38px; height:38px; border-radius:10px; border:3px solid rgba(255,255,255,0.5); flex-shrink:0; animation:popIn 0.18s ease; }
    @keyframes popIn { from{transform:scale(0) rotate(-20deg);opacity:0;} to{transform:scale(1) rotate(0);opacity:1;} }
    .quarts-vide { color:rgba(255,255,255,0.25); font-size:0.85rem; }

    .bus-zone { flex:1; display:flex; align-items:center; justify-content:center; padding:4px 16px; min-height:90px; }

    .progress-zone { display:flex; justify-content:center; gap:5px; padding:4px 16px 2px; flex-shrink:0; }
    .prog-dot { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.08); transition:all 0.3s; }
    .prog-dot.done { background:#00c47a; border-color:#00c47a; box-shadow:0 0 6px #00c47a88; }
    .prog-dot.current { border-color:#ffe066; box-shadow:0 0 6px #ffe06688; }

    .ctrl-zone { padding:10px 16px 14px; display:flex; justify-content:center; flex-shrink:0; }
    .btn-vider { background:rgba(255,255,255,0.12); color:#fff; border:2px solid rgba(255,255,255,0.25); border-radius:26px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.05rem; padding:11px 34px; cursor:pointer; }
    .btn-vider:active { background:rgba(255,255,255,0.22); }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; visibility:hidden; transition:all 0.4s; }
    .overlay.show { opacity:1; visibility:visible; }
    .ov-box { background:linear-gradient(135deg,#1a1a2e,#16213e); border-radius:24px; border:2px solid rgba(255,255,255,0.1); padding:28px 24px; text-align:center; max-width:320px; width:90%; }
    .ov-emoji { font-size:3rem; margin-bottom:8px; }
    .ov-title { font-size:1.6rem; color:#ffe066; font-weight:900; margin-bottom:8px; }
    .ov-text  { color:#fff; font-size:1rem; margin-bottom:20px; line-height:1.4; }
    .ov-btn   { background:linear-gradient(135deg,#00c47a,#00a86b); color:#fff; border:none; border-radius:20px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.1rem; padding:12px 28px; cursor:pointer; }
    .ov-btn:active { opacity:0.8; }

    .brun-overlay { position:fixed; inset:0; background:rgba(60,30,0,0.93); display:flex; align-items:center; justify-content:center; z-index:99; opacity:0; visibility:hidden; transition:all 0.3s; }
    .brun-overlay.show { opacity:1; visibility:visible; }
    .brun-content { text-align:center; padding:20px; }
    .brun-emoji { font-size:4.5rem; display:block; animation:wobble 0.55s infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-12deg) scale(1);} 50%{transform:rotate(12deg) scale(1.08);} }
    .brun-text { color:#fff; font-size:1.3rem; font-weight:900; margin-top:10px; line-height:1.5; }
    .btn-laver { background:rgba(255,255,255,0.2); color:#fff; border:2px solid rgba(255,255,255,0.4); border-radius:22px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1rem; padding:10px 28px; cursor:pointer; margin-top:16px; display:inline-block; }
    .btn-laver:active { background:rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🎨 Peins les bus !</span>
    </div>

    <div class="cible-zone">
      <div class="cible-text" id="cible-text">Aide le bus à retrouver sa couleur !</div>
      <div class="cible-row">
        <div id="cible-cercle" class="cible-cercle"></div>
        <div>
          <div class="cible-num" id="cible-num"></div>
          <div class="cible-lbl" id="cible-lbl"></div>
        </div>
      </div>
    </div>

    <div class="progress-zone" id="progress"></div>

    <div class="pots-zone">
      <button class="pot pot-rouge" onclick="addQuart('r')">
        <span class="pot-plus">+</span>
        <span class="pot-emoji">🔴</span>
        <span class="pot-lbl">ROUGE</span>
      </button>
      <button class="pot pot-jaune" onclick="addQuart('j')">
        <span class="pot-plus">+</span>
        <span class="pot-emoji">🟡</span>
        <span class="pot-lbl">JAUNE</span>
      </button>
      <button class="pot pot-bleu" onclick="addQuart('b')">
        <span class="pot-plus">+</span>
        <span class="pot-emoji">🔵</span>
        <span class="pot-lbl">BLEU</span>
      </button>
    </div>

    <div class="tube-zone">
      <span class="tube-lbl">Mix :</span>
      <div class="quarts-row" id="quarts">
        <span class="quarts-vide">Tape sur un pot !</span>
      </div>
    </div>

    <div class="bus-zone" id="bus-zone"></div>

    <div class="ctrl-zone">
      <button class="btn-vider" onclick="vider()">🚿 Vider</button>
    </div>
  </div>

  <!-- Overlay victoire -->
  <div class="overlay" id="overlay">
    <div class="ov-box">
      <div class="ov-emoji">🎉</div>
      <div class="ov-title" id="ov-title">Bravo !</div>
      <div class="ov-text" id="ov-text">Le bus est peint !</div>
      <button class="ov-btn" onclick="nextDefi()">Suivant →</button>
    </div>
  </div>

  <!-- Overlay brun -->
  <div class="brun-overlay" id="brun-overlay">
    <div class="brun-content">
      <span class="brun-emoji">💩</span>
      <div class="brun-text">Prrrout ! 💩<br>C'est du marron !<br>Lave le pinceau !</div>
      <button class="btn-laver" onclick="vider()">🚿 Laver !</button>
    </div>
  </div>

  <!-- Overlay fin de partie -->
  <div class="overlay" id="fin-overlay" style="z-index:101;">
    <div class="ov-box">
      <div class="ov-emoji">🚌</div>
      <div class="ov-title">Tous les bus sont peints !</div>
      <div class="ov-text">Tu es un super peintre !</div>
      <button class="ov-btn" onclick="resetPartie()">🎨 Rejouer !</button>
    </div>
  </div>

  <script src="js/bus-svg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sounds.js"></script>
  <script>
  const DEFIS = [
    { r:4, j:0, b:0, hex:'#E8192C', label:'rouge',     num:'RER A', textColor:'#fff' },
    { r:0, j:4, b:0, hex:'#FFCD00', label:'jaune',     num:'1',     textColor:'#333' },
    { r:0, j:0, b:4, hex:'#003CA6', label:'bleu',      num:'2',     textColor:'#fff' },
    { r:2, j:2, b:0, hex:'#FF7E2E', label:'orange',    num:'5',     textColor:'#fff' },
    { r:0, j:2, b:2, hex:'#007852', label:'vert',      num:'12',    textColor:'#fff' },
    { r:2, j:0, b:2, hex:'#62259D', label:'violet',    num:'14',    textColor:'#fff' },
    { r:0, j:1, b:3, hex:'#00AACC', label:'turquoise', num:'380',   textColor:'#fff' },
    { r:1, j:3, b:0, hex:'#FFAA00', label:'ambre',     num:'10',    textColor:'#333' },
  ];

  const TABLE = [
    { pr:1,    pj:0,    pb:0,    hex:'#E8192C' },
    { pr:0,    pj:1,    pb:0,    hex:'#FFCD00' },
    { pr:0,    pj:0,    pb:1,    hex:'#003CA6' },
    { pr:0.5,  pj:0.5,  pb:0,    hex:'#FF7E2E' },
    { pr:0,    pj:0.5,  pb:0.5,  hex:'#007852' },
    { pr:0.5,  pj:0,    pb:0.5,  hex:'#62259D' },
    { pr:0.75, pj:0.25, pb:0,    hex:'#FF5500' },
    { pr:0.25, pj:0.75, pb:0,    hex:'#FFAA00' },
    { pr:0.25, pj:0,    pb:0.75, hex:'#4040C0' },
    { pr:0,    pj:0.25, pb:0.75, hex:'#00AACC' },
    { pr:0.75, pj:0,    pb:0.25, hex:'#CC2266' },
    { pr:0,    pj:0.75, pb:0.25, hex:'#44AA44' },
  ];

  const QCOL  = { r:'#E8192C', j:'#FFCD00', b:'#003CA6' };
  const QBORD = { r:'rgba(255,255,255,0.5)', j:'rgba(0,0,0,0.25)', b:'rgba(255,255,255,0.5)' };

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let counts    = {r:0, j:0, b:0};
  let quarts    = [];
  let defiIdx   = 0;
  let solved    = 0;
  let victoire  = false;
  let brunShown = false;
  let order     = shuffle(DEFIS.map((_, i) => i));
  let defi      = DEFIS[order[0]];

  function calcMelange() {
    const tot = counts.r + counts.j + counts.b;
    if (tot === 0) return null;
    const pr = counts.r / tot, pj = counts.j / tot, pb = counts.b / tot;
    if (pr > 0.18 && pj > 0.15 && pb > 0.15) return 'BRUN';
    let best = TABLE[0], bestD = Infinity;
    for (const c of TABLE) {
      const d = Math.hypot(pr - c.pr, pj - c.pj, pb - c.pb);
      if (d < bestD) { bestD = d; best = c; }
    }
    return best.hex;
  }

  function isVictoire() {
    const tot = counts.r + counts.j + counts.b;
    if (tot === 0) return false;
    const pr = counts.r / tot, pj = counts.j / tot, pb = counts.b / tot;
    return Math.hypot(pr - defi.r/4, pj - defi.j/4, pb - defi.b/4) < 0.18;
  }

  function renderBus(couleur) {
    const el = document.getElementById('bus-zone');
    const isBrun = couleur === 'BRUN';
    const c  = isBrun ? '#6B4226' : (couleur || '#AAAAAA');
    const tc = couleur && !isBrun ? defi.textColor : '#555';
    el.innerHTML = busSVG(c, tc, defi.num, Math.min(280, window.innerWidth - 40));
  }

  function renderQuarts() {
    const el = document.getElementById('quarts');
    if (quarts.length === 0) {
      el.innerHTML = '<span class="quarts-vide">Tape sur un pot !</span>';
      return;
    }
    el.innerHTML = quarts.map(q =>
      `<div class="quart" style="background:${QCOL[q]};border-color:${QBORD[q]};"></div>`
    ).join('');
  }

  function renderProgress() {
    document.getElementById('progress').innerHTML = DEFIS.map((_, i) => {
      let cls = 'prog-dot';
      if (i < solved)        cls += ' done';
      else if (i === solved) cls += ' current';
      return `<div class="${cls}"></div>`;
    }).join('');
  }

  function renderAll() {
    const m = calcMelange();
    renderBus(m);
    renderQuarts();
    const isBrun = m === 'BRUN';
    if (isBrun && !brunShown) {
      brunShown = true;
      document.getElementById('brun-overlay').classList.add('show');
      playBrun();
    } else if (!isBrun) {
      brunShown = false;
      document.getElementById('brun-overlay').classList.remove('show');
    }
    if (!isBrun && !victoire && isVictoire()) {
      victoire = true;
      setTimeout(showVictoire, 350);
    }
  }

  function addQuart(type) {
    if (victoire) return;
    counts[type]++;
    quarts.push(type);
    if (quarts.length > 8) quarts.shift();
    renderAll();
  }

  function vider() {
    counts    = {r:0, j:0, b:0};
    quarts    = [];
    victoire  = false;
    brunShown = false;
    document.getElementById('brun-overlay').classList.remove('show');
    renderBus(null);
    renderQuarts();
  }

  function showVictoire() {
    solved++;
    renderProgress();
    renderBus(calcMelange());
    playKlaxon();
    document.getElementById('ov-title').textContent = 'Super ! 🎉';
    document.getElementById('ov-text').textContent  = `Le bus ${defi.num} est ${defi.label} !`;
    document.getElementById('overlay').classList.add('show');
  }

  function nextDefi() {
    document.getElementById('overlay').classList.remove('show');
    defiIdx++;
    if (defiIdx >= DEFIS.length) {
      document.getElementById('fin-overlay').classList.add('show');
      return;
    }
    defi = DEFIS[order[defiIdx]];
    vider();
    initDefi();
  }

  function resetPartie() {
    document.getElementById('fin-overlay').classList.remove('show');
    solved   = 0;
    defiIdx  = 0;
    order    = shuffle(DEFIS.map((_, i) => i));
    defi     = DEFIS[order[0]];
    vider();
    initDefi();
  }

  function initDefi() {
    document.getElementById('cible-text').textContent = `Aide le bus ${defi.num} à retrouver sa couleur !`;
    document.getElementById('cible-cercle').style.background = defi.hex;
    document.getElementById('cible-num').textContent  = `Ligne ${defi.num}`;
    document.getElementById('cible-lbl').textContent  = defi.label;
    renderBus(null);
    renderQuarts();
    renderProgress();
  }

  function playKlaxon() {
    try {
      const ac = new AudioContext();
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.frequency.value = freq; o.type = 'triangle';
        const t = ac.currentTime + i * 0.1;
        g.gain.setValueAtTime(0.28, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.start(t); o.stop(t + 0.15);
      });
    } catch(e) {}
  }

  function playBrun() {
    try {
      const ac = new AudioContext();
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ac.currentTime + 0.55);
      g.gain.setValueAtTime(0.4, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
      o.start(); o.stop(ac.currentTime + 0.6);
    } catch(e) {}
  }

  initDefi();
  </script>
</body>
</html>
