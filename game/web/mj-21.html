<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-21 — Peins les bus !</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body { font-family:'Nunito',sans-serif; background:linear-gradient(160deg,#0f1a2e 0%,#1a2338 50%,#0a0f1a 100%); height:100dvh; overflow:hidden; touch-action:none; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:600px; margin:0 auto; }

    /* Header */
    .hdr { display:flex; align-items:center; padding:8px 16px; background:rgba(255,255,255,0.08); border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
    .back { color:#fff; text-decoration:none; font-size:1.5rem; padding:4px 10px; border-radius:8px; }
    .back:active { background:rgba(255,255,255,0.2); }
    .htitle { color:#fff; font-size:1.2rem; font-weight:900; }

    /* Progress */
    .progress-zone { display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px 16px 3px; flex-shrink:0; }
    .prog-row { display:flex; gap:8px; align-items:flex-end; }
    .prog-tube-wrap { display:flex; align-items:center; justify-content:center; }
    .prog-tube-wrap.current { animation:progPulse 1s ease-in-out infinite alternate; }
    @keyframes progPulse { from { filter:drop-shadow(0 0 0px #ffe066); } to { filter:drop-shadow(0 0 5px #ffe066cc); } }

    /* Pots */
    .pots-zone { display:flex; justify-content:center; gap:14px; padding:8px 16px 6px; flex-shrink:0; }
    .pot { width:96px; height:96px; border-radius:22px; border:none; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:900; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 8px 24px rgba(0,0,0,0.5); transition:transform 0.1s, box-shadow 0.1s; }
    .pot:active { transform:scale(0.92) translateY(2px); box-shadow:0 4px 10px rgba(0,0,0,0.4); }
    .pot-rouge { background:radial-gradient(circle at 35% 30%, #FF5555, #CC0000); color:#fff; }
    .pot-jaune { background:radial-gradient(circle at 35% 30%, #FFE855, #CCAA00); color:#333; }
    .pot-bleu  { background:radial-gradient(circle at 35% 30%, #5577FF, #0033CC); color:#fff; }
    .pot-emoji { font-size:2rem; line-height:1; }
    .pot-lbl   { font-size:0.8rem; letter-spacing:0.5px; }

    /* Tube */
    .tube-zone { display:flex; align-items:center; justify-content:center; gap:18px; padding:6px 20px 4px; flex-shrink:0; }
    .tube-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; transform-origin:center top; }
    .tube-lbl { color:rgba(255,255,255,0.45); font-size:0.75rem; margin-bottom:2px; }
    @keyframes tubeShake {
      0%,100%{transform:rotate(0) scale(1);}
      15%{transform:rotate(-14deg) scale(1.04);}
      35%{transform:rotate(14deg) scale(1.04);}
      55%{transform:rotate(-10deg) scale(1.02);}
      75%{transform:rotate(10deg) scale(1.02);}
      90%{transform:rotate(-4deg);}
    }
    .tube-wrap.shaking { animation:tubeShake 0.6s ease; }

    /* Mix preview next to tube */
    .mix-preview { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .mix-circle { width:48px; height:48px; border-radius:50%; border:3px solid rgba(255,255,255,0.4); transition:background 0.3s; box-shadow:0 0 14px rgba(255,255,255,0.1); }
    .mix-lbl { color:rgba(255,255,255,0.4); font-size:0.7rem; }
    .mix-name { color:#ffe066; font-size:0.85rem; font-weight:900; min-height:1.1em; }

    /* Bus + Cible */
    .bus-cible-row { flex:1; display:flex; align-items:center; justify-content:center; gap:10px; padding:4px 12px; min-height:80px; overflow:hidden; }
    .cible-aside { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
    .cible-cercle { width:50px; height:50px; border-radius:50%; border:4px solid rgba(255,255,255,0.85); box-shadow:0 0 18px rgba(255,255,255,0.25); transition:background 0.3s; }
    .cible-tag { color:#ffe066; font-size:0.8rem; font-weight:900; white-space:nowrap; }
    .cible-sub { color:rgba(255,255,255,0.55); font-size:0.7rem; }
    .bus-area { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }

    /* Tube buttons (side of tube) */
    .tube-btns { display:flex; flex-direction:column; gap:6px; justify-content:center; }
    .btn-tube { border-radius:16px; font-family:'Nunito',sans-serif; font-weight:900; font-size:0.8rem; padding:8px 10px; cursor:pointer; color:#fff; min-width:72px; }
    .btn-tube:active { opacity:0.75; transform:scale(0.94); }
    .btn-eponge { background:rgba(255,180,40,0.22); border:2px solid rgba(255,180,40,0.5); }
    .btn-mixer  { background:rgba(80,220,255,0.18); border:2px solid rgba(80,220,255,0.5); }

    /* Controls (only vider at bottom) */
    .ctrl-zone { padding:4px 16px 12px; display:flex; justify-content:center; gap:8px; flex-shrink:0; }
    .btn-ctrl { border-radius:22px; font-family:'Nunito',sans-serif; font-weight:900; font-size:0.9rem; padding:8px 20px; cursor:pointer; color:#fff; }
    .btn-ctrl:active { opacity:0.75; transform:scale(0.96); }
    .btn-vider  { background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.25); }
    .btn-hint   { background:rgba(255,220,80,0.15); border:2px solid rgba(255,220,80,0.5); color:#ffe066; display:none; }
    .btn-hint.visible { display:block; animation:hintPulse 1.5s ease-in-out infinite alternate; }
    @keyframes hintPulse { from { box-shadow:0 0 0px rgba(255,220,80,0.3); } to { box-shadow:0 0 10px rgba(255,220,80,0.7); } }

    /* Overlays */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; visibility:hidden; transition:all 0.4s; }
    .overlay.show { opacity:1; visibility:visible; }
    .ov-box { background:linear-gradient(135deg,#1a1a2e,#16213e); border-radius:24px; border:2px solid rgba(255,255,255,0.1); padding:28px 24px; text-align:center; max-width:320px; width:90%; }
    .ov-emoji { font-size:3rem; margin-bottom:8px; }
    .ov-title { font-size:1.6rem; color:#ffe066; font-weight:900; margin-bottom:8px; }
    .ov-text  { color:#fff; font-size:1rem; margin-bottom:20px; line-height:1.4; }
    .ov-btn   { background:linear-gradient(135deg,#00c47a,#00a86b); color:#fff; border:none; border-radius:20px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.1rem; padding:12px 28px; cursor:pointer; }
    .ov-btn:active { opacity:0.8; }

    .brun-overlay { position:fixed; inset:0; background:rgba(60,30,0,0.93); display:flex; align-items:center; justify-content:center; z-index:99; opacity:0; visibility:hidden; transition:all 0.3s; }
    .brun-overlay.show { opacity:1; visibility:visible; }
    .brun-content { text-align:center; padding:20px; }
    .brun-emoji { font-size:4.5rem; display:block; animation:wobble 0.55s infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-12deg) scale(1);} 50%{transform:rotate(12deg) scale(1.08);} }
    .brun-text { color:#fff; font-size:1.3rem; font-weight:900; margin-top:10px; line-height:1.5; }
    .btn-laver { background:rgba(255,255,255,0.2); color:#fff; border:2px solid rgba(255,255,255,0.4); border-radius:22px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1rem; padding:10px 28px; cursor:pointer; margin-top:16px; display:inline-block; }
    .btn-laver:active { background:rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div id="app">

    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🎨 Peins les bus !</span>
    </div>

    <div class="progress-zone" id="progress"></div>

    <!-- Pots de couleur -->
    <div class="pots-zone">
      <button class="pot pot-rouge" onclick="addQuart('r')">
        <span class="pot-emoji">🔴</span>
        <span class="pot-lbl">ROUGE</span>
      </button>
      <button class="pot pot-jaune" onclick="addQuart('j')">
        <span class="pot-emoji">🟡</span>
        <span class="pot-lbl">JAUNE</span>
      </button>
      <button class="pot pot-bleu" onclick="addQuart('b')">
        <span class="pot-emoji">🔵</span>
        <span class="pot-lbl">BLEU</span>
      </button>
    </div>

    <!-- Tube à essai + boutons + aperçu mélange -->
    <div class="tube-zone">
      <div class="tube-wrap" id="tube-wrap">
        <span class="tube-lbl">Tube :</span>
        <!-- SVG injecté par JS -->
      </div>
      <div class="tube-btns">
        <button class="btn-tube btn-eponge" onclick="enleverDernier()">🧽 Éponge</button>
        <button class="btn-tube btn-mixer"  onclick="mixer()">🔀 Mixer</button>
      </div>
      <div class="mix-preview">
        <div class="mix-lbl">Mélange</div>
        <div class="mix-circle" id="mix-circle"></div>
        <div class="mix-name" id="mix-name"></div>
      </div>
    </div>

    <!-- Bus + couleur cible côte à côte -->
    <div class="bus-cible-row">
      <div class="cible-aside">
        <div class="cible-cercle" id="cible-cercle"></div>
        <div class="cible-tag" id="cible-tag"></div>
        <div class="cible-sub" id="cible-sub">cible</div>
      </div>
      <div class="bus-area" id="bus-zone"></div>
    </div>

    <!-- Bouton vider (bas) -->
    <div class="ctrl-zone">
      <button class="btn-ctrl btn-vider" onclick="vider()">🚿 Vider</button>
      <button class="btn-ctrl btn-hint" id="btn-hint" onclick="showHint()">💡 Indice</button>
    </div>

  </div>

  <!-- Overlay victoire -->
  <div class="overlay" id="overlay">
    <div class="ov-box">
      <div class="ov-emoji">🎉</div>
      <div class="ov-title" id="ov-title">Bravo !</div>
      <div class="ov-text" id="ov-text">Le bus est peint !</div>
      <button class="ov-btn" onclick="nextDefi()">Suivant →</button>
    </div>
  </div>

  <!-- Overlay brun -->
  <div class="brun-overlay" id="brun-overlay">
    <div class="brun-content">
      <span class="brun-emoji">💩</span>
      <div class="brun-text">Prrrout ! 💩<br>C'est du marron !<br>Lave le pinceau !</div>
      <button class="btn-laver" onclick="vider()">🚿 Laver !</button>
    </div>
  </div>

  <!-- Overlay hint -->
  <div class="overlay" id="hint-overlay" style="z-index:102;">
    <div class="ov-box">
      <div class="ov-emoji">💡</div>
      <div class="ov-title" style="font-size:1.2rem;">Voilà le secret !</div>
      <div class="ov-text" id="hint-text" style="font-size:1.3rem;letter-spacing:2px;"></div>
      <button class="ov-btn" onclick="document.getElementById('hint-overlay').classList.remove('show')">OK !</button>
    </div>
  </div>

  <!-- Overlay fin de partie -->
  <div class="overlay" id="fin-overlay" style="z-index:101;">
    <div class="ov-box">
      <div class="ov-emoji">🚌</div>
      <div class="ov-title">Tous les bus sont peints !</div>
      <div class="ov-text">Tu es un super peintre !</div>
      <button class="ov-btn" onclick="resetPartie()">🎨 Rejouer !</button>
    </div>
  </div>

  <script src="js/bus-svg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sounds.js"></script>
  <script>
  const DEFIS = [
    { r:4, j:0, b:0, hex:'#E8192C', label:'rouge',        num:'RER A', textColor:'#fff' },
    { r:0, j:4, b:0, hex:'#FFCD00', label:'jaune',        num:'1',     textColor:'#333' },
    { r:0, j:0, b:4, hex:'#003CA6', label:'bleu',         num:'2',     textColor:'#fff' },
    { r:2, j:2, b:0, hex:'#FF7E2E', label:'orange',       num:'5',     textColor:'#fff' },
    { r:0, j:2, b:2, hex:'#007852', label:'vert',         num:'12',    textColor:'#fff' },
    { r:2, j:0, b:2, hex:'#62259D', label:'violet',       num:'14',    textColor:'#fff' },
    { r:0, j:1, b:3, hex:'#00AACC', label:'turquoise',    num:'380',   textColor:'#fff' },
    { r:1, j:3, b:0, hex:'#FFAA00', label:'ambre',        num:'10',    textColor:'#333' },
    { r:3, j:1, b:0, hex:'#FF5500', label:'orange foncé', num:'8',     textColor:'#fff' },
    { r:3, j:0, b:1, hex:'#CC2266', label:'rose',         num:'4',     textColor:'#fff' },
    { r:0, j:3, b:1, hex:'#44AA44', label:'vert clair',   num:'9',     textColor:'#fff' },
    { r:1, j:0, b:3, hex:'#4040C0', label:'bleu violet',  num:'RER B', textColor:'#fff' },
    { r:2, j:1, b:1, hex:'#CC5533', label:'brique',       num:'183',   textColor:'#fff' },
    { r:1, j:2, b:1, hex:'#77AA44', label:'olive',        num:'21',    textColor:'#fff' },
    { r:1, j:1, b:2, hex:'#4455AA', label:'ardoise',      num:'42',    textColor:'#fff' },
  ];

  const TABLE = [
    { pr:1,    pj:0,    pb:0,    hex:'#E8192C', label:'rouge' },
    { pr:0,    pj:1,    pb:0,    hex:'#FFCD00', label:'jaune' },
    { pr:0,    pj:0,    pb:1,    hex:'#003CA6', label:'bleu' },
    { pr:0.5,  pj:0.5,  pb:0,   hex:'#FF7E2E', label:'orange' },
    { pr:0,    pj:0.5,  pb:0.5, hex:'#007852', label:'vert' },
    { pr:0.5,  pj:0,    pb:0.5, hex:'#62259D', label:'violet' },
    { pr:0.75, pj:0.25, pb:0,   hex:'#FF5500', label:'orange foncé' },
    { pr:0.25, pj:0.75, pb:0,   hex:'#FFAA00', label:'ambre' },
    { pr:0.25, pj:0,    pb:0.75,hex:'#4040C0', label:'bleu violet' },
    { pr:0,    pj:0.25, pb:0.75,hex:'#00AACC', label:'turquoise' },
    { pr:0.75, pj:0,    pb:0.25, hex:'#CC2266', label:'rose' },
    { pr:0,    pj:0.75, pb:0.25, hex:'#44AA44', label:'vert clair' },
    { pr:0.5,  pj:0.25, pb:0.25, hex:'#CC5533', label:'brique' },
    { pr:0.25, pj:0.5,  pb:0.25, hex:'#77AA44', label:'olive' },
    { pr:0.25, pj:0.25, pb:0.5,  hex:'#4455AA', label:'ardoise' },
  ];

  const QCOL  = { r:'#E8192C', j:'#FFCD00', b:'#003CA6' };
  const QBORD = { r:'rgba(255,255,255,0.5)', j:'rgba(0,0,0,0.25)', b:'rgba(255,255,255,0.5)' };

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let counts      = {r:0, j:0, b:0};
  let quarts      = [];
  let defiIdx     = 0;
  let solved      = 0;
  let victoire    = false;
  let brunShown   = false;
  let mixedResult = null;         // null | { hex, label, ... } | 'BRUN'
  let mixedCounts = {r:0, j:0, b:0}; // doses réelles contenues dans le mix
  let missCount   = 0;            // essais manqués sur le défi courant
  let order     = shuffle(DEFIS.map((_, i) => i));
  let defi      = DEFIS[order[0]];

  // ── TUBE SVG ──────────────────────────────────────────────────────
  function renderTube() {
    const wrap = document.getElementById('tube-wrap');
    const SW = 52, SH = 145;
    const RIMH = 14;   // hauteur du col (ouverture en haut)
    const BOT  = SH;   // fond du tube
    const RX   = 11;   // arrondi du fond

    // Zone remplissable : de RIMH à (BOT - RX) = 145 - 11 = 134
    // On remplit jusqu'en bas (le clip gère la courbe)
    const FILL_H = BOT - RIMH;     // 131
    // Chemin du corps du tube : plat en haut, arrondi en bas
    const path = `M0,${RIMH} L0,${BOT-RX} Q0,${BOT} ${RX},${BOT} L${SW-RX},${BOT} Q${SW},${BOT} ${SW},${BOT-RX} L${SW},${RIMH} Z`;

    const mixedVol = mixedCounts.r + mixedCounts.j + mixedCounts.b;
    const newVol   = quarts.length;
    const totalVol = mixedVol + newVol;
    // Min 4 slots pour que les doses isolées restent visibles
    const slots    = Math.max(totalVol, 4);
    const doseH    = FILL_H / slots;

    let layers = '';
    let emptyHint = '';

    if (totalVol === 0) {
      emptyHint = `<text x="${SW/2}" y="${RIMH + FILL_H/2 + 5}" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="10" font-family="Nunito">vide</text>`;
    } else {
      // Bloc de la base mixée (en bas du tube)
      if (mixedVol > 0) {
        const bgHex = mixedResult === 'BRUN' ? '#6B4226' : (mixedResult ? mixedResult.hex : 'rgba(255,255,255,0.1)');
        const bgH   = doseH * mixedVol;
        const bgY   = (BOT - bgH).toFixed(1);
        layers += `<rect x="0" y="${bgY}" width="${SW}" height="${(bgH + 1).toFixed(1)}" fill="${bgHex}"/>`;
      }
      // Nouvelles couches empilées par-dessus
      quarts.slice(0, 8).forEach((q, i) => {
        const fromBottom = mixedVol + i;
        const qY = (BOT - doseH * (fromBottom + 1)).toFixed(1);
        layers += `<rect x="0" y="${qY}" width="${SW}" height="${(doseH + 1).toFixed(1)}" fill="${QCOL[q]}"/>`;
      });
    }

    const svg = `<svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">
  <defs>
    <clipPath id="tc">
      <path d="${path}"/>
    </clipPath>
  </defs>
  <!-- Fond verre -->
  <path d="${path}" fill="rgba(150,210,255,0.1)" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
  <!-- Couches colorées (clippées au tube) -->
  <g clip-path="url(#tc)">${layers}</g>
  <!-- Reflet verre -->
  <rect x="5" y="${RIMH+5}" width="7" height="${FILL_H-22}" rx="3" fill="rgba(255,255,255,0.18)" clip-path="url(#tc)"/>
  <!-- Col / ouverture (rectangle au sommet) -->
  <rect x="2" y="0" width="${SW-4}" height="${RIMH}" rx="5" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  ${emptyHint}
</svg>`;

    // Remplace le contenu du wrap (label + svg)
    const lbl = wrap.querySelector('.tube-lbl');
    wrap.innerHTML = '';
    if (lbl) wrap.appendChild(lbl);
    else {
      const s = document.createElement('span');
      s.className = 'tube-lbl';
      s.textContent = 'Tube :';
      wrap.appendChild(s);
    }
    wrap.insertAdjacentHTML('beforeend', svg);
  }

  // ── MÉLANGE ───────────────────────────────────────────────────────
  function calcMelange(useCountsOpt) {
    const c = useCountsOpt || counts;
    const tot = c.r + c.j + c.b;
    if (tot === 0) return null;
    const pr = c.r / tot, pj = c.j / tot, pb = c.b / tot;
    if (pr > 0.18 && pj > 0.15 && pb > 0.15) return 'BRUN';
    let best = TABLE[0], bestD = Infinity;
    for (const x of TABLE) {
      const d = Math.hypot(pr - x.pr, pj - x.pj, pb - x.pb);
      if (d < bestD) { bestD = d; best = x; }
    }
    return best;   // { hex, label, pr, pj, pb, ... }
  }

  function isVictoire() {
    // La victoire se vérifie après un mix : on utilise mixedCounts
    const tot = mixedCounts.r + mixedCounts.j + mixedCounts.b;
    if (tot === 0) return false;
    const pr = mixedCounts.r / tot, pj = mixedCounts.j / tot, pb = mixedCounts.b / tot;
    return Math.hypot(pr - defi.r/4, pj - defi.j/4, pb - defi.b/4) < 0.18;
  }

  // ── RENDUS ────────────────────────────────────────────────────────
  function renderBus(hex) {
    const el = document.getElementById('bus-zone');
    const isBrun = hex === 'BRUN';
    const c  = isBrun ? '#6B4226' : (hex || '#888888');
    const tc = hex && !isBrun ? defi.textColor : '#555';
    const w  = Math.min(240, window.innerWidth - 100);
    el.innerHTML = busSVG(c, tc, defi.num, w);
  }

  function renderMixPreview(melange) {
    const circle = document.getElementById('mix-circle');
    const name   = document.getElementById('mix-name');
    if (!melange) {
      circle.style.background = 'rgba(255,255,255,0.05)';
      name.textContent = '';
    } else if (melange === 'BRUN') {
      circle.style.background = '#6B4226';
      name.textContent = '💩 marron';
    } else {
      circle.style.background = melange.hex;
      name.textContent = melange.label;
    }
  }

  function miniTubeSVG(hex, state, idx) {
    const W = 18, H = 40, RIMH = 6, BOT = 40, RX = 4;
    const FILL_H = BOT - RIMH;
    const path = `M0,${RIMH} L0,${BOT-RX} Q0,${BOT} ${RX},${BOT} L${W-RX},${BOT} Q${W},${BOT} ${W},${BOT-RX} L${W},${RIMH} Z`;
    const cpId = `mtc${idx}`;
    const strokeColor = state === 'current' ? '#ffe066' : 'rgba(255,255,255,0.3)';
    const strokeW = state === 'current' ? '2' : '1.5';
    const fillColor = state === 'done' ? hex : 'rgba(150,210,255,0.06)';
    const filterStyle = state === 'done' ? `style="filter:drop-shadow(0 0 4px ${hex}88)"` : '';
    const checkmark = state === 'done' ? `<text x="${W/2}" y="${RIMH + FILL_H/2 + 4}" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9" font-family="Nunito,sans-serif">✓</text>` : '';
    return `<div class="prog-tube-wrap${state === 'current' ? ' current' : ''}">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ${filterStyle}>
        <defs><clipPath id="${cpId}"><path d="${path}"/></clipPath></defs>
        <path d="${path}" fill="${fillColor}" clip-path="url(#${cpId})"/>
        <path d="${path}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
        <rect x="2" y="0" width="${W-4}" height="${RIMH}" rx="2" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        ${checkmark}
      </svg>
    </div>`;
  }

  function renderProgress() {
    const zone = document.getElementById('progress');
    let html = '';
    for (let row = 0; row < 3; row++) {
      html += '<div class="prog-row">';
      for (let col = 0; col < 5; col++) {
        const i = row * 5 + col;
        const d = DEFIS[order[i]];
        const state = i < solved ? 'done' : i === solved ? 'current' : 'pending';
        html += miniTubeSVG(d.hex, state, i);
      }
      html += '</div>';
    }
    zone.innerHTML = html;
  }

  function renderAll() {
    const m = mixedResult;
    const isBrun = m === 'BRUN';
    const hex = isBrun ? 'BRUN' : (m ? m.hex : null);

    renderTube();
    renderBus(hex);
    renderMixPreview(m);

    if (isBrun && !brunShown) {
      brunShown = true;
      document.getElementById('brun-overlay').classList.add('show');
      playBrun();
    } else if (!isBrun) {
      brunShown = false;
      document.getElementById('brun-overlay').classList.remove('show');
    }

    if (!isBrun && !victoire && m && isVictoire()) {
      victoire = true;
      setTimeout(showVictoire, 350);
    }
  }

  // ── ACTIONS ───────────────────────────────────────────────────────
  function addQuart(type) {
    if (victoire) return;
    // NE PAS reset mixedResult : on garde la base du mix précédent
    counts[type]++;
    quarts.push(type);
    if (quarts.length > 4) {
      const removed = quarts.shift();
      counts[removed] = Math.max(0, counts[removed] - 1);
    }
    renderTube();               // seulement le tube, pas le bus
    renderMixPreview(mixedResult);  // garde la preview du mix précédent visible
  }

  function enleverDernier() {
    if (quarts.length === 0) return;
    // NE PAS reset mixedResult : on garde la base du mix précédent
    const q = quarts.pop();
    counts[q] = Math.max(0, counts[q] - 1);
    victoire = false;
    renderTube();
    renderMixPreview(mixedResult);  // garde la preview visible
  }

  function mixer() {
    if (quarts.length === 0 && mixedCounts.r + mixedCounts.j + mixedCounts.b === 0) return;
    if (quarts.length === 0) return; // rien de nouveau à mélanger
    const wrap = document.getElementById('tube-wrap');
    wrap.classList.remove('shaking');
    void wrap.offsetWidth;
    wrap.classList.add('shaking');
    wrap.addEventListener('animationend', () => {
      wrap.classList.remove('shaking');

      // Volumes réels : base existante + nouvelles doses
      const totalCounts = {
        r: mixedCounts.r + counts.r,
        j: mixedCounts.j + counts.j,
        b: mixedCounts.b + counts.b,
      };

      mixedResult = calcMelange(totalCounts);
      mixedCounts = { ...totalCounts }; // conserver les volumes réels
      counts  = {r:0, j:0, b:0};
      quarts  = [];
      renderAll();
      // Indice après 3 ratés
      if (mixedResult !== 'BRUN' && !isVictoire()) {
        missCount++;
        if (missCount >= 3) document.getElementById('btn-hint').classList.add('visible');
      }
    }, { once: true });
    playMix();
  }

  function vider() {
    counts      = {r:0, j:0, b:0};
    quarts      = [];
    victoire    = false;
    brunShown   = false;
    mixedResult = null;
    mixedCounts = {r:0, j:0, b:0};
    document.getElementById('brun-overlay').classList.remove('show');
    renderTube();
    renderBus(null);
    renderMixPreview(null);
  }

  // ── VICTOIRE ──────────────────────────────────────────────────────
  function showVictoire() {
    solved++;
    renderProgress();
    playKlaxon();
    document.getElementById('ov-title').textContent = 'Super ! 🎉';
    document.getElementById('ov-text').textContent  = `Le bus ${defi.num} est ${defi.label} !`;
    document.getElementById('overlay').classList.add('show');
  }

  function nextDefi() {
    document.getElementById('overlay').classList.remove('show');
    defiIdx++;
    if (defiIdx >= DEFIS.length) {
      document.getElementById('fin-overlay').classList.add('show');
      return;
    }
    defi = DEFIS[order[defiIdx]];
    vider();
    initDefi();
  }

  function resetPartie() {
    document.getElementById('fin-overlay').classList.remove('show');
    solved   = 0;
    defiIdx  = 0;
    order    = shuffle(DEFIS.map((_, i) => i));
    defi     = DEFIS[order[0]];
    vider();
    initDefi();
  }

  function showHint() {
    const parts = [];
    if (defi.r > 0) parts.push(`${defi.r} 🔴`);
    if (defi.j > 0) parts.push(`${defi.j} 🟡`);
    if (defi.b > 0) parts.push(`${defi.b} 🔵`);
    document.getElementById('hint-text').textContent = parts.join(' + ');
    document.getElementById('hint-overlay').classList.add('show');
  }

  function initDefi() {
    missCount = 0;
    document.getElementById('btn-hint').classList.remove('visible');
    document.getElementById('cible-cercle').style.background = defi.hex;
    document.getElementById('cible-tag').textContent  = `Ligne ${defi.num}`;
    document.getElementById('cible-sub').textContent  = defi.label;
    renderBus(null);
    renderTube();
    renderMixPreview(null);
    renderProgress();
  }

  // ── SONS ──────────────────────────────────────────────────────────
  function playKlaxon() {
    try {
      const ac = new AudioContext();
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.frequency.value = freq; o.type = 'triangle';
        const t = ac.currentTime + i * 0.1;
        g.gain.setValueAtTime(0.28, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.start(t); o.stop(t + 0.15);
      });
    } catch(e) {}
  }

  function playBrun() {
    try {
      const ac = new AudioContext();
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ac.currentTime + 0.55);
      g.gain.setValueAtTime(0.4, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
      o.start(); o.stop(ac.currentTime + 0.6);
    } catch(e) {}
  }

  function playMix() {
    try {
      const ac = new AudioContext();
      const freqs = [400, 600, 350, 700, 300];
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'sine';
        o.frequency.value = f;
        const t = ac.currentTime + i * 0.06;
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        o.start(t); o.stop(t + 0.1);
      });
    } catch(e) {}
  }

  initDefi();
  </script>
</body>
</html>
