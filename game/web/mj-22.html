<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-22 — Trouve le pays !</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation; }
    body { background:#1a1a2e; font-family:system-ui,sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    .hdr { display:flex; align-items:center; gap:10px; padding:6px 12px; flex-shrink:0; background:rgba(0,0,0,0.25); border-bottom:1px solid rgba(255,255,255,0.08); }
    .hdr a { color:#fff; text-decoration:none; font-size:1.3rem; background:rgba(255,255,255,0.12); border-radius:8px; padding:4px 10px; font-weight:900; flex-shrink:0; }
    .hdr a:active { background:rgba(255,255,255,0.25); }
    .htitle { flex:1; font-size:1rem; font-weight:900; }

    .consigne-zone { display:flex; align-items:center; justify-content:center; gap:10px; padding:8px 12px; flex-shrink:0; background:rgba(0,0,0,0.2); min-height:56px; }
    .drapeau-hint { font-size:2.4rem; }
    .consigne-text { font-size:1.1rem; font-weight:700; }

    .map-zone { flex:1; min-height:0; display:flex; }
    #mapSvg { width:100%; height:100%; }

    .selected-pulse { animation:puls 0.9s ease-in-out infinite; }
    @keyframes puls { 0%,100%{filter:drop-shadow(0 0 6px rgba(255,149,0,.7))} 50%{filter:drop-shadow(0 0 16px rgba(255,183,0,1))} }

    .ctrl-zone { padding:6px 12px; flex-shrink:0; display:flex; justify-content:center; min-height:52px; align-items:center; }
    .btn-ok { display:none; padding:10px 36px; font-size:1rem; font-weight:900; background:#22c55e; color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit; box-shadow:0 4px 0 #15803d; }
    .btn-ok.show { display:block; }
    .btn-ok:active { transform:translateY(3px); box-shadow:0 1px 0 #15803d; }

    .lvl-bar { display:flex; justify-content:space-between; align-items:center; padding:5px 12px; background:rgba(0,0,0,0.3); flex-shrink:0; }
    .dots { display:flex; gap:5px; flex-wrap:wrap; }
    .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.25); transition:background 300ms; }
    .dot.done { background:#22c55e; }
    .lvl-label { font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.6); }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:99; animation:fi 200ms; }
    @keyframes fi { from{opacity:0} to{opacity:1} }
    .vcard { background:#fff; border-radius:20px; padding:28px 36px; text-align:center; animation:po 350ms cubic-bezier(0.34,1.56,0.64,1); max-width:90vw; }
    @keyframes po { from{transform:scale(0.2);opacity:0} to{transform:scale(1);opacity:1} }
    .vflag { font-size:110px; line-height:1.1; }
    .vname { font-size:1.6rem; font-weight:900; color:#333; margin-top:6px; }
    .vbtn { margin-top:14px; padding:10px 24px; background:#22c55e; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:900; cursor:pointer; font-family:inherit; }
    .fin-btn { margin-top:8px; padding:10px 20px; background:#3b82f6; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:900; cursor:pointer; font-family:inherit; display:block; width:100%; }
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🗺️ Trouve le pays !</span>
  </div>
  <div class="consigne-zone">
    <span class="drapeau-hint" id="drapeauHint"></span>
    <span class="consigne-text" id="consigneText">Chargement de la carte…</span>
  </div>
  <div class="map-zone">
    <svg id="mapSvg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="ctrl-zone">
    <button class="btn-ok" id="btnOk" onclick="confirmer()">✓ C'est ça !</button>
  </div>
  <div class="lvl-bar">
    <div class="dots" id="dotsEl"></div>
    <div class="lvl-label" id="lvlLabel">🌟 Facile</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson@3/dist/topojson.min.js"></script>
<script>
// ── Données pays (ISO numeric → données jeu) ─────────────────────────────────
const EU_PAYS = {
  250: { name:'France',          flag:'🇫🇷', art:'la ',  col:'#4a7fd4' },
  276: { name:'Allemagne',       flag:'🇩🇪', art:"l'",   col:'#c5a020' },
  724: { name:'Espagne',         flag:'🇪🇸', art:"l'",   col:'#c94040' },
  380: { name:'Italie',          flag:'🇮🇹', art:"l'",   col:'#e07030' },
  826: { name:'Royaume-Uni',     flag:'🇬🇧', art:'le ',  col:'#7c4db8' },
  616: { name:'Pologne',         flag:'🇵🇱', art:'la ',  col:'#d45070' },
  528: { name:'Pays-Bas',        flag:'🇳🇱', art:'les ', col:'#c03030' },
  56:  { name:'Belgique',        flag:'🇧🇪', art:'la ',  col:'#b88020' },
  756: { name:'Suisse',          flag:'🇨🇭', art:'la ',  col:'#b83050' },
  40:  { name:'Autriche',        flag:'🇦🇹', art:"l'",   col:'#7c3080' },
  752: { name:'Suède',           flag:'🇸🇪', art:'la ',  col:'#2080be' },
  578: { name:'Norvège',         flag:'🇳🇴', art:'la ',  col:'#c57020' },
  300: { name:'Grèce',           flag:'🇬🇷', art:'la ',  col:'#1a7060' },
  642: { name:'Roumanie',        flag:'🇷🇴', art:'la ',  col:'#3062c0' },
  620: { name:'Portugal',        flag:'🇵🇹', art:'le ',  col:'#3a9050' },
  208: { name:'Danemark',        flag:'🇩🇰', art:'le ',  col:'#a82020' },
  372: { name:'Irlande',         flag:'🇮🇪', art:"l'",   col:'#206030' },
  191: { name:'Croatie',         flag:'🇭🇷', art:'la ',  col:'#507030' },
  688: { name:'Serbie',          flag:'🇷🇸', art:'la ',  col:'#405070' },
  703: { name:'Slovaquie',       flag:'🇸🇰', art:'la ',  col:'#205020' },
  203: { name:'Rép. Tchèque',    flag:'🇨🇿', art:'la ',  col:'#1a5090' },
  348: { name:'Hongrie',         flag:'🇭🇺', art:'la ',  col:'#b03030' },
  100: { name:'Bulgarie',        flag:'🇧🇬', art:'la ',  col:'#307050' },
  804: { name:'Ukraine',         flag:'🇺🇦', art:"l'",   col:'#3a6090' },
  246: { name:'Finlande',        flag:'🇫🇮', art:'la ',  col:'#008880' },
};

// Pays visibles en gris (contexte géographique, non jouables)
const CONTEXT_IDS = new Set([112, 498, 8, 807, 499, 70, 440, 428, 233, 442, 352, 643]);

const EU_IDS = new Set(Object.keys(EU_PAYS).map(Number));

const LEVELS = {
  facile:    [250, 724, 380, 276, 826],
  moyen:     [250, 724, 380, 276, 826, 620, 56, 528, 756, 40, 616, 752, 578, 300, 642],
  difficile: Object.keys(EU_PAYS).map(Number)
};

// ── Zone de projection Europe ─────────────────────────────────────────────────
// lon [-13, 42], lat [34, 72] → SVG 900×700
const EUROPE_BBOX = {
  type:'Feature',
  geometry:{ type:'Polygon', coordinates:[[[-13,34],[42,34],[42,72],[-13,72],[-13,34]]] }
};

// ── État ──────────────────────────────────────────────────────────────────────
let currentLevel = 'facile';
let queue = [], qIdx = 0, selected = null;
const foundSet = new Set();
let worldFeatures = [], pathGen;

// ── SVG + ocean ───────────────────────────────────────────────────────────────
const svgEl = document.getElementById('mapSvg');
const oceanRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
oceanRect.setAttribute('width',900); oceanRect.setAttribute('height',700);
oceanRect.setAttribute('fill','#1e3a5f');
svgEl.appendChild(oceanRect);

// ── Rendu carte ───────────────────────────────────────────────────────────────
function makePath(feature, fill, stroke, sw, onClick) {
  const d = pathGen(feature);
  if (!d) return null;
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d);
  p.setAttribute('fill', fill);
  p.setAttribute('stroke', stroke);
  p.setAttribute('stroke-width', sw);
  p.setAttribute('stroke-linejoin','round');
  if (onClick) { p.style.cursor = 'pointer'; p.addEventListener('click', onClick); }
  else { p.style.pointerEvents = 'none'; }
  return p;
}

function renderMap() {
  // Vider sauf l'océan (premier enfant)
  while (svgEl.childNodes.length > 1) svgEl.removeChild(svgEl.lastChild);

  const activeSet = new Set(LEVELS[currentLevel]);

  // Contexte (gris foncé)
  worldFeatures.filter(f => CONTEXT_IDS.has(+f.id)).forEach(f => {
    const p = makePath(f, '#1c2d3d', '#111e2a', 0.5, null);
    if (p) svgEl.appendChild(p);
  });

  // Pays du jeu
  worldFeatures.filter(f => EU_IDS.has(+f.id)).forEach(f => {
    const id = +f.id;
    const data = EU_PAYS[id];
    const isActive = activeSet.has(id);
    const isFound  = foundSet.has(id);
    const isSel    = selected === id;

    let fill, stroke, sw, onClick = null;
    if (isFound) {
      fill='#22c55e'; stroke='#15803d'; sw=2;
    } else if (isSel) {
      fill='#ff9500'; stroke='#ffb700'; sw=2.5;
    } else if (isActive) {
      fill=data.col; stroke='#0a1520'; sw=1.2;
      onClick = () => selectPays(id);
    } else {
      fill='#243040'; stroke='#18222c'; sw=0.8;
    }

    const p = makePath(f, fill, stroke, sw, onClick);
    if (!p) return;
    if (isSel) p.setAttribute('class','selected-pulse');
    svgEl.appendChild(p);
  });

  // Labels texte courts
  worldFeatures.filter(f => EU_IDS.has(+f.id)).forEach(f => {
    const id = +f.id;
    if (!activeSet.has(id) && !foundSet.has(id)) return;

    const c = pathGen.centroid(f);
    if (!c || isNaN(c[0]) || isNaN(c[1])) return;
    if (c[0] < 0 || c[0] > 900 || c[1] < 0 || c[1] > 700) return;

    const n = EU_PAYS[id].name;
    const short = n.length > 9 ? n.substring(0,7)+'.' : n;

    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', c[0]);
    txt.setAttribute('y', c[1]);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('dominant-baseline','middle');
    txt.setAttribute('font-size','7.5');
    txt.setAttribute('fill','rgba(255,255,255,0.85)');
    txt.setAttribute('font-family','system-ui,sans-serif');
    txt.setAttribute('font-weight','700');
    txt.setAttribute('pointer-events','none');
    txt.setAttribute('stroke','rgba(0,0,0,0.4)');
    txt.setAttribute('stroke-width','0.3');
    txt.textContent = short;
    svgEl.appendChild(txt);
  });
}

// ── Logique jeu ───────────────────────────────────────────────────────────────
function speak(txt) {
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='fr-FR'; u.rate=0.85; u.pitch=1.1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function selectPays(id) {
  if (foundSet.has(id)) return;
  selected = id;
  renderMap();
  document.getElementById('btnOk').classList.add('show');
}

function confirmer() {
  const target = queue[qIdx];
  if (selected === target) {
    victoire(target);
  } else {
    speak('Non, cherche encore !');
    selected = null;
    document.getElementById('btnOk').classList.remove('show');
    renderMap();
  }
}

function victoire(id) {
  const data = EU_PAYS[id];
  foundSet.add(id);
  selected = null;
  document.getElementById('btnOk').classList.remove('show');
  renderMap();
  speak(`Bravo ! C'est ${data.art}${data.name} !`);

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="vcard">
      <div class="vflag">${data.flag}</div>
      <div class="vname">${data.name}</div>
      <button class="vbtn" onclick="this.closest('.overlay').remove();nextPays()">Suivant →</button>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(() => { if (document.body.contains(ov)) { ov.remove(); nextPays(); } }, 3200);
}

function nextPays() {
  updateDots();
  qIdx++;
  if (qIdx >= queue.length) { finJeu(); return; }
  showConsigne();
}

function showConsigne() {
  const id = queue[qIdx];
  const data = EU_PAYS[id];
  const consigne = `Trouve ${data.art}${data.name} !`;
  document.getElementById('drapeauHint').textContent = data.flag;
  document.getElementById('consigneText').textContent = consigne;
  speak(consigne);
}

function updateDots() {
  const el = document.getElementById('dotsEl');
  el.innerHTML = '';
  const n = Math.min(queue.length, 12);
  for (let i=0;i<n;i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < qIdx ? ' done' : '');
    el.appendChild(d);
  }
}

function finJeu() {
  speak('Bravo Max ! Tu as trouvé tous les pays !');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="vcard">
      <div class="vflag">🎉</div>
      <div class="vname">Bravo Max !</div>
      <div style="color:#666;margin:8px 0;font-size:.95rem">Tu as trouvé tous les pays !</div>
      <button class="vbtn" onclick="window.location.reload()">Rejouer</button>
      <button class="fin-btn" onclick="window.location.href='index.html'">Menu</button>
    </div>`;
  document.body.appendChild(ov);
}

function initLevel(lvl) {
  currentLevel = lvl;
  const ids = LEVELS[lvl];
  queue = [...ids].sort(() => Math.random() - 0.5);
  qIdx = 0; selected = null; foundSet.clear();
  const labels = {facile:'🌟 Facile', moyen:'⭐⭐ Moyen', difficile:'⭐⭐⭐ Expert'};
  document.getElementById('lvlLabel').textContent = labels[lvl];
  renderMap();
  updateDots();
  showConsigne();
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    worldFeatures = topojson.feature(world, world.objects.countries).features;

    const projection = d3.geoMercator()
      .fitExtent([[10,10],[890,690]], EUROPE_BBOX);
    pathGen = d3.geoPath().projection(projection);

    const lvl = new URLSearchParams(location.search).get('level') || 'facile';
    initLevel(lvl);
  } catch(e) {
    document.getElementById('consigneText').textContent = '⚠️ Erreur réseau — ouvre via GitHub Pages';
  }
}

init();
</script>
</body>
</html>
