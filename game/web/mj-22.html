<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ-22 — Peindre les Bus 🎨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #FFF8DC 0%, #FFE4B5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 40px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .header {
      margin-bottom: 40px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .target-bus {
      font-size: 28px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }

    .progress-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ecf0f1;
      border: 2px solid #bdc3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .progress-dot.active {
      background: #3498db;
      border-color: #2980b9;
      color: white;
    }

    .progress-dot.done {
      background: #2ecc71;
      border-color: #27ae60;
      color: white;
    }

    .game-area {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 40px;
      min-height: 280px;
    }

    .pot {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .pot:active {
      transform: scale(0.95);
    }

    .pot-visual {
      width: 140px;
      height: 160px;
      border-radius: 0 0 30px 30px;
      border: 3px solid rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .pot-visual::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .pot-label {
      font-size: 24px;
      font-weight: bold;
      margin-top: 8px;
      min-height: 30px;
    }

    .verre-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .verre {
      width: 120px;
      height: 180px;
      border: 4px solid #95a5a6;
      border-radius: 0 0 20px 20px;
      background: white;
      position: relative;
      overflow: hidden;
    }

    .gouttes {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
    }

    .goutte-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 3px dotted #bdc3c7;
      position: relative;
    }

    .goutte-slot:first-child {
      border-top: none;
    }

    .couleur-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      opacity: 0.8;
      transition: height 0.5s ease-out;
    }

    .goutte-animation {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      animation: dropFall 0.8s ease-in forwards;
    }

    @keyframes dropFall {
      0% {
        top: -40px;
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        top: 200px;
        opacity: 0;
      }
    }

    .target-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid #34495e;
      position: relative;
    }

    .target-circle.halo {
      animation: haloGlow 0.6s ease-out;
    }

    @keyframes haloGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
      }
      100% {
        box-shadow: 0 0 0 20px rgba(46, 204, 113, 0);
      }
    }

    .bus-display {
      width: 100%;
      height: 100px;
      background: white;
      border: 3px dashed #bdc3c7;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .bus-display.active {
      background: #ecf0f1;
    }

    .bus-svg {
      width: 80px;
      height: 80px;
    }

    .feedback {
      font-size: 32px;
      font-weight: bold;
      min-height: 40px;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .feedback.success {
      color: #2ecc71;
    }

    .feedback.trying {
      color: #3498db;
    }

    .button {
      background: #3498db;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .button:active {
      background: #2980b9;
    }

    .button.success {
      background: #2ecc71;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">🎨 Peindre les Bus</div>
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="target-bus">
      Bus à peindre : <span id="targetBusNum">323</span>
    </div>

    <div class="game-area">
      <!-- Pot Rouge -->
      <div class="pot" onclick="addColor('red')">
        <div class="pot-visual" style="background: #FF6B6B; border-color: #C92A2A;">
          <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 80%; height: var(--pot-red-level, 0%); background: rgba(0,0,0,0.2); border-radius: 10px 10px 0 0; transition: height 0.3s;"></div>
          </div>
        </div>
        <div class="pot-label" style="color: #C92A2A;">🔴 Rouge</div>
      </div>

      <!-- Verre au centre -->
      <div class="verre-container">
        <div class="verre" id="verre">
          <div class="couleur-fill" id="colorFill"></div>
          <div class="gouttes" id="gouttes"></div>
        </div>
        <div class="target-circle" id="targetCircle"></div>
      </div>

      <!-- Pot Jaune -->
      <div class="pot" onclick="addColor('yellow')">
        <div class="pot-visual" style="background: #FFD700; border-color: #DAA500;">
          <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 80%; height: var(--pot-yellow-level, 0%); background: rgba(0,0,0,0.1); border-radius: 10px 10px 0 0; transition: height 0.3s;"></div>
          </div>
        </div>
        <div class="pot-label" style="color: #DAA500;">🟡 Jaune</div>
      </div>

      <!-- Pot Bleu -->
      <div class="pot" onclick="addColor('blue')">
        <div class="pot-visual" style="background: #4169E1; border-color: #1E40AF;">
          <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 80%; height: var(--pot-blue-level, 0%); background: rgba(0,0,0,0.2); border-radius: 10px 10px 0 0; transition: height 0.3s;"></div>
          </div>
        </div>
        <div class="pot-label" style="color: #1E40AF;">🔵 Bleu</div>
      </div>
    </div>

    <div class="bus-display" id="busDisplay">
      <span style="color: #95a5a6;">Attends une commande...</span>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="button" id="startBtn" onclick="startNewChallenge()">Commencer 🚀</button>
  </div>

  <script src="bus-svg.js"></script>
  <script>
    // Color mixing table (pigment-based, not RGB)
    const MIXES = {
      '4R': { color: '#FF6B6B', name: 'Rouge', lines: ['M1', 'T3a'] },
      '4J': { color: '#FFD700', name: 'Jaune', lines: ['M1', 'M12'] },
      '4B': { color: '#4169E1', name: 'Bleu', lines: ['M2', 'RER B'] },
      '2R2J': { color: '#FF9500', name: 'Orange', lines: ['M4', 'M5'] },
      '2J2B': { color: '#20C997', name: 'Vert', lines: ['M12', 'M13'] },
      '2R2B': { color: '#9B59B6', name: 'Violet', lines: ['M14', 'M10'] },
      '3R1J': { color: '#FF7F50', name: 'Rouge-Orangé', lines: ['M7bis', 'M8'] },
      '1R3J': { color: '#FFB84D', name: 'Jaune-Orangé', lines: ['M1', 'M6'] },
      '3B1R': { color: '#6F42C1', name: 'Bleu-Violet', lines: ['M13', 'RER A'] },
      '1B3R': { color: '#8B1538', name: 'Bordeaux', lines: ['M2', 'M9'] },
      '3B1J': { color: '#20B2AA', name: 'Turquoise', lines: ['380', 'M11'] },
    };

    // Real IDFM bus lines (sample)
    const BUS_LINES = [
      { num: '323', color: '#CEC92A', mix: '4J' },
      { num: '325', color: '#FF6B6B', mix: '4R' },
      { num: 'M1', color: '#FF9500', mix: '2R2J' },
      { num: '380', color: '#20B2AA', mix: '3B1J' },
      { num: 'M4', color: '#FF9500', mix: '2R2J' },
      { num: 'M12', color: '#20C997', mix: '2J2B' },
      { num: 'RER B', color: '#4169E1', mix: '4B' },
      { num: 'M14', color: '#9B59B6', mix: '2R2B' },
      { num: 'M2', color: '#FF6B6B', mix: '4R' },
      { num: 'M7bis', color: '#FF7F50', mix: '3R1J' },
    ];

    let gameState = {
      bottles: { red: 0, yellow: 0, blue: 0 },
      currentTarget: null,
      currentMix: null,
      score: 0,
      totalChallenges: 10,
      challenges: [],
      isEvaluating: false,
    };

    function initGame() {
      gameState.challenges = [];
      for (let i = 0; i < gameState.totalChallenges; i++) {
        gameState.challenges.push(BUS_LINES[i % BUS_LINES.length]);
      }
      gameState.challenges = gameState.challenges.sort(() => Math.random() - 0.5);
      updateProgressBar();
      startNewChallenge();
    }

    function startNewChallenge() {
      if (gameState.score >= gameState.totalChallenges) {
        document.getElementById('feedback').textContent = '🎉 Bravo ! Tu as peint tous les bus !';
        document.getElementById('startBtn').textContent = 'Rejouer 🎮';
        gameState.score = 0;
        initGame();
        return;
      }

      resetBottles();
      gameState.currentTarget = gameState.challenges[gameState.score];
      document.getElementById('targetBusNum').textContent = gameState.currentTarget.num;
      updateTargetCircle();
      document.getElementById('busDisplay').innerHTML = '';
      document.getElementById('feedback').textContent = '';
      gameState.isEvaluating = false;
    }

    function resetBottles() {
      gameState.bottles = { red: 0, yellow: 0, blue: 0 };
      document.getElementById('colorFill').style.height = '0%';
      document.getElementById('gouttes').innerHTML = '';
    }

    function addColor(color) {
      if (gameState.isEvaluating) return;
      if (gameState.bottles.red + gameState.bottles.yellow + gameState.bottles.blue >= 4) return;

      gameState.bottles[color === 'red' ? 'red' : color === 'yellow' ? 'yellow' : 'blue']++;

      // Animation goutte
      const goutte = document.createElement('div');
      goutte.className = 'goutte-animation';
      goutte.style.background = color === 'red' ? '#FF6B6B' : color === 'yellow' ? '#FFD700' : '#4169E1';
      goutte.style.left = Math.random() * 100 + '%';
      document.body.appendChild(goutte);
      setTimeout(() => goutte.remove(), 800);

      updateMixColor();

      // À 4 gouttes : évaluation auto
      if (gameState.bottles.red + gameState.bottles.yellow + gameState.bottles.blue === 4) {
        gameState.isEvaluating = true;
        setTimeout(() => evaluateMix(), 500);
      }
    }

    function updateMixColor() {
      const { red, yellow, blue } = gameState.bottles;
      const total = red + yellow + blue;
      if (total === 0) {
        document.getElementById('colorFill').style.background = 'white';
        document.getElementById('colorFill').style.height = '0%';
        return;
      }

      gameState.currentMix = getMixName(red, yellow, blue);
      const mixData = MIXES[gameState.currentMix] || { color: '#95a5a6' };
      document.getElementById('colorFill').style.background = mixData.color;
      document.getElementById('colorFill').style.height = (total / 4) * 100 + '%';
    }

    function getMixName(r, y, b) {
      if (r + y + b === 0) return '';
      if (r === 4 || (r === 3 && y === 1) || (r === 2 && y === 2)) return r === 4 ? '4R' : r === 3 ? '3R1J' : '2R2J';
      if (y === 4 || (y === 3 && r === 1) || (y === 3 && b === 1)) return y === 4 ? '4J' : y === 3 && r === 1 ? '1R3J' : '1B3J';
      if (b === 4 || (b === 3 && r === 1) || (b === 3 && y === 1)) return b === 4 ? '4B' : b === 3 && r === 1 ? '3B1R' : '3B1J';
      if (r === 2 && b === 2) return '2R2B';
      if (y === 2 && b === 2) return '2J2B';
      return '';
    }

    function evaluateMix() {
      const target = gameState.currentTarget;
      const targetMix = target.mix;
      const success = gameState.currentMix === targetMix;

      if (success) {
        document.getElementById('feedback').textContent = '✨ Parfait ! Klaxon ! 🚕';
        document.getElementById('feedback').classList.add('success');
        displayBus(target);
        gameState.score++;
        updateProgressBar();
        setTimeout(() => startNewChallenge(), 2000);
      } else {
        document.getElementById('feedback').textContent = "C'est un beau mélange ! 🎨 Essaie encore !";
        document.getElementById('feedback').classList.add('trying');
        document.getElementById('targetCircle').classList.add('halo');
        setTimeout(() => {
          document.getElementById('targetCircle').classList.remove('halo');
          resetBottles();
          gameState.isEvaluating = false;
        }, 1500);
      }
    }

    function displayBus(line) {
      const busDisplay = document.getElementById('busDisplay');
      busDisplay.innerHTML = `<svg class="bus-svg">${busSVG(line.color)}</svg>`;
    }

    function updateTargetCircle() {
      const color = gameState.currentTarget.color;
      document.getElementById('targetCircle').style.background = color;
    }

    function updateProgressBar() {
      const bar = document.getElementById('progressBar');
      bar.innerHTML = '';
      for (let i = 0; i < gameState.totalChallenges; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i === gameState.score) dot.classList.add('active');
        if (i < gameState.score) {
          dot.classList.add('done');
          dot.textContent = '✓';
        } else {
          dot.textContent = i + 1;
        }
        bar.appendChild(dot);
      }
    }

    // Démarrage du jeu
    window.addEventListener('load', initGame);
  </script>
</body>
</html>
