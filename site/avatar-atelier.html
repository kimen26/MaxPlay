<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxPlay — Atelier avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mp-theme.css">
<style>
  .page { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  /* vestiaire : les 3 DERNIERS avatars validés */
  .vestiaire { display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.05);
               border:1px solid rgba(255,255,255,.09); border-radius:999px; padding:4px 7px; flex-shrink:0; }
  .vestiaire .vitem { width:30px; height:30px; border-radius:50%; display:flex; align-items:center;
                    justify-content:center; cursor:pointer; overflow:hidden; border:0; padding:0; background:rgba(255,255,255,.08); }
  .vestiaire img { width:100%; height:100%; object-fit:contain; }

  /* onglets au-dessus du rond */
  .onglets { display:flex; justify-content:center; gap:8px; padding:10px 0 2px; }
  .onglet { border-radius:999px; padding:8px 16px; font-weight:900; font-size:13px; cursor:pointer;
            background:rgba(255,255,255,.07); color:var(--ink-3); border:0; font-family:'Nunito',sans-serif; }
  .onglet.on { background:var(--gold); color:var(--gold-ink); }

  /* avatar + 3 pastilles couleurs actuelles */
  .scene { display:flex; align-items:center; justify-content:center; gap:18px; padding:10px 0 2px; }
  .big-avatar { width:150px; height:150px; border-radius:50%; border:4px solid var(--gold);
                background:radial-gradient(circle at 35% 30%, var(--card-2), var(--card));
                display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .big-avatar img { width:118px; height:118px; object-fit:contain; }
  /* flash de zone : montre QUELS pixels la pastille tapée va changer */
  .big-avatar .zflash { position:absolute; left:50%; top:50%; width:118px; height:118px;
                        transform:translate(-50%,-50%); object-fit:contain; pointer-events:none; opacity:0; }
  .big-avatar .zflash.go { animation:zflash .65s ease-out; }
  @keyframes zflash { 0%,100%{opacity:0} 20%,45%{opacity:.9} 60%{opacity:.15} 80%{opacity:.7} }
  .pastilles { display:flex; flex-direction:column; gap:8px; }
  .pastilles button { width:27px; height:27px; border-radius:50%; border:2px solid rgba(255,255,255,.35); cursor:pointer; padding:0; }
  .pastilles button.active { box-shadow:0 0 0 3px #fff; }

  /* nom du dino au-dessus du grand rond */
  .dino-name { text-align:center; font-family:'Fredoka One'; font-size:19px; padding:6px 0 0; min-height:24px; }

  /* choix du dino : liste 3 colonnes, ouverte au tap sur le grand dino, refermée après choix */
  .dino-grid { margin:10px 14px 0; display:none; grid-template-columns:repeat(3,1fr); gap:8px; }
  .dino-grid.open { display:grid; }
  .dino-grid button { border-radius:14px; border:2px solid transparent;
                      background:rgba(255,255,255,.06); padding:8px 4px 6px; cursor:pointer;
                      display:flex; flex-direction:column; align-items:center; gap:4px; }
  .dino-grid button.on { border-color:var(--accent); background:var(--accent-soft); }
  .dino-grid img { width:56px; height:56px; object-fit:contain; }
  .dino-grid small { font-size:11.5px; font-weight:900; color:var(--ink-2); font-family:'Nunito',sans-serif;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* triplets */
  .triplets { display:flex; justify-content:center; gap:8px; padding:12px 14px 8px; }
  .triplet { border:2px solid transparent; background:rgba(255,255,255,.05); border-radius:12px;
             padding:7px 9px; display:flex; flex-direction:column; gap:4px; align-items:center; cursor:pointer; }
  .triplet.on { border-color:var(--accent); background:var(--accent-soft); }
  .triplet .cc { display:flex; gap:4px; } .triplet .cc span { width:19px; height:19px; border-radius:7px; display:block; }
  .triplet small { font-size:12px; }

  /* nuancier */
  .nuancier { margin:2px 14px; background:var(--card); border:1px solid var(--line);
              border-radius:var(--r-card); padding:12px; display:flex; flex-direction:column; gap:9px; }
  .nuancier .t { font-size:12px; font-weight:900; color:var(--accent); }
  .nuancier .g { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .nuancier .g span { aspect-ratio:1; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }

  /* mode retouche */
  .retouche { display:none; }
  .retouche.on { display:flex; flex-direction:column; gap:7px; }
  .neutres { display:flex; justify-content:center; gap:7px; }
  .neutres span { width:26px; height:26px; border-radius:8px; cursor:pointer; }

  /* onglet ambiance */
  .ambiances { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px 14px; }
  .amb-tile { border-radius:14px; border:2px solid transparent; padding:8px 6px; cursor:pointer;
              display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card); }
  .amb-tile.on { border-color:var(--accent); }
  .amb-preview { width:64px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .amb-preview img { width:34px; height:34px; object-fit:contain; }
  .amb-tile small { font-size:11.5px; font-weight:800; color:var(--ink-2); }

  .footer { margin-top:auto; padding:10px 14px 16px; }
  #normal, #ambiance-panel { display:none; }
  #normal.show, #ambiance-panel.show { display:block; }
</style>
</head>
<body data-av-nobadge>
<div class="page mp-page">

  <div class="mp-header">
    <button class="mp-back" onclick="location.href='index.html'">←</button>
    <div class="mp-title">Habille ton dino !</div>
    <div class="vestiaire" id="vestiaire"></div>
  </div>

  <div class="onglets">
    <span class="onglet on" id="tab-dino">🦕 Mon dino</span>
    <span class="onglet" id="tab-ambiance">🌈 Mon ambiance</span>
  </div>

  <div class="dino-name" id="dinoName"></div>

  <div class="scene">
    <div class="big-avatar" id="bigAvatarWrap" role="button" aria-label="Changer de dino"><img id="bigAvatar" alt="ton dino"></div>
    <div class="pastilles" id="pastilles"></div>
  </div>
  <div class="muted" style="text-align:center; font-size:10.5px; padding-top:4px">👆 tape ton dino pour en choisir un autre</div>

  <div class="dino-grid" id="dinoStrip"></div>

  <!-- MODE NORMAL : triplets + nuancier -->
  <div id="normal" class="show">
    <div class="triplets" id="triplets"></div>
    <div class="nuancier">
      <div class="t">Ta couleur ?</div>
      <div class="g" id="nuancierGrid"></div>
    </div>
  </div>

  <!-- MODE RETOUCHE : fleur nid d'abeille -->
  <div class="nuancier retouche" id="retouche">
    <div class="row">
      <span id="retoucheDot" style="width:18px;height:18px;border-radius:50%;border:2px solid #fff"></span>
      <span class="t grow" style="color:#fff">Change CETTE couleur :</span>
      <span class="muted" style="cursor:pointer" id="annulerRetouche">✕ fermer</span>
    </div>
    <div style="display:flex;justify-content:center">
      <svg width="196" height="176" viewBox="-95 -85 190 170" id="fleur"></svg>
    </div>
    <div class="neutres" id="neutres"></div>
    <div class="muted" style="text-align:center; font-size:10.5px">la fleur : vif au bord, doux au centre · bruns/gris en bas</div>
  </div>

  <!-- ONGLET AMBIANCE -->
  <div id="ambiance-panel">
    <div class="ambiances" id="ambiancesGrid"></div>
  </div>

  <div class="footer">
    <button class="mp-btn-primary" id="btnValider">C'est lui ! ✓</button>
  </div>
</div>

<script src="js/avatars.js"></script>
<script src="js/avatar-picker.js"></script>
<script src="js/mp-theme.js"></script>
<script src="js/textes-jeux.js"></script>
<script src="js/victory-sounds.js"></script>
<script src="js/celebrations.js"></script>
<script>
(function () {
  'use strict';

  // ═════════════════════════════════════════════════════════════════════
  // COULEURS — on réutilise la coloration d'ORIGINE (avatar-picker.js) :
  // les cibles sont des triplets [r,g,b] alignés sur les `bases` extraites
  // de l'image du dino ; recolorData préserve contour noir + ombrage.
  // Nuancier → 3 triplets proposés, générés autour de la teinte choisie
  // (même formule que les presets historiques : teinte imposée, saturation
  // et luminosité de chaque base conservées → rendu nuancé, jamais plat).
  // ═════════════════════════════════════════════════════════════════════
  // deco = petite scène dans la tuile (pas juste un dégradé)
  var AMBIANCES = [
    { id: 'nuit',   name: 'Nuit',   bg0: '#0a1226', bg1: '#0c1730', deco: ['🌙', '⭐', '✨'] },
    { id: 'jungle', name: 'Jungle', bg0: '#0a1f16', bg1: '#0d2b1d', deco: ['🌴', '🦜', '🌿'] },
    { id: 'ville',  name: 'Ville',  bg0: '#0b1c30', bg1: '#16304a', deco: ['🏙️', '🚌', '🚦'] },
    { id: 'espace', name: 'Espace', bg0: '#0d0a20', bg1: '#1a1245', deco: ['🪐', '🚀', '💫'] },
    { id: 'arcade', name: 'Arcade', bg0: '#12101f', bg1: '#171331', deco: ['👾', '🕹️', '🎯'] },
    { id: 'musee',  name: 'Musée',  bg0: '#14110d', bg1: '#211b12', deco: ['🏛️', '🦴', '🖼️'] }
  ];
  var VKEY = 'maxplay_avatar_vestiaire';
  var C = window.Avatar && Avatar.color; // helpers couleur d'origine

  // état courant
  var curId = (window.Avatar && Avatar.get()) || (window.MAXPLAY_AVATARS && MAXPLAY_AVATARS[0] && MAXPLAY_AVATARS[0].id);
  var curBases = null;     // bases [r,g,b] extraites de l'image du dino courant
  var curTargets = null;   // cibles [r,g,b] alignées sur curBases
  var curTriplets = [];    // 3 propositions générées depuis la teinte choisie
  var editingIdx = -1;     // pastille en cours de retouche (-1 = aucune)
  var basesCache = {};     // id dino -> bases

  function curFile() { return window.Avatar ? (Avatar.file(curId, 'joyeux') || Avatar.file(curId)) : null; }

  // bases du dino courant (async, cachées), puis cb()
  function withBases(cb) {
    if (basesCache[curId]) { curBases = basesCache[curId]; cb(); return; }
    var f = curFile();
    if (!f || !C) { curBases = null; cb(); return; }
    C.bases(f, function (bases) {
      basesCache[curId] = bases;
      curBases = bases;
      cb();
    });
  }

  // ── hex helpers ─────────────────────────────────────────────────────
  var hexCanvas = document.createElement('canvas'); hexCanvas.width = 1; hexCanvas.height = 1;
  var hexCtx = hexCanvas.getContext('2d');
  function toHex(cssColor) {
    try {
      hexCtx.fillStyle = '#000'; hexCtx.clearRect(0, 0, 1, 1);
      hexCtx.fillStyle = cssColor;
      hexCtx.fillRect(0, 0, 1, 1);
      var d = hexCtx.getImageData(0, 0, 1, 1).data;
      return '#' + [d[0], d[1], d[2]].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
    } catch (e) { return '#888888'; }
  }

  // ── 3 triplets proposés autour d'une teinte (formule presets historique) ──
  // mk(): teinte imposée, saturation/luminosité de CHAQUE base conservées
  // (avec variance par proposition) → nuancé et stylé, jamais aplati.
  // 2 emoji « de la couleur » (par teinte) — affichés sous chaque triplet
  function emojisForHue(h) {
    h = ((h % 360) + 360) % 360;
    if (h < 15 || h >= 345) return ['🍓', '❤️'];
    if (h < 40)  return ['🦊', '🍊'];
    if (h < 65)  return ['⭐', '🍌'];
    if (h < 95)  return ['🍏', '🍀'];
    if (h < 165) return ['🌿', '🐸'];
    if (h < 200) return ['🌊', '🐬'];
    if (h < 250) return ['💙', '🐳'];
    if (h < 290) return ['🍇', '🔮'];
    return ['🌸', '🦩'];
  }
  function tripletsFor(h) {
    if (!C || !curBases || !curBases.length) return [];
    // hueOff[i] = décalage de teinte pour la FAMILLE i (0 = famille principale).
    // Chaque famille garde la saturation/luminosité de sa base → nuancé, jamais plat.
    function mk(hueOff, sMul, sMin, lShift) {
      return curBases.map(function (base, i) {
        var hsl = C.rgb2hsl(base[0], base[1], base[2]);
        var hue = (h + (hueOff[i] || 0) + 360) % 360;
        var s = Math.max(sMin, Math.min(1, hsl[1] * sMul));
        var l = Math.max(0.14, Math.min(0.9, hsl[2] + lShift));
        return C.hsl2rgb(hue, s, l);
      });
    }
    var e0 = emojisForHue(h), e35 = emojisForHue(h + 35), e165 = emojisForHue(h + 165);
    function pair(a, b) { return a[0] + (b[0] === a[0] ? b[1] : b[0]); } // jamais 2× le même emoji
    return [
      { emo: e0[0] + e0[1],  t: mk([0, 0, 0], 1, 0.35, 0) },          // tout dans la teinte (nuancé par les bases)
      { emo: pair(e0, e35),  t: mk([0, 35, -25], 0.9, 0.3, 0.04) },   // duo : familles voisines de la teinte
      { emo: pair(e0, e165), t: mk([0, 165, 40], 1.2, 0.5, -0.03) }   // contraste : accent complémentaire
    ];
  }

  function applyTargets(t) {
    curTargets = t.map(function (c) { return c.slice(); });
    renderPastilles(); renderTriplets(); repaintBig();
  }

  // ── peindre le grand avatar ─────────────────────────────────────────
  // ⚠️ curTargets null = couleurs d'ORIGINE du dino → src direct.
  // Ne PAS passer null à paintInto : il retomberait sur les couleurs
  // stockées de l'avatar validé (mochetés sur un autre dino).
  function repaintBig() {
    var img = document.getElementById('bigAvatar');
    var file = curFile();
    if (!file) return;
    if (curTargets && window.Avatar) Avatar.paintInto(img, file, curTargets);
    else img.src = file;
  }

  // ── pastilles (couleurs actuelles, une par base) ─────────────────────
  function renderPastilles() {
    var el = document.getElementById('pastilles');
    el.innerHTML = '';
    var shown = curTargets || curBases || [];
    shown.forEach(function (c, i) {
      var b = document.createElement('button');
      b.style.background = C ? C.hex(c[0], c[1], c[2]) : '#888';
      b.className = (editingIdx === i) ? 'active' : '';
      b.setAttribute('aria-label', 'Changer la couleur ' + (i + 1));
      b.addEventListener('click', function () { openRetouche(i); });
      el.appendChild(b);
    });
  }

  // ── bande de choix du dino ────────────────────────────────────────────
  function renderDinoStrip() {
    var el = document.getElementById('dinoStrip');
    el.innerHTML = '';
    var list = (window.MAXPLAY_AVATARS || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'fr'); });
    list.forEach(function (a) {
      var b = document.createElement('button');
      b.className = (a.id === curId) ? 'on' : '';
      var f = Avatar.file(a.id, 'joyeux') || Avatar.file(a.id);
      b.innerHTML = '<img alt=""><small>' + a.name + '</small>';
      if (f) b.querySelector('img').src = f;
      b.title = a.name;
      b.addEventListener('click', function () {
        curId = a.id;
        editingIdx = -1;
        withBases(function () {
          curTargets = null;   // nouveau dino → ses couleurs d'origine
          curTriplets = [];
          renderDinoStrip(); renderPastilles(); renderTriplets(); repaintBig(); renderName();
        });
        closeDinoList(); // choix fait → la liste se range
        window.scrollTo({ top: 0, behavior: 'smooth' }); // on le voit en grand
        SoundPool && SoundPool.play && SoundPool.play('apparition');
      });
      el.appendChild(b);
    });
  }

  // ── nom du dino + ouverture/fermeture de la liste ─────────────────────
  function renderName() {
    var a = window.Avatar ? Avatar.byId(curId) : null;
    document.getElementById('dinoName').textContent = a ? a.name : '';
  }
  function openDinoList() {
    document.getElementById('dinoStrip').classList.add('open');
    document.getElementById('normal').classList.remove('show'); // place nette pour choisir
  }
  function closeDinoList() {
    document.getElementById('dinoStrip').classList.remove('open');
    document.getElementById('normal').classList.add('show');
  }
  document.getElementById('bigAvatarWrap').addEventListener('click', function () {
    var open = document.getElementById('dinoStrip').classList.contains('open');
    if (open) closeDinoList(); else openDinoList();
  });

  // ── triplets proposés (régénérés à chaque couleur du nuancier) ────────
  function sameTargets(a, b) {
    return !!a && !!b && JSON.stringify(a) === JSON.stringify(b);
  }
  function renderTriplets() {
    var el = document.getElementById('triplets');
    el.innerHTML = '';
    curTriplets.forEach(function (tr) {
      var d = document.createElement('div');
      d.className = 'triplet' + (sameTargets(tr.t, curTargets) ? ' on' : '');
      d.innerHTML = '<div class="cc">' + tr.t.map(function (c) {
        return '<span style="background:' + C.hex(c[0], c[1], c[2]) + '"></span>';
      }).join('') + '</div><small>' + tr.emo + '</small>';
      d.addEventListener('click', function () {
        editingIdx = -1;
        applyTargets(tr.t);
      });
      el.appendChild(d);
    });
  }

  // ── nuancier : choisir une teinte → 3 triplets proposés + aperçu direct ──
  var NUANCIER = ['#e0655a', '#f2a25c', '#ffd166', '#8fe388', '#3ec6e0', '#7fb4ff',
                  '#c9a4ff', '#ff9ecf', '#f2ead8', '#8a5a3a', '#5b6678'];
  function renderNuancier() {
    var el = document.getElementById('nuancierGrid');
    el.innerHTML = '';
    NUANCIER.forEach(function (cHex) {
      var s = document.createElement('span');
      s.style.background = cHex;
      s.addEventListener('click', function () { pickHueColor(cHex); });
      el.appendChild(s);
    });
    // 🎲 = variance forte historique : le clair reste, le reste en couleurs vives
    var dice = document.createElement('span');
    dice.style.background = 'rgba(255,255,255,.08)';
    dice.textContent = '🎲';
    dice.addEventListener('click', function () {
      if (!C || !curBases) return;
      editingIdx = -1;
      curTriplets = [];
      applyTargets(C.vivid(curBases));
      SoundPool && SoundPool.play && SoundPool.play('apparition');
    });
    el.appendChild(dice);
    // ↺ retour aux couleurs d'origine du dino
    var org = document.createElement('span');
    org.style.background = 'rgba(255,255,255,.08)';
    org.textContent = '↺';
    org.title = "Couleurs d'origine";
    org.addEventListener('click', function () {
      editingIdx = -1;
      curTargets = null; curTriplets = [];
      renderPastilles(); renderTriplets(); repaintBig();
    });
    el.appendChild(org);
  }
  function pickHueColor(cHex) {
    if (!C || !curBases) return;
    var rgb = C.fromHex(cHex);
    var h = C.rgb2hsl(rgb[0], rgb[1], rgb[2])[0];
    curTriplets = tripletsFor(h);
    editingIdx = -1;
    if (curTriplets.length) applyTargets(curTriplets[0].t); // feedback immédiat
  }
  // retouche manuelle d'UNE couleur (fleur / neutres)
  function applyToEditingOrLast(hexColor) {
    if (!C || !curBases) return;
    if (!curTargets) curTargets = curBases.map(function (c) { return c.slice(); });
    var idx = editingIdx >= 0 ? editingIdx : 0;
    curTargets[idx] = C.fromHex(hexColor);
    document.getElementById('retoucheDot').style.background = hexColor;
    renderPastilles(); renderTriplets(); repaintBig();
  }

  // ── mode retouche : fleur nid d'abeille (37 hexagones oklch) ──────────
  (function buildFleur() {
    var svg = document.getElementById('fleur');
    var S = 26, YS = 22.5, pts = '0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7';
    var rings = [
      { hexes: [[0, 0]], L: .95, C: .02 },
      { hexes: [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]], L: .88, C: .07 },
      { hexes: [[2,0],[1,1],[0,2],[-1,2],[-2,2],[-2,1],[-2,0],[-1,-1],[0,-2],[1,-2],[2,-2],[2,-1]], L: .78, C: .13 },
      { hexes: [[3,0],[2,1],[1,2],[0,3],[-1,3],[-2,3],[-3,3],[-3,2],[-3,1],[-3,0],[-2,-1],[-1,-2],[0,-3],[1,-3],[2,-3],[3,-3],[3,-2],[3,-1]], L: .66, C: .17 }
    ];
    rings.forEach(function (ring) {
      ring.hexes.forEach(function (pos) {
        var q = pos[0], r = pos[1];
        var x = S * (q + r / 2), y = YS * r;
        var hue = Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360);
        var p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        p.setAttribute('points', pts);
        p.setAttribute('transform', 'translate(' + x + ',' + y + ')');
        var oklchColor = 'oklch(' + ring.L + ' ' + ring.C + ' ' + hue + ')';
        p.setAttribute('fill', oklchColor);
        p.style.cursor = 'pointer';
        p.addEventListener('click', function () {
          svg.querySelectorAll('polygon').forEach(function (o) { o.removeAttribute('stroke'); });
          p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-width', '3');
          applyToEditingOrLast(toHex(oklchColor));
        });
        svg.appendChild(p);
      });
    });
  })();

  // ── neutres (retouche) ────────────────────────────────────────────────
  var NEUTRES = ['oklch(0.97 0.005 90)', 'oklch(0.88 0.03 80)', 'oklch(0.62 0.06 60)',
                 'oklch(0.45 0.04 50)', 'oklch(0.55 0.01 250)', 'oklch(0.3 0.01 250)'];
  (function renderNeutres() {
    var el = document.getElementById('neutres');
    NEUTRES.forEach(function (c) {
      var s = document.createElement('span');
      s.style.background = c;
      s.addEventListener('click', function () { applyToEditingOrLast(toHex(c)); });
      el.appendChild(s);
    });
  })();

  // ── flash de zone : la pastille tapée fait clignoter SES pixels sur le dino ──
  var maskCache = {}; // 'id:idx' -> dataURL
  function flashZone(idx) {
    var f = curFile();
    if (!f || !C || !C.zoneMask) return;
    var wrap = document.getElementById('bigAvatarWrap');
    var el = wrap.querySelector('.zflash');
    if (!el) {
      el = document.createElement('img');
      el.className = 'zflash'; el.alt = '';
      wrap.appendChild(el);
    }
    function show(url) {
      if (!url) return;
      el.src = url;
      el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    }
    var key = curId + ':' + idx;
    if (maskCache[key]) show(maskCache[key]);
    else C.zoneMask(f, idx, function (url) { maskCache[key] = url; show(url); });
  }

  function openRetouche(idx) {
    editingIdx = idx;
    flashZone(idx);
    document.getElementById('normal').classList.remove('show');
    document.getElementById('retouche').classList.add('on');
    var c = (curTargets || curBases || [])[idx];
    if (c && C) document.getElementById('retoucheDot').style.background = C.hex(c[0], c[1], c[2]);
    renderPastilles();
  }
  function closeRetouche() {
    editingIdx = -1;
    document.getElementById('normal').classList.add('show');
    document.getElementById('retouche').classList.remove('on');
    renderPastilles();
  }
  document.getElementById('annulerRetouche').addEventListener('click', closeRetouche);

  // ── vestiaire (3 derniers avatars validés) ────────────────────────────
  function getVestiaire() {
    try {
      var list = JSON.parse(localStorage.getItem(VKEY) || '[]');
      // purge entrées historiques au mauvais format (hex strings → rendu noir)
      return list.filter(function (v) {
        return v && v.id && Array.isArray(v.targets) && v.targets.every(function (c) { return Array.isArray(c) && c.length >= 3; });
      });
    } catch (e) { return []; }
  }
  function pushVestiaire(id, targets) {
    var list = getVestiaire().filter(function (v) { return !(v.id === id && sameTargets(v.targets, targets)); });
    list.unshift({ id: id, targets: targets });
    list = list.slice(0, 3);
    try { localStorage.setItem(VKEY, JSON.stringify(list)); } catch (e) {}
    renderVestiaire();
  }
  function renderVestiaire() {
    var el = document.getElementById('vestiaire');
    el.innerHTML = '';
    getVestiaire().forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'vitem';
      var f = window.Avatar ? Avatar.file(v.id, 'joyeux') : null;
      b.innerHTML = '<img alt="">';
      if (f && window.Avatar) Avatar.paintInto(b.querySelector('img'), f, v.targets);
      b.addEventListener('click', function () {
        curId = v.id; editingIdx = -1;
        withBases(function () {
          curTargets = v.targets ? v.targets.map(function (c) { return c.slice(); }) : null;
          curTriplets = [];
          renderDinoStrip(); renderPastilles(); renderTriplets(); repaintBig(); renderName();
        });
        closeDinoList();
      });
      el.appendChild(b);
    });
  }

  // ── onglets Mon dino / Mon ambiance ────────────────────────────────────
  function showDinoTab() {
    document.getElementById('tab-dino').classList.add('on');
    document.getElementById('tab-ambiance').classList.remove('on');
    document.querySelector('.scene').style.display = '';
    document.getElementById('dinoStrip').style.display = '';
    document.getElementById('normal').classList.add('show');
    document.getElementById('ambiance-panel').classList.remove('show');
  }
  function showAmbianceTab() {
    document.getElementById('tab-dino').classList.remove('on');
    document.getElementById('tab-ambiance').classList.add('on');
    document.querySelector('.scene').style.display = 'none';
    document.getElementById('dinoStrip').style.display = 'none';
    document.getElementById('normal').classList.remove('show');
    document.getElementById('retouche').classList.remove('on');
    document.getElementById('ambiance-panel').classList.add('show');
    renderAmbiances();
  }
  document.getElementById('tab-dino').addEventListener('click', showDinoTab);
  document.getElementById('tab-ambiance').addEventListener('click', showAmbianceTab);

  function renderAmbiances() {
    var el = document.getElementById('ambiancesGrid');
    el.innerHTML = '';
    var current = (window.MPTheme ? localStorage.getItem('maxplay_ambiance') : null) || 'nuit';
    AMBIANCES.forEach(function (a) {
      var d = document.createElement('div');
      d.className = 'amb-tile' + (a.id === current ? ' on' : '');
      var f = window.Avatar ? Avatar.file(curId, 'joyeux') : null;
      d.innerHTML =
        '<div class="amb-preview" style="position:relative;background:linear-gradient(180deg,' + a.bg0 + ',' + a.bg1 + ')">'
        + '<span style="position:absolute;top:2px;left:4px;font-size:13px">' + a.deco[0] + '</span>'
        + '<span style="position:absolute;top:3px;right:4px;font-size:11px">' + a.deco[1] + '</span>'
        + '<span style="position:absolute;bottom:2px;right:5px;font-size:10px">' + a.deco[2] + '</span>'
        + '<img alt="">'
        + '</div><small>' + a.name + '</small>';
      if (f) {
        if (curTargets && window.Avatar) Avatar.paintInto(d.querySelector('img'), f, curTargets);
        else d.querySelector('img').src = f; // origine (jamais les couleurs d'un autre dino)
      }
      d.addEventListener('click', function () {
        if (window.MPTheme) window.MPTheme.setAmbiance(a.id);
        if (window.SoundPool) SoundPool.play('apparition');
        renderAmbiances();
      });
      el.appendChild(d);
    });
  }

  // ── validation ─────────────────────────────────────────────────────────
  document.getElementById('btnValider').addEventListener('click', function () {
    if (window.Avatar) {
      Avatar.set(curId);
      Avatar.setColors(curTargets);
    }
    pushVestiaire(curId, curTargets);
    if (window.MPTheme) window.MPTheme.refresh();
    if (window.MaxFX && MaxFX.glow) MaxFX.glow(document.getElementById('bigAvatar'));
    setTimeout(function () { location.href = 'index.html'; }, 550);
  });

  // ── init ───────────────────────────────────────────────────────────────
  renderVestiaire();
  renderDinoStrip();
  renderNuancier();
  withBases(function () {
    // couleurs déjà validées pour ce dino → on les restaure, sinon origine
    var stored = window.Avatar ? Avatar.getColors() : null;
    if (stored && curBases && stored.length === curBases.length && Array.isArray(stored[0])) {
      curTargets = stored.map(function (c) { return c.slice(); });
    } else {
      curTargets = null; // couleurs d'origine du dino
    }
    // triplets par défaut : générés depuis la teinte dominante actuelle
    var seed = (curTargets || curBases || [])[0];
    if (seed && C) {
      var h = C.rgb2hsl(seed[0], seed[1], seed[2])[0];
      curTriplets = tripletsFor(h);
    }
    renderPastilles(); renderTriplets(); repaintBig(); renderName();
  });
})();
</script>
</body>
</html>
