<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revue des avatars — MaxPlay</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#141a3a; color:#fff; font-family:'Nunito',sans-serif; padding:16px; }
    h1 { font-size:1.3rem; margin-bottom:4px; }
    p.hint { color:#aab; font-size:.85rem; margin-bottom:16px; }
    h2 { font-size:1.05rem; margin:20px 0 8px; color:#ffe066; }
    h2 small { color:#889; font-weight:400; font-size:.8rem; }
    .row { display:flex; flex-wrap:wrap; gap:10px; }
    figure { background:#fff; border-radius:14px; padding:6px 6px 2px; text-align:center; width:118px; }
    figure img { width:106px; height:106px; object-fit:contain; }
    figcaption { font-size:.72rem; color:#334; font-weight:800; padding:2px 0 4px; }
    figcaption .num { display:inline-block; background:#141a3a; color:#ffe066; border-radius:8px;
                      padding:1px 7px; font-size:.8rem; margin-right:4px; }
    figcaption .mood { color:#778; font-weight:600; }
  </style>
</head>
<body>
  <h1>🦕 Revue des avatars</h1>
  <p class="hint">Tous les fichiers, numérotés. Dis-moi les numéros à garder ou à virer.</p>
  <div id="out"></div>
  <script src="js/avatars.js"></script>
  <script>
    var MOODLBL = { joyeux:'😄 joyeux', enerve:'😤 grognon', original:'🤪 farceur' };
    var list = (window.MAXPLAY_AVATARS || []).slice().sort(function(a,b){ return a.name.localeCompare(b.name,'fr'); });
    var n = 0, html = '';
    list.forEach(function(a){
      var files = [];
      ['joyeux','enerve','original'].forEach(function(m){
        (a.moods[m]||[]).forEach(function(f){ files.push({f:f, m:m}); });
      });
      html += '<h2>' + a.name + ' <small>' + a.sub + ' · ' + files.length + ' images</small></h2><div class="row">';
      files.forEach(function(e){
        n++;
        html += '<figure><img loading="lazy" src="' + window.MAXPLAY_AVATARS_BASE + e.f + '">' +
          '<figcaption><span class="num">' + n + '</span><span class="mood">' + MOODLBL[e.m] + '</span></figcaption></figure>';
      });
      html += '</div>';
    });
    document.getElementById('out').innerHTML = html;
  </script>
</body>
</html>
