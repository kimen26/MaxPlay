<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 9 — Les Œufs Cassés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body {
    font-family:'Nunito',sans-serif; font-weight:700; color:#fff;
    min-height:100dvh; overflow-x:hidden;
    background:
      radial-gradient(900px 420px at 50% -5%, rgba(255,120,60,.22), transparent 60%),
      linear-gradient(180deg,#241430 0%, #2e1a33 35%, #1c2b1a 75%, #12200f 100%);
    display:flex; justify-content:center;
  }
  .stage { position:relative; width:100%; max-width:520px; min-height:100dvh; padding:64px 16px 40px; display:flex; flex-direction:column; align-items:center; }

  .band {
    position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:60;
    display:flex; gap:10px; align-items:center; white-space:nowrap;
    background:rgba(0,0,0,.5); border:1px solid rgba(255,209,102,.4); border-radius:999px;
    padding:6px 16px; font-size:12px; font-weight:900; color:#ffe066; backdrop-filter:blur(6px);
  }
  .band a { color:#ffd166; text-decoration:none; }

  /* ── Décor ── */
  .fern { position:absolute; bottom:0; width:140px; pointer-events:none; opacity:.9; }
  .fern.left { left:-24px; }
  .fern.right { right:-24px; transform:scaleX(-1); }
  .cloud { position:absolute; width:110px; opacity:.3; pointer-events:none; animation:drift 14s ease-in-out infinite; }
  .cloud.c1 { top:100px; left:5%; }
  .cloud.c2 { top:160px; right:12%; width:85px; animation-delay:-6s; }
  @keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }

  /* ── Consigne ── */
  .consigne {
    position:relative; z-index:5; text-align:center; margin-top:6px;
    background:rgba(0,0,0,.4); border:2px solid rgba(255,209,102,.5);
    border-radius:22px; padding:14px 24px; min-height:104px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .consigne h1 { font-family:'Fredoka One',cursive; font-size:clamp(21px,5.6vw,28px); color:#ffe066; letter-spacing:1px; }
  .consigne p { font-size:15px; color:rgba(255,255,255,.85); margin-top:4px; }

  /* ── Nid, œufs, coquilles ── */
  .nest-zone { position:relative; z-index:4; margin-top:22px; width:100%; max-width:420px; height:290px; }
  .nest {
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:min(360px,92vw); height:210px; border-radius:50% / 34%;
    background:radial-gradient(ellipse at 50% 30%, #8a5a2b 0%, #6b421e 55%, #4a2c12 100%);
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 8px 14px rgba(0,0,0,.45);
  }
  .eggs {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    width:min(320px,84vw); display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-end; gap:4px 10px;
  }
  .slot { position:relative; width:64px; height:96px; display:flex; align-items:flex-end; justify-content:center; }
  .egg {
    width:56px; height:72px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:
      radial-gradient(circle at 30% 30%, rgba(176,116,52,.55) 0 7px, transparent 8px),
      radial-gradient(circle at 66% 52%, rgba(176,116,52,.45) 0 5px, transparent 6px),
      radial-gradient(circle at 44% 74%, rgba(176,116,52,.4) 0 6px, transparent 7px),
      radial-gradient(circle at 70% 82%, rgba(176,116,52,.35) 0 4px, transparent 5px),
      linear-gradient(160deg,#fff5da 0%, #f3d9a4 70%, #e6c282 100%);
    box-shadow:inset -6px -9px 14px rgba(120,70,20,.28), 0 6px 10px rgba(0,0,0,.35);
    animation:eggIdle 3.4s ease-in-out infinite;
  }
  .slot:nth-child(odd) .egg { animation-delay:-1.2s; }
  .slot:nth-child(3n) .egg { animation-delay:-2.1s; }
  @keyframes eggIdle { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg) translateY(-2px)} }
  .egg.shake { animation:eggShake .4s ease-in-out; }
  @keyframes eggShake {
    0%,100%{transform:rotate(0)} 20%{transform:rotate(-10deg) translateX(-3px)}
    45%{transform:rotate(9deg) translateX(3px)} 70%{transform:rotate(-7deg) translateX(-2px)} 88%{transform:rotate(5deg)}
  }
  /* Coquille cassée : moitié basse à bord dentelé, reste dans le nid */
  .shell {
    width:56px; height:38px;
    background:
      radial-gradient(circle at 30% 62%, rgba(176,116,52,.4) 0 5px, transparent 6px),
      radial-gradient(circle at 68% 78%, rgba(176,116,52,.35) 0 4px, transparent 5px),
      linear-gradient(160deg,#fdf0d0 0%, #eed3a0 70%, #dcba7c 100%);
    clip-path:polygon(0% 100%,0% 28%,10% 6%,20% 30%,32% 4%,44% 28%,56% 8%,68% 30%,80% 6%,90% 28%,100% 10%,100% 100%);
    border-radius:0 0 50% 50% / 0 0 90% 90%;
    box-shadow:inset -4px -6px 10px rgba(120,70,20,.3), 0 4px 8px rgba(0,0,0,.3);
    opacity:0;
  }
  .shell.on { opacity:1; animation:shellIn .35s ease both; }
  @keyframes shellIn { from{transform:scaleY(.5); opacity:0} to{transform:scaleY(1); opacity:1} }

  /* ── Bébés dinos qui trottinent ── */
  .baby {
    position:absolute; bottom:26px; left:50%; width:84px; margin-left:-42px; display:none;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); pointer-events:none;
  }
  .baby.pop { display:block; animation:babyPop .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes babyPop { 0%{transform:scale(0) translateY(20px)} 70%{transform:scale(1.15) translateY(-6px)} 100%{transform:scale(1) translateY(0)} }
  .baby.trot { display:block; animation:trotOff 2.2s ease-in both; }
  @keyframes trotOff {
    0% { transform:translate(0,0) rotate(0); opacity:1; }
    15% { transform:translate(8vw,-8px) rotate(4deg); }
    30% { transform:translate(16vw,0) rotate(-4deg); }
    45% { transform:translate(25vw,-8px) rotate(4deg); }
    60% { transform:translate(34vw,0) rotate(-4deg); }
    80% { transform:translate(46vw,-6px) rotate(3deg); opacity:1; }
    100% { transform:translate(60vw,0); opacity:0; }
  }

  /* ── Badges de recomptage ── */
  .badge {
    position:absolute; top:-10px; right:-8px; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka One',cursive; font-size:17px; color:#2a1c05;
    background:linear-gradient(145deg,#ffe066,#f0b73f);
    box-shadow:0 3px 0 #b8860b, 0 4px 8px rgba(0,0,0,.35);
    opacity:0; pointer-events:none;
  }
  .badge.on { opacity:1; animation:badgePop .4s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes badgePop { from{transform:scale(.2)} to{transform:scale(1)} }
  .slot.counted .egg { filter:drop-shadow(0 0 10px rgba(255,224,102,.8)); }

  /* ── Bouton d'éclosion ── */
  .hatch-btn {
    position:relative; z-index:5; margin-top:24px; border:none; cursor:pointer;
    font-family:'Fredoka One',cursive; font-size:clamp(18px,4.6vw,22px); color:#2a1c05;
    background:linear-gradient(145deg,#ffb45e,#f08c2e); border-radius:999px;
    padding:16px 30px; min-height:64px;
    box-shadow:0 6px 0 #b35c12, 0 12px 22px rgba(0,0,0,.4);
    transition:transform .12s ease; touch-action:manipulation;
    animation:hatchPulse 1.8s ease-in-out infinite;
  }
  @keyframes hatchPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .hatch-btn:active { transform:scale(.93); }
  .hatch-btn.gone { display:none; }

  /* ── Réponses chiffrées ── */
  .answers { position:relative; z-index:5; display:flex; gap:18px; margin-top:26px; min-height:92px; }
  .num-btn {
    width:92px; height:92px; border:none; border-radius:24px; cursor:pointer;
    font-family:'Fredoka One',cursive; font-size:44px; color:#2a1c05;
    background:linear-gradient(145deg,#ffe066,#f0b73f);
    box-shadow:0 6px 0 #b8860b, 0 12px 22px rgba(0,0,0,.4);
    transition:transform .12s ease; touch-action:manipulation;
  }
  .num-btn:active { transform:scale(.92); }
  .num-btn.wobble { animation:wobble .4s ease; }
  @keyframes wobble { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 50%{transform:translateX(7px)} 75%{transform:translateX(-4px)} }
  .num-btn.win { background:linear-gradient(145deg,#7fe7c4,#2fbf8f); box-shadow:0 6px 0 #157a56, 0 0 26px rgba(47,191,143,.7); color:#062e20; }
  .num-btn:disabled { cursor:default; }

  .message {
    position:relative; z-index:5; min-height:34px; margin-top:18px; text-align:center;
    font-family:'Fredoka One',cursive; font-size:20px; color:#ffe066; letter-spacing:.5px;
    opacity:0; transition:opacity .25s;
  }
  .message.show { opacity:1; animation:msgPop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes msgPop { from{transform:scale(.6)} to{transform:scale(1)} }

  .replay {
    position:relative; z-index:5; margin-top:12px; display:none;
    border:none; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:900; font-size:16px;
    color:#0e2b22; background:linear-gradient(145deg,#2fbf8f,#00c47a);
    border-radius:999px; padding:12px 28px; min-height:52px;
    box-shadow:0 5px 0 #0d7a54, 0 10px 18px rgba(0,0,0,.35);
  }
  .replay.show { display:inline-block; animation:msgPop .35s cubic-bezier(.34,1.56,.64,1); }
  .replay:active { transform:scale(.92); }
</style>
</head>
<body>
<div class="band">🎨 Maquette — Concept 9 <a href="index.html">← Sommaire</a></div>

<div class="stage">
  <img class="cloud c1" src="../img/decor/nuage_blanc.png" alt="">
  <img class="cloud c2" src="../img/decor/nuage_gris.png" alt="">
  <img class="fern left" src="../img/decor/fougere.png" alt="">
  <img class="fern right" src="../img/decor/fougere.png" alt="">

  <div class="consigne">
    <h1 id="consigne-title">🥚 8 œufs dorment dans le nid…</h1>
    <p id="consigne-sub">Certains bébés dinos ont très envie de sortir !</p>
  </div>

  <div class="nest-zone">
    <div class="nest"></div>
    <div class="eggs" id="eggs"></div>
  </div>

  <button class="hatch-btn" id="hatchBtn">🐣 C'est l'heure d'éclore !</button>
  <div class="answers" id="answers"></div>
  <div class="message" id="message"></div>
  <button class="replay" id="replay">🔁 Rejouer !</button>
</div>

<script>
(function () {
  'use strict';
  var TOTAL = 8;
  var HATCH = [1, 4, 6];            // indices des œufs qui éclosent (non adjacents)
  var REST = TOTAL - HATCH.length;  // 5
  var CHOICES = [4, 5, 6];
  var BABIES = [
    '../img/avatars/trex_joyeux_1.png',
    '../img/avatars/tritri_joyeux_3.png',
    '../img/avatars/brachio_joyeux_2.png'
  ];
  var eggsEl = document.getElementById('eggs');
  var answersEl = document.getElementById('answers');
  var msgEl = document.getElementById('message');
  var hatchBtn = document.getElementById('hatchBtn');
  var replayBtn = document.getElementById('replay');
  var phase = 'sleep';   // sleep → hatching → asking → done

  function sfx(src) {
    try { var a = new Audio(src); a.volume = 0.55; a.play().catch(function () {}); } catch (e) {}
  }
  function say(text) {
    msgEl.textContent = text;
    msgEl.classList.remove('show'); void msgEl.offsetWidth; msgEl.classList.add('show');
  }
  function setConsigne(title, sub) {
    document.getElementById('consigne-title').textContent = title;
    document.getElementById('consigne-sub').textContent = sub;
  }

  function build() {
    eggsEl.innerHTML = '';
    answersEl.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.innerHTML = '<div class="egg"></div><div class="shell"></div><span class="badge"></span>';
      if (HATCH.indexOf(i) !== -1) {
        var baby = document.createElement('img');
        baby.className = 'baby';
        baby.src = BABIES[HATCH.indexOf(i)];
        baby.alt = 'bébé dino';
        slot.appendChild(baby);
      }
      eggsEl.appendChild(slot);
    }
    hatchBtn.classList.remove('gone');
    replayBtn.classList.remove('show');
    msgEl.classList.remove('show');
    setConsigne('🥚 8 œufs dorment dans le nid…', 'Certains bébés dinos ont très envie de sortir !');
    phase = 'sleep';
  }

  function hatchSequence() {
    if (phase !== 'sleep') return;
    phase = 'hatching';
    hatchBtn.classList.add('gone');
    say('Chhhht… ça craque ! 🐣');
    var slots = eggsEl.children;
    HATCH.forEach(function (idx, k) {
      setTimeout(function () {
        var slot = slots[idx];
        var egg = slot.querySelector('.egg');
        var shell = slot.querySelector('.shell');
        var baby = slot.querySelector('.baby');
        egg.classList.add('shake');
        sfx('../sounds/fx/dino-oeuf-eclot.mp3');
        setTimeout(function () {
          egg.style.display = 'none';
          shell.classList.add('on');           // la coquille cassée RESTE dans le nid
          baby.classList.add('pop');
          setTimeout(function () {
            baby.classList.remove('pop');
            baby.classList.add('trot');        // le bébé trottine hors de l'écran
            sfx('../sounds/fx/dino-pas.mp3');
            setTimeout(function () { baby.style.display = 'none'; }, 2200);
          }, 900);
        }, 400);
      }, k * 1600);
    });
    // Quand tout le monde est parti : on pose la question
    setTimeout(function () {
      setConsigne('🥚 Combien d\'œufs sont encore dans le nid ?',
                  'Les coquilles vides, c\'est les partis. Compte les œufs entiers !');
      say('');
      msgEl.classList.remove('show');
      showAnswers();
      phase = 'asking';
    }, HATCH.length * 1600 + 3200);
  }

  function showAnswers() {
    answersEl.innerHTML = '';
    CHOICES.forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'num-btn';
      b.textContent = n;
      b.setAttribute('aria-label', n + ' œufs');
      b.addEventListener('click', function () { onAnswer(n, b); });
      answersEl.appendChild(b);
    });
  }

  function onAnswer(n, btn) {
    if (phase !== 'asking') return;
    if (n !== REST) {
      btn.classList.remove('wobble'); void btn.offsetWidth; btn.classList.add('wobble');
      say('Compte seulement les œufs entiers ! 💪');
      sfx('../sounds/fx/oups-doux.mp3');
      return;
    }
    phase = 'done';
    btn.classList.add('win');
    Array.prototype.forEach.call(answersEl.children, function (b) { b.disabled = true; });
    recount();
  }

  // Recomptage doux : badges 1..5 sur les œufs restants, un par un
  function recount() {
    var remaining = [];
    Array.prototype.forEach.call(eggsEl.children, function (slot, i) {
      if (HATCH.indexOf(i) === -1) remaining.push(slot);
    });
    remaining.forEach(function (slot, k) {
      setTimeout(function () {
        slot.classList.add('counted');
        var badge = slot.querySelector('.badge');
        badge.textContent = k + 1;
        badge.classList.add('on');
        sfx('../sounds/fx/xylophone-monte.mp3');
      }, 500 + k * 600);
    });
    setTimeout(function () {
      say('8 moins 3 partis… ça fait ' + REST + ' œufs ! 🎉');
      sfx('../sounds/fx/victoire-petite.mp3');
      replayBtn.classList.add('show');
    }, 500 + remaining.length * 600 + 400);
  }

  hatchBtn.addEventListener('click', hatchSequence);
  replayBtn.addEventListener('click', build);
  build();
})();
</script>
</body>
</html>
