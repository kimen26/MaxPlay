<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>POC — Les copains en bandes (scroll vertical, tire la bande → pour entrer)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Nunito',sans-serif; color:#fff; min-height:100dvh; overflow-x:hidden;
    background:
      radial-gradient(900px 500px at 85% -10%, #1d2a5e 0%, transparent 60%),
      radial-gradient(800px 500px at 0% 110%, #241a4d 0%, transparent 55%),
      linear-gradient(180deg,#0a0f24,#101638 60%,#141b42);
  }
  .poc-tag {
    position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:60;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); border-radius:999px;
    font:800 11px 'Nunito'; padding:4px 12px; color:#cdd6f4; white-space:nowrap;
  }
  .poc-tag a { color:#ffd166; text-decoration:none; }

  /* ── ZONE AVATAR (le dino du profil propose) ──────────────────── */
  .moi { display:flex; align-items:center; gap:10px; padding:44px 16px 4px; }
  .moi img { width:82px; height:82px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .bulle {
    position:relative; background:#1c2547; border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:9px 13px; font-weight:800; font-size:14px; line-height:1.35;
  }
  .bulle::before {
    content:''; position:absolute; left:-8px; top:30px; width:14px; height:14px;
    background:#1c2547; border-left:1px solid rgba(255,255,255,.14); border-bottom:1px solid rgba(255,255,255,.14);
    transform:rotate(45deg);
  }
  .bloc-titre { padding:10px 18px 7px; font-family:'Fredoka One'; font-size:15px; color:#ffd166; letter-spacing:.4px; }
  .decouv { display:flex; gap:10px; padding:0 16px; }
  .mini {
    flex:1; background:#182142; border:1px solid rgba(255,255,255,.12); border-radius:16px;
    padding:10px 8px 8px; text-align:center; cursor:pointer;
  }
  .mini .vig { width:100%; aspect-ratio:1; border-radius:12px; margin-bottom:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .mini b { font-size:11.5px; font-weight:900; display:block; line-height:1.15; }
  .mini .st { color:#ffd166; font-size:11px; letter-spacing:2px; }
  .prefs { display:flex; gap:8px; padding:2px 16px 4px; overflow-x:auto; scrollbar-width:none; }
  .prefs::-webkit-scrollbar { display:none; }
  .pref {
    flex:0 0 auto; display:flex; align-items:center; gap:6px; background:#182142;
    border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 12px 6px 7px;
    font-size:12px; font-weight:900;
  }
  .pref .pv { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* ── LES COPAINS : bandes pleine largeur, empilées (scroll vertical) ── */
  .copains-head { display:flex; align-items:baseline; justify-content:space-between; padding:14px 18px 8px; }
  .copains-head h2 { font-family:'Fredoka One'; font-size:17px; }
  .copains-head span { font-size:11.5px; font-weight:800; color:#8fa0d0; }
  .liste { display:flex; flex-direction:column; gap:14px; padding:0 16px 30px; }

  .bande {
    position:relative; width:100%; min-height:158px; overflow:hidden;
    background:linear-gradient(160deg,#1b2650,#121a3c);
    border:1px solid rgba(255,255,255,.14); border-radius:24px;
    display:flex; align-items:center; gap:4px; padding:10px 14px;
    touch-action:pan-y;              /* scroll vertical libre, le drag → est géré en JS */
    user-select:none; cursor:grab;
    will-change:transform;
  }
  .bande.drag { cursor:grabbing; }
  .bande.livre {
    background:linear-gradient(160deg,#4a3208,#241a04);
    border:2px solid #ffd166; box-shadow:0 0 22px rgba(255,209,102,.25);
  }
  .bande.livre .tranche { position:absolute; left:0; top:0; bottom:0; width:12px; background:linear-gradient(90deg,#8a6a20,#ffd166,#8a6a20); opacity:.8; }

  /* le dino : se dandine au repos, grossit quand on tire la bande */
  .bande .dino {
    height:118px; flex-shrink:0; object-fit:contain; pointer-events:none;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));
    animation:dandine 2.6s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  .bande.drag .dino { animation:none; }
  @keyframes dandine {
    0%,100% { transform:rotate(-2.5deg) translateY(0); }
    25%     { transform:rotate(2.5deg) translateY(-3px); }
    50%     { transform:rotate(-2.5deg) translateY(0); }
    75%     { transform:rotate(2.5deg) translateY(-3px); }
  }
  .bande .infos { flex:1; text-align:center; pointer-events:none; position:relative; z-index:2; }
  .bande b.nom { font-family:'Fredoka One'; font-size:22px; display:block; }
  .bande.livre b.nom { color:#ffd166; }
  .bande small.dom { font-weight:800; font-size:12.5px; color:#8fa0d0; display:block; }
  .bande.livre small.dom { color:#e8d9b0; }
  .bande .etoiles { margin-top:4px; color:#ffd166; font-size:13px; letter-spacing:2px; }

  /* flèches qui courent vers la droite (invite au geste) */
  .piste { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; gap:2px; pointer-events:none; }
  .piste i {
    width:10px; height:10px; border-top:3px solid #ffd166; border-right:3px solid #ffd166;
    transform:rotate(45deg); animation:court 1.2s ease-in-out infinite;
  }
  .piste i:nth-child(2){ animation-delay:.15s; } .piste i:nth-child(3){ animation-delay:.3s; }
  @keyframes court { 0%,100%{opacity:.15;} 50%{opacity:1;} }

  /* flottants thématiques dans la bande */
  .fl { position:absolute; pointer-events:none; opacity:.38; z-index:1; animation:flott 3.4s ease-in-out infinite; }
  @keyframes flott { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-7px) rotate(5deg);} }
  .fl.chiffre { font-family:'Fredoka One'; color:#ffd166; font-size:18px; }
  .fl.lettre { font-family:'Cursif',cursive; color:#9fe6b0; font-size:21px; }
  .fl img { width:30px; opacity:.5; }
  .fl.flag { width:22px; height:14px; border-radius:3px; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  .fl.puz { width:15px; height:15px; border-radius:5px; background:#8fa0d0; }

  /* ── REPAIRE (overlay qui arrive de la droite) ─────────────────── */
  .repaire {
    position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,#0c1226,#131a3f);
    transform:translateX(102%); transition:transform .35s cubic-bezier(.3,.9,.3,1);
    overflow-y:auto;
  }
  .repaire.show { transform:translateX(0); }
  .rep-head { display:flex; align-items:center; gap:12px; padding:48px 16px 6px; }
  .rep-head .bk { width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:#fff; font-size:20px; font-weight:900; cursor:pointer; }
  .rep-head img { width:64px; height:64px; object-fit:contain; }
  .rep-head b { font-family:'Fredoka One'; font-size:20px; display:block; }
  .rep-head span { font-size:12px; font-weight:800; color:#8fa0d0; }
  .rep-bulle { margin:10px 16px; background:#1c2547; border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:11px 14px; font-weight:800; font-size:14px; }
  .rep-jeu { display:flex; align-items:center; gap:12px; margin:8px 16px; background:#182142; border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:10px; }
  .rep-jeu .vig { width:64px; height:64px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .rep-jeu b { font-size:14.5px; font-weight:900; display:block; }
  .rep-jeu .st { color:#ffd166; font-size:12px; letter-spacing:2px; }
  .rep-note { text-align:center; color:#ffd166; font-weight:800; font-size:12.5px; padding:8px 20px 30px; }

  /* vignettes démo */
  .v-oeufs { background:linear-gradient(150deg,#4d3a12,#231a08); }
  .v-oeufs i { width:20%; aspect-ratio:.78; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:#f5e3c2; margin:0 2px; }
  .v-constel { background:radial-gradient(circle at 50% 45%, #16264d, #070d1d 80%); }
  .v-constel i { width:13%; aspect-ratio:1; border-radius:50%; background:#fff7d6; box-shadow:0 0 8px 3px rgba(255,240,180,.75); margin:0 3px; }
  .v-bus { background:linear-gradient(150deg,#3d3410,#1c1808); }
  .v-bus i { width:60%; height:34%; border-radius:6px; background:#2fbf8f; box-shadow:inset 0 -6px 0 rgba(0,0,0,.3); }
  .v-couleur { background:linear-gradient(150deg,#3d2c10,#1c1408); }
  .v-couleur i { width:26%; aspect-ratio:1; border-radius:50%; margin:0 2px; mix-blend-mode:screen; }
</style>
</head>
<body>
<div class="poc-tag">POC « Les bandes » — tire une bande → · <a href="index.html">sommaire</a></div>

<!-- ZONE AVATAR : le dino choisi dans le profil propose les jeux du moment -->
<div class="moi">
  <img id="moiAv" src="../img/avatars/tritri_joyeux_3.png" alt="Mon dino">
  <div class="bulle" id="moiBulle">Salut Max ! Regarde ce que j'ai trouvé pour toi aujourd'hui !</div>
</div>
<div class="bloc-titre">🔎 À découvrir</div>
<div class="decouv">
  <div class="mini"><div class="vig v-oeufs"><i></i><i></i><i></i></div><b>Les œufs surprises</b><span class="st">★★☆</span></div>
  <div class="mini"><div class="vig v-constel"><i></i><i></i><i></i></div><b>Les constellations</b><span class="st">★☆☆</span></div>
  <div class="mini"><div class="vig v-couleur"><i style="background:#e0655a"></i><i style="background:#ffd166"></i><i style="background:#4d9de0"></i></div><b>L'atelier peinture</b><span class="st">☆☆☆</span></div>
</div>
<div class="bloc-titre">❤️ Tes préférés</div>
<div class="prefs">
  <div class="pref"><div class="pv v-bus"><i></i></div>La course des bus</div>
  <div class="pref"><div class="pv v-constel"><i></i></div>Les potions</div>
</div>

<!-- LES COPAINS : bandes empilées, on scrolle, on TIRE une bande → pour entrer -->
<div class="copains-head"><h2>Les copains</h2><span>tire un copain vers la droite →</span></div>
<div class="liste" id="liste"></div>

<!-- REPAIRE overlay -->
<div class="repaire" id="repaire"></div>

<script src="../js/avatars.js"></script>
<script>
const AV = '../img/avatars/';
const OMB = '../img/dinos/ombres/';
const COPAINS = [
  { id:'spino', nom:'Spino', dom:'compter', av:'spino_joyeux_1.png', floats:'chiffres', stars:'★★★★☆☆☆☆☆',
    phrase:'Splish splash ! Avec moi, on compte les poissons et plein de trésors !',
    jeux:[{t:'Les œufs surprises',v:'v-oeufs',s:'★★★'},{t:'Les constellations',v:'v-constel',s:'★★☆'},{t:'Tout le monde monte !',v:'v-bus',s:'☆☆☆'}] },
  { id:'galli', nom:'Galli', dom:'lire & écrire', av:'galli_joyeux_1.png', floats:'lettres', stars:'★★☆☆☆☆☆☆☆',
    phrase:'Vite vite ! Les lettres dansent, attrape-les !',
    jeux:[{t:'Trouve la lettre',v:'v-constel',s:'☆☆☆'},{t:'Le tri des lettres',v:'v-oeufs',s:'★☆☆'}] },
  { id:'velo', nom:'Vélo', dom:'casse-têtes', av:'velo_joyeux_1.png', floats:'puzzle', stars:'★★★★★☆☆☆☆',
    phrase:'Chhht… un vrai détective réfléchit doucement.',
    jeux:[{t:'Trouve-le !',v:'v-oeufs',s:'★★★'},{t:'Les potions',v:'v-couleur',s:'★★☆'}] },
  { id:'para', nom:'Para', dom:'couleurs & monde', av:'paras_joyeux_1.png', floats:'drapeaux', stars:'★★★☆☆☆☆☆☆',
    phrase:'Tadada ! Je chante les couleurs et je voyage autour du monde !',
    jeux:[{t:'L\'atelier peinture',v:'v-couleur',s:'★★★'},{t:'Compte avec le monde',v:'v-bus',s:'★☆☆'}] },
  // dernière bande : le livre du Roi T-Rex = l'encyclopédie (même logique, même geste)
  { id:'trex', nom:'L\'encyclopédie', dom:'le royaume du Roi T-Rex · 62 dinos', av:'trex_joyeux_1.png', floats:'ombres', stars:'', livre:true },
];
const FLAGS = [['#009c3b','#ffdf00','#002776'],['#0055a4','#fff','#ef4135'],['#aa151b','#f1bf00','#aa151b']];

/* ── avatar du profil (localStorage maxplay_avatar) en hôte de la zone du haut ── */
(function(){
  try{
    const id = localStorage.getItem('maxplay_avatar');
    const a = (window.MAXPLAY_AVATARS||[]).find(x=>x.id===id);
    if(a && a.moods.joyeux && a.moods.joyeux[0]){
      document.getElementById('moiAv').src = AV + a.moods.joyeux[0];
      if(a.name && a.name!=='Tritri')
        document.getElementById('moiBulle').textContent = 'Salut Max ! C\'est moi, '+a.name+' ! Regarde ce que j\'ai trouvé pour toi !';
    }
  }catch(e){}
})();

function floatsHtml(kind){
  let h='';
  for(let i=0;i<5;i++){
    const left=[30,34,60,66,50][i]+'%', top=[14,64,18,60,40][i]+'%', d=(i*0.5).toFixed(1)+'s';
    if(kind==='chiffres') h+='<span class="fl chiffre" style="left:'+left+';top:'+top+';animation-delay:'+d+'">'+[1,3,5,2,7][i]+'</span>';
    else if(kind==='lettres') h+='<span class="fl lettre" style="left:'+left+';top:'+top+';animation-delay:'+d+'">'+['a','m','s','o','l'][i]+'</span>';
    else if(kind==='ombres') h+='<span class="fl" style="left:'+left+';top:'+top+';animation-delay:'+d+'"><img src="'+OMB+['Triceratops_ombre.png','Diplodocus_ombre.png','Pteranodon_ombre.png','Velociraptor_ombre.png','Stegosaurus_ombre.png'][i]+'"></span>';
    else if(kind==='drapeaux'){ const f=FLAGS[i%3]; h+='<span class="fl flag" style="left:'+left+';top:'+top+';animation-delay:'+d+';background:linear-gradient(90deg,'+f[0]+' 33%,'+f[1]+' 33% 66%,'+f[2]+' 66%)"></span>'; }
    else h+='<span class="fl puz" style="left:'+left+';top:'+top+';animation-delay:'+d+'"></span>';
  }
  return h;
}

/* ── construction des bandes ── */
const liste = document.getElementById('liste');
COPAINS.forEach(c=>{
  const bande = document.createElement('div');
  bande.className='bande'+(c.livre?' livre':'');
  bande.innerHTML = (c.livre?'<div class="tranche"></div>':'') + floatsHtml(c.floats)
    + '<img class="dino" src="'+AV+c.av+'" alt="'+c.nom+'" draggable="false">'
    + '<div class="infos"><b class="nom">'+c.nom+'</b><small class="dom">'+c.dom+'</small>'
    + (c.stars?'<div class="etoiles">'+c.stars+'</div>':'') + '</div>'
    + '<div class="piste"><i></i><i></i><i></i></div>';
  liste.appendChild(bande);
  armDrag(bande, c);
});

/* ── LE geste : tirer la bande → le dino se dandine et grossit ── */
function armDrag(bande, c){
  const dino = bande.querySelector('.dino');
  let x0=null, y0=null, dx=0, raf=null, moved=false, annule=false;
  const render = ()=>{
    // la bande suit le doigt ; le dino se dandine (rotation oscillante + sauts) et grossit
    const wobble = Math.sin(dx*0.045)*Math.min(10, dx*0.06);
    const grow = 1 + Math.min(0.35, dx/500);
    const lift = Math.abs(Math.sin(dx*0.045))*Math.min(8, dx*0.05);
    bande.style.transform = 'translateX('+dx+'px)';
    dino.style.transform = 'translateY('+(-lift)+'px) rotate('+wobble+'deg) scale('+grow+')';
  };
  bande.addEventListener('pointerdown', e=>{
    x0=e.clientX; y0=e.clientY; dx=0; moved=false; annule=false;
  });
  bande.addEventListener('pointermove', e=>{
    if(x0===null || annule) return;
    const dy = e.clientY-y0;
    dx = Math.max(-20, e.clientX-x0);
    // geste surtout vertical → on laisse le scroll de la page faire son travail
    if(Math.abs(dy)>12 && Math.abs(dy)>Math.abs(dx)){ annule=true; x0=null; bande.style.transform=''; dino.style.transform=''; return; }
    if(dx>8){ moved=true; bande.classList.add('drag'); }
    if(moved && !raf) raf=requestAnimationFrame(()=>{ render(); raf=null; });
  });
  const fin = ()=>{
    if(x0===null){ setTimeout(()=>{ moved=false; }, 50); return; }
    const seuil = bande.clientWidth*0.32;   // ~1/3 de la bande → on entre
    x0=null; bande.classList.remove('drag');
    if(dx>seuil){
      // la bande part avec le dino qui gambade, puis le repaire arrive
      bande.style.transition='transform .3s ease-in';
      bande.style.transform='translateX('+bande.clientWidth+'px)';
      dino.style.transition='transform .3s ease-in';
      dino.style.transform='rotate(8deg) scale(1.35)';
      setTimeout(()=>{ openRepaire(c); }, 240);
      setTimeout(()=>{ bande.style.transition=''; bande.style.transform=''; dino.style.transition=''; dino.style.transform=''; }, 700);
    } else {
      // retour élastique
      bande.style.transition='transform .35s cubic-bezier(.3,1.6,.5,1)';
      bande.style.transform='';
      dino.style.transition='transform .35s cubic-bezier(.3,1.6,.5,1)';
      dino.style.transform='';
      setTimeout(()=>{ bande.style.transition=''; dino.style.transition=''; }, 380);
    }
    dx=0;
    setTimeout(()=>{ moved=false; }, 50);   // le click suit le pointerup : on le laisse lire "moved"
  };
  bande.addEventListener('pointerup', fin);
  bande.addEventListener('pointercancel', fin);
  // tap simple (sans déplacement) = entrer aussi
  bande.addEventListener('click', ()=>{ if(!moved) openRepaire(c); });
}

function openRepaire(c){
  if(c.livre){ alert('→ encyclopédie (dev-dinos.html)'); return; }
  const r = document.getElementById('repaire');
  r.innerHTML = '<div class="rep-head"><button class="bk" onclick="closeRepaire()">‹</button>'
    + '<img src="'+AV+c.av+'"><div><b>'+c.nom+'</b><span>'+c.dom+'</span></div></div>'
    + '<div class="rep-bulle">'+c.phrase+'</div>'
    + c.jeux.map(j=>'<div class="rep-jeu"><div class="vig '+j.v+'"><i></i><i></i><i></i></div><div><b>'+j.t+'</b><span class="st">'+j.s+'</span></div></div>').join('')
    + '<div class="rep-note">Obtiens ★★ sur un jeu pour ouvrir le suivant !</div>';
  requestAnimationFrame(()=>r.classList.add('show'));
}
function closeRepaire(){ document.getElementById('repaire').classList.remove('show'); }

// param de démo : ?repaire=spino ouvre directement
const q = new URLSearchParams(location.search);
if(q.get('repaire')){ const c = COPAINS.find(x=>x.id===q.get('repaire')); if(c) openRepaire(c); }
</script>
</body>
</html>
