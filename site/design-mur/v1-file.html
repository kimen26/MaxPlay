<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V1 « La file » — liste compacte, tire le dino →</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Nunito',sans-serif; color:#fff; min-height:100dvh; overflow-x:hidden;
    background:
      radial-gradient(900px 500px at 85% -10%, #1d2a5e 0%, transparent 60%),
      radial-gradient(800px 500px at 0% 110%, #241a4d 0%, transparent 55%),
      linear-gradient(180deg,#0a0f24,#101638 60%,#141b42);
  }
  .poc-tag {
    position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:60;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); border-radius:999px;
    font:800 11px 'Nunito'; padding:4px 12px; color:#cdd6f4; white-space:nowrap;
  }
  .poc-tag a { color:#ffd166; text-decoration:none; }

  /* ── HEADER FUSIONNÉ : 1 seul avatar = celui du profil ── */
  .moi { display:flex; align-items:center; gap:10px; padding:44px 16px 4px; }
  .moi .chip { position:relative; flex-shrink:0; }
  .moi .chip img { width:64px; height:64px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .moi .chip .tot {
    position:absolute; right:-6px; bottom:-4px; background:#ffd166; color:#4a3208;
    font:900 11px 'Nunito'; border-radius:999px; padding:2px 7px; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .bulle {
    position:relative; background:#1c2547; border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:9px 13px; font-weight:800; font-size:13.5px; line-height:1.35;
  }
  .bulle::before {
    content:''; position:absolute; left:-8px; top:26px; width:14px; height:14px;
    background:#1c2547; border-left:1px solid rgba(255,255,255,.14); border-bottom:1px solid rgba(255,255,255,.14);
    transform:rotate(45deg);
  }
  .bloc-titre { padding:10px 18px 7px; font-family:'Fredoka One'; font-size:15px; color:#ffd166; letter-spacing:.4px; }
  .decouv { display:flex; gap:10px; padding:0 16px; }
  .mini {
    flex:1; background:#182142; border:1px solid rgba(255,255,255,.12); border-radius:16px;
    padding:10px 8px 8px; text-align:center; cursor:pointer;
  }
  .mini .vig { width:100%; aspect-ratio:1; border-radius:12px; margin-bottom:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .mini b { font-size:11.5px; font-weight:900; display:block; line-height:1.15; }
  .mini .st { color:#ffd166; font-size:11px; letter-spacing:2px; }
  .prefs { display:flex; gap:8px; padding:2px 16px 4px; overflow-x:auto; scrollbar-width:none; }
  .prefs::-webkit-scrollbar { display:none; }
  .pref {
    flex:0 0 auto; display:flex; align-items:center; gap:6px; background:#182142;
    border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 12px 6px 7px;
    font-size:12px; font-weight:900;
  }
  .pref .pv { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* ── V1 LA FILE : petites lignes, SEUL le dino se tire ──
       Concept : liste scannable (Khan Kids, menus iOS) · cible tactile = le dino,
       pas de texte nécessaire · le nom est discret (dit à l'oral à l'entrée) ── */
  .copains-head { display:flex; align-items:baseline; justify-content:space-between; padding:12px 18px 6px; }
  .copains-head h2 { font-family:'Fredoka One'; font-size:16px; }
  .copains-head span { font-size:11px; font-weight:800; color:#8fa0d0; }
  .file { display:flex; flex-direction:column; gap:8px; padding:0 16px 30px; }

  .rang {
    position:relative; height:64px; border-radius:18px; overflow:hidden;
    background:linear-gradient(160deg,#1b2650,#121a3c);
    border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; padding:0 12px;
    user-select:none;
  }
  .rang.livre { background:linear-gradient(160deg,#4a3208,#241a04); border:1.5px solid #ffd166; }

  /* le dino : petite cible draggable, se dandine au repos */
  .rang .dino {
    height:52px; width:64px; object-fit:contain; flex-shrink:0; cursor:grab; touch-action:none;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
    animation:dandine 2.6s ease-in-out infinite; transform-origin:50% 90%;
  }
  .rang .dino.drag { animation:none; cursor:grabbing; }
  @keyframes dandine {
    0%,100% { transform:rotate(-3deg); } 25% { transform:rotate(3deg) translateY(-2px); }
    50% { transform:rotate(-3deg); } 75% { transform:rotate(3deg) translateY(-2px); }
  }
  .rang .qui { flex:1; min-width:0; pointer-events:none; }
  .rang .qui b { font-weight:900; font-size:13px; display:block; }
  .rang.livre .qui b { color:#ffd166; }
  .rang .qui small { font-weight:800; font-size:10.5px; color:#8fa0d0; display:block; }
  .rang .etoiles { color:#ffd166; font-size:10px; letter-spacing:1.5px; pointer-events:none; white-space:nowrap; }

  /* flottants : 2-3, petits, discrets */
  .fl { position:absolute; pointer-events:none; opacity:.4; animation:flott 3.4s ease-in-out infinite; }
  @keyframes flott { 0%,100%{transform:translateY(0) rotate(-5deg);} 50%{transform:translateY(-5px) rotate(5deg);} }
  .fl.chiffre { font-family:'Fredoka One'; color:#ffd166; font-size:15px; }
  .fl.lettre { font-family:'Cursif',cursive; color:#9fe6b0; font-size:17px; }
  .fl img { width:22px; opacity:.6; }
  .fl.flag { width:18px; height:12px; border-radius:3px; }
  .fl.puz { width:11px; height:11px; border-radius:4px; background:#8fa0d0; }

  .piste { display:flex; gap:2px; pointer-events:none; margin-left:8px; }
  .piste i {
    width:7px; height:7px; border-top:2.5px solid #ffd166; border-right:2.5px solid #ffd166;
    transform:rotate(45deg); animation:court 1.2s ease-in-out infinite;
  }
  .piste i:nth-child(2){ animation-delay:.15s; } .piste i:nth-child(3){ animation-delay:.3s; }
  @keyframes court { 0%,100%{opacity:.15;} 50%{opacity:1;} }

  /* ── REPAIRE (overlay depuis la droite) ── */
  .repaire {
    position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,#0c1226,#131a3f);
    transform:translateX(102%); transition:transform .35s cubic-bezier(.3,.9,.3,1); overflow-y:auto;
  }
  .repaire.show { transform:translateX(0); }
  .rep-head { display:flex; align-items:center; gap:12px; padding:48px 16px 6px; }
  .rep-head .bk { width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:#fff; font-size:20px; font-weight:900; cursor:pointer; }
  .rep-head img { width:64px; height:64px; object-fit:contain; }
  .rep-head b { font-family:'Fredoka One'; font-size:20px; display:block; }
  .rep-head span { font-size:12px; font-weight:800; color:#8fa0d0; }
  .rep-bulle { margin:10px 16px; background:#1c2547; border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:11px 14px; font-weight:800; font-size:14px; }
  .rep-jeu { display:flex; align-items:center; gap:12px; margin:8px 16px; background:#182142; border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:10px; }
  .rep-jeu .vig { width:64px; height:64px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .rep-jeu b { font-size:14.5px; font-weight:900; display:block; }
  .rep-jeu .st { color:#ffd166; font-size:12px; letter-spacing:2px; }
  .rep-note { text-align:center; color:#ffd166; font-weight:800; font-size:12.5px; padding:8px 20px 30px; }

  .v-oeufs { background:linear-gradient(150deg,#4d3a12,#231a08); }
  .v-oeufs i { width:20%; aspect-ratio:.78; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:#f5e3c2; margin:0 2px; }
  .v-constel { background:radial-gradient(circle at 50% 45%, #16264d, #070d1d 80%); }
  .v-constel i { width:13%; aspect-ratio:1; border-radius:50%; background:#fff7d6; box-shadow:0 0 8px 3px rgba(255,240,180,.75); margin:0 3px; }
  .v-bus { background:linear-gradient(150deg,#3d3410,#1c1808); }
  .v-bus i { width:60%; height:34%; border-radius:6px; background:#2fbf8f; box-shadow:inset 0 -6px 0 rgba(0,0,0,.3); }
  .v-couleur { background:linear-gradient(150deg,#3d2c10,#1c1408); }
  .v-couleur i { width:26%; aspect-ratio:1; border-radius:50%; margin:0 2px; mix-blend-mode:screen; }
</style>
</head>
<body>
<div class="poc-tag">V1 « La file » — tire le dino → · <a href="index.html">sommaire</a></div>

<!-- HEADER : l'avatar du profil est l'hôte (1 seul avatar, étoiles sur la chip) -->
<div class="moi">
  <div class="chip"><img id="moiAv" src="../img/avatars/tritri_joyeux_3.png" alt="Mon dino"><span class="tot">⭐ 22</span></div>
  <div class="bulle" id="moiBulle">Salut Max ! Regarde ce que j'ai trouvé pour toi aujourd'hui !</div>
</div>
<div class="bloc-titre">🔎 À découvrir</div>
<div class="decouv">
  <div class="mini"><div class="vig v-oeufs"><i></i><i></i><i></i></div><b>Les œufs surprises</b><span class="st">★★☆</span></div>
  <div class="mini"><div class="vig v-constel"><i></i><i></i><i></i></div><b>Les constellations</b><span class="st">★☆☆</span></div>
  <div class="mini"><div class="vig v-couleur"><i style="background:#e0655a"></i><i style="background:#ffd166"></i><i style="background:#4d9de0"></i></div><b>L'atelier peinture</b><span class="st">☆☆☆</span></div>
</div>
<div class="bloc-titre">❤️ Tes préférés</div>
<div class="prefs">
  <div class="pref"><div class="pv v-bus"><i></i></div>La course des bus</div>
  <div class="pref"><div class="pv v-constel"><i></i></div>Les potions</div>
</div>

<!-- V1 : LA FILE -->
<div class="copains-head"><h2>Les copains</h2><span>tire un dino vers la droite →</span></div>
<div class="file" id="file"></div>

<div class="repaire" id="repaire"></div>

<script src="../js/avatars.js"></script>
<script>
const AV = '../img/avatars/';
const OMB = '../img/dinos/ombres/';
const COPAINS = [
  { id:'spino', nom:'Spino', dom:'compter', av:'spino_joyeux_1.png', floats:'chiffres', stars:'★★★★☆☆☆☆☆',
    phrase:'Splish splash ! Avec moi, on compte les poissons et plein de trésors !',
    jeux:[{t:'Les œufs surprises',v:'v-oeufs',s:'★★★'},{t:'Les constellations',v:'v-constel',s:'★★☆'},{t:'Tout le monde monte !',v:'v-bus',s:'☆☆☆'}] },
  { id:'galli', nom:'Galli', dom:'lire & écrire', av:'galli_joyeux_1.png', floats:'lettres', stars:'★★☆☆☆☆☆☆☆',
    phrase:'Vite vite ! Les lettres dansent, attrape-les !',
    jeux:[{t:'Trouve la lettre',v:'v-constel',s:'☆☆☆'},{t:'Le tri des lettres',v:'v-oeufs',s:'★☆☆'}] },
  { id:'velo', nom:'Vélo', dom:'casse-têtes', av:'velo_joyeux_1.png', floats:'puzzle', stars:'★★★★★☆☆☆☆',
    phrase:'Chhht… un vrai détective réfléchit doucement.',
    jeux:[{t:'Trouve-le !',v:'v-oeufs',s:'★★★'},{t:'Les potions',v:'v-couleur',s:'★★☆'}] },
  { id:'para', nom:'Para', dom:'couleurs & monde', av:'paras_joyeux_2.png', floats:'drapeaux', stars:'★★★☆☆☆☆☆☆',
    phrase:'Tadada ! Je chante les couleurs et je voyage autour du monde !',
    jeux:[{t:'L\'atelier peinture',v:'v-couleur',s:'★★★'},{t:'Compte avec le monde',v:'v-bus',s:'★☆☆'}] },
  { id:'trex', nom:'L\'encyclopédie', dom:'62 dinos', av:'trex_joyeux_1.png', floats:'ombres', stars:'', livre:true },
];
const FLAGS = [['#009c3b','#ffdf00','#002776'],['#0055a4','#fff','#ef4135'],['#aa151b','#f1bf00','#aa151b']];

(function(){
  try{
    const id = localStorage.getItem('maxplay_avatar');
    const a = (window.MAXPLAY_AVATARS||[]).find(x=>x.id===id);
    if(a && a.moods.joyeux && a.moods.joyeux[0]){
      document.getElementById('moiAv').src = AV + a.moods.joyeux[0];
      if(a.name && a.name!=='Tritri')
        document.getElementById('moiBulle').textContent = 'Salut Max ! C\'est moi, '+a.name+' ! Regarde ce que j\'ai trouvé pour toi !';
    }
  }catch(e){}
})();

function floatsHtml(kind){
  let h='';
  for(let i=0;i<3;i++){
    const left=[38,58,80][i]+'%', top=[18,58,28][i]+'%', d=(i*0.6).toFixed(1)+'s';
    if(kind==='chiffres') h+='<span class="fl chiffre" style="left:'+left+';top:'+top+';animation-delay:'+d+'">'+[3,5,2][i]+'</span>';
    else if(kind==='lettres') h+='<span class="fl lettre" style="left:'+left+';top:'+top+';animation-delay:'+d+'">'+['a','m','o'][i]+'</span>';
    else if(kind==='ombres') h+='<span class="fl" style="left:'+left+';top:'+top+';animation-delay:'+d+'"><img src="'+OMB+['Triceratops_ombre.png','Diplodocus_ombre.png','Pteranodon_ombre.png'][i]+'"></span>';
    else if(kind==='drapeaux'){ const f=FLAGS[i%3]; h+='<span class="fl flag" style="left:'+left+';top:'+top+';animation-delay:'+d+';background:linear-gradient(90deg,'+f[0]+' 33%,'+f[1]+' 33% 66%,'+f[2]+' 66%)"></span>'; }
    else h+='<span class="fl puz" style="left:'+left+';top:'+top+';animation-delay:'+d+'"></span>';
  }
  return h;
}

const file = document.getElementById('file');
COPAINS.forEach(c=>{
  const rang = document.createElement('div');
  rang.className='rang'+(c.livre?' livre':'');
  rang.innerHTML = floatsHtml(c.floats)
    + '<img class="dino" src="'+AV+c.av+'" alt="'+c.nom+'" draggable="false">'
    + '<div class="qui"><b>'+c.nom+'</b><small>'+c.dom+'</small>'
    + (c.stars?'<div class="etoiles">'+c.stars+'</div>':'') + '</div>'
    + '<div class="piste"><i></i><i></i><i></i></div>';
  file.appendChild(rang);
  armDrag(rang.querySelector('.dino'), rang, c);
});

/* SEUL le dino se déplace : on l'attrape, on le tire → il se dandine et grossit */
function armDrag(dino, rang, c){
  let x0=null, dx=0, raf=null, moved=false;
  const render = ()=>{
    const wobble = Math.sin(dx*0.05)*Math.min(12, dx*0.07);
    const grow = 1 + Math.min(0.8, dx/220);        // il grossit franchement en traversant
    const lift = Math.abs(Math.sin(dx*0.05))*Math.min(10, dx*0.06);
    dino.style.transform = 'translate('+dx+'px,'+(-lift)+'px) rotate('+wobble+'deg) scale('+grow+')';
    dino.style.zIndex = 3;
  };
  dino.addEventListener('pointerdown', e=>{ x0=e.clientX; dx=0; moved=false; dino.classList.add('drag'); dino.setPointerCapture(e.pointerId); });
  dino.addEventListener('pointermove', e=>{
    if(x0===null) return;
    dx=Math.max(-16, e.clientX-x0);
    if(Math.abs(dx)>8) moved=true;
    if(!raf) raf=requestAnimationFrame(()=>{ render(); raf=null; });
  });
  const fin = ()=>{
    if(x0===null) return;
    const seuil = rang.clientWidth*0.30;
    x0=null; dino.classList.remove('drag');
    if(dx>seuil){
      dino.style.transition='transform .3s ease-in';
      dino.style.transform='translate('+rang.clientWidth+'px,0) rotate(10deg) scale(1.8)';
      setTimeout(()=>{ openRepaire(c); }, 240);
      setTimeout(()=>{ dino.style.transition=''; dino.style.transform=''; dino.style.zIndex=''; }, 700);
    } else {
      dino.style.transition='transform .35s cubic-bezier(.3,1.6,.5,1)';
      dino.style.transform=''; dino.style.zIndex='';
      setTimeout(()=>{ dino.style.transition=''; }, 380);
    }
    dx=0;
    setTimeout(()=>{ moved=false; }, 50);
  };
  dino.addEventListener('pointerup', fin);
  dino.addEventListener('pointercancel', fin);
  rang.addEventListener('click', ()=>{ if(!moved) openRepaire(c); });
}

function openRepaire(c){
  if(c.livre){ alert('→ encyclopédie (dev-dinos.html)'); return; }
  const r = document.getElementById('repaire');
  r.innerHTML = '<div class="rep-head"><button class="bk" onclick="closeRepaire()">‹</button>'
    + '<img src="'+AV+c.av+'"><div><b>'+c.nom+'</b><span>'+c.dom+'</span></div></div>'
    + '<div class="rep-bulle">'+c.phrase+'</div>'
    + c.jeux.map(j=>'<div class="rep-jeu"><div class="vig '+j.v+'"><i></i><i></i><i></i></div><div><b>'+j.t+'</b><span class="st">'+j.s+'</span></div></div>').join('')
    + '<div class="rep-note">Obtiens ★★ sur un jeu pour ouvrir le suivant !</div>';
  requestAnimationFrame(()=>r.classList.add('show'));
}
function closeRepaire(){ document.getElementById('repaire').classList.remove('show'); }

const q = new URLSearchParams(location.search);
if(q.get('repaire')){ const c = COPAINS.find(x=>x.id===q.get('repaire')); if(c) openRepaire(c); }
</script>
</body>
</html>
