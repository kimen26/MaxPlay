<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dinos — MaxPlay</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mp-theme.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100dvh; overflow:hidden;
  font-family:'Nunito',sans-serif;
  color:var(--ink);
  display:flex; flex-direction:column;
}
body { background:linear-gradient(180deg, var(--bg0), var(--bg1)); }

/* ── En-tête : normalisé .mp-header (← · icône+titre · [🔊]). Pas de compteur ⭐ (encyclopédie). ── */
.hdr { flex-shrink:0; }

/* ── Screens ── */
.screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
.screen.active { display:flex; }

/* ══════════════ MENU CATÉGORIES ══════════════ */
#menu-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px 12px;
  -webkit-overflow-scrolling:touch;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
#menu-scroll.mode-periode {
  display:flex; flex-direction:column; padding:0; overflow:hidden;
}
/* Mode familles : liste verticale (cartes horizontales pleine largeur, hauteur libre) */
#menu-scroll.mode-famille {
  display:flex; flex-direction:column; gap:12px;
}
.cat-card {
  border-radius:var(--r-card); padding:18px 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation; user-select:none;
  min-height:130px; position:relative; overflow:hidden;
  transition:transform 0.15s;
  border:1px solid var(--line);
}
.cat-card:active { transform:scale(0.94); }
.cat-emoji { font-size:2.8rem; margin-bottom:8px; line-height:1; }
.cat-label { font-family:'Fredoka One',cursive; font-weight:400; font-size:0.95rem; text-align:center; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
.cat-count { display:none; }

/* ── Cartes FAMILLE (horizontales, pleine largeur, vignette + texte) ── */
.fam-intro {
  grid-column:1/-1; font-size:0.82rem; line-height:1.45; opacity:0.9;
  padding:10px 14px; margin-bottom:2px; background:var(--card);
  border:1px solid var(--line);
  border-radius:12px; cursor:pointer;
}
.fam-card {
  display:flex; align-items:center; gap:14px;
  border-radius:var(--r-card); padding:12px; cursor:pointer; touch-action:manipulation;
  user-select:none; transition:transform 0.15s;
  width:100%; max-width:560px; margin:0 auto;
  border:1px solid var(--line);
}
.fam-card:active { transform:scale(0.98); }
.fam-thumb {
  flex-shrink:0; width:90px; height:90px; border-radius:var(--r-thumb); overflow:hidden;
  background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center;
}
/* Emblèmes Lunii = art clair (blanc/gris) déjà sur fond transparent → PAS d'invert (contrairement aux
   silhouettes _ombre.png ailleurs). Juste un léger drop-shadow pour la lisibilité sur fond coloré clair. */
.fam-thumb img { width:100%; height:100%; object-fit:contain; padding:6px; box-sizing:border-box; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
.fam-thumb-emoji { font-size:2.8rem; }
.fam-body { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
.fam-label { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.02rem; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.55); line-height:1.2; }
.fam-savant { font-size:0.72rem; opacity:0.66; font-style:italic; line-height:1.2; }
.fam-desc { font-size:0.8rem; opacity:0.94; line-height:1.3; }
.fam-count { font-size:0.76rem; font-weight:900; color:var(--gold); opacity:1; margin-top:3px; }
/* Légende œufs (NID v4, 2026-07-30) : au jeu, la couleur d'un œuf = sa famille */
.fam-oeuf { display:flex; align-items:center; gap:6px; font-size:0.72rem; opacity:.85; margin-top:4px; }
.fam-oeuf-visu { --oeuf-c:#f5e3c2; flex:none; width:13px; height:16px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:linear-gradient(160deg,#fff7e0 10%, var(--oeuf-c) 90%); border:1px solid rgba(255,255,255,.5); }

/* Bandeau d'explication en haut de la grille d'une famille */
.fam-explic-banner {
  grid-column:1/-1; display:flex; gap:10px; align-items:flex-start;
  background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:12px 14px; margin-bottom:2px;
}
.fam-explic-banner p { font-size:0.84rem; line-height:1.45; opacity:0.95; margin:0; }
/* HO-021 : la grille impose grid-auto-rows 150px — un bandeau doit garder sa hauteur de texte. */
.fam-explic-banner { align-self:start; }
.fam-explic-play {
  flex-shrink:0; width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(255,255,255,0.2); color:#fff; font-size:1.2rem; line-height:1;
}
.fam-explic-play:active { transform:scale(0.9); }

/* ══════════════ GRILLE DINOS ══════════════ */
/* 3 colonnes + vignette ronde teintée (maquette dinos-liste.html « grille A » validée) */
#grid-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px;
  -webkit-overflow-scrolling:touch;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;
  /* HO-021 : `auto` + hauteur mini portée par la carte elle-même. Avec grid-auto-rows:minmax(150px,…),
     la rangée d'un bandeau pleine largeur (section plantes) gardait 150 px de vide sous son texte. */
  grid-auto-rows:auto; align-content:start;
}
#grid-scroll::-webkit-scrollbar { width:8px; }
#grid-scroll::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); border-radius:4px; }
#grid-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.35); border-radius:4px; }
.dino-card {
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-card); padding:14px 8px 10px;
  min-height:150px; /* HO-021 : reprise du grid-auto-rows retiré (bandeau plantes) */
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  cursor:pointer; touch-action:manipulation; user-select:none;
  position:relative; overflow:hidden;
  transition:transform 0.12s, box-shadow 0.12s;
}
/* vignette ronde 66px, fond teinté famille (posé en inline style depuis le JS) */
.dino-thumb {
  width:66px; height:66px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  margin-bottom:8px;
}
.dino-thumb img { width:100%; height:100%; object-fit:contain; padding:8px; box-sizing:border-box; filter:invert(1) brightness(1.4) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
.card-badges {
  position:absolute; top:6px; right:6px;
  display:flex; flex-direction:column; gap:5px; z-index:10;
}
.badge {
  width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; font-weight:900;
  box-shadow:0 2px 7px rgba(0,0,0,0.55);
}
.badge-image {
  background:#2aa7ff; color:#fff; border:2px solid #cfeaff;
}
.badge-audio {
  background:#ffcc00; color:#000; border:2px solid #fff7a8;
  animation:badgePulse 1.8s ease-in-out infinite;
}
/* keyframes badgePulse + cardBounce → css/mp-theme.css §composants partagés (EP-074) */
.dino-card:active { transform:scale(0.93); }
.dino-card.bounce { animation:cardBounce 0.4s ease-out; }
.card-img {
  width:100%; max-width:170px; height:140px; object-fit:contain;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,0.55));
  margin-bottom:10px;
}
.card-name { font-family:'Fredoka One',cursive; font-weight:400; font-size:0.82rem; color:#fff; text-align:center; margin-bottom:4px; line-height:1.2; }
.card-regime { font-size:0.85rem; color:rgba(255,255,255,0.78); text-align:center; margin-bottom:4px; }
.card-region { font-size:0.78rem; color:rgba(255,255,255,0.55); text-align:center; margin-top:2px; line-height:1.2; }
.card-bar { position:absolute; bottom:0; left:0; right:0; height:4px; }

/* ── Plantes (HO-021) : vignettes en vraie couleur, pas de silhouette -> pas d'invert (contrairement a .dino-thumb img) ── */
/* `cover` sans padding : une PHOTO doit remplir le disque. `contain`+padding (herité de
   .dino-thumb, taillé pour des silhouettes détourées) laissait un carré dans le rond. */
.plante-thumb img { width:100%; height:100%; object-fit:cover; padding:0; border-radius:50%; filter:none; }
.plante-thumb-emoji, .plante-hero-emoji { font-size:2.2rem; }
.plante-hero-emoji { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
.plante-mangeurs { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
.plante-mangeur { display:flex; flex-direction:column; align-items:center; width:64px; cursor:pointer; touch-action:manipulation; }
.plante-mangeur:active { transform:scale(0.93); }
.plante-mangeur img { width:52px; height:52px; object-fit:contain; padding:4px; box-sizing:border-box; filter:invert(1) brightness(1.4) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
.plante-mangeur span { font-size:0.68rem; text-align:center; line-height:1.15; margin-top:2px; }

/* ══════════════ FICHE DINO ══════════════ */
#fiche-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:0 0 30px 0;
}

/* Hero */
.fiche-hero {
  position:relative; display:flex; align-items:center; justify-content:center;
  padding:20px 16px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,0.3),transparent);
}
.fiche-hero-img {
  max-height:200px; max-width:100%; object-fit:contain;
  filter:drop-shadow(0 4px 20px rgba(0,0,0,0.7));
}

/* Name block */
.fiche-name-block {
  padding:0 16px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.fiche-name { font-size:1.8rem; font-weight:900; color:#ffe066; flex:1; min-width:0; }
.fiche-full { font-size:0.8rem; color:rgba(255,255,255,0.4); font-style:italic; width:100%; }

/* Info sections */
.fiche-section {
  margin:0 12px 10px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start;
}
.fiche-section-icon { font-size:1.5rem; flex-shrink:0; margin-top:2px; }
.fiche-section-body { flex:1; min-width:0; }
.fiche-section-title {
  font-size:0.72rem; font-weight:900; color:rgba(255,255,255,0.45);
  text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;
}
.fiche-section-text {
  font-size:0.92rem; font-weight:700; color:#fff; line-height:1.45;
}
.fiche-section-sub {
  font-size:0.78rem; color:rgba(255,255,255,0.55); margin-top:3px;
}

/* Stats row */
.fiche-stats {
  margin:0 12px 10px;
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.stat-box {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:10px 12px;
}
.stat-label { font-size:0.68rem; font-weight:900; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
.stat-val { font-size:1rem; font-weight:900; color:#ffe066; }
.stat-comp { font-size:0.72rem; color:rgba(255,255,255,0.5); margin-top:2px; line-height:1.3; }

/* Speak button inside section */
.speak-btn {
  background:rgba(255,220,0,0.12); border:1px solid rgba(255,220,0,0.3);
  border-radius:8px; color:#ffe066; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.8rem; padding:4px 10px;
  cursor:pointer; touch-action:manipulation; flex-shrink:0;
  align-self:center;
}
.speak-btn:active { background:rgba(255,220,0,0.25); }
.speak-btn.playing { background:#e74c3c; border-color:#ff8a7a; color:#fff; animation:dino-story-pulse 1.1s ease-in-out infinite; }

/* Highlight box (fait/superpower) */
.fiche-highlight {
  margin:0 12px 10px;
  background:rgba(255,220,0,0.08); border:1px solid rgba(255,220,0,0.25);
  border-radius:14px; padding:14px;
  display:flex; gap:10px; align-items:flex-start;
}
.fiche-highlight-text {
  font-size:0.95rem; font-weight:700; color:#ffe066; line-height:1.5; flex:1;
}

/* ── Bouton histoire audio (duo Narrateur + Wex) ── */
.dino-story-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:calc(100% - 24px); margin:6px 12px 10px;
  min-height:60px; padding:14px 18px;
  background:linear-gradient(135deg,#6a3093,#a044ff);
  border:2px solid rgba(255,255,255,0.25); border-radius:16px;
  color:#fff; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.05rem;
  cursor:pointer; touch-action:manipulation;
  box-shadow:0 4px 14px rgba(160,68,255,0.35);
}
.dino-story-btn:active { transform:scale(0.97); }
.dino-story-eq { font-size:1.2rem; }
.dino-story-btn.playing {
  background:linear-gradient(135deg,#c0392b,#e74c3c);
  animation:dino-story-pulse 1.1s ease-in-out infinite;
}
.dino-story-btn.playing .dino-story-eq::before { content:'⏸ '; }
.dino-story-btn.playing .dino-story-eq { font-size:0; }
.dino-story-btn.playing .dino-story-eq::before { font-size:1.2rem; }
@keyframes dino-story-pulse { 0%,100% { box-shadow:0 4px 14px rgba(231,76,60,0.4); } 50% { box-shadow:0 4px 22px rgba(231,76,60,0.75); } }
/* Pastille version texte audio (repère Papa Yann : V1 = ancien texte, V2 = réécrit naturel) */
.audio-ver {
  font-size:0.62rem; font-weight:900; letter-spacing:0.5px;
  background:rgba(0,0,0,0.3); border-radius:6px; padding:2px 6px;
  margin-left:6px; opacity:0.75; align-self:center;
}

/* ── Pangée carrousel ── */
.pangee-carousel { position:relative; width:100%; aspect-ratio:2/1; border-radius:12px; overflow:hidden; background:#04263f; }
.pangee-slides { width:100%; height:100%; position:relative; }
.pangee-slide { position:absolute; inset:0; opacity:0; transition:opacity 0.7s ease; }
.pangee-slide.active { opacity:1; }
.pangee-img { width:100%; height:100%; object-fit:cover; display:block; }
.pangee-slide-cap { position:absolute; left:0; bottom:0; right:0; padding:8px 12px; background:linear-gradient(transparent,rgba(0,0,0,0.7)); display:flex; align-items:baseline; gap:8px; }
.pangee-slide-label { font-weight:900; font-size:1rem; color:#fff; }
.pangee-slide-ma { font-size:0.72rem; color:rgba(255,255,255,0.7); }
/* .mp-dots/.mp-dot → css/mp-theme.css §composants partagés (EP-074) */
.pangee-credit { text-align:center; font-size:0.6rem; color:rgba(255,255,255,0.3); margin-bottom:10px; }
.pangee-etapes { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.pangee-etape { background:rgba(80,160,255,0.08); border:1px solid rgba(80,160,255,0.2); border-radius:10px; padding:9px 11px; cursor:pointer; }
.pangee-etape:active { background:rgba(80,160,255,0.18); }
.pangee-etape-label { font-size:0.65rem; color:rgba(150,200,255,0.7); font-weight:900; text-transform:uppercase; letter-spacing:0.05em; }
.pangee-etape-titre { font-size:0.85rem; font-weight:900; color:#85c1e9; margin:2px 0 3px; }
.pangee-etape-texte { font-size:0.74rem; color:rgba(255,255,255,0.72); line-height:1.4; }
.pangee-pourquoi { background:rgba(255,200,80,0.1); border:1px solid rgba(255,200,80,0.25); border-radius:10px; padding:9px 11px; font-size:0.75rem; color:rgba(255,225,160,0.9); cursor:pointer; line-height:1.4; margin-bottom:8px; font-weight:700; }
.pangee-pourquoi:active { background:rgba(255,200,80,0.2); }
.pangee-funfact { background:rgba(100,200,255,0.1); border:1px solid rgba(100,200,255,0.25); border-radius:10px; padding:9px 11px; font-size:0.75rem; color:rgba(180,225,255,0.9); cursor:pointer; line-height:1.4; font-weight:700; }
.pangee-funfact:active { background:rgba(100,200,255,0.2); }

/* ── Extinction ── */
.ext-card { display:flex; gap:10px; background:rgba(255,80,0,0.08); border:1px solid rgba(255,80,0,0.2); border-radius:12px; padding:10px; cursor:pointer; }
.ext-card:active { background:rgba(255,80,0,0.18); }
.ext-card-emoji { font-size:2rem; flex-shrink:0; line-height:1; }
.ext-card-body { flex:1; }
.ext-card-titre { font-weight:900; font-size:0.88rem; color:#ff9060; margin-bottom:4px; }
.ext-card-texte { font-size:0.75rem; color:rgba(255,255,255,0.75); line-height:1.4; }
.ext-certitude { margin-top:5px; font-size:0.7rem; color:rgba(255,200,100,0.8); }
.ext-certitude span { margin-left:4px; font-weight:700; }
.ext-funfact { background:rgba(100,220,100,0.1); border:1px solid rgba(100,220,100,0.25); border-radius:12px; padding:10px 12px; font-size:0.78rem; color:rgba(200,255,200,0.9); cursor:pointer; line-height:1.4; font-weight:700; }
.ext-funfact:active { background:rgba(100,220,100,0.2); }

/* ── Fiche V1 : 4 grands panneaux colorés ── */
/* Galerie hero (maquette fiche-dino.html) : ~46vh min 280px, nav ‹ › rondes 44px, compteur n/N.
   Reste raisonnable (pas plein écran) pour laisser voir le nom tout de suite sous la photo. */
.v1-hero { position:relative; height:min(46vh, 320px); min-height:220px; margin:12px 12px 0; border-radius:var(--r-card); overflow:hidden; display:flex; align-items:center; justify-content:center; }
.v1-hero-img { max-height:100%; max-width:88%; object-fit:contain; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.55)); cursor:pointer; }
/* Les images de plantes sont VERTICALES (c'est le sujet : la hauteur). Le hero partage
   .v1-hero-img avec les fiches dino, calibre pour des scenes horizontales (max-width 88 %,
   contain) -> deux bandes vertes sur les cotes. Ici on remplit le bandeau et on cadre haut,
   on cadre BAS : c'est la qu'est l'enfant, le metre-etalon de la scene. */
/* Gros plan feuille/graines dans le bloc « Sa feuille et ses graines ». Absent tant que
   l'image n'est pas generee : le onerror retire l'element, le bloc reste correct sans lui. */
.plante-detail { display:block; width:100%; border-radius:12px; margin:8px 0 10px; cursor:pointer; }
.plante-hero-img { max-width:100%; width:100%; height:100%; object-fit:cover; object-position:center 72%; filter:none; }
.v1-hero-nm { position:absolute; left:16px; bottom:12px; text-shadow:0 2px 8px rgba(0,0,0,0.7); pointer-events:none; }
.v1-hero-nm b { display:block; font-family:'Fredoka One',cursive; font-weight:400; font-size:1.7rem; line-height:1.1; }
.v1-alias { display:block; font-size:0.74rem; color:#ffe0a0; font-weight:700; }
.v1-lat { display:block; font-size:0.78rem; opacity:0.85; font-style:italic; }
/* Nav ‹ › + compteur (affichés seulement si la fiche a plusieurs images) */
.v1-hero-nav {
  position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(10,18,38,.75); color:#fff; font-size:18px; font-weight:900; touch-action:manipulation;
}
.v1-hero-count {
  position:absolute; bottom:8px; right:10px; font-size:11px; font-weight:900; color:var(--ink-3);
  background:rgba(10,18,38,.8); border-radius:8px; padding:3px 8px; pointer-events:none;
}
/* Pellicule de vignettes sous la galerie hero (56×42, active = or, vidéo = pastille ▶) */
.v1-pellicule { display:flex; gap:6px; padding:8px 12px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.v1-pellicule::-webkit-scrollbar { display:none; }
.v1-vignette {
  width:56px; height:42px; flex-shrink:0; border-radius:var(--r-thumb); background:var(--card-2);
  border:2px solid transparent; cursor:pointer; position:relative; opacity:.65; overflow:hidden;
  touch-action:manipulation;
}
.v1-vignette img { width:100%; height:100%; object-fit:cover; display:block; }
.v1-vignette.on { border-color:var(--gold); opacity:1; }
.v1-vignette .v1-vid-badge {
  position:absolute; top:3px; right:3px; width:15px; height:15px; border-radius:50%;

<script>
// Charge le fichier de langue du dictionnaire UI dino AVANT dino-ui.js, meme mecanique
// que dinos-i18n.js (document.write = synchrone, requis avant le 1er rendu).
// Fichier absent -> 404 silencieux, dino-ui.js reste en FR (over() retombe sur {}).
(function () {
  var lang = (window.Lang && window.Lang.current()) || 'fr';
  if (lang !== 'fr' && /^[a-z]{2}(-[a-z]{2})?$/.test(lang)) {
    document.write('<script src="js/i18n/dino-ui-strings.' + lang + '.js"><\/script>');
  }
})();
</script>

<script>

/* ── i18n UI statique (dictionnaire dino-ui.js) ── */
document.title = T('page_titre');
document.getElementById('menu-titre').textContent = T('header_titre_menu');
document.getElementById('menu-lien-compte').textContent = T('lien_compte');
document.getElementById('mp-pill-famille').querySelector('span').textContent = T('onglet_familles');
document.getElementById('mp-pill-regime').querySelector('span').textContent = T('onglet_regime');
document.getElementById('mp-pill-periode').querySelector('span').textContent = T('onglet_voyage');
document.getElementById('mp-pill-epoque').querySelector('span').textContent = T('onglet_epoques');
document.getElementById('mp-pill-dico').querySelector('span').textContent = T('onglet_dico');

/* ── TTS ── (tts.js partagé : respell du lexique FR appliqué à l'utterance) */
function speakText(txt) {
  if (window.TTS) TTS.speak(txt, { rate: 0.88, pitch: 1.1 });
}
function stopSpeak() { if (window.TTS) TTS.cancel(); }

/* ── Voix réelle des MENUS (MP3 ElevenLabs) ──
   Narrateur H : régime / familles / époques / dico · Narratrice F : voyage.
   Si le MP3 manque ou ne charge pas → fallback speechSynthesis (on garde toujours l'existant). */
const MENU_VOICE = {
  regime:   window.AUDIO_DINOS + 'menu-regime.mp3',
  famille:  window.AUDIO_DINOS + 'menu-familles.mp3',
  periode:  window.AUDIO_DINOS + 'menu-voyage.mp3',
  epoque:   window.AUDIO_DINOS + 'menu-epoques.mp3',   // 2026-09-05 : onglets époques + dico avaient seulement le repli TTS
  dico:     window.AUDIO_DINOS + 'menu-dico.mp3',
};
let _menuAudio = null;
function _stopMenuAudio() { if (_menuAudio) { _menuAudio.pause(); _menuAudio = null; } }
function _playMenuSrc(src, fallbackTxt) {
  stopSpeak();
  _stopMenuAudio();
  if (typeof _stopDinoAudio === 'function') _stopDinoAudio();
  if (!src) { if (fallbackTxt) speakText(fallbackTxt); return; }
  _menuAudio = new Audio(src);
  _menuAudio.onended = _stopMenuAudio;
  _menuAudio.onerror = () => { _stopMenuAudio(); if (fallbackTxt) speakText(fallbackTxt); };
  _menuAudio.play().catch(() => { _stopMenuAudio(); if (fallbackTxt) speakText(fallbackTxt); });
}
function playMenuVoice(key, fallbackTxt) { _playMenuSrc(MENU_VOICE[key], fallbackTxt); }

/* ── Accroches FAMILLE / RÉGIME (vraies voix ElevenLabs, jouées à l'entrée de la grille) ──
   id famille → menu-fam-<id>.mp3 · id régime → menu-regime-<cat>.mp3. Fallback speechSynthesis si MP3 absent. */
const MENU_FAM_VOICE = {
  trex: window.AUDIO_DINOS + 'menu-fam-trex.mp3', cou_long: window.AUDIO_DINOS + 'menu-fam-cou_long.mp3',
  arme: window.AUDIO_DINOS + 'menu-fam-arme.mp3', cornu: window.AUDIO_DINOS + 'menu-fam-cornu.mp3',
  bec: window.AUDIO_DINOS + 'menu-fam-bec.mp3', raptor: window.AUDIO_DINOS + 'menu-fam-raptor.mp3',
  pterosaures: window.AUDIO_DINOS + 'menu-fam-pterosaures.mp3', enaliosaures: window.AUDIO_DINOS + 'menu-fam-enaliosaures.mp3',
  volant: window.AUDIO_DINOS + 'menu-fam-volant.mp3',
  mammiferes: window.AUDIO_DINOS + 'menu-fam-mammiferes.mp3', oiseaux: window.AUDIO_DINOS + 'menu-fam-oiseaux.mp3',
};
const MENU_REGIME_VOICE = {
  carnivores: window.AUDIO_DINOS + 'menu-regime-carnivores.mp3', herbivores: window.AUDIO_DINOS + 'menu-regime-herbivores.mp3',
  piscivores: window.AUDIO_DINOS + 'menu-regime-piscivores.mp3', omnivores: window.AUDIO_DINOS + 'menu-regime-omnivores.mp3',
};
function playFamVoice(famId, fallbackTxt) { _playMenuSrc(MENU_FAM_VOICE[famId], fallbackTxt); }
function playRegimeVoice(catId, fallbackTxt) { _playMenuSrc(MENU_REGIME_VOICE[catId], fallbackTxt); }

/* ── Voix réelle des PÉRIODES (« Le Jurassique ! ») — audio/dinos/<lang>/periodes/<id>.mp3.
   Branchement 2026-08-10 : le Set DINO_PERIODE_AUDIO du manifest évite tout 404
   (permien & cie sans MP3 → fallback dame direct, sans tenter de charger). ── */
function playPeriodeVoice(perId, fallbackTxt) {
  const hasMp3 = window.DINO_PERIODE_AUDIO && window.DINO_PERIODE_AUDIO.has(perId);
  _playMenuSrc(hasMp3 ? window.AUDIO_DINOS + 'periodes/' + perId + '.mp3' : null, fallbackTxt);
}

const MENU_FALLBACK = {
  regime:  T('tts_fallback_regime'),
  famille: (typeof DINO_FAMILLES_INTRO !== 'undefined' ? DINO_FAMILLES_INTRO : T('tts_fallback_famille')),

  document.querySelectorAll('.mp-pill').forEach(b => b.classList.remove('active'));

/* ── MENU principal ── */
function showMenu() {
  showScreen('menu');
  buildMenu();
}

function buildMenu() {
  const el = document.getElementById('menu-scroll');
  el.innerHTML = '';
  el.classList.remove('mode-periode', 'mode-famille', 'mode-dico');

  if (currentMode === 'regime') {
    buildMenuRegime(el);
  } else if (currentMode === 'famille') {
    el.classList.add('mode-famille');
    buildMenuFamille(el);
  } else if (currentMode === 'periode') {
    buildMenuPeriode(el);
  } else if (currentMode === 'epoque') {
    el.classList.add('mode-famille'); // 2026-09-05 : même gabarit pleine largeur que Familles (la grille 2 colonnes débordait à 420 px)
    buildMenuEpoque(el);
  } else if (currentMode === 'dico') {
    el.classList.add('mode-dico');
    buildMenuDico(el);
  }
}

/* ── MENU famille ──
   Carte horizontale : vignette emblème de FAMILLE (pas un dino représentatif) + bloc texte.
   FAM_EMBLEME_IMG = vignette réemployée des emblèmes Lunii (studio/dino/content/lunii/_sources-hd/,
   convertis fond transparent 256px dans site/img/dinos/familles/) — demande Papa Yann 2026-07-28
   « on pourrait pas utiliser les images qu'on a utilisées dans la Lunii ? ».
   11/11 familles couvertes (mammiferes + oiseaux convertis des sources HD Lunii le 2026-08-02). */
const FAM_EMBLEME_IMG = {
  trex: 'trex.png', cou_long: 'cou_long.png', arme: 'arme.png',
  cornu: 'cornu.png', bec: 'bec.png', raptor: 'raptor.png',
  pterosaures: 'pterosaures.png', enaliosaures: 'enaliosaures.png', volant: 'volant.png',
  mammiferes: 'mammiferes.png', oiseaux: 'oiseaux.png',
};
function famEmblemeSrc(famId) {
  const img = FAM_EMBLEME_IMG[famId];
  return img ? `img/dinos/familles/${img}` : '';
}
// png data ('Tyrannosaurus.jpg' | 'Tyrannosaurus.png') → silhouette 'ombres/Tyrannosaurus_ombre.png'
// (reste utilisé ailleurs : fiches dino individuelles, vignettes chrono du Voyage)
function ombreSrc(png) {
  if (!png) return '';
  const base = png.replace(/\.(jpg|png|webp)$/i, '');
  return `img/dinos/ombres/${base}_ombre.png`;
}
// Hex → rgba (pour le fond léger + bordure teintée des cartes famille, cf. maquette dinos-familles.html)
function hexToRgba(hex, alpha) {
  const h = (hex || '').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(full.substr(0, 2), 16) || 0;
  const g = parseInt(full.substr(2, 2), 16) || 0;
  const b = parseInt(full.substr(4, 2), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildMenuFamille(el) {
  // Intro COURTE et accrocheuse (le détail vit dans chaque carte / au clic)
  const intro = document.createElement('div');
  intro.className = 'fam-intro';
  intro.innerHTML = `<p>${T('menu_famille_intro')}</p>`;
  el.appendChild(intro);

  DINO_FAMILLES.forEach(fam => {
    const count = DINOS.filter(d => d.famille === fam.id).length;
    if (!count) return;
    const emblemeSrc = famEmblemeSrc(fam.id);
    const title = fam.sci || fam.label;        // nom scientifique en GROS
    const sub   = fam.label || '';             // surnom en sous-titre
    const card = document.createElement('div');
    card.className = 'fam-card';
    // Code couleur par famille (maquette dinos-familles.html) : fond léger rgba(.10-.12) + bordure rgba(.4)
    card.style.background = hexToRgba(fam.color, 0.12);
    card.style.borderColor = hexToRgba(fam.color, 0.4);
    card.innerHTML = `
      <div class="fam-thumb">
        ${emblemeSrc ? `<img src="${emblemeSrc}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <span class="fam-thumb-emoji" ${emblemeSrc ? 'style="display:none"' : ''}>${fam.emoji}</span>
      </div>
      <div class="fam-body">
        <div class="fam-label">${fam.emoji} ${title}</div>
        ${sub ? `<div class="fam-savant">${sub}</div>` : ''}
        <div class="fam-desc">${fam.desc}</div>
        <div class="fam-oeuf"><span class="fam-oeuf-visu" style="--oeuf-c:${fam.color}"></span>${T('menu_famille_legende_oeuf')}</div>
        <div class="fam-count">${esc(Tn('compteur_dinos', count))} →</div>
      </div>
    `;
    // Un seul son : on entre dans la grille, c'est elle qui dit le nom + l'origine grecque.
    card.addEventListener('click', () => { setTimeout(() => showGridFamille(fam.id), 250); });
    el.appendChild(card);
  });
}

/* ── MENU époque (5e onglet, ajouté 2026-07-28 — demande explicite Papa Yann « trier par époque »).
   RÈGLE FIGÉE « 4 onglets » (studio/dino/figees/encyclopedie.md) DÉFIGÉE ce jour pour ce 5e onglet ; la

function buildMenuEpoque(el) {
  const intro = document.createElement('div');
  intro.className = 'fam-intro';
  intro.innerHTML = `<p>${T('menu_epoque_intro')}</p>`;
  el.appendChild(intro);

  let ereCourante = null;
  DINO_PERIODES.forEach(per => {
    const count = DINOS.filter(d => d.periode === per.id).length;
    if (!count) return;
    // HO-021 : compte les plantes de la periode, affichees seulement si > 0 (DINO_PLANTES peut etre absent avant HO-020).
    const countPlantes = (typeof DINO_PLANTES !== 'undefined' ? DINO_PLANTES : []).filter(p => (p.periodes || []).includes(per.id)).length;
    if (per.ere && per.ere !== ereCourante) { ereCourante = per.ere; el.insertAdjacentHTML('beforeend', ereBandeauHtml(per.ere)); }
    const card = document.createElement('div');
    card.className = 'fam-card';
    card.style.background = hexToRgba(per.color, 0.12);
    card.style.borderColor = hexToRgba(per.color, 0.4);
    card.innerHTML = `
      <div class="fam-thumb">
        <span class="fam-thumb-emoji">${per.emoji}</span>
      </div>
      <div class="fam-body">
        <div class="fam-label">${per.emoji} ${per.label}</div>
        <div class="fam-savant">${per.range}</div>
        <div class="fam-desc">${per.desc}</div>
        <div class="fam-count">${esc(Tn('compteur_dinos', count))}${countPlantes ? ' · ' + esc(Tn('compteur_plantes', countPlantes)) : ''} →</div>
      </div>
    `;
    card.addEventListener('click', () => { setTimeout(() => showGridEpoque(per.id), 250); });
    el.appendChild(card);
  });
}

function buildMenuDico(el) {
  if (!document.getElementById('dico-style')) {
    const st = document.createElement('style'); st.id = 'dico-style';
    st.textContent = `
      #menu-scroll.mode-dico { padding:8px 10px 24px; overflow-y:auto; }
      .dico-card { background:#fff; border-radius:16px; padding:12px 14px; margin:8px 0; box-shadow:0 2px 6px rgba(0,0,0,.12); cursor:pointer; }
      .dico-card:active { transform:scale(.98); }
      .dico-head { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; }
      .dico-root { font-size:1.8rem; font-weight:800; color:#2c3e50; }
      .dico-sens { font-size:1.1rem; color:#16a085; font-weight:700; }
      .dico-langue { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:#7f8c8d; border-radius:8px; padding:2px 8px; }
      .dico-langue.latin { background:#c0392b; } .dico-langue.grec { background:#2980b9; }
      .dico-dinos { display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
      .dico-thumb { width:42px; height:42px; object-fit:contain; filter:invert(1) brightness(1.4) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
      .dico-count { font-size:.8rem; opacity:.6; margin-left:4px; }
    `;
    document.head.appendChild(st);
  }
  const intro = document.createElement('div');
  intro.className = 'fam-intro';
  intro.innerHTML = `<p>${T('menu_dico_intro')}</p>`;
  el.appendChild(intro);

  /* Les données (dinos-racines.js) stockent la langue en français ("grec"/"latin").
     La classe CSS garde cette valeur, seul le LIBELLÉ affiché est traduit. */
  function langueLabel(l) {
    const cle = { grec: 'langue_grec', latin: 'langue_latin' }[l];
    return cle ? T(cle) : l;
  }

  if (typeof DINO_RACINES === 'undefined' || !DINO_RACINES.racines) {
    const p = document.createElement('p'); p.style.padding = '16px'; p.textContent = T('menu_dico_indisponible'); el.appendChild(p); return;
  }
  const byId = {}; DINOS.forEach(d => byId[d.id] = d);
  DINO_RACINES.racines.filter(r => r.type === 'racine').forEach(r => {
    const card = document.createElement('div');
    card.className = 'dico-card';
    const thumbs = r.dinos.slice(0, 6).map(id => {
      const d = byId[id]; if (!d || !d.png) return '';
      return `<img class="dico-thumb" src="${ombreSrc(d.png)}" alt="${d.name}" title="${d.name}" loading="lazy" onerror="this.style.display='none'">`;
    }).join('');
    const langue = r.langue || '';
    card.innerHTML = `
      <div class="dico-head">
        <span class="dico-root">${r.cle}</span>
        <span class="dico-sens">= ${r.sens}</span>
        ${langue ? `<span class="dico-langue ${langue}">${langueLabel(langue)}</span>` : ''}
      </div>
      <div class="dico-dinos">${thumbs}<span class="dico-count">${esc(Tn('compteur_dinos', r.n))}</span></div>
    `;
    const mot = r.cle.replace(/-/g, '');
    const phrase = langue ? T('dico_phrase_tts', { mot: mot, langue: langueLabel(langue), sens: r.sens }) : T('dico_phrase_tts_sans_langue', { mot: mot, sens: r.sens });
    // Tap = dialogue 2 voix (narrateur + Wex) si le MP3 existe, sinon fallback dame.
    card.addEventListener('click', () => playDicoVoice(r.cle, phrase));
    el.appendChild(card);
  });
}

/* ── Bandeau d'ÈRE (macro-info, 2026-09-05) : partagé par le Voyage et l'onglet Époques.
   Données : DINO_ERES (dinos-data.js, traduit par dinos-i18n.js). Voix : audio/dinos/<lang>/ere-<id>.mp3, repli TTS. ── */
function ereBandeauHtml(ereId) {
  const e = (typeof DINO_ERES !== 'undefined' ? DINO_ERES : []).find(x => x.id === ereId);
  if (!e) return '';
  return `<div class="ere-bandeau" style="--ere:${e.color}">
      <span class="ere-emoji">${e.emoji}</span>
      <div class="ere-info">
        <div class="ere-label">${e.label} <span class="ere-surnom">· ${e.surnom}</span></div>
        <div class="ere-bornes">${e.bornes} — ${e.accroche}</div>
      </div>
      <button type="button" class="ere-play" onclick="playEreVoice('${e.id}')" aria-label="${e.label}">🔊</button>
    </div>`;
}
function playEreVoice(ereId) {
  const e = (typeof DINO_ERES !== 'undefined' ? DINO_ERES : []).find(x => x.id === ereId);
  _playMenuSrc(window.AUDIO_DINOS + 'ere-' + ereId + '.mp3', e ? e.label + ' ! ' + e.surnom + '. ' + e.accroche : '');
}

      const macro = ep.id === 'trias' ? buildPangeeBloc() : ep.id === 'extinction' ? buildExtinctionBloc() : '';
      return bandeau + `
        <div class="chrono-periode journey-ep" data-ep="${ep.id}" style="border-left:5px solid ${ep.color}">
          <div class="chrono-header" style="background:${ep.color}22">
            <div class="chrono-emoji" style="border-color:${ep.color}">${ep.emoji}</div>
            <div class="chrono-info">
              <div class="chrono-label">${ep.label}</div>
              <div class="chrono-range">${ep.date}</div>
            </div>
            <div class="ep-status" aria-hidden="true"></div>
          </div>
          <div style="padding:10px 12px 12px">
            <button class="v1-big journey-btn" onclick="playRecit('${ep.id}',this)" id="recit-${ep.id}-btn" style="margin:0 0 ${dinosHtml ? '10px' : '0'}">
              🎙️ ${T('journey_bouton_ecoute', { episode: ep.label })} <span class="dino-story-eq">▶</span>
            </button>
            ${dinosHtml}
          </div>
        </div>
      ` + macro;
    }).join('');

  el.appendChild(wrapper);
  pangeeStartAuto(); // carrousel des cartes (s'arrête seul quand le bloc quitte le DOM)
  _refreshJourneyNext(); // pointe la 1re époque dès l'ouverture
}

// Avancement du voyage : épisodes écoutés (mémoire de SESSION uniquement, vidé à chaque ouverture du menu).
let _journeyDone = new Set();
// Marque un épisode comme écouté + met à jour le fléchage "à écouter ensuite".
function _markRecitDone(id) {
  if (!id) return;
  _journeyDone.add(id);
  const ep = document.querySelector('.journey-ep[data-ep="' + id + '"]');
  if (ep) ep.classList.add('ep-done');
  _refreshJourneyNext();
}
// Pointe la prochaine époque non écoutée (premier épisode de JOURNEY pas dans _journeyDone).
function _refreshJourneyNext() {
  document.querySelectorAll('.journey-ep.ep-next').forEach(e => e.classList.remove('ep-next'));
  const next = JOURNEY.find(ep => !_journeyDone.has(ep.id));
  if (next) {
    const el = document.querySelector('.journey-ep[data-ep="' + next.id + '"]');
    if (el) el.classList.add('ep-next');
  }
}

// Joue le récit d'époque (audio/dinos/recit-<id>.mp3). Re-tap = stop. Fin = marqué écouté.
function playRecit(id, btnEl) {
  const src = window.AUDIO_DINOS + 'recit-' + id + '.mp3';
  stopSpeak();
  const wasThis = (_dinoAudioBtn === btnEl && _dinoAudio);
  _stopDinoAudio();
  if (wasThis) return;
  _dinoAudio = new Audio(src);
  _dinoAudioBtn = btnEl || null;
  if (_dinoAudioBtn) _dinoAudioBtn.classList.add('playing');
  _dinoAudio.onended = () => { _stopDinoAudio(); _markRecitDone(id); };
  _dinoAudio.onerror = _stopDinoAudio;
  _dinoAudio.play().catch(_stopDinoAudio);
}

function buildPangeeBloc() {
  const slides = PANGEE.etapes.map((e, i) => `
    <div class="pangee-slide${i===0?' active':''}" data-idx="${i}">
      <img class="pangee-img" src="${e.img}" alt="La Terre — ${e.label}" loading="lazy">
      <div class="pangee-slide-cap">
        <span class="pangee-slide-label">${e.label}</span>
        <span class="pangee-slide-ma">${e.ma}</span>
      </div>
    </div>
  `).join('');

  const dots = PANGEE.etapes.map((e, i) =>
    `<button class="mp-dot${i===0?' active':''}" data-idx="${i}"
      onclick="pangeeGoto(${i})" aria-label="${e.label}">${e.label}</button>`
  ).join('');

  const etapesHtml = PANGEE.etapes.map(e => `
    <div class="pangee-etape">
      <div class="pangee-etape-label">${e.label} · ${e.ma}</div>
      <div class="pangee-etape-titre">${e.titre}</div>
      <div class="pangee-etape-texte">${e.texte}</div>
    </div>
  `).join('');

  return `
    <div class="chrono-periode" id="periode-pangee" style="margin:8px 0 4px">
      <div class="chrono-header" style="background:rgba(80,160,255,0.15)">
        <div class="chrono-emoji">🌍</div>
        <div class="chrono-info">
          <div class="chrono-label" style="color:#5dade2">${PANGEE.titre}</div>
          <div class="chrono-range">${PANGEE.soustitre}</div>
          <div class="chrono-desc">${T('pangee_sous_desc')}</div>
        </div>
      </div>
      <div style="padding:12px">
        <button class="v1-big" onclick="playSpecial('pangee',this)" id="pangee-story-btn" style="margin:0 0 12px">
          🎙️ ${T('pangee_bouton_ecoute')} <span class="dino-story-eq">▶</span>
        </button>
        <div class="pangee-carousel" id="pangee-carousel">
          <div class="pangee-slides">${slides}</div>
        </div>
        <div class="mp-dots">${dots}</div>
        <div class="pangee-credit">${PANGEE.credit}</div>
        <div class="pangee-etapes">${etapesHtml}</div>
        <div class="pangee-pourquoi">
          💡 ${PANGEE.pourquoi}
        </div>
        <div class="pangee-funfact">
          🌍 ${PANGEE.fun_fact}
        </div>
      </div>
    </div>
  `;
}

let _pangeeIdx = 0, _pangeeTimer = null;
function pangeeGoto(idx) {
  const car = document.getElementById('pangee-carousel');
  if (!car) return;
  const slides = car.querySelectorAll('.pangee-slide');
  const dots = document.querySelectorAll('.mp-dot');
  if (!slides.length) return;
  _pangeeIdx = (idx + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === _pangeeIdx));
  dots.forEach((d, i) => d.classList.toggle('active', i === _pangeeIdx));
}
function pangeeStartAuto() {
  if (_pangeeTimer) clearInterval(_pangeeTimer);
  _pangeeTimer = setInterval(() => {
    if (!document.getElementById('pangee-carousel')) { clearInterval(_pangeeTimer); _pangeeTimer = null; return; }
    pangeeGoto(_pangeeIdx + 1);
  }, 2600);
}

/* ── Build fiche ── */
function regimeIcon(cat) {
  const icons = { carnivores:'🥩', herbivores:'🌿', piscivores:'🐟', omnivores:'🍃', volants_marins:'🌊' };
  return icons[cat] || '🍽️';
}
function regimelabel(regime) {
  return regime.replace(/[🥩🌿🐟🍃🌊]/g,'').replace(/\(.*?\)/g,'').trim();
}

/* ── Badges d'images et audio ── */
function hasDinoImages(dinoId) {
  const hasLocal = DINO_EXTRAS && DINO_EXTRAS[dinoId] && DINO_EXTRAS[dinoId].length > 0;
  const hasWiki = typeof DINO_WIKIMEDIA !== 'undefined' && DINO_WIKIMEDIA[dinoId] && DINO_WIKIMEDIA[dinoId].length > 0;
  return hasLocal || hasWiki;
}
function hasDinoAudio(dinoId) {
  return !!(DINO_AUDIO[dinoId] && Object.keys(DINO_AUDIO[dinoId]).length > 0);
}
function buildBadges(dinoId) {
  let b = '';
  if (hasDinoAudio(dinoId)) {
    b += `<div class="badge badge-audio" title="${T('badge_titre_audio')}">🎙️</div>`;
  }
  if (hasDinoImages(dinoId)) {
    b += `<div class="badge badge-image" title="${T('badge_titre_images')}">📸</div>`;
  }
  return b ? `<div class="card-badges">${b}</div>` : '';
}
/* ── Carte SVG monde (vraies silhouettes de pays, vendored js/dinos-world-map.js) ──
   Remplace les 6 patates dessinees a la main (dette signalee par Papa Yann) : on colore
   maintenant les vrais pays du(des) continent(s) du dino sur une vraie carte du monde.
   Gere les valeurs composites de dinos-data.js ("Amérique du Nord / Asie", "Eurasie et
   Amérique du Nord", "Amériques", "Eurasie") + le cas marin sans continent (énaliosaures). */
const CONTINENT_COLORS = {
  'Amérique du Nord': '#e74c3c',
  'Amérique du Sud':  '#e67e22',
  'Europe':           '#3498db',
  'Afrique':          '#f39c12',
  'Asie':             '#e91e63',
  'Antarctique':      '#00bcd4',
  'Océanie':          '#1abc9c',
};
// "Amérique du Nord / Asie" | "Eurasie et Amérique du Nord" | "Amériques" | "Eurasie" -> liste de continents reels
function _splitContinents(raw) {
  if (!raw) return [];
  if (raw === 'Amériques') return ['Amérique du Nord', 'Amérique du Sud'];
  if (raw === 'Eurasie') return ['Europe', 'Asie'];
  return raw.split(/\s*(?:\/|,|\bet\b)\s*/).map(s => s.trim()).filter(Boolean)
    .map(s => s === 'Eurasie' ? null : s).flatMap(s => s === null ? ['Europe', 'Asie'] : [s]);
}
// Cache : mémorise pour chaque pays actif la version "allumée" du path (fill+stroke injectés en dur
// dans l'attribut style="" de la balise). Pur remplacement de chaîne — pas de script à exécuter après
// insertion via innerHTML (un <script> injecté par innerHTML ne se lance jamais dans un navigateur).
let _wmapHighlightCache = null; // { iso: regex } construit une seule fois
function _wmapBuildCache() {
  _wmapHighlightCache = {};
  Object.keys(window.WORLD_MAP_CONTINENTS).forEach(iso => {
    // capture <path id="xx" .../>  ET  <g id="xx">...</g> (pays multi-morceaux type Angola, Argentine)
    // Le "/" final de self-close est EXCLU du groupe 1 (sinon injection cassée : ".../ style=..." invalide) —
    // bug reproduit et corrigé 2026-07-28 (regex greedy [^>]* avalait le "/" de "/>").
    _wmapHighlightCache[iso] = new RegExp('(<(?:path|g) id="' + iso + '"[^>]*?)\\s*(/?)>', 'g');
  });
}
function buildContinentMap(continent) {
  const activeContinents = _splitContinents(continent);
  const hasMap = typeof window.WORLD_MAP_SVG_INNER === 'string' && typeof window.WORLD_MAP_CONTINENTS === 'object';
  const label = continent || T('continent_marin_defaut');
  const primaryColor = CONTINENT_COLORS[activeContinents[0]] || '#5dade2';

  if (!hasMap) {
    // Filet de secours si l'asset vendored ne charge pas : pas de carte, juste le libellé.
    return `<div style="font-size:0.78rem;color:${primaryColor};font-weight:900;line-height:1.3">🌍 ${label}</div>`;
  }
  if (!_wmapHighlightCache) _wmapBuildCache();

  const onIds = Object.keys(window.WORLD_MAP_CONTINENTS).filter(iso => activeContinents.includes(window.WORLD_MAP_CONTINENTS[iso]));
  const highlightStyle = `fill:${primaryColor};stroke:rgba(255,255,255,.6);stroke-width:1.4;filter:url(#wmap-glow)`;
  let svgInner = window.WORLD_MAP_SVG_INNER;
  onIds.forEach(iso => {
    svgInner = svgInner.replace(_wmapHighlightCache[iso], `$1 style="${highlightStyle}"$2>`);
  });

  return `
    <div style="display:flex;align-items:center;gap:10px">
      <svg class="wmap-svg" viewBox="${window.WORLD_MAP_VIEWBOX}" width="180" height="105" style="border-radius:8px;background:rgba(0,60,120,0.35);flex-shrink:0">
        <defs>
          <filter id="wmap-glow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="0.7">${svgInner}</g>
      </svg>
      <div style="font-size:0.78rem;color:${primaryColor};font-weight:900;line-height:1.3">${label}</div>
    </div>
  `;
}

/* ── Galerie hero de la fiche : navigation ‹ › + pellicule (maquette fiche-dino.html) ── */
let _ficheSlides = [];
let _ficheIdx = 0;
function _ficheGoto(idx) {
  if (!_ficheSlides.length) return;
  _ficheIdx = (idx + _ficheSlides.length) % _ficheSlides.length;
  const s = _ficheSlides[_ficheIdx];
  const img = document.getElementById('v1-hero-img');
  if (img) { img.src = s.src; img.onerror = s.fallback ? function () { this.onerror = null; this.src = s.fallback; } : null; }
  const count = document.getElementById('v1-hero-count');
  if (count) count.textContent = (_ficheIdx + 1) + ' / ' + _ficheSlides.length;
  const vignettes = document.querySelectorAll('#v1-pellicule .v1-vignette');
  vignettes.forEach((v, i) => v.classList.toggle('on', i === _ficheIdx));
  if (vignettes[_ficheIdx]) vignettes[_ficheIdx].scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function buildFiche(d) {
  const cat = DINO_CATEGORIES.find(c => c.id === d.cat);
  const scroll = document.getElementById('fiche-scroll');

  // Fusion images locales + Wikimedia
  const localExtras = (DINO_EXTRAS[d.id] || []).map(e => {
    const cle = e.label && extraLabelCle(e.label);
    return {
      src: `img/dinos/${e.folder}/${e.file}`,
      label: (cle ? T(cle) : e.label) || d.name,
      type: e.folder
    };
  });
  const wikiExtras = (typeof DINO_WIKIMEDIA !== 'undefined' ? (DINO_WIKIMEDIA[d.id] || []) : []).map(e => ({
    src: e.url,
    label: e.label || d.name,
    type: e.type || 'wikimedia'
  }));
  const grokExtras = (typeof DINO_GROK !== 'undefined' ? (DINO_GROK[d.id] || []) : []).map(e => ({
    src: e.url,
    label: e.label || d.name,
    type: 'grok'
  }));
  const extras = [...grokExtras, ...localExtras, ...wikiExtras];

  const regEmoji = regimeIcon(d.cat);
  const perLabel = (DINO_PERIODES.find(p => p.id === d.periode) || {}).label || '';

  // Galerie hero : image paléoart principale + extras (photos/vidéos). Nav ‹ › + pellicule si plus d'1 image.
  _ficheSlides = [{ src: `img/dinos/paleoart/${d.png}`, fallback: ombreSrc(d.png), label: d.name, video: false }]
    .concat(extras.map(e => ({ src: e.src, fallback: null, label: e.label, video: /\.(mp4|webm|mov)(\?|$)/i.test(e.src) })));
  _ficheIdx = 0;
  const multi = _ficheSlides.length > 1;

  scroll.innerHTML = `
    <!-- HERO galerie (image principale + extras, swipe ‹ › si plusieurs) -->
    <div class="v1-hero" id="v1-hero" style="background:linear-gradient(135deg,${cat.color},${cat.color}55)">
      <img class="v1-hero-img" id="v1-hero-img" src="img/dinos/paleoart/${d.png}" alt="${d.name}"
           onclick="${multi ? `openCarousel(_ficheSlides.map(s=>({src:s.src,label:s.label})), _ficheIdx)` : ''}"
           onerror="this.onerror=null;this.src='${ombreSrc(d.png)}';this.onerror=function(){this.style.display='none'}">
      <div class="v1-hero-nm">
        <b>${d.name}</b>
        ${d.alias ? `<span class="v1-alias">${T('fiche_aussi_appele', { alias: d.alias })}</span>` : ''}
        <span class="v1-lat">${d.full}</span>
      </div>
      ${multi ? `
        <button class="v1-hero-nav" style="left:10px" onclick="_ficheGoto(_ficheIdx-1)">‹</button>
        <button class="v1-hero-nav" style="right:10px" onclick="_ficheGoto(_ficheIdx+1)">›</button>
        <span class="v1-hero-count" id="v1-hero-count">1 / ${_ficheSlides.length}</span>
      ` : ''}
    </div>
    ${multi ? `<div class="v1-pellicule" id="v1-pellicule">${_ficheSlides.map((s, i) => `
      <div class="v1-vignette${i===0?' on':''}" data-i="${i}" onclick="_ficheGoto(${i})">

    <!-- BLOC 1 — Son histoire -->

      <div class="v1-stats">

    <div class="v1-panel v1-c">
      <button class="v1-sp" onclick="playBloc('${d.id}','regime','${esc(T('fiche_tts_regime', { nom: esc(d.name), regime: esc(regimelabel(d.regime)), proies: esc(d.proies), chasseurs: esc(d.chasseurs), amis: esc(d.amis) }))}',this)">🔊</button>

      <div class="v1-list-box">${d.amis}</div>
      <p>🎯 ${T('fiche_label_ennemis')}</p>
      <div class="v1-list-box">${d.chasseurs}</div>
    </div>

    <!-- BLOC 4 — Le truc fou -->
    <div class="v1-panel v1-d">
      <button class="v1-sp" onclick="playBloc('${d.id}','funfact','${esc(T('fiche_tts_funfact', { superpouvoir: esc(d.superpower), fait: esc(d.fait) }))}',this)">🔊</button>
      <div class="v1-pic"><span class="v1-ic">✨</span><span class="v1-tt">${T('fiche_titre_truc_fou')}</span></div>

    ${DINO_VIDEOS[d.id] ? `
      <div class="fiche-video-wrap">
        <div class="fiche-video-title">🎬 ${DINO_VIDEOS[d.id].title || T('fiche_video_titre_defaut')}</div>

      </div>
    ` : ''}
    ${extras.length ? buildGalleryHTML(extras, d.name) : ''}
  `;

  // Carousel listeners
  const thumbs = scroll.querySelectorAll('.gallery-thumb');
  if (thumbs.length) {
    const srcs = Array.from(thumbs).map(img => ({ src: img.src, label: img.title || img.alt || '' }));
    thumbs.forEach((img, i) => {
      img.addEventListener('click', () => openCarousel(srcs, i));
    });
  }
}

function buildGalleryHTML(extras, name) {
  const thumbs = extras.map(e =>
    `<img class="gallery-thumb" src="${e.src}" alt="${e.label || name}" title="${e.label || ''}" loading="lazy">`
  ).join('');
  const labels = extras.map(e => `<span>${e.label || '?'}</span>`).join(' · ');
  return `
    <div class="fiche-gallery-title">📸 ${T('fiche_galerie_titre')} — <small style="font-weight:400;color:rgba(255,255,255,0.35)">${labels}</small></div>
    <div class="fiche-gallery">${thumbs}</div>
  `;
}

function esc(s) {
  return (s || '').replace(/'/g, '\\\'').replace(/"/g, '&quot;');
}

/* ── Carousel ── */
let carouselSrcs = [];
let carouselIdx = 0;

function openCarousel(srcs, idx) {
  carouselSrcs = srcs;
  carouselIdx = idx;
  const track = document.getElementById('carousel-track');
  const dots  = document.getElementById('carousel-dots');
  track.innerHTML = srcs.map(s =>
    `<div class="carousel-slide"><img src="${s.src}" alt="${s.label||''}"></div>`
  ).join('');
  dots.innerHTML = srcs.map((_, i) =>
    `<div class="c-dot${i===idx?' active':''}"></div>`
  ).join('');
  document.getElementById('carousel').classList.add('open');
  // Scroll to initial image
  requestAnimationFrame(() => {
    const slide = track.children[idx];
    if (slide) slide.scrollIntoView({ behavior:'auto', block:'nearest', inline:'center' });
  });
  updateCarouselLabel(idx);
  // Track scroll to update dots
  track.addEventListener('scroll', onCarouselScroll, { passive:true });
}

function onCarouselScroll() {
  const track = document.getElementById('carousel-track');
  const slideWidth = track.clientWidth;
  const newIdx = Math.round(track.scrollLeft / slideWidth);
  if (newIdx !== carouselIdx) {
    carouselIdx = newIdx;
    updateCarouselLabel(newIdx);
    document.querySelectorAll('.c-dot').forEach((d,i) => d.classList.toggle('active', i===newIdx));
  }
}

function updateCarouselLabel(idx) {
  const src = carouselSrcs[idx];
  document.getElementById('carousel-label').textContent = src && src.label ? src.label : '';
}

function closeCarousel() {
  document.getElementById('carousel').classList.remove('open');
  document.getElementById('carousel-track').removeEventListener('scroll', onCarouselScroll);
}

/* ── i18n des labels DINO_EXTRAS ──
   DINO_EXTRAS est un objet littéral évalué au chargement du script : le traduire dans le
   littéral appellerait T() avant que dino-ui.js/le fichier de langue soient garantis prêts.
   Solution : le littéral reste en FR (clé de mapping stable), et la traduction se fait au
   moment de l'AFFICHAGE (buildFiche) via ce mapping label FR → clé i18n. */
function extraLabelCle(labelFr) {
  switch (labelFr) {
    case 'Gros plan': return 'extra_label_gros_plan';
    case "Ce qu'il mange": return 'extra_label_mange_m';
    case "Ce qu'elle mange": return 'extra_label_mange_f';
    case 'Dans Paris !': return 'extra_label_paris';
    case 'Son monde': return 'extra_label_ecosysteme';
    case 'Le savais-tu ?': return 'extra_label_funfact';
    default: return null;
  }
}

let _dinoAudio = null, _dinoAudioBtn = null;
function _stopDinoAudio() {
  if (_dinoAudio) { _dinoAudio.pause(); _dinoAudio = null; }
  if (_dinoAudioBtn) { _dinoAudioBtn.classList.remove('playing'); _dinoAudioBtn = null; }
}
// Joue le MP3 du bloc si dispo, sinon parle le fallback. btnEl = élément bouton (état visuel).
function playBloc(dinoId, bloc, fallbackTxt, btnEl) {
  const src = DINO_AUDIO[dinoId] && DINO_AUDIO[dinoId][bloc];
  stopSpeak();
  const wasThis = (_dinoAudioBtn === btnEl && _dinoAudio);
  _stopDinoAudio();
  if (wasThis) return; // re-tap sur le même = stop
  if (!src) { if (fallbackTxt) speakText(fallbackTxt); return; }
  _dinoAudio = new Audio(src);
  _dinoAudioBtn = btnEl || null;
  if (_dinoAudioBtn) _dinoAudioBtn.classList.add('playing');
  _dinoAudio.onended = _stopDinoAudio;
  _dinoAudio.onerror = () => { _stopDinoAudio(); if (fallbackTxt) speakText(fallbackTxt); };
  _dinoAudio.play().catch(() => { _stopDinoAudio(); if (fallbackTxt) speakText(fallbackTxt); });
}
function playDinoStory(id) {
  const btn = document.getElementById('dino-story-btn');
  playBloc(id, 'recap', null, btn);
}
/* Phrase TTS des mesures, version i18n.
   _statsPhrase() vit dans dinos-data.js (canon FR gelé) et écrit ses unités en
   français en dur. On la remplace ici par une version qui passe par le
   dictionnaire, avec CONVERSION des valeurs pour les langues impériales — sinon
   l'anglais annoncerait "22 feet" pour un dino de 22 mètres. */
function statsPhraseI18n(d) {
  const n = v => String(DinoUI.longueur(v)).replace('.', ' ');
  const parts = [];
  parts.push(T(d.taille_vol ? 'stats_envergure' : 'stats_longueur',
               { n: n(d.taille_m), comparaison: d.comp_taille || '' }));
  if (d.hauteur_m) {
    parts.push(T('stats_hauteur', { n: n(d.hauteur_m), comparaison: d.comp_hauteur || '' }));
  }
  const poids = DinoUI.imperial()
    ? DinoUI.masse(d.poids_t) + ' ' + T('unite_kilos')
    : (d.poids_t >= 1 ? Math.round(d.poids_t) + ' ' + T('unite_mille_kilos')
                      : Math.round(d.poids_t * 1000) + ' ' + T('unite_kilos'));
  parts.push(T('stats_poids', { poids: poids, comparaison: d.comp_poids || '' }));
  return parts.join(' ');
}
function playBlocTaille(id, btnEl) {
  const d = DINOS.find(x => x.id === id);
  playBloc(id, 'taille', d ? (d.name + ' ! ' + statsPhraseI18n(d)) : '', btnEl);
}
