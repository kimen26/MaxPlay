<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dinos — MaxPlay</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100dvh; overflow:hidden;
  font-family:'Nunito',sans-serif;
  background:#0d1117; color:#fff;
  display:flex; flex-direction:column;
}

/* ── Shared header ── */
.hdr {
  flex-shrink:0; height:52px;
  background:rgba(0,0,0,0.5); border-bottom:2px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; padding:0 12px; gap:10px;
}
.hdr-back {
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
  border-radius:10px; color:#fff; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.95rem; padding:6px 14px; cursor:pointer;
  touch-action:manipulation;
}
.hdr-title { font-weight:900; font-size:1rem; flex:1; }
.hdr-speak {
  background:rgba(255,220,0,0.2); border:1px solid rgba(255,220,0,0.4);
  border-radius:10px; color:#ffe066; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.95rem; padding:6px 12px; cursor:pointer;
  touch-action:manipulation;
}

/* ── Screens ── */
.screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
.screen.active { display:flex; }

/* ══════════════ MENU CATÉGORIES ══════════════ */
#menu-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px 12px;
  -webkit-overflow-scrolling:touch;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
#menu-scroll.mode-periode {
  display:flex; flex-direction:column; padding:0; overflow:hidden;
}
/* Mode familles : liste verticale (cartes horizontales pleine largeur, hauteur libre) */
#menu-scroll.mode-famille {
  display:flex; flex-direction:column; gap:12px;
}
.cat-card {
  border-radius:18px; padding:18px 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation; user-select:none;
  min-height:130px; position:relative; overflow:hidden;
  transition:transform 0.15s;
}
.cat-card:active { transform:scale(0.94); }
.cat-emoji { font-size:2.8rem; margin-bottom:8px; line-height:1; }
.cat-label { font-size:0.95rem; font-weight:900; text-align:center; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
.cat-count { display:none; }

/* ── Cartes FAMILLE (horizontales, pleine largeur, vignette + texte) ── */
.fam-intro {
  grid-column:1/-1; font-size:0.82rem; line-height:1.45; opacity:0.9;
  padding:10px 14px; margin-bottom:2px; background:rgba(255,255,255,0.06);
  border-radius:12px; cursor:pointer;
}
.fam-card {
  display:flex; align-items:center; gap:14px;
  border-radius:18px; padding:12px; cursor:pointer; touch-action:manipulation;
  user-select:none; transition:transform 0.15s;
  width:100%; max-width:560px; margin:0 auto;
}
.fam-card:active { transform:scale(0.98); }
.fam-thumb {
  flex-shrink:0; width:90px; height:90px; border-radius:14px; overflow:hidden;
  background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center;
}
.fam-thumb img { width:100%; height:100%; object-fit:cover; }
.fam-thumb-emoji { font-size:2.8rem; }
.fam-body { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
.fam-label { font-size:1.02rem; font-weight:900; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.55); line-height:1.2; }
.fam-savant { font-size:0.72rem; opacity:0.66; font-style:italic; line-height:1.2; }
.fam-desc { font-size:0.8rem; opacity:0.94; line-height:1.3; }
.fam-count { font-size:0.76rem; font-weight:800; opacity:0.82; margin-top:3px; }

/* Bandeau d'explication en haut de la grille d'une famille */
.fam-explic-banner {
  grid-column:1/-1; display:flex; gap:10px; align-items:flex-start;
  background:rgba(255,255,255,0.08); border-radius:14px; padding:12px 14px; margin-bottom:2px;
}
.fam-explic-banner p { font-size:0.84rem; line-height:1.45; opacity:0.95; margin:0; }
.fam-explic-play {
  flex-shrink:0; width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(255,255,255,0.2); color:#fff; font-size:1.2rem; line-height:1;
}
.fam-explic-play:active { transform:scale(0.9); }

/* ══════════════ GRILLE DINOS ══════════════ */
#grid-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px;
  -webkit-overflow-scrolling:touch;
  display:grid; grid-template-columns:1fr 1fr; gap:14px;
  grid-auto-rows:minmax(260px, auto);
}
#grid-scroll::-webkit-scrollbar { width:8px; }
#grid-scroll::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); border-radius:4px; }
#grid-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.35); border-radius:4px; }
.dino-card {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; padding:14px 10px 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  cursor:pointer; touch-action:manipulation; user-select:none;
  position:relative; overflow:hidden;
  transition:transform 0.12s, box-shadow 0.12s;
}
.card-badges {
  position:absolute; top:6px; right:6px;
  display:flex; flex-direction:column; gap:5px; z-index:10;
}
.badge {
  width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; font-weight:900;
  box-shadow:0 2px 7px rgba(0,0,0,0.55);
}
.badge-image {
  background:#2aa7ff; color:#fff; border:2px solid #cfeaff;
}
.badge-audio {
  background:#ffcc00; color:#000; border:2px solid #fff7a8;
  animation:badgePulse 1.8s ease-in-out infinite;
}
@keyframes badgePulse { 0%,100%{ box-shadow:0 2px 7px rgba(0,0,0,0.55); } 50%{ box-shadow:0 0 12px 3px rgba(255,204,0,0.7); } }
.dino-card:active { transform:scale(0.93); }
.dino-card.bounce { animation:cardBounce 0.4s ease-out; }
@keyframes cardBounce {
  0%   { transform:scale(1); }
  30%  { transform:scale(1.08) translateY(-10px); }
  60%  { transform:scale(0.96) translateY(2px); }
  100% { transform:scale(1); }
}
.card-img {
  width:100%; max-width:170px; height:140px; object-fit:contain;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,0.55));
  margin-bottom:10px;
}
.card-name { font-size:1.05rem; font-weight:900; color:#fff; text-align:center; margin-bottom:6px; line-height:1.15; }
.card-regime { font-size:0.85rem; color:rgba(255,255,255,0.78); text-align:center; margin-bottom:4px; }
.card-region { font-size:0.78rem; color:rgba(255,255,255,0.55); text-align:center; margin-top:2px; line-height:1.2; }
.card-bar { position:absolute; bottom:0; left:0; right:0; height:4px; }

/* ══════════════ FICHE DINO ══════════════ */
#fiche-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:0 0 30px 0;
}

/* Hero */
.fiche-hero {
  position:relative; display:flex; align-items:center; justify-content:center;
  padding:20px 16px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,0.3),transparent);
}
.fiche-hero-img {
  max-height:200px; max-width:100%; object-fit:contain;
  filter:drop-shadow(0 4px 20px rgba(0,0,0,0.7));
}

/* Name block */
.fiche-name-block {
  padding:0 16px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.fiche-name { font-size:1.8rem; font-weight:900; color:#ffe066; flex:1; min-width:0; }
.fiche-full { font-size:0.8rem; color:rgba(255,255,255,0.4); font-style:italic; width:100%; }

/* Info sections */
.fiche-section {
  margin:0 12px 10px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start;
}
.fiche-section-icon { font-size:1.5rem; flex-shrink:0; margin-top:2px; }
.fiche-section-body { flex:1; min-width:0; }
.fiche-section-title {
  font-size:0.72rem; font-weight:900; color:rgba(255,255,255,0.45);
  text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;
}
.fiche-section-text {
  font-size:0.92rem; font-weight:700; color:#fff; line-height:1.45;
}
.fiche-section-sub {
  font-size:0.78rem; color:rgba(255,255,255,0.55); margin-top:3px;
}

/* Stats row */
.fiche-stats {
  margin:0 12px 10px;
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.stat-box {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:10px 12px;
}
.stat-label { font-size:0.68rem; font-weight:900; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
.stat-val { font-size:1rem; font-weight:900; color:#ffe066; }
.stat-comp { font-size:0.72rem; color:rgba(255,255,255,0.5); margin-top:2px; line-height:1.3; }

/* Speak button inside section */
.speak-btn {
  background:rgba(255,220,0,0.12); border:1px solid rgba(255,220,0,0.3);
  border-radius:8px; color:#ffe066; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.8rem; padding:4px 10px;
  cursor:pointer; touch-action:manipulation; flex-shrink:0;
  align-self:center;
}
.speak-btn:active { background:rgba(255,220,0,0.25); }
.speak-btn.playing { background:#e74c3c; border-color:#ff8a7a; color:#fff; animation:dino-story-pulse 1.1s ease-in-out infinite; }

/* Highlight box (fait/superpower) */
.fiche-highlight {
  margin:0 12px 10px;
  background:rgba(255,220,0,0.08); border:1px solid rgba(255,220,0,0.25);
  border-radius:14px; padding:14px;
  display:flex; gap:10px; align-items:flex-start;
}
.fiche-highlight-text {
  font-size:0.95rem; font-weight:700; color:#ffe066; line-height:1.5; flex:1;
}

/* ── Bouton histoire audio (duo Narrateur + Wex) ── */
.dino-story-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:calc(100% - 24px); margin:6px 12px 10px;
  min-height:60px; padding:14px 18px;
  background:linear-gradient(135deg,#6a3093,#a044ff);
  border:2px solid rgba(255,255,255,0.25); border-radius:16px;
  color:#fff; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.05rem;
  cursor:pointer; touch-action:manipulation;
  box-shadow:0 4px 14px rgba(160,68,255,0.35);
}
.dino-story-btn:active { transform:scale(0.97); }
.dino-story-eq { font-size:1.2rem; }
.dino-story-btn.playing {
  background:linear-gradient(135deg,#c0392b,#e74c3c);
  animation:dino-story-pulse 1.1s ease-in-out infinite;
}
.dino-story-btn.playing .dino-story-eq::before { content:'⏸ '; }
.dino-story-btn.playing .dino-story-eq { font-size:0; }
.dino-story-btn.playing .dino-story-eq::before { font-size:1.2rem; }
@keyframes dino-story-pulse { 0%,100% { box-shadow:0 4px 14px rgba(231,76,60,0.4); } 50% { box-shadow:0 4px 22px rgba(231,76,60,0.75); } }
/* Pastille version texte audio (repère Papa Yann : V1 = ancien texte, V2 = réécrit naturel) */
.audio-ver {
  font-size:0.62rem; font-weight:900; letter-spacing:0.5px;
  background:rgba(0,0,0,0.3); border-radius:6px; padding:2px 6px;
  margin-left:6px; opacity:0.75; align-self:center;
}

/* ── Pangée carrousel ── */
.pangee-carousel { position:relative; width:100%; aspect-ratio:2/1; border-radius:12px; overflow:hidden; background:#04263f; }
.pangee-slides { width:100%; height:100%; position:relative; }
.pangee-slide { position:absolute; inset:0; opacity:0; transition:opacity 0.7s ease; }
.pangee-slide.active { opacity:1; }
.pangee-img { width:100%; height:100%; object-fit:cover; display:block; }
.pangee-slide-cap { position:absolute; left:0; bottom:0; right:0; padding:8px 12px; background:linear-gradient(transparent,rgba(0,0,0,0.7)); display:flex; align-items:baseline; gap:8px; }
.pangee-slide-label { font-weight:900; font-size:1rem; color:#fff; }
.pangee-slide-ma { font-size:0.72rem; color:rgba(255,255,255,0.7); }
.pangee-dots { display:flex; gap:6px; justify-content:center; margin:10px 0 4px; flex-wrap:wrap; }
.pangee-dot { background:rgba(80,160,255,0.12); border:1px solid rgba(80,160,255,0.25); color:rgba(180,220,255,0.8); border-radius:20px; padding:5px 12px; font-family:inherit; font-size:0.72rem; font-weight:900; cursor:pointer; touch-action:manipulation; }
.pangee-dot.active { background:#3498db; border-color:#5dade2; color:#fff; }
.pangee-credit { text-align:center; font-size:0.6rem; color:rgba(255,255,255,0.3); margin-bottom:10px; }
.pangee-etapes { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.pangee-etape { background:rgba(80,160,255,0.08); border:1px solid rgba(80,160,255,0.2); border-radius:10px; padding:9px 11px; cursor:pointer; }
.pangee-etape:active { background:rgba(80,160,255,0.18); }
.pangee-etape-label { font-size:0.65rem; color:rgba(150,200,255,0.7); font-weight:900; text-transform:uppercase; letter-spacing:0.05em; }
.pangee-etape-titre { font-size:0.85rem; font-weight:900; color:#85c1e9; margin:2px 0 3px; }
.pangee-etape-texte { font-size:0.74rem; color:rgba(255,255,255,0.72); line-height:1.4; }
.pangee-pourquoi { background:rgba(255,200,80,0.1); border:1px solid rgba(255,200,80,0.25); border-radius:10px; padding:9px 11px; font-size:0.75rem; color:rgba(255,225,160,0.9); cursor:pointer; line-height:1.4; margin-bottom:8px; font-weight:700; }
.pangee-pourquoi:active { background:rgba(255,200,80,0.2); }
.pangee-funfact { background:rgba(100,200,255,0.1); border:1px solid rgba(100,200,255,0.25); border-radius:10px; padding:9px 11px; font-size:0.75rem; color:rgba(180,225,255,0.9); cursor:pointer; line-height:1.4; font-weight:700; }
.pangee-funfact:active { background:rgba(100,200,255,0.2); }

/* ── Extinction ── */
.ext-card { display:flex; gap:10px; background:rgba(255,80,0,0.08); border:1px solid rgba(255,80,0,0.2); border-radius:12px; padding:10px; cursor:pointer; }
.ext-card:active { background:rgba(255,80,0,0.18); }
.ext-card-emoji { font-size:2rem; flex-shrink:0; line-height:1; }
.ext-card-body { flex:1; }
.ext-card-titre { font-weight:900; font-size:0.88rem; color:#ff9060; margin-bottom:4px; }
.ext-card-texte { font-size:0.75rem; color:rgba(255,255,255,0.75); line-height:1.4; }
.ext-certitude { margin-top:5px; font-size:0.7rem; color:rgba(255,200,100,0.8); }
.ext-certitude span { margin-left:4px; font-weight:700; }
.ext-funfact { background:rgba(100,220,100,0.1); border:1px solid rgba(100,220,100,0.25); border-radius:12px; padding:10px 12px; font-size:0.78rem; color:rgba(200,255,200,0.9); cursor:pointer; line-height:1.4; font-weight:700; }
.ext-funfact:active { background:rgba(100,220,100,0.2); }

/* ── Fiche V1 : 4 grands panneaux colorés ── */
.v1-hero { position:relative; height:170px; margin:12px 12px 0; border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.v1-hero-img { max-height:140px; max-width:80%; object-fit:contain; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.55)); }
.v1-hero-nm { position:absolute; left:16px; bottom:12px; text-shadow:0 2px 8px rgba(0,0,0,0.7); }
.v1-hero-nm b { display:block; font-size:1.7rem; font-weight:900; line-height:1.1; }
.v1-alias { display:block; font-size:0.74rem; color:#ffe0a0; font-weight:700; }
.v1-lat { display:block; font-size:0.78rem; opacity:0.85; font-style:italic; }
.v1-big {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:calc(100% - 24px); margin:12px; min-height:62px; padding:15px 18px;
  background:linear-gradient(135deg,#6a3093,#a044ff);
  border:2px solid rgba(255,255,255,0.25); border-radius:16px;
  color:#fff; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.05rem;
  cursor:pointer; touch-action:manipulation; box-shadow:0 4px 14px rgba(160,68,255,0.35);
}
.v1-big:active { transform:scale(0.98); }
.v1-big.playing { background:linear-gradient(135deg,#c0392b,#e74c3c); animation:dino-story-pulse 1.1s ease-in-out infinite; }
.v1-panel { position:relative; margin:0 12px 12px; border-radius:16px; padding:16px; }
.v1-panel .v1-sp {
  position:absolute; top:13px; right:13px; min-width:46px; height:40px;
  background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.25);
  border-radius:11px; color:#fff; font-size:1.05rem; cursor:pointer; touch-action:manipulation;
}
.v1-panel .v1-sp.playing { background:#e74c3c; border-color:#ff8a7a; animation:dino-story-pulse 1.1s ease-in-out infinite; }
.v1-pic { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-right:54px; }
.v1-pic .v1-ic { font-size:2rem; line-height:1; }
.v1-pic .v1-tt { font-weight:900; font-size:1.1rem; }
.v1-panel p { font-size:0.92rem; line-height:1.5; margin:5px 0; }
.v1-panel .v1-sub { font-size:0.8rem; opacity:0.8; margin:3px 0; }
.v1-a { background:linear-gradient(135deg,#3a2a5a,#5a3d8a); }
.v1-b { background:linear-gradient(135deg,#0a3a4a,#1a6a8a); }
.v1-c { background:linear-gradient(135deg,#0a4a2a,#1a8a4a); }
.v1-d { background:linear-gradient(135deg,#5a4a0a,#a0851a); }
.v1-stats { display:flex; gap:8px; margin-top:6px; }
.v1-stat { flex:1; background:rgba(0,0,0,0.3); border-radius:12px; padding:10px 6px; text-align:center; }
.v1-stat .l { font-size:0.62rem; text-transform:uppercase; opacity:0.65; }
.v1-stat .v { font-size:1.35rem; font-weight:900; color:#ffe066; margin:2px 0; }
.v1-stat .c { font-size:0.66rem; opacity:0.85; line-height:1.25; }
.v1-queue { margin-top:8px; font-size:0.8rem; line-height:1.35; background:rgba(0,0,0,0.22); border-radius:10px; padding:8px 10px; }

/* Cadre scrollable pour listes */
.v1-list-box {
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  max-height:110px;
  overflow-y:auto;
  padding:8px 10px;
  margin:4px 0 2px;
  font-size:0.85rem;
  line-height:1.5;
}
.v1-list-box::-webkit-scrollbar { width:4px; }
.v1-list-box::-webkit-scrollbar-track { background:transparent; }
.v1-list-box::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.25); border-radius:2px; }

/* Bloc vidéo */
.fiche-video-wrap {
  margin:14px 12px 4px;
  border-radius:14px; overflow:hidden;
  background:rgba(0,0,0,0.35);
  border:2px solid rgba(231,76,60,0.6);
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
.fiche-video-title {
  font-size:0.85rem; font-weight:900;
  padding:10px 14px 6px; color:#fff;
  background:linear-gradient(90deg,rgba(231,76,60,0.35),rgba(231,76,60,0.1));
}
.fiche-video {
  width:100%; display:block; max-height:50vh; background:#000;
}

/* Extra gallery */
.fiche-gallery-title {
  margin:16px 12px 8px;
  font-size:0.78rem; font-weight:900; color:rgba(255,255,255,0.4);
  text-transform:uppercase; letter-spacing:0.07em;
}
.fiche-gallery {
  margin:0 12px 10px;
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
}
.fiche-gallery::-webkit-scrollbar { display:none; }
.gallery-thumb {
  flex-shrink:0; width:100px; height:75px; border-radius:10px;
  object-fit:cover; border:1px solid rgba(255,255,255,0.15);
  cursor:pointer; touch-action:manipulation;
  background:rgba(255,255,255,0.05);
}
.gallery-thumb:active { opacity:0.7; }

/* Carousel plein écran */
#carousel {
  display:none; position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0.96); flex-direction:column;
  align-items:center; justify-content:center;
}
#carousel.open { display:flex; }
#carousel-track {
  display:flex; align-items:center;
  width:100%; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
  padding:0 16px; gap:16px;
}
#carousel-track::-webkit-scrollbar { display:none; }
.carousel-slide {
  flex-shrink:0; scroll-snap-align:center;
  width:calc(100vw - 32px); display:flex;
  align-items:center; justify-content:center;
}
.carousel-slide img {
  max-width:100%; max-height:72dvh; border-radius:14px;
  object-fit:contain;
}
#carousel-label {
  margin-top:14px; font-size:0.9rem; font-weight:700;
  color:rgba(255,255,255,0.6); text-align:center;
}
#carousel-dots {
  display:flex; gap:7px; margin-top:10px; justify-content:center;
}
.c-dot {
  width:8px; height:8px; border-radius:50%;
  background:rgba(255,255,255,0.25); transition:background 0.2s;
}
.c-dot.active { background:#ffe066; }
#carousel-close {
  position:absolute; top:14px; right:14px;
  background:rgba(255,255,255,0.15); border:none; border-radius:50%;
  color:#fff; font-size:1.4rem; width:44px; height:44px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-family:'Nunito',sans-serif; touch-action:manipulation;
}

/* Speech pulse */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.speaking { animation:pulse 0.8s infinite; }

/* ══════════════ MODE SELECTOR ══════════════ */
#mode-selector {
  flex-shrink:0; display:flex; gap:6px; padding:8px 12px;
  background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(255,255,255,0.06);
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
#mode-selector::-webkit-scrollbar { display:none; }
.mode-btn {
  flex-shrink:0; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15); border-radius:20px;
  color:rgba(255,255,255,0.6); font-family:'Nunito',sans-serif;
  font-weight:900; font-size:0.82rem; padding:6px 14px;
  cursor:pointer; touch-action:manipulation; white-space:nowrap;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
}
.mode-btn.active {
  background:rgba(255,220,0,0.18); border-color:rgba(255,220,0,0.5);
  color:#ffe066;
}
.mode-btn:active { transform:scale(0.93); }

/* ══════════════ CHRONOMAP ══════════════ */
#chrono-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 12px 20px;
}
.chrono-periode {
  margin-bottom:16px; border-radius:16px; overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
}
.chrono-header {
  padding:12px 14px; display:flex; align-items:center; gap:10px;
  cursor:pointer; touch-action:manipulation; user-select:none;
}
.chrono-header:active { opacity:0.8; }
.chrono-emoji { font-size:2rem; }
.chrono-info { flex:1; }
.chrono-label { font-size:1.1rem; font-weight:900; color:#fff; }
.chrono-range { font-size:0.75rem; color:rgba(255,255,255,0.5); margin-top:1px; }
.chrono-desc  { font-size:0.78rem; color:rgba(255,255,255,0.65); margin-top:2px; }
.chrono-count { font-size:0.75rem; font-weight:900; padding:4px 10px; border-radius:12px; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); flex-shrink:0; }

.chrono-bar-container {
  padding:0 14px 8px;
  background:rgba(0,0,0,0.2);
}
.chrono-bar-track {
  height:6px; border-radius:3px; background:rgba(255,255,255,0.08);
  position:relative; margin-bottom:2px;
}
.chrono-bar-fill { height:100%; border-radius:3px; }
.chrono-bar-label { font-size:0.62rem; color:rgba(255,255,255,0.3); text-align:right; }

.chrono-dinos {
  padding:6px 10px 10px;
  background:rgba(0,0,0,0.15);
  display:grid; grid-template-columns:repeat(auto-fill, minmax(90px,1fr)); gap:6px;
}
.chrono-dino-thumb {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; padding:8px 6px 6px;
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; touch-action:manipulation; user-select:none;
  transition:transform 0.12s;
}
.chrono-dino-thumb:active { transform:scale(0.9); }
.chrono-dino-static { cursor:default; }
.chrono-dino-static:active { transform:none; }
.journey-intro { margin:6px 12px 12px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,0.06); font-size:0.85rem; line-height:1.4; color:rgba(255,255,255,0.85); }
.journey-ep { margin:0 10px 12px; border-radius:14px; overflow:hidden; background:rgba(0,0,0,0.18); position:relative; transition:box-shadow 0.2s; }
.journey-ep .chrono-header { cursor:default; position:relative; }
/* Pastille d'état dans le header (✓ écouté · 👉 à écouter ensuite) */
.ep-status { flex-shrink:0; width:30px; text-align:center; font-size:1.3rem; line-height:1; }
.journey-ep.ep-done  .ep-status::after { content:'✅'; }
.journey-ep.ep-next:not(.ep-done) .ep-status::after { content:'👉'; animation:ep-nudge 1s ease-in-out infinite; display:inline-block; }
@keyframes ep-nudge { 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-4px); } }
/* Épisode écouté : bouton verdit, légèrement estompé */
.journey-ep.ep-done .v1-big { background:linear-gradient(135deg,#1e7e34,#28a745); opacity:0.92; }
.journey-ep.ep-done .v1-big .dino-story-eq::before { content:'✓ '; }
/* Prochain à écouter : liseré lumineux */
.journey-ep.ep-next:not(.ep-done) { box-shadow:0 0 0 2px rgba(255,255,255,0.55), 0 0 14px rgba(255,255,255,0.25); }
.chrono-dino-img { width:60px; height:44px; object-fit:contain; margin-bottom:4px; filter:drop-shadow(0 1px 4px rgba(0,0,0,0.5)); }
.chrono-dino-name { font-size:0.66rem; font-weight:900; color:#fff; text-align:center; line-height:1.2; }
.chrono-dino-thumb .card-badges { top:3px; right:3px; gap:3px; }
.chrono-dino-thumb .badge { width:20px; height:20px; font-size:0.7rem; border-width:1px; }

/* Frise chronologique visuelle */
.chrono-timeline {
  display:flex; align-items:stretch; margin:0 12px 12px;
  border-radius:10px; overflow:hidden; height:22px;
}
.chrono-tl-seg {
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; font-weight:900; color:rgba(255,255,255,0.8);
  cursor:pointer; touch-action:manipulation; transition:opacity 0.15s;
  white-space:nowrap; overflow:hidden;
}
.chrono-tl-seg:hover { opacity:0.8; }

/* Scroll area */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:2px; }
</style>
</head>
<body>

<!-- ══════════════ SCREEN: MENU ══════════════ -->
<div id="screen-menu" class="screen active">
  <div class="hdr">
    <button class="hdr-back" onclick="location.href='index.html'">← Menu</button>
    <span class="hdr-title">🦕 Les Dinosaures</span>
    <button class="hdr-speak" id="menu-speak-btn" onclick="speakMenuIntro()">🔊</button>
  </div>
  <!-- Sélecteur de mode -->
  <div id="mode-selector">
    <button class="mode-btn active" id="mode-btn-famille"   onclick="setMode('famille')"  >🦖 Les familles</button>
    <button class="mode-btn"        id="mode-btn-regime"    onclick="setMode('regime')"   >🍽️ Ce qu'il mange</button>
    <button class="mode-btn"        id="mode-btn-periode"   onclick="setMode('periode')"  >⏳ Le voyage</button>
    <button class="mode-btn"        id="mode-btn-dico"      onclick="setMode('dico')"     >📖 Le dico</button>
  </div>
  <div id="menu-scroll"></div>
</div>

<!-- ══════════════ SCREEN: GRILLE ══════════════ -->
<div id="screen-grid" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showMenu()">← Retour</button>
    <span class="hdr-title" id="grid-title"></span>
    <button class="hdr-speak" id="grid-speak-btn" onclick="speakCatIntro()">🔊</button>
  </div>
  <div id="grid-scroll"></div>
</div>

<!-- ══════════════ SCREEN: FICHE ══════════════ -->
<div id="screen-fiche" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showGrid()">← Retour</button>
    <span class="hdr-title" id="fiche-hdr-name"></span>
  </div>
  <div id="fiche-scroll"></div>
</div>

<!-- Carousel plein écran -->
<div id="carousel">
  <button id="carousel-close" onclick="closeCarousel()">✕</button>
  <div id="carousel-track"></div>
  <div id="carousel-label"></div>
  <div id="carousel-dots"></div>
</div>

<script src="js/dinos-data.js"></script>
<script src="js/dinos-racines.js"></script>
<script>

/* ── TTS ── */
const synth = window.speechSynthesis;

function speakText(txt) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'fr-FR'; u.rate = 0.88; u.pitch = 1.1;
  synth.speak(u);
}
function stopSpeak() { if (synth) synth.cancel(); }

/* ── Voix réelle des MENUS (MP3 ElevenLabs) ──
   Narrateur H : accueil / régime / familles · Narratrice F : voyage.
   Si le MP3 manque ou ne charge pas → fallback speechSynthesis (on garde toujours l'existant). */
const MENU_VOICE = {
  accueil:  'audio/dinos/menu-accueil.mp3',
  regime:   'audio/dinos/menu-regime.mp3',
  famille:  'audio/dinos/menu-familles.mp3',
  periode:  'audio/dinos/menu-voyage.mp3',
};
let _menuAudio = null;
function _stopMenuAudio() { if (_menuAudio) { _menuAudio.pause(); _menuAudio = null; } }
function _playMenuSrc(src, fallbackTxt) {
  stopSpeak();
  _stopMenuAudio();
  if (typeof _stopDinoAudio === 'function') _stopDinoAudio();
  if (!src) { if (fallbackTxt) speakText(fallbackTxt); return; }
  _menuAudio = new Audio(src);
  _menuAudio.onended = _stopMenuAudio;
  _menuAudio.onerror = () => { _stopMenuAudio(); if (fallbackTxt) speakText(fallbackTxt); };
  _menuAudio.play().catch(() => { _stopMenuAudio(); if (fallbackTxt) speakText(fallbackTxt); });
}
function playMenuVoice(key, fallbackTxt) { _playMenuSrc(MENU_VOICE[key], fallbackTxt); }

/* ── Accroches FAMILLE / RÉGIME (vraies voix ElevenLabs, jouées à l'entrée de la grille) ──
   id famille → menu-fam-<id>.mp3 · id régime → menu-regime-<cat>.mp3. Fallback speechSynthesis si MP3 absent. */
const MENU_FAM_VOICE = {
  trex: 'audio/dinos/menu-fam-trex.mp3', cou_long: 'audio/dinos/menu-fam-cou_long.mp3',
  arme: 'audio/dinos/menu-fam-arme.mp3', cornu: 'audio/dinos/menu-fam-cornu.mp3',
  bec: 'audio/dinos/menu-fam-bec.mp3', raptor: 'audio/dinos/menu-fam-raptor.mp3',
  pterosaures: 'audio/dinos/menu-fam-pterosaures.mp3', enaliosaures: 'audio/dinos/menu-fam-enaliosaures.mp3',
  volant: 'audio/dinos/menu-fam-volant.mp3',
};
const MENU_REGIME_VOICE = {
  carnivores: 'audio/dinos/menu-regime-carnivores.mp3', herbivores: 'audio/dinos/menu-regime-herbivores.mp3',
  piscivores: 'audio/dinos/menu-regime-piscivores.mp3', omnivores: 'audio/dinos/menu-regime-omnivores.mp3',
};
function playFamVoice(famId, fallbackTxt) { _playMenuSrc(MENU_FAM_VOICE[famId], fallbackTxt); }
function playRegimeVoice(catId, fallbackTxt) { _playMenuSrc(MENU_REGIME_VOICE[catId], fallbackTxt); }

/* ── Dico : dialogue 2 voix (narrateur explique la racine + Wex donne les exemples de dinos) ──
   clé racine (r.cle) → audio/dinos/dico-<slug>.mp3. Racines sans MP3 = fallback dame jusqu'à génération. */
const DICO_VOICE = {"-saure":"dico-saure","-odon":"dico-odon","-raptor":"dico-raptor","-lophe":"dico-lophe","cérat-":"dico-cerat","-céphale":"dico-cephale","-mime":"dico-mime","-onyx":"dico-onyx","-ops":"dico-ops","di-":"dico-di","-cantho-":"dico-cantho","-docus / dokos":"dico-docus","-gnathus / gnathos":"dico-gnathus","-metro- / metron":"dico-metro","-oplo-":"dico-oplo","-physis":"dico-physis","-pteryx / pterux":"dico-pteryx","-taurus":"dico-taurus","acro-":"dico-acro","allo-":"dico-allo","an-":"dico-an","anky- / ankylo-":"dico-anky","apato-":"dico-apato","archaeo- / arkhaios":"dico-archaeo","bary- / barus":"dico-bary","brachio-":"dico-brachio","camara-":"dico-camara","carcharo-":"dico-carcharo","carno-":"dico-carno","coelo- / koilos":"dico-coelo","compso- / kompsos":"dico-compso","corytho- / korus":"dico-corytho","cryo-":"dico-cryo","deino- / deinos":"dico-deino","diplo-":"dico-diplo","eu-":"dico-eu","galli-":"dico-galli","giga- / gigas":"dico-giga","gorgo-":"dico-gorgo","kentro- / kentron":"dico-kentro","maia-":"dico-maia","micro- / mikros":"dico-micro","noto-":"dico-noto","ovi-":"dico-ovi","pachy- / pakhus":"dico-pachy","para-":"dico-para","plateo-":"dico-plateo","proto-":"dico-proto","psittaco- / psittakos":"dico-psittaco","ptér- / pteron":"dico-pter","rex":"dico-rex","spino-":"dico-spino","stégo- / stegos":"dico-stego","styraco- / sturax":"dico-styraco","sucho- / soukhos":"dico-sucho","tarbo-":"dico-tarbo","therizino- / therizo":"dico-therizino","tri-":"dico-tri","troo- / titrosko":"dico-troo","tyrannos-":"dico-tyrannos","veloci-":"dico-veloci"};
function playDicoVoice(cle, fallbackTxt) {
  const slug = DICO_VOICE[cle];
  _playMenuSrc(slug ? 'audio/dinos/' + slug + '.mp3' : null, fallbackTxt);
}

/* ── State ── */
let currentMode   = 'famille';
let currentCatId  = null;
let currentDino   = null;

/* ── Screens ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  stopSpeak();
  _stopMenuAudio();
  if (typeof _stopDinoAudio === 'function') _stopDinoAudio();
}

/* ── Mode selector ── */
// Fallback TTS si le MP3 menu manque (on garde toujours l'existant).
const MENU_FALLBACK = {
  regime:  'Les dinosaures ne mangeaient pas tous la même chose. Les carnivores mangeaient de la viande. Les herbivores mangeaient des plantes.',
  famille: (typeof DINO_FAMILLES_INTRO !== 'undefined' ? DINO_FAMILLES_INTRO : 'Les grandes familles de dinosaures !'),
  periode: 'Le grand voyage dans le temps ! On remonte très loin, de la première vie jusqu\'à aujourd\'hui.',
  dico:    'Les noms des dinos sont faits de petits mots de savants ! Touche un mot pour l\'écouter.',
};
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-btn-' + mode).classList.add('active');
  buildMenu();
  playMenuVoice(mode, MENU_FALLBACK[mode] || '');
}

function speakMenuIntro() {
  // Le 🔊 du header joue l'explication du mode courant.
  playMenuVoice(currentMode, MENU_FALLBACK[currentMode] || 'Les dinosaures !');
}

/* ── MENU principal ── */
function showMenu() {
  showScreen('menu');
  buildMenu();
}

function buildMenu() {
  const el = document.getElementById('menu-scroll');
  el.innerHTML = '';
  el.classList.remove('mode-periode', 'mode-famille', 'mode-dico');

  if (currentMode === 'regime') {
    buildMenuRegime(el);
  } else if (currentMode === 'famille') {
    el.classList.add('mode-famille');
    buildMenuFamille(el);
  } else if (currentMode === 'periode') {
    buildMenuPeriode(el);
  } else if (currentMode === 'dico') {
    el.classList.add('mode-dico');
    buildMenuDico(el);
  }
}

/* ── Helper pour les thumbs chrono (décoratives dans le voyage : image + nom, PAS de lien) ── */
function buildChronoDinoThumb(d) {
  return `
    <div class="chrono-dino-thumb chrono-dino-static">
      <img class="chrono-dino-img" src="img/dinos/${d.png}" alt="${d.name}" loading="lazy" onerror="this.style.display='none'">
      <div class="chrono-dino-name">${d.name}</div>
    </div>
  `;
}

/* ── MENU famille ──
   Carte horizontale : vignette photo (dino emblème) + bloc texte complet, rien n'est coupé.
   FAM_EMBLEME = png montré sur la vignette de chaque famille. */
const FAM_EMBLEME = {
  trex: 'Tyrannosaurus.png', cou_long: 'Brachiosaurus.png', arme: 'Stegosaurus.png',
  cornu: 'Triceratops.png', bec: 'Parasaurolophus.png', raptor: 'Velociraptor.png',
  pterosaures: 'Pteranodon.png', enaliosaures: 'Mosasaurus.png', volant: 'Dimetrodon.png',
};
function buildMenuFamille(el) {
  // Intro COURTE et accrocheuse (le détail vit dans chaque carte / au clic)
  const intro = document.createElement('div');
  intro.className = 'fam-intro';
  intro.innerHTML = `<p>Chaque famille a un nom rigolo de savant. Touche une carte pour découvrir le sien !</p>`;
  el.appendChild(intro);

  DINO_FAMILLES.forEach(fam => {
    const count = DINOS.filter(d => d.famille === fam.id).length;
    if (!count) return;
    const png = FAM_EMBLEME[fam.id];
    const title = fam.sci || fam.label;        // nom scientifique en GROS
    const sub   = fam.label || '';             // surnom en sous-titre
    const card = document.createElement('div');
    card.className = 'fam-card';
    card.style.background = fam.bg;
    card.innerHTML = `
      <div class="fam-thumb">
        ${png ? `<img src="img/dinos/${png}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <span class="fam-thumb-emoji" ${png ? 'style="display:none"' : ''}>${fam.emoji}</span>
      </div>
      <div class="fam-body">
        <div class="fam-label">${fam.emoji} ${title}</div>
        ${sub ? `<div class="fam-savant">${sub}</div>` : ''}
        <div class="fam-desc">${fam.desc}</div>
        <div class="fam-count">${count} dinos →</div>
      </div>
    `;
    // Un seul son : on entre dans la grille, c'est elle qui dit le nom + l'origine grecque.
    card.addEventListener('click', () => { setTimeout(() => showGridFamille(fam.id), 250); });
    el.appendChild(card);
  });
}

/* ── MENU dico (racines grec/latin · source: js/dinos-racines.js, généré) ── */
function buildMenuDico(el) {
  if (!document.getElementById('dico-style')) {
    const st = document.createElement('style'); st.id = 'dico-style';
    st.textContent = `
      #menu-scroll.mode-dico { padding:8px 10px 24px; overflow-y:auto; }
      .dico-card { background:#fff; border-radius:16px; padding:12px 14px; margin:8px 0; box-shadow:0 2px 6px rgba(0,0,0,.12); cursor:pointer; }
      .dico-card:active { transform:scale(.98); }
      .dico-head { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; }
      .dico-root { font-size:1.8rem; font-weight:800; color:#2c3e50; }
      .dico-sens { font-size:1.1rem; color:#16a085; font-weight:700; }
      .dico-langue { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:#7f8c8d; border-radius:8px; padding:2px 8px; }
      .dico-langue.latin { background:#c0392b; } .dico-langue.grec { background:#2980b9; }
      .dico-dinos { display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
      .dico-thumb { width:42px; height:42px; object-fit:contain; }
      .dico-count { font-size:.8rem; opacity:.6; margin-left:4px; }
    `;
    document.head.appendChild(st);
  }
  const intro = document.createElement('div');
  intro.className = 'fam-intro';
  intro.innerHTML = `<p>Les noms des dinos sont faits de petits mots de savants ! Touche un mot pour l'écouter.</p>`;
  el.appendChild(intro);

  if (typeof DINO_RACINES === 'undefined' || !DINO_RACINES.racines) {
    const p = document.createElement('p'); p.style.padding = '16px'; p.textContent = 'Le dico arrive bientôt !'; el.appendChild(p); return;
  }
  const byId = {}; DINOS.forEach(d => byId[d.id] = d);
  DINO_RACINES.racines.filter(r => r.type === 'racine').forEach(r => {
    const card = document.createElement('div');
    card.className = 'dico-card';
    const thumbs = r.dinos.slice(0, 6).map(id => {
      const d = byId[id]; if (!d || !d.png) return '';
      return `<img class="dico-thumb" src="img/dinos/${d.png}" alt="${d.name}" title="${d.name}" loading="lazy" onerror="this.style.display='none'">`;
    }).join('');
    const langue = r.langue || '';
    card.innerHTML = `
      <div class="dico-head">
        <span class="dico-root">${r.cle}</span>

    const phrase = `${mot}${langue ? ', en ' + langue + ',' : ''} ça veut dire : ${r.sens}.`;
    // Tap = dialogue 2 voix (narrateur + Wex) si le MP3 existe, sinon fallback dame.
    card.addEventListener('click', () => playDicoVoice(r.cle, phrase));
    el.appendChild(card);
  });
}

let _journeyDone = new Set();
// Marque un épisode comme écouté + met à jour le fléchage "à écouter ensuite".
function _markRecitDone(id) {
  if (!id) return;
  _journeyDone.add(id);
  const ep = document.querySelector('.journey-ep[data-ep="' + id + '"]');
  if (ep) ep.classList.add('ep-done');
  _refreshJourneyNext();
}
// Pointe la prochaine époque non écoutée (premier épisode de JOURNEY pas dans _journeyDone).
function _refreshJourneyNext() {
  document.querySelectorAll('.journey-ep.ep-next').forEach(e => e.classList.remove('ep-next'));
  const next = JOURNEY.find(ep => !_journeyDone.has(ep.id));
  if (next) {
    const el = document.querySelector('.journey-ep[data-ep="' + next.id + '"]');
    if (el) el.classList.add('ep-next');
  }
}

// Joue le récit d'époque (audio/dinos/recit-<id>.mp3). Re-tap = stop. Fin = marqué écouté.
function playRecit(id, btnEl) {
  const src = 'audio/dinos/recit-' + id + '.mp3';
  stopSpeak();
  const wasThis = (_dinoAudioBtn === btnEl && _dinoAudio);
  _stopDinoAudio();
  if (wasThis) return;
  _dinoAudio = new Audio(src);
  _dinoAudioBtn = btnEl || null;
  if (_dinoAudioBtn) _dinoAudioBtn.classList.add('playing');
  _dinoAudio.onended = () => { _stopDinoAudio(); _markRecitDone(id); };
  _dinoAudio.onerror = _stopDinoAudio;
  _dinoAudio.play().catch(_stopDinoAudio);
}

let _pangeeIdx = 0, _pangeeTimer = null;
function pangeeGoto(idx) {
  const car = document.getElementById('pangee-carousel');
  if (!car) return;
  const slides = car.querySelectorAll('.pangee-slide');
  const dots = document.querySelectorAll('.pangee-dot');
  if (!slides.length) return;
  _pangeeIdx = (idx + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === _pangeeIdx));
  dots.forEach((d, i) => d.classList.toggle('active', i === _pangeeIdx));
}
function pangeeStartAuto() {
  if (_pangeeTimer) clearInterval(_pangeeTimer);
  _pangeeTimer = setInterval(() => {
    if (!document.getElementById('pangee-carousel')) { clearInterval(_pangeeTimer); _pangeeTimer = null; return; }
    pangeeGoto(_pangeeIdx + 1);
  }, 2600);
}

function hasDinoImages(dinoId) {
  const hasLocal = DINO_EXTRAS && DINO_EXTRAS[dinoId] && DINO_EXTRAS[dinoId].length > 0;
  const hasWiki = typeof DINO_WIKIMEDIA !== 'undefined' && DINO_WIKIMEDIA[dinoId] && DINO_WIKIMEDIA[dinoId].length > 0;
  return hasLocal || hasWiki;
}
function hasDinoAudio(dinoId) {
  return !!(DINO_AUDIO[dinoId] && Object.keys(DINO_AUDIO[dinoId]).length > 0);
}
function buildBadges(dinoId) {
  let b = '';

  if (hasDinoImages(dinoId)) {

  }
  return b ? `<div class="card-badges">${b}</div>` : '';
}
/* ── Carte SVG continents ── */
function buildContinentMap(continent) {
  const colors = {
    'Amérique du Nord': '#e74c3c',
    'Amérique du Sud':  '#e67e22',
    'Europe':           '#3498db',
    'Afrique':          '#f39c12',
    'Asie':             '#e91e63',
    'Antarctique':      '#00bcd4',
  };
  const dimColor = 'rgba(255,255,255,0.08)';
  const activeColor = colors[continent] || '#fff';

  // Formes simplifiées des continents (viewBox 0 0 200 110)
  const shapes = {
    'Amérique du Nord': 'M 18,8 L 44,8 L 52,18 L 56,28 L 52,42 L 44,50 L 34,54 L 26,48 L 18,36 L 14,24 Z',
    'Amérique du Sud':  'M 34,58 L 46,56 L 52,66 L 54,80 L 50,96 L 40,104 L 30,100 L 26,86 L 28,72 Z',
    'Europe':           'M 88,8 L 102,8 L 108,16 L 106,26 L 98,30 L 88,28 L 82,20 L 84,12 Z',
    'Afrique':          'M 88,34 L 102,32 L 112,42 L 114,60 L 108,78 L 98,90 L 86,90 L 76,78 L 74,60 L 78,42 Z',
    'Asie':             'M 110,8 L 148,8 L 162,20 L 168,36 L 158,52 L 142,56 L 124,50 L 112,36 L 108,20 Z',
    'Antarctique':      'M 50,102 L 80,100 L 110,100 L 140,102 L 150,108 L 100,110 L 50,108 Z',
  };

  const continents = Object.keys(shapes);
  const pathsHtml = continents.map(c => {
    const isActive = c === continent;
    return `<path d="${shapes[c]}" fill="${isActive ? activeColor : dimColor}" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" ${isActive ? `filter="url(#glow)"` : ''}/>`;
  }).join('');

  const label = continent || '';
  return `
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 200 112" width="130" height="73" style="border-radius:8px;background:rgba(0,60,120,0.3);flex-shrink:0">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        ${pathsHtml}
      </svg>
      <div style="font-size:0.78rem;color:${activeColor};font-weight:900;line-height:1.3">${label}</div>
    </div>
  `;
}

        <div class="v1-stat"><div class="l">${d.taille_vol ? '🪽 Ailes' : '↔️ Long'}</div><div class="v">${d.taille_m} m</div><div class="c">${d.comp_taille}</div></div>
        <div class="v1-stat"><div class="l">↕️ Haut</div><div class="v">${d.hauteur_m || '?'} m</div><div class="c">${d.comp_hauteur || ''}</div></div>
        <div class="v1-stat"><div class="l">⚖️ Poids</div><div class="v">${d.poids_t >= 1 ? Math.round(d.poids_t*1000).toLocaleString('fr-FR')+' kg' : Math.round(d.poids_t*1000)+' kg'}</div><div class="c">${d.comp_poids}</div></div>
      </div>
      ${d.queue_note ? `<p class="v1-queue">🦴 ${d.queue_note}</p>` : ''}
    </div>

    <!-- BLOC 3 — Sa vie de dino (emoji régime) -->
    <div class="v1-panel v1-c">
      <button class="v1-sp" onclick="playBloc('${d.id}','regime','${esc(d.name)} est ${esc(regimelabel(d.regime))}. Il mange ${esc(d.proies)}. ${esc(d.chasseurs)}. ${esc(d.amis)}',this)">🔊</button>
      <div class="v1-pic"><span class="v1-ic">${regEmoji}</span><span class="v1-tt">Sa vie de dino</span></div>
      <p><b>${regimelabel(d.regime)}</b></p>
      <div class="v1-list-box">${d.proies}</div>
      <p>🫂 Ses copains :</p>
      <div class="v1-list-box">${d.amis}</div>
      <p>🎯 Ses ennemis :</p>
      <div class="v1-list-box">${d.chasseurs}</div>
    </div>

    <!-- BLOC 4 — Le truc fou -->
    <div class="v1-panel v1-d">
      <button class="v1-sp" onclick="playBloc('${d.id}','funfact','Son super-pouvoir ! ${esc(d.superpower)} Le savais-tu ? ${esc(d.fait)}',this)">🔊</button>
      <div class="v1-pic"><span class="v1-ic">✨</span><span class="v1-tt">Le truc fou</span></div>
      <p><b>Super-pouvoir :</b> ${d.superpower}</p>
      <p>💡 ${d.fait}</p>
    </div>

    ${DINO_VIDEOS[d.id] ? `
      <div class="fiche-video-wrap">
        <div class="fiche-video-title">🎬 ${DINO_VIDEOS[d.id].title || 'Vidéo'}</div>
        <video class="fiche-video" src="${DINO_VIDEOS[d.id].src}" controls playsinline preload="metadata"></video>
      </div>
    ` : ''}
    ${extras.length ? buildGalleryHTML(extras, d.name) : ''}
  `;

  // Carousel listeners
  const thumbs = scroll.querySelectorAll('.gallery-thumb');
  if (thumbs.length) {
    const srcs = Array.from(thumbs).map(img => ({ src: img.src, label: img.title || img.alt || '' }));
    thumbs.forEach((img, i) => {
      img.addEventListener('click', () => openCarousel(srcs, i));
    });
  }
}

function buildGalleryHTML(extras, name) {
  const thumbs = extras.map(e =>
    `<img class="gallery-thumb" src="${e.src}" alt="${e.label || name}" title="${e.label || ''}" loading="lazy">`
  ).join('');
  const labels = extras.map(e => `<span>${e.label || '?'}</span>`).join(' · ');
  return `
    <div class="fiche-gallery-title">📸 Plus d'images — <small style="font-weight:400;color:rgba(255,255,255,0.35)">${labels}</small></div>
    <div class="fiche-gallery">${thumbs}</div>
  `;
}

function esc(s) {
  return (s || '').replace(/'/g, '\\\'').replace(/"/g, '&quot;');
}

/* ── Carousel ── */
let carouselSrcs = [];
let carouselIdx = 0;

function openCarousel(srcs, idx) {
  carouselSrcs = srcs;
  carouselIdx = idx;
  const track = document.getElementById('carousel-track');
  const dots  = document.getElementById('carousel-dots');
  track.innerHTML = srcs.map(s =>
    `<div class="carousel-slide"><img src="${s.src}" alt="${s.label||''}"></div>`
  ).join('');
  dots.innerHTML = srcs.map((_, i) =>
    `<div class="c-dot${i===idx?' active':''}"></div>`
  ).join('');
  document.getElementById('carousel').classList.add('open');
  // Scroll to initial image
  requestAnimationFrame(() => {
    const slide = track.children[idx];
    if (slide) slide.scrollIntoView({ behavior:'auto', block:'nearest', inline:'center' });
  });
  updateCarouselLabel(idx);
  // Track scroll to update dots
  track.addEventListener('scroll', onCarouselScroll, { passive:true });
}

function onCarouselScroll() {
  const track = document.getElementById('carousel-track');
  const slideWidth = track.clientWidth;
  const newIdx = Math.round(track.scrollLeft / slideWidth);
  if (newIdx !== carouselIdx) {
    carouselIdx = newIdx;
    updateCarouselLabel(newIdx);
    document.querySelectorAll('.c-dot').forEach((d,i) => d.classList.toggle('active', i===newIdx));
  }
}

function updateCarouselLabel(idx) {
  const src = carouselSrcs[idx];
  document.getElementById('carousel-label').textContent = src && src.label ? src.label : '';
}

function closeCarousel() {
  document.getElementById('carousel').classList.remove('open');
  document.getElementById('carousel-track').removeEventListener('scroll', onCarouselScroll);
}

let _dinoAudio = null, _dinoAudioBtn = null;
function _stopDinoAudio() {
  if (_dinoAudio) { _dinoAudio.pause(); _dinoAudio = null; }
  if (_dinoAudioBtn) { _dinoAudioBtn.classList.remove('playing'); _dinoAudioBtn = null; }
}
// Joue le MP3 du bloc si dispo, sinon parle le fallback. btnEl = élément bouton (état visuel).
function playBloc(dinoId, bloc, fallbackTxt, btnEl) {
  const src = DINO_AUDIO[dinoId] && DINO_AUDIO[dinoId][bloc];
  stopSpeak();
  const wasThis = (_dinoAudioBtn === btnEl && _dinoAudio);
  _stopDinoAudio();
  if (wasThis) return; // re-tap sur le même = stop
  if (!src) { if (fallbackTxt) speakText(fallbackTxt); return; }
  _dinoAudio = new Audio(src);
  _dinoAudioBtn = btnEl || null;
  if (_dinoAudioBtn) _dinoAudioBtn.classList.add('playing');
  _dinoAudio.onended = _stopDinoAudio;
  _dinoAudio.onerror = () => { _stopDinoAudio(); if (fallbackTxt) speakText(fallbackTxt); };
  _dinoAudio.play().catch(() => { _stopDinoAudio(); if (fallbackTxt) speakText(fallbackTxt); });
}
function playDinoStory(id) {
  const btn = document.getElementById('dino-story-btn');
  playBloc(id, 'recap', null, btn);
}
function playBlocTaille(id, btnEl) {

}
