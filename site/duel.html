<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Duel de goût</title>
<style>
  /* ── La veillée au bord de l'étang ─────────────────────────
     nuit  #0E1A1E   l'eau au crépuscule (fond)
     berge #16262C   surfaces / cartes
     ligne #23383F   bordures hairline
     lueur #EFE6D0   ivoire lampe de chevet (texte)
     libellule #74C7DE  l'accent unique
     mousse #86B979  positif · argile #C97B5D  négatif
     roseau #8FA096  secondaire                              */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:#0E1A1E;
    background-image: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(239,230,208,.07), transparent 60%);
    color:#EFE6D0;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header { padding:16px 16px 10px; text-align:center; }
  header .titre {
    font-family:Georgia, serif; font-style:italic; font-weight:400;
    font-size:21px; color:#EFE6D0; letter-spacing:.5px;
  }
  header .titre svg { vertical-align:-4px; margin-right:7px; }
  header .cat {
    font-family:-apple-system, system-ui, sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase;
    color:#8FA096; margin-top:8px;
  }
  .progress {
    height:2px; background:#23383F; border-radius:2px;
    margin:12px 24px 0; overflow:visible; position:relative;
  }
  .progress > div {
    height:100%; background:linear-gradient(90deg, rgba(116,199,222,.25), #74C7DE);
    border-radius:2px; transition:width .5s cubic-bezier(.22,1,.36,1); position:relative;
  }
  .progress > div::after {
    content:''; position:absolute; right:-4px; top:-3px; width:8px; height:8px;
    border-radius:50%; background:#74C7DE;
    box-shadow:0 0 10px 2px rgba(116,199,222,.55);
  }
  main { flex:1; display:flex; flex-direction:column; gap:14px; padding:16px 14px 8px; overflow-y:auto; }
  .carte {
    background:#16262C; border:1px solid #23383F; border-radius:16px;
    padding:18px 17px 15px; cursor:pointer; position:relative;
    transition:border-color .2s, transform .12s, box-shadow .2s;
    min-height:88px;
  }
  .carte:active { transform:scale(.985); }
  .carte.choisie {
    border-color:#74C7DE; box-shadow:0 0 0 1px #74C7DE, 0 4px 24px rgba(116,199,222,.12);
  }
  .carte .lettre {
    position:absolute; top:-10px; left:16px; background:#0E1A1E; color:#74C7DE;
    border:1px solid #23383F; font-family:system-ui, sans-serif; font-weight:700;
    font-size:12px; letter-spacing:1px; padding:2px 11px; border-radius:10px;
  }
  .carte.choisie .lettre { background:#74C7DE; color:#0E1A1E; border-color:#74C7DE; }
  .carte .txt { font-size:17px; line-height:1.68; white-space:pre-wrap; }
  .carte.longue .txt { font-size:15.5px; line-height:1.7; max-height:38vh; overflow-y:auto; }
  .carte .meta { font-family:system-ui,sans-serif; font-size:11px; color:#8FA096; font-style:italic; margin-top:8px; }
  .neutres { display:flex; gap:10px; justify-content:center; padding:4px 14px 10px; }
  .neutres button {
    font-family:system-ui,sans-serif; font-size:13px; color:#8FA096;
    background:transparent; border:1px solid #23383F; border-radius:20px;
    padding:9px 18px; cursor:pointer;
  }
  .neutres button:active { border-color:#8FA096; }
  /* écran chips */
  .chips-panel { padding:8px 16px 16px; font-family:system-ui,sans-serif; }
  .chips-panel h3 { font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:#86B979; margin:14px 0 8px; }
  .chips-panel h3#h3-defauts, .chips-panel h3.neg { color:#C97B5D; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    font-family:system-ui,sans-serif; font-size:13.5px;
    background:transparent; border:1px solid #23383F; border-radius:18px;
    padding:9px 14px; cursor:pointer; color:#EFE6D0;
    transition:background .15s, border-color .15s;
  }
  .chip.on { background:#86B979; color:#0E1A1E; border-color:#86B979; font-weight:600; }
  .chip.neg.on { background:#C97B5D; border-color:#C97B5D; color:#0E1A1E; }
  .valider {
    display:block; width:calc(100% - 32px); margin:18px auto 8px;
    font-family:system-ui,sans-serif; font-size:15.5px; font-weight:700;
    background:#74C7DE; color:#0E1A1E; border:none; border-radius:13px;
    padding:14px; cursor:pointer; letter-spacing:.3px;
  }
  /* écran final */
  .final { padding:22px 18px; }
  .final h2 { font-family:Georgia,serif; font-style:italic; font-weight:400; font-size:22px; color:#74C7DE; margin-bottom:12px; }
  .final p { font-size:14.5px; line-height:1.55; margin-bottom:12px; font-family:system-ui,sans-serif; color:#B9BFA9; }
  textarea {
    width:100%; height:130px; background:#0A1316; color:#74C7DE;
    border:1px solid #23383F; border-radius:10px; padding:10px;
    font-family:ui-monospace, monospace; font-size:11px;
  }
  .hidden { display:none !important; }
  @media (prefers-reduced-motion: reduce) {
    .progress > div { transition:none; }
    .carte { transition:none; }
  }
</style>
</head>
<body>
  <header>
    <div class="titre"><svg width="30" height="16" viewBox="0 0 30 16" fill="none" aria-hidden="true"><ellipse cx="10" cy="6" rx="9" ry="2.6" fill="#74C7DE" opacity=".35" transform="rotate(-16 10 6)"/><ellipse cx="20" cy="6" rx="9" ry="2.6" fill="#74C7DE" opacity=".35" transform="rotate(16 20 6)"/><ellipse cx="11" cy="9.5" rx="7" ry="2" fill="#74C7DE" opacity=".55" transform="rotate(-24 11 9.5)"/><ellipse cx="19" cy="9.5" rx="7" ry="2" fill="#74C7DE" opacity=".55" transform="rotate(24 19 9.5)"/><rect x="14.4" y="3.5" width="1.6" height="11" rx="0.8" fill="#74C7DE"/><circle cx="15.2" cy="3.2" r="1.7" fill="#74C7DE"/></svg>Duel de goût</div>
    <div class="cat" id="categorie"></div>
    <div class="progress"><div id="bar" style="width:0%"></div></div>
  </header>

  <main id="ecran-duel">
    <div class="carte" id="carteA" onclick="choisir('a')">
      <span class="lettre">A</span>
      <div class="txt" id="txtA"></div>
    </div>
    <div class="carte" id="carteB" onclick="choisir('b')">
      <span class="lettre">B</span>
      <div class="txt" id="txtB"></div>
    </div>
  </main>
  <div class="neutres" id="neutres">
    <button onclick="choisir('egal')">≈ égalité</button>
    <button onclick="choisir('aucun')">aucun des deux 👎</button>
  </div>

  <div class="chips-panel hidden" id="ecran-chips">
    <div id="bloc-pourquoi">
      <h3>Ce qui m'a fait choisir <span style="color:#e6dfc8">(1 à 3, optionnel)</span></h3>
      <div class="chips" id="chips-pourquoi"></div>
    </div>
    <h3 id="h3-defauts">Le perdant pèche par…</h3>
    <div class="chips" id="chips-defauts"></div>
    <button class="valider" onclick="suivant()">Duel suivant →</button>
  </div>

  <div class="final hidden" id="ecran-final">
    <h2>✅ Terminé — merci Papa Yann !</h2>
    <p id="resume"></p>
    <p>Copie ce JSON et colle-le à Claude (Telegram ou session) — il met à jour ta mémoire de goût et la sélection :</p>
    <textarea id="json" readonly onclick="this.select()"></textarea>
    <button class="valider" onclick="copier()">📋 Copier le JSON</button>
  </div>

<script src="duel-data.js"></script>
<script>
(function(){
  if (!window.DUEL_DATA || !DUEL_DATA.duels || !DUEL_DATA.duels.length) {
    document.getElementById('categorie').textContent = 'Erreur : duel-data.js introuvable ou vide';
    return;
  }
})();

var D = window.DUEL_DATA;
var i = 0;
var resultats = [];
var choixCourant = null;
var chipsChoisies = [];
var defautsChoisis = [];

function afficherDuel() {
  var d = D.duels[i];
  document.getElementById('categorie').textContent = d.categorie + '  ·  ' + (i+1) + '/' + D.duels.length;
  document.getElementById('bar').style.width = Math.round(i / D.duels.length * 100) + '%';
  document.getElementById('txtA').textContent = d.a.texte;
  document.getElementById('txtB').textContent = d.b.texte;
  var longue = !!d.final;
  document.getElementById('carteA').classList.toggle('longue', longue);
  document.getElementById('carteB').classList.toggle('longue', longue);
  document.getElementById('carteA').classList.remove('choisie');
  document.getElementById('carteB').classList.remove('choisie');
  document.getElementById('ecran-duel').classList.remove('hidden');
  document.getElementById('neutres').classList.remove('hidden');
  document.getElementById('ecran-chips').classList.add('hidden');
  window.scrollTo(0,0);
}

function choisir(choix) {
  choixCourant = choix;
  chipsChoisies = [];
  defautsChoisis = [];
  if (choix === 'a' || choix === 'b') {
    document.getElementById('carte' + choix.toUpperCase()).classList.add('choisie');
    setTimeout(montrerChips, 180);
  } else if (choix === 'aucun') {
    // aucun des deux → on demande POURQUOI ça ne va pas (défauts communs)
    montrerChips();
  } else {
    // égalité → les deux tiennent, pas de chips, on enchaîne
    enregistrer();
    avancer();
  }
}

function montrerChips() {
  var refus = (choixCourant === 'aucun');
  var zp = document.getElementById('chips-pourquoi');
  var zd = document.getElementById('chips-defauts');
  zp.innerHTML = ''; zd.innerHTML = '';
  D.chips.pourquoi.forEach(function(c){ zp.appendChild(mkChip(c, chipsChoisies, false)); });
  D.chips.defauts.forEach(function(c){ zd.appendChild(mkChip(c, defautsChoisis, true)); });
  // Refus des deux → pas de « ce qui m'a fait choisir », juste pourquoi ça pèche
  document.getElementById('bloc-pourquoi').classList.toggle('hidden', refus);
  document.getElementById('h3-defauts').textContent =
    refus ? 'Pourquoi aucun des deux ? (ce qui pèche)' : 'Le perdant pèche par…';
  document.getElementById('ecran-duel').classList.add('hidden');
  document.getElementById('neutres').classList.add('hidden');
  document.getElementById('ecran-chips').classList.remove('hidden');
  window.scrollTo(0,0);
}

function mkChip(label, arr, neg) {
  var b = document.createElement('button');
  b.className = 'chip' + (neg ? ' neg' : '');
  b.textContent = label;
  b.onclick = function() {
    var idx = arr.indexOf(label);
    if (idx >= 0) { arr.splice(idx,1); b.classList.remove('on'); }
    else if (neg || arr.length < 3) { arr.push(label); b.classList.add('on'); }
  };
  return b;
}

function enregistrer() {
  var d = D.duels[i];
  resultats.push({
    id: d.id,
    categorie: d.categorie,
    choix: choixCourant,
    gagnant: choixCourant === 'a' ? d.a.source : (choixCourant === 'b' ? d.b.source : null),
    perdant: choixCourant === 'a' ? d.b.source : (choixCourant === 'b' ? d.a.source : null),
    pourquoi: chipsChoisies.slice(),
    defautsPerdant: defautsChoisis.slice()
  });
}

function suivant() {
  enregistrer();
  avancer();
}

function avancer() {
  i++;
  if (i < D.duels.length) { afficherDuel(); }
  else { terminer(); }
}

function terminer() {
  document.getElementById('ecran-duel').classList.add('hidden');
  document.getElementById('neutres').classList.add('hidden');
  document.getElementById('ecran-chips').classList.add('hidden');
  document.getElementById('bar').style.width = '100%';
  document.getElementById('categorie').textContent = 'Fini !';

  var scores = {};
  resultats.forEach(function(r){
    if (r.gagnant) scores[r.gagnant] = (scores[r.gagnant] || 0) + 1;
  });
  var podium = Object.keys(scores).sort(function(a,b){ return scores[b]-scores[a]; });
  var duelFinal = resultats.filter(function(r){ return r.id === 'final'; })[0];

  document.getElementById('resume').textContent =
    resultats.length + ' duels joués. ' +
    (duelFinal && duelFinal.gagnant ? 'Ta finale : version « ' + (duelFinal.choix||'').toUpperCase() + ' ». ' : '') +
    'Le détail (qui a écrit quoi) reste caché ici — Claude te le révélera à l\'ingestion.';

  var payload = {
    outil: 'duel-de-gout',
    domaine: D.domaine,
    story: D.story,
    vague: D.vague,
    date: new Date().toISOString().slice(0,10),
    resultats: resultats,
    scoresParSource: scores,
    podiumPredit: podium
  };
  document.getElementById('json').value = JSON.stringify(payload, null, 1);
  document.getElementById('ecran-final').classList.remove('hidden');
}

function copier() {
  var ta = document.getElementById('json');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try { document.execCommand('copy'); } catch(e) {}
  if (navigator.clipboard) { navigator.clipboard.writeText(ta.value).catch(function(){}); }
  document.querySelector('#ecran-final .valider').textContent = '✅ Copié !';
}

afficherDuel();
</script>
</body>
</html>
