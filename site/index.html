<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MaxPlay – Les jeux de Max</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family:'Nunito',sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100dvh; display:flex; flex-direction:column; align-items:center;
      padding:16px 0 calc(30px + env(safe-area-inset-bottom));
      overflow-x:hidden;
    }

    /* ── Header (identité conservée : bus qui défile + jingle) ── */
    .header { text-align:center; margin-bottom:14px; padding:0 16px; }
    .header .bus-tagline { color:rgba(255,255,255,0.9); font-size:0.95rem; font-weight:700; margin-bottom:6px; }
    .header .bus-display { display:flex; justify-content:center; align-items:center; min-height:74px; margin-bottom:4px; }
    .header .bus-display svg { transition:opacity 0.5s ease; }
    .header .bus-display.fading svg { opacity:0; }
    .header h1 { color:#fff; font-size:2.2rem; font-weight:900; text-shadow:3px 3px 0 rgba(0,0,0,0.2); margin:2px 0; }
    .header .subtitle { color:rgba(255,255,255,0.9); font-size:1rem; font-weight:700; }

    /* ── Sections par catégorie (rangées horizontales) ── */
    .board { width:100%; max-width:880px; }
    .section { color:#fff; font-size:1.2rem; font-weight:900; text-shadow:2px 2px 0 rgba(0,0,0,0.18);
               margin:18px 0 8px; padding:0 18px; display:flex; align-items:center; gap:8px; }
    .section .count { font-size:0.78rem; font-weight:800; color:rgba(255,255,255,0.78); background:rgba(255,255,255,0.16);
                      padding:2px 9px; border-radius:12px; }

    /* Rangée scrollable horizontale (style Netflix) */
    .row {
      display:flex; gap:12px; overflow-x:auto; padding:4px 18px 12px;
      scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .row::-webkit-scrollbar { display:none; }

    /* ── Vignette de jeu (carrée) ── */
    .card {
      position:relative; flex:0 0 auto; width:120px; scroll-snap-align:start;
      background:#fff; border:none; border-radius:18px; padding:0 0 9px; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; gap:5px;
      box-shadow:0 7px 18px rgba(0,0,0,0.18); cursor:pointer; font-family:inherit; color:#333;
      transition:transform 0.15s, box-shadow 0.15s;
    }
    .card:active { transform:scale(0.95); }
    .card .cover { width:100%; height:86px; display:flex; align-items:center; justify-content:center; font-size:2.9rem; line-height:1; }
    .card .title { font-size:0.84rem; font-weight:900; color:#1a1a1a; line-height:1.13; padding:0 7px; text-align:center; }

    /* étoiles */
    .stars { display:flex; align-items:center; gap:1px; flex-wrap:wrap; justify-content:center; padding:0 5px; min-height:16px; }
    .star { font-size:0.82rem; color:#dcdce4; line-height:1; }
    .star.on { color:#FFC107; text-shadow:0 1px 2px rgba(255,160,0,0.4); }
    .stars.maxed .trophy { font-size:0.55rem; font-weight:900; color:#fff; background:linear-gradient(135deg,#ffb300,#ff7043);
                           padding:2px 6px; border-radius:9px; margin-left:3px; letter-spacing:0.3px; }

    /* carte verrouillée */
    .card.locked { filter:grayscale(0.9); opacity:0.6; box-shadow:0 4px 10px rgba(0,0,0,0.12); }
    .card.locked::after { content:'🔒'; position:absolute; top:7px; right:9px; font-size:1rem; filter:none; }
    .card .lock { font-size:0.66rem; font-weight:900; color:#5a5a7a; min-height:16px; }

    /* secousse (feedback non punitif) */
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
    .shake { animation:shake 0.35s; }

    /* toast info */
    .toast {
      position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
      background:rgba(0,0,0,0.85); color:#fff; padding:11px 18px; border-radius:16px; font-weight:800;
      font-size:0.92rem; box-shadow:0 6px 20px rgba(0,0,0,0.4); opacity:0; pointer-events:none;
      transition:opacity 0.25s, transform 0.25s; z-index:50; max-width:90vw; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }

    /* ── Modale code (déverrouillage dinos) ── */
    .modal { position:fixed; inset:0; background:rgba(20,16,40,0.72); display:none; align-items:center; justify-content:center;
             padding:20px; z-index:100; }
    .modal.show { display:flex; }
    .modal-box { background:#fff; border-radius:22px; padding:24px 22px; width:100%; max-width:340px; text-align:center;
                 box-shadow:0 18px 50px rgba(0,0,0,0.4); }
    .modal-box .m-emoji { font-size:2.6rem; }
    .modal-box h3 { font-size:1.2rem; font-weight:900; color:#1a1a2e; margin:6px 0 4px; }
    .modal-box p  { font-size:0.85rem; color:#777; margin-bottom:14px; }
    .modal-box input {
      width:100%; padding:13px; font-size:1.3rem; font-weight:900; text-align:center; text-transform:uppercase;
      letter-spacing:3px; border:3px solid #d5d5e5; border-radius:14px; font-family:inherit; color:#333; outline:none;
    }
    .modal-box input:focus { border-color:#7a4a9a; }
    .modal-msg { min-height:20px; font-size:0.82rem; font-weight:800; color:#e53935; margin-top:8px; }
    .modal-actions { display:flex; gap:10px; margin-top:14px; }
    .modal-actions button {
      flex:1; padding:13px; border:none; border-radius:14px; font-family:inherit; font-weight:900; font-size:1rem;
      cursor:pointer;
    }
    .btn-go     { background:linear-gradient(135deg,#7a4a9a,#4a8a4a); color:#fff; }
    .btn-cancel { background:#eee; color:#555; }

    footer { margin-top:24px; color:rgba(255,255,255,0.75); font-size:0.9rem; text-align:center; padding:0 16px; }
    footer a { color:rgba(255,255,255,0.3); font-size:0.7rem; text-decoration:none; font-weight:700; letter-spacing:1px; }
  </style>
</head>
<body>
  <div class="header">
    <p class="bus-tagline">Aujourd'hui Max prend le...</p>
    <div class="bus-display" id="busDisplay" aria-live="polite"></div>
    <h1>MaxPlay</h1>
    <p class="subtitle">Les jeux de Max !</p>
  </div>

  <main class="board" id="board"><!-- généré depuis catalog.js --></main>

  <footer>
    🚌 Fait avec ❤️ pour Max
    <br><a href="suivi.html">📊 Suivi parental</a> · <a href="duel.html">⚔️ Duel de goût</a> · <a href="lecture.html">📖 Lecture annotée</a>
  </footer>

  <!-- Modale code (déverrouillage par mot-clé — local, aucun compte) -->
  <div class="modal" id="code-modal" aria-hidden="true">
    <div class="modal-box">
      <div class="m-emoji">🦕</div>
      <h3>Un code secret ?</h3>
      <p>Demande le mot magique à un grand pour ouvrir les dinos !</p>
      <input id="code-input" type="text" inputmode="text" autocomplete="off" placeholder="• • • • • •" aria-label="Code">
      <div class="modal-msg" id="code-msg"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="code-cancel">Plus tard</button>
        <button class="btn-go" id="code-go">Ouvrir !</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/unlock.js"></script>
  <script src="js/data.js"></script>
  <script src="js/bus-svg.js"></script>
  <script>
  (function () {
    const CAT = window.MAXPLAY_CATALOG || [];
    const board = document.getElementById('board');
    const modal = document.getElementById('code-modal');
    const input = document.getElementById('code-input');
    const msg   = document.getElementById('code-msg');
    const toast = document.getElementById('toast');

    // Couleur d'accent par catégorie (cover des vignettes)
    const CATCOLORS = {
      compter:'#5b8fff', couleurs:'#ff7043', lire:'#26c6da', logique:'#ab47bc',
      bricoler:'#8d6e63', observer:'#ec407a', monde:'#26a69a', libre:'#ffa726', dinos:'#66bb6a',
    };

    // ── Rendu ────────────────────────────────────────────────────────────
    function starsHtml(id) {
      const max = window.Stars ? Stars.max(id) : 0;
      if (!max) return '<span class="lock" style="color:#9aa">🎮 Libre</span>';
      const got = Stars.get(id);
      let s = '';
      for (let i = 0; i < max; i++) s += `<span class="star ${i < got ? 'on' : ''}">★</span>`;
      const done = got >= max;
      return `<div class="stars ${done ? 'maxed' : ''}">${s}${done ? '<span class="trophy">🏆</span>' : ''}</div>`;
    }

    function cardHtml(e) {
      const unlocked = Unlock.isUnlocked(e.id);
      const reason = Unlock.lockedReason(e.id);
      const c = CATCOLORS[e.category] || '#8a8a9a';
      const lockTxt = reason === 'code' ? '🔑 Code' : '⭐ À gagner';
      const foot = unlocked ? starsHtml(e.id) : `<span class="lock">${lockTxt}</span>`;
      return `<button class="card ${unlocked ? '' : 'locked'}" data-id="${e.id}" data-url="${e.url}" data-reason="${reason || ''}">
        <span class="cover" style="background:linear-gradient(160deg,${c}2e,${c}12)">${e.emoji}</span>
        <span class="title">${e.titre}</span>
        ${foot}
      </button>`;
    }

    function sectionHtml(title, items) {
      if (!items.length) return '';
      return `<h2 class="section">${title}<span class="count">${items.length}</span></h2>
              <div class="row">${items.map(cardHtml).join('')}</div>`;
    }

    function render() {
      const cats = window.MAXPLAY_CATEGORIES || [];
      board.innerHTML = cats.map(c => {
        const items = CAT.filter(e => e.category === c.id);
        return sectionHtml(`${c.emoji} ${c.label}`, items);
      }).join('');
    }

    // ── Interactions ──────────────────────────────────────────────────────
    function showToast(txt) {
      toast.textContent = txt; toast.classList.add('show');
      clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    board.addEventListener('click', (ev) => {
      const card = ev.target.closest('.card'); if (!card) return;
      const id = card.dataset.id, url = card.dataset.url;
      if (Unlock.isUnlocked(id)) { location.href = url; return; }
      if (card.dataset.reason === 'code') { openModal(); }
      else { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
             showToast(`Gagne ${Unlock.UNLOCK_STARS} ⭐ au jeu d'avant pour l'ouvrir !`); }
    });

    function openModal() { msg.textContent = ''; input.value = ''; modal.classList.add('show'); setTimeout(() => input.focus(), 50); }
    function closeModal() { modal.classList.remove('show'); }

    async function validateCode() {
      const r = await Unlock.redeem(input.value);
      if (r.ok) { closeModal(); render(); showToast('Bravo ! Les dinos sont ouverts ! 🦕'); }
      else { msg.textContent = 'Code pas bon — redemande à un grand 🙂';
             const box = modal.querySelector('.modal-box'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    }

    document.getElementById('code-go').addEventListener('click', validateCode);
    document.getElementById('code-cancel').addEventListener('click', closeModal);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') validateCode(); });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    render();

    // ── Header : bus préféré qui défile (identité conservée) ──────────────
    (function cycleBus() {
      const display = document.getElementById('busDisplay');
      if (!display || typeof LIGNES === 'undefined' || typeof busSVG !== 'function') return;
      const pool = LIGNES.slice().sort(() => Math.random() - 0.5);
      let idx = 0;
      const draw = () => { const l = pool[idx]; display.innerHTML = busSVG(l.color, l.textColor, l.num, 200); idx = (idx + 1) % pool.length; };
      draw();
      setInterval(() => { display.classList.add('fading'); setTimeout(() => { draw(); display.classList.remove('fading'); }, 500); }, 3500);
    })();

    // ── Jingle au 1er clic (identité conservée) ───────────────────────────
    const JINGLES = ['sounds/ratp-jingle.mp3', 'sounds/sncf-france-jingle.mp3'];
    const jingle = new Audio(JINGLES[Math.floor(Math.random() * JINGLES.length)]);
    jingle.volume = 0.5;
    document.addEventListener('click', function once() { jingle.play().catch(() => {}); document.removeEventListener('click', once); }, { once: true });
    jingle.play().catch(() => {});
  })();
  </script>
</body>
</html>
