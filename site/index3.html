<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>MaxPlay — La fusée de Max</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* ═══ La fusée de Max — scène spatiale VERTICALE ═══
       Réutilise theme.css : zones (--zone-h), panneau lieu, modal, toast.
       Ici : uniquement la scène espace. */

    .space-body {
      font-family: 'Nunito', sans-serif;
      background: #0a0e2a;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #scene {
      position: relative;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    #scene::-webkit-scrollbar { display: none; }

    #world {
      position: relative;
      width: 100%;
      /* hauteur fixée en JS */
      background: linear-gradient(180deg,
        #05030f 0%,          /* espace profond (en haut) */
        #0a0e2a 34%,
        #141b47 62%,
        #232a6b 82%,
        #34386b 92%,
        #1b2c4e 100%);        /* lueur de la Terre (en bas) */
    }

    /* ── Étoiles : 2 couches (parallax léger via vitesses de twinkle) ── */
    .st { position: absolute; border-radius: 50%; background: #fff; }
    .st.far  { width: 2px; height: 2px; opacity: .35; animation: twinkle 4.5s ease-in-out infinite; }
    .st.near { width: 3.5px; height: 3.5px; opacity: .6; animation: twinkle 2.8s ease-in-out infinite;
               box-shadow: 0 0 6px #fff8; }
    .shooting {
      position: absolute;
      width: 90px; height: 2px;
      background: linear-gradient(90deg, #fff, transparent);
      border-radius: 2px;
      opacity: 0;
      transform: rotate(-35deg);
      animation: shoot 9s linear infinite;
    }
    @keyframes shoot {
      0%, 92%  { opacity: 0; transform: rotate(-35deg) translateX(0); }
      94%      { opacity: .9; }
      100%     { opacity: 0; transform: rotate(-35deg) translateX(-340px); }
    }

    /* ── La Terre en bas : rampe de lancement de Max ── */
    .earth {
      position: absolute;
      bottom: -46vw;
      left: 50%;
      transform: translateX(-50%);
      width: 160vw;
      height: 80vw;
      max-width: 1400px;
      max-height: 700px;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      background: radial-gradient(ellipse at 50% 0%, #3fa66b 0%, #2c7d54 34%, #1f5a44 60%, #143c33 100%);
      box-shadow: 0 -14px 60px 6px #66d9a655;
      overflow: hidden;
    }
    .earth::before {           /* continents stylisés */
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120px 50px at 30% 22%, #57c187aa, transparent 70%),
        radial-gradient(ellipse 160px 60px at 72% 30%, #57c187aa, transparent 70%);
    }
    .launchpad {
      position: absolute;
      bottom: 34vw;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 12px;
      max-bottom: 320px;
      background: #55607a;
      border-radius: 6px;
      box-shadow: 0 4px 0 #3a4258, 0 0 24px #8fb6ff33;
    }

    /* ── Trajectoire pointillée entre les planètes ── */
    .traj {
      position: absolute;
      left: 50%;
      width: 4px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(180deg,
        #ffffff3a 0 12px, transparent 12px 30px);
      border-radius: 2px;
      pointer-events: none;
    }

    /* ── Planètes ── */
    .planet {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      width: var(--pl-size, 170px);
    }
    .planet .globe {
      width: 100%;
      display: block;
      filter: drop-shadow(0 0 26px hsl(var(--zone-h) 80% 60% / .38));
      animation: floaty 6s ease-in-out infinite;
    }
    .planet:nth-child(odd) .globe { animation-delay: -3s; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }
    .planet:active .globe { transform: scale(.95); }

    /* réutilise l'esthétique stop-sign de theme.css, décliné espace */
    .planet .stop-sign { white-space: normal; text-align: center; line-height: 1.15; }

    .planet .stop-stars {
      position: absolute;
      top: -6px;
      right: -2px;
    }

    /* ── La fusée ── */
    #rocket {
      position: absolute;
      left: 50%;
      width: 74px;
      margin-left: -37px;
      will-change: transform;
      pointer-events: none;
      z-index: 6;
      filter: drop-shadow(0 4px 14px #0009);
    }
    #rocket .flame {
      transform-origin: 50% 0%;
      animation: idleFlame 0.9s ease-in-out infinite;
      opacity: .85;
    }
    @keyframes idleFlame {
      0%, 100% { transform: scaleY(.55); opacity: .7; }
      50%      { transform: scaleY(.8); opacity: .95; }
    }
    #rocket.flying .flame { animation: fullFlame 0.14s linear infinite; opacity: 1; }
    @keyframes fullFlame {
      0%   { transform: scaleY(1.35) scaleX(1); }
      50%  { transform: scaleY(1.7)  scaleX(.86); }
      100% { transform: scaleY(1.35) scaleX(1); }
    }
    #rocket.flying { animation: rumble .18s linear infinite; }
    @keyframes rumble {
      0%, 100% { margin-left: -37px; }
      50%      { margin-left: -35.5px; }
    }
    #rocket.down svg { transform: rotate(180deg); }
    #rocket.down .flame { transform-origin: 50% 100%; }

    /* header : réutilise .hub-hdr de theme.css ; titre adapté */

    @media (max-width: 640px) {
      .planet { --pl-size: 148px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .planet .globe, #rocket.flying, .shooting, .st { animation: none; }
    }
  </style>
</head>
<body class="space-body">

  <header class="hub-hdr">
    <div class="hub-title">La fusée de Max<small>Choisis ta planète</small></div>
    <div class="hub-starcount"><span>★</span><span id="totalStars">0</span></div>
  </header>

  <div id="scene">
    <div id="world"></div>
  </div>

  <div id="panel">
    <div class="panel-hdr">
      <button class="panel-back" id="panelBack" aria-label="Retour">←</button>
      <div class="panel-title" id="panelTitle"></div>
    </div>
    <div class="panel-games" id="panelGames"></div>
  </div>

  <div class="code-modal" id="codeModal">
    <div class="code-box">
      <h3>🔑 Demande le code à un adulte !</h3>
      <input id="codeInput" maxlength="12" autocomplete="off">
      <div class="row">
        <button class="no" id="codeNo">Non</button>
        <button class="go" id="codeGo">GO !</button>
      </div>
    </div>
  </div>

  <div class="hub-toast" id="toast"></div>

  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/unlock.js"></script>
  <script src="js/celebrate.js"></script>
  <script>
  // ───────────────────────────────────────────────────────────────────────
  //  La fusée de Max — hub v3 vertical (même logique que la ligne de bus)
  //  Terre en bas → 6 planètes en montant. La fusée vole, tap = skip.
  // ───────────────────────────────────────────────────────────────────────

  // Ordre VERTICAL : premier = le plus proche de la Terre (en bas)
  const PLANETS = [
    { zone:'dodo',     label:'La planète Dodo',     speak:'La planète dodo des bus',   categories:['compter','logique'] },
    { zone:'garage',   label:'La planète Garage',   speak:'La planète garage',         categories:['couleurs','bricoler','libre'] },
    { zone:'lettres',  label:'La planète des Lettres', speak:'La planète des lettres', categories:['lire'] },
    { zone:'monde',    label:'La planète Monde',    speak:'La planète du monde',       categories:['monde','observer'] },
    { zone:'dinos',    label:'La planète des Dinos', speak:'La planète des dinos',     categories:['dinos'] },
    { zone:'roulotte', label:'La comète aux histoires', speak:'La comète aux histoires', categories:[] },
  ];

  const NARROW = innerWidth < 640;
  const GAP    = NARROW ? 300 : 340;    // px vertical entre planètes
  const PAD_B  = NARROW ? 300 : 330;    // espace Terre + rampe en bas
  const PAD_T  = 170;                   // espace au-dessus de la dernière planète
  const ROCKET_H = 96;

  const world = document.getElementById('world');
  const scene = document.getElementById('scene');
  const panel = document.getElementById('panel');
  const toast = document.getElementById('toast');

  const worldH = PAD_T + (PLANETS.length - 1) * GAP + GAP + PAD_B;
  world.style.height = worldH + 'px';
  // y (depuis le HAUT du monde) de chaque planète — index 0 en bas
  const planetY = i => PAD_T + (PLANETS.length - 1 - i) * GAP;
  const padY = worldH - PAD_B + 40;     // rampe de lancement

  // ── Planètes SVG : globe gradient + cratères + détail par zone ─────────
  function globe(zone) {
    const uid = 'g' + zone;
    const detail = {
      dodo: `<path d="M58 62 q14 -12 30 0 q-14 10 -30 0" fill="#0e1235" opacity=".55"/>
             <ellipse cx="104" cy="88" rx="13" ry="10" fill="#0e1235" opacity=".35"/>
             <text x="112" y="46" font-size="21" fill="#ffe066" font-weight="bold">z</text>
             <text x="126" y="32" font-size="15" fill="#ffe066" font-weight="bold">z</text>
             <circle cx="34" cy="34" r="9" fill="#fff8e1" opacity=".85"/>`,
      garage: `<rect x="62" y="58" width="42" height="30" rx="6" fill="#7c3a12" opacity=".8"/>
             <rect x="70" y="66" width="12" height="10" rx="2" fill="#ffe066"/>
             <rect x="86" y="66" width="12" height="10" rx="2" fill="#ffe066"/>
             <ellipse cx="46" cy="96" rx="12" ry="8" fill="#7c3a12" opacity=".5"/>
             <path d="M116 40 a10 10 0 1 0 6 18 l10 10 6 -6 -10 -10 a10 10 0 0 0 -12 -12 z" fill="#e8edf2" opacity=".9"/>`,
      lettres: `<ellipse cx="60" cy="58" rx="16" ry="11" fill="#0d3550" opacity=".5"/>
             <ellipse cx="102" cy="92" rx="20" ry="12" fill="#0d3550" opacity=".4"/>
             <text x="56" y="66" font-size="24" fill="#fff" font-weight="bold">A</text>
             <text x="92" y="100" font-size="20" fill="#ffe066" font-weight="bold">b</text>
             <text x="108" y="52" font-size="17" fill="#fff" opacity=".9" font-weight="bold">c</text>`,
      monde: `<path d="M48 62 q16 -14 34 -4 q14 8 28 0" stroke="#27ae60" stroke-width="9" fill="none" opacity=".75" stroke-linecap="round"/>
             <path d="M56 92 q20 12 44 2" stroke="#27ae60" stroke-width="8" fill="none" opacity=".65" stroke-linecap="round"/>
             <rect x="98" y="30" width="3.5" height="20" fill="#e8edf2"/>
             <rect x="101.5" y="30" width="15" height="9" fill="#E2001A"/>`,
      dinos: `<path d="M96 88 l8 -34 10 34 z" fill="#5d4037"/>
             <path d="M101 64 l3 -10 4 10 z" fill="#ff7043"/>
             <path d="M44 92 q8 -26 26 -27 q16 1 22 27 z" fill="#145236" opacity=".9"/>
             <path d="M58 74 q4 -12 12 -12 q4 0 7 4 l6 -3 -4 6 q3 5 1 5 z" fill="#0d3a26"/>
             <ellipse cx="112" cy="46" rx="10" ry="7" fill="#0d3a26" opacity=".4"/>`,
      roulotte: `<circle cx="82" cy="72" r="14" fill="#ffe066" opacity=".95"/>
             <circle cx="82" cy="72" r="20" fill="none" stroke="#ffe066" stroke-width="2.5" opacity=".4"/>
             <circle cx="82" cy="72" r="27" fill="none" stroke="#ffe066" stroke-width="1.5" opacity=".22"/>
             <circle cx="112" cy="46" r="4" fill="#ffb27a"/>
             <circle cx="50" cy="96" r="3" fill="#ffb27a" opacity=".8"/>`,
    }[zone] || '';
    const ring = (zone === 'monde' || zone === 'dodo')
      ? `<ellipse cx="82" cy="82" rx="76" ry="20" fill="none" stroke="hsl(var(--zone-h) 80% 75%)" stroke-width="5" opacity=".5" transform="rotate(-16 82 82)"/>`
      : '';
    return `<svg class="globe" viewBox="0 0 164 164">
      <defs>
        <radialGradient id="${uid}" cx="34%" cy="30%" r="78%">
          <stop offset="0%"  stop-color="hsl(var(--zone-h) 75% 72%)"/>
          <stop offset="55%" stop-color="hsl(var(--zone-h) 65% 48%)"/>
          <stop offset="100%" stop-color="hsl(var(--zone-h) 60% 26%)"/>
        </radialGradient>
      </defs>
      ${ring}
      <circle cx="82" cy="82" r="58" fill="url(#${uid})"/>
      <ellipse cx="62" cy="52" rx="20" ry="12" fill="#fff" opacity=".18" transform="rotate(-24 62 52)"/>
      ${detail}
    </svg>`;
  }

  // ── Construire le monde ────────────────────────────────────────────────
  // Étoiles 2 couches + étoiles filantes
  for (let i = 0; i < Math.floor(worldH / 26); i++) {
    const s = document.createElement('div');
    s.className = 'st ' + (Math.random() < 0.6 ? 'far' : 'near');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * (worldH - 260) + 'px';
    s.style.animationDelay = (Math.random() * 4) + 's';
    world.appendChild(s);
  }
  for (let i = 0; i < 3; i++) {
    const f = document.createElement('div');
    f.className = 'shooting';
    f.style.left = (15 + Math.random() * 70) + '%';
    f.style.top = (i * worldH / 3.5 + 80) + 'px';
    f.style.animationDelay = (i * 3.1) + 's';
    world.appendChild(f);
  }

  // Trajectoire pointillée (de la rampe à la dernière planète)
  const traj = document.createElement('div');
  traj.className = 'traj';
  traj.style.top = (PAD_T - 40) + 'px';
  traj.style.height = (padY - PAD_T + 20) + 'px';
  world.appendChild(traj);

  // Terre + rampe
  const earth = document.createElement('div');
  earth.className = 'earth';
  world.appendChild(earth);
  const pad = document.createElement('div');
  pad.className = 'launchpad';
  pad.style.bottom = '';
  pad.style.top = padY + 'px';
  world.appendChild(pad);

  // Planètes (alternance gauche/droite pour le rythme visuel)
  const zoneStars = (p) => window.MAXPLAY_CATALOG
    .filter(e => p.categories.includes(e.category))
    .reduce((n, e) => n + Stars.get(e.id), 0);

  PLANETS.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'planet';
    el.dataset.zone = p.zone;
    el.style.top = planetY(i) + 'px';
    el.style.left = (i % 2 === 0 ? 32 : 68) + '%';
    const zs = zoneStars(p);
    el.innerHTML = globe(p.zone) +
      `<div class="stop-sign"><span class="dot"></span>${p.label}</div>` +
      (zs > 0 ? `<div class="stop-stars">★ ${zs}</div>` : '');
    el.addEventListener('click', () => onPlanetTap(i));
    world.appendChild(el);
  });

  // ── La fusée ───────────────────────────────────────────────────────────
  const rocket = document.createElement('div');
  rocket.id = 'rocket';
  rocket.innerHTML = `<svg viewBox="0 0 74 110">
    <g class="flame" transform="translate(0 84)">
      <path d="M30 0 Q37 26 37 30 Q37 26 44 0 Q37 8 30 0" fill="#ff9d3f"/>
      <path d="M33 0 Q37 16 37 19 Q37 16 41 0 Q37 5 33 0" fill="#ffe066"/>
    </g>
    <path d="M37 2 Q54 22 54 52 L54 78 Q54 84 48 84 L26 84 Q20 84 20 78 L20 52 Q20 22 37 2" fill="#ecf0f1"/>
    <path d="M37 2 Q49 18 51 40 L23 40 Q25 18 37 2" fill="#E2001A"/>
    <circle cx="37" cy="52" r="9.5" fill="#1a2a3a" stroke="#9fb2c8" stroke-width="3.5"/>
    <circle cx="34.5" cy="49.5" r="3" fill="#5ed4ff" opacity=".8"/>
    <path d="M20 58 Q6 70 8 88 L20 78 Z" fill="#E2001A"/>
    <path d="M54 58 Q68 70 66 88 L54 78 Z" fill="#E2001A"/>
    <rect x="26" y="84" width="22" height="5" rx="2.5" fill="#9fb2c8"/>
  </svg>`;
  world.appendChild(rocket);

  // position fusée : posée sur la rampe au départ
  let rocketY = padY - ROCKET_H;        // top du rocket dans le monde
  let rocketPct = 50;                   // % horizontal
  let flying = false;
  let skipRequested = false;
  placeRocket();

  function placeRocket() {
    rocket.style.transform = `translateY(${rocketY}px)`;
    rocket.style.left = rocketPct + '%';
  }
  function centerScroll(y, instant) {
    const target = Math.max(0, Math.min(worldH - scene.clientHeight, y - scene.clientHeight * 0.55));
    if (instant) scene.scrollTop = target;
    else scene.scrollTop += (target - scene.scrollTop) * 0.14;
  }
  centerScroll(rocketY, true);

  function flyTo(targetY, targetPct, done) {
    if (flying) return;
    flying = true;
    skipRequested = false;
    rocket.classList.add('flying');
    rocket.classList.toggle('down', targetY > rocketY);
    Celebrate.play('pop', 0.4);

    const fromY = rocketY, fromP = rocketPct;
    const dist = Math.abs(targetY - fromY);
    const dur = Math.min(1800, 550 + dist * 1.3);
    const t0 = performance.now();
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    (function frame(t) {
      let p = Math.min(1, (t - t0) / dur);
      if (skipRequested) p = 1;
      rocketY = fromY + (targetY - fromY) * ease(p);
      rocketPct = fromP + (targetPct - fromP) * ease(p);
      placeRocket();
      centerScroll(rocketY, skipRequested);
      if (p < 1) requestAnimationFrame(frame);
      else {
        flying = false;
        rocket.classList.remove('flying', 'down');
        Celebrate.honk();                      // oui, un klaxon dans l'espace (1/20 : prout)
        done && done();
      }
    })(t0);
  }
  scene.addEventListener('pointerdown', () => { if (flying) skipRequested = true; });

  function speak(txt) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'fr-FR';
      u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch (e) { /* pas bloquant */ }
  }

  function onPlanetTap(i) {
    if (flying) { skipRequested = true; return; }
    const p = PLANETS[i];
    // parking À CÔTÉ du globe (jamais sur le panneau, qui doit rester lisible)
    const ty = planetY(i) - 20;
    const tp = (i % 2 === 0 ? 32 + 24 : 68 - 24);
    speak(p.speak);
    if (Math.abs(ty - rocketY) < 6) { openPanel(p); return; }
    flyTo(ty, tp, () => setTimeout(() => openPanel(p), 350));
  }

  // ── Panneau lieu (même logique que la ligne de bus) ────────────────────
  const panelTitle = document.getElementById('panelTitle');
  const panelGames = document.getElementById('panelGames');

  function starsRow(e) {
    const got = Stars.get(e.id), max = e.maxStars || 0;
    if (!max) return '';
    let html = '<div class="g-stars">';
    for (let k = 0; k < max; k++) html += `<span class="${k < got ? 'on' : 'off'}">★</span>`;
    if (got >= max) html += '<span class="trophy">🏆</span>';
    return html + '</div>';
  }

  function openPanel(p) {
    panel.dataset.zone = p.zone;
    panelTitle.textContent = p.label;
    Celebrate.play('doors', 0.5);

    if (!p.categories.length) {
      panelGames.innerHTML = `
        <div class="panel-empty">
          <div class="big">☄️</div>
          <p>Chuuut… Les histoires voyagent sur la comète.<br>Elles arrivent bientôt !</p>
        </div>`;
      panel.classList.add('on');
      return;
    }

    const games = window.MAXPLAY_CATALOG.filter(e =>
      p.categories.includes(e.category) && e.status !== 'hidden');

    panelGames.innerHTML = '';
    games.forEach(e => {
      const unlocked = Unlock.isUnlocked(e.id);
      const reason = Unlock.lockedReason(e.id);
      const card = document.createElement(unlocked ? 'a' : 'div');
      card.className = 'game-card' + (unlocked ? '' : ' locked');
      if (unlocked) card.href = e.url;
      card.innerHTML = `
        <div class="g-emoji">${e.emoji}</div>
        <div class="g-body">
          <div class="g-title">${e.titre}</div>
          ${starsRow(e)}
        </div>
        ${unlocked ? '' : `<div class="g-lock">${reason === 'code' ? '🔑' : '🔒'}</div>`}`;
      if (!unlocked) {
        card.addEventListener('click', () => {
          if (reason === 'code') { openCodeModal(); return; }
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
          showToast('Gagne 2 ★ au jeu d\'avant pour l\'ouvrir !');
        });
      }
      panelGames.appendChild(card);
    });
    panel.classList.add('on');
  }

  document.getElementById('panelBack').addEventListener('click', () => {
    panel.classList.remove('on');
    refreshHub();
  });

  const codeModal = document.getElementById('codeModal');
  const codeInput = document.getElementById('codeInput');
  function openCodeModal() { codeModal.classList.add('on'); codeInput.value = ''; codeInput.focus(); }
  document.getElementById('codeNo').addEventListener('click', () => codeModal.classList.remove('on'));
  document.getElementById('codeGo').addEventListener('click', async () => {
    const res = await Unlock.redeem(codeInput.value);
    codeModal.classList.remove('on');
    if (res.ok) {
      Celebrate.victory({ count: 120 });
      showToast('✨ Débloqué !');
      const cur = PLANETS.find(s => s.zone === panel.dataset.zone);
      if (cur) openPanel(cur);
    } else {
      showToast('Ce n\'est pas le bon code…');
    }
  });

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function refreshHub() {
    document.getElementById('totalStars').textContent =
      window.MAXPLAY_CATALOG.reduce((n, e) => n + Stars.get(e.id), 0);
    document.querySelectorAll('.planet').forEach((el, i) => {
      const zs = zoneStars(PLANETS[i]);
      let badge = el.querySelector('.stop-stars');
      if (zs > 0) {
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'stop-stars';
          el.appendChild(badge);
        }
        badge.textContent = `★ ${zs}`;
      }
    });
  }
  refreshHub();
  </script>
</body>
</html>
