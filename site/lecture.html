<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lecture annotée</title>
<style>
  /* ── La veillée au bord de l'étang (même famille que duel.html) ── */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:#0E1A1E;
    background-image: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(239,230,208,.07), transparent 60%);
    color:#EFE6D0;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header { padding:16px 18px 10px; }
  header .titre {
    font-family:Georgia,serif; font-style:italic; font-weight:400;
    font-size:21px; color:#EFE6D0; letter-spacing:.5px;
  }
  header .titre svg { vertical-align:-4px; margin-right:7px; }
  header .sous {
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:600;
    letter-spacing:2.5px; text-transform:uppercase; color:#8FA096; margin-top:8px;
  }
  header .hint { font-family:system-ui,sans-serif; font-size:12px; color:#5F7570; margin-top:5px; font-style:italic; }
  /* liste histoires */
  .liste { padding:16px; display:flex; flex-direction:column; gap:14px; }
  .hcard {
    background:#16262C; border:1px solid #23383F; border-radius:16px;
    padding:17px; cursor:pointer; font-family:system-ui,sans-serif;
    transition:border-color .2s, transform .12s;
  }
  .hcard:active { transform:scale(.985); }
  .hcard .t { font-family:Georgia,serif; font-style:italic; font-size:18px; font-weight:400; }
  .hcard .s { font-size:12.5px; color:#8FA096; margin-top:5px; }
  .hcard.done { border-color:#74C7DE; box-shadow:0 0 0 1px rgba(116,199,222,.35); }
  /* lecture — page de livre à la lampe */
  #texte { flex:1; overflow-y:auto; padding:16px 20px 130px; font-size:18px; line-height:1.85; max-width:620px; width:100%; margin:0 auto; }
  #texte p { margin-bottom:16px; }
  .seg { border-radius:4px; padding:1px 2px; cursor:pointer; transition:background .15s; }
  .seg.sel { background:rgba(116,199,222,.14); outline:2px solid #74C7DE; }
  .seg.pos { background:rgba(134,185,121,.18); box-shadow:inset 0 -2px 0 rgba(134,185,121,.6); }
  .seg.neg { background:rgba(201,123,93,.16); box-shadow:inset 0 -2px 0 rgba(201,123,93,.6); }
  /* barre bas */
  .barre {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(14,26,30,.92); backdrop-filter:blur(8px);
    border-top:1px solid #23383F;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px;
    font-family:system-ui,sans-serif;
  }
  .barre button {
    flex:1; padding:12px; border-radius:13px; border:1px solid #23383F;
    font-size:14.5px; font-weight:700; cursor:pointer;
    background:transparent; color:#EFE6D0;
  }
  .barre button.main { background:#74C7DE; color:#0E1A1E; border-color:#74C7DE; }
  /* panneau annotation */
  .sheet {
    position:fixed; bottom:0; left:0; right:0;
    background:#16262C; border-top:1px solid #74C7DE;
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    font-family:system-ui,sans-serif; max-height:55vh; overflow-y:auto;
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  .sheet::before {
    content:''; display:block; width:36px; height:4px; border-radius:2px;
    background:#23383F; margin:0 auto 12px;
  }
  .sheet .extrait {
    font-family:Georgia,serif; font-style:italic; font-size:14.5px; line-height:1.6;
    color:#B9BFA9; border-left:2px solid #74C7DE; padding-left:12px;
    margin-bottom:10px; max-height:84px; overflow-y:auto;
  }
  .sheet h3 { font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; margin:12px 0 7px; }
  .sheet h3.pos { color:#86B979; }
  .sheet h3.neg { color:#C97B5D; }
  .chips { display:flex; flex-direction:column; gap:8px; }
  .chips .ligne { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    font-size:13.5px; background:transparent; border:1px solid #23383F;
    border-radius:18px; padding:8px 13px; cursor:pointer; color:#EFE6D0;
    transition:background .15s, border-color .15s;
  }
  .chip.pon { background:#86B979; border-color:#86B979; color:#0E1A1E; font-weight:600; }
  .chip.non { background:#C97B5D; border-color:#C97B5D; color:#0E1A1E; font-weight:600; }
  textarea {
    width:100%; margin-top:12px; background:#0A1316; color:#EFE6D0;
    border:1px solid #23383F; border-radius:10px; padding:10px;
    font-family:system-ui,sans-serif; font-size:14px; height:64px;
  }
  .sheet .actions { display:flex; gap:10px; margin-top:14px; }
  .sheet .actions button {
    flex:1; padding:12px; border-radius:13px; border:none;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn-ok { background:#74C7DE; color:#0E1A1E; }
  .btn-annuler { background:transparent; color:#EFE6D0; border:1px solid #23383F !important; }
  .btn-suppr { background:#C97B5D; color:#0E1A1E; }
  /* final */
  .final { padding:22px 18px; font-family:system-ui,sans-serif; }
  .final h2 { font-family:Georgia,serif; font-style:italic; font-weight:400; color:#74C7DE; font-size:22px; margin-bottom:10px; }
  .final p { font-size:14px; color:#B9BFA9; line-height:1.55; margin-bottom:10px; }
  #json { width:100%; height:130px; background:#0A1316; color:#74C7DE; border:1px solid #23383F; border-radius:10px; padding:10px; font-family:ui-monospace,monospace; font-size:11px; }
  .hidden { display:none !important; }
  @media (prefers-reduced-motion: reduce) {
    .hcard, .seg, .chip { transition:none; }
  }
</style>
</head>
<body>
  <header>
    <div class="titre"><svg width="30" height="16" viewBox="0 0 30 16" fill="none" aria-hidden="true"><ellipse cx="10" cy="6" rx="9" ry="2.6" fill="#74C7DE" opacity=".35" transform="rotate(-16 10 6)"/><ellipse cx="20" cy="6" rx="9" ry="2.6" fill="#74C7DE" opacity=".35" transform="rotate(16 20 6)"/><ellipse cx="11" cy="9.5" rx="7" ry="2" fill="#74C7DE" opacity=".55" transform="rotate(-24 11 9.5)"/><ellipse cx="19" cy="9.5" rx="7" ry="2" fill="#74C7DE" opacity=".55" transform="rotate(24 19 9.5)"/><rect x="14.4" y="3.5" width="1.6" height="11" rx="0.8" fill="#74C7DE"/><circle cx="15.2" cy="3.2" r="1.7" fill="#74C7DE"/></svg>Lecture annotée</div>
    <div class="sous" id="sous">Choisis une histoire</div>
    <div class="hint" id="hint">Tape un passage pour le commenter — bien ou pas bien, texte libre bienvenu.</div>
  </header>

  <div class="liste" id="liste"></div>

  <div id="texte" class="hidden"></div>
  <div class="barre hidden" id="barre">
    <button onclick="retourListe()">← Histoires</button>
    <button class="main" onclick="verdictGlobal()">Verdict global ✓</button>
  </div>

  <div class="sheet hidden" id="sheet">
    <div class="extrait" id="extrait"></div>
    <h3 class="pos">✨ J'aime parce que…</h3>
    <div class="chips" id="chips-pos"></div>
    <h3 class="neg">👎 Ça pèche par…</h3>
    <div class="chips" id="chips-neg"></div>
    <textarea id="note" placeholder="Texte libre (optionnel mais précieux) : pourquoi ça marche / ça marche pas…"></textarea>
    <div class="actions">
      <button class="btn-annuler" onclick="fermerSheet()">Annuler</button>
      <button class="btn-suppr hidden" id="btn-suppr" onclick="supprimerAnno()">Effacer</button>
      <button class="btn-ok" onclick="validerAnno()">Valider</button>
    </div>
  </div>

  <div class="sheet hidden" id="sheet-verdict">
    <h3 style="color:#c9a86a">Verdict global sur cette histoire</h3>
    <div class="chips" id="chips-verdict"></div>
    <textarea id="note-verdict" placeholder="Ton ressenti global en une ou deux phrases…"></textarea>
    <div class="actions">
      <button class="btn-annuler" onclick="document.getElementById('sheet-verdict').classList.add('hidden')">Annuler</button>
      <button class="btn-ok" onclick="validerVerdict()">Valider → retour liste</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <h2>✅ Merci Papa Yann !</h2>
    <p id="resume-final"></p>
    <p>Copie ce JSON et colle-le à Claude — il nourrit ta mémoire de goût :</p>
    <textarea id="json" readonly onclick="this.select()"></textarea>
    <button class="btn-ok" style="width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;margin-top:10px;cursor:pointer" onclick="copier()">📋 Copier le JSON</button>
  </div>

<script src="lecture-data.js"></script>
<script>
var D = window.LECTURE_DATA;
var etat = {}; // {H1: {annotations:[], verdict:null}}
D.histoires.forEach(function(h){ etat[h.id] = { annotations: [], verdict: null }; });
var hCourante = null;
var segSel = [];        // indices sélectionnés
var annoEdit = null;    // annotation en cours d'édition
var chipsPos = [], chipsNeg = [];

function renderListe() {
  var z = document.getElementById('liste');
  z.innerHTML = '';
  D.histoires.forEach(function(h){
    var d = document.createElement('div');
    var st = etat[h.id];
    var done = st.verdict !== null;
    d.className = 'hcard' + (done ? ' done' : '');
    d.innerHTML = '<div class="t">' + h.titre + (done ? ' ✓' : '') + '</div>' +
      '<div class="s">' + st.annotations.length + ' annotation(s)' + (done ? ' · verdict donné' : '') + '</div>';
    d.onclick = function(){ ouvrirHistoire(h.id); };
    z.appendChild(d);
  });
  var fin = document.createElement('div');
  fin.className = 'hcard';
  fin.style.borderColor = '#c9a86a';
  fin.innerHTML = '<div class="t">🏁 Terminer & exporter</div><div class="s">Génère le JSON à coller à Claude (même partiel — lis ce que tu peux)</div>';
  fin.onclick = terminer;
  z.appendChild(fin);
}

function decouperSegments(texte) {
  // paragraphes, puis phrases (répliques entières conservées)
  var segs = [];
  texte.split(/\n\n/).forEach(function(para, pi){
    if (/^[«—]/.test(para.trim()) || para.length < 90) {
      segs.push({ p: pi, t: para });
    } else {
      var morceaux = para.match(/[^.!?…]+[.!?…]+(\s*»)?/g) || [para];
      morceaux.forEach(function(m){ segs.push({ p: pi, t: m.trim() }); });
    }
  });
  return segs;
}

function ouvrirHistoire(id) {
  hCourante = D.histoires.filter(function(h){ return h.id === id; })[0];
  hCourante._segs = hCourante._segs || decouperSegments(hCourante.texte);
  document.getElementById('sous').textContent = hCourante.titre;
  document.getElementById('liste').classList.add('hidden');
  document.getElementById('texte').classList.remove('hidden');
  document.getElementById('barre').classList.remove('hidden');
  renderTexte();
  window.scrollTo(0,0);
}

function renderTexte() {
  var z = document.getElementById('texte');
  z.innerHTML = '';
  var annos = etat[hCourante.id].annotations;
  var pCour = -1, pEl = null;
  hCourante._segs.forEach(function(s, i){
    if (s.p !== pCour) { pCour = s.p; pEl = document.createElement('p'); z.appendChild(pEl); }
    var sp = document.createElement('span');
    sp.className = 'seg';
    sp.dataset.idx = i;
    var a = annos.filter(function(x){ return x.segIdx.indexOf(i) >= 0; })[0];
    if (a) sp.classList.add(a.polarite === 'pos' ? 'pos' : 'neg');
    if (segSel.indexOf(i) >= 0) sp.classList.add('sel');
    sp.textContent = s.t + ' ';
    sp.onclick = function(){ tapSegment(i); };
    pEl.appendChild(sp);
  });
}

function tapSegment(i) {
  var annos = etat[hCourante.id].annotations;
  var existante = annos.filter(function(x){ return x.segIdx.indexOf(i) >= 0; })[0];
  if (existante) { annoEdit = existante; segSel = existante.segIdx.slice(); ouvrirSheet(); return; }
  var idx = segSel.indexOf(i);
  if (idx >= 0) segSel.splice(idx, 1); else segSel.push(i);
  segSel.sort(function(a,b){return a-b;});
  renderTexte();
  if (segSel.length) ouvrirSheet();
}

function ouvrirSheet() {
  chipsPos = annoEdit ? annoEdit.chipsPos.slice() : [];
  chipsNeg = annoEdit ? annoEdit.chipsNeg.slice() : [];
  document.getElementById('note').value = annoEdit ? annoEdit.note : '';
  document.getElementById('btn-suppr').classList.toggle('hidden', !annoEdit);
  document.getElementById('extrait').textContent = segSel.map(function(i){ return hCourante._segs[i].t; }).join(' ');
  var zp = document.getElementById('chips-pos'), zn = document.getElementById('chips-neg');
  zp.innerHTML = ''; zn.innerHTML = '';
  renderChips(zp, D.chips.positif, chipsPos, 'pon');
  renderChips(zn, D.chips.negatif, chipsNeg, 'non');
  document.getElementById('sheet').classList.remove('hidden');
  degagerTexte();
}

// chips en lignes thématiques (tableau de tableaux) ou à plat (rétro-compat)
function renderChips(zone, data, arr, cls) {
  var lignes = Array.isArray(data[0]) ? data : [data];
  lignes.forEach(function(lg){
    var div = document.createElement('div');
    div.className = 'ligne';
    lg.forEach(function(c){ div.appendChild(mkChip(c, arr, cls)); });
    zone.appendChild(div);
  });
}

// le panneau ne doit jamais cacher le passage tapé : padding + remontée auto
function degagerTexte() {
  var texte = document.getElementById('texte');
  texte.style.paddingBottom = '60vh';
  var premier = texte.querySelector('.seg[data-idx="' + segSel[0] + '"]');
  if (premier) setTimeout(function(){
    premier.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }, 60);
}

function mkChip(label, arr, cls) {
  var b = document.createElement('button');
  b.className = 'chip' + (arr.indexOf(label) >= 0 ? ' ' + cls : '');
  b.textContent = label;
  b.onclick = function(){
    var i = arr.indexOf(label);
    if (i >= 0) { arr.splice(i,1); b.classList.remove(cls); }
    else { arr.push(label); b.classList.add(cls); }
  };
  return b;
}

function validerAnno() {
  var note = document.getElementById('note').value.trim();
  if (!chipsPos.length && !chipsNeg.length && !note) { fermerSheet(); return; }
  var annos = etat[hCourante.id].annotations;
  if (annoEdit) annos.splice(annos.indexOf(annoEdit), 1);
  annos.push({
    segIdx: segSel.slice(),
    extrait: segSel.map(function(i){ return hCourante._segs[i].t; }).join(' '),
    polarite: (chipsNeg.length > chipsPos.length) ? 'neg' : (chipsPos.length ? 'pos' : 'neg'),
    chipsPos: chipsPos.slice(),
    chipsNeg: chipsNeg.slice(),
    note: note
  });
  fermerSheet();
}

function supprimerAnno() {
  if (annoEdit) {
    var annos = etat[hCourante.id].annotations;
    annos.splice(annos.indexOf(annoEdit), 1);
  }
  fermerSheet();
}

function fermerSheet() {
  segSel = []; annoEdit = null;
  document.getElementById('sheet').classList.add('hidden');
  document.getElementById('texte').style.paddingBottom = '';
  renderTexte();
}

var chipsVerdict = [];
function verdictGlobal() {
  chipsVerdict = [];
  var z = document.getElementById('chips-verdict');
  z.innerHTML = '';
  ['❤️ je la garde','👍 bien mais…','😐 bof','👎 non','trop long','pas fluide','manque un pic','fin parfaite','fin ratée'].forEach(function(c){
    z.appendChild(mkChip(c, chipsVerdict, 'pon'));
  });
  document.getElementById('note-verdict').value = (etat[hCourante.id].verdict || {}).note || '';
  document.getElementById('sheet-verdict').classList.remove('hidden');
}

function validerVerdict() {
  etat[hCourante.id].verdict = {
    chips: chipsVerdict.slice(),
    note: document.getElementById('note-verdict').value.trim()
  };
  document.getElementById('sheet-verdict').classList.add('hidden');
  retourListe();
}

function retourListe() {
  fermerSheet();
  document.getElementById('texte').classList.add('hidden');
  document.getElementById('barre').classList.add('hidden');
  document.getElementById('sous').textContent = 'Choisis une histoire';
  document.getElementById('liste').classList.remove('hidden');
  renderListe();
}

function terminer() {
  var payload = {
    outil: 'lecture-annotee',
    domaine: D.domaine, story: D.story, vague: D.vague,
    date: new Date().toISOString().slice(0,10),
    histoires: D.histoires.map(function(h){
      return { id: h.id, source: h.source,
        annotations: etat[h.id].annotations.map(function(a){
          return { extrait: a.extrait, polarite: a.polarite, aime: a.chipsPos, peche: a.chipsNeg, note: a.note };
        }),
        verdict: etat[h.id].verdict };
    })
  };
  var n = 0; D.histoires.forEach(function(h){ n += etat[h.id].annotations.length; });
  document.getElementById('resume-final').textContent = n + ' annotations sur ' +
    D.histoires.filter(function(h){ return etat[h.id].annotations.length || etat[h.id].verdict; }).length + ' histoire(s) lue(s).';
  document.getElementById('json').value = JSON.stringify(payload, null, 1);
  document.getElementById('liste').classList.add('hidden');
  document.getElementById('final').classList.remove('hidden');
}

function copier() {
  var ta = document.getElementById('json');
  ta.select(); ta.setSelectionRange(0, 999999);
  try { document.execCommand('copy'); } catch(e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});
}

renderListe();
</script>
</body>
</html>
