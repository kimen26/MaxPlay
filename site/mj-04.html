<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-04 – Compte les passagers</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* ─── Scène arrêt de bus ─── */
    #gameScr { background:linear-gradient(160deg,#1a3a2a,#1a2a3a); }
    .stop-scene {
      position: relative;
      margin: 4px 12px 10px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(180deg, #6fb7e8 0%, #bfe6ff 55%, #7ec87e 55%, #4a9d4a 100%);
      min-height: clamp(150px, 30vmin, 210px);
    }
    .sidewalk {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
      background: repeating-linear-gradient(90deg, #d9d9d9 0 40px, #c7c7c7 40px 42px);
    }
    .pole {
      position: absolute; bottom: 26%; left: 10px; width: 8px; height: 34%;
      background: #6a6a6a; border-radius: 4px;
      box-shadow: inset -2px 0 0 rgba(255,255,255,0.35);
    }
    .pole::before {
      content: 'BUS'; position:absolute; top:-22px; left:-13px; width:34px; height:20px;
      background:#00c5a0; color:#fff; font-family:'Fredoka One',sans-serif; font-size:9px;
      display:flex; align-items:center; justify-content:center; border-radius:4px;
    }
    .stop-bus { position:absolute; left:50%; bottom:26%; transform:translateX(-50%); z-index:2; }
    .stop-bus svg { width: clamp(140px, 32vmin, 200px); height:auto; display:block; }

    /* Passagers debout au sol, à côté/devant le bus, comptables un par un */
    .pax-row {
      position: absolute; left: 0; right: 0; bottom: 26%;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 4px; flex-wrap: wrap; padding: 0 6px 2px;
      z-index: 3;
    }
    .pax {
      width: clamp(34px, 8vmin, 46px); height: clamp(34px, 8vmin, 46px);
      cursor: pointer; transform-origin: bottom center;
      animation: paxPop .35s cubic-bezier(.34,1.56,.64,1) both;
      touch-action: manipulation;
    }
    .pax svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25)); }
    @keyframes paxPop { from { transform:scale(0) translateY(10px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
    .pax.hl svg .pax-body { filter: brightness(1.25); }
    .pax.hl { animation: paxBounce .4s ease; }
    @keyframes paxBounce { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-14px);} }
    .pax.wave { animation: paxWave .55s ease; }
    @keyframes paxWave { 0%,100%{transform:translateY(0) rotate(0);} 35%{transform:translateY(-18px) rotate(-6deg);} 65%{transform:translateY(-18px) rotate(6deg);} }

    .qtxt-count { text-align:center; font-family:'Fredoka One',sans-serif; font-size:1.05rem; margin:6px 12px 2px; }
    .tap-hint { text-align:center; font-size:0.78rem; opacity:0.6; margin:0 12px 4px; }

    /* Indice de méthode (aide, jamais la réponse) */
    .hint { text-align:center; font-weight:800; color:var(--gold); font-size:0.95rem; min-height:1.3em; opacity:0; transition:opacity .2s; padding:6px 12px 0; }
    .hint.show { opacity:1; }

    /* Gros boutons réponse ≥ 100px */
    .choices.big { grid-template-columns:repeat(4,1fr); padding:6px 12px 12px; gap:12px; }
    .choices.big .ch { min-height:100px; font-size:1.9rem; font-family:'Fredoka One',sans-serif; border-radius:20px; }
  </style>
</head>
<body data-ambiance="nuit" data-mp-intro-emoji="🚌" data-mp-intro-title="Compte les passagers" data-mp-intro-hint="Combien sont montés ?">
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">👥 Compte les passagers</span>
    </div>

    <!-- Piste golden (progression + étoiles) — remplace scorebar/levelbar
         (migration gabarit 2026-07-28, exigence PY « même code réutilisable ») -->
    <div id="pips"></div>

    <!-- Scène vivante : arrêt de bus + passagers tapotables -->
    <div class="stop-scene" id="stopScene">
      <div class="pole"></div>
      <div class="stop-bus" id="stopBus"></div>
      <div class="pax-row" id="paxRow"></div>
      <div class="sidewalk"></div>
    </div>

    <div class="qtxt-count">Combien de passagers attendent le bus ?</div>
    <div class="tap-hint">👉 Tapote les passagers pour les recompter</div>
    <div class="hint" id="hint"></div>

    <div class="choices big" id="choices"></div>
  </div>

  <div id="fbOverlay"></div>

  <!-- libs SPÉCIFIQUES au jeu -->
  <script src="js/data.js"></script>
  <script src="js/bus-svg.js"></script>
  <script src="js/intro-splash.js"></script>
  <!-- moteur commun "Compte les …" (pilote 1 moteur/N peaux, mj-04+mj-26) -->
  <script src="js/mj-compte.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-04 : Compte les passagers — PILOTE du contrat de difficulté ───
    // PILOTE EP-112 (GO PY 2026-07-28) : niveau = max(étoiles+1, niveau ouvert par
    // la compétence) — implémentation UNIQUE Golden.levelOf (mj-golden.js).
    // Manche mixte à dosage adaptatif : 6/2 (maîtrise) · 4/4 (défaut) · 2/6
    // (difficulté), ajustée EN silence pendant la partie (jamais le niveau affiché).
    const GAME_ID = 'mj-04';
    const MAX_QUESTIONS = 8; // figée mj-04 : manche = 8 questions, mixte

    // Paliers : le nombre de passagers monte avec le niveau
    // 🔄 2026-07-14 — passage global 3★ : 5 paliers → 3 niveaux (N1=ex-P1-2 · N2=ex-P3 · N3=ex-P4-5)
    const LEVELS = [
      { min: 2,  max: 8  },  // Niveau 1 (ex-P1-2)
      { min: 6,  max: 12 },  // Niveau 2 (ex-P3)
      { min: 9,  max: 22 },  // Niveau 3 (ex-P4-5)
    ];
    const maxStars = (window.Stars && Stars.max(GAME_ID)) || LEVELS.length;

    // Petits personnages ronds mignons (couleurs saturées, palette 6-8 tons)
    const PAX_COLORS = ['#FF6B6B','#4ECDC4','#FFD93D','#6C63FF','#FF922B','#20C997','#F783AC','#748FFC'];

    const _shuffle = (typeof shuffle === 'function')
      ? shuffle
      : (a) => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

    let level = 1, streak = 0, questionCount = 0, qcm = null, correctAnswer = 0, qLevels = [];
    let errStreak = 0;   // erreurs consécutives (ajustement silencieux du sac)

    const shell = MJ.init({
      id: GAME_ID, emoji: '👥', titre: 'Compte les passagers',
      golden: true, consigne: false,
      regle: {
        picto: '👥🔢',
        texte: 'Compte les passagers à l’arrêt de bus !',
        etapes: [
          { t: 'Je regarde les passagers 👀',
            d: 'Ils apparaissent un par un à côté du bus. J’écoute le petit son à chaque fois.' },
          { t: 'Je peux les retapoter pour recompter 👆',
            d: 'Chaque passager bouge un peu quand je le touche, ça m’aide à ne pas en rater.' },
          { t: 'Je tape le bon nombre 🔢',
            d: 'Si je me trompe, on recompte ensemble avec un indice. Jamais la réponse toute seule !' },
          { t: 'Plus j’ai d’étoiles, plus il y a de passagers 💪',
            d: 'Niveau 1 : 2 à 8 passagers. Niveau 3 : jusqu’à 22 ! Une manche sans erreur = 1 étoile ⭐.' }
        ]
      }
    });

    const G = shell.G;

    // Niveau via la brique commune (EP-112) : max(plancher étoiles, compétence).
    function currentLevel() { return Math.min(LEVELS.length, Golden.levelOf(GAME_ID, LEVELS.length - 1) + 1); }

    // Dosage du sac (spec §3) : part de questions au niveau courant selon la
    // performance récente (premier coup, 3 dernières parties) — 6/2 · 4/4 · 2/6.
    function hardCount() {
      let rate = null;
      try {
        const g = (Tracker.getStats().games || {})[GAME_ID];
        const h = ((g && g.history) || []).filter(s => s.questions > 0).slice(-3);
        if (h.length >= 3) {
          const q = h.reduce((s, x) => s + x.questions, 0);
          rate = q > 0 ? h.reduce((s, x) => s + (x.first || 0), 0) / q : null;
        }
      } catch (e) {}
      if (rate === null) return 4;          // défaut 4/4
      if (rate >= 0.8) return 6;            // maîtrise → 6/2
      if (rate < 0.5) return 2;             // difficulté → 2/6 (SILENCIEUX, spec §4)
      return 4;
    }

    function init() {
      level = currentLevel();
      const nHard = level <= 1 ? 0 : hardCount();
      const hard = Array(nHard).fill(level);
      const easy = [];
      for (let i = nHard; i < MAX_QUESTIONS; i++) easy.push(level <= 1 ? 1 : 1 + Math.floor(Math.random() * (level - 1)));
      qLevels = _shuffle([...hard, ...easy]);
      streak = 0; errStreak = 0; questionCount = 0;
      // Piste golden : manche mj-04 = toujours 8 questions (figée), quel que soit le niveau
      G.totalQ = MAX_QUESTIONS;
      G.buildPips();
      // La MONTÉE se célèbre (spec §4) — une seule fois, au lancement qui l'ouvre
      if (Golden.consumeLevelUp && Golden.consumeLevelUp(GAME_ID)) {
        try { shell.say('Ouah ! Tu passes au niveau ' + level + ' !'); } catch (e) {}
        if (typeof confetti === 'function') setTimeout(confetti, 400);
      }

      // Bus décoratif fixe à l'arrêt (couleur d'une ligne au hasard)
      const d = LIGNES[Math.floor(Math.random() * LIGNES.length)];
      document.getElementById('stopBus').innerHTML = busSVG(d.color, d.textColor, d.num, 200);

      nextQuestion();
    }

    // SVG passager rond mignon avec des yeux — jamais emoji
    function paxSVG(color) {
      return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="24" cy="44" rx="12" ry="3" fill="rgba(0,0,0,0.15)"/>
        <path class="pax-body" d="M24 46c-9 0-15-5-15-13 0-10 6-17 15-17s15 7 15 17c0 8-6 13-15 13Z" fill="${color}" stroke="#222" stroke-width="2"/>
        <circle cx="18.5" cy="22" r="3.4" fill="#fff" stroke="#222" stroke-width="1.4"/>
        <circle cx="29.5" cy="22" r="3.4" fill="#fff" stroke="#222" stroke-width="1.4"/>
        <circle cx="19" cy="22.6" r="1.6" fill="#222"/>
        <circle cx="29" cy="22.6" r="1.6" fill="#222"/>
        <path d="M18 29c2 2.5 10 2.5 12 0" stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>`;
    }

    function nextQuestion() {
      if (questionCount >= MAX_QUESTIONS) { showEndScreen(); return; }
      questionCount++;
      qcm = MJCompte.beginQuestion();
      hideHint();

      const qLvl = qLevels[questionCount - 1] || level;   // niveau de CETTE question (manche mixte)
      const L = LEVELS[qLvl - 1];
      const total = MJCompte.nextValue(L);
      correctAnswer = total;

      renderPassengers(total);

      const options = makeChoices(correctAnswer);
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      options.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'ch';
        btn.textContent = num;
        if (num === correctAnswer) btn.dataset.correct = '1';
        btn.onclick = () => answer(num === correctAnswer, btn);
        choicesDiv.appendChild(btn);
      });
    }

    // Rendu physique : les passagers apparaissent un par un avec sndCount,
    // et restent tapotables (chaque tap = surbrillance + son).
    function renderPassengers(total) {
      const row = document.getElementById('paxRow');
      row.innerHTML = '';
      const colors = _shuffle([...PAX_COLORS, ...PAX_COLORS]);
      for (let i = 0; i < total; i++) {
        const p = document.createElement('div');
        p.className = 'pax';
        p.style.animationDelay = `${i * 0.09}s`;
        p.innerHTML = paxSVG(colors[i % colors.length]);
        p.onclick = () => tapPax(p);
        row.appendChild(p);
        setTimeout(() => { if (row.contains(p)) sndCount(); }, i * 90 + 60);
      }
    }

    function tapPax(el) {
      el.classList.remove('hl'); void el.offsetWidth;
      el.classList.add('hl');
      sndCount();
      setTimeout(() => el.classList.remove('hl'), 400);
    }

    // Recompte guidé : re-surligne les passagers un par un (utilisé sur erreur)
    function recountPassengers() {
      const paxEls = [...document.querySelectorAll('#paxRow .pax')];
      paxEls.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add('hl');
          sndCount();
          setTimeout(() => el.classList.remove('hl'), 350);
        }, i * 220);
      });
    }

    function waveAll() {
      const paxEls = [...document.querySelectorAll('#paxRow .pax')];
      paxEls.forEach((el, i) => {
        setTimeout(() => el.classList.add('wave'), i * 60);
      });
    }

    // Distracteurs PROCHES du bon nombre (vrai défi de comptage) — moteur commun.
    function makeChoices(ans) {
      return MJCompte.distractors(ans, { count: 4, min: 1 });
    }

    function answer(isCorrect, btn) {
      if (btn.disabled) return;
      const res = MJCompte.answer(qcm, isCorrect);
      if (res.outcome === 'ignored') return;
      if ((res.outcome === 'correct' || res.outcome === 'reveal') && typeof Tracker !== 'undefined')
        Tracker.logAnswer(res.outcome === 'correct', res.outcome === 'correct' && res.attempts === 1);

      if (res.outcome === 'correct') {
        btn.classList.add('ok');
        const firstTry = res.attempts === 1;
        if (firstTry) { streak++; errStreak = 0; } else { streak = 0; }
        // Ajustement SILENCIEUX du sac (spec §3, T7) : 3 premiers coups d'affilée
        // → les questions faciles restantes passent au niveau courant.
        if (firstTry && streak === 3 && level > 1) {
          for (let i = questionCount; i < qLevels.length; i++) qLevels[i] = level;
        }
        waveAll();
        if (streak >= 3 && typeof confetti === 'function') confetti();
        sndDing(); showFB(true); hideHint();
        G.notePip(questionCount - 1, res.attempts, btn);
        setTimeout(nextQuestion, 1300);
      } else if (res.outcome === 'reveal') {
        btn.classList.add('ko'); btn.disabled = true;
        streak = 0;
        softenBag();
        QcmRetry.revealCorrect(document.getElementById('choices'));
        sndBuzz(); showFB(false);
        recountPassengers();
        const okEl = document.querySelector('#choices .ch[data-correct="1"]');
        G.notePip(questionCount - 1, 4, okEl);
        setTimeout(nextQuestion, 1900);
      } else {
        // mauvaise réponse mais il lui reste des essais → recompte ensemble + INDICE, jamais la réponse
        btn.classList.add('ko'); btn.disabled = true;
        streak = 0;
        softenBag();
        sndBuzz(); showFB(false);
        showHint();
        recountPassengers();
      }
    }

    // 2 erreurs consécutives → les questions dures restantes redeviennent faciles.
    // TOTALEMENT silencieux (spec §4 : « la descente est invisible ») — aucun texte.
    function softenBag() {
      errStreak++;
      if (errStreak >= 2 && level > 1) {
        for (let i = questionCount; i < qLevels.length; i++) {
          if (qLevels[i] >= level) qLevels[i] = 1 + Math.floor(Math.random() * (level - 1));
        }
      }
    }

    function showHint() {
      const h = document.getElementById('hint');
      if (h) { h.textContent = '💡 Recomptons ensemble, un par un !'; h.classList.add('show'); }
    }
    function hideHint() { const h = document.getElementById('hint'); if (h) h.classList.remove('show'); }

    // Fin de manche : écran STANDARD (œuf + étoile sans-faute + 3 boutons) —
    // migration gabarit 2026-07-28, plus aucun écran maison.
    function showEndScreen() {
      G.showEnd({ replayUrl: 'mj-04.html' });
    }

    init();
    });
  </script>
</body>
</html>
