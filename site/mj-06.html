<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-06 – Lis la phrase</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    #gameScr { background: linear-gradient(160deg, #2a1a3a, #1a2a3a); }
    
    .sentence-box {
      background: #ffffff15;
      border-radius: 20px;
      padding: 24px 20px;
      margin: 12px;
      text-align: center;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .sentence-text {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.5;
      color: #fff;
    }
    
    .sentence-text .blank {
      display: inline-block;
      background: var(--gold-soft);
      border: 3px solid var(--gold);
      border-radius: 12px;
      padding: 4px 16px;
      margin: 0 4px;
      min-width: 60px;
      color: var(--gold);
      font-weight: 900;
      animation: pulse 0.8s infinite alternate;
    }

    .sentence-text .blank.filled {
      background: #00c47a44;
      border-color: #00c47a;
      color: #00c47a;
      animation: popAnim 0.3s ease-out;
    }

    .sentence-text .blank.revealed {
      background: #00c47a44;
      border-color: #00c47a;
      color: #00c47a;
    }
    
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    
    @keyframes popAnim {
      0% { transform: scale(0.7); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    
    .choice-btn {
      background: linear-gradient(145deg, #ffffff20, #ffffff10);
      border: 2px solid #ffffff30;
      border-radius: 16px;
      padding: 18px 12px;
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Nunito', sans-serif;
    }
    
    .choice-btn:active {
      transform: scale(0.95);
    }
    
    .choice-btn.ok {
      background: #00c47a;
      border-color: #00c47a;
    }
    
    .choice-btn.ko {
      background: #ff4757;
      border-color: #ff4757;
    }
    
    .question-counter {
      text-align: center;
      font-size: 1rem;
      opacity: 0.7;
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .instruction {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.6;
      margin-bottom: 12px;
    }
    
    .emoji-hint {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body data-ambiance="nuit">
  <div id="app">
    <!-- Header -->
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">📖 Lis la phrase</span>
    </div>
    
    <div class="pips" id="pips"></div>

    <!-- Emoji d'ambiance (la consigne parlée est gérée par le gabarit : tap = réécouter) -->
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;">
      <div class="emoji-hint" id="emojiHint" style="margin:0;">🚌</div>
    </div>

    <!-- Sentence with blank -->
    <div class="sentence-box">
      <div class="sentence-text" id="sentenceText">
        <!-- Généré par JS -->
      </div>
    </div>
    
    <!-- Choices -->
    <div class="choices-grid" id="choices">
      <!-- Généré par JS -->
    </div>
  </div>
  
  <!-- Feedback overlay -->
  <div id="fbOverlay"></div>
  
  <script src="js/mj-kit.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-06 : Lis la phrase ───
    // Max doit trouver le mot manqué [?] dans une phrase simple
    // Phase 1 : mots courts que Max sait lire (BUS, TRAM, PAPA, MAMAN, VÉLO...)

    const PHRASES = [
      { before: "Le", answer: "CHAT", after: "dort sur le canapé.", options: ["CHAT", "CHIEN", "LAPIN", "OURS"], emoji: "🐱" },
      { before: "Mimi mange une", answer: "POMME", after: "rouge.", options: ["POMME", "POIRE", "FRAISE", "BANANE"], emoji: "🍎" },
      { before: "Le", answer: "LOUP", after: "est dans la forêt.", options: ["LOUP", "RENARD", "LION", "OURS"], emoji: "🐺" },
      { before: "Papa dit", answer: "BRAVO", after: "à Nono.", options: ["BRAVO", "MERCI", "SALUT", "COUCOU"], emoji: "👏" },
      { before: "Lulu boit du", answer: "LAIT", after: "le matin.", options: ["LAIT", "JUS", "CAFÉ", "THÉ"], emoji: "🥛" },
      { before: "Le ciel est", answer: "BLEU", after: "aujourd’hui.", options: ["BLEU", "ROUGE", "VERT", "NOIR"], emoji: "☀️" },
      { before: "Maman fait un", answer: "GÂTEAU", after: "au chocolat.", options: ["GÂTEAU", "PAIN", "SUCRE", "YAOURT"], emoji: "🎂" },
      { before: "Le", answer: "CHIEN", after: "aboie fort !", options: ["CHIEN", "CHAT", "LAPIN", "CANARD"], emoji: "🐶" },
      { before: "Mimi aime la", answer: "NEIGE", after: "en hiver.", options: ["NEIGE", "PLUIE", "GRÊLE", "SOLEIL"], emoji: "❄️" },
      { before: "La", answer: "LUNE", after: "brille la nuit.", options: ["LUNE", "ÉTOILE", "SOLEIL", "NUAGE"], emoji: "🌙" },
      { before: "Le", answer: "LION", after: "rugit très fort.", options: ["LION", "TIGRE", "OURS", "LOUP"], emoji: "🦁" },
      { before: "Nono saute dans la", answer: "MER", after: "avec papa.", options: ["MER", "PISCINE", "RIVIÈRE", "LAC"], emoji: "🏖️" },
      { before: "La", answer: "PLUIE", after: "tombe du ciel.", options: ["PLUIE", "NEIGE", "GRÊLE", "BRUME"], emoji: "🌧️" },
      { before: "Juju dit", answer: "MERCI", after: "à maman.", options: ["MERCI", "BRAVO", "COUCOU", "SALUT"], emoji: "😊" },
      { before: "Le", answer: "CANARD", after: "nage dans l’eau.", options: ["CANARD", "LAPIN", "CHAT", "CHIEN"], emoji: "🦆" },

      // ─── Thème DINO ───
      { before: "Le", answer: "REX", after: "a de grandes dents.", options: ["REX", "LOUP", "CHAT", "OURS"], emoji: "🦖" },
      { before: "Le dino sort d’un", answer: "OEUF", after: "tout rond.", options: ["OEUF", "NID", "SAC", "LIT"], emoji: "🥚" },
      { before: "Le dino a un grand", answer: "OS", after: "dans la main.", options: ["OS", "SAC", "LIT", "POT"], emoji: "🦴" },
      { before: "Le dino a une longue", answer: "QUEUE", after: "pointue.", options: ["QUEUE", "PATTE", "TETE", "DENT"], emoji: "🦕" },
      { before: "Le dino a une grosse", answer: "GRIFFE", after: "sur le pied.", options: ["GRIFFE", "CORNE", "PLUME", "AILE"], emoji: "🐾" },
      { before: "Le dino a une", answer: "CORNE", after: "sur le nez.", options: ["CORNE", "GRIFFE", "QUEUE", "BOSSE"], emoji: "🦏" },
      { before: "Le", answer: "DINO", after: "marche dans la forêt.", options: ["DINO", "LOUP", "OURS", "CHAT"], emoji: "🦕" },
      { before: "Le dino vole avec ses", answer: "AILES", after: "immenses.", options: ["AILES", "PATTES", "DENTS", "GRIFFES"], emoji: "🦅" },

      // ─── Thème VOYAGE ───
      { before: "Le", answer: "TRAIN", after: "roule sur les rails.", options: ["TRAIN", "BUS", "VÉLO", "BATEAU"], emoji: "🚂" },
      { before: "L’", answer: "AVION", after: "vole dans le ciel.", options: ["AVION", "TRAIN", "BUS", "VÉLO"], emoji: "✈️" },
      { before: "Le", answer: "BATEAU", after: "flotte sur la mer.", options: ["BATEAU", "TRAIN", "AVION", "VÉLO"], emoji: "🚢" },
      { before: "Lulu va dans un autre", answer: "PAYS", after: "en vacances.", options: ["PAYS", "PARC", "BUS", "LIT"], emoji: "🌍" },
      { before: "La", answer: "FUSÉE", after: "part dans l’espace.", options: ["FUSÉE", "AVION", "VOITURE", "MOTO"], emoji: "🚀" },
      { before: "Nono regarde la", answer: "LUNE", after: "dans le ciel.", options: ["LUNE", "ÉTOILE", "SOLEIL", "NUAGE"], emoji: "🌙" },
      { before: "Mimi porte une grosse", answer: "VALISE", after: "pour le voyage.", options: ["VALISE", "SAC", "BOÎTE", "CAISSE"], emoji: "🧳" },
      { before: "Le", answer: "PILOTE", after: "conduit l’avion.", options: ["PILOTE", "CHAUFFEUR", "CAPITAINE", "FACTEUR"], emoji: "👨‍✈️" },
    ];

    let score = 0;
    let streak = 0;
    let questionCount = 0;
    let attempts = 1;
    let locked = false;
    let currentPhrase = null;
    let usedIndices = [];

    const shell = MJ.init({
      id: 'mj-06', emoji: '📖', titre: 'Lis la phrase',
      golden: true,
      consigne: true,
      onRepeat: function () { speakQuestion(false); },
      regle: {
        picto: '📖❓',
        texte: 'Trouve le mot qui manque dans la phrase !',
        etapes: [
          { t: 'J’écoute la phrase 👂',
            d: 'Une voix lit la phrase avec un petit trou. Je tape la consigne pour réécouter.' },
          { t: 'Je regarde le dessin 👀',
            d: 'Un emoji donne un indice sur le mot qui manque.' },
          { t: 'Je tape le bon mot 👆',
            d: 'Si je me trompe, la voix dit la bonne réponse et la phrase complète.' },
          { t: 'Je continue avec 5 phrases 💪',
            d: 'Bus, dinos, voyages… à chaque fois une nouvelle phrase à compléter !' }
        ]
      }
    });

    const G = shell.G;
    // 🔒 5 questions fixes (indépendant du barème questions Golden 4/6/8 — voir figée mj-06.md)
    G.totalQ = 5;
    G.buildPips();
    const MAX_QUESTIONS = G.totalQ;

    // TTS (via js/tts.js)
    function speakQuestion(full) {
      if (!currentPhrase) return;
      const text = full
        ? `${currentPhrase.before} ${currentPhrase.answer} ${currentPhrase.after}`
        : `${currentPhrase.before} quelque chose ${currentPhrase.after}`;
      TTS.speak(text, { rate: 0.85 });
    }

    function init() {
      score = 0;
      streak = 0;
      questionCount = 0;
      usedIndices = [];
      nextQuestion();
    }

    function getRandomPhrase() {
      let available = PHRASES.map((_, i) => i).filter(i => !usedIndices.includes(i));
      if (available.length === 0) {
        usedIndices = [];
        available = PHRASES.map((_, i) => i);
      }
      const idx = available[Math.floor(Math.random() * available.length)];
      usedIndices.push(idx);
      return PHRASES[idx];
    }

    function nextQuestion() {
      if (questionCount >= MAX_QUESTIONS) {
        showEndScreen();
        return;
      }

      locked = false;
      attempts = 1;
      questionCount++;

      currentPhrase = getRandomPhrase();
      document.getElementById('emojiHint').textContent = currentPhrase.emoji;

      // Afficher la phrase avec case [?]
      const sentenceText = document.getElementById('sentenceText');
      sentenceText.innerHTML = `${currentPhrase.before} <span class="blank" id="blank">?</span> ${currentPhrase.after}`;
      shell.setConsigne('Quel mot manque dans la phrase ?', false);

      // Afficher les 4 choix (grands boutons texte en majuscules)
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      shuffle([...currentPhrase.options]).forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = option;
        btn.onclick = () => answer(option === currentPhrase.answer, btn, option);
        choicesDiv.appendChild(btn);
      });

      // TTS auto
      setTimeout(() => speakQuestion(false), 400);
    }

    function answer(isCorrect, btn, chosenOption) {
      if (locked) return;
      locked = true;
      if (typeof Tracker !== 'undefined') Tracker.logAnswer(isCorrect);

      const blank = document.getElementById('blank');

      if (isCorrect) {
        btn.classList.add('ok');
        if (blank) { blank.textContent = chosenOption; blank.classList.add('filled'); }
        score += 10;
        streak++;
        if (streak >= 3) confetti();
        sndDing();
        showFB(true);
        G.notePip(questionCount - 1, 1, btn);
        // TTS lit la phrase complète
        setTimeout(() => speakQuestion(true), 300);
      } else {
        btn.classList.add('ko');
        const buttons = Array.from(document.querySelectorAll('#choices .choice-btn'));
        const correctBtn = buttons.find(b => b.textContent === currentPhrase.answer);
        if (correctBtn) correctBtn.classList.add('ok');
        if (blank) { blank.textContent = currentPhrase.answer; blank.classList.add('revealed'); }
        streak = 0;
        sndBuzz();
        showFB(false);
        // Une seule tentative par question (pas de retry ici) : la réponse est
        // révélée directement → même convention que "aidé" (attempts=4).
        G.notePip(questionCount - 1, 4, correctBtn);
        // TTS lit la bonne réponse
        setTimeout(() => speakQuestion(true), 300);
      }

      setTimeout(nextQuestion, 2200);
    }

    function showEndScreen() {
      G.showEnd({ replayUrl: 'mj-06.html' });
    }

    const shuffle = MJKit.shuffle;

    init();
    });
  </script>
</body>
</html>
