<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-08 – Le grand rangement</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* Thème CLAIR volontaire (bazar en désordre) — ne suit pas l'ambiance sombre
       du design system (conflit signalé au rapport). body garde son fond hardcodé. */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #fff3d6 0%, #ffe0b3 45%, #ffd1a3 100%);
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }

    #app { display:flex; flex-direction:column; height:100dvh; max-width:1100px; margin:0 auto; }

    /* ── Header (canonique .hdr, thème clair adapté) ── */
    .hdr {
      display:flex; align-items:center; gap:10px;
      padding:6px 12px; flex-shrink:0;
      background:rgba(255,255,255,0.35);
      border-bottom:1px solid rgba(0,0,0,0.08);
    }
    .hdr a {
      color:#5a3d1a; text-decoration:none; font-size:1.3rem;
      background:rgba(255,255,255,0.5); border-radius:8px;
      padding:4px 10px; font-weight:900; flex-shrink:0;
    }
    .hdr a:active { background:rgba(255,255,255,0.8); }
    .htitle { flex:1; font-size:1rem; font-weight:900; color:#5a3d1a; font-family:'Fredoka One',sans-serif; }
    .roundbar {
      font-weight:900; color:#fff; background:#ff8a3d;
      border-radius:10px; padding:3px 12px; font-size:0.85rem; flex-shrink:0;
    }

    /* ── Progress ── */
    .scorebar { padding:6px 14px; background:rgba(255,255,255,0.25); flex-shrink:0; }
    .progress-bar { width:100%; height:10px; background:rgba(0,0,0,0.1); border-radius:5px; overflow:hidden; }
    .progress-fill {
      height:100%; border-radius:5px;
      background: linear-gradient(90deg, #ffb347, #ff8a3d, #ff5e62);
      background-size:200% 100%;
      animation:shimmer 2s infinite;
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .item-count { text-align:center; font-size:0.82rem; color:#7a5a30; margin-top:4px; font-weight:700; }

    /* ── Consigne du thème ── */
    .theme-banner {
      text-align:center; padding:4px 10px; flex-shrink:0;
      font-family:'Fredoka One',sans-serif; font-size:0.95rem; color:#5a3d1a;
      background:rgba(255,255,255,0.2);
    }

    /* ── Layout principal ── */
    .game-area { flex:1; display:flex; overflow:hidden; }

    /* Zone gauche : bazar */
    #bazarZone {
      flex:1; position:relative; overflow:hidden;
    }

    /* Zone droite : bacs */
    #binZone {
      width:150px; flex-shrink:0;
      display:flex; flex-direction:column;
      overflow:hidden;
      background:rgba(255,255,255,0.3);
      border-left:2px solid rgba(0,0,0,0.08);
    }

    .bin {
      flex:1; min-height:0; position:relative;
      display:flex; align-items:center; justify-content:center;
      border-bottom:2px dashed rgba(0,0,0,0.12);
      transition:box-shadow 0.15s, background 0.15s;
      overflow:hidden;
    }
    .bin:last-child { border-bottom:none; }
    .bin.hover-ok { box-shadow:inset 0 0 0 4px rgba(0,200,120,0.85); }

    .bin-icon {
      font-size:2.6rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
      pointer-events:none;
      z-index:1;
    }
    .bin-icon.dino-swatch {
      width:60px; height:60px;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:center; mask-position:center;
      -webkit-mask-size:contain; mask-size:contain;
    }
    .bin-count {
      position:absolute; top:5px; right:6px;
      font-size:0.75rem; font-weight:900; color:#fff;
      background:rgba(0,0,0,0.4); border-radius:10px;
      padding:1px 7px; pointer-events:none; z-index:2;
    }

    /* ── Objets du bazar ── */
    .item {
      position:absolute; cursor:grab; touch-action:none; z-index:10;
      font-size:2.6rem; line-height:1;
      transition:transform 0.12s;
      filter:drop-shadow(0 3px 6px rgba(0,0,0,0.28));
    }
    .item.dino-swatch {
      width:74px; height:74px;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:center; mask-position:center;
      -webkit-mask-size:contain; mask-size:contain;
    }
    .item:active, .item.dragging {
      cursor:grabbing; z-index:20;
      filter:drop-shadow(0 6px 14px rgba(0,0,0,0.4));
      transform:scale(1.12) !important;
    }
    .item.parked { cursor:default; pointer-events:none; opacity:0; transition:opacity 0.3s; }

    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)}
      60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
    }
    .item.wrong { animation:shake 0.4s ease; }

    @keyframes bump {
      0%,100%{transform:scale(1)} 50%{transform:scale(0.9)}
    }
    .bin.bump { animation:bump 0.3s ease; }

    /* ── Victoire ── */
    .victory-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.75); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      z-index:1000; opacity:0; visibility:hidden; transition:all 0.5s;
    }
    .victory-overlay.show { opacity:1; visibility:visible; }
    .victory-content {
      text-align:center; padding:36px 32px;
      background:linear-gradient(135deg, #fff3d6, #ffe0b3);
      border-radius:24px; border:2px solid rgba(255,255,255,0.5);
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
      transform:scale(0.8); transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .victory-overlay.show .victory-content { transform:scale(1); }
    .victory-emoji { font-size:3.6rem; margin-bottom:12px; animation:bounce 1s ease infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    .victory-title { font-size:2rem; color:#ff8a3d; margin-bottom:8px; font-family:'Fredoka One',sans-serif; }
    .victory-text { font-size:1.1rem; color:#5a3d1a; margin-bottom:24px; }
    .victory-buttons { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .victory-btn {
      padding:13px 26px; border-radius:28px; text-decoration:none;
      font-weight:900; font-size:1rem; border:none; cursor:pointer;
      font-family:'Nunito',sans-serif; transition:all 0.2s;
    }
    .victory-btn.primary { background:linear-gradient(135deg,#ff8a3d,#ff5e62); color:#fff; }
    .victory-btn.secondary { background:rgba(0,0,0,0.1); color:#5a3d1a; }
    .victory-btn:hover, .victory-btn:active { transform:translateY(-3px); }
  </style>
</head>
<body data-ambiance-lock>
  <div id="app">
    <div class="hdr">
      <a href="index.html">&#8592;</a>
      <span class="htitle">🧸 Le grand rangement</span>
      <span class="roundbar" id="roundBar">Manche 1</span>
    </div>

    <div class="scorebar">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="item-count" id="itemCount">Rangés : 0 / 0</div>
    </div>

    <div class="theme-banner" id="themeBanner">Range chaque objet dans le bon bac !</div>

    <div class="game-area">
      <div id="bazarZone"></div>
      <div id="binZone"></div>
    </div>
  </div>

  <div class="victory-overlay" id="victoryOverlay">
    <div class="victory-content">
      <div class="victory-emoji">🎉</div>
      <h2 class="victory-title">Bravo Max !</h2>
      <p class="victory-text" id="victoryText">Tout est bien rangé !</p>
      <div class="victory-buttons">
        <button class="victory-btn primary" id="btnNextRound">➡️ Manche suivante</button>
        <a href="index.html" class="victory-btn secondary">📋 Menu</a>
      </div>
    </div>
  </div>

  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-08 : Le grand rangement ───
    // Tri multi-thèmes : un bazar d'objets éparpillés → glisser dans le bon bac.
    // 4 thèmes qui tournent par manche (≠ MJ-09 qui reste tri de bus par couleur) :
    //   1. Nature      : animaux / plantes / cailloux
    //   2. Espace/Terre: objets du ciel / objets du sol
    //   3. Ombres dino : silhouettes teintées par couleur (réutilise site/img/dinos/ombres)
    //   4. Vole/roule/nage : véhicules/animaux par mode de déplacement
    // 3 manches (paliers ★/★★/★★★) : 2 bacs → 3 bacs → 3 bacs + pièges subtils.

    const THEMES = [
      {
        id: 'nature',
        label: 'Range la nature !',
        bins: [
          { id: 'animaux', icon: '🐢', items: ['🐢','🦋','🐠','🐞','🐝','🐌'] },
          { id: 'plantes', icon: '🌱', items: ['🌱','🌸','🌳','🌵','🍄','🌻'] },
          { id: 'cailloux', icon: '🪨', items: ['🪨','💎','⛰️'] },
        ],
        // pièges (manche 3) : objet visuellement proche mais mauvaise famille
        traps: { 'animaux': ['🌵'], 'plantes': ['🐌'] },
      },
      {
        id: 'ciel_sol',
        label: 'Dans le ciel ou sur Terre ?',
        bins: [
          { id: 'ciel', icon: '🚀', items: ['🚀','🌙','⭐','☄️','🛸'] },
          { id: 'sol', icon: '🏠', items: ['🏠','🚗','🌊','⛰️','🌲'] },
        ],
        traps: { 'ciel': ['🌲'], 'sol': ['☄️'] },
      },
      {
        id: 'deplacement',
        label: 'Ça vole, ça roule ou ça nage ?',
        bins: [
          { id: 'vole', icon: '✈️', items: ['✈️','🦅','🪁','🦋'] },
          { id: 'roule', icon: '🚌', items: ['🚌','🚗','🚲','🛴'] },
          { id: 'nage', icon: '⛵', items: ['⛵','🐟','🚤','🐢'] },
        ],
        traps: { 'roule': ['🦋'], 'nage': ['🐢'] },
      },
      {
        id: 'dino_couleur',
        label: 'Range les ombres par couleur !',
        // bacs = couleurs, items = silhouettes dino teintées via mask-image
        dinoMode: true,
        colors: [
          { id: 'rouge', hex: '#e3051c' },
          { id: 'bleu',  hex: '#0064b1' },
          { id: 'vert',  hex: '#008c59' },
        ],
        dinos: ['Triceratops','Stegosaurus','Ankylosaurus','Velociraptor','Brachiosaurus','Tyrannosaurus','Spinosaurus','Parasaurolophus'],
      },
    ];

    const ITEM_SIZE = 74;
    const SNAP_DIST = 95;

    MJ.init({
      id: 'mj-08', emoji: '🧸', titre: 'Le grand rangement',
      consigne: false,
      regle: {
        picto: '🧸📦',
        texte: 'Range chaque objet dans le bon bac !',
        etapes: [
          { t: 'Je regarde le bazar 👀',
            d: 'Plein d’objets sont mélangés à gauche. À droite, des bacs attendent.' },
          { t: 'Je glisse un objet vers son bac 👆',
            d: 'Nature, ciel ou sol, ça vole ou ça roule, ou même des dinos par couleur !' },
          { t: 'Si je me trompe, l’objet revient tout seul 🔄',
            d: 'Pas de souci, je peux réessayer autant de fois que je veux.' },
          { t: 'Plus je range, plus les manches sont costaudes 💪',
            d: 'Manche 1 : 2 bacs faciles. Manche 3 : 3 bacs, avec des objets piégeurs !' }
        ]
      }
    });

    let currentThemeIdx = 0;
    let round = 1;           // 1..3
    let binsForRound = [];   // bacs actifs cette manche
    let itemsForRound = [];  // {key, binId, isTrap}
    let objects = [];        // éléments DOM en jeu
    const drags = new Map();
    let rangedCount = 0;
    let totalItems = 0;
    let gameComplete = false;

    // ── Audio singleton ──
    let _ac = null;
    function getAC() {
      if (!_ac || _ac.state === 'closed') _ac = new (window.AudioContext || window.webkitAudioContext)();
      if (_ac.state === 'suspended') _ac.resume();
      return _ac;
    }
    function sndOk() {
      try {
        const ac = getAC(), t = ac.currentTime;
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'sine'; o.frequency.value = 660;
        g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.3);
        o.start(t); o.stop(t+0.3);
      } catch(e) {}
    }
    function sndDing() {
      try {
        const ac = getAC(), t = ac.currentTime;
        [880, 1318.5].forEach((f, i) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0, t + i*0.06);
          g.gain.linearRampToValueAtTime(0.2, t + i*0.06 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.01, t + i*0.06 + 0.4);
          o.start(t + i*0.06); o.stop(t + i*0.06 + 0.4);
        });
      } catch(e) {}
    }
    function sndPop() {
      try {
        const ac = getAC(), t = ac.currentTime;
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(320, t);
        o.frequency.exponentialRampToValueAtTime(620, t + 0.12);
        g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.15);
        o.start(t); o.stop(t+0.15);
      } catch(e) {}
    }
    function sndVictory() {
      try {
        const ac = getAC(), t = ac.currentTime;
        [523,659,784,1047].forEach((f,i) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.type = 'triangle'; o.frequency.value = f;
          g.gain.setValueAtTime(0, t+i*0.12); g.gain.linearRampToValueAtTime(0.22, t+i*0.12+0.08);
          g.gain.exponentialRampToValueAtTime(0.01, t+i*0.12+0.6);
          o.start(t+i*0.12); o.stop(t+i*0.12+0.6);
        });
      } catch(e) {}
    }

    // ── Sélection de manche ──
    // Manche 1 : 2 bacs, objets bien distincts (pas de piège)
    // Manche 2 : 3 bacs (ou thème dino si tiré, toujours 3 couleurs)
    // Manche 3 : 3 bacs + pièges subtils
    function _shuffle(a) { const r=[...a]; for (let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

    function pickTheme(minBins) {
      // Ne tirer que les thèmes qui ont assez de bacs pour la manche
      // (ex : "Ciel vs Terre" n'a que 2 bacs → exclu des manches 2-3 qui en exigent 3).
      const eligible = THEMES.map((t, i) => ({ t, i }))
        .filter(({ t }) => (t.dinoMode ? t.colors.length : t.bins.length) >= minBins);
      const pick = eligible[Math.floor(Math.random() * eligible.length)];
      currentThemeIdx = pick.i;
      return pick.t;
    }

    function buildRound() {
      const theme = pickTheme(round === 1 ? 2 : 3);
      const withTraps = round === 3;
      let bins, itemPool;

      if (theme.dinoMode) {
        const nBins = round === 1 ? 2 : 3;
        bins = theme.colors.slice(0, nBins).map(c => ({ id: c.id, icon: null, hex: c.hex }));
        const dinos = _shuffle(theme.dinos);
        itemPool = [];
        bins.forEach((b, i) => {
          const count = round === 1 ? 3 : (round === 2 ? 3 : 3);
          for (let k = 0; k < count; k++) {
            itemPool.push({ key: dinos[(i * count + k) % dinos.length], binId: b.id, isTrap: false, dino: true, hex: b.hex });
          }
        });
        // Pas de "pièges" couleur en dino (déjà assez dur de distinguer les teintes) —
        // la difficulté manche 3 vient du nombre d'objets, pas d'un piège trompeur.
      } else {
        const nBins = round === 1 ? Math.min(2, theme.bins.length) : Math.min(3, theme.bins.length);
        bins = theme.bins.slice(0, nBins);
        itemPool = [];
        bins.forEach(b => {
          const items = _shuffle(b.items).slice(0, round === 1 ? 2 : 3);
          items.forEach(it => itemPool.push({ key: it, binId: b.id, isTrap: false, dino: false }));
        });
        if (withTraps && theme.traps) {
          bins.forEach(b => {
            const trapItems = theme.traps[b.id];
            if (trapItems && trapItems.length) {
              // le piège appartient VISUELLEMENT à ce bac mais sa vraie famille est ailleurs
              const trapEmoji = trapItems[0];
              const trueBin = bins.find(x => x.items && x.items.includes(trapEmoji) && x.id !== b.id);
              if (trueBin) itemPool.push({ key: trapEmoji, binId: trueBin.id, isTrap: true, dino: false });
            }
          });
        }
      }

      binsForRound = bins;
      itemsForRound = _shuffle(itemPool);
      totalItems = itemsForRound.length;
      rangedCount = 0;
      gameComplete = false;

      document.getElementById('themeBanner').textContent = theme.dinoMode
        ? 'Range les ombres de dinosaures par couleur !'
        : theme.label;
      document.getElementById('roundBar').textContent = '★'.repeat(round) + '☆'.repeat(3 - round) + ' Manche ' + round;
    }

    // ── Construire les bacs ──
    function buildBins() {
      const col = document.getElementById('binZone');
      col.innerHTML = '';
      binsForRound.forEach(bin => {
        const el = document.createElement('div');
        el.className = 'bin';
        el.dataset.bin = bin.id;

        if (bin.hex) {
          // Bac couleur (thème dino) : fond teinté + icône silhouette dino de la même couleur
          const r = parseInt(bin.hex.slice(1,3),16), g = parseInt(bin.hex.slice(3,5),16), b = parseInt(bin.hex.slice(5,7),16);
          el.style.background = `linear-gradient(180deg, rgba(${r},${g},${b},0.35), rgba(${r},${g},${b},0.18))`;
          const icon = document.createElement('div');
          icon.className = 'bin-icon dino-swatch';
          icon.style.backgroundColor = bin.hex;
          icon.style.webkitMaskImage = `url('img/dinos/ombres/Triceratops_ombre.png')`;
          icon.style.maskImage = `url('img/dinos/ombres/Triceratops_ombre.png')`;
          el.appendChild(icon);
        } else {
          el.style.background = 'rgba(255,255,255,0.35)';
          const icon = document.createElement('div');
          icon.className = 'bin-icon';
          icon.textContent = bin.icon;
          el.appendChild(icon);
        }

        const cnt = document.createElement('div');
        cnt.className = 'bin-count';
        cnt.id = 'cnt-' + bin.id;
        cnt.textContent = '0';
        el.appendChild(cnt);

        col.appendChild(el);
      });
    }

    // ── Construire les objets du bazar ──
    function buildBazar() {
      const zone = document.getElementById('bazarZone');
      zone.querySelectorAll('.item').forEach(el => el.remove());
      objects = [];

      const zoneW = zone.offsetWidth;
      const zoneH = zone.offsetHeight;
      const margin = 8;
      const size = ITEM_SIZE;
      const maxX = zoneW - size - margin;
      const maxY = zoneH - size - margin;

      // Placement "tas de bazar" : les objets sont tirés autour d'un centre commun
      // (60% de la zone, pas toute la largeur) → chevauchement visuel volontaire,
      // façon chambre en désordre, tout en gardant chaque centre repérable au tap.
      const pileW = Math.max(size * 2, (maxX - margin) * 0.62);
      const pileH = Math.max(size * 2, (maxY - margin) * 0.62);
      const pileX0 = margin + (maxX - margin - pileW) / 2;
      const pileY0 = margin + (maxY - margin) - pileH > margin
        ? margin + Math.random() * Math.max(1, (maxY - margin - pileH))
        : margin;

      const placed = [];
      const MIN_CENTER_GAP = size * 0.55; // évite la superposition totale (reste tapable)
      function tooClose(x, y) {
        return placed.some(p => Math.hypot(p.x - x, p.y - y) < MIN_CENTER_GAP);
      }

      itemsForRound.forEach((it, i) => {
        let x, y, attempts = 0;
        do {
          x = pileX0 + Math.random() * pileW;
          y = pileY0 + Math.random() * pileH;
          attempts++;
        } while (tooClose(x, y) && attempts < 60);
        placed.push({ x, y });

        const el = document.createElement('div');
        el.dataset.binId = it.binId;
        el.dataset.trap = it.isTrap ? '1' : '0';

        if (it.dino) {
          el.className = 'item dino-swatch';
          el.style.backgroundColor = it.hex;
          const url = `url('img/dinos/ombres/${it.key}_ombre.png')`;
          el.style.webkitMaskImage = url;
          el.style.maskImage = url;
        } else {
          el.className = 'item';
          el.textContent = it.key;
        }

        el.style.left = x + 'px';
        el.style.top = y + 'px';
        // léger tour aléatoire pour l'effet "bazar"
        const rot = (Math.random() * 16 - 8).toFixed(1);
        el.style.setProperty('--rot', rot + 'deg');
        el.style.transform = `rotate(${rot}deg)`;

        zone.appendChild(el);
        el.addEventListener('pointerdown', onDragStart);

        objects.push({ el, binId: it.binId, isTrap: it.isTrap, x, y, initX: x, initY: y, rot, parked: false });

        // Entrée légère en fondu
        el.style.opacity = '0';
        el.style.transform = `rotate(${rot}deg) scale(0.5)`;
        setTimeout(() => {
          el.style.transition = 'opacity 0.35s ease, transform 0.35s cubic-bezier(0.22,1,0.36,1)';
          el.style.opacity = '1';
          el.style.transform = `rotate(${rot}deg) scale(1)`;
          setTimeout(() => { el.style.transition = ''; }, 380);
        }, i * 70);
      });
    }

    // ── Drag & Drop (Pointer Events, multi-touch) ──
    function onDragStart(e) {
      if (gameComplete) return;
      const obj = objects.find(o => o.el === e.currentTarget);
      if (!obj || obj.parked) return;
      e.preventDefault();
      e.currentTarget.setPointerCapture(e.pointerId);
      const rect = obj.el.getBoundingClientRect();
      drags.set(e.pointerId, { obj, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top });
      obj.el.classList.add('dragging');
      obj.el.style.transform = 'scale(1.12)'; // annule la rotation pendant le drag pour un pickup net
    }

    function onDragMove(e) {
      const drag = drags.get(e.pointerId);
      if (!drag) return;
      e.preventDefault();
      const { obj, offsetX, offsetY } = drag;
      const zone = document.getElementById('bazarZone');
      const zRect = zone.getBoundingClientRect();
      const x = e.clientX - zRect.left - offsetX;
      const y = e.clientY - zRect.top - offsetY;
      obj.x = x; obj.y = y;
      obj.el.style.left = x + 'px';
      obj.el.style.top = y + 'px';
      highlightBin(obj);
    }

    function onDragEnd(e) {
      const drag = drags.get(e.pointerId);
      if (!drag) return;
      const { obj } = drag;
      obj.el.classList.remove('dragging');
      drags.delete(e.pointerId);
      if (drags.size === 0) document.querySelectorAll('.bin').forEach(b => b.classList.remove('hover-ok'));
      checkDrop(obj);
    }

    function highlightBin(obj) {
      document.querySelectorAll('.bin').forEach(b => b.classList.remove('hover-ok'));
      const bin = findNearestBin(obj);
      if (bin) bin.el.classList.add('hover-ok');
    }

    function findNearestBin(obj) {
      const r = obj.el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let best = null, bestDist = Infinity;
      document.querySelectorAll('.bin').forEach(binEl => {
        const br = binEl.getBoundingClientRect();
        const bcx = br.left + br.width / 2, bcy = br.top + br.height / 2;
        const d = Math.hypot(cx - bcx, cy - bcy);
        if (d < bestDist) { bestDist = d; best = { el: binEl, id: binEl.dataset.bin, dist: d }; }
      });
      return best && best.dist < SNAP_DIST ? best : null;
    }

    function checkDrop(obj) {
      const nearest = findNearestBin(obj);
      if (!nearest) { if (typeof Tracker !== 'undefined') Tracker.logAnswer(false); wrongDrop(obj); return; }
      if (nearest.id === obj.binId) {
        if (typeof Tracker !== 'undefined') Tracker.logAnswer(true);
        rangeItem(obj, nearest);
      } else {
        if (typeof Tracker !== 'undefined') Tracker.logAnswer(false);
        wrongDrop(obj);
      }
    }

    function rangeItem(obj, bin) {
      obj.parked = true;
      obj.el.classList.add('parked');
      sndPop();
      setTimeout(sndDing, 90);
      if (window.MaxFX) { const cnt = document.getElementById('itemCount'); if (cnt) MaxFX.markPoint(obj.el, cnt, { style:'bounce', result:'green' }); }

      bin.el.classList.add('bump');
      setTimeout(() => bin.el.classList.remove('bump'), 320);

      const cntEl = document.getElementById('cnt-' + bin.id);
      cntEl.textContent = (parseInt(cntEl.textContent, 10) || 0) + 1;

      rangedCount++;
      updateProgress();

      if (rangedCount >= totalItems) {
        gameComplete = true;
        if (typeof Tracker !== 'undefined') Tracker.endSession(totalItems, totalItems);
        setTimeout(() => {
          if (round >= 3) {
            playEndSound(totalItems, totalItems);
            confettiBurst(60);
            document.getElementById('victoryText').textContent = 'Tout est rangé ! Le grand rangement est terminé !';
            document.getElementById('btnNextRound').textContent = '🔄 Rejouer';
            document.getElementById('btnNextRound').onclick = () => location.reload();
          } else {
            sndVictory();
            document.getElementById('victoryText').textContent = 'Manche ' + round + ' terminée !';
            document.getElementById('btnNextRound').textContent = '➡️ Manche suivante';
            document.getElementById('btnNextRound').onclick = nextRound;
          }
          document.getElementById('victoryOverlay').classList.add('show');
        }, 500);
      }
    }

    function wrongDrop(obj) {
      playErrorSound();
      obj.el.classList.add('wrong');
      setTimeout(() => {
        obj.el.style.transition = 'left 0.3s ease, top 0.3s ease';
        obj.el.style.left = obj.initX + 'px';
        obj.el.style.top = obj.initY + 'px';
        obj.x = obj.initX; obj.y = obj.initY;
        setTimeout(() => { obj.el.style.transition = ''; obj.el.classList.remove('wrong'); }, 320);
      }, 40);
    }

    function updateProgress() {
      const pct = totalItems ? (rangedCount / totalItems) * 100 : 0;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('itemCount').textContent = `Rangés : ${rangedCount} / ${totalItems}`;
    }

    function nextRound() {
      round++;
      document.getElementById('victoryOverlay').classList.remove('show');
      startRound();
    }

    function startRound() {
      buildRound();
      buildBins();
      buildBazar();
      updateProgress();
    }

    // ── Init ──
    function init() {
      if (typeof Tracker !== 'undefined') Tracker.startSession('mj-08');
      startRound();
      document.addEventListener('pointermove', onDragMove);
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    }

    init();
    });
  </script>
</body>
</html>
