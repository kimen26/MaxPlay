<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MJ-14 – La grille des bus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mp-theme.css">
<style>
/* --- GABARIT HEADER CANONIQUE --- */
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
html,body { width:100%; height:100dvh; overflow:hidden; }
body { font-family:'Fredoka One',sans-serif; color:var(--ink); display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100dvh; max-width:640px; margin:0 auto; width:100%; position:relative; }

/* ── Sélecteur de mode ── */
#mode-bar {
  flex-shrink:0; display:flex; gap:6px; padding:8px 12px;
  background:rgba(0,0,0,0.2); border-bottom:1px solid rgba(255,255,255,0.06);
}
.mode-btn {
  flex:1; border:2px solid rgba(255,255,255,0.2); border-radius:12px;
  background:rgba(255,255,255,0.06); color:var(--ink);
  font-family:'Nunito',sans-serif; font-weight:900; font-size:0.82rem;
  padding:7px 4px; cursor:pointer; transition:all 0.18s;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  min-height:44px;
}
.mode-btn .mode-icon { font-size:1.2rem; }
.mode-btn:active { transform:scale(0.94); }
.mode-btn.active {
  border-color:var(--gold); background:var(--gold-soft); color:var(--gold);
}

/* ── Zone principale ── */
#main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:8px 10px 6px; overflow:hidden; }

/* ── Hint ── */
#pattern-hint {
  font-size:0.72rem; font-weight:700; opacity:0.5;
  text-align:center; flex-shrink:0; padding:0 10px; line-height:1.4;
  min-height:16px;
  font-family:'Nunito',sans-serif;
}

/* ── Grille 3×3 ── */
#grid-wrap { flex-shrink:0; }

#grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(3, 1fr);
  gap:6px;
}

/* Bordures colorées par ligne pour guider le regard */
.cell {
  background:rgba(255,255,255,0.06);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  border:3px solid transparent;
  transition:border-color 0.2s, background 0.2s;
  overflow:hidden;
}
.cell[data-row="0"] { border-color:rgba(100,180,255,0.25); }
.cell[data-row="1"] { border-color:rgba(180,255,150,0.20); }
.cell[data-row="2"] { border-color:rgba(255,180,100,0.20); }
.cell[data-col="0"] { box-shadow:inset 3px 0 0 rgba(255,255,255,0.06); }

/* Case mystère */
.cell.mystery {
  background:var(--gold-soft) !important;
  border:3px dashed var(--gold) !important;
  animation:pulse-mystery 1.4s ease-in-out infinite;
}
@keyframes pulse-mystery {
  0%,100% { box-shadow:0 0 0 0 rgba(255,209,102,0.45); }
  50%      { box-shadow:0 0 0 8px rgba(255,209,102,0); }
}
.mystery-icon { font-size:2rem; animation:bounce-q 1.4s ease-in-out infinite; }
@keyframes bounce-q {
  0%,100% { transform:scale(1); }
  50%      { transform:scale(1.18); }
}

/* Feedback */
.cell.flash-ok { background:rgba(0,196,122,0.35) !important; border-color:#00c47a !important; animation:none; }

/* ── Choix ── */
#choices-label {
  font-size:0.75rem; font-weight:900; text-transform:uppercase;
  letter-spacing:2px; opacity:0.45; text-align:center; flex-shrink:0;
  font-family:'Nunito',sans-serif;
}
#choices { display:flex; gap:8px; justify-content:center; flex-shrink:0; width:100%; }

.choice-btn {
  flex:1; max-width:160px;
  background:rgba(255,255,255,0.08);
  border:3px solid rgba(255,255,255,0.18);
  border-radius:16px; padding:10px 6px 8px;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform 0.15s, border-color 0.15s, background 0.15s;
  min-height:80px;
}
.choice-btn:active { transform:scale(0.93); }
.choice-btn:hover  { border-color:rgba(255,255,255,0.4); background:rgba(255,255,255,0.13); }
.choice-btn.correct { border-color:#00c47a; background:rgba(0,196,122,0.2); animation:pop-ok 0.4s ease; }
.choice-btn.wrong   { border-color:#ff4455; background:rgba(255,68,85,0.15); animation:shake-btn 0.35s ease; }
@keyframes pop-ok { 0%{transform:scale(1)} 40%{transform:scale(1.1)} 100%{transform:scale(1)} }
@keyframes shake-btn { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.choice-label { font-size:0.7rem; font-weight:900; opacity:0.65; background:rgba(255,255,255,0.1); border-radius:8px; padding:2px 8px; font-family:'Nunito',sans-serif; }

/* ── Formes SVG (mode Formes) ── */
.shape-svg { display:block; }
</style>
</head>
<body>
<div id="app">

  <!-- Sélecteur mode -->
  <div id="mode-bar">
    <button class="mode-btn active" id="btn-mode-shapes" onclick="switchMode('shapes')">
      <span class="mode-icon">🔴🟦</span>
      <span>Formes</span>
    </button>
    <button class="mode-btn" id="btn-mode-bus" onclick="switchMode('bus')">
      <span class="mode-icon">🚌</span>
      <span>Bus</span>
    </button>
  </div>

  <!-- Zone de jeu -->
  <div id="main">
    <div id="pattern-hint"></div>
    <div id="grid-wrap"><div id="grid"></div></div>
    <div id="choices-label">Choisis ↓</div>
    <div id="choices"></div>
  </div>

</div>

<!-- libs SPÉCIFIQUES au jeu -->
<script src="js/bus-svg.js"></script>
<script src="js/data.js"></script>
<!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud, célébrations) -->
<script src="js/mj-shell.js"></script>
<script>
MJ.ready(function () {
'use strict';
// ═══════════════════════════════════════════════════════════════
//  MJ-14 — La grille (Matrices de Raven)
//  2 modes : Formes géo | Bus IDFM
//  5 paliers de difficulté (Stars.get('mj-14')+1) : types de pattern autorisés
//  🔒 Décisions figées : studio/minijeux/docs/jeux/figees/mj-14.md
// ═══════════════════════════════════════════════════════════════
const GAME_ID = 'mj-14';

const shell = MJ.init({
  id: GAME_ID, emoji: '🔮', titre: 'La grille',
  golden: true, consigne: true,
  regle: {
    picto: '🔮🧩',
    texte: 'Une case manque dans la grille magique ! Trouve le motif caché en regardant les lignes et les colonnes.',
    etapes: [
      { t: 'Je regarde la grille 👀',
        d: 'Il y a une case avec un point d’interrogation : c’est la case mystère !' },
      { t: 'Je cherche la règle 🔍',
        d: 'Regarde bien la ligne et la colonne de la case vide : un motif se répète.' },
      { t: 'Je choisis en bas ✅',
        d: 'Tape le motif qui complète la grille parmi les 3 propositions.' },
      { t: 'Plus je gagne d’étoiles, plus c’est malin 🧠',
        d: 'D’abord une seule règle facile, puis deux règles à la fois : jusqu’au niveau expert !' }
    ]
  }
});
const G = shell.G;

// 🔒 8 manches fixes (indépendant du barème questions Golden 4/6/8 — voir figée mj-14.md)
G.totalQ = 8;
G.buildPips();

const ROUNDS_PER_GAME = G.totalQ;
let currentMode = 'shapes'; // 'shapes' | 'bus'
let round = 0;
let answerKey = null;   // clé unique de la bonne réponse
let answered  = false;
let wrongCount = 0;     // nombre d'erreurs sur le round courant
let levelSchedule = []; // tirage aléatoire en début de partie

// ── Niveaux ──────────────────────────────────────────────────
// A : pattern LIGNE (même motif sur toute la ligne)
// B : pattern COLONNE
// C : LIGNE + COLONNE (ligne = axe1, colonne = axe2)
// D : CARRÉ LATIN — chaque ligne ET chaque colonne contient les 3 motifs une
//     seule fois (pattern Raven classique, pas de diagonale ambiguë).
// 🔒 Paliers (5) : types de pattern autorisés. Niveau = Stars.get('mj-14')+1.
const STAR_LV = Math.max(0, Math.min(4, (window.Stars ? Stars.get(GAME_ID) : 0)));
const ALLOWED = [['A'], ['A','B'], ['A','B','C'], ['A','B','C','D'], ['C','D']][STAR_LV];
function buildLevelSchedule(n) {
  const pool = [];
  for (let i = 0; i < n; i++) pool.push(ALLOWED[i % ALLOWED.length]);
  // Mélange Fisher-Yates
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  // Démarrer par le motif le plus simple disponible (entrée douce)
  const easyFirst = ALLOWED.includes('A') ? 'A' : ALLOWED.includes('B') ? 'B' : ALLOWED[0];
  if (pool[0] !== easyFirst) { const k = pool.indexOf(easyFirst); if (k > 0) [pool[0], pool[k]] = [pool[k], pool[0]]; }
  return pool.slice(0, n);
}
function getLevel(r) {
  return levelSchedule[r - 1] || 'A';
}

// ─────────────────────────────────────────────────────────────
//  FORMES GÉOMÉTRIQUES
// ─────────────────────────────────────────────────────────────
const SHAPES = ['circle','square','diamond','triangle'];
const FILLS  = ['empty','solid','striped'];

// Couleurs de gameplay (sémantiques : distinguent ligne/colonne, PAS des couleurs de lignes bus)
const SHAPE_COLORS = {
  row0: '#5b8fff',  // bleu
  row1: '#ff7043',  // orange
  row2: '#66bb6a',  // vert
  col0: '#5b8fff',
  col1: '#ff7043',
  col2: '#66bb6a',
};

// Couleur selon la règle active
function shapeColor(r, c, level) {
  if (level === 'A') return SHAPE_COLORS['row'+r]; // varie par ligne
  if (level === 'B') return SHAPE_COLORS['col'+c]; // varie par colonne
  // niveau C : couleur = combo ligne+colonne (on garde par ligne pour la couleur)
  return SHAPE_COLORS['row'+r];
}

// Génère un SVG pour une forme
function shapeSVG(shape, fill, color, size) {
  const s = size;
  const c = Math.floor(s / 2);
  const r = Math.floor(s * 0.38);
  let shapeEl = '';

  if (shape === 'circle') {
    shapeEl = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
  } else if (shape === 'square') {
    const off = Math.floor(s * 0.15);
    shapeEl = `<rect x="${off}" y="${off}" width="${s - off*2}" height="${s - off*2}" rx="4"/>`;
  } else if (shape === 'diamond') {
    shapeEl = `<polygon points="${c},${c-r} ${c+r},${c} ${c},${c+r} ${c-r},${c}"/>`;
  } else { // triangle
    shapeEl = `<polygon points="${c},${c-r} ${c+r},${c+r} ${c-r},${c+r}"/>`;
  }

  let fillAttr = 'none';
  let strokeW  = Math.max(2, Math.floor(s * 0.05));
  let extras   = '';

  if (fill === 'solid') {
    fillAttr = color;
  } else if (fill === 'empty') {
    fillAttr = 'none';
  } else { // striped
    fillAttr = `url(#str-${shape.slice(0,2)})`;
    extras = `<defs>
      <pattern id="str-${shape.slice(0,2)}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" stroke="${color}" stroke-width="2.5"/>
      </pattern>
    </defs>`;
  }

  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">
    ${extras}
    <g fill="${fillAttr}" stroke="${color}" stroke-width="${strokeW}">${shapeEl}</g>
  </svg>`;
}

// Génère un token unique pour une forme+fill
function shapeKey(shape, fill) { return shape + '|' + fill; }

function generateShapesPuzzle(roundNum) {
  const level = getLevel(roundNum);

  const sh = [...SHAPES].sort(() => Math.random()-0.5).slice(0,3);
  const fi = [...FILLS].sort(() => Math.random()-0.5).slice(0,3);
  const fixedFill  = fi[0];
  const fixedShape = sh[0];

  const grid = [];
  for (let r = 0; r < 3; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) {
      let shape, fill;
      if (level === 'A') {
        shape = sh[r];
        fill  = fixedFill;
      } else if (level === 'B') {
        shape = fixedShape;
        fill  = fi[c];
      } else if (level === 'C') {
        shape = sh[r];
        fill  = fi[c];
      } else { // D — CARRÉ LATIN : chaque ligne et chaque colonne contiennent
               // les 3 formes une seule fois (sh[0], sh[1], sh[2]).
               // Rangée r, colonne c → sh[(r+c) mod 3]. Fill = fixedFill partout
               // pour que l'attention porte sur la forme uniquement.
        shape = sh[(r + c) % 3];
        fill  = fixedFill;
      }
      row.push({ shape, fill, color: shapeColor(r, c, level) });
    }
    grid.push(row);
  }

  const correct = grid[2][2];
  answerKey = shapeKey(correct.shape, correct.fill);

  const allCombos = [];
  SHAPES.forEach(s => FILLS.forEach(f => {
    if (shapeKey(s,f) !== answerKey) allCombos.push({shape:s, fill:f});
  }));
  const distractors = allCombos.sort(() => Math.random()-0.5).slice(0,2)
    .map(d => ({ ...d, color: correct.color }));

  const choices = [correct, ...distractors].sort(() => Math.random()-0.5);

  const hints = {
    A: 'Regarde : chaque ligne a la même forme !',
    B: 'Regarde : chaque colonne a le même remplissage !',
    C: 'Ligne = forme, colonne = remplissage. Trouve les deux !',
    D: 'Chaque ligne et chaque colonne ont les 3 formes une seule fois. Laquelle manque ?',
  };

  return { grid, choices, hint: hints[level], level, type: 'shapes' };
}

// ─────────────────────────────────────────────────────────────
//  BUS IDFM
// ─────────────────────────────────────────────────────────────
const BUS_POOL = LIGNES.filter(l =>
  ['162','172','185','286','323','V2','V3','V4','132','184','186','47'].includes(l.num)
);

// Palette de carrosseries (turquoise = standard, + variantes LOCALES à MJ-14 — gameplay,
// pas des couleurs de ligne IDFM : autorisé par la règle "gameplay sémantique" du figeage).
const BODY_COLORS = [
  { key:'turquoise', body:'#1abc9c' },
  { key:'orange',    body:'#ff7043' },
  { key:'violet',    body:'#9c27b0' },
];
// Palette roues
const WHEEL_COLORS = [
  { key:'noir',   outer:'#333', inner:'#666' },
  { key:'jaune',  outer:'#f1c40f', inner:'#ffdb4d' },
  { key:'rouge',  outer:'#c0392b', inner:'#e74c3c' },
];

// Variante locale à MJ-14 uniquement : permet de changer carrosserie + roues.
// Ne pas réutiliser ailleurs — la règle globale reste busSVG() turquoise fixe.
function busSVGVariant(destColor, textColor, num, bodyColor, wheel, width) {
  return `<svg viewBox="0 0 160 80" width="${width}" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="10" width="150" height="45" rx="4" fill="${bodyColor}"/>
    <rect x="5" y="40" width="150" height="15" fill="#ecf0f1"/>
    <rect x="5" y="48" width="150" height="6" fill="#7f8c8d"/>
    <rect x="62" y="14" width="8" height="37" fill="#7f8c8d" stroke="#111" stroke-width="1.5"/>
    <rect x="70" y="14" width="8" height="37" fill="#7f8c8d" stroke="#111" stroke-width="1.5"/>
    <rect x="130" y="14" width="8" height="37" fill="#7f8c8d" stroke="#111" stroke-width="1.5"/>
    <rect x="138" y="14" width="8" height="37" fill="#7f8c8d" stroke="#111" stroke-width="1.5"/>
    <rect x="5" y="10" width="150" height="45" rx="4" fill="none" stroke="#111" stroke-width="2"/>
    <rect x="10" y="14" width="21" height="21" fill="#458bba" fill-opacity="0.82" stroke="#111" stroke-width="1.5"/>
    <rect x="36" y="14" width="21" height="21" fill="#458bba" fill-opacity="0.82" stroke="#111" stroke-width="1.5"/>
    <rect x="84" y="14" width="40" height="21" fill="${destColor}" stroke="#111" stroke-width="1.5"/>
    <rect x="150.5" y="14" width="5" height="21" fill="#458bba" fill-opacity="0.82" stroke="#111" stroke-width="1"/>
    <text x="104" y="24.5" font-family="Arial,sans-serif" font-size="13" font-weight="bold"
          fill="${textColor}" text-anchor="middle" dominant-baseline="central">${num}</text>
    <line x1="149" y1="24" x2="155" y2="24" stroke="#111" stroke-width="2" stroke-linecap="round"/>
    <rect x="152" y="20" width="6" height="10" rx="1" fill="#111"/>
    <circle cx="45" cy="54" r="10" fill="${wheel.outer}" stroke="#111" stroke-width="2"/>
    <circle cx="45" cy="54" r="6" fill="${wheel.inner}"/>
    <circle cx="45" cy="54" r="2" fill="#111"/>
    <circle cx="115" cy="54" r="10" fill="${wheel.outer}" stroke="#111" stroke-width="2"/>
    <circle cx="115" cy="54" r="6" fill="${wheel.inner}"/>
    <circle cx="115" cy="54" r="2" fill="#111"/>
    <rect x="5" y="48" width="4" height="5" fill="#FF4444"/>
    <rect x="151" y="48" width="4" height="5" fill="#FFCC00"/>
  </svg>`;
}

function busRender(item, size) {
  if (item.bodyColor || item.wheel) {
    return busSVGVariant(
      item.color, item.textColor, item.num,
      item.bodyColor || '#1abc9c',
      item.wheel     || WHEEL_COLORS[0],
      size
    );
  }
  return busSVG(item.color, item.textColor, item.num, size);
}

function busKey(item) {
  return `${item.color}|${item.num}|${item.bodyColor||'_'}|${item.wheel?item.wheel.key:'_'}`;
}

function generateBusPuzzle(roundNum) {
  const level = getLevel(roundNum);
  const sh = [...BUS_POOL].sort(() => Math.random()-0.5);
  const rowLines = sh.slice(0, 3);
  const colLines = sh.slice(3, 6);

  const bodiesByRow = [...BODY_COLORS].sort(() => Math.random()-0.5).slice(0,3);
  const wheelsByCol = [...WHEEL_COLORS].sort(() => Math.random()-0.5).slice(0,3);

  // Niveau C a 3 variantes tirées au hasard :
  //   C1 : couleur destination par ligne, numéro par colonne (classique)
  //   C2 : carrosserie par ligne, numéro par colonne
  //   C3 : couleur destination par ligne, roues par colonne
  const cVariant = level === 'C' ? (1 + Math.floor(Math.random()*3)) : 0;

  const grid = [];
  for (let r = 0; r < 3; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) {
      let cell;
      if (level === 'A') {
        cell = { ...rowLines[r] };
      } else if (level === 'B') {
        cell = { ...colLines[c] };
      } else if (level === 'C') {
        if (cVariant === 1) {
          cell = {
            num: colLines[c].num,
            color: rowLines[r].color,
            textColor: rowLines[r].textColor,
          };
        } else if (cVariant === 2) {
          cell = {
            num: colLines[c].num,
            color: colLines[c].color,
            textColor: colLines[c].textColor,
            bodyColor: bodiesByRow[r].body,
          };
        } else {
          cell = {
            num: colLines[c].num,
            color: rowLines[r].color,
            textColor: rowLines[r].textColor,
            wheel: wheelsByCol[c],
          };
        }
      } else { // D — CARRÉ LATIN : chaque ligne et chaque colonne contiennent
               // les 3 mêmes bus (rowLines[0..2]) une seule fois.
               // Position (r,c) → rowLines[(r+c) mod 3].
        cell = { ...rowLines[(r + c) % 3] };
      }
      row.push(cell);
    }
    grid.push(row);
  }

  const correct = grid[2][2];
  answerKey = busKey(correct);

  // Distracteurs — variantes plausibles qui diffèrent sur au moins un axe
  const distractorPool = [];
  if (level === 'C' && cVariant === 2) {
    bodiesByRow.forEach(b => colLines.forEach(cl => {
      const cand = { num:cl.num, color:cl.color, textColor:cl.textColor, bodyColor:b.body };
      if (busKey(cand) !== answerKey) distractorPool.push(cand);
    }));
  } else if (level === 'C' && cVariant === 3) {
    rowLines.forEach(rl => wheelsByCol.forEach(w => {
      const cand = { num:colLines[2].num, color:rl.color, textColor:rl.textColor, wheel:w };
      if (busKey(cand) !== answerKey) distractorPool.push(cand);
    }));
  } else if (level === 'C') {
    rowLines.forEach(rl => colLines.forEach(cl => {
      const cand = { num:cl.num, color:rl.color, textColor:rl.textColor };
      if (busKey(cand) !== answerKey) distractorPool.push(cand);
    }));
  } else {
    const usedNums = rowLines.map(l => l.num).concat(colLines.map(l => l.num));
    BUS_POOL
      .filter(l => !usedNums.includes(l.num))
      .forEach(l => distractorPool.push({ ...l }));
  }

  const distractors = distractorPool.sort(() => Math.random()-0.5).slice(0,2);
  const choices = [correct, ...distractors].sort(() => Math.random()-0.5);

  const hints = {
    A: 'Chaque ligne a toujours le même bus !',
    B: 'Chaque colonne a toujours le même bus !',
    C: cVariant === 2
        ? 'La carrosserie change par ligne, le numéro par colonne !'
        : cVariant === 3
        ? 'La couleur change par ligne, les roues par colonne !'
        : 'La couleur change par ligne, le numéro par colonne !',
    D: 'Chaque ligne et chaque colonne ont les 3 bus une seule fois. Lequel manque ?',
  };

  return { grid, choices, hint: hints[level], level, type: 'bus' };
}

// ─────────────────────────────────────────────────────────────
//  RENDU
// ─────────────────────────────────────────────────────────────
function renderPuzzle(puzzle) {
  answered = false;
  wrongCount = 0;
  const { grid, choices, hint, type } = puzzle;

  const hintEl = document.getElementById('pattern-hint');
  hintEl.textContent = hint;
  hintEl.style.opacity = '';
  hintEl.style.color   = '';
  hintEl.style.fontSize = '';

  shell.setConsigne(
    type === 'bus' ? 'Quel bus manque dans la grille ?' : 'Qu\'est-ce qui manque ?',
    round === 1 ? undefined : true
  );

  // Taille de grille
  const mainEl = document.getElementById('main');
  const available = Math.min(
    mainEl.clientWidth - 20,
    mainEl.clientHeight * 0.50
  );
  const cellSize = Math.floor((available - 12) / 3);
  const busFit   = Math.floor(cellSize * 0.84);
  const shapeFit = Math.floor(cellSize * 0.60);

  const gridEl = document.getElementById('grid');
  gridEl.style.width  = available + 'px';
  gridEl.style.height = available + 'px';
  gridEl.innerHTML = '';

  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const isMystery = (r === 2 && c === 2);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.style.width  = cellSize + 'px';
      cell.style.height = cellSize + 'px';

      if (isMystery) {
        cell.classList.add('mystery');
        cell.innerHTML = `<span class="mystery-icon">❓</span>`;
      } else {
        const item = grid[r][c];
        cell.innerHTML = type === 'bus'
          ? busRender(item, busFit)
          : shapeSVG(item.shape, item.fill, item.color, shapeFit);
      }
      gridEl.appendChild(cell);
    }
  }

  // ── Choix ──
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const cFit = type === 'bus'
    ? Math.min(80, Math.floor(available / 3) - 12)
    : Math.floor(cellSize * 0.52);

  choices.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';

    let key, content, label;
    if (type === 'bus') {
      key     = busKey(item);
      content = busRender(item, cFit);
      label   = `Ligne ${item.num}`;
    } else {
      key     = shapeKey(item.shape, item.fill);
      content = shapeSVG(item.shape, item.fill, item.color, Math.max(48, cFit));
      const shapeName  = {circle:'Rond',square:'Carré',diamond:'Losange',triangle:'Triangle'}[item.shape];
      const fillName   = {empty:'Vide',solid:'Plein',striped:'Rayé'}[item.fill];
      label = `${shapeName} ${fillName}`;
    }

    btn.dataset.key = key;
    if (key === answerKey) btn.dataset.correct = '1';
    btn.innerHTML = content + `<span class="choice-label">${label}</span>`;
    btn.addEventListener('click', () => onChoice(key, btn, puzzle));
    choicesEl.appendChild(btn);
  });

  if (type === 'bus') SoundPool.phrase('quel-bus-manque', 'Quel bus manque dans la grille ?');
  else SoundPool.phrase('qu-est-ce-qui-manque', "Qu'est-ce qui manque dans la grille ?");
}

// ─────────────────────────────────────────────────────────────
//  INTERACTION
// ─────────────────────────────────────────────────────────────
// Indice fort par niveau — parlé à voix haute sur erreur (🔒 retry natif figé)
function strongHint(level) {
  if (level === 'A') return 'Regarde bien : dans chaque ligne horizontale, tous les motifs sont pareils. Trouve la ligne de la case vide.';
  if (level === 'B') return 'Regarde bien : dans chaque colonne verticale, tous les motifs sont pareils. Trouve la colonne de la case vide.';
  if (level === 'D') return 'Regarde bien : dans chaque ligne il y a 3 motifs différents, et dans chaque colonne aussi. Trouve celui qui manque dans la dernière ligne ET la dernière colonne.';
  return 'Regarde la ligne de la case vide et la colonne de la case vide. La bonne réponse combine les deux.';
}

function onChoice(key, btn, puzzle) {
  if (answered) return;

  if (key === answerKey) {
    answered = true;
    const attempts = wrongCount === 0 ? 1 : (wrongCount === 1 ? 2 : 3);
    btn.classList.add('correct');

    // Révèle la case mystère
    const mystery = document.querySelector('.cell.mystery');
    if (mystery) {
      const item = puzzle.grid[2][2];
      const gridW = parseInt(document.getElementById('grid').style.width);
      const cs    = Math.floor((gridW - 12) / 3);
      mystery.classList.remove('mystery');
      mystery.style.animation = 'none';
      mystery.innerHTML = puzzle.type === 'bus'
        ? busRender(item, Math.floor(cs * 0.84))
        : shapeSVG(item.shape, item.fill, item.color, Math.floor(cs * 0.60));
      mystery.classList.add('flash-ok');
    }
    playSuccessBeep();
    // 🔒 Étoile = sans-faute 8/8 en 1ʳᵉ tentative — G.notePip pilote pips + tracker + MaxFX.markPoint
    G.notePip(round - 1, attempts, btn);
    setTimeout(nextRound, 1100);
    return;
  }

  // Mauvaise réponse
  wrongCount++;
  btn.classList.add('wrong');
  if (typeof Tracker !== 'undefined') Tracker.logAnswer(false);
  playErrorSound();

  if (wrongCount === 1) {
    // 🔒 1ère erreur : PAS de révélation, indice fort parlé, retry possible
    const hintEl = document.getElementById('pattern-hint');
    const strong = strongHint(puzzle.level);
    hintEl.textContent = '💡 ' + strong;
    hintEl.style.opacity = '1';
    hintEl.style.color   = 'var(--gold)';
    hintEl.style.fontSize = '0.88rem';
    shell.say(strong);
    setTimeout(() => {
      btn.classList.remove('wrong');
      btn.disabled = true;
      btn.style.opacity = '0.35';
    }, 450);
    return;
  }

  // 🔒 2e erreur (ou +) : révèle la bonne réponse et passe (pas d'étoile)
  answered = true;
  setTimeout(() => {
    let okEl = null;
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.dataset.key === answerKey) { b.classList.add('correct'); okEl = b; }
    });
    G.notePip(round - 1, 4, okEl);
    setTimeout(nextRound, 1100);
  }, 400);
}

// ─────────────────────────────────────────────────────────────
//  SONS
// ─────────────────────────────────────────────────────────────
function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.18);
      osc.start(ctx.currentTime + i * 0.1);
      osc.stop(ctx.currentTime + i * 0.1 + 0.2);
    });
  } catch(e) {}
}

// ─────────────────────────────────────────────────────────────
//  ROUNDS
// ─────────────────────────────────────────────────────────────
function nextRound() {
  round++;
  if (round > ROUNDS_PER_GAME) { showEnd(); return; }
  const puzzle = currentMode === 'bus' ? generateBusPuzzle(round) : generateShapesPuzzle(round);
  renderPuzzle(puzzle);
}

function showEnd() {
  G.showEnd({ replayUrl: 'mj-14.html' });
}

// ─────────────────────────────────────────────────────────────
//  MODE SWITCH
// ─────────────────────────────────────────────────────────────
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btn-mode-shapes').classList.toggle('active', mode === 'shapes');
  document.getElementById('btn-mode-bus').classList.toggle('active', mode === 'bus');
  startGame();
}
window.switchMode = switchMode;

// ─────────────────────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────────────────────
function startGame() {
  round = 0;
  answered = false;
  levelSchedule = buildLevelSchedule(ROUNDS_PER_GAME);
  G.buildPips();
  nextRound();
}

startGame();
});
