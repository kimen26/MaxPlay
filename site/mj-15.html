<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MJ-15 – L’intrus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mp-theme.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
html,body { width:100%; height:100dvh; overflow:hidden; font-family:'Nunito',sans-serif; color:var(--ink); }

#app { display:flex; flex-direction:column; height:100dvh; max-width:700px; margin:0 auto; position:relative; }

#score-badge {
  display:none !important;
  background:var(--gold); color:var(--gold-ink); font-weight:900;
  border-radius:20px; padding:4px 14px; font-size:0.95rem; flex-shrink:0;
}

/* ── Indicateur de niveau ── */
#level-bar {
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  gap:8px; padding:6px 12px;
  background:rgba(0,0,0,0.18);
  border-bottom:1px solid var(--line);
}
.lvl-dot {
  width:12px; height:12px; border-radius:50%;
  background:rgba(255,255,255,0.15); transition:background 0.3s;
}
.lvl-dot.done   { background:var(--gold); }
.lvl-dot.active { background:var(--accent); box-shadow:0 0 8px var(--accent); }
#level-label { font-size:0.82rem; font-weight:900; opacity:0.65; color:var(--ink-2); }

/* ── Zone principale ── */
#main {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:space-evenly; padding:10px 12px 8px; overflow:hidden;
}

/* ── Question ── */
#q-label {
  font-size:1.15rem; font-weight:900; text-align:center;
  background:rgba(255,255,255,0.09); border-radius:18px;
  padding:10px 22px; flex-shrink:0; line-height:1.3;
  border:2px solid rgba(255,255,255,0.1);
}

/* ── Hint ── */
#hint-label {
  font-size:0.8rem; font-weight:700; opacity:0.55;
  text-align:center; flex-shrink:0; padding:0 12px; min-height:18px;
}

/* ── Grille des bus ── */
#buses-wrap {
  flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  width:100%;
}

/* Ligne haute (2 bus) */
#row-top {
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap;
}

/* Ligne basse (3 bus) */
#row-bot {
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap;
}

/* Bouton bus */
.bus-btn {
  background:rgba(255,255,255,0.07);
  border:3px solid rgba(255,255,255,0.18);
  border-radius:18px;
  padding:10px 10px 8px;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform 0.12s, border-color 0.15s, background 0.15s;
  min-width:100px; min-height:80px;
  position:relative;
}
.bus-btn:active { transform:scale(0.92); }
.bus-btn:hover  { border-color:rgba(255,255,255,0.4); background:rgba(255,255,255,0.13); }

.bus-label {
  font-size:0.72rem; font-weight:900; opacity:0.7;
  background:rgba(255,255,255,0.1); border-radius:8px; padding:2px 9px;
}

/* Feedback bon = flash vert */
.bus-btn.flash-ok {
  border-color:var(--ok) !important;
  background:rgba(47,191,143,0.25) !important;
  animation:pop-ok 0.4s ease;
}
@keyframes pop-ok {
  0%   { transform:scale(1); }
  35%  { transform:scale(1.12); }
  100% { transform:scale(1); }
}

/* Feedback mauvais = bounce rouge (aide, pas punition) */
.bus-btn.flash-err {
  border-color:var(--helped) !important;
  background:rgba(224,101,90,0.2) !important;
  animation:bounce-err 0.4s ease;
}
@keyframes bounce-err {
  0%,100% { transform:translateX(0); }
  20%     { transform:translateX(-8px); }
  60%     { transform:translateX(8px); }
}

/* Bus disparu après bonne réponse */
.bus-btn.gone {
  opacity:0;
  transform:scale(0.5) translateY(-20px);
  transition:opacity 0.35s ease, transform 0.35s ease;
  pointer-events:none;
}

/* ── Écran de fin ── */
#end-screen {
  display:none; position:absolute; inset:0;
  background:rgba(13,27,42,0.96);
  flex-direction:column; align-items:center; justify-content:center;
  gap:16px; z-index:20;
}
#end-screen.visible { display:flex; }
#end-emoji  { font-size:4.5rem; }
#end-msg    { font-size:1.4rem; font-weight:900; text-align:center; padding:0 24px; line-height:1.4; color:var(--ink); }
#end-score  { font-size:1rem; color:var(--gold); font-weight:900; }
#btn-replay {
  background:linear-gradient(135deg, var(--gold), #ffbf3f); color:var(--gold-ink);
  border:none; border-radius:20px;
  font-family:'Nunito',sans-serif; font-weight:900;
  font-size:1.1rem; padding:14px 38px; cursor:pointer;
  box-shadow:0 8px 22px rgba(255,209,102,.25); transition:transform 0.15s;
}
#btn-replay:active { transform:scale(0.95); }
</style>

<div id="app">

<script>
MJ.ready(function () {
  const shell = MJ.init({
    id: 'mj-15', emoji: '🔍', titre: 'L’intrus',
    golden: false,
    consigne: false,
    regle: {
      picto: '🔍🚌',
      texte: 'Regarde les 5 bus, trouve celui qui ne va pas avec les autres !',
      etapes: [
        { t: 'J’écoute la question 👂',
          d: '« Lequel ne va pas avec les autres ? » Un indice s’affiche pour m’aider à savoir quoi regarder.' },
        { t: 'Je compare les 5 bus 👀',
          d: '4 bus se ressemblent (même couleur, même famille…), 1 seul est différent : c’est l’intrus !' },
        { t: 'Je tape l’intrus 👆',
          d: 'Si je me trompe, le bus tremble et je peux réessayer avec un indice — l’intrus n’est jamais révélé tout seul.' },
        { t: 'Plus j’ai d’étoiles, plus c’est subtil 💪',
          d: 'Au début c’est la couleur, puis les roues, puis la famille de ligne… et même deux indices en même temps !' }
      ]
    }
  });

// ═══════════════════════════════════════════════════════════════════════════
//  MJ-15 — L'intrus
//  5 rounds, 5 bus affichés, 1 intrus à trouver
//  Niveau A : couleur différente
//  Niveau C : famille de ligne (Valouette / Noctilien / Métro / Standard)
//  Niveau D : roues colorées (4 bus roues normales, 1 bus roues vives)
//  Niveau E : double critère — couleur ET numéro (pair/impair) faux ensemble
//  (Ancien niveau B "pair vs impair" retiré : trop long à lire pour Max)
// ═══════════════════════════════════════════════════════════════════════════

const ROUNDS_PER_GAME = 5;

// ── Familles de lignes (niveau C) ──────────────────────────────────────────
const FAMILIES = {
  valouette:  l => ['V2','V3','V4','V5','V6','V7'].includes(l.num),
  noctilien:  l => l.num.startsWith('N'),
  metro:      l => l.num.startsWith('M') && /^\d/.test(l.num.substring(1)),
  rer:        l => l.num.startsWith('RER '),
  standard:   l => !['V2','V3','V4','V5','V6','V7'].includes(l.num)
                   && !l.num.startsWith('N')
                   && !l.num.startsWith('RER ')
                   && !(l.num.startsWith('M') && /^\d/.test(l.num.substring(1)))
                   && !(l.num.startsWith('T') && /^\d/.test(l.num.substring(1))),
};

const FAMILY_NAMES = {
  valouette: 'Valouette',
  noctilien: 'Noctilien',
  metro:     'Métro',
  rer:       'RER',
  standard:  'Bus standard',
};

// ── Parité : est-ce qu'un numéro de ligne est "pair" ?
// On ne considère que les lignes dont le num est un entier.
function isPair(num) {
  const n = parseInt(num, 10);
  return !isNaN(n) && n % 2 === 0;
}

function isImpair(num) {
  const n = parseInt(num, 10);
  return !isNaN(n) && n % 2 !== 0;
}

// ── Utilitaires ────────────────────────────────────────────────────────────
const shuffle = MJKit.shuffle;

function pick(arr, n) {
  return shuffle(arr).slice(0, n);
}

// ── Groupes d'émojis proches (niveau F) ────────────────────────────────────
// Chaque groupe = un thème neutre, sans hiérarchie ni jugement (rien de stigmatisant).
// L'intrus est toujours un élément qui ne va PAS avec le thème du groupe.
const EMOJI_GROUPS = [
  { theme: 'le ciel et la terre', items: ['🌍','🌙','☀️'], odd: '🐢', oddLabel: 'Tortue' },
  { theme: 'les fruits',          items: ['🍎','🍌','🍓'], odd: '⚽', oddLabel: 'Ballon' },
  { theme: 'les animaux de la ferme', items: ['🐄','🐷','🐔'], odd: '🦁', oddLabel: 'Lion' },
  { theme: 'les véhicules qui roulent', items: ['🚗','🚚','🏍️'], odd: '✈️', oddLabel: 'Avion' },
  { theme: 'les fleurs et les arbres', items: ['🌸','🌳','🌻'], odd: '🍕', oddLabel: 'Pizza' },
  { theme: 'les jouets', items: ['🧸','🪀','🎈'], odd: '🥕', oddLabel: 'Carotte' },
  { theme: 'la mer', items: ['🐟','🐠','🐬'], odd: '🦋', oddLabel: 'Papillon' },
  { theme: 'les desserts', items: ['🍰','🍩','🍫'], odd: '🚀', oddLabel: 'Fusée' },
];

function generatePuzzleF() {
  const group = shuffle(EMOJI_GROUPS)[0];
  // 4 emojis du thème (répétés si besoin pour remplir), 1 intrus
  const themeItems = [];
  for (let i = 0; i < 4; i++) themeItems.push(group.items[i % group.items.length]);

  const cards = [...themeItems, group.odd];
  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = { emoji: cards[i], label: i === 4 ? group.oddLabel : '' }; });
  const intrusPos = positions[4];

  return {
    kind: 'emoji',
    buses: placed,
    intrusIdx: intrusPos,
    hint: `4 vont avec ${group.theme}…`,
    level: 'F',
  };
}

// ── Ombres de dinos (niveau G) ──────────────────────────────────────────────
// Silhouettes teintées par filtre CSS (jamais de couleur "moche"/dévalorisante).
// Deux variantes : (1) 4 ombres même teinte + 1 teinte différente — même dino partout,
//                  (2) 3 même dino + 1 dino différent, tous en silhouette neutre.
const SRC_DINOS = (typeof DINOS !== 'undefined') ? DINOS : [];
const OMBRES_MJ15 = SRC_DINOS.filter(d => d.png && d.name && !d.png.includes('/'))
  .map(d => ({ id: d.id, name: d.name,
               src: 'img/dinos/ombres/' + d.png.replace(/\.(jpg|png)$/i, '') + '_ombre.png' }));

// Silhouettes = noir plein sur transparent : hue-rotate() n'a AUCUN effet sur du noir pur,
// et mask-image est bloqué par CORS en local file:// (testé, cassé). Seule solution fiable :
// filtre SVG inline <feColorMatrix> référencé via filter:url(#id) — recolore le noir en
// n'importe quelle teinte, marche en file:// (pas de fetch réseau, tout est inline).
const SHADOW_TINTS = ['tintRed', 'tintGreen', 'tintBlue', 'tintYellow'];

function generatePuzzleG() {
  if (OMBRES_MJ15.length < 2) return generatePuzzleA();

  const useSameDino = Math.random() < 0.5;

  if (useSameDino) {
    // Même dino partout, 4 en teinte A + 1 en teinte B
    const dino = shuffle(OMBRES_MJ15)[0];
    const tints = shuffle(SHADOW_TINTS).slice(0, 2);
    const cards = [tints[0], tints[0], tints[0], tints[0], tints[1]]
      .map(t => ({ src: dino.src, filter: t, name: dino.name }));

    const positions = shuffle([0,1,2,3,4]);
    const placed = new Array(5);
    positions.forEach((pos, i) => { placed[pos] = cards[i]; });
    const intrusPos = positions[4];

    return {
      kind: 'dino',
      buses: placed,
      intrusIdx: intrusPos,
      hint: 'Regarde bien la couleur des ombres !',
      level: 'G',
    };
  }

  // 4 fois le même dino, 1 dino différent — même teinte partout
  const tint = shuffle(SHADOW_TINTS)[0];
  const majorDino = shuffle(OMBRES_MJ15)[0];
  const oddPool = OMBRES_MJ15.filter(d => d.id !== majorDino.id);
  const oddDino = shuffle(oddPool)[0] || majorDino;

  const cards = [majorDino, majorDino, majorDino, majorDino, oddDino]
    .map(d => ({ src: d.src, filter: tint, name: d.name }));

  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = cards[i]; });
  const intrusPos = positions[4];

  return {
    kind: 'dino',
    buses: placed,
    intrusIdx: intrusPos,
    hint: 'Regarde bien la forme de l’ombre !',
    level: 'G',
  };
}

// ── État du jeu ────────────────────────────────────────────────────────────
let score    = 0;
let round    = 0;
let intrusIdx = -1;   // index (0-4) du bus intrus
let answered = false;
let wrongThisRound = false;

// ── Génération des puzzles ─────────────────────────────────────────────────

// Paliers (doc _PALIERS) : critère de l'intrus. Niveau = Stars.get, plafonné 0..2.
// Remap 3★ (2026-07-14) : N0=ex-P1-2(couleur+roues, évident) · N1=ex-P3(+famille) · N2=ex-P4-5(double critère subtil)
const level = Math.max(0, Math.min(2, (window.Stars ? Stars.get('mj-15') : 0)));
const CRIT = [
  ['A','D','F'],      // N0 couleur (évident) + roues colorées + émojis
  ['A','D','C','G'],  // N1 + famille de ligne + ombres dino
  ['C','E','G'],      // N2 famille + double critère (subtil) + ombres dino
][level];

// Niveau A — couleur différente
function generatePuzzleA() {
  // 4 bus de la même couleur distincte, 1 bus d'une couleur clairement différente
  // On utilise selectDistinctColors pour garantir que les 2 couleurs sont bien différentes
  const twoGroups = selectDistinctColors(LIGNES, 2, 100);
  if (twoGroups.length < 2) {
    // Fallback : prendre les 2 premières lignes avec couleurs différentes
    twoGroups.push(...LIGNES.filter(l => l.color !== twoGroups[0].color).slice(0, 1));
  }

  const colorMaj = twoGroups[0];
  const colorMin = twoGroups[1];

  // 4 bus de la couleur majoritaire (avec des numéros différents si possible)
  const poolMaj = LIGNES.filter(l => l.color === colorMaj.color);
  const poolMin = LIGNES.filter(l => l.color === colorMin.color);

  // On veut 4 bus de la même couleur — si la couleur n'a qu'une ligne, on duplique
  const majorBuses = [];
  const poolMajShuffled = shuffle(poolMaj);
  for (let i = 0; i < 4; i++) {
    majorBuses.push({ ...poolMajShuffled[i % poolMajShuffled.length] });
  }

  const intrusBus = { ...shuffle(poolMin)[0] };

  const buses = [...majorBuses, intrusBus];
  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = buses[i]; });

  // L'intrus est le dernier bus inséré (index 4 dans buses), retrouvons sa position
  const intrusPos = positions[4];

  return {
    buses: placed,
    intrusIdx: intrusPos,
    hint: 'Regarde les couleurs !',
    level: 'A',
  };
}

// Niveau B — pair vs impair
function generatePuzzleB() {
  const pairLignes   = LIGNES.filter(l => isPair(l.num));
  const impairLignes = LIGNES.filter(l => isImpair(l.num));

  // Besoin d'au moins 4 dans un camp et 1 dans l'autre
  const majority = pairLignes.length >= 4 ? pairLignes : impairLignes;
  const minority = pairLignes.length >= 4 ? impairLignes : pairLignes;

  // Parfois on veut inverser aléatoirement
  const useMinority = Math.random() < 0.5 && minority.length >= 4;
  const majPool = useMinority ? minority : majority;
  const minPool = useMinority ? majority : minority;

  const majorBuses = pick(majPool, 4);
  const intrusBus  = pick(minPool, 1)[0];

  const buses = [...majorBuses, intrusBus];
  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = buses[i]; });
  const intrusPos = positions[4];

  return {
    buses: placed,
    intrusIdx: intrusPos,
    hint: 'Pair ou impair ?',
    level: 'B',
  };
}

// Niveau C — famille de ligne
function generatePuzzleC() {
  // Construire les pools par famille
  const famKeys = Object.keys(FAMILIES);
  const famPools = {};
  famKeys.forEach(k => {
    famPools[k] = LIGNES.filter(FAMILIES[k]);
  });

  // Choisir une famille majoritaire (≥4 membres) et une famille intrus (≥1)
  const validMaj = famKeys.filter(k => famPools[k].length >= 4);
  const validMin = famKeys.filter(k => famPools[k].length >= 1);

  if (validMaj.length === 0) {
    // Fallback sur niveau A
    return generatePuzzleA();
  }

  const majFam = shuffle(validMaj)[0];
  const minFam = shuffle(validMin.filter(k => k !== majFam))[0] || validMin[0];

  const majorBuses = pick(famPools[majFam], 4);
  const intrusBus  = pick(famPools[minFam], 1)[0];

  const buses = [...majorBuses, intrusBus];
  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = buses[i]; });
  const intrusPos = positions[4];

  const hintMaj = FAMILY_NAMES[majFam] || majFam;
  const hintMin = FAMILY_NAMES[minFam] || minFam;

  return {
    buses: placed,
    intrusIdx: intrusPos,
    hint: `4 bus sont de la famille ${hintMaj}…`,
    level: 'C',
  };
}

// Niveau D — roues colorées
// 4 bus avec roues noires/grises normales + 1 bus avec roues d'une couleur vive
function generatePuzzleD() {
  // 5 bus, peu importe couleur/numéro — seul l'intrus a des roues colorées
  const lignes = pick(LIGNES, 5);
  const wheelColors = ['#e94560', '#ffe066', '#00c47a', '#ff8c00', '#9b59b6'];
  const wheelColor = wheelColors[Math.floor(Math.random() * wheelColors.length)];

  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = lignes[i]; });
  const intrusPos = positions[4];

  return {
    buses: placed,
    intrusIdx: intrusPos,
    hint: 'Regarde bien les roues !',
    level: 'D',
    wheelColor,
  };
}

// Niveau E — double critère : couleur ET numéro (pair/impair) faux ensemble
// 4 bus = même couleur + même parité. Intrus = couleur différente + parité opposée.
function generatePuzzleE() {
  const wantPair = Math.random() < 0.5;
  const majorityFilter = wantPair ? isPair : isImpair;
  const minorityFilter = wantPair ? isImpair : isPair;

  // Grouper les lignes par couleur, majoritaire = couleur avec ≥4 numéros pair (ou impair)
  const byColor = {};
  LIGNES.forEach(l => {
    if (majorityFilter(l.num)) {
      (byColor[l.color] = byColor[l.color] || []).push(l);
    }
  });
  const validMajColors = Object.keys(byColor).filter(c => byColor[c].length >= 4);

  if (validMajColors.length === 0) return generatePuzzleA();

  const majColor = validMajColors[Math.floor(Math.random() * validMajColors.length)];
  const majPool = byColor[majColor];

  // Intrus : ligne avec parité opposée ET couleur différente du majColor
  const minPool = LIGNES.filter(l => minorityFilter(l.num) && l.color !== majColor);
  if (minPool.length === 0) return generatePuzzleA();

  const majorBuses = pick(majPool, 4);
  const intrusBus  = pick(minPool, 1)[0];

  const buses = [...majorBuses, intrusBus];
  const positions = shuffle([0,1,2,3,4]);
  const placed = new Array(5);
  positions.forEach((pos, i) => { placed[pos] = buses[i]; });
  const intrusPos = positions[4];

  return {
    buses: placed,
    intrusIdx: intrusPos,
    hint: 'Couleur ET numéro… deux choses à voir !',
    level: 'E',
  };
}

function generatePuzzle(_roundNum) {
  const t = CRIT[Math.floor(Math.random() * CRIT.length)];
  if (t === 'A') return generatePuzzleA();
  if (t === 'D') return generatePuzzleD();
  if (t === 'E') return generatePuzzleE();
  if (t === 'F') return generatePuzzleF();
  if (t === 'G') return generatePuzzleG();
  return generatePuzzleC();
}

// Recolore les grosses roues (r=10) d'un bus SVG.
function colorBusWheels(btnEl, color) {
  const circles = btnEl.querySelectorAll('svg circle');
  circles.forEach(c => {
    if (c.getAttribute('r') === '10') {
      c.setAttribute('fill', color);
    }
  });
}

// ── Rendu ──────────────────────────────────────────────────────────────────

let currentPuzzle = null;

function calcBusWidth() {
  // Adapter la taille des bus selon la largeur de l'écran
  // 5 bus : 2 sur la ligne haute, 3 sur la ligne basse
  // On vise ~140-180px de large par bus selon dispo
  const w = Math.min(window.innerWidth, 700);
  const perRow3 = Math.floor((w - 4 * 12) / 3); // 3 bus + 2 gaps de 12
  return Math.min(180, Math.max(110, perRow3));
}

function renderPuzzle(puzzle) {
  currentPuzzle = puzzle;
  answered      = false;
  wrongThisRound = false;
  intrusIdx     = puzzle.intrusIdx;

  document.getElementById('hint-label').textContent = puzzle.hint;

  const busW = calcBusWidth();
  const rowTop = document.getElementById('row-top');
  const rowBot = document.getElementById('row-bot');
  rowTop.innerHTML = '';
  rowBot.innerHTML = '';

  puzzle.buses.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className    = 'bus-btn';
    btn.dataset.idx  = idx;

    if (puzzle.kind === 'emoji') {
      btn.innerHTML = `<span style="font-size:${Math.round(busW * 0.5)}px;line-height:1;">${item.emoji}</span>`;
    } else if (puzzle.kind === 'dino') {
      const size = Math.round(busW * 0.8);
      btn.innerHTML = `<img src="${item.src}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;filter:url(#${item.filter});" draggable="false">`;
    } else {
      btn.innerHTML = busSVG(item.color, item.textColor, item.num, busW)
                     + `<span class="bus-label">${getLineDisplayName(item.num)}</span>`;
      // Niveau D : seul l'intrus a des roues colorées
      if (puzzle.level === 'D' && idx === puzzle.intrusIdx) {
        colorBusWheels(btn, puzzle.wheelColor);
      }
    }

    btn.addEventListener('click', () => onBusTap(idx, btn));

    // Disposition : 0-1 en haut, 2-4 en bas
    if (idx < 2) rowTop.appendChild(btn);
    else         rowBot.appendChild(btn);
  });

  SoundPool.phrase('lequel-ne-va-pas', 'Lequel ne va pas avec les autres ?');
}

// ── Interaction ───────────────────────────────────────────────────────────

function onBusTap(idx, btn) {
  if (answered) return;

  if (idx === intrusIdx) {
    // Bonne réponse — étoile seulement si aucune erreur dans la manche
    answered = true;
    if (!wrongThisRound) score++;
    updateScore();
    btn.classList.add('flash-ok');
    if (typeof Tracker !== 'undefined') Tracker.logAnswer(!wrongThisRound);
    playSuccessBeep();
    if (window.MaxFX) {
      const lb = document.getElementById('levelbar');
      MaxFX.markPoint(btn, lb || document.getElementById('level-bar'), { style: 'bounce', result: wrongThisRound ? 'orange' : 'green' }).catch(() => {});
    }
    setTimeout(() => {
      btn.classList.add('gone');
      setTimeout(nextRound, 500);
    }, 400);

  } else {
    // Mauvaise réponse → on NE révèle PAS l'intrus, on laisse réessayer (+ indice)
    wrongThisRound = true;
    btn.classList.add('flash-err');
    playErrorSound();
    document.getElementById('hint-label').textContent = '💡 ' + (currentPuzzle ? currentPuzzle.hint : '');
    setTimeout(() => btn.classList.remove('flash-err'), 450);
  }
}

// ── Sons / TTS ─────────────────────────────────────────────────────────────

function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.18);
      osc.start(ctx.currentTime + i * 0.1);
      osc.stop(ctx.currentTime + i * 0.1 + 0.2);
    });
  } catch(e) {}
}

function speak(text) { TTS.speak(text); }

// ── Score / Rounds / Dots ──────────────────────────────────────────────────

function updateScore() {
  document.getElementById('score-badge').textContent = `${score} / ${round}`;
}

// Bandeau ★★★ dans l'en-tête, reflète Stars.get('mj-15') (dérivé de Tracker via stars.js).
// Même convention visuelle que la piste golden standard (.mp-g-stars / .off — mp-theme.css).
function updateStarsBadge() {
  const el = document.getElementById('track-stars');
  if (!el || !window.Stars) return;
  const earned = Stars.get('mj-15');
  const max = Stars.max('mj-15') || 3;
  let html = '';
  for (let i = 0; i < max; i++) html += i < earned ? '★' : '<span class="off">★</span>';
  el.innerHTML = html;
}

function updateLevelDots() {
  for (let i = 0; i < ROUNDS_PER_GAME; i++) {
    const dot = document.getElementById('dot-' + i);
    if (i < round - 1)       dot.className = 'lvl-dot done';
    else if (i === round - 1) dot.className = 'lvl-dot active';
    else                      dot.className = 'lvl-dot';
  }
  document.getElementById('level-label').textContent = `Round ${round} / ${ROUNDS_PER_GAME}`;
}

function nextRound() {
  round++;
  if (round > ROUNDS_PER_GAME) {
    showEnd();
    return;
  }
  updateScore();
  updateLevelDots();
  renderPuzzle(generatePuzzle(round));
}

function showEnd() {
  const pct   = score / ROUNDS_PER_GAME;
  const emoji = pct >= 0.8 ? '🏆' : pct >= 0.5 ? '🎉' : '🚌';
  const msg   = pct >= 0.8 ? 'Incroyable ! Tu as trouvé tous les intrus !'
              : pct >= 0.5 ? 'Bien joué ! Tu es un détective de bus !'
              :               'Continue de t’entraîner, tu vas y arriver !';

  document.getElementById('end-emoji').textContent = emoji;
  document.getElementById('end-msg').textContent   = msg;
  document.getElementById('end-score').textContent =
    `${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''} sur ${ROUNDS_PER_GAME}`;

  document.getElementById('end-screen').classList.add('visible');
  playEndSound(score, ROUNDS_PER_GAME);
  speak(msg);
  if (typeof Tracker !== 'undefined') Tracker.endSession(score, ROUNDS_PER_GAME);
  // Stars.get() lit le résultat que Tracker.endSession vient d'écrire en localStorage —
  // rafraîchir le bandeau ★ APRÈS endSession, sinon l'étoile fraîchement gagnée n'apparaît
  // pas dans l'en-tête (incident Papa Yann 2026-07-21 : son+étoile joués mais rien à l'écran).
  updateStarsBadge();
  if (window.MaxFX) {
    MaxFX.finalStar(document.getElementById('end-screen'), {
      style: score >= ROUNDS_PER_GAME ? 'cinematic' : 'breathe',
      label: msg
    }).then(updateStarsBadge).catch(() => {});
  }
}

// ── Démarrage ──────────────────────────────────────────────────────────────

function startGame() {
  score    = 0;
  round    = 1;
  answered = false;
  const lb = document.getElementById('levelbar'); if (lb) lb.textContent = 'Niveau ' + (level + 1);
  stopEndSound();
  document.getElementById('end-screen').classList.remove('visible');
  updateScore();
  updateLevelDots();
  updateStarsBadge();
  renderPuzzle(generatePuzzle(round));
}

// Exposées : onclick="" inline (startGame) + harnais de test (page.evaluate direct)
window.startGame = startGame;
window.generatePuzzleF = generatePuzzleF;
window.generatePuzzleG = generatePuzzleG;
window.OMBRES_MJ15 = OMBRES_MJ15;
window.SHADOW_TINTS = SHADOW_TINTS;
window.renderPuzzle = renderPuzzle;

startGame();
});
