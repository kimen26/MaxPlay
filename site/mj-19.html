<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-19 – Trouve le bus !</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body {
      font-family:'Nunito',sans-serif;
      height:100dvh; overflow:hidden; touch-action:manipulation;
    }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:1000px; margin:0 auto; }
    .quest {
      text-align:center; padding:12px 16px;
      color:#fff; font-size:1.2rem; font-weight:900;
      background:rgba(0,0,0,0.25);
    }
    .quest b { color:var(--gold); font-size:1.4rem; }
    .arena {
      flex:1; position:relative; overflow:hidden;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 40px, transparent 40px 80px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 40px, transparent 40px 80px);
    }
    .bus-mover {
      position:absolute; cursor:pointer;
      filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      will-change:transform;
      padding:16px; box-sizing:content-box;
    }
    .bus-mover:active { filter:drop-shadow(0 8px 16px rgba(0,0,0,0.8)); }
    /* Manche dino (ordre PY 2026-08-10, #6311) : ombre chinoise canon sur
       pastille blanche — sinon silhouette noire invisible sur l'arène sombre. */
    .bus-mover.dino-mover {
      background:#fff; border-radius:50%; padding:10px;
      display:flex; align-items:center; justify-content:center;
    }
    .bus-mover.captured {
      animation:captureBoom 0.6s ease forwards;
      pointer-events:none;
      transform-origin:center;
    }
    @keyframes captureBoom {
      0%   { transform:translate(var(--cx),var(--cy)) scale(1) rotate(0); opacity:1; }
      40%  { transform:translate(var(--cx),var(--cy)) scale(1.8) rotate(8deg); opacity:1; }
      100% { transform:translate(var(--cx),var(--cy)) scale(0.1) rotate(-20deg); opacity:0; }
    }
    .particle {
      position:absolute; pointer-events:none; z-index:10;
      font-size:1.6rem; will-change:transform,opacity;
      animation:particleFly 0.9s ease-out forwards;
    }
    @keyframes particleFly {
      0%   { transform:translate(0,0) scale(0.5); opacity:1; }
      100% { transform:translate(var(--dx),var(--dy)) scale(1.3); opacity:0; }
    }
    .bus-mover.wrong { animation:wrongShake 0.4s ease; }
    @keyframes wrongShake {
      0%,100% { transform:translateX(0); }
      25% { transform:translateX(-12px); }
      75% { transform:translateX(12px); }
    }
    .flash-ok, .flash-ko {
      position:fixed; inset:0; pointer-events:none; z-index:50;
      opacity:0; transition:opacity 0.3s;
    }
    .flash-ok { background:radial-gradient(circle, rgba(0,196,122,0.4), transparent 70%); }
    .flash-ko { background:radial-gradient(circle, rgba(226,0,26,0.4), transparent 70%); }
    .flash-ok.show, .flash-ko.show { opacity:1; }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle" id="htitle">🎯 Trouve le bus !</span>
    </div>
    <div class="pips" id="pips"></div>
    <div class="quest" id="quest"></div>
    <div class="arena" id="arena"></div>
  </div>
  <div class="flash-ok" id="flashOk"></div>
  <div class="flash-ko" id="flashKo"></div>

  <script src="js/data.js"></script>
  <script src="js/bus-svg.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script src="js/dinos-audio-manifest.js"></script>
  <script src="js/dinos-ombres.js"></script>
  <script src="js/mj-shell.js"></script>
  <script>
  MJ.ready(function () {
    document.title = 'MJ-19 – ' + MJi18n.titre('mj-19', 'Trouve le bus !');
    const htitleEl = document.getElementById('htitle');
    if (htitleEl) htitleEl.textContent = '🎯 ' + MJi18n.titre('mj-19', 'Trouve le bus !');
    const shell = MJ.init({
      id: 'mj-19', emoji: '🎯', titre: MJi18n.titre('mj-19', 'Trouve le bus !'),
      golden: true,
      consigne: false, // consigne portée par #quest (spécifique, mise à jour à chaque manche)
      regle: {
        picto: '🎯🚌',
        texte: 'Écoute la consigne et tape la bonne cible parmi toutes celles qui bougent !',
        etapes: [
          { t: 'J’écoute la cible 👂',
            d: 'Une voix dit « Trouve le bus 162 ! » ou le nom d’un dino — et c’est écrit en haut, en jaune.' },
          { t: 'Je regarde tout ce qui bouge 👀',
            d: 'Des bus… et parfois des dinos se baladent dans l’écran !' },
          { t: 'Je tape la bonne cible 👆',
            d: 'Si je me trompe, ce n’est pas grave : je réessaie, il n’y a pas de pénalité.' },
          { t: 'Plus j’ai d’étoiles, plus ça bouge 💪',
            d: 'Au début, peu de cibles lentes. Puis de plus en plus nombreuses et rapides !' }
        ]
      }
    });

    // MJ-19 V1 — Hidden in plain sight
    // N bus se déplacent, Max doit taper celui demandé.

    const G = shell.G;
    const T = (cle, fr, params) => (window.MJi18n ? MJi18n.t('mj-19', cle, fr, params) : fr);
    // 🔒 7 manches fixes (indépendant du barème questions Golden 4/6/8 — voir figée mj-19.md)
    G.totalQ = 7;
    G.buildPips();
    const ROUNDS = G.totalQ;
    const BUS_WIDTH = 80;

    // ── 3★ (2026-07-14) : 5 paliers → 3 niveaux. N0=ex-P1-2(10-12 bus, entrée douce) ·
    // N1=ex-P3(20-25 bus) · N2=ex-P4-5(50-80 bus, l'ancien max inchangé) ──
    const LEVELS = [
      { count:[10,12], speed:[14,24] },  // N0 (ex-N1/N2)
      { count:[20,25], speed:[24,44] },  // N1 (ex-N3)
      { count:[50,80], speed:[28,75] },  // N2 (ex-N4/N5, l'ancien)
    ];
    const level = Math.max(0, Math.min(LEVELS.length - 1,
      (window.Stars ? Stars.get('mj-19') : 0)));
    const CFG = LEVELS[level];

    let round = 0;
    let score = 0;
    let attempts = 1;    // essais sur la manche courante (pour la bille golden)
    let movers = [];     // { el, key, x, y, vx, vy, w, h }
    let targetKey = null;
    let rafId = null;
    let lastT = 0;
    let locked = false;

    function rand(a,b) { return a + Math.random()*(b-a); }
    function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

    // ── Cibles variées (ordre Papa Yann 2026-08-10, annotation #6311) ──────
    // « Pkoi que des bus, mettre des dino aussi » : la partie mélange manches
    // BUS (numéro annoncé, contrat 🔒 inchangé) et manches DINO (nom annoncé,
    // ombre chinoise canon sur pastille blanche). Distracteurs dino de
    // familles DIFFERENTES en priorité (éviter les leurres trop ressemblants).
    // La 1re manche est TOUJOURS un bus (entrée douce + stabilité du harnais).
    const OMBRES = (window.DinoOmbres && typeof DINOS !== 'undefined') ? DinoOmbres.pool() : [];
    const DINO_ROUNDS_N = [2, 3, 3][level];         // manches dino par partie
    const DINO_COUNT = [[6,8],[10,14],[14,18]][level]; // movers par manche dino
    const dinoRounds = new Set((function(){
      if (!OMBRES.length) return [];
      const idx = [1,2,3,4,5,6]; // jamais la manche 0
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [idx[i], idx[j]] = [idx[j], idx[i]];
      }
      return idx.slice(0, DINO_ROUNDS_N);
    })());

    // Annonce dino : TTS dit l'amorce (« Trouve le… ») puis le MP3 réel dit le
    // nom (même règle de voix que mj-24 ; repli TTS phrase complète si le MP3
    // manque). Chaîne factorisée DinoOmbres.annoncer (anti-course + filet).
    function sayDino(d){
      DinoOmbres.annoncer(d.id, T('trouveLeDino', 'Trouve le {n} !', { n: d.name }), {
        amorce: T('trouveLeAmorce', 'Trouve le…'), filet: 2200,
      });
    }

    function startRound() {
      locked = false;
      attempts = 1;
      const arena = document.getElementById('arena');
      arena.innerHTML = '';
      movers = [];

      let defs; // { key, html, dino } par mover
      if (dinoRounds.has(round)) {
        // ── Manche DINO : cible unique + distracteurs de familles différentes
        const count = Math.floor(rand(DINO_COUNT[0], DINO_COUNT[1] + 1));
        const target = DinoOmbres.pick(OMBRES);
        const others = DinoOmbres.pickCousins(OMBRES, target, count, { minCousins: 0 });
        targetKey = 'd:' + target.id;
        document.getElementById('quest').innerHTML = T('questDino', 'Trouve le <b>{n}</b> !', { n: target.name });
        sayDino(target);
        defs = DinoOmbres.shuffle([target, ...others]).map(d => ({
          key: 'd:' + d.id, dino: true,
          html: '<img src="' + d.src + '" alt="" style="width:64px;height:64px;object-fit:contain;pointer-events:none;">'
        }));
      } else {
        // ── Manche BUS : pool à doublons autorisés (LIGNES ~26 mais on veut 50-80 bus)
        const busCount = Math.floor(rand(CFG.count[0], CFG.count[1] + 1));
        const pool = [];
        while (pool.length < busCount) {
          const shuffled = LIGNES.slice().sort(() => Math.random() - 0.5);
          for (const l of shuffled) {
            if (pool.length >= busCount) break;
            pool.push(l);
          }
        }
        // Cible parmi les bus présents (doublons = tous gagnants, comme avant)
        const target = pick(pool);
        targetKey = 'b:' + target.num;
        document.getElementById('quest').innerHTML = T('questBus', 'Trouve le bus <b>{n}</b> !', { n: target.num });
        // TTS partagé (cancel-then-speak, respell lexique FR) — garde try/catch WebKit/iOS
        try {
          if (window.TTS && TTS.speak) TTS.speak(T('trouveLeBusN', 'Trouve le bus {n}', { n: target.num }), { rate: 0.95 });
        } catch(e) {}
        defs = pool.map(line => ({
          key: 'b:' + line.num, dino: false,
          html: busSVG(line.color, line.textColor, line.num, BUS_WIDTH)
        }));
      }
      spawnMovers(defs);
    }

    function spawnMovers(defs) {
      const arena = document.getElementById('arena');
      const aRect = arena.getBoundingClientRect();
      const W = aRect.width, H = aRect.height;

      defs.forEach(def => {
        const el = document.createElement('div');
        el.className = 'bus-mover' + (def.dino ? ' dino-mover' : '');
        el.style.width = (def.dino ? 84 : BUS_WIDTH) + 'px';
        el.innerHTML = def.html;
        if (def.key === targetKey) el.dataset.correct = '1'; // repère harnais
        arena.appendChild(el);
        const bw = el.offsetWidth  || (BUS_WIDTH + 32);
        const bh = el.offsetHeight || 78;
        const x = rand(10, Math.max(10, W - bw - 10));
        const y = rand(10, Math.max(10, H - bh - 10));
        // 60% de movers quasi-horizontaux (gauche↔droite), 40% libres
        const sp = rand(CFG.speed[0], CFG.speed[1]);
        let vx, vy;
        if (Math.random() < 0.6) {
          vx = (Math.random() < 0.5 ? -1 : 1) * sp;
          vy = rand(-sp*0.15, sp*0.15);
        } else {
          const ang = rand(0, Math.PI*2);
          vx = Math.cos(ang)*sp;
          vy = Math.sin(ang)*sp;
        }
        const mv = { el, key: def.key, x, y, vx, vy, w: bw, h: bh };
        el.style.transform = `translate(${x}px,${y}px)`;
        el.addEventListener('click', () => onTap(mv));
        movers.push(mv);
      });

      lastT = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      loop();
    }

    function loop(t) {
      t = t || performance.now();
      const dt = Math.min(0.05, (t - lastT) / 1000);
      lastT = t;
      const arena = document.getElementById('arena');
      const W = arena.clientWidth, H = arena.clientHeight;

      movers.forEach(m => {
        if (m.el.classList.contains('captured')) return;
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        if (m.x < 0) { m.x = 0; m.vx = Math.abs(m.vx); }
        if (m.x > W - m.w) { m.x = W - m.w; m.vx = -Math.abs(m.vx); }
        if (m.y < 0) { m.y = 0; m.vy = Math.abs(m.vy); }
        if (m.y > H - m.h) { m.y = H - m.h; m.vy = -Math.abs(m.vy); }
        m.el.style.transform = `translate(${m.x}px,${m.y}px)`;
      });
      rafId = requestAnimationFrame(loop);
    }

    function flash(ok) {
      const el = document.getElementById(ok ? 'flashOk' : 'flashKo');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 300);
    }

    function explodeAt(mv) {
      const arena = document.getElementById('arena');
      const cx = mv.x + mv.w/2;
      const cy = mv.y + mv.h/2;
      const emojis = ['✨','⭐','💫','🎉','🌟'];
      for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[i % emojis.length];
        p.style.left = cx + 'px';
        p.style.top  = cy + 'px';
        const ang = (i / 14) * Math.PI * 2;
        const dist = 80 + Math.random() * 60;
        p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
        arena.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    function onTap(mv) {
      if (locked) return;
      if (mv.key === targetKey) {
        locked = true;
        // Fige la position via CSS vars pour que l'animation la conserve
        mv.el.style.setProperty('--cx', mv.x + 'px');
        mv.el.style.setProperty('--cy', mv.y + 'px');
        explodeAt(mv);
        mv.el.classList.add('captured');
        flash(true);
        try { sndDing && sndDing(); } catch(e) {}
        try { confettiBurst(25); } catch(e) {}
        G.notePip(round, attempts, mv.el);
        if (typeof Tracker !== 'undefined') Tracker.logAnswer(true);
        score++;
        round++;
        setTimeout(() => {
          if (round >= ROUNDS) endGame();
          else startRound();
        }, 800);
      } else {
        mv.el.classList.add('wrong');
        flash(false);
        try { sndBuzz && sndBuzz(); } catch(e) {}
        attempts = Math.min(4, attempts + 1);
        if (typeof Tracker !== 'undefined') Tracker.logAnswer(false);
        setTimeout(() => mv.el.classList.remove('wrong'), 450);
      }
    }

    function endGame() {
      if (rafId) cancelAnimationFrame(rafId);
      G.showEnd({ replayUrl: 'mj-19.html' });
    }

    // DOM déjà prêt (MJ.ready)
    if (typeof Tracker !== 'undefined') Tracker.startSession('mj-19');
    startRound();
  }); // fin MJ.ready
  </script>
</body>
</html>
