<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-21 — Peins les bus !</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body { font-family:'Nunito',sans-serif; height:100dvh; overflow:hidden; touch-action:none; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:480px; margin:0 auto; }

    /* Pots de couleur */
    .pots-zone { display:flex; justify-content:center; gap:8px; padding:6px 12px 4px; flex-shrink:0; }
    .pot { width:72px; height:72px; border-radius:18px; border:none; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:900; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 6px 20px rgba(0,0,0,0.5); transition:transform 0.1s, box-shadow 0.1s; }
    .pot:active { transform:scale(0.88) translateY(3px); box-shadow:0 3px 8px rgba(0,0,0,0.4); }
    .pot-rouge { background:radial-gradient(circle at 35% 30%, #FF5555, #CC0000); color:#fff; }
    .pot-jaune { background:radial-gradient(circle at 35% 30%, #FFE855, #CCAA00); color:#333; }
    .pot-bleu  { background:radial-gradient(circle at 35% 30%, #5577FF, #0033CC); color:#fff; }
    .pot-blanc { background:radial-gradient(circle at 35% 30%, #FFFFFF, #CCCCCC); color:#333; border:2px solid rgba(0,0,0,0.12); }
    .pot-emoji { font-size:1.5rem; line-height:1; }
    .pot-lbl   { font-size:0.65rem; letter-spacing:0.5px; }

    /* Tube à gauche (nom couleur créée dessous), boutons centrés à droite */
    .tube-zone { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:26px; flex:1; }
    .tube-col { display:flex; flex-direction:column; align-items:center; gap:8px; }
    .tube-wrap { position:relative; border-radius:10px; }
    @keyframes tubeShake {
      0%,100%{transform:rotate(0) scale(1);}
      15%{transform:rotate(-13deg) scale(1.04);}
      35%{transform:rotate(13deg) scale(1.04);}
      55%{transform:rotate(-9deg) scale(1.02);}
      75%{transform:rotate(9deg) scale(1.02);}
    }
    .tube-wrap.shaking { animation:tubeShake 0.55s ease; }
    .tube-result { color:#ffe066; font-size:0.95rem; font-weight:900; min-height:1.3em; text-align:center; }
    .tube-actions { display:flex; flex-direction:column; align-items:center; gap:14px; }
    .btn-tube { border-radius:16px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1rem; padding:18px 22px; min-width:120px; cursor:pointer; color:#fff; }
    .btn-tube:active { opacity:0.72; transform:scale(0.91); }
    .btn-vider { background:rgba(255,255,255,0.09); border:2px solid rgba(255,255,255,0.22); }
    .btn-mixer { background:rgba(80,220,255,0.2); border:2px solid rgba(80,220,255,0.5); }

    /* Bus cible EN BAS + pastille couleur à trouver à côté (même hauteur) */
    .bus-bas { display:flex; justify-content:center; align-items:center; gap:18px; padding:6px 0 10px; flex-shrink:0; }
    .bus-bas-wrap { position:relative; display:inline-flex; }
    .cible-col { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .cible-swatch { width:78px; height:78px; border-radius:50%; border:3px solid rgba(255,255,255,0.85); box-shadow:0 3px 10px rgba(0,0,0,0.45); }
    .cible-name { font-size:1.05rem; font-weight:900; text-align:center; color:#fff; }

    /* Animation victoire : tube se renverse sur le bus */
    .victoire-scene { position:fixed; inset:0; pointer-events:none; z-index:50; }
    .vtube {
      position:absolute;
      top:30%; left:50%; transform:translateX(-50%) rotate(0deg);
      transform-origin:50% 0%;
      transition:transform 0.6s cubic-bezier(.4,0,.2,1);
    }
    .vtube.renverse { transform:translateX(-50%) rotate(65deg); }
    .vdrop {
      position:absolute;
      width:18px; height:24px;
      border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
      pointer-events:none; opacity:0;
    }
    /* Hint */
    .hint-row { display:flex; justify-content:center; padding:4px 0 6px; flex-shrink:0; }
    .btn-hint { background:rgba(255,220,80,0.15); border:2px solid rgba(255,220,80,0.5); color:#ffe066; border-radius:20px; font-family:'Nunito',sans-serif; font-weight:900; font-size:0.8rem; padding:5px 16px; cursor:pointer; animation:hintPulse 1.5s ease-in-out infinite alternate; }
    @keyframes hintPulse { from{box-shadow:0 0 0px rgba(255,220,80,0.3);} to{box-shadow:0 0 10px rgba(255,220,80,0.7);} }

    /* Overlays */
    .brun-overlay { position:fixed; inset:0; background:rgba(60,30,0,0.93); display:flex; align-items:center; justify-content:center; z-index:99; opacity:0; visibility:hidden; transition:all 0.3s; }
    .brun-overlay.show { opacity:1; visibility:visible; }
    .brun-content { text-align:center; padding:20px; }
    .brun-emoji { font-size:4.5rem; display:block; animation:wobble 0.55s infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-12deg) scale(1);} 50%{transform:rotate(12deg) scale(1.08);} }
    .brun-text { color:#fff; font-size:1.3rem; font-weight:900; margin-top:10px; line-height:1.5; }
    .btn-laver { background:rgba(255,255,255,0.2); color:#fff; border:2px solid rgba(255,255,255,0.4); border-radius:22px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1rem; padding:10px 28px; cursor:pointer; margin-top:16px; display:inline-block; }
    .btn-laver:active { background:rgba(255,255,255,0.35); }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; visibility:hidden; transition:all 0.4s; }
    .overlay.show { opacity:1; visibility:visible; }
    .ov-box { background:linear-gradient(135deg,#1a1a2e,#16213e); border-radius:24px; border:2px solid rgba(255,255,255,0.1); padding:28px 24px; text-align:center; max-width:320px; width:90%; }
    .ov-emoji { font-size:3rem; margin-bottom:8px; }
    .ov-title { font-size:1.6rem; color:#ffe066; font-weight:900; margin-bottom:8px; }
    .ov-text  { color:#fff; font-size:1rem; margin-bottom:20px; line-height:1.4; }
    .ov-btn   { background:linear-gradient(135deg,#00c47a,#00a86b); color:#fff; border:none; border-radius:20px; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.1rem; padding:12px 28px; cursor:pointer; }
    .ov-btn:active { opacity:0.8; }
  </style>
</head>
<body>
<div id="app">

  <!-- .hdr et #pips (piste + étoiles) sont créés par le gabarit MJ.init (golden:true) -->

  <!-- Pots de couleur -->
  <div class="pots-zone">
    <button class="pot pot-rouge" onclick="addCouleur('r')"><span class="pot-emoji">&#128308;</span><span class="pot-lbl">ROUGE</span></button>
    <button class="pot pot-jaune" onclick="addCouleur('j')"><span class="pot-emoji">&#128993;</span><span class="pot-lbl">JAUNE</span></button>
    <button class="pot pot-bleu"  onclick="addCouleur('b')"><span class="pot-emoji">&#128309;</span><span class="pot-lbl">BLEU</span></button>
    <button class="pot pot-blanc" onclick="addCouleur('w')"><span class="pot-emoji">&#11036;</span><span class="pot-lbl">BLANC</span></button>
  </div>

  <!-- Tube à gauche (nom couleur créée dessous), boutons centrés à droite -->
  <div class="tube-zone">
    <div class="tube-col">
      <div class="tube-wrap" id="tube-wrap"></div>
      <div class="tube-result" id="tube-result"></div>
    </div>
    <div class="tube-actions">
      <button class="btn-tube btn-vider" onclick="viderTube()">&#128703; Vider</button>
      <button class="btn-tube btn-mixer" id="btn-mixer" onclick="mixerTube()">&#128256; Mixer !</button>
    </div>
  </div>

  <!-- Bus cible EN BAS + couleur à trouver à côté -->
  <div class="bus-bas">
    <div class="bus-bas-wrap" id="bus-bas-wrap"></div>
    <div class="cible-col">
      <div class="cible-swatch" id="cible-swatch"></div>
      <div class="cible-name" id="cible-name"></div>
    </div>
  </div>

  <div class="hint-row">
    <button class="btn-hint" onclick="showHint()">&#128161; Indice</button>
  </div>

</div>

<!-- Scène animation victoire -->
<div class="victoire-scene" id="victoire-scene" style="display:none;"></div>

<div class="brun-overlay" id="brun-overlay">
  <div class="brun-content">
    <span class="brun-emoji">&#128169;</span>
    <div class="brun-text">Prrrout !<br>C’est du marron !<br>Lave le tube !</div>
    <button class="btn-laver" onclick="viderTube()">&#128703; Laver !</button>
  </div>
</div>

<div class="overlay" id="hint-overlay" style="z-index:102;">
  <div class="ov-box">
    <div class="ov-emoji">&#128161;</div>
    <div class="ov-title" style="font-size:1.2rem;">Voil&#224; le secret !</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;">
      <div id="hint-cercle" style="width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,0.85);flex-shrink:0;"></div>
      <div style="color:#fff;font-size:1rem;font-weight:900;" id="hint-label"></div>
    </div>
    <div class="ov-text" id="hint-text" style="font-size:1.3rem;letter-spacing:2px;"></div>
    <button class="ov-btn" onclick="document.getElementById('hint-overlay').classList.remove('show')">OK !</button>
  </div>
</div>

<script src="js/bus-svg.js"></script>
<script src="js/data.js"></script>
<script src="js/mj-kit.js"></script>
<script src="js/mj-shell.js"></script>
<script>
MJ.ready(function () {
  const shell = MJ.init({
    id: 'mj-21', emoji: '🎨', titre: 'Peins les bus !',
    golden: true,
    consigne: false,
    regle: {
      picto: '🎨🚌',
      texte: 'Mélange les couleurs pour peindre le bon bus !',
      etapes: [
        { t: 'Je regarde la couleur à trouver 👀',
          d: 'À côté du bus tout blanc, il y a un rond de couleur : c’est la couleur que je dois fabriquer !' },
        { t: 'Je verse les pots dans le tube 🧪',
          d: 'Rouge, Jaune, Bleu, Blanc : je tape sur les pots pour les verser dans le tube. Une seule couleur ? C’est gagné tout de suite !' },
        { t: 'Je tape Mixer pour mélanger 🔄',
          d: 'Si j’ai versé plusieurs couleurs, je tape « Mixer ! » pour les mélanger. Si ça devient marron, pas grave, je lave le tube et je recommence !' },
        { t: 'Le tube verse la couleur sur le bus 🚌',
          d: 'Si c’est la bonne couleur, le tube se renverse et peint le bus ! Un indice 💡 m’aide si je cherche.' }
      ]
    }
  });
// ── DÉFIS ─────────────────────────────────────────────────────────
const DEFIS = [
  { r:1, j:0, b:0, w:0, hex:'#E2231A', label:'rouge',      num:'RER A', textColor:'#fff'  },
  { r:0, j:1, b:0, w:0, hex:'#FFCD00', label:'jaune',      num:'M1',    textColor:'#333'  },
  { r:0, j:0, b:1, w:0, hex:'#0064B1', label:'bleu',       num:'162',   textColor:'#fff'  },
  { r:0, j:1, b:1, w:0, hex:'#008C59', label:'vert',       num:'172',   textColor:'#fff'  },
  { r:1, j:0, b:1, w:0, hex:'#652C90', label:'violet',     num:'132',   textColor:'#fff'  },
  { r:1, j:0, b:0, w:1, hex:'#FF82B4', label:'rose',       num:'47',    textColor:'#333'  },
  { r:0, j:1, b:1, w:1, hex:'#75CE89', label:'vert clair', num:'380',   textColor:'#333'  },
  { r:0, j:0, b:3, w:1, hex:'#4FA3DC', label:'bleu ciel',  num:'RER B', textColor:'#fff'  },
  { r:1, j:1, b:0, w:0, hex:'#F58443', label:'orange',     num:'185',   textColor:'#333'  },
  { r:1, j:3, b:0, w:0, hex:'#DCAC27', label:'or',         num:'184',   textColor:'#333'  },
  { r:1, j:0, b:0, w:2, hex:'#FA9ABA', label:'rose pâle',  num:'M7',    textColor:'#333'  },
  { r:1, j:0, b:1, w:2, hex:'#C9A2CD', label:'lavande',    num:'286',   textColor:'#333'  },
  { r:2, j:2, b:1, w:0, hex:'#8D653A', label:'brun',       num:'131',   textColor:'#fff'  },
];

// Couleurs primaires = défi à 1 seule couleur, pas besoin de Mixer
const PRIMAIRES = new Set(DEFIS.filter(d => (d.r>0)+(d.j>0)+(d.b>0)+(d.w>0) === 1).map(d=>DEFIS.indexOf(d)));

const QCOL = { r:'#E8192C', j:'#FFD700', b:'#3344CC', w:'#EEEEEE' };

const shuffle = MJKit.shuffle;

function findBestDefi(t) {
  const tot=t.r+t.j+t.b+t.w;
  if(tot===0) return null;
  let best=null, bestDist=Infinity;
  for(const d of DEFIS){
    const dTot=d.r+d.j+d.b+d.w;
    let dist=0;
    for(const k of ['r','j','b','w']) dist+=Math.abs(t[k]/tot - d[k]/dTot);
    if(dist<bestDist){bestDist=dist;best=d;}
  }
  return {defi:best,dist:bestDist};
}

function isBrun(t){
  const tot=t.r+t.j+t.b+t.w; if(tot===0)return false;
  return t.r/tot>0.18 && t.j/tot>0.15 && t.b/tot>0.15;
}

// ── ÉTAT ──────────────────────────────────────────────────────────
const TUBE_CAP = 4; // 🔒 capacité max du tube — au-delà, on bloque l'ajout (jamais silencieux)
function newTube(){return{r:0,j:0,b:0,w:0,doses:[],mixed:null};}
let tube=newTube(), defiIdx=0, solved=0, victoire=false, brunShown=false;
const G = shell.G;
const NB_DEFIS = Math.min(G ? G.totalQ : 4, DEFIS.length);
let order=shuffle(DEFIS.map((_,i)=>i)).slice(0, NB_DEFIS);
let defi=DEFIS[order[0]];

// ── RENDU TUBE SVG ────────────────────────────────────────────────
let _tcN=0;
function renderTubeSVG(t,opts){
  const cid='tc'+(++_tcN);  // id clipPath UNIQUE (sinon collision vrai tube ↔ clone victoire)
  const SW=64,SH=150,RIMH=14,BOT=SH,RX=12,FILL_H=BOT-RIMH;
  const path=`M0,${RIMH} L0,${BOT-RX} Q0,${BOT} ${RX},${BOT} L${SW-RX},${BOT} Q${SW},${BOT} ${SW},${BOT-RX} L${SW},${RIMH} Z`;
  let layers='';
  if(opts&&opts.forceFill){
    const frac=opts.frac==null?1:Math.max(0,Math.min(opts.frac,1));
    const fH=frac*FILL_H;
    if(fH>0)layers=`<rect x="0" y="${(BOT-fH).toFixed(1)}" width="${SW}" height="${(fH+1).toFixed(1)}" fill="${opts.forceFill}"/>`;
  } else if(t.mixed){
    // Une fois mixé c'est un liquide homogène — MAIS le niveau reflète le VRAI nombre de
    // doses versées (conservation du volume : 1+1 = 2 doses de vert, jamais un "3" par défaut).
    const bg=t.mixed==='BRUN'?'#6B4226':t.mixed.hex;
    const frac=Math.max(0.25,Math.min(t.doses.length/TUBE_CAP,1));
    const fH=FILL_H*frac;
    layers=`<rect x="0" y="${(BOT-fH).toFixed(1)}" width="${SW}" height="${(fH+1).toFixed(1)}" fill="${bg}"/>`;
  } else if(t.doses.length>0){
    const vis=t.doses.slice(-8);
    const dH=FILL_H/Math.max(vis.length,4);
    vis.forEach((q,i)=>{
      layers+=`<rect x="0" y="${(BOT-dH*(i+1)).toFixed(1)}" width="${SW}" height="${(dH+1).toFixed(1)}" fill="${QCOL[q]}"/>`;
    });
  }
  const hint=(!opts||!opts.forceFill)&&t.doses.length===0&&!t.mixed
    ?`<text x="${SW/2}" y="${RIMH+FILL_H/2+5}" text-anchor="middle" fill="rgba(255,255,255,0.18)" font-size="10" font-family="Nunito">vide</text>`:'';
  return `<svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">
  <defs><clipPath id="${cid}"><path d="${path}"/></clipPath></defs>
  <path d="${path}" fill="rgba(150,210,255,0.08)" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
  <g clip-path="url(#${cid})">${layers}</g>
  <rect x="5" y="${RIMH+5}" width="6" height="${FILL_H-20}" rx="3" fill="rgba(255,255,255,0.16)" clip-path="url(#${cid})"/>
  <rect x="2" y="0" width="${SW-4}" height="${RIMH}" rx="5" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  ${hint}</svg>`;
}

function renderTube(){
  document.getElementById('tube-wrap').innerHTML=renderTubeSVG(tube);
  const res=document.getElementById('tube-result');
  if(tube.mixed&&tube.mixed!=='BRUN'){res.textContent=tube.mixed.label;res.style.color='#ffe066';}
  else if(tube.mixed==='BRUN'){res.innerHTML='💩 marron';res.style.color='#cc8844';}
  else if(tube.doses.length>0){
    // Conservation du volume : on affiche le nombre de doses versées (jamais de "3" par défaut).
    const tot=tube.doses.length;
    res.textContent=`${tot} dose${tot>1?'s':''}`;
    res.style.color=tot>=TUBE_CAP?'#ff9a5a':'rgba(255,255,255,0.6)';
  }
  else{res.textContent='';}
}

function renderBusBas(hex){
  // Bus cible EN BAS (blanc par défaut, coloré à la victoire)
  const col=hex||'#FFFFFF';
  const txt=hex?defi.textColor:'#333';
  document.getElementById('bus-bas-wrap').innerHTML=busSVG(col,txt,defi.num,170);
  // Pastille de la couleur à trouver, à côté du bus, même hauteur
  document.getElementById('cible-swatch').style.background=defi.hex;
  const nm=document.getElementById('cible-name');
  nm.textContent=hex?`✓ ${defi.label} !`:defi.label;
  nm.style.color=hex?'#00c47a':'#fff';
}

// ── ACTIONS ───────────────────────────────────────────────────────
function addCouleur(type){
  if(victoire)return;
  // Dépassement capacité : bloquer explicitement, jamais d'état silencieux incohérent.
  if(tube.doses.length>=TUBE_CAP){
    showTubePlein();
    return;
  }
  // Ajouter une couleur après un mix : on GARDE le contenu (r/j/b/w + doses),
  // on repasse juste en "à re-mixer" — on ne vide JAMAIS le travail de Max.
  if(tube.mixed){tube.mixed=null;}
  tube[type]++;
  tube.doses.push(type);
  renderTube();
  // Couleur primaire seule → victoire immédiate sans Mixer
  checkPrimaire();
}

// Tube plein (4 doses) : on bloque l'ajout, feedback doux et clair (jamais de son négatif fort).
function showTubePlein(){
  const wrap=document.getElementById('tube-wrap');
  wrap.classList.remove('shaking'); wrap.offsetWidth; wrap.classList.add('shaking');
  const res=document.getElementById('tube-result');
  res.textContent='Plein ! Vide-moi 🧽';
  res.style.color='#ff9a5a';
}

function checkPrimaire(){
  const tot=tube.r+tube.j+tube.b+tube.w;
  // Primaire = 1 seule couleur utilisée
  const nbTypes=['r','j','b','w'].filter(k=>tube[k]>0).length;
  if(nbTypes!==1) return;
  const {defi:matched,dist}=findBestDefi(tube);
  if(matched===defi&&dist<0.1&&!victoire){
    tube.mixed={hex:matched.hex,label:matched.label};
    renderTube();
    victoire=true;
    setTimeout(showVictoire,300);
  }
}

let mixerLocked=false, mixerUsedThisDefi=false;
function mixerTube(){
  if(victoire||mixerLocked)return;
  const tot=tube.r+tube.j+tube.b+tube.w;
  if(tot===0)return;
  mixerLocked=true;
  mixerUsedThisDefi=true;
  playMix();
  const wrap=document.getElementById('tube-wrap');
  wrap.classList.remove('shaking');
  wrap.offsetWidth;
  wrap.classList.add('shaking');
  setTimeout(()=>{
    mixerLocked=false;
    wrap.classList.remove('shaking');
    if(isBrun(tube)&&defi.label!=='brun'){
      tube.mixed='BRUN';
      renderTube();
      if(!brunShown){brunShown=true;document.getElementById('brun-overlay').classList.add('show');playBrun();}
      return;
    }
    const {defi:matched,dist}=findBestDefi(tube);
    tube.mixed={hex:matched.hex,label:matched.label};
    renderTube();
    if(matched===defi&&dist<0.55&&!victoire){
      victoire=true;
      setTimeout(showVictoire,400);
    }
  },500);
}

function viderTube(){
  tube=newTube(); brunShown=false;
  document.getElementById('brun-overlay').classList.remove('show');
  renderTube();
}

// ── VICTOIRE : animation tube renversé sur le bus ─────────────────
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function showVictoire(){
  // Piste golden standard (#pips) : note ce défi comme réussi (1er coup = étoile).
  const tubeElFx=document.getElementById('tube-wrap');
  if(G) G.notePip(defiIdx, mixerUsedThisDefi?2:1, tubeElFx);
  solved++;
  playKlaxon();

  // Récupère position du tube et du bus cible
  const tubeEl=document.getElementById('tube-wrap');
  const busEl=document.getElementById('bus-bas-wrap');
  const tubeRect=tubeEl.getBoundingClientRect();
  const busRect=busEl.getBoundingClientRect();

  // Masque le vrai tube pendant l'anim (sinon doublon fantôme à l'écran)
  tubeEl.style.visibility='hidden';

  // Crée la scène d'animation
  const scene=document.getElementById('victoire-scene');
  scene.style.display='block';
  scene.innerHTML='';

  // Couleur finale (mixée ou primaire) — calculée avant le clone
  const clr=tube.mixed&&tube.mixed!=='BRUN'?tube.mixed.hex:defi.hex;

  // Clone SVG du tube, BIEN REMPLI de la bonne couleur (reste plein jusqu'à la goutte)
  const vt=document.createElement('div');
  vt.className='vtube';
  vt.style.top=tubeRect.top+'px';
  vt.style.left=(tubeRect.left+tubeRect.width/2)+'px';
  vt.innerHTML=renderTubeSVG(tube,{forceFill:clr,frac:0.72});
  scene.appendChild(vt);

  await sleep(80);
  // Renverse le tube (rotation 65°) — toujours plein de couleur
  vt.classList.add('renverse');
  await sleep(550);

  // Goutte de couleur qui tombe — c'est MAINTENANT que le tube se vide
  vt.innerHTML=renderTubeSVG(tube,{forceFill:clr,frac:0});
  const drop=document.createElement('div');
  drop.className='vdrop';
  drop.style.background=clr;
  // Position : bout du tube renversé (approximation)
  const cx=tubeRect.left+tubeRect.width/2;
  const cy=tubeRect.top+tubeRect.height*0.7;
  drop.style.left=cx+'px';
  drop.style.top=cy+'px';
  drop.style.position='absolute';
  drop.style.opacity='1';
  drop.style.boxShadow=`0 2px 8px ${clr}88`;
  drop.style.transition='top 0.5s ease-in, opacity 0.15s 0.45s';
  scene.appendChild(drop);
  await sleep(20);
  drop.style.top=(busRect.top+20)+'px';
  await sleep(500);
  drop.style.opacity='0';

  // Colorie le bus en bas
  renderBusBas(clr);
  await sleep(250);

  // 🎉 Le bus part en avant avec le bruit
  if (window.MaxFX) MaxFX.randomPoint(busEl, document.getElementById('pips'), { result: 'green' });
  playVroom();
  busEl.style.transition='transform 0.85s cubic-bezier(.45,.05,.55,1)';
  busEl.style.transform='translateX(125vw)';
  await sleep(1100);

  // Nettoie la scène
  scene.style.display='none';
  scene.innerHTML='';

  // Auto-next
  await sleep(800);
  defiIdx++;
  if(defiIdx>=NB_DEFIS){ showEnd(); return; }
  defi=DEFIS[order[defiIdx]];
  tube=newTube(); victoire=false; brunShown=false; mixerLocked=false; mixerUsedThisDefi=false;
  document.getElementById('brun-overlay').classList.remove('show');
  document.getElementById('tube-wrap').style.visibility='visible';
  // Remet le bus à sa place sans rejouer l'anim de glisse
  busEl.style.transition='none';
  busEl.style.transform='';
  renderTube();
  renderBusBas(null);
}

function showEnd(){
  if(G) G.showEnd({ replayUrl: 'mj-21.html' });
}

function showHint(){
  const parts=[];
  if(defi.r>0)parts.push(`${defi.r} 🔴`);
  if(defi.j>0)parts.push(`${defi.j} 🟡`);
  if(defi.b>0)parts.push(`${defi.b} 🔵`);
  if(defi.w>0)parts.push(`${defi.w} ⬜`);
  document.getElementById('hint-cercle').style.background=defi.hex;
  document.getElementById('hint-label').textContent=`Bus ${defi.num} — ${defi.label}`;
  document.getElementById('hint-text').textContent=parts.join(' + ');
  document.getElementById('hint-overlay').classList.add('show');
}

// ── SHAKE ─────────────────────────────────────────────────────────
let lastShake=0;
if(window.DeviceMotionEvent){
  window.addEventListener('devicemotion',e=>{
    const a=e.acceleration;if(!a)return;
    const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
    if(m>25&&Date.now()-lastShake>800){lastShake=Date.now();mixerTube();}
  },true);
}

// ── SONS ──────────────────────────────────────────────────────────
function playKlaxon(){try{const ac=new AudioContext();[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f;o.type='triangle';const t=ac.currentTime+i*0.1;g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.start(t);o.stop(t+0.15);});}catch(e){}}
function playBrun(){try{const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.setValueAtTime(180,ac.currentTime);o.frequency.exponentialRampToValueAtTime(35,ac.currentTime+0.55);g.gain.setValueAtTime(0.4,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);o.start();o.stop(ac.currentTime+0.6);}catch(e){}}
function playMix(){try{const ac=new AudioContext();[400,600,350,700,300].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;const t=ac.currentTime+i*0.06;g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.start(t);o.stop(t+0.1);});}catch(e){}}
function playVroom(){try{const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';const t=ac.currentTime;o.frequency.setValueAtTime(80,t);o.frequency.linearRampToValueAtTime(190,t+0.3);o.frequency.linearRampToValueAtTime(70,t+0.95);g.gain.setValueAtTime(0.0,t);g.gain.linearRampToValueAtTime(0.32,t+0.12);g.gain.exponentialRampToValueAtTime(0.001,t+0.95);o.start(t);o.stop(t+0.97);}catch(e){}}

// ── INIT ──────────────────────────────────────────────────────────
if(G) G.buildPips();
renderTube();
renderBusBas(null);

// Exposées sur window : appelées par les onclick= inline du HTML
window.addCouleur = addCouleur;
window.viderTube = viderTube;
window.mixerTube = mixerTube;
window.showHint = showHint;
});
</script>
