<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-22 — Trouve le pays !</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation; }
    body { font-family:system-ui,sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    .consigne-zone { display:flex; align-items:center; justify-content:center; gap:10px; padding:8px 12px; flex-shrink:0; background:rgba(0,0,0,0.2); min-height:56px; }
    #drapeau-cible { font-size:4.5rem; line-height:1; }
    #consigne { font-size:1.1rem; font-weight:700; }

    .map-zone { flex:1; min-height:0; display:flex; padding:8px; background:#1e3a5f; }
    #mapSvg { width:100%; height:100%; }

    .country { cursor:pointer; fill:#4a7fd4; stroke:#0a1520; stroke-width:0.5; transition:all 150ms; }
    .country:hover { filter:brightness(1.15); }
    .country.highlight { fill:#ff9500 !important; stroke:#ffb700; stroke-width:1; filter:drop-shadow(0 0 8px rgba(255,149,0,0.9)); animation:pulse 0.7s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{filter:drop-shadow(0 0 8px rgba(255,149,0,0.9))} 50%{filter:drop-shadow(0 0 14px rgba(255,183,0,1))} }
    .country.found { fill:#22c55e !important; stroke:#15803d; stroke-width:0.5; pointer-events:none; }
    .country.inactive { fill:#243040; stroke:#18222c; stroke-width:0.4; pointer-events:none; opacity:0.55; }

    .ctrl-zone { padding:6px 12px; flex-shrink:0; display:flex; justify-content:center; min-height:52px; align-items:center; }
    #confirmBtn { display:none; padding:10px 36px; font-size:1rem; font-weight:900; background:#22c55e; color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit; box-shadow:0 4px 0 #15803d; }
    #confirmBtn.show { display:block; }
    #confirmBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #15803d; }

    .lvl-bar { display:flex; justify-content:space-between; align-items:center; padding:5px 12px; background:rgba(0,0,0,0.3); flex-shrink:0; }
    .dots-container { display:flex; gap:5px; flex-wrap:wrap; }
    .progress-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.25); transition:background 300ms; }
    .progress-dot.done { background:#4CAF50; }
    .lvl-label { font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.6); }

    .victoire-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:99; animation:fadeIn 200ms; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .victoire-card { background:#fff; border-radius:20px; padding:28px 36px; text-align:center; animation:popIn 350ms cubic-bezier(0.34,1.56,0.64,1); max-width:90vw; }
    @keyframes popIn { from{transform:scale(0.2);opacity:0} to{transform:scale(1);opacity:1} }
    .drapeau-victoire { font-size:8.75rem; line-height:1.1; }
    .victoire-nom { font-size:1.6rem; font-weight:900; color:#333; margin-top:6px; }
    .victoire-btn { margin-top:14px; padding:10px 24px; background:#22c55e; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:900; cursor:pointer; font-family:inherit; }
    .fin-btn { margin-top:8px; padding:10px 20px; background:#3b82f6; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:900; cursor:pointer; font-family:inherit; display:block; width:100%; }
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🗺️ Trouve le pays !</span>
  </div>
  <div class="consigne-zone">
    <span id="drapeau-cible"></span>
    <span id="consigne">Chargement…</span>
  </div>
  <div class="map-zone">
    <svg id="mapSvg" viewBox="0 0 680 520" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="ctrl-zone">
    <button id="confirmBtn" onclick="confirmer()">✓ C'est ça !</button>
  </div>
  <div class="lvl-bar">
    <div class="dots-container" id="dots"></div>
    <div class="lvl-label" id="lvlLabel">🌟 Facile</div>
  </div>
</div>

<script src="js/victory-sounds.js"></script>
<script src="js/mp-theme.js"></script>
<script>
// Carte Europe réelle depuis Wikimedia Commons
// IDs ISO mappés aux données des pays
const PAYS = {
  // Niveaux facile (5)
  'fr':  { name:'France',          flag:'🇫🇷', art:'la ' },
  'de':  { name:'Allemagne',       flag:'🇩🇪', art:"l'" },
  'es':  { name:'Espagne',         flag:'🇪🇸', art:"l'" },
  'it':  { name:'Italie',          flag:'🇮🇹', art:"l'" },
  'gb':  { name:'Royaume-Uni',     flag:'🇬🇧', art:'le ' },

  // Niveaux moyen (+ 10)
  'pt':  { name:'Portugal',        flag:'🇵🇹', art:'le ' },
  'be':  { name:'Belgique',        flag:'🇧🇪', art:'la ' },
  'nl':  { name:'Pays-Bas',        flag:'🇳🇱', art:'les ' },
  'ch':  { name:'Suisse',          flag:'🇨🇭', art:'la ' },
  'at':  { name:'Autriche',        flag:'🇦🇹', art:"l'" },
  'pl':  { name:'Pologne',         flag:'🇵🇱', art:'la ' },
  'se':  { name:'Suède',           flag:'🇸🇪', art:'la ' },
  'no':  { name:'Norvège',         flag:'🇳🇴', art:'la ' },
  'gr':  { name:'Grèce',           flag:'🇬🇷', art:'la ' },
  'ro':  { name:'Roumanie',        flag:'🇷🇴', art:'la ' },

  // Niveaux difficile (+ extras)
  'dk':  { name:'Danemark',        flag:'🇩🇰', art:'le ' },
  'ie':  { name:'Irlande',         flag:'🇮🇪', art:"l'" },
  'hr':  { name:'Croatie',         flag:'🇭🇷', art:'la ' },
  'rs':  { name:'Serbie',          flag:'🇷🇸', art:'la ' },
  'sk':  { name:'Slovaquie',       flag:'🇸🇰', art:'la ' },
  'cz':  { name:'Rép. Tchèque',    flag:'🇨🇿', art:'la ' },
  'hu':  { name:'Hongrie',         flag:'🇭🇺', art:'la ' },
  'bg':  { name:'Bulgarie',        flag:'🇧🇬', art:'la ' },
  'ua':  { name:'Ukraine',         flag:'🇺🇦', art:"l'" },
  'fi':  { name:'Finlande',        flag:'🇫🇮', art:'la ' },
  'is':  { name:'Islande',         flag:'🇮🇸', art:"l'" },
  'cy':  { name:'Chypre',          flag:'🇨🇾', art:'la ' },
  'lt':  { name:'Lituanie',        flag:'🇱🇹', art:'la ' },
  'lv':  { name:'Lettonie',        flag:'🇱🇻', art:'la ' },
  'ee':  { name:'Estonie',         flag:'🇪🇪', art:"l'" },
  'si':  { name:'Slovénie',        flag:'🇸🇮', art:'la ' },
  'ba':  { name:'Bosnie-Herzégovine', flag:'🇧🇦', art:'la ' },
  'al':  { name:'Albanie',         flag:'🇦🇱', art:"l'" },
  'mk':  { name:'Macédoine',       flag:'🇲🇰', art:'la ' },
  'me':  { name:'Monténégro',      flag:'🇲🇪', art:'le ' },
};

const LEVELS = {
  facile:    ['fr', 'es', 'it', 'de', 'gb'],
  moyen:     ['fr', 'es', 'it', 'de', 'gb', 'pt', 'be', 'nl', 'ch', 'at', 'pl', 'se', 'no', 'gr', 'ro'],
  difficile: Object.keys(PAYS)
};

let currentLevel = 'facile';
let queue = [], qIdx = 0, selected = null;
const foundSet = new Set();
let svgLoaded = false;

function renderMap() {
  const svg = document.getElementById('mapSvg');
  if (!svgLoaded) return;

  const activeSet = new Set(LEVELS[currentLevel]);
  const allElements = svg.querySelectorAll('[data-iso]');

  allElements.forEach(elem => {
    const iso = elem.getAttribute('data-iso');
    const isActive = activeSet.has(iso);
    const isFound = foundSet.has(iso);
    const isSel = selected === iso;

    elem.classList.remove('highlight', 'found', 'inactive');
    elem.classList.add('country');

    if (isFound) {
      elem.classList.add('found');
    } else if (isSel) {
      elem.classList.add('highlight');
    } else if (!isActive) {
      elem.classList.add('inactive');
    }

    if (isActive && !isFound) {
      elem.style.cursor = 'pointer';
      elem.onclick = (e) => { e.stopPropagation(); selectCountry(iso); };
    } else {
      elem.style.cursor = 'default';
      elem.onclick = null;
    }
  });
}

function speak(txt) {
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='fr-FR'; u.rate=0.9; u.pitch=1.2;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function selectCountry(iso) {
  if (foundSet.has(iso)) return;
  selected = iso;
  renderMap();
  document.getElementById('confirmBtn').classList.add('show');
}

function confirmer() {
  const target = queue[qIdx];
  if (selected === target) {
    victoire(target);
  } else {
    if (typeof SoundPool !== 'undefined') SoundPool.phrase('cherche-bien', 'Non ce n\'est pas ça. Cherche bien.');
    else speak('Non ce n\'est pas ça. Cherche bien.');
    selected = null;
    document.getElementById('confirmBtn').classList.remove('show');
    renderMap();
  }
}

function victoire(iso) {
  const data = PAYS[iso];
  foundSet.add(iso);
  selected = null;
  document.getElementById('confirmBtn').classList.remove('show');
  renderMap();
  speak(`Bravo ! C'est ${data.art}${data.name} !`);

  const ov = document.createElement('div');
  ov.className = 'victoire-overlay';
  ov.innerHTML = `
    <div class="victoire-card">
      <div class="drapeau-victoire">${data.flag}</div>
      <div class="victoire-nom">${data.name}</div>
      <button class="victoire-btn" onclick="this.closest('.victoire-overlay').remove();nextCountry()">Suivant →</button>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(() => { if (document.body.contains(ov)) { ov.remove(); nextCountry(); } }, 2500);
}

function nextCountry() {
  qIdx++;
  if (qIdx >= queue.length) { finGame(); return; }
  updateDots();
  showConsigne();
}

function showConsigne() {
  const iso = queue[qIdx];
  const data = PAYS[iso];
  const consigne = `Trouve ${data.art}${data.name} !`;
  document.getElementById('drapeau-cible').textContent = data.flag;
  document.getElementById('consigne').textContent = consigne;
  speak(consigne);
}

function updateDots() {
  const container = document.getElementById('dots');
  container.innerHTML = '';
  const n = Math.min(queue.length, 12);
  for (let i=0; i<n; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot' + (i < qIdx ? ' done' : '');
    container.appendChild(dot);
  }
}

function finGame() {
  speak('Bravo Max ! Tu as trouvé tous les pays !');
  try { playEndSound(1, 1); } catch(e) {}
  const ov = document.createElement('div');
  ov.className = 'victoire-overlay';
  ov.innerHTML = `
    <div class="victoire-card">
      <div class="drapeau-victoire">🎉</div>
      <div class="victoire-nom">Bravo Max !</div>
      <div style="color:#666;margin:8px 0;font-size:.95rem">Tu as trouvé tous les pays !</div>
      <button class="victoire-btn" onclick="window.location.reload()">Rejouer</button>
      <button class="fin-btn" onclick="window.location.href='index.html'">Menu</button>
    </div>`;
  document.body.appendChild(ov);
}

async function loadSvgMap() {
  try {
    const response = await fetch('https://upload.wikimedia.org/wikipedia/commons/a/a7/Blank_map_of_Europe_%28with_disputed_regions%29.svg');
    if (!response.ok) throw new Error('SVG load failed');
    const svgText = await response.text();
    const parser = new DOMParser();
    const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
    const svg = document.getElementById('mapSvg');

    // Copy all paths from Wikimedia to our container
    svgDoc.querySelectorAll('path').forEach(path => {
      const iso = path.getAttribute('id');
      if (iso && iso.length === 2 && PAYS[iso]) {
        const clone = path.cloneNode();
        const data = PAYS[iso];
        clone.setAttribute('data-iso', iso);
        clone.setAttribute('data-country', data.name);
        clone.removeAttribute('id');
        clone.removeAttribute('style');
        svg.appendChild(clone);
      }
    });

    svgLoaded = true;
  } catch (e) {
    console.error('SVG load error:', e);
    document.getElementById('consigne').textContent = 'Erreur carte...';
  }
}

function initLevel(lvl) {
  currentLevel = lvl;
  const ids = LEVELS[lvl];
  queue = [...ids].sort(() => Math.random() - 0.5);
  qIdx = 0; selected = null; foundSet.clear();
  const labels = {facile:'🌟 Facile', moyen:'⭐⭐ Moyen', difficile:'⭐⭐⭐ Expert'};
  document.getElementById('lvlLabel').textContent = labels[lvl];
  if (svgLoaded) {
    renderMap();
    updateDots();
    showConsigne();
  }
}

function init() {
  const lvl = new URLSearchParams(location.search).get('level') || 'facile';
  loadSvgMap().then(() => initLevel(lvl));
}

init();
</script>
</body>
</html>
