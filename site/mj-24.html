<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-24 – Trouve le dino</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; margin-top:6px; }
    .choices { display:grid; gap:14px; padding:14px; justify-content:center; max-width:560px; margin:0 auto; }
    .dino-tile {
      background:#fff; border-radius:20px; padding:12px; border:5px solid transparent;
      box-shadow:0 5px 14px #0005; cursor:pointer; display:flex; align-items:center; justify-content:center;
      min-width:96px; min-height:96px; transition:transform .12s, border-color .15s;
    }
    .dino-tile:active { transform:scale(.93); }
    .dino-tile img.sil { width:100%; height:100%; max-height:128px; object-fit:contain; pointer-events:none; }
    .dino-tile.ok { border-color:#00c47a; background:#d6fbe7; }
    .dino-tile.ko { border-color:#ff5a5a; opacity:.5; }

  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🦕 Trouve le dino</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="choices" id="choices"></div>
  </div>


  <!-- libs SPÉCIFIQUES au jeu -->
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script src="js/dinos-audio-manifest.js"></script>
  <script src="js/dinos-ombres.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-24 — Trouve le dino (reconnaissance par nom, ombres chinoises par-dino) ───
    // Refonte 2026-07-05 (ordre Papa Yann) : anciennes silhouettes par-famille supprimees,
    // remplacees par les ombres chinoises canon (img/dinos/ombres/) + voix reelle <id>-nom.mp3.
    const OMBRES = DinoOmbres.pool();
    // Especes iconiques pour le niveau 1 (tres reconnaissables pour un fan de dinos)
    const ICONIC_IDS = ['triceratops','tyrannosaurus','diplodocus','stegosaurus','spinosaurus',
                        'ankylosaurus','pteranodon','brachiosaurus','velociraptor','mosasaurus'];
    const G = Golden.setup('mj-24');
    const MAX_Q = G.totalQ;

    const level = G.level;
    const NCHOICES = [3, 4, 5][level];

    let score = 0, streak = 0, qCount = 0, qcm = null, target = null;

    const shuffle = DinoOmbres.shuffle;

    // ── Consignes variées (ordre Papa Yann 2026-08-10, annotation #6376) ────
    // Un petit mot en plus du nom : 8 formulations FR, affichees ET dites.
    // Audio FR = TTS dit l'amorce (« Où est le… ») PUIS le MP3 reel dit le nom
    // (regle 🔒 preservee : le NOM est toujours dit par la vraie voix ElevenLabs,
    // le TTS ne prononce le nom qu'en repli 404). Bonus niveau max (3★) : ~1 fois
    // sur 4, la consigne est dite dans une autre grande langue via le TTS
    // navigateur (nom = genre scientifique, prononcable par une voix non-FR).
    // Repli FR si la voix de la langue n'existe pas sur l'appareil.
    const FR_PHRASES = [
      'Trouve le {n} !',
      'Où est le {n} ?',
      'Et maintenant… le {n} !',
      'Tu me retrouves le {n} ?',
      'Cherche le {n} !',
      'Montre-moi le {n} !',
      'À toi de jouer : le {n} !',
      'Vite, trouve le {n} !'
    ];
    const I18N_PHRASES = [
      { bcp47: 'en-US', t: 'Find the {n}!' },
      { bcp47: 'es-ES', t: '¡Encuentra el {n}!' },
      { bcp47: 'pt-BR', t: 'Encontre o {n}!' },
      { bcp47: 'de-DE', t: 'Finde den {n}!' },
      { bcp47: 'it-IT', t: 'Trova il {n}!' },
      { bcp47: 'ja-JP', t: '{n} を探して！' },
      { bcp47: 'zh-CN', t: '找到{n}！' }
    ];
    let curFr = '', curI18n = null;

    function hasVoiceFor(bcp47){
      if (!window.TTS || !TTS.supported()) return false;
      const prefix = bcp47.split('-')[0].toLowerCase();
      try {
        return (window.speechSynthesis.getVoices() || [])
          .some(v => (v.lang || '').toLowerCase().startsWith(prefix));
      } catch (e) { return false; }
    }

    function genus(){
      const full = ((typeof DINOS !== 'undefined' && DINOS.find(d => d.id === target.id)) || {}).full;
      return (full || target.name).split(' ')[0];
    }

    // Choisit la consigne de la question : TOUJOURS une formulation FR (repli +
    // bouton réécouter), et parfois une voie étrangère par-dessus au 3★.
    function pickConsigne(){
      curFr = DinoOmbres.pick(FR_PHRASES);
      curI18n = null;
      if (level >= 2 && Math.random() < 0.25){
        const hit = shuffle(I18N_PHRASES.slice()).find(p => hasVoiceFor(p.bcp47));
        if (hit) curI18n = hit;
      }
    }

    function consigneTexte(){
      return curI18n ? curI18n.t.replace('{n}', genus())
                     : curFr.replace('{n}', target.name);
    }

    // Voie FR : TTS dit l'amorce (sans le nom), puis le MP3 réel dit le nom.
    // C'est aussi la voie du bouton réécouter — ordre PY : « cet icône ferait
    // toujours la langue originale pour l'utilisateur (FR) ».
    // Filet de sécurité : si le TTS ne rappelle jamais onEnd (navigateur sans
    // pile vocale complète), le MP3 part quand même après 2,6 s.
    let sayToken = 0;
    function sayFr(){
      const fr = curFr.replace('{n}', target.name);
      const token = ++sayToken;
      if (window.TTS && TTS.supported()){
        DinoOmbres.stopNom();
        TTS.cancel();
        let played = false;
        const go = function(){
          if (played || token !== sayToken) return;
          played = true;
          DinoOmbres.playNom(target.id, fr);
        };
        TTS.speak(curFr.replace('{n}', '…'), { pitch: 1.05, onEnd: go });
        setTimeout(go, 2600);
      } else {
        DinoOmbres.playNom(target.id, fr);
      }
    }

    // Affiche + dit la consigne courante. JAMAIS deux voix en meme temps.
    function sayPhrase(){
      sayToken++; // invalide un éventuel filet de secours FR encore en attente
      shell.setConsigne(consigneTexte(), false); // l'audio custom suit
      if (curI18n){
        DinoOmbres.stopNom();
        TTS.cancel();
        TTS.speak(curI18n.t.replace('{n}', genus()), { lang: curI18n.bcp47, pitch: 1.05, priority: true });
      } else {
        sayFr();
      }
    }

    const shell = MJ.init({
      id: 'mj-24', emoji: '🦕', titre: 'Trouve le dino',
      consigne: true,
      onRepeat: function () { sayFr(); }, // réécouter = TOUJOURS la langue originale (FR)
      regle: {
        picto: '🦕🔎',
        texte: 'Écoute le nom, trouve le bon dino !',
        etapes: [
          { t: 'J’écoute le nom du dino 👂',
            d: 'Une voix dit le nom : « Trouve le Tricératops ! ». Je tape la consigne pour réécouter.' },
          { t: 'Je regarde les ombres 👀',
            d: 'Chaque carte montre l’ombre d’un dino. Une seule est le bon !' },
          { t: 'Je tape la bonne ombre 👆',
            d: 'Si je me trompe, j’écoute un indice et je peux réessayer.' },
          { t: 'Plus j’ai d’étoiles, plus c’est malin 💪',
            d: 'Plus d’ombres à comparer… et parfois deux cousins de la même famille !' }
        ]
      }
    });

    function init(){
      G.buildPips();
      nextQuestion();
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      const basePool = level === 0 ? OMBRES.filter(o => ICONIC_IDS.includes(o.id)) : OMBRES;
      target = DinoOmbres.pick(basePool);
      // distracteurs : niveau 2 = au moins 1 cousin de la meme famille (discrimination fine)
      const others = DinoOmbres.pickCousins(OMBRES, target, NCHOICES, { minCousins: level >= 2 ? 1 : 0 });
      const opts = shuffle([
        { o: target, correct: true },
        ...others.map(o => ({ o, correct:false }))
      ]);

      pickConsigne();
      sayPhrase();

      const box = document.getElementById('choices');
      box.style.gridTemplateColumns = 'repeat(' + Math.min(opts.length,3) + ', 1fr)';
      box.innerHTML = '';
      opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'dino-tile';
        b.dataset.dinoId = opt.o.id;
        if (opt.correct) b.dataset.correct = '1';
        b.innerHTML = '<img class="sil" src="' + opt.o.src + '" alt="">';
        b.onclick = () => answer(opt.correct, b);
        box.appendChild(b);
      });
    }

    // Verrouille tous les choix de la question en cours : empêche qu'un tap
    // rapide (double-tap d'excitation, ou tap pendant la fenêtre de victoire
    // avant que nextQuestion() ait reconstruit le DOM) ne retombe sur une
    // vieille tuile encore active et ne valide 2 questions d'un coup
    // (bug remonté par Papa Yann : "la 3e validation, je la refais 2 fois").
    function lockChoices(){
      document.querySelectorAll('#choices .dino-tile').forEach(b => b.disabled = true);
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if (res.outcome === 'correct'){
        lockChoices();
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); G.notePip(qCount-1, res.attempts, btn);
        setTimeout(nextQuestion, 950);
      } else if (res.outcome === 'reveal'){
        lockChoices();
        btn.classList.add('ko'); streak = 0;
        revealCorrect();
        // Son d'erreur AUDIBLE du pool partagé (inclut le prout culte) — remplace
        // sndBuzz() (tonalité synthé trop discrète, retour Papa Yann : "on entend
        // pas bien quand on a fauté, vu le texte par dessus"). Jamais punitif.
        SoundPool.play('error', 0.85);
        const okEl = document.querySelector('.dino-tile[data-correct="1"]');
        G.notePip(qCount-1, 4, okEl);
        setTimeout(nextQuestion, 1800);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        SoundPool.play('error', 0.85);
        SoundPool.voice('doux');   // voix réelle aléatoire (Presque ! / Essaie encore !…)
      }
    }

    function revealCorrect(){
      document.querySelectorAll('.dino-tile[data-correct="1"]').forEach(b => b.classList.add('ok'));
    }

    function showEnd(){
      G.showEnd({ replayUrl: 'mj-24.html' });
    }

    init();
    });
  </script>
</body>
</html>
