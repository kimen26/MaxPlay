<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-24 – Trouve le dino</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { background: linear-gradient(160deg,#1f3d2b,#13261c); }
    .instruction-text { text-align:center; font-size:1.35rem; font-weight:900; color:#ffe066; margin:10px 12px 4px; }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; margin-top:6px; }
    .tts-btn {
      display:flex; align-items:center; gap:8px; margin:8px auto;
      background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff; border:none; cursor:pointer;
      border-radius:25px; padding:10px 22px; font-size:1rem; font-weight:900;
      box-shadow:0 4px 12px #0005;
    }
    .tts-btn:active { transform:scale(.94); }
    .choices { display:grid; gap:14px; padding:14px; justify-content:center; max-width:560px; margin:0 auto; }
    .dino-tile {
      background:#fff; border-radius:20px; padding:12px; border:5px solid transparent;
      box-shadow:0 5px 14px #0005; cursor:pointer; display:flex; align-items:center; justify-content:center;
      min-width:96px; min-height:96px; transition:transform .12s, border-color .15s;
    }
    .dino-tile:active { transform:scale(.93); }
    .dino-tile img.sil { width:100%; height:100%; max-height:128px; object-fit:contain; pointer-events:none; }
    .dino-tile.ok { border-color:#00c47a; background:#d6fbe7; }
    .dino-tile.ko { border-color:#ff5a5a; opacity:.5; }

  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🦕 Trouve le dino</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="qbox">
      <div class="instruction-text" id="instruction">…</div>
      <button class="tts-btn" id="repeatBtn"><span>🔊</span><span>Écouter</span></button>
    </div>

    <div class="choices" id="choices"></div>
  </div>


  <script src="js/sounds.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script src="js/mj-golden.js"></script>
  <script src="js/dino-silhouettes.js"></script>
  <script>
    // ─── MJ-24 — Trouve le dino (reconnaissance par nom) ───
    const SIL = window.DINO_SILHOUETTES, LAB = window.DINO_FAMILY_LABELS;
    // Familles "nommables" pour 4 ans (espèces iconiques connues d'un fan de dinos)
    const NAMEABLE = ['ceratopsien','trex','sauropode','stegosaure','pterosaure'];
    const ALL_FAMS = Object.keys(SIL);
    const G = Golden.setup('mj-24');
    const MAX_Q = G.totalQ;

    const level = G.level;
    const NCHOICES = [3, 4, 5][level];

    let score = 0, streak = 0, qCount = 0, qcm = null, targetFam = null;

    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function pick(fam){const a=SIL[fam];return a[Math.floor(Math.random()*a.length)];}
    function speak(t){TTS.speak(t,{pitch:1.05,priority:true});}

    function init(){
      G.buildPips();
      document.getElementById('repeatBtn').onclick = () => speak('Trouve ' + LAB[targetFam].tts + ' !');
      nextQuestion();
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      targetFam = NAMEABLE[Math.floor(Math.random()*NAMEABLE.length)];
      // distracteurs : familles différentes de la cible, distinctes entre elles
      const others = shuffle(ALL_FAMS.filter(f => f !== targetFam)).slice(0, NCHOICES-1);
      const opts = shuffle([
        { fam: targetFam, src: pick(targetFam), correct: true },
        ...others.map(f => ({ fam:f, src: pick(f), correct:false }))
      ]);

      document.getElementById('instruction').textContent = 'Trouve le ' + LAB[targetFam].nom + ' !';
      speak('Trouve ' + LAB[targetFam].tts + ' !');

      const box = document.getElementById('choices');
      box.style.gridTemplateColumns = 'repeat(' + Math.min(opts.length,3) + ', 1fr)';
      box.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'dino-tile';
        b.dataset.fam = o.fam;
        if (o.correct) b.dataset.correct = '1';
        b.innerHTML = '<img class="sil" src="' + o.src + '" alt="">';
        b.onclick = () => answer(o.correct, b);
        box.appendChild(b);
      });
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); G.notePip(qCount-1, res.attempts);
        setTimeout(nextQuestion, 950);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        revealCorrect(); sndBuzz(); G.notePip(qCount-1, 4);
        setTimeout(nextQuestion, 1800);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
        speak('Essaie encore !');
      }
    }

    function revealCorrect(){
      document.querySelectorAll('.dino-tile[data-correct="1"]').forEach(b => b.classList.add('ok'));
    }

    function showEnd(){
      G.showEnd({ replayUrl: 'mj-24.html' });
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
