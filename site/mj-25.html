<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-25 – Pareil pas pareil</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { background: linear-gradient(160deg,#2a2540,#161226); }
    .instruction-text { text-align:center; font-size:1.3rem; font-weight:900; color:#ffe066; margin:8px 12px 2px; }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; }
    .ref-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; margin:8px 0; }
    .ref-label { font-size:.95rem; font-weight:900; color:#bbaaff; }
    .ref-card {
      background:#fff; border-radius:22px; padding:14px; box-shadow:0 6px 18px #0006;
      width:150px; height:150px; display:flex; align-items:center; justify-content:center;
      border:5px solid #8a7dff;
    }
    .ref-card img { width:100%; height:100%; object-fit:contain; }
    .choices { display:grid; gap:14px; padding:14px; justify-content:center; max-width:560px; margin:0 auto; }
    .dino-tile {
      background:#fff; border-radius:20px; padding:12px; border:5px solid transparent;
      box-shadow:0 5px 14px #0005; cursor:pointer; display:flex; align-items:center; justify-content:center;
      min-width:104px; min-height:104px; transition:transform .12s, border-color .15s;
    }
    .dino-tile:active { transform:scale(.93); }
    .dino-tile img.sil { width:100%; height:100%; max-height:120px; object-fit:contain; pointer-events:none; }
    .dino-tile.ok { border-color:#00c47a; background:#d6fbe7; }
    .dino-tile.ko { border-color:#ff5a5a; opacity:.5; }

  </style>
  <style>
    /* ── Consigne de manche (niveau visuel de la difficulté) ── */
    .tier-badge {
      display:inline-block; margin-top:6px; font-size:.75rem; font-weight:900;
      color:#ffe066; background:#ffe06622; border:2px solid #ffe06655;
      border-radius:20px; padding:3px 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🔍 Pareil pas pareil</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="qbox">
      <div class="instruction-text" id="instructionText">Trouve le MÊME que celui-ci !</div>
      <div class="ref-wrap">
        <div class="ref-label">celui-ci 👇</div>
        <div class="ref-card" id="refCard"></div>
      </div>
      <div class="tier-badge" id="tierBadge"></div>
    </div>

    <div class="choices" id="choices"></div>
  </div>


  <script src="js/sounds.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script src="js/mj-golden.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script>
    // ─── MJ-25 — Pareil pas pareil (matching visuel, ombres chinoises par-dino) ───
    // Refonte 2026-07-05 (ordre Papa Yann) : anciennes silhouettes par-famille supprimees,
    // remplacees par les ombres chinoises canon (img/dinos/ombres/).
    const SRC = (typeof DINOS !== 'undefined') ? DINOS : [];
    const OMBRES = SRC.filter(d => d.png && d.name && !d.png.includes('/'))
      .map(d => ({ id: d.id, famille: d.famille,
                   src: 'img/dinos/ombres/' + d.png.replace(/\.(jpg|png)$/i,'') + '_ombre.png' }));
    const G = Golden.setup('mj-25');
    const MAX_Q = G.totalQ;

    // Progression par palier (Papa Yann 2026-07-07 : "zéro difficulté, but incompris") :
    //   ★   niveau 0 : 2 propositions TRÈS différentes (familles éloignées)
    //   ★★  niveau 1 : 3-4 propositions dont des cousins (même famille, couleurs proches)
    //   ★★★ niveau 2 : différences SUBTILES — le même dino décliné en leurres via filtres
    //        CSS (hue-rotate/scaleX) : orientation miroir, teinte, "crête" suggérée par le filtre.
    const level = G.level;
    const NCHOICES = [2, 3, 4][level];
    const SAME_FAMILY_DISTRACTORS = level >= 1;   // dès ★★ : cousins de famille
    const SUBTLE_VARIANTS = level >= 2;           // ★★★ : leurres = même image, filtre CSS
    const TIER_LABELS = ['★ Facile', '★★ Cousins de famille', '★★★ Cherche bien les détails'];

    let score = 0, streak = 0, qCount = 0, qcm = null;

    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function speak(t){TTS.speak(t,{pitch:1.05,priority:true});}

    // Leurres "même dino" au niveau ★★★ : filtre CSS appliqué au DISTRACTEUR, jamais à la
    // référence ni à la bonne réponse (qui restent l'image canon, non filtrée).
    const SUBTLE_FILTERS = [
      'hue-rotate(45deg)',
      'hue-rotate(-45deg) saturate(1.3)',
      'hue-rotate(90deg)',
      'brightness(1.25) hue-rotate(25deg)',
      'sepia(.35) hue-rotate(15deg)',
    ];
    function pickSubtleFilter(){ return SUBTLE_FILTERS[Math.floor(Math.random()*SUBTLE_FILTERS.length)]; }
    function maybeMirror(){ return Math.random() < 0.5 ? ' scaleX(-1)' : ''; }

    function init(){
      G.buildPips();
      const badge = document.getElementById('tierBadge');
      if (badge) badge.textContent = TIER_LABELS[level];
      nextQuestion();
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      const ref = OMBRES[Math.floor(Math.random()*OMBRES.length)];

      let opts;
      if (SUBTLE_VARIANTS){
        // ★★★ : la bonne réponse + le MÊME dino redessiné avec un filtre/miroir subtil
        // (même silhouette, teinte ou orientation différente) — force à observer le détail,
        // pas juste "c'est un dino différent".
        const usedFilters = shuffle(SUBTLE_FILTERS).slice(0, NCHOICES-1);
        opts = shuffle([
          { src: ref.src, correct: true, filter:'none', transform:'' },
          ...usedFilters.map(f => ({ src: ref.src, correct:false, filter:f, transform:maybeMirror() })),
        ]);
      } else {
        // ★ / ★★ : distracteurs = autres dinos, cousins de famille dès ★★
        const cousins = OMBRES.filter(o => o.id !== ref.id && o.famille === ref.famille);
        const pool = (SAME_FAMILY_DISTRACTORS && cousins.length >= NCHOICES-1)
          ? cousins
          : OMBRES.filter(o => o.id !== ref.id);
        const distract = shuffle(pool).slice(0, NCHOICES-1);
        opts = shuffle([
          { src: ref.src, correct: true, filter:'none', transform:'' },
          ...distract.map(o => ({ src: o.src, correct:false, filter:'none', transform:'' })),
        ]);
      }

      document.getElementById('refCard').innerHTML = '<img src="' + ref.src + '" alt="">';
      SoundPool.phrase('trouve-le-meme-dino', 'Trouve le même dino !');

      const box = document.getElementById('choices');
      box.style.gridTemplateColumns = 'repeat(' + Math.min(opts.length,2) + ', 1fr)';
      box.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'dino-tile';
        if (o.correct) b.dataset.correct = '1';
        const style = (o.filter !== 'none' || o.transform)
          ? ' style="filter:' + o.filter + '; transform:' + (o.transform || 'none') + ';"'
          : '';
        b.innerHTML = '<img class="sil"' + style + ' src="' + o.src + '" alt="">';
        b.onclick = () => answer(o.correct, b);
        box.appendChild(b);
      });
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); G.notePip(qCount-1, res.attempts);
        setTimeout(nextQuestion, 950);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        document.querySelectorAll('.dino-tile[data-correct="1"]').forEach(b=>b.classList.add('ok'));
        sndBuzz(); G.notePip(qCount-1, 4);
        setTimeout(nextQuestion, 1800);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
        SoundPool.voice('doux');   // voix réelle aléatoire
      }
    }


    function showEnd(){
      G.showEnd({ replayUrl: 'mj-25.html' });
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
