<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-25 – Pareil pas pareil</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { background: linear-gradient(160deg,#2a2540,#161226); }
    .instruction-text { text-align:center; font-size:1.3rem; font-weight:900; color:#ffe066; margin:8px 12px 2px; }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; }
    .ref-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; margin:8px 0; }
    .ref-label { font-size:.95rem; font-weight:900; color:#bbaaff; }
    .ref-card {
      background:#fff; border-radius:22px; padding:14px; box-shadow:0 6px 18px #0006;
      width:150px; height:150px; display:flex; align-items:center; justify-content:center;
      border:5px solid #8a7dff;
    }
    .ref-card img { width:100%; height:100%; object-fit:contain; }
    .choices { display:grid; gap:14px; padding:14px; justify-content:center; max-width:560px; margin:0 auto; }
    .dino-tile {
      background:#fff; border-radius:20px; padding:12px; border:5px solid transparent;
      box-shadow:0 5px 14px #0005; cursor:pointer; display:flex; align-items:center; justify-content:center;
      min-width:104px; min-height:104px; transition:transform .12s, border-color .15s;
    }
    .dino-tile:active { transform:scale(.93); }
    .dino-tile img.sil { width:100%; height:100%; max-height:120px; object-fit:contain; pointer-events:none; }
    .dino-tile.ok { border-color:#00c47a; background:#d6fbe7; }
    .dino-tile.ko { border-color:#ff5a5a; opacity:.5; }

    /* ===== STANDARD GOLDEN : billes de progression ===== */
    .pips { display:flex; gap:6px; align-items:center; justify-content:center; padding:8px 12px 2px; flex-wrap:wrap; }
    .pip { width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.25); transition:background .3s, transform .2s; }
    .pip.cur { transform:scale(1.25); border-color:#fff; }
    .pip.v1 { background:#00c47a; border-color:#00c47a; }
    .pip.v2 { background:#ffe066; border-color:#ffe066; }
    .pip.v3 { background:#F58443; border-color:#F58443; }
    .pip.v4 { background:#ff4455; border-color:#ff4455; }
    /* ===== STANDARD GOLDEN : celebration etoile ===== */
    .end-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; text-align:center; padding:20px; }
    .star-stage { position:relative; width:160px; height:160px; margin-bottom:8px; }
    .star-empty, .star-fill { position:absolute; inset:0; font-size:9rem; line-height:160px; }
    .star-empty { color:#ffffff22; }
    .star-fill { color:#ffd633; filter:drop-shadow(0 0 14px #ffd63399); clip-path:inset(100% 0 0 0); transition:clip-path 1.1s cubic-bezier(.2,.8,.2,1); }
    .star-fill.full { clip-path:inset(0 0 0 0); }
    .star-stage.pop { animation:starPop .5s ease-out .9s both; }
    @keyframes starPop { 0%{transform:scale(1)} 40%{transform:scale(1.25) rotate(-6deg)} 70%{transform:scale(.95) rotate(4deg)} 100%{transform:scale(1)} }
    .end-title { font-size:2rem; color:#ffe066; margin:6px 0 8px; opacity:0; animation:fadeUp .4s ease .9s forwards; }
    .end-sub { font-size:1.2rem; margin-bottom:24px; opacity:0; animation:fadeUp .4s ease 1.1s forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .end-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; opacity:0; animation:fadeUp .4s ease 1.3s forwards; }
    .end-btns a { padding:16px 30px; border-radius:30px; text-decoration:none; font-weight:900; min-height:56px; display:flex; align-items:center; color:#fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🔍 Pareil pas pareil</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="qbox">
      <div class="instruction-text">Trouve le même dino !</div>
      <div class="ref-wrap">
        <div class="ref-label">celui-ci 👇</div>
        <div class="ref-card" id="refCard"></div>
      </div>
    </div>

    <div class="choices" id="choices"></div>
  </div>


  <script src="js/sounds.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script src="js/dino-silhouettes.js"></script>
  <script>
    // ─── MJ-25 — Pareil pas pareil (matching visuel) ───
    const SIL = window.DINO_SILHOUETTES;
    const ALL_FAMS = Object.keys(SIL);
    const MAX_Q = 8;

    // Niveau : +choix, et distracteurs de la MÊME famille (discrimination plus fine)
    const level = Math.max(0, Math.min(2, (window.Stars ? Stars.get('mj-25') : 0)));
    const NCHOICES = [2, 3, 4][level];
    const SAME_FAMILY_DISTRACTORS = level >= 2; // niveau 3 = plus dur

    let score = 0, streak = 0, qCount = 0, qcm = null;

    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function speak(t){TTS.speak(t,{pitch:1.05,priority:true});}

    // ===== STANDARD GOLDEN : billes + son Mario (MP3 reel) =====
    function buildPips(){
      const box = document.getElementById('pips'); box.innerHTML = '';
      for (let i = 0; i < MAX_Q; i++){
        const d = document.createElement('div');
        d.className = 'pip' + (i === 0 ? ' cur' : ''); d.id = 'pip' + i;
        box.appendChild(d);
      }
    }
    function colorPip(i, attempts){
      const p = document.getElementById('pip' + i); if (!p) return;
      p.classList.remove('cur'); p.classList.add('v' + Math.min(attempts, 4));
      const next = document.getElementById('pip' + (i + 1)); if (next) next.classList.add('cur');
    }
    function sndMarioStar(){
      try { const a = new Audio('sounds/victory-mario-series-hq-super-smash-bros.mp3'); a.volume = 0.85; a.play().catch(() => {}); } catch (e) {}
    }

    function init(){
      buildPips();
      nextQuestion();
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      const refFam = ALL_FAMS[Math.floor(Math.random()*ALL_FAMS.length)];
      const refSrc = SIL[refFam][Math.floor(Math.random()*SIL[refFam].length)];

      // distracteurs : autres images, jamais identiques à la référence
      let pool;
      if (SAME_FAMILY_DISTRACTORS && SIL[refFam].length > NCHOICES){
        pool = SIL[refFam].filter(s => s !== refSrc);          // même famille = plus dur
      } else {
        pool = [];
        shuffle(ALL_FAMS.filter(f => f !== refFam)).slice(0, NCHOICES-1)
          .forEach(f => pool.push(SIL[f][Math.floor(Math.random()*SIL[f].length)]));
      }
      const distract = shuffle(pool).slice(0, NCHOICES-1);
      const opts = shuffle([
        { src: refSrc, correct: true },
        ...distract.map(s => ({ src:s, correct:false }))
      ]);

      document.getElementById('refCard').innerHTML = '<img src="' + refSrc + '" alt="">';
      speak('Trouve le même dino !');

      const box = document.getElementById('choices');
      box.style.gridTemplateColumns = 'repeat(' + Math.min(opts.length,2) + ', 1fr)';
      box.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'dino-tile';
        if (o.correct) b.dataset.correct = '1';
        b.innerHTML = '<img class="sil" src="' + o.src + '" alt="">';
        b.onclick = () => answer(o.correct, b);
        box.appendChild(b);
      });
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if ((res.outcome==='correct'||res.outcome==='reveal') && typeof Tracker!=='undefined') Tracker.logAnswer(res.outcome==='correct');
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); colorPip(qCount-1, res.attempts);
        speak('Bravo ! Pareil !');
        setTimeout(nextQuestion, 1300);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        document.querySelectorAll('.dino-tile[data-correct="1"]').forEach(b=>b.classList.add('ok'));
        sndBuzz(); colorPip(qCount-1, 4);
        setTimeout(nextQuestion, 1800);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
        speak('Regarde bien, essaie encore !');
      }
    }


    function showEnd(){
      if (typeof Tracker!=='undefined') Tracker.endSession(score, MAX_Q*10);
      document.getElementById('app').innerHTML =
        '<div class="end-wrap">'
        + '<div class="star-stage" id="starStage"><div class="star-empty">★</div><div class="star-fill" id="starFill">★</div></div>'
        + '<div class="end-title">Bravo Max&nbsp;!</div>'
        + '<div class="end-sub">Tu as gagné une étoile&nbsp;!</div>'
        + '<div class="end-btns">'
        + '<a href="mj-25.html" style="background:#00c47a;">🔄 Rejouer</a>'
        + '<a href="index.html" style="background:#ffffff22;">📋 Menu</a>'
        + '</div></div>';
      requestAnimationFrame(() => {
        setTimeout(() => {
          document.getElementById('starFill').classList.add('full');
          document.getElementById('starStage').classList.add('pop');
          sndMarioStar();
        }, 120);
        setTimeout(() => { confettiBurst(70); }, 1100);
      });
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
