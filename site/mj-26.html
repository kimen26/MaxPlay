<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-26 – Compte les dinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { background: linear-gradient(160deg,#143a40,#0d2226); }
    .instruction-text { text-align:center; font-size:1.3rem; font-weight:900; color:#ffe066; margin:8px 12px 2px; }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; margin-top:4px; }
    .tts-btn { min-height:80px;
      display:flex; align-items:center; gap:8px; margin:6px auto;
      background:linear-gradient(135deg,#26a69a,#4db6ac); color:#fff; border:none; cursor:pointer;
      border-radius:25px; padding:9px 20px; font-size:.95rem; font-weight:900; box-shadow:0 4px 12px #0005;
    }
    .tts-btn:active { transform:scale(.94); }
    /* flex-shrink:0 + overflow-y:auto : sans ça, en flex column contraint (#app 100dvh),
       .play-area se fait écraser sous sa taille naturelle et les sprites débordent du
       cadre blanc (bug "dino tronqué en bas", Papa Yann 2026-07-07). */
    .play-area {
      background:#fff; border-radius:22px; margin:10px 12px; box-shadow:0 6px 18px #0006;
      min-height:120px; flex-shrink:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:6px 10px; padding:16px; max-width:560px; margin-left:auto; margin-right:auto;
      max-height:42vh; overflow-y:auto;
    }
    .play-area img.sil { height:clamp(48px,11vh,84px); width:auto; object-fit:contain; pointer-events:none;
      animation:pop .25s ease; flex-shrink:0; }
    @keyframes pop { from{transform:scale(0);} to{transform:scale(1);} }
    .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px; max-width:380px; margin:0 auto; flex-shrink:0; }
    .num-btn {
      background:linear-gradient(160deg,#ffffff,#e8f5f3); color:#114; border:4px solid transparent;
      border-radius:18px; font-size:2rem; font-weight:900; padding:14px 0; cursor:pointer;
      box-shadow:0 4px 12px #0005; transition:transform .12s, border-color .15s;
    }
    .num-btn:active { transform:scale(.92); }
    .num-btn.ok { border-color:#00c47a; background:#d6fbe7; }
    .num-btn.ko { border-color:#ff5a5a; opacity:.5; }

  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🔢 Compte les dinos</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="qbox">
      <div class="instruction-text">Combien de dinos ?</div>
      <button class="tts-btn" id="repeatBtn"><span>🔊</span><span>Compte avec moi</span></button>
    </div>

    <div class="play-area" id="playArea"></div>
    <div class="choices" id="choices"></div>
  </div>


  <script src="js/sounds.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script src="js/mj-golden.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script>
    // ─── MJ-26 — Compte les dinos (1 à 6, ombres chinoises par-dino) ───
    // Refonte 2026-07-05 (ordre Papa Yann) : anciennes silhouettes par-famille supprimees,
    // remplacees par les ombres chinoises canon (img/dinos/ombres/), groupees par famille.
    const SRC = (typeof DINOS !== 'undefined') ? DINOS : [];
    const SIL = {};
    SRC.filter(d => d.png && !d.png.includes('/')).forEach(d => {
      (SIL[d.famille] = SIL[d.famille] || []).push('img/dinos/ombres/' + d.png.replace(/\.(jpg|png)$/i,'') + '_ombre.png');
    });
    const ALL_FAMS = Object.keys(SIL);
    const G = Golden.setup('mj-26');
    const MAX_Q = G.totalQ;

    const level = G.level;
    const RANGE = [[1,3],[1,5],[2,6]][level];   // min..max selon niveau

    let score = 0, streak = 0, qCount = 0, qcm = null, currentCount = 0, currentFam = null;

    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function speak(t){TTS.speak(t,{pitch:1.05,priority:true});}
    function randInt(min,max){return min+Math.floor(Math.random()*(max-min+1));}

    // Sac de quantités mélangé (pas de pur hasard) : garantit des cibles VARIÉES
    // sur la session au lieu de risquer de tirer 4-5x la même valeur (bug signalé
    // Papa Yann 2026-07-07 : "5 fois le chiffre 1"). Se recharge/mélange quand vide.
    let countBag = [];
    function nextCount(){
      if (!countBag.length){
        countBag = [];
        for (let n = RANGE[0]; n <= RANGE[1]; n++) countBag.push(n);
        countBag = shuffle(countBag);
        // complète jusqu'à MAX_Q si la plage est plus courte que le nb de questions
        while (countBag.length < MAX_Q) countBag.push(...shuffle([...Array(RANGE[1]-RANGE[0]+1).keys()].map(i=>i+RANGE[0])));
      }
      return countBag.shift();
    }

    function init(){
      G.buildPips();
      document.getElementById('repeatBtn').onclick = countAloud;
      nextQuestion();
    }

    function countAloud(){
      // "1, 2, 3 ! Trois dinos."
      speak([...Array(currentCount).keys()].map(i => i+1).join(', ') + ' ! ' + currentCount + ' dinos.');
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      currentCount = nextCount();
      currentFam = ALL_FAMS[Math.floor(Math.random()*ALL_FAMS.length)];

      // affiche currentCount silhouettes de la même famille (images variées)
      const area = document.getElementById('playArea');
      area.innerHTML = '';
      const imgs = shuffle(SIL[currentFam]);
      for (let i = 0; i < currentCount; i++){
        const img = document.createElement('img');
        img.className = 'sil';
        img.src = imgs[i % imgs.length];
        img.style.animationDelay = (i*0.12) + 's';
        area.appendChild(img);
      }
      SoundPool.phrase('combien-de-dinos', 'Combien de dinos ? Compte-les !');

      // choix numériques : la bonne + voisines plausibles dans la plage globale
      const correct = currentCount;
      const cand = new Set([correct]);
      while (cand.size < 3){
        const d = correct + (Math.random()<.5?-1:1)*randInt(1,2);
        if (d >= 1 && d <= 9) cand.add(d);
      }
      const opts = shuffle([...cand]);
      const box = document.getElementById('choices');
      box.innerHTML = '';
      opts.forEach(n => {
        const b = document.createElement('button');
        b.className = 'num-btn';
        b.textContent = n;
        if (n === correct) b.dataset.correct = '1';
        b.onclick = () => answer(n === correct, b);
        box.appendChild(b);
      });
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); G.notePip(qCount-1, res.attempts);
        setTimeout(nextQuestion, 950);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        document.querySelectorAll('.num-btn[data-correct="1"]').forEach(b=>b.classList.add('ok'));
        sndBuzz(); G.notePip(qCount-1, 4);
        speak('Il y avait ' + currentCount + ' dinos.');
        setTimeout(nextQuestion, 2000);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
        SoundPool.phrase('compte-encore', 'Compte encore !');
      }
    }


    function showEnd(){
      G.showEnd({ replayUrl: 'mj-26.html' });
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
