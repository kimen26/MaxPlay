<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-26 – Compte les dinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { background: linear-gradient(160deg,#143a40,#0d2226); }
    .instruction-text { text-align:center; font-size:1.3rem; font-weight:900; color:#ffe066; margin:8px 12px 2px; }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; margin-top:4px; }
    .tts-btn {
      display:flex; align-items:center; gap:8px; margin:6px auto;
      background:linear-gradient(135deg,#26a69a,#4db6ac); color:#fff; border:none; cursor:pointer;
      border-radius:25px; padding:9px 20px; font-size:.95rem; font-weight:900; box-shadow:0 4px 12px #0005;
    }
    .tts-btn:active { transform:scale(.94); }
    .play-area {
      background:#fff; border-radius:22px; margin:10px 12px; box-shadow:0 6px 18px #0006;
      min-height:200px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:6px 10px; padding:16px; max-width:560px; margin-left:auto; margin-right:auto;
    }
    .play-area img.sil { height:84px; width:auto; object-fit:contain; pointer-events:none;
      animation:pop .25s ease; }
    @keyframes pop { from{transform:scale(0);} to{transform:scale(1);} }
    .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px; max-width:380px; margin:0 auto; }
    .num-btn {
      background:linear-gradient(160deg,#ffffff,#e8f5f3); color:#114; border:4px solid transparent;
      border-radius:18px; font-size:2rem; font-weight:900; padding:14px 0; cursor:pointer;
      box-shadow:0 4px 12px #0005; transition:transform .12s, border-color .15s;
    }
    .num-btn:active { transform:scale(.92); }
    .num-btn.ok { border-color:#00c47a; background:#d6fbe7; }
    .num-btn.ko { border-color:#ff5a5a; opacity:.5; }

    /* ===== STANDARD GOLDEN : billes de progression ===== */
    .pips { display:flex; gap:6px; align-items:center; justify-content:center; padding:8px 12px 2px; flex-wrap:wrap; }
    .pip { width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.25); transition:background .3s, transform .2s; }
    .pip.cur { transform:scale(1.25); border-color:#fff; }
    .pip.v1 { background:#00c47a; border-color:#00c47a; }
    .pip.v2 { background:#ffe066; border-color:#ffe066; }
    .pip.v3 { background:#F58443; border-color:#F58443; }
    .pip.v4 { background:#ff4455; border-color:#ff4455; }
    /* ===== STANDARD GOLDEN : celebration etoile ===== */
    .end-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; text-align:center; padding:20px; }
    .star-stage { position:relative; width:160px; height:160px; margin-bottom:8px; }
    .star-empty, .star-fill { position:absolute; inset:0; font-size:9rem; line-height:160px; }
    .star-empty { color:#ffffff22; }
    .star-fill { color:#ffd633; filter:drop-shadow(0 0 14px #ffd63399); clip-path:inset(100% 0 0 0); transition:clip-path 1.1s cubic-bezier(.2,.8,.2,1); }
    .star-fill.full { clip-path:inset(0 0 0 0); }
    .star-stage.pop { animation:starPop .5s ease-out .9s both; }
    @keyframes starPop { 0%{transform:scale(1)} 40%{transform:scale(1.25) rotate(-6deg)} 70%{transform:scale(.95) rotate(4deg)} 100%{transform:scale(1)} }
    .end-title { font-size:2rem; color:#ffe066; margin:6px 0 8px; opacity:0; animation:fadeUp .4s ease .9s forwards; }
    .end-sub { font-size:1.2rem; margin-bottom:24px; opacity:0; animation:fadeUp .4s ease 1.1s forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .end-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; opacity:0; animation:fadeUp .4s ease 1.3s forwards; }
    .end-btns a { padding:16px 30px; border-radius:30px; text-decoration:none; font-weight:900; min-height:56px; display:flex; align-items:center; color:#fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🔢 Compte les dinos</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="qbox">
      <div class="instruction-text">Combien de dinos ?</div>
      <button class="tts-btn" id="repeatBtn"><span>🔊</span><span>Compte avec moi</span></button>
    </div>

    <div class="play-area" id="playArea"></div>
    <div class="choices" id="choices"></div>
  </div>


  <script src="js/sounds.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/qcm-retry.js"></script>
  <script src="js/dino-silhouettes.js"></script>
  <script>
    // ─── MJ-26 — Compte les dinos (1 à 6) ───
    const SIL = window.DINO_SILHOUETTES, LAB = window.DINO_FAMILY_LABELS;
    const ALL_FAMS = Object.keys(SIL);
    const MAX_Q = 8;

    const level = Math.max(0, Math.min(2, (window.Stars ? Stars.get('mj-26') : 0)));
    const RANGE = [[1,3],[1,5],[2,6]][level];   // min..max selon niveau

    let score = 0, streak = 0, qCount = 0, qcm = null, currentCount = 0, currentFam = null;

    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function speak(t){TTS.speak(t,{pitch:1.05,priority:true});}
    function randInt(min,max){return min+Math.floor(Math.random()*(max-min+1));}

    // ===== STANDARD GOLDEN : billes + son Mario (MP3 reel) =====
    function buildPips(){
      const box = document.getElementById('pips'); box.innerHTML = '';
      for (let i = 0; i < MAX_Q; i++){
        const d = document.createElement('div');
        d.className = 'pip' + (i === 0 ? ' cur' : ''); d.id = 'pip' + i;
        box.appendChild(d);
      }
    }
    function colorPip(i, attempts){
      const p = document.getElementById('pip' + i); if (!p) return;
      p.classList.remove('cur'); p.classList.add('v' + Math.min(attempts, 4));
      const next = document.getElementById('pip' + (i + 1)); if (next) next.classList.add('cur');
    }
    function sndMarioStar(){
      try { const a = new Audio('sounds/victory-mario-series-hq-super-smash-bros.mp3'); a.volume = 0.85; a.play().catch(() => {}); } catch (e) {}
    }

    function init(){
      buildPips();
      document.getElementById('repeatBtn').onclick = countAloud;
      nextQuestion();
    }

    function countAloud(){
      // "1, 2, 3 ! Trois dinos."
      speak([...Array(currentCount).keys()].map(i => i+1).join(', ') + ' ! ' + currentCount + ' dinos.');
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      currentCount = randInt(RANGE[0], RANGE[1]);
      currentFam = ALL_FAMS[Math.floor(Math.random()*ALL_FAMS.length)];

      // affiche currentCount silhouettes de la même famille (images variées)
      const area = document.getElementById('playArea');
      area.innerHTML = '';
      const imgs = shuffle(SIL[currentFam]);
      for (let i = 0; i < currentCount; i++){
        const img = document.createElement('img');
        img.className = 'sil';
        img.src = imgs[i % imgs.length];
        img.style.animationDelay = (i*0.12) + 's';
        area.appendChild(img);
      }
      speak('Combien de dinos ? Compte-les !');

      // choix numériques : la bonne + voisines plausibles dans la plage globale
      const correct = currentCount;
      const cand = new Set([correct]);
      while (cand.size < 3){
        const d = correct + (Math.random()<.5?-1:1)*randInt(1,2);
        if (d >= 1 && d <= 9) cand.add(d);
      }
      const opts = shuffle([...cand]);
      const box = document.getElementById('choices');
      box.innerHTML = '';
      opts.forEach(n => {
        const b = document.createElement('button');
        b.className = 'num-btn';
        b.textContent = n;
        if (n === correct) b.dataset.correct = '1';
        b.onclick = () => answer(n === correct, b);
        box.appendChild(b);
      });
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if ((res.outcome==='correct'||res.outcome==='reveal') && typeof Tracker!=='undefined') Tracker.logAnswer(res.outcome==='correct');
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); colorPip(qCount-1, res.attempts);
        countAloud();
        setTimeout(nextQuestion, 1700);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        document.querySelectorAll('.num-btn[data-correct="1"]').forEach(b=>b.classList.add('ok'));
        sndBuzz(); colorPip(qCount-1, 4);
        speak('Il y avait ' + currentCount + ' dinos.');
        setTimeout(nextQuestion, 2000);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
        speak('Compte encore !');
      }
    }


    function showEnd(){
      if (typeof Tracker!=='undefined') Tracker.endSession(score, MAX_Q*10);
      document.getElementById('app').innerHTML =
        '<div class="end-wrap">'
        + '<div class="star-stage" id="starStage"><div class="star-empty">★</div><div class="star-fill" id="starFill">★</div></div>'
        + '<div class="end-title">Super Max&nbsp;!</div>'
        + '<div class="end-sub">Tu as gagné une étoile&nbsp;!</div>'
        + '<div class="end-btns">'
        + '<a href="mj-26.html" style="background:#00c47a;">🔄 Rejouer</a>'
        + '<a href="index.html" style="background:#ffffff22;">📋 Menu</a>'
        + '</div></div>';
      requestAnimationFrame(() => {
        setTimeout(() => {
          document.getElementById('starFill').classList.add('full');
          document.getElementById('starStage').classList.add('pop');
          sndMarioStar();
        }, 120);
        setTimeout(() => { confettiBurst(70); }, 1100);
      });
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
