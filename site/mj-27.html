<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-27 – Lis le nom du dino</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    .read-panel { text-align:center; margin:10px 12px 4px; }
    .read-hint { font-size:.9rem; font-weight:700; color:#d9b382; margin-bottom:4px; }
    .read-word {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
      background:rgba(255,255,255,0.08); border:3px solid #d9a441;
      border-radius:16px; padding:10px 14px; line-height:1.1;
    }
    .syl-chip {
      font-size:1.9rem; font-weight:900; color:#fff; letter-spacing:.5px;
      background:rgba(255,255,255,0.12); border-radius:12px;
      padding:8px 12px; min-height:60px; min-width:60px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Nunito',sans-serif;
    }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; margin-top:8px; }
    .choices {
      display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
      padding:12px; max-width:520px; margin:0 auto;
    }
    .dino-card {
      background:#fff; border-radius:18px; padding:8px; border:5px solid transparent;
      box-shadow:0 5px 14px #0005; cursor:pointer; display:flex; align-items:center; justify-content:center;
      min-height:120px; transition:transform .12s, border-color .15s;
    }
    .dino-card:active { transform:scale(.94); }
    .dino-card img { width:100%; height:108px; object-fit:contain; pointer-events:none; }
    .dino-card.ok { border-color:#00c47a; background:#d6fbe7; }
    .dino-card.ko { border-color:#ff5a5a; opacity:.5; }

  </style>
</head>
<body>
  <div id="app">
    <div class="qbox">
      <div class="read-panel">
        <div class="read-hint">Lis bien… trouve ce dino 👇</div>
        <div class="read-word" id="word"></div>
      </div>
    </div>

    <div class="choices" id="choices"></div>
  </div>


  <!-- libs SPÉCIFIQUES au jeu -->
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-27 — Lis le nom du dino (LECTURE PURE, aucun son d'aide) ───
    // Affiche le nom écrit + 6 vraies images de l'encyclopédie. Max lit et trouve.
    const SRC = (typeof DINOS !== 'undefined') ? DINOS : (window.DINOS || []);
    // Ces 2 dinos n'ont pas de version _headshot.jpg dans img/dinos/paleoart/ (vérifié 2026-07-22).
    // Le onerror du <img> retomberait sur l'image paleoart complète, mais génère un 404 console
    // bruyant (échec harnais smoke) — plus propre de les exclure du pool de ce quiz plutôt que
    // de masquer l'erreur.
    const MISSING = new Set(['Corythosaurus.jpg', 'Hatzegopteryx.jpg']);
    // Pool = dinos avec image top-level valide (pas de sous-dossier, fichier présent)
    const POOL = SRC.filter(d => d.png && d.name && !d.png.includes('/') && !MISSING.has(d.png));

    // Découpage syllabique (phonétique FR) par id dino — évaluation manuelle, pas d'algo.
    // Registre : liste des syllabes uniques en bas de fichier (commentaire) pour génération
    // ElevenLabs future si le TTS navigateur déçoit.
    const SYLLABES = {
      tyrannosaurus:['T','REX'],
      spinosaurus:['SPI','NO','SAU','RE'],
      giganotosaurus:['GI','GA','NO','TO','SAU','RE'],
      carcharodontosaurus:['CAR','CHA','RO','DON','TO','SAU','RE'],
      allosaurus:['AL','LO','SAU','RE'],
      tarbosaurus:['TAR','BO','SAU','RE'],
      albertosaurus:['AL','BER','TO','SAU','RE'],
      ceratosaurus:['CÉ','RA','TO','SAU','RE'],
      dilophosaurus:['DI','LO','PHO','SAU','RE'],
      carnotaurus:['CAR','NO','TAU','RE'],
      cryolophosaurus:['CRY','O','LO','PHO','SAU','RE'],
      brachiosaurus:['BRA','CHIO','SAU','RE'],
      diplodocus:['DI','PLO','DO','CUS'],
      apatosaurus:['A','PA','TO','SAU','RE'],
      camarasaurus:['CA','MA','RA','SAU','RE'],
      amargasaurus:['A','MAR','GA','SAU','RE'],
      plateosaurus:['PLA','TÉ','O','SAU','RE'],
      ankylosaurus:['AN','KY','LO','SAU','RE'],
      euoplocephalus:['EU','O','PLO','CÉ','PHALE'],
      edmontonia:['ED','MON','TO','NIA'],
      stegosaurus:['STÉ','GO','SAU','RE'],
      kentrosaurus:['KÉN','TRO','SAU','RE'],
      triceratops:['TRI','CÉ','RA','TOPS'],
      torosaurus:['TO','RO','SAU','RE'],
      protoceratops:['PRO','TO','CÉ','RA','TOPS'],
      pentaceratops:['PEN','TA','CÉ','RA','TOPS'],
      parasaurolophus:['PA','RA','SAU','RO','LO','PHUS'],
      edmontosaurus:['ED','MON','TO','SAU','RE'],
      iguanodon:['I','GUA','NO','DON'],
      pachycephalosaurus:['PA','CHY','CÉ','PHA','LO','SAU','RE'],
      velociraptor:['VÉ','LO','CI','RAP','TOR'],
      deinonychus:['DEI','NO','NY','CHUS'],
      utahraptor:['U','TAH','RAP','TOR'],
      microraptor:['MI','CRO','RAP','TOR'],
      troodon:['TRO','O','DON'],
      gallimimus:['GAL','LI','MI','MUS'],
      oviraptor:['O','VI','RAP','TOR'],
      pteranodon:['PTÉ','RA','NO','DON'],
      quetzalcoatlus:['QUET','ZAL','CO','AT','LUS'],
      archaeopteryx:['AR','CHÉ','OP','TÉ','RYX'],
      mosasaurus:['MO','SA','SAU','RE'],
      baryonyx:['BA','RY','O','NYX'],
      therizinosaurus:['THÉ','RI','ZI','NO','SAU','RUS'],
      dimetrodon:['DI','MÉ','TRO','DON'],
      elasmosaurus:['É','LAS','MO','SAU','RE'],
      ophthalmosaurus:['OPH','TAL','MO','SAU','RE'],
      liopleurodon:['LI','O','PLEU','RO','DON'],
      archelon:['AR','CHÉ','LON'],
      shonisaurus:['SHO','NI','SAU','RE'],
      patagotitan:['TI','TA','NO','SAU','RE'],
      centrosaurus:['CEN','TRO','SAU','RE'],
      ichthyosaurus:['ICH','TYO','SAU','RE'],
      mammuthus:['MAM','MOUTH'],
      smilodon:['SMI','LO','DON'],
      megatherium:['MÉ','GA','TÉ','RI','UM'],
      paraceratherium:['PA','RA','CÉ','RA','TÉ','RI','UM'],
      glyptodon:['GLYP','TO','DON'],
      aenocyon:['LOUP','TER','RI','BLE'],
      coelodonta:['RHI','NO','LAI','NEUX'],
      titanis:['TI','TA','NIS'],
    };

    const NCHOICES = 6;
    const G = Golden.setup('mj-27');
    const MAX_Q = G.totalQ;
    const level = G.level;
    // Difficulté = ressemblance des intrus (N3 = même famille → faut VRAIMENT lire)
    const SAME_FAMILY = level >= 2;
    const MIX_FAMILY  = level === 1;

    let score = 0, streak = 0, qCount = 0, qcm = null, target = null;

    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

    // Audio retiré (retour Papa Yann 2026-07-19) : lecture pure, aucun son d'aide,
    // ni sur les syllabes ni sur le nom entier. Le mot reste affiché en chips statiques.
    function renderWord(dino){
      const box = document.getElementById('word');
      box.innerHTML = '';
      const syls = SYLLABES[dino.id] || [dino.name];
      syls.forEach(syl => {
        const span = document.createElement('span');
        span.className = 'syl-chip';
        span.textContent = syl;
        box.appendChild(span);
      });
    }

    const shell = MJ.init({
      id: 'mj-27', emoji: '📖', titre: 'Lis le nom du dino',
      golden: true,
      consigne: false,   // LECTURE PURE : aucun son d'aide auto (règle EP-033)
      regle: {
        picto: '📖🦕',
        texte: 'Lis le nom écrit, puis trouve la bonne image !',
        etapes: [
          { t: 'Je lis les syllabes 👀',
            d: 'Le nom du dino est découpé en morceaux : je les lis un par un.' },
          { t: 'Je tape la bonne image 👆',
            d: 'Parmi 6 images, une seule correspond au nom que je viens de lire.' },
          { t: 'Plus j’ai d’étoiles, plus les images se ressemblent 💪',
            d: 'Au début les dinos sont très différents. Avec les étoiles : des cousins de la même famille — il faut VRAIMENT bien lire le nom !' }
        ]
      }
    });

    function init(){
      G.buildPips();
      nextQuestion();
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      qCount++;

      target = POOL[Math.floor(Math.random()*POOL.length)];

      let distract;
      if (SAME_FAMILY){
        const sameFam = POOL.filter(d => d.famille === target.famille && d.id !== target.id);
        distract = shuffle(sameFam).slice(0, NCHOICES-1);
        if (distract.length < NCHOICES-1){ // compléter si famille trop petite
          const rest = shuffle(POOL.filter(d => d.id !== target.id && !distract.includes(d)));
          distract = distract.concat(rest).slice(0, NCHOICES-1);
        }
      } else {
        distract = shuffle(POOL.filter(d => d.id !== target.id)).slice(0, NCHOICES-1);
      }

      const opts = shuffle([{ d: target, correct:true }, ...distract.map(d => ({ d, correct:false }))]);

      renderWord(target);   // le MOT à lire, découpé en syllabes tapables

      const box = document.getElementById('choices');
      box.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'dino-card';
        if (o.correct) b.dataset.correct = '1';
        const headshot = 'img/dinos/paleoart/' + o.d.png.replace(/\.(jpg|png)$/i, '_headshot.jpg');
        const fallback = 'img/dinos/paleoart/' + o.d.png;
        b.innerHTML = '<img src="' + headshot + '" onerror="this.onerror=null;this.src=\'' + fallback + '\';" alt="">';
        b.onclick = () => answer(o.correct, b);
        box.appendChild(b);
      });
    }

    function answer(correct, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak+1 : 0;
        sndDing(); G.notePip(qCount-1, res.attempts, btn);
        setTimeout(nextQuestion, 950);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        document.querySelectorAll('.dino-card[data-correct="1"]').forEach(b=>b.classList.add('ok'));
        sndBuzz(); G.notePip(qCount-1, 4);
        setTimeout(nextQuestion, 1800);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
      }
    }


    function showEnd(){
      G.showEnd({ replayUrl: 'mj-27.html' });
    }

    init();
    });
  </script>
</body>
</html>
