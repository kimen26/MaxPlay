<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-28 – La lampe du paléontologue</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* ─── Zone de fouille dans le noir ─── */
    .dig-wrap {
      position: relative; margin: 8px auto; width: 100%; max-width: 560px;
      height: 46vh; min-height: 220px; max-height: 340px;
      border-radius: 20px; overflow: hidden; touch-action: none;
      box-shadow: 0 6px 20px #000a; background: #060606;
    }
    .dig-color, .dig-shadow {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; pointer-events: none; user-select: none;
    }
    .dig-shadow {
      /* silhouette noire visible seulement dans le halo de lumière (rayon réduit + contraste renforcé 2026-07-22) */
      filter: brightness(1.15) contrast(1.15);
      -webkit-mask-image: radial-gradient(circle 150px at var(--mx,50%) var(--my,50%), #fff 0%, #fff 30%, rgba(255,255,255,0.25) 58%, transparent 88%);
      mask-image: radial-gradient(circle 150px at var(--mx,50%) var(--my,50%), #fff 0%, #fff 30%, rgba(255,255,255,0.25) 58%, transparent 88%);
    }
    .dig-color { opacity: 0; transition: opacity .6s ease; }
    .dig-wrap.revealed .dig-color { opacity: 1; }
    .dig-wrap.revealed .dig-shadow { opacity: 0; }

    /* halo visuel doux qui suit le doigt (au-dessus, purement décoratif) — rayon réduit + contraste renforcé 2026-07-22 */
    .dig-halo {
      position: absolute; width: 300px; height: 300px; border-radius: 50%;
      left: var(--mx, 50%); top: var(--my, 50%); transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,244,200,0.30) 0%, rgba(255,244,200,0.13) 40%, rgba(255,244,200,0.04) 65%, transparent 85%);
      pointer-events: none; transition: opacity .3s;
    }
    .dig-halo-ambient {
      position: absolute; width: 440px; height: 440px; border-radius: 50%;
      left: var(--mx, 50%); top: var(--my, 50%); transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,244,200,0.07) 0%, rgba(255,244,200,0.025) 50%, transparent 80%);
      pointer-events: none; transition: opacity .3s;
    }
    .dig-hint {
      position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
      color: #ffe066cc; font-weight: 900; font-size: .95rem; pointer-events: none;
      text-shadow: 0 2px 6px #000;
    }
    .dig-wrap.touched .dig-hint { display: none; }

    .choices { display:grid; gap:12px; padding:12px 14px; justify-content:center; max-width:560px; margin:0 auto; }
    .name-btn {
      background:#fff; border-radius:18px; padding:14px 10px; border:5px solid transparent;
      box-shadow:0 5px 14px #0005; cursor:pointer; display:flex; align-items:center; justify-content:center;
      gap:8px; min-width:120px; min-height:80px; transition:transform .12s, border-color .15s;
      color:#1a1a2e; font-family:'Nunito',sans-serif; font-weight:900; font-size:1.15rem; text-align:center;
    }
    .name-btn:active { transform:scale(.93); }
    .name-btn .say {
      font-size:1.2rem; line-height:1; background:none; border:none; padding:4px; cursor:pointer;
      flex-shrink:0;
    }
    .name-btn.ok { border-color:#00c47a; background:#d6fbe7; }
    .name-btn.ko { border-color:#ff5a5a; opacity:.5; }

    .reveal-fait {
      text-align:center; color:#ffe066; font-weight:700; font-size:1.02rem;
      margin:6px 16px 0; min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="dig-wrap" id="digWrap">
      <img class="dig-color" id="digColor" alt="">
      <img class="dig-shadow" id="digShadow" alt="">
      <div class="dig-halo-ambient" id="digHaloAmbient"></div>
      <div class="dig-halo" id="digHalo"></div>
      <div class="dig-hint">👆 Bouge ton doigt dans le noir…</div>
    </div>
    <div class="reveal-fait" id="fait"></div>

    <div class="choices" id="choices"></div>
  </div>

  <!-- libs SPÉCIFIQUES au jeu -->
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script src="js/dinos-audio-manifest.js"></script>
  <script src="js/dinos-ombres.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-28 — La lampe du paléontologue ───
    // Ecran noir, halo de lumiere suit le doigt et revele une ombre chinoise.
    // Max cherche le dino a la lampe puis repond via QCM (noms savants).
    function ombrePath(d) { return DinoOmbres.ombreSrc(d.png); }

    // Pool jouable = dino avec png top-level + fait (funfact affiche a la revelation)
    const POOL = DinoOmbres.pool({ requireFait: true });

    // Silhouettes tres iconiques pour le niveau 1 (familles bien distinctes, faciles a reconnaitre)
    const ICONIC_IDS = ['triceratops','tyrannosaurus','diplodocus','stegosaurus','spinosaurus','ankylosaurus','pteranodon','brachiosaurus','velociraptor'];
    const ICONIC = POOL.filter(d => ICONIC_IDS.includes(d.id));
    const ICONIC_POOL = ICONIC.length >= 3 ? ICONIC : POOL;

    const G = Golden.setup('mj-28');
    const MAX_Q = G.totalQ;
    const level = G.level;
    const NCHOICES = level === 0 ? 3 : 4;
    // Niveau 2 : au moins 1 cousin de meme famille que la cible (discrimination fine)
    const SAME_FAMILY_MIN = level >= 2;

    let score = 0, streak = 0, qCount = 0, qcm = null, target = null;
    let dragging = false;

    const shuffle = DinoOmbres.shuffle;
    function speak(t){TTS.speak(t,{pitch:1.05,priority:true});}

    // Réf unique pour le fait audio (~15-20s) : évite le chevauchement si la question
    // suivante démarre avant la fin (setTimeout 2.4-2.6s, plus court que le clip).
    let currentFaitAudio = null;
    function stopCurrentFait() {
      if (currentFaitAudio) {
        try { currentFaitAudio.pause(); currentFaitAudio.currentTime = 0; } catch (e) { /* noop */ }
        currentFaitAudio = null;
      }
    }

    const wrap = document.getElementById('digWrap');
    const halo = document.getElementById('digHalo');
    const haloAmbient = document.getElementById('digHaloAmbient');
    let touchedOnce = false;

    function moveTorch(clientX, clientY){
      const r = wrap.getBoundingClientRect();
      const x = Math.max(0, Math.min(r.width, clientX - r.left));
      const y = Math.max(0, Math.min(r.height, clientY - r.top));
      wrap.style.setProperty('--mx', x + 'px');
      wrap.style.setProperty('--my', y + 'px');
      halo.style.setProperty('--mx', x + 'px');
      halo.style.setProperty('--my', y + 'px');
      haloAmbient.style.setProperty('--mx', x + 'px');
      haloAmbient.style.setProperty('--my', y + 'px');
      if (!touchedOnce){
        touchedOnce = true;
        wrap.classList.add('touched');
      }
    }
    function onPointerMove(e){
      if (e.touches && e.touches[0]) moveTorch(e.touches[0].clientX, e.touches[0].clientY);
      else moveTorch(e.clientX, e.clientY);
    }
    wrap.addEventListener('touchmove', (e) => { onPointerMove(e); }, { passive: true });
    wrap.addEventListener('touchstart', (e) => { onPointerMove(e); }, { passive: true });
    wrap.addEventListener('mousedown', (e) => { dragging = true; onPointerMove(e); });
    wrap.addEventListener('mousemove', (e) => { if (dragging) onPointerMove(e); });
    window.addEventListener('mouseup', () => { dragging = false; });

    const shell = MJ.init({
      id: 'mj-28', emoji: '🔦', titre: 'La lampe du paléontologue',
      golden: true,
      consigne: true,
      regle: {
        picto: '🔦🦴',
        texte: 'Cherche le dino caché dans le noir avec ta lampe !',
        etapes: [
          { t: 'Je bouge mon doigt dans le noir 👆',
            d: 'Une lumière suit mon doigt et éclaire une ombre cachée.' },
          { t: 'Je regarde bien la forme de l’ombre 👀',
            d: 'Chaque dino a une silhouette différente : cornes, dos épineux, long cou…' },
          { t: 'Je tape le bon nom savant 👆',
            d: 'Si je me trompe, le bon nom s’allume en vert, et le dino apparaît en couleur avec un fait rigolo !' },
          { t: 'Plus j’ai d’étoiles, plus les noms se ressemblent 💪',
            d: 'Au début les dinos sont très différents. Avec les étoiles : des cousins de la même famille !' }
        ]
      }
    });

    function init(){
      G.buildPips();
      nextQuestion();
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      stopCurrentFait();
      qcm = QcmRetry.create();
      qCount++;
      touchedOnce = false;

      const pool = level === 0 ? ICONIC_POOL : POOL;
      target = DinoOmbres.pick(pool);

      // Niveau 2 : au moins 1 cousin de meme famille que la cible (discrimination fine).
      // Sinon : distracteurs de familles differentes pour rester lisible aux plus jeunes.
      const distract = DinoOmbres.pickCousins(POOL, target, NCHOICES, { minCousins: SAME_FAMILY_MIN ? 1 : 0 });

      const opts = shuffle([{ d: target, correct: true }, ...distract.map(d => ({ d, correct: false }))]);

      // reset ecran de fouille
      wrap.classList.remove('revealed', 'touched');
      wrap.style.setProperty('--mx', '50%');
      wrap.style.setProperty('--my', '50%');
      document.getElementById('digShadow').src = ombrePath(target);
      document.getElementById('digColor').src = 'img/dinos/' + target.png;
      document.getElementById('fait').textContent = '';

      shell.setConsigne('Quel dino se cache dans le noir ?');

      const box = document.getElementById('choices');
      box.style.gridTemplateColumns = 'repeat(' + Math.min(opts.length, 2) + ', 1fr)';
      box.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'name-btn';
        b.dataset.name = o.d.name;
        if (o.correct) b.dataset.correct = '1';
        const say = document.createElement('span');
        say.className = 'say';
        say.textContent = '🔊';
        say.onclick = (ev) => { ev.stopPropagation(); playDinoNom(o.d.id, o.d.name); };
        const label = document.createElement('span');
        label.textContent = o.d.name;
        b.appendChild(label);
        b.appendChild(say);
        b.onclick = () => answer(o.correct, o.d, b);
        box.appendChild(b);
      });
    }

    function answer(correct, dino, btn){
      if (btn.disabled) return;
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;
      if (res.outcome === 'correct'){
        btn.classList.add('ok'); score += res.points;
        streak = res.streakInc ? streak + 1 : 0;
        revealWin(target);
        G.notePip(qCount - 1, res.attempts, btn);
        setTimeout(nextQuestion, 2400);
      } else if (res.outcome === 'reveal'){
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        QcmRetry.revealCorrect(document.getElementById('choices'));
        revealWin(target);
        const okEl = document.querySelector('.name-btn[data-correct="1"]');
        sndBuzz(); G.notePip(qCount - 1, 4, okEl);
        setTimeout(nextQuestion, 2600);
      } else {
        btn.classList.add('ko'); btn.disabled = true; streak = 0;
        sndBuzz();
        speak('Essaie encore !');
      }
    }

    function revealWin(dino){
      wrap.classList.add('revealed');
      sndDing();
      document.getElementById('fait').textContent = dino.fait || '';
      stopCurrentFait();
      speak('Bravo ! C’est le ' + dino.name + ' !');
      if (dino.fait) {
        currentFaitAudio = playDinoFunfact(dino.id, dino.fait);
      }
    }

    function showEnd(){
      G.showEnd({ replayUrl: 'mj-28.html' });
    }

    init();
    });
  </script>
</body>
</html>
