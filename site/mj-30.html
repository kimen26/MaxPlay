<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-30 – Range-les par taille</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    .instruction-text { text-align:center; font-size:1.25rem; font-weight:900; color:#ffe066; margin:8px 12px 2px; }
    .question-counter { text-align:center; font-size:.85rem; opacity:.7; margin-top:4px; }
    .tts-btn { min-height:80px;
      display:flex; align-items:center; gap:8px; margin:6px auto;
      background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff; border:none; cursor:pointer;
      border-radius:25px; padding:9px 20px; font-size:.95rem; font-weight:900;
      box-shadow:0 4px 12px #0005;
    }
    .tts-btn:active { transform:scale(.94); }

    /* ── Zone de jeu ── */
    .game-zone { flex:1; display:flex; flex-direction:column; padding:6px 10px; min-height:0; }
    .arrow-row { display:flex; align-items:center; justify-content:center; gap:8px; color:#fff; font-weight:900; font-size:.95rem; opacity:.85; margin:2px 0; }
    .arrow-row .lbl-small { font-size:1.3rem; }
    .arrow-row .lbl-big { font-size:1.8rem; }

    /* Ombres à trier (rangée du haut)
       2026-08-10 (retour PY #6385) : JAMAIS de retour à la ligne — les cartes
       rétrécissent (flex-shrink + aspect-ratio) pour tenir toujours en UNE ligne. */
    .tray {
      display:flex; gap:8px; justify-content:center; align-items:flex-end;
      flex-wrap:nowrap; padding:8px 4px; min-height:110px; position:relative;
    }
    .shadow-tile {
      width:88px; flex:0 1 88px; min-width:0; aspect-ratio:88/100; height:auto; box-sizing:border-box;
      background:#fff; border-radius:16px;
      border:4px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
      cursor:grab; touch-action:none; transition:border-color .15s, transform .1s, box-shadow .15s;
      position:relative; z-index:2; padding:6px;
    }
    .shadow-tile img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
    .shadow-tile.selected { border-color:#ffe066; box-shadow:0 0 0 3px #ffe06666; }
    .shadow-tile.dragging { cursor:grabbing; z-index:50; box-shadow:0 8px 22px #0007; transform:scale(1.06); }
    .shadow-tile.placed { opacity:.28; pointer-events:none; }

    /* Emplacements (rangée du bas) — même règle : une seule ligne, taille adaptative */
    .slots-row { display:flex; gap:8px; justify-content:center; align-items:center; padding:10px 4px 4px; flex-wrap:nowrap; }
    .slot {
      width:96px; flex:0 1 96px; min-width:0; aspect-ratio:96/108; height:auto; box-sizing:border-box;
      border-radius:16px; border:4px dashed rgba(255,255,255,0.35);
      display:flex; align-items:center; justify-content:center; position:relative;
      background:rgba(255,255,255,0.04); transition:border-color .15s, background .15s;
      touch-action:none;
    }
    .slot .idx { position:absolute; top:4px; left:8px; font-size:.8rem; font-weight:900; color:#ffe06699; z-index:1; }
    .slot.hover-ok { border-color:#00c47a; background:rgba(0,196,122,0.18); border-style:solid; }
    .slot.filled { border-style:solid; border-color:#00c47a; background:#fff; }
    .slot.filled img { width:100%; height:100%; object-fit:contain; padding:6px; box-sizing:border-box; }
    .slot.swap-anim { animation: swapPulse .5s ease; }
    @keyframes swapPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(.92);} }

    .validate-btn {
      display:block; margin:10px auto 6px; background:linear-gradient(135deg,#ff9800,#ffb74d); color:#3a2500;
      border:none; border-radius:22px; padding:12px 30px; font-size:1.05rem; font-weight:900;
      box-shadow:0 5px 14px #0006; cursor:pointer; min-height:80px;
    }
    .validate-btn:disabled { opacity:.35; cursor:default; }
    .validate-btn:not(:disabled):active { transform:scale(.95); }

    /* ── Révélation échelle honnête ── */
    .reveal-wrap { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:0 10px 10px; min-height:0; }
    .reveal-ground {
      display:flex; align-items:flex-end; justify-content:center; gap:14px;
      border-bottom:4px solid rgba(255,255,255,0.5); padding:10px 10px 6px; min-height:180px; position:relative;
      background:rgba(255,255,255,0.9); border-radius:14px 14px 0 0;
    }
    .reveal-item { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
    .reveal-item img { object-fit:contain; opacity:.95; transition:width 1s cubic-bezier(.22,1,.36,1), height 1s cubic-bezier(.22,1,.36,1); }
    .reveal-item .m-label { margin-top:4px; font-weight:900; color:#ffe066; font-size:.95rem; background:#0006; padding:2px 8px; border-radius:10px; opacity:0; transition:opacity .4s; }
    .reveal-item .m-label.show { opacity:1; }
    .kid-ref { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; opacity:.85; }
    .kid-ref svg { display:block; }
    .kid-ref .lbl { font-size:.7rem; font-weight:900; color:#3a2500; background:#ffe066; padding:1px 6px; border-radius:8px; margin-top:2px; }

    .next-btn {
      display:block; margin:8px auto 0; background:linear-gradient(135deg,#00c47a,#33e0a0); color:#003b24;
      border:none; border-radius:22px; padding:12px 30px; font-size:1.05rem; font-weight:900;
      box-shadow:0 5px 14px #0006; cursor:pointer; min-height:80px; opacity:0; transition:opacity .4s;
    }
    .next-btn.show { opacity:1; }
    .next-btn:active { transform:scale(.95); }

    .mode-badge { text-align:center; font-size:.8rem; color:#fff9; font-weight:900; margin-top:2px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="mode-badge" id="modeBadge"></div>

    <div class="game-zone" id="gameZone">
      <div class="arrow-row"><span class="lbl-small" id="lblSmall">🔹 petit</span><span>→</span><span class="lbl-big" id="lblBig">🔷 GRAND</span></div>
      <div class="tray" id="tray"></div>
      <div class="slots-row" id="slots"></div>
      <button class="validate-btn" id="validateBtn" disabled>C’est bon !</button>
    </div>

    <div class="reveal-wrap" id="revealWrap" style="display:none;">
      <div class="reveal-ground" id="revealGround"></div>
      <button class="next-btn" id="nextBtn">Suivant →</button>
    </div>
  </div>

  <script src="js/lang.js"></script>
  <script src="js/dinos-audio-manifest.js"></script>
  <script src="js/mj-kit.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>

      {id:'mammuthus',name:'Mammouth',taille_m:5.5,hauteur_m:3.3,poids_t:5,png:'Mammuthus.jpg'},
      {id:'smilodon',name:'Smilodon',taille_m:1.75,hauteur_m:1,poids_t:0.25,png:'Smilodon.jpg'},
      {id:'megatherium',name:'Mégathérium',taille_m:6,hauteur_m:3.5,poids_t:4,png:'Megatherium.jpg'},
      {id:'paraceratherium',name:'Paracérathérium',taille_m:8,hauteur_m:5,poids_t:17,png:'Paraceratherium.jpg'},
      {id:'glyptodon',name:'Glyptodon',taille_m:3.3,hauteur_m:1.5,poids_t:1,png:'Glyptodon.jpg'},
      {id:'aenocyon',name:'Loup terrible',taille_m:1.7,hauteur_m:0.85,poids_t:0.07,png:'Aenocyon.jpg'},
      {id:'coelodonta',name:'Rhino laineux',taille_m:3.5,hauteur_m:1.9,poids_t:2.5,png:'Coelodonta.jpg'},
      {id:'titanis',name:'Titanis',taille_m:1.9,hauteur_m:1.9,poids_t:0.3,png:'Titanis.jpg'},

    function shadowSrc(d){ return 'img/dinos/ombres/' + d.png.replace(/\.(jpg|png)$/i,'') + '_ombre.png'; }

    document.title = 'MJ-30 – ' + MJi18n.titre('mj-30', 'Range-les par taille');

    const shell = MJ.init({
      id: 'mj-30', emoji: '📏', titre: MJi18n.titre('mj-30', 'Range-les par taille'),
      golden: true,
      consigne: true,
      regle: {
        picto: '🦕📏🦖',
        texte: 'Range les dinos mystères du plus petit au plus GRAND !',
        etapes: [
          { t: 'Je regarde les ombres 👀',
            d: 'Des dinos mystères ! Il y a un petit, un moyen… et un géant.' },
          { t: 'Je glisse chaque ombre dans une case 👆',
            d: 'Le plus petit à gauche, le plus GRAND à droite. Je peux échanger deux cases si je change d’avis.' },
          { t: 'Je tape « C’est bon ! » ✓',
            d: 'Les dinos sortent de l’ombre : on découvre leur VRAIE taille en mètres, à côté d’un enfant comme toi !' },
          { t: 'Plus j’ai d’étoiles, plus c’est costaud 💪',
            d: 'Plus de dinos à ranger… et parfois il faut les ranger par POIDS ⚖️ !' }
        ]
      }
    });
    const G = shell.G;
    const MAX_Q = G.totalQ;
    const level = G.level; // 0,1,2

    let qCount = 0, qcm = null;
    let curSet = [];       // dinos de la manche courante, DÉJÀ triés petit→grand
    let curMeasure = 'taille_m';
    let selected = null;   // id sélectionné (mode tap-puis-case)
    let placements = {};   // slotIndex -> dino.id
    let dragState = null;
    let currentDinoAudio = null; // réf unique : stoppe le son en cours avant d'en jouer un nouveau

    const shuffle = MJKit.shuffle;
    function speak(t){ TTS.speak(t,{pitch:1.05,priority:true}); }
    function fr(n){ return (Math.round(n*10)/10).toString().replace('.', ' virgule '); }

    // Joue le nom du dino (voix réelle, fallback TTS), en stoppant le son en cours.
    function playDinoNomExclusive(id, fallbackName, opts) {
      if (currentDinoAudio) {
        try { currentDinoAudio.pause(); currentDinoAudio.currentTime = 0; } catch (e) { /* noop */ }
      }
      currentDinoAudio = playDinoNom(id, fallbackName, opts);
    }

    // ── Tirage d'un set respectant un ratio minimal entre voisins triés ──
    function pickSet(n, minRatio, measure){
      let best = null;
      for (let attempt = 0; attempt < 300; attempt++){
        const cand = shuffle(DINO_POOL).slice(0, n).sort((a,b)=>a[measure]-b[measure]);
        // éviter valeurs quasi identiques (division ~1)
        let ok = true, minR = Infinity;
        for (let i=1;i<cand.length;i++){
          const r = cand[i][measure] / cand[i-1][measure];
          if (r < minR) minR = r;
          if (r < minRatio) { ok = false; }
        }
        if (ok) return cand;
        if (!best || minR > best.minR) best = { cand, minR };
      }
      return best ? best.cand : shuffle(DINO_POOL).slice(0, n).sort((a,b)=>a[measure]-b[measure]);
    }

    function buildQuestionSet(){
      if (level === 0){
        curMeasure = 'taille_m';
        curSet = pickSet(3, 3.0, curMeasure);
      } else if (level === 1){
        curMeasure = 'taille_m';
        curSet = pickSet(4, 1.5, curMeasure);
      } else {
        curMeasure = Math.random() < 0.5 ? 'poids_t' : 'taille_m';
        curSet = pickSet(4, 1.15, curMeasure);
      }
    }

    function init(){
      G.buildPips();
      document.getElementById('validateBtn').textContent = MJi18n.t('mj-30', 'cestBon', 'C’est bon !');
      document.getElementById('nextBtn').textContent = MJi18n.t('mj-30', 'suivant', 'Suivant →');
      document.getElementById('lblSmall').textContent = '🔹 ' + MJi18n.t('mj-30', 'petit', 'petit');
      document.getElementById('lblBig').textContent = '🔷 ' + MJi18n.t('mj-30', 'grand', 'GRAND');
      document.getElementById('validateBtn').onclick = onValidate;
      document.getElementById('nextBtn').onclick = () => { qCount++; nextQuestion(); };
      nextQuestion();
    }

    function currentInstruction(){
      return curMeasure === 'poids_t'
        ? MJi18n.t('mj-30', 'consigne.poids', 'Range-les du plus léger au plus lourd !')
        : MJi18n.t('mj-30', 'consigne.taille', 'Range-les du plus petit au plus grand !');
    }

    function nextQuestion(){
      if (qCount >= MAX_Q) return showEnd();
      qcm = QcmRetry.create();
      buildQuestionSet();
      selected = null;
      placements = {};

      document.getElementById('gameZone').style.display = 'flex';
      document.getElementById('revealWrap').style.display = 'none';
      document.getElementById('nextBtn').classList.remove('show');

      const modeBadge = document.getElementById('modeBadge');
      modeBadge.textContent = curMeasure === 'poids_t'
        ? '⚖️ ' + MJi18n.t('mj-30', 'modePoids', 'Par poids')
        : '📏 ' + MJi18n.t('mj-30', 'modeTaille', 'Par taille');

      shell.setConsigne(currentInstruction());

      renderTrayAndSlots();
      updateValidateBtn();
    }

    function renderTrayAndSlots(){
      const tray = document.getElementById('tray');
      const slots = document.getElementById('slots');
      tray.innerHTML = ''; slots.innerHTML = '';

      // Ombres affichées à la MÊME taille (convention de jeu) — ordre mélangé
      const shuffled = shuffle(curSet);
      shuffled.forEach(d => {
        const tile = document.createElement('div');
        tile.className = 'shadow-tile';
        tile.dataset.id = d.id;
        tile.dataset.taille = d[curMeasure];
        tile.innerHTML = '<img src="' + shadowSrc(d) + '" alt="">';
        tile.addEventListener('pointerdown', onDragStart);
        tile.addEventListener('click', () => onTapTile(d.id));
        tray.appendChild(tile);
      });

      curSet.forEach((d, i) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.index = i;
        slot.innerHTML = '<span class="idx">' + (i+1) + '</span>';
        slot.addEventListener('pointerdown', (e) => onSlotPointerDown(e, i));
        slot.addEventListener('click', () => onTapSlot(i));
        slots.appendChild(slot);
      });
    }

    // ── Mode tap : tap ombre (dit juste son NOM + sélectionne) puis tap case ──
    // 2026-08-10 (retour PY #6385) : plus JAMAIS de placement verrouillé —
    // tap case pleine = reprendre la carte · tap case pleine avec une carte
    // sélectionnée = échange · idem en drag (drop sur case pleine = échange).
    function onTapTile(id){
      if (isPlaced(id)) return;
      if (consumeGhostClick()) return;
      document.querySelectorAll('.shadow-tile').forEach(t => t.classList.remove('selected'));
      if (selected === id){ selected = null; return; }
      selected = id;
      const tile = document.querySelector('.shadow-tile[data-id="'+id+'"]');
      if (tile) tile.classList.add('selected');
      // tap = juste le NOM (retour PY 2026-07-27 #6316 : pas la fiche complète)
      const d = curSet.find(x => x.id === id);
      if (d) playDinoNomExclusive(d.id, d.name);
    }

    function onTapSlot(i){
      if (consumeGhostClick()) return;
      if (placements[i] != null){
        if (selected != null){
          // échange : la carte choisie prend la case, l'occupant retourne en haut
          const id = selected;
          selected = null;
          document.querySelectorAll('.shadow-tile').forEach(t => t.classList.remove('selected'));
          removeFromSlot(i);
          placeInSlot(id, i);
        } else {
          // reprendre : la carte retourne en haut, replaçable à volonté
          removeFromSlot(i);
        }
        return;
      }
      if (selected == null) return;
      const id2 = selected;
      selected = null;
      document.querySelectorAll('.shadow-tile').forEach(t => t.classList.remove('selected'));
      placeInSlot(id2, i);
    }

    function isPlaced(id){ return Object.values(placements).includes(id); }

    function placeInSlot(id, i){
      // Si un autre dino occupait déjà (ne devrait pas arriver, cases pleines filtrées), no-op
      placements[i] = id;
      const tile = document.querySelector('.shadow-tile[data-id="'+id+'"]');
      if (tile) { tile.classList.add('placed'); tile.classList.remove('selected','dragging'); }
      const slot = document.querySelector('.slot[data-index="'+i+'"]');
      const d = curSet.find(x => x.id === id);
      if (slot){
        slot.classList.add('filled');
        slot.innerHTML = '<span class="idx">' + (i+1) + '</span><img src="' + shadowSrc(d) + '" alt="">';
      }
      // Annonce le nom du dino placé (Papa Yann : "on ne voit pas bien qui c'est")
      if (d) playDinoNomExclusive(d.id, d.name);
      updateValidateBtn();
    }

    function removeFromSlot(i){
      const id = placements[i];
      if (id == null) return;
      delete placements[i];
      const tile = document.querySelector('.shadow-tile[data-id="'+id+'"]');
      if (tile) tile.classList.remove('placed');
      const slot = document.querySelector('.slot[data-index="'+i+'"]');
      if (slot){ slot.classList.remove('filled'); slot.innerHTML = '<span class="idx">' + (i+1) + '</span>'; }
      updateValidateBtn();
    }

    function updateValidateBtn(){
      const filled = Object.keys(placements).length;
      document.getElementById('validateBtn').disabled = filled < curSet.length;
    }

    // ── Mode drag (pointer events, souris+tactile+stylet) ──
    // On peut REPRENDRE une carte déjà posée (drag depuis la case) et ÉCHANGER
    // deux cases (drop sur une case pleine → l'occupant prend la case d'origine,
    // ou retourne en haut si la carte venait du haut). Retour PY #6385.
    // Clic fantôme : un vrai drag déclenche un click résiduel juste après le
    // pointerup → on avale exactement UN click (le fantôme), puis c'est fini.
    // (Pas de fenêtre de temps : elle bloquait les vrais taps rapides.)
    let ghostClick = false;
    function consumeGhostClick(){
      if (!ghostClick) return false;
      ghostClick = false;
      return true;
    }
    // Quel que soit l'endroit où tombe le clic fantôme (tuile, case, ou leur
    // ancêtre commun après un drag entre deux cases — parfois AUCUN click ne
    // part du tout), on désarme au plus tard au PROCHAIN pointerdown : un vrai
    // tap commence toujours par un pointerdown, le fantôme jamais.
    document.addEventListener('click', () => {
      if (ghostClick) setTimeout(() => { ghostClick = false; }, 0);
    }, true);
    document.addEventListener('pointerdown', () => { ghostClick = false; }, true);

    function onDragStart(e){
      const tile = e.currentTarget;
      if (tile.classList.contains('placed')) return;
      e.preventDefault();
      selected = null;
      document.querySelectorAll('.shadow-tile').forEach(t => t.classList.remove('selected'));
      tile.setPointerCapture(e.pointerId);
      const rect = tile.getBoundingClientRect();
      dragState = { tile, origin: { type:'tray' }, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top, moved:false };
      tile.classList.add('dragging');
      tile.style.position = 'fixed';
      tile.style.left = rect.left + 'px';
      tile.style.top = rect.top + 'px';
      tile.style.width = rect.width + 'px';
      tile.style.height = rect.height + 'px';
      tile.style.margin = '0';
    }

    // Drag depuis une case pleine : on « reprend » la carte — elle quitte la case
    // et se colle sous le doigt. (Si une carte est sélectionnée, on NE drague pas :
    // on laisse le clic faire l'échange.)
    function onSlotPointerDown(e, i){
      const id = placements[i];
      if (id == null) return;
      if (selected != null) return;
      e.preventDefault();
      e.stopPropagation();
      removeFromSlot(i);
      const tile = document.querySelector('.shadow-tile[data-id="'+id+'"]');
      const slotEl = document.querySelector('.slot[data-index="'+i+'"]');
      if (!tile || !slotEl) return;
      tile.setPointerCapture(e.pointerId);
      const sr = slotEl.getBoundingClientRect();
      dragState = { tile, origin: { type:'slot', index:i }, offsetX: sr.width/2, offsetY: sr.height/2, moved:false };
      tile.classList.add('dragging');
      tile.style.position = 'fixed';
      tile.style.margin = '0';
      tile.style.width = sr.width + 'px';
      tile.style.height = sr.height + 'px';
      tile.style.left = (e.clientX - sr.width/2) + 'px';
      tile.style.top = (e.clientY - sr.height/2) + 'px';
    }
    document.addEventListener('pointermove', (e) => {
      if (!dragState) return;
      dragState.moved = true;
      const { tile, offsetX, offsetY } = dragState;
      tile.style.left = (e.clientX - offsetX) + 'px';
      tile.style.top = (e.clientY - offsetY) + 'px';
      highlightSlot(tile);
    });
    document.addEventListener('pointerup', (e) => {
      if (!dragState) return;
      const { tile, moved, origin } = dragState;
      tile.classList.remove('dragging');
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover-ok'));
      if (!moved){
        // pas de vrai drag → laisse le click gérer le mode tap
        resetTilePosition(tile);
        dragState = null;
        return;
      }
      ghostClick = true; // le clic fantôme qui suit un vrai drag sera avalé (une fois)
      const slotEl = findNearestSlot(tile);
      dragState = null;
      if (slotEl){
        const j = parseInt(slotEl.dataset.index, 10);
        resetTilePosition(tile);
        if (placements[j] != null){
          // case pleine → échange : l'occupant prend la case d'origine
          // (ou retourne en haut si la carte venait du haut)
          const displaced = placements[j];
          removeFromSlot(j);
          if (origin && origin.type === 'slot') placeInSlot(displaced, origin.index);
        }
        placeInSlot(tile.dataset.id, j);
      } else {
        resetTilePosition(tile);
      }
    });
    document.addEventListener('pointercancel', () => {
      if (dragState) { resetTilePosition(dragState.tile); dragState = null; }
    });

    function resetTilePosition(tile){
      tile.style.position = ''; tile.style.left = ''; tile.style.top = '';
      tile.style.width = ''; tile.style.height = ''; tile.style.margin = '';
    }

    function highlightSlot(tile){
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover-ok'));
      const slotEl = findNearestSlot(tile);
      if (slotEl) slotEl.classList.add('hover-ok'); // pleines comprises : l'échange est permis
    }

    function findNearestSlot(tile){
      const r = tile.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      let best = null, bestDist = Infinity;
      document.querySelectorAll('.slot').forEach(s => {
        const sr = s.getBoundingClientRect();
        const scx = sr.left + sr.width/2, scy = sr.top + sr.height/2;
        const d = Math.hypot(cx-scx, cy-scy);
        if (d < bestDist){ bestDist = d; best = s; }
      });
      return best && bestDist < 140 ? best : null;
    }

    // ── Validation ──
    function onValidate(){
      const order = Object.keys(placements).sort((a,b)=>a-b).map(k => placements[k]);
      const expected = curSet.map(d => d.id); // curSet déjà trié petit→grand
      const correct = order.every((id, i) => id === expected[i]);
      const res = QcmRetry.handle(qcm, correct);
      if (res.outcome === 'ignored') return;

      if (res.outcome === 'correct'){
        sndDing();
        G.notePip(qCount, res.attempts, document.getElementById('validateBtn'));
        setTimeout(showReveal, 400);
      } else if (res.outcome === 'reveal'){
        sndBuzz();
        G.notePip(qCount, 4, document.getElementById('validateBtn'));
        SoundPool.phrase('regardons-ensemble', MJi18n.t('mj-30', 'regardonsEnsemble', 'Regardons ensemble !'));
        setTimeout(showReveal, 900);
      } else {
        // Erreur douce : échange les deux mal placés avec explication, sans buzz punitif
        sndBuzz();
        fixWorstSwap(order, expected);
      }
    }

    // Trouve la première paire mal ordonnée et l'échange en douceur avec explication.
    function fixWorstSwap(order, expected){
      let i = 0;
      while (i < order.length && order[i] === expected[i]) i++;
      if (i >= order.length) { document.getElementById('validateBtn').disabled = false; return; }
      // trouve où se trouve expected[i] actuellement
      let j = order.indexOf(expected[i]);
      if (j === i || j === -1) j = i + 1 < order.length ? i + 1 : i;

      const dinoI = curSet.find(d => d.id === order[i]);
      const dinoJ = curSet.find(d => d.id === order[j]);
      const slotI = document.querySelector('.slot[data-index="'+i+'"]');
      const slotJ = document.querySelector('.slot[data-index="'+j+'"]');
      if (slotI) slotI.classList.add('swap-anim');
      if (slotJ) slotJ.classList.add('swap-anim');

      // échange les placements
      const tmp = placements[i]; placements[i] = placements[j]; placements[j] = tmp;
      // re-render des deux cases concernées
      [i, j].forEach(idx => {
        const id = placements[idx];
        const d = curSet.find(x => x.id === id);
        const s = document.querySelector('.slot[data-index="'+idx+'"]');
        if (s) s.innerHTML = '<span class="idx">' + (idx+1) + '</span><img src="' + shadowSrc(d) + '" alt="">';
      });
      setTimeout(() => {
        if (slotI) slotI.classList.remove('swap-anim');
        if (slotJ) slotJ.classList.remove('swap-anim');
      }, 500);

      const big = dinoI[curMeasure] > dinoJ[curMeasure] ? dinoI : dinoJ;
      const small = big === dinoI ? dinoJ : dinoI;
      const wordBig = curMeasure === 'poids_t'
        ? MJi18n.t('mj-30', 'plusLourd', 'plus LOURD')
        : MJi18n.t('mj-30', 'plusGrand', 'PLUS GRAND');
      speak(MJi18n.t('mj-30', 'comparaison', 'Le {big} est {mot} que le {small} !', { big: big.name, mot: wordBig, small: small.name }));
    }

    // ── Révélation à l'échelle honnête ──
    function showReveal(){
      document.getElementById('gameZone').style.display = 'none';
      const wrap = document.getElementById('revealWrap');
      wrap.style.display = 'flex';
      const ground = document.getElementById('revealGround');
      ground.innerHTML = '';

      const maxVal = Math.max(...curSet.map(d => d[curMeasure]));
      const MAX_PX = 260; // hauteur max d'affichage pour le plus grand
      const MIN_PX = 26;

      // Référence enfant 1m (SVG simple)
      const kidPxPerM = curMeasure === 'taille_m' ? (MAX_PX * (1/maxVal)) : null;

      curSet.forEach((d, i) => {
        const item = document.createElement('div');
        item.className = 'reveal-item';
        const ratio = d[curMeasure] / maxVal;
        const px = Math.max(MIN_PX, Math.round(MAX_PX * ratio));
        const img = document.createElement('img');
        img.src = shadowSrc(d);
        img.style.width = '6px'; img.style.height = '6px'; // départ petit, anime vers la vraie taille
        item.appendChild(img);
        const label = document.createElement('div');
        label.className = 'm-label';
        label.textContent = curMeasure === 'poids_t'
          ? (d.poids_t >= 1 ? Math.round(d.poids_t) + ' ' + MJi18n.t('mj-30', 'unite.tCourt', 't') : Math.round(d.poids_t*1000) + ' ' + MJi18n.t('mj-30', 'unite.kgCourt', 'kg'))
          : fr(d.taille_m) + ' ' + MJi18n.t('mj-30', 'unite.mCourt', 'm');
        item.appendChild(label);
        ground.appendChild(item);

        setTimeout(() => {
          img.style.width = px + 'px';
          img.style.height = px + 'px';
          setTimeout(() => label.classList.add('show'), 550);
        }, 120 + i * 180);
      });

      // Silhouette enfant 1m pour référence (seulement en mode taille)
      if (curMeasure === 'taille_m'){
        const kidH = Math.max(MIN_PX, Math.round(MAX_PX * (1/maxVal)));
        const kid = document.createElement('div');
        kid.className = 'kid-ref';
        kid.innerHTML = '<svg width="' + Math.round(kidH*0.4) + '" height="' + kidH + '" viewBox="0 0 40 100">'
          + '<circle cx="20" cy="12" r="10" fill="#ff8a3d"/>'
          + '<rect x="10" y="24" width="20" height="42" rx="8" fill="#ff8a3d"/>'
          + '<rect x="4" y="66" width="12" height="30" rx="5" fill="#ff8a3d"/>'
          + '<rect x="24" y="66" width="12" height="30" rx="5" fill="#ff8a3d"/>'
          + '</svg><span class="lbl">' + MJi18n.t('mj-30', 'unite.reperEnfant', '1 m (toi)') + '</span>';
        ground.appendChild(kid);
      }

      // TTS : énonce les vraies mesures dans l'ordre petit→grand
      const phrase = curSet.map(d => {
        const val = curMeasure === 'poids_t'
          ? (d.poids_t >= 1 ? Math.round(d.poids_t) + ' ' + MJi18n.t('mj-30', 'unite.tonnes', 'tonnes') : Math.round(d.poids_t*1000) + ' ' + MJi18n.t('mj-30', 'unite.kilos', 'kilos'))
          : fr(d.taille_m) + ' ' + MJi18n.t('mj-30', 'unite.metres', 'mètres');
        return MJi18n.t('mj-30', 'annonceMesure', 'Le {nom} : {val} !', { nom: d.name, val: val });
      }).join(' ');
      setTimeout(() => speak(phrase), 700);

      document.getElementById('nextBtn').classList.add('show');
    }

    function showEnd(){
      G.showEnd({ replayUrl: 'mj-30.html' });
    }

    init();
    });
  </script>
