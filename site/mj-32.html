      // douce cohérent avec celui déjà en place pour `fills` (cf. figée mj-32.md).
      currentDecorId = piece.decorId || null;
      loadLineart(dino, piece.fills, currentDecorId);
    }

    function askDelete(id) {
      pendingDeleteId = id;
      askConfirm(MJi18n.t('mj-32', 'supprimerCeDessin', 'Supprimer ce dessin ?'), (yes) => {
        if (yes && pendingDeleteId) {
          deleteFromGallery(pendingDeleteId);
          renderGallery();
        }
        pendingDeleteId = null;
      });
    }

    function confirmDelete(doDelete) {
      confirmAnswer(doDelete);
    }

    // ─── Modal de confirmation générique (HO-MJ-09 chantier B) ───
    // Réutilise le même #confirmModal que la suppression d'œuvre (askDelete plus haut,
    // ré-écrit par-dessus ce mécanisme) plutôt que d'en créer un second : un seul enfant
    // à 4 ans ne verra jamais deux modales de confirmation différentes se chevaucher,
    // et un seul jeu de boutons Oui/Non à maintenir. `pendingConfirmCb(yes)` est appelé
    // une fois puis oublié. Message posé dynamiquement (askDelete et le changement de
    // décor n'ont pas le même texte).
    let pendingConfirmCb = null;
    function askConfirm(message, cb) {
      pendingConfirmCb = cb;
      document.getElementById('confirmMsg').textContent = message;
      document.getElementById('confirmModal').classList.remove('hidden');
    }
    function confirmAnswer(yes) {
      document.getElementById('confirmModal').classList.add('hidden');
      const cb = pendingConfirmCb;
      pendingConfirmCb = null;
      // Message repose sur son texte par défaut (suppression) pour le prochain appel
      // implicite (askDelete le repose de toute façon à chaque ouverture) — pas besoin
      // de le réinitialiser ici.
      if (cb) cb(yes);
    }

    // ═══════════════ Sous-menu Décors (HO-MJ-09 chantier B) ═══════════════
    function decorDisplayName(id) {
      return MJi18n.t('mj-32', 'decors.' + id, DECOR_FR_NAMES[id] || id);
    }

    function buildDecorGrid() {
      const grid = document.getElementById('decorGrid');
      grid.innerHTML = '';
      // "Aucun décor" en première case : revient au canvas carré historique, toujours
      // proposé (un enfant qui n'aime pas son choix doit pouvoir revenir en arrière).
      const none = document.createElement('div');
      none.className = 'decor-card' + (!currentDecorId ? ' sel' : '');
      none.innerHTML = '<span class="demoji">🚫</span><span class="dname">' + MJi18n.t('mj-32', 'decors.aucun', 'Aucun') + '</span>';
      none.onclick = () => chooseDecor(null);
      grid.appendChild(none);
      DECORS.forEach(d => {
        const card = document.createElement('div');
        card.className = 'decor-card' + (currentDecorId === d.id ? ' sel' : '');
        card.innerHTML = '<span class="demoji">' + d.emoji + '</span><span class="dname">' + decorDisplayName(d.id) + '</span>';
        card.onclick = () => chooseDecor(d.id);
        grid.appendChild(card);
      });
    }

    function openDecorMenu() {
      buildDecorGrid();
      document.getElementById('decorModal').classList.remove('hidden');
    }
    function closeDecorMenu() {
      document.getElementById('decorModal').classList.add('hidden');
    }

    // Applique le décor choisi (ou son retrait) en recomposant le canvas. Si un dessin
    // non vierge existe déjà (fillHistory non vide), demande confirmation avant de
    // recomposer : changer de fond force un rechargement complet du canvas (nouvelles
    // dimensions possibles, paysage <-> carré), donc TOUTES les couleurs déjà posées
    // disparaissent avec le lineart précédent — décision du handoff ("le plus simple et
    // le plus honnête pour un enfant est de demander confirmation si le dessin n'est pas
    // vierge"). Un choix identique au décor déjà actif ne redemande rien (rien à perdre).
    function chooseDecor(decorId) {
      if (decorId === currentDecorId) { closeDecorMenu(); return; }
      const apply = () => {
        closeDecorMenu();
        currentDecorId = decorId;
        loadLineart(currentDino, null, currentDecorId);
      };
      if (fillHistory.length) {
        closeDecorMenu();
        askConfirm(MJi18n.t('mj-32', 'decors.confirmerChangement', 'Changer de décor efface les couleurs déjà posées. Continuer ?'), (yes) => {
          if (yes) apply();
        });
      } else {
        apply();
      }
    }

    // Repli FR en dur si une clé decors.<id> manque du pack de traduction (même principe
    // que le reste du fichier : le FR est le canon, jamais de trou visible pour l'enfant).
    const DECOR_FR_NAMES = { desert: 'Désert', foret: 'Forêt', montagne: 'Montagne', neige: 'Neige', volcan: 'Volcan' };

    // ═══════════════ Init ═══════════════
    // HO-MJ-11 : "Autre dino" (atelier) et "Colorier un autre dino !" (galerie) ramènent
    // à la grille de la MÊME famille si une famille était active (cas courant : l'enfant
    // recolorie un autre dino du même groupe), sinon à l'écran des familles.
    function backToChoice() {
      document.getElementById('screenAtelier').classList.add('hidden');
      document.getElementById('screenGallery').classList.add('hidden');
      document.getElementById('screenChoice').classList.remove('hidden');
      if (currentFamilyId) {
        buildGrid(currentFamilyId);
        document.getElementById('familyView').classList.add('hidden');
        document.getElementById('dinoView').classList.remove('hidden');
      } else {
        document.getElementById('dinoView').classList.add('hidden');
        document.getElementById('familyView').classList.remove('hidden');
      }
    }

    // Textes statiques du DOM (boutons, titres d'écran, modale) traduits une fois au
    // démarrage — le FR d'origine reste le repli si la clé est absente du pack.
    function applyStaticUi() {
      document.getElementById('galleryBtn').textContent = '🖼️ ' + MJi18n.t('mj-32', 'maGalerie', 'Ma galerie');
      document.getElementById('familyTitle').textContent = MJi18n.t('mj-32', 'choisisUneFamille', 'Choisis une famille de dinos !');
      document.getElementById('backFamilyBtn').textContent = '🔙 ' + MJi18n.t('mj-32', 'lesFamilles', 'Les familles');
      document.getElementById('choiceTitle').textContent = MJi18n.t('mj-32', 'choisisUnDino', 'Choisis un dino à colorier !');
      document.getElementById('backChoiceBtn').textContent = '🔙 ' + MJi18n.t('mj-32', 'autreDino', 'Autre dino');
      document.getElementById('modelBtn').textContent = '🦕 ' + MJi18n.t('mj-32', 'modele', 'Modèle');
      document.getElementById('decorBtn').textContent = '🏞️ ' + MJi18n.t('mj-32', 'decors.bouton', 'Décors');
      document.getElementById('decorMsg').textContent = MJi18n.t('mj-32', 'decors.titreMenu', 'Choisis un décor');
      document.getElementById('closeDecor').textContent = '👍 ' + MJi18n.t('mj-32', 'decors.fermer', 'Fermer');
      document.getElementById('zoomBtn').textContent = '🔍 ' + MJi18n.t('mj-32', 'zoomer', 'Zoomer');
      document.getElementById('zoomOutBtn').textContent = '↩️ ' + MJi18n.t('mj-32', 'vueNormale', 'Vue normale');
      document.getElementById('finBtn').textContent = '✅ ' + MJi18n.t('mj-32', 'fini', 'Fini !');
      document.getElementById('galleryColorBtn').textContent = '🎨 ' + MJi18n.t('mj-32', 'colorierAutre', 'Colorier un autre dino !');
      document.getElementById('galleryTitle').textContent = '🖼️ ' + MJi18n.t('mj-32', 'maGalerie', 'Ma galerie');
      document.getElementById('galleryEmpty').textContent = MJi18n.t('mj-32', 'galerieVide', 'Pas encore d\'œuvre... Colorie ton premier dino !');
      document.getElementById('resumeBtn').textContent = '🖍️ ' + MJi18n.t('mj-32', 'reprendreEnCopie', 'Reprendre en copie');
      document.getElementById('confirmMsg').textContent = MJi18n.t('mj-32', 'supprimerCeDessin', 'Supprimer ce dessin ?');
      document.getElementById('confirmNo').textContent = MJi18n.t('mj-32', 'non', 'Non');
      document.getElementById('confirmYes').textContent = MJi18n.t('mj-32', 'oui', 'Oui');
    }

    function init() {
      applyStaticUi();
      buildFamilyGrid();
      buildPalette();
      document.getElementById('galleryBtn').onclick = openGallery;
      document.getElementById('modelBtn').onclick = showModel;
      document.getElementById('finBtn').onclick = finishPainting;
      document.getElementById('backChoiceBtn').onclick = backToChoice;
      document.getElementById('backFamilyBtn').onclick = backToFamilies;
      document.getElementById('galleryColorBtn').onclick = backToChoice;
      // ← contextuel, 3 niveaux (HO-MJ-11) : atelier/galerie → grille choix (dino de la
      // famille active, ou familles si aucune) ; grille dino (dans screenChoice) → familles ;
      // familles (rien de plus haut dans l'écran) → laisse l'ancre remonter au menu principal.
      // Delegation sur .hdr : back-button.js REMPLACE l'ancre .back au DOMContentLoaded,
      // un listener pose directement sur l'ancre serait perdu.
      document.querySelector('.hdr').addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        if (!document.getElementById('screenChoice').classList.contains('hidden')
            && !document.getElementById('dinoView').classList.contains('hidden')) {
          e.preventDefault();
          backToFamilies();
        } else if (document.getElementById('screenChoice').classList.contains('hidden')) {
          e.preventDefault();
          backToChoice();
        }
      });
      document.getElementById('closeBig').onclick = closeBig;
      document.getElementById('bigView').onclick = (e) => { if (e.target.id === 'bigView') closeBig(); };
      document.getElementById('resumeBtn').onclick = resumePiece;
      document.getElementById('confirmYes').onclick = () => confirmDelete(true);
      document.getElementById('confirmNo').onclick = () => confirmDelete(false);

      canvas = document.getElementById('paintCanvas');
      // Routeur pointerdown (HO-MJ-10) : hors zoom, comportement historique inchangé
      // (handleTap colorie directement au pointerdown). En zoom, le pointerdown amorce
      // un pan potentiel (onCanvasPointerDown) — la décision tap/pan se prend au
      // pointerup selon PAN_TAP_THRESHOLD_PX (cf. onCanvasPointerUp).
      canvas.addEventListener('pointerdown', (e) => {
        if (zoomed) onCanvasPointerDown(e); else handleTap(e);
      });
      canvas.addEventListener('pointermove', onCanvasPointerMove);
      canvas.addEventListener('pointerup', onCanvasPointerUp);
      canvas.addEventListener('pointercancel', () => {
        panPointerId = null;
        canvas.classList.remove('panning');
      });
      document.getElementById('zoomBtn').onclick = enterZoom;
      document.getElementById('zoomOutBtn').onclick = exitZoom;
      document.getElementById('decorBtn').onclick = openDecorMenu;
      document.getElementById('closeDecor').onclick = closeDecorMenu;
      document.getElementById('decorModal').onclick = (e) => { if (e.target.id === 'decorModal') closeDecorMenu(); };

      if (Tracker && Tracker.startSession) Tracker.startSession('mj-32');
    }

    init();
  });
  </script>
