<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-32 – L’atelier coloriage</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* --- GABARIT DESIGN SYSTEM v1 (juillet 2026) ---
       Le header .hdr est stylé par mp-theme.css (compat) : NE PAS redéclarer
       .hdr/.htitle en local. NE PAS mettre de background sur body :
       le fond vient de l'AMBIANCE (data-ambiance posé par mp-theme.js). */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One','Nunito',sans-serif; color:var(--ink); display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    .screen { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .hidden { display:none !important; }

    /* ── Écran choix ── */
    #galleryColorBtn {
      display:block; min-height:56px; font-size:1.05rem; font-weight:900; border:none; border-radius:16px;
      margin:10px auto 0; background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff;
      padding:12px 22px; cursor:pointer; box-shadow:0 4px 12px #0005; font-family:inherit;
    }
    #galleryColorBtn:active { transform:scale(.95); }
    #galleryBtn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      margin:10px auto; background:linear-gradient(135deg,#ff9800,#ffb74d); color:#3a1a00;
      border:none; cursor:pointer; border-radius:22px; padding:10px 20px;
      font-size:1rem; font-weight:900; box-shadow:0 4px 12px #0005; min-height:44px;
    }
    #galleryBtn:active { transform:scale(.95); }
    .choice-title { text-align:center; font-size:1.15rem; font-weight:900; color:#ffe066; margin:10px 12px 4px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:12px; padding:14px; }
    .thumb-card {
      background:#fff; border-radius:16px; padding:8px; cursor:pointer;
      box-shadow:0 4px 10px #0005; display:flex; flex-direction:column; align-items:center; gap:4px;
      min-height:130px; border:4px solid transparent; transition:transform .12s;
    }
    .thumb-card:active { transform:scale(.93); }
    .thumb-card img { width:100%; height:88px; object-fit:contain; pointer-events:none; }
    .thumb-card .tname { color:#222; font-size:.78rem; font-weight:900; text-align:center; }

    /* ── Niveau Familles (HO-MJ-11) : 1er écran de choix, avant la grille des 71 dinos ── */
    .family-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; padding:14px; }
    .family-card {
      cursor:pointer; border:none; border-radius:18px; padding:16px 10px;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      min-height:120px; box-shadow:0 4px 10px #0005; transition:transform .12s;
      font-family:inherit; color:#fff;
    }
    .family-card:active { transform:scale(.94); }
    .family-card .femoji { font-size:2.2rem; line-height:1; }
    .family-card .flabel { font-size:.85rem; font-weight:900; text-align:center; text-shadow:0 1px 3px #0006; }
    /* Bouton retour familles, visible seulement quand la sous-grille dino est ouverte
       (cible tactile >=48px, min-height:56px = action de nav principale de cet écran). */
    #backFamilyBtn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      margin:10px auto 0; background:rgba(255,255,255,0.12); color:#fff;
      border:none; cursor:pointer; border-radius:18px; padding:10px 18px;
      font-size:.95rem; font-weight:900; min-height:56px; font-family:inherit;
    }
    #backFamilyBtn:active { transform:scale(.95); }

    /* ── Écran atelier ── */
    /* ZÉRO ascenseur en atelier (règle transverse PY 2026-08-10) : l'écran de jeu
       tient dans la hauteur — seules les VRAIES listes (choix dino, galerie) scrollent. */
    #screenAtelier { overflow:hidden; }
    /* HO-MJ-09 correctif : #screenAtelier (classe .screen) est display:block, donc
       flex:1 sur #atelier n'avait AUCUN effet (les propriétés flex n'agissent que
       si le PARENT est flex/grid) — ça restait invisible tant que le canvas carré
       (800×800) tenait par coïncidence dans l'espace dispo. Le nom ajouté sous le
       dino rend le canvas plus haut (jusqu'à ~800×1030) : #atelier grandissait
       alors au-delà de #screenAtelier sans que rien ne le contraigne, débordement
       clippé silencieusement par overflow:hidden (scrollHeight > clientHeight,
       donc un vrai "ascenseur" caché). height:100% répare le contrat : #atelier
       occupe exactement la hauteur bornée de #screenAtelier (lui-même flex:1 dans
       #app), et son propre flex-column + canvas-wrap flex:1 peuvent alors vraiment
       réduire le canvas pour tenir dedans. */
    #atelier { display:flex; flex-direction:column; height:100%; overflow:hidden; }
    /* La barre passe à la ligne au lieu de déborder. Mesuré 2026-09-08 : avec les
       boutons Décors et Zoomer ajoutés le même jour, les 5 boutons totalisaient 409 px
       de large sur un écran de 360 — "Autre dino" sortait à gauche (x = -49) et
       surtout "Fini !" sortait à droite (jusqu'à 409), donc l'enfant ne pouvait plus
       terminer son dessin. Un flex sans wrap ne déborde pas visiblement : il pousse
       les enfants hors du cadre en silence, ce qu'aucune mesure de scrollWidth sur la
       PAGE ne révèle (la page, elle, ne déborde pas — c'est la barre qui rogne).
       gap réduit à 6px et padding latéral resserré pour limiter le passage à 2 lignes. */
    .atelier-top {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:6px; padding:6px 4px; flex-shrink:0;
    }
    .atelier-btn {
      display:flex; align-items:center; gap:6px; border:none; cursor:pointer;
      border-radius:20px; padding:10px 16px; font-size:.95rem; font-weight:900;
      box-shadow:0 3px 8px #0005; min-height:44px;
    }
    #modelBtn { background:linear-gradient(135deg,#29b6f6,#4fc3f7); color:#012; }
    #finBtn { background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff; }
    #zoomBtn { background:linear-gradient(135deg,#7e57c2,#9575cd); color:#fff; }
    #decorBtn { background:linear-gradient(135deg,#8d6e63,#a1887f); color:#fff; }
    .atelier-btn:active { transform:scale(.94); }
    /* Boutons masqués pendant l'écran atelier quand ils ne s'appliquent pas (HO-MJ-10) :
       zoomBtn disparaît une fois zoomé (le zoom loupe n'a qu'un seul niveau, cf. figée),
       remplacé par zoomOutBtn (bouton de sortie explicite, toujours visible en zoom). */
    .atelier-btn.hidden { display:none !important; }

    .canvas-wrap {
      flex:1; position:relative; display:flex; align-items:center; justify-content:center;
      padding:6px; min-height:0;
      /* Cadre de recadrage du canvas zoomé (HO-MJ-10) : le canvas peut dépasser visuellement
         de ce conteneur une fois scale() appliqué, overflow:hidden coupe proprement sans
         jamais faire scroller la page (règle transverse zéro ascenseur). */
      overflow:hidden;
    }
    #paintCanvas {
      max-width:100%; max-height:100%; border-radius:14px; box-shadow:0 6px 18px #0007;
      touch-action:none; background:#fff;
      /* transform-origin fixe (centre) : le zoom agrandit toujours depuis le centre du
         canvas, jamais depuis un coin — cf. décision HO-MJ-10 (option a, zoom centré). */
      transform-origin:center center;
      /* Transition sur transform SEULEMENT : le zoom/dézoom est animé (fluidité demandée
         par Papa Yann), le PAN pendant le déplacement au doigt écrase translate en JS à
         chaque frame sans transition (sinon la vue "traîne" derrière le doigt). */
      transition:transform var(--mj32-zoom-anim-ms,220ms) ease-out;
      will-change:transform;
    }
    #paintCanvas.panning { transition:none; }
    #modelOverlay {
      position:absolute; top:6px; left:6px; right:6px; bottom:6px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.15); border-radius:14px; pointer-events:none;
      opacity:0; transition:opacity .3s;
    }
    #modelOverlay.show { opacity:1; }
    #modelOverlay img { max-width:92%; max-height:92%; border-radius:12px; box-shadow:0 8px 24px #000a; }

    /* Bouton de sortie du zoom (HO-MJ-10) : demande explicite de Papa Yann, visible EN
       PERMANENCE pendant le zoom (jamais caché dans un coin), libellé texte + icône,
       cible tactile >= 56px (action principale). Flotte par-dessus le canvas sans jamais
       gêner le coloriage (posé en haut, hors de la zone de dessin la plus utile). */
    #zoomOutBtn {
      position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5;
      display:flex; align-items:center; gap:6px; border:none; cursor:pointer;
      border-radius:22px; padding:12px 20px; font-size:1rem; font-weight:900;
      min-height:56px; font-family:inherit; box-shadow:0 4px 14px #000a;
      background:linear-gradient(135deg,#e53935,#ef5350); color:#fff;
    }
    #zoomOutBtn:active { transform:translateX(-50%) scale(.94); }

    .palette {
      display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
      padding:8px; flex-shrink:0; background:rgba(0,0,0,0.2);
    }
    /* 2026-08-10 (#6389, règle transverse PY ZÉRO ascenseur) : pastilles réduites
       pour que les 13 tiennent en 2 lignes max — la palette ne scrolle JAMAIS. */
    .swatch {
      width:60px; height:60px; border-radius:50%; border:4px solid rgba(255,255,255,0.5);
      cursor:pointer; box-shadow:0 3px 8px #0006; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:1.3rem;
    }
    .swatch.sel { border-color:#ffe066; transform:scale(1.1); }
    .swatch:active { transform:scale(.9); }
    .swatch.eraser { background:#fff; color:#999; }

    /* ── Galerie ── */
    .gallery-empty { text-align:center; margin-top:40px; font-size:1.1rem; opacity:.8; padding:0 20px; }
    #galleryView img.piece {
      width:100%; height:140px; object-fit:contain; background:#fff; border-radius:14px; cursor:pointer;
      box-shadow:0 4px 10px #0005;
    }
    #bigView {
      position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:50;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    #bigView img { max-width:94%; max-height:80%; border-radius:16px; box-shadow:0 8px 30px #000a; }
    #bigView .closeBig {
      position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.15); color:#fff;
      border:none; border-radius:50%; width:56px; height:56px; font-size:1.6rem; font-weight:900; cursor:pointer;
    }
    #bigView .resumeBtn {
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff; border:none;
      border-radius:22px; padding:14px 24px; font-size:1.05rem; font-weight:900;
      box-shadow:0 4px 12px #0005; cursor:pointer; min-height:56px; font-family:inherit;
    }
    #bigView .resumeBtn:active { transform:translateX(-50%) scale(.94); }

    /* ── Sous-menu Décors (HO-MJ-09 chantier B) ── */
    #decorModal {
      position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:60;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    #decorModal .box {
      background:#2d1f3d; border-radius:20px; padding:20px; max-width:360px; width:100%;
      text-align:center; box-shadow:0 8px 30px #000a; border:2px solid rgba(255,255,255,0.1);
    }
    #decorModal .msg { font-size:1.05rem; font-weight:900; margin-bottom:14px; color:#fff; }
    #decorModal .decor-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
    /* 6 cartes (5 décors + "Aucun") : cible tactile >= 80px (règle transverse mini-jeux),
       3 colonnes x 2 lignes tient à 320px de large (carte ~96px avec le gap). */
    .decor-card {
      background:#fff; border-radius:14px; padding:6px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      min-height:88px; border:3px solid transparent;
    }
    .decor-card.sel { border-color:#ffe066; }
    .decor-card:active { transform:scale(.94); }
    .decor-card .demoji { font-size:1.8rem; }
    .decor-card .dname { color:#222; font-size:.72rem; font-weight:900; text-align:center; line-height:1.15; }
    #decorModal .closeDecor {
      margin-top:16px; min-height:48px; width:100%; border:none; border-radius:16px;
      font-size:1rem; font-weight:900; cursor:pointer; font-family:inherit;
      background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff; box-shadow:0 3px 8px #0005;
    }
    #decorModal .closeDecor:active { transform:scale(.96); }

    /* ── Modal confirmation suppression ── */
    #confirmModal {
      position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:60;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    #confirmModal .box {
      background:#2d1f3d; border-radius:20px; padding:24px; max-width:320px; width:100%;
      text-align:center; box-shadow:0 8px 30px #000a; border:2px solid rgba(255,255,255,0.1);
    }
    #confirmModal .msg { font-size:1.1rem; font-weight:900; margin-bottom:18px; }
    #confirmModal .row { display:flex; gap:12px; justify-content:center; }
    #confirmModal button {
      flex:1; min-height:56px; border:none; border-radius:16px; font-size:1rem;
      font-weight:900; cursor:pointer; font-family:inherit; box-shadow:0 3px 8px #0005;
    }
    #confirmModal .yes { background:linear-gradient(135deg,#e53935,#ef5350); color:#fff; }
    #confirmModal .no { background:linear-gradient(135deg,#43a047,#66bb6a); color:#fff; }
    #confirmModal button:active { transform:scale(.94); }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle" id="htitle">🖍️ L’atelier coloriage</span>
    </div>

    <!-- ÉCRAN CHOIX : niveau 1 = familles, niveau 2 = dinos de la famille (HO-MJ-11) -->
    <div class="screen" id="screenChoice">
      <button id="galleryBtn">🖼️ Ma galerie</button>
      <div id="familyView">
        <div class="choice-title" id="familyTitle">Choisis une famille de dinos !</div>
        <div class="family-grid" id="familyGrid"></div>
      </div>
      <div class="hidden" id="dinoView">
        <button id="backFamilyBtn">🔙 Les familles</button>
        <div class="choice-title" id="choiceTitle">Choisis un dino à colorier !</div>
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <!-- ÉCRAN ATELIER -->
    <div class="screen hidden" id="screenAtelier">
      <div id="atelier">
        <div class="atelier-top">
          <button class="atelier-btn" id="backChoiceBtn">🔙 Autre dino</button>
          <button class="atelier-btn" id="modelBtn">🦕 Modèle</button>
          <button class="atelier-btn" id="decorBtn">🏞️ Décors</button>
          <button class="atelier-btn" id="zoomBtn">🔍 Zoomer</button>
          <button class="atelier-btn" id="finBtn">✅ Fini !</button>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="paintCanvas" width="800" height="600"></canvas>
          <div id="modelOverlay"><img id="modelImg" alt=""></div>
          <button class="hidden" id="zoomOutBtn">↩️ Vue normale</button>
        </div>
        <div class="palette" id="palette"></div>
      </div>
    </div>

    <!-- ÉCRAN GALERIE -->
    <div class="screen hidden" id="screenGallery">
      <button id="galleryColorBtn">🎨 Colorier un autre dino !</button>
      <div class="choice-title" id="galleryTitle">🖼️ Ma galerie</div>
      <div class="grid" id="galleryView"></div>
      <div class="gallery-empty hidden" id="galleryEmpty">Pas encore d'œuvre... Colorie ton premier dino !</div>
    </div>
  </div>

  <div id="bigView" class="hidden">
    <button class="closeBig" id="closeBig">✕</button>
    <img id="bigImg" alt="">
    <button class="resumeBtn" id="resumeBtn">🖍️ Reprendre en copie</button>
  </div>

  <div id="decorModal" class="hidden">
    <div class="box">
      <div class="msg" id="decorMsg">Choisis un décor</div>
      <div class="decor-grid" id="decorGrid"></div>
      <button class="closeDecor" id="closeDecor">👍 Fermer</button>
    </div>
  </div>

  <div id="confirmModal" class="hidden">
    <div class="box">
      <div class="msg" id="confirmMsg">Supprimer ce dessin ?</div>
      <div class="row">
        <button class="no" id="confirmNo">Non</button>
        <button class="yes" id="confirmYes">Oui</button>
      </div>
    </div>
  </div>

  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-plantes.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script src="js/mj-shell.js"></script>
  <script>
  MJ.ready(function () {
    document.title = 'MJ-32 – ' + MJi18n.titre('mj-32', 'L’atelier coloriage');
    const htitleEl32 = document.getElementById('htitle');
    if (htitleEl32) htitleEl32.textContent = '🖍️ ' + MJi18n.titre('mj-32', 'L’atelier coloriage');

    MJ.init({
      id: 'mj-32', emoji: '🖍️', titre: MJi18n.titre('mj-32', 'L’atelier coloriage'),
      golden: false,
      consigne: false,
      regle: {
        picto: '🖍️🦕',
        texte: 'Colorie ton dino comme tu veux, il n’y a pas d’erreur !',
        etapes: [
          { t: 'Je choisis un dino à colorier 🦕',
            d: 'Je tape sur le dino que je préfère dans la liste.' },
          { t: 'Je choisis une couleur et je tape dans le dessin 🎨',
            d: 'La couleur remplit toute la zone que je touche. Je peux changer de couleur autant de fois que je veux !' },
          { t: 'Je regarde le modèle si j’ai besoin 🔍',
            d: 'Le bouton « Modèle » montre le dino en couleur 2 secondes, pour m’aider si je veux.' },
          { t: 'Je tape « Fini ! » pour garder mon dessin 🖼️',
            d: 'Mon œuvre part dans « Ma galerie » : je peux la regarder, la reprendre pour continuer, ou la supprimer. Pas d’étoiles, pas d’erreur : je fais comme je veux !' }
        ]
      }
    });
    // ─── MJ-32 — L'atelier coloriage (jeu LIBRE, sans étoiles ni échec) ───
    const GALLERY_KEY = 'mj32_galerie';
    const GALLERY_MAX = 12;
    const COLORIAGE_DIR = 'img/dinos/paleoart/';
    const MODEL_DIR = 'img/dinos/paleoart/'; // héros racine purgés le 2026-07-17
    // Plantes (HO-MJ-12) : coloriages dans un dossier distinct de celui des dinos —
    // même DINO_PLANTES (19 entrées) que l'onglet "Les époques" de l'encyclopédie,
    // mais seules 6 ont un coloriage produit (les autres n'apparaissent jamais ici,
    // détecté par onerror comme pour les dinos, jamais une liste en dur).
    const PLANTES_DIR = 'img/dinos/plantes/';
    const PLANTES_FAMILY_ID = 'plantes';

    // Une entrée choix (dino OU plante) porte son propre dossier d'assets — évite
    // de faire dépendre tout le reste du code d'un "id latin" qui n'existe pas pour
    // les plantes (elles n'ont pas de champ .famille). isPlante posé UNE fois à la
    // construction de la liste (dinosOfFamily / lookup galerie), jamais recalculé
    // depuis le nom (fragile) ou l'extension du fichier (les deux dossiers utilisent
    // le même format .webp).
    function assetDirFor(entry) { return (entry && entry.isPlante) ? PLANTES_DIR : COLORIAGE_DIR; }
    function modelDirFor(entry) { return (entry && entry.isPlante) ? PLANTES_DIR : MODEL_DIR; }

    // Couleurs vives + nature (10 + marron/gris/vert nature) — pas de hex hardcodé "ligne bus"
    // (ce jeu n'a pas de notion de ligne RATP, palette dédiée coloriage)
    const PALETTE = [
      { hex:'#e53935', name:'rouge' },
      { hex:'#fb8c00', name:'orange' },
      { hex:'#fdd835', name:'jaune' },
      { hex:'#43a047', name:'vert' },
      { hex:'#1e88e5', name:'bleu' },
      { hex:'#8e24aa', name:'violet' },
      { hex:'#ec407a', name:'rose' },
      { hex:'#00acc1', name:'turquoise' },
      { hex:'#6d4c41', name:'marron' },
      { hex:'#757575', name:'gris' },
      { hex:'#33691e', name:'vert foncé' },
      { hex:'#000000', name:'noir' },
    ];

    function baseName(png) { return png.replace(/\.(jpg|jpeg|png|webp)$/i, ''); }

    // ─── HO-MJ-09 chantier B : sous-menu Décors ───
    // Décision figée Papa Yann 2026-09-08 : TOUS les fonds proposés pour TOUS les
    // dinos, aucun filtre par biome/époque — ne pas rouvrir ce choix.
    // 5 fonds au trait, 1536x1024 (ratio 1.5:1), noir et blanc pur, centre volontairement
    // vide (le sol, sous l'horizon) pour que le dino s'y pose. Déjà produits et commités,
    // rien à générer ici (cf. handoff HO-MJ-09).
    const DECORS = [
      { id: 'desert',   emoji: '🏜️', file: 'fond_desert_coloriage.webp' },
      { id: 'foret',     emoji: '🌲', file: 'fond_foret_coloriage.webp' },
      { id: 'montagne',  emoji: '⛰️', file: 'fond_montagne_coloriage.webp' },
      { id: 'neige',     emoji: '❄️', file: 'fond_neige_coloriage.webp' },
      { id: 'volcan',    emoji: '🌋', file: 'fond_volcan_coloriage.webp' },
    ];
    // Ratio natif mesuré des 5 fichiers (1536x1024) — utilisé pour calculer la hauteur
    // du fond à partir de la largeur du canvas SANS charger l'image au préalable
    // (measureNameBandHeight doit connaître la hauteur totale avant de créer le canvas).
    const DECOR_RATIO_H = 1024 / 1536;

    function decorById(id) { return DECORS.find(d => d.id === id) || null; }

    // Où poser le dino DANS le fond, en fraction de la hauteur du fond (mesuré sur les
    // 5 aperçus : horizon vers 55-65%, sol vide en dessous) — la base du dino (bas de
    // son canvas carré) touche cette ligne, jamais plus bas (déborderait du sol visible
    // ni plus haut (flotterait au-dessus de l'horizon, incohérent avec "posé au sol").
    const DECOR_DINO_BASE_RATIO = 0.86;
    // Largeur du dino dans le fond, en fraction de la largeur du canvas — assez grand
    // pour rester le sujet principal (pas noyé dans le décor), assez petit pour tenir
    // entièrement dans la bande de sol entre l'horizon et le bas du fond.
    const DECOR_DINO_WIDTH_RATIO = 0.58;

    // ─── HO-MJ-09 chantier A : nom du dino en MAJUSCULES creuses, coloriables ───
    // Décision figée Papa Yann 2026-09-08 (voir handoff) : MAJUSCULES uniquement,
    // lettres CREUSES (strokeText, jamais fillText — il faut du vide à l'intérieur
    // pour que le flood fill existant puisse le remplir comme n'importe quelle
    // zone du dessin). Le texte est dessiné AVANT buildContourMask() : c'est ce
    // qui le fait entrer dans le masque de contour comme le reste du lineart,
    // sans aucune mécanique de coloriage nouvelle.
    //
    // Dimensionnement : proportionnel à `w` (largeur du canvas dino, 600-800px
    // selon le ratio de l'image source, cf. loadLineart) plutôt qu'à des px fixes,
    // pour rester cohérent quel que soit le dino. Calibré pour qu'un doigt de 4 ans
    // atteigne l'intérieur d'un O à 360px d'écran (contrainte P30 Pro) :
    // à w=800 (cas le plus large), le canvas rendu en CSS fait ~345px de large
    // (.canvas-wrap, padding 6px de chaque côté à 360px d'écran) → ratio canvas/CSS
    // ≈ 2.3. NAME_FONT_MIN_PX est le plancher ABSOLU en dessous duquel on ne réduit
    // plus la police, même si le nom déborde encore (mieux vaut un débordement léger
    // géré par les marges que des lettres trop petites pour un doigt).
    //
    // BUG corrigé pendant le développement : le trait était d'abord calculé en
    // ratio de `w` (fixe), donc à taille de police réduite (nom long sur 2 lignes)
    // le trait devenait proportionnellement énorme par rapport aux lettres — les
    // intérieurs des lettres (le "trou" du O, l'espace entre deux lettres voisines)
    // disparaissaient complètement, fusionnant tout en un bloc noir plein (plus
    // rien à colorier, capture Playwright "APATOSAURE" illisible). Le trait doit
    // être un ratio de fontPx (comme dans une police "outline" classique), pas de w.
    //
    // Calibrage empirique (capture stroke-ratios, police Fredoka One 900) : au
    // ratio 0.10×fontPx les lettres voisines commencent à se toucher, 0.14+ les
    // fusionne complètement. 0.09 reste net avec un trait bien visible. Le plancher
    // ABSOLU en px canvas (indépendant de fontPx) est volontairement bas — un
    // plancher calé sur "6px CSS à w=800" (~14px canvas) écraserait tout intérieur
    // de lettre à la taille de police plancher (57.6px : 14px de trait = 24% de la
    // hauteur de lettre, les O et les espaces inter-lettres disparaissent). Le vrai
    // besoin du doigt de 4 ans est un intérieur de lettre assez grand pour taper
    // dedans (hauteur de lettre >= 56px, déjà garanti par NAME_FONT_MIN_PX) — pas
    // l'épaisseur du trait lui-même.
    const NAME_BAND_MAX_LINES = 2;       // 1 ligne si ça tient, sinon 2 (jamais plus)
    const NAME_FONT_MAX_PX = 0.145;      // ratio de w : taille de police de départ
    const NAME_FONT_MIN_PX = 0.072;      // ratio de w : plancher (>= 56px à w=800, cf. handoff)
    const NAME_STROKE_FONT_RATIO = 0.09; // ratio de fontPx : épaisseur du trait (calibrage empirique)
    const NAME_STROKE_MIN_PX = 3;        // plancher ABSOLU en px canvas (trait toujours visible)
    const NAME_LINE_GAP_RATIO = 0.10;    // ratio de w : interligne
    const NAME_SIDE_MARGIN_RATIO = 0.06; // ratio de w : marge gauche/droite pour measureText
    const NAME_TOP_PAD_RATIO = 0.08;     // ratio de w : espace au-dessus du nom (sépare du dino)
    const NAME_BOTTOM_PAD_RATIO = 0.06;  // ratio de w : espace sous le nom

    // Casse un nom en <= NAME_BAND_MAX_LINES lignes qui tiennent dans maxWidth
    // (measureText), en coupant sur les espaces (jamais au milieu d'un mot sauf
    // dernier recours, cf. splitLongWord). Retourne aussi la taille de police
    // effectivement utilisée (réduite jusqu'au plancher si besoin).
    //
    // Bug corrigé pendant le développement : la première version arrêtait de
    // réduire la police dès que lines.length <= NAME_BAND_MAX_LINES, sans
    // vérifier que CHAQUE ligne tenait réellement dans maxWidth — un nom d'un
    // seul mot sans espace (CRYOLOPHOSAURE) formait toujours "1 ligne" mais
    // débordait largement du canvas. Le critère d'arrêt est maintenant la
    // largeur mesurée de la ligne la plus large, pas le nombre de lignes.
    // Épaisseur de trait pour une taille de police donnée : ratio de fontPx (garde
    // la même proportion "lettre bulle creuse" à toute taille), jamais en dessous
    // du plancher absolu NAME_STROKE_MIN_RATIO*w (>= 6px CSS à 360px, cf. handoff).
    function strokeWidthFor(fontPx, w) {
      return Math.max(NAME_STROKE_MIN_PX, fontPx * NAME_STROKE_FONT_RATIO);
    }

    function layoutDinoName(ctx2d, name, w) {
      const upper = name.toUpperCase();
      const words = upper.split(' ').filter(Boolean);
      // maxWidth réduit de l'épaisseur du trait (strokeText déborde du glyph de
      // ~lineWidth/2 de chaque côté) : sans cette marge, une ligne "mesurée juste
      // limite" par measureText (qui ne connaît que le glyph plein, pas le trait)
      // débordait quand même une fois strokée.
      const maxWidth = w * (1 - 2 * NAME_SIDE_MARGIN_RATIO);
      let fontPx = w * NAME_FONT_MAX_PX;
      const minPx = w * NAME_FONT_MIN_PX;
      const effMaxWidth = (fpx) => maxWidth - strokeWidthFor(fpx, w);

      function wrapAt(fpx) {
        ctx2d.font = '900 ' + fpx + 'px "Fredoka One","Nunito",sans-serif';
        const limit = effMaxWidth(fpx);
        const lines = [];
        let cur = '';
        for (const word of words) {
          const trial = cur ? cur + ' ' + word : word;
          if (!cur || ctx2d.measureText(trial).width <= limit) {
            cur = trial;
          } else {
            lines.push(cur);
            cur = word;
          }
        }
        if (cur) lines.push(cur);
        return lines;
      }

      function widestLine(lines) {
        return lines.reduce((m, l) => Math.max(m, ctx2d.measureText(l).width), 0);
      }

      let lines = wrapAt(fontPx);
      // Réduit la police tant qu'une ligne déborde de maxWidth OU qu'il y a trop
      // de lignes, jusqu'au plancher — jamais en dessous (règle du handoff).
      while (fontPx > minPx && (lines.length > NAME_BAND_MAX_LINES || widestLine(lines) > effMaxWidth(fontPx))) {
        fontPx = Math.max(minPx, fontPx - w * 0.004);
        lines = wrapAt(fontPx);
      }
      // Toujours plus de NAME_BAND_MAX_LINES lignes au plancher : fusionne
      // l'excédent dans la dernière ligne autorisée (jamais de 3e ligne).
      if (lines.length > NAME_BAND_MAX_LINES) {
        const head = lines.slice(0, NAME_BAND_MAX_LINES - 1);
        const tail = lines.slice(NAME_BAND_MAX_LINES - 1).join(' ');
        lines = head.concat([tail]);
      }
      // Dernier recours, au plancher, pour un mot SEUL toujours trop large
      // (pas d'espace où couper, ex. "CRYOLOPHOSAURE" à lui seul sur sa ligne) :
      // coupe le mot au milieu en 2 lignes plutôt que de laisser déborder du
      // canvas — un contour de lettre à cheval sur 2 lignes reste coloriable,
      // c'est le seul cas où on accepte de couper un mot.
      if (fontPx <= minPx + 0.01 && lines.length <= NAME_BAND_MAX_LINES) {
        ctx2d.font = '900 ' + fontPx + 'px "Fredoka One","Nunito",sans-serif';
        const limit = effMaxWidth(fontPx);
        const tooWide = lines.map((l, i) => ({ l, i })).filter(o => ctx2d.measureText(o.l).width > limit);
        if (tooWide.length && lines.length < NAME_BAND_MAX_LINES) {
          const { l, i } = tooWide[0];
          const mid = Math.ceil(l.length / 2);
          lines = lines.slice(0, i).concat([l.slice(0, mid), l.slice(mid)]).concat(lines.slice(i + 1));
        }
      }
      return { lines, fontPx };
    }

    // Dessine le nom en lettres creuses dans la bande réservée en bas du canvas
    // dino (entre yTop et yTop+bandH). Appelé APRÈS drawImage(lineart) et AVANT
    // buildContourMask — point clé du handoff : dessiner après casserait le masque.
    function drawHollowName(ctx2d, name, w, yTop, bandH) {
      const { lines, fontPx } = layoutDinoName(ctx2d, name, w);
      ctx2d.save();
      ctx2d.font = '900 ' + fontPx + 'px "Fredoka One","Nunito",sans-serif';
      ctx2d.textAlign = 'center';
      ctx2d.textBaseline = 'middle';
      ctx2d.strokeStyle = '#000000';
      ctx2d.lineWidth = strokeWidthFor(fontPx, w);
      ctx2d.lineJoin = 'round';
      const lineGap = w * NAME_LINE_GAP_RATIO + fontPx;
      const totalH = lineGap * (lines.length - 1);
      const firstY = yTop + bandH / 2 - totalH / 2;
      lines.forEach((line, i) => {
        // strokeText SEUL (jamais fillText) : contour épais, intérieur laissé
        // BLANC (couleur du fond déjà posé par fillRect plus haut) — le flood
        // fill existant traite alors chaque lettre comme une zone à colorier,
        // exactement comme n'importe quelle partie du dessin du dino.
        ctx2d.strokeText(line, w / 2, firstY + lineGap * i);
      });
      ctx2d.restore();
      return { lines, fontPx };
    }

    // Hauteur de bande nécessaire pour accueillir le nom (calculée AVANT de fixer
    // canvas.height, pour dimensionner le canvas une seule fois — pas de redraw).
    function measureNameBandHeight(ctx2d, name, w) {
      const { lines, fontPx } = layoutDinoName(ctx2d, name, w);
      const lineGap = w * NAME_LINE_GAP_RATIO + fontPx;
      const linesH = fontPx + lineGap * (lines.length - 1);
      return Math.round(w * NAME_TOP_PAD_RATIO + linesH + w * NAME_BOTTOM_PAD_RATIO);
    }

    let currentDino = null;
    let selectedColor = PALETTE[0].hex;
    let canvas, ctx;
    let filling = false;

    // ─── Zoom de précision (HO-MJ-10, demande Papa Yann 2026-09-08) ───
    // Zoome en CSS (transform:scale), JAMAIS en changeant canvas.width : le lineart,
    // le masque de contour, l'historique fillHistory (coordonnées normalisées) et la
    // galerie restent intacts, seule la PRÉSENTATION grandit. canvasPointFromEvent()
    // reste inchangé : getBoundingClientRect() reflète déjà la transformation CSS.
    //
    // Option d'entrée retenue : (a) bouton loupe qui zoome sur le CENTRE, puis
    // déplacement au doigt. Choisie plutôt que (b) "armer puis taper où zoomer" car
    // elle ne demande de comprendre AUCUN mode intermédiaire — un enfant de 4 ans
    // appuie sur un bouton et voit un effet immédiat, alors que (b) exige de
    // comprendre "le prochain tap ne colorie pas, il choisit où zoomer", un concept
    // à deux temps hors de portée à cet âge (cf. game-design-enfant : un seul geste
    // à la fois). Un seul niveau de zoom (pas de zoom continu à plusieurs crans) :
    // la demande n'exige que "zoomer pour les clics de précision", pas un réglage fin.
    const ZOOM_SCALE = 2.75;          // niveau unique, dans la fourchette 2.5-3 demandée
    const ZOOM_ANIM_MS = 220;         // durée de la transition CSS zoom/dézoom (fluidité)
    // Seuil qui distingue un TAP (colorie) d'un DÉPLACEMENT (pan, ne colorie pas).
    // Piège central du handoff : glisser sert à naviguer dans le zoom, taper sert à
    // colorier — sans ce seuil Max repeindrait en déplaçant la vue. En dessous de ce
    // nombre de px CSS parcourus entre pointerdown et pointerup, on considère que le
    // doigt n'a pas bougé : c'est un tap. Valeur usuelle de tolérance tactile (un doigt
    // d'enfant n'est jamais parfaitement immobile même pour un simple tap).
    const PAN_TAP_THRESHOLD_PX = 10;
    let zoomed = false;
    let panX = 0, panY = 0;           // décalage courant du canvas zoomé, en px CSS
    let panPointerId = null;
    let panStartClientX = 0, panStartClientY = 0;
    let panStartX = 0, panStartY = 0;
    let panMoved = false;             // dépassé PAN_TAP_THRESHOLD_PX depuis le pointerdown courant
    document.documentElement.style.setProperty('--mj32-zoom-anim-ms', ZOOM_ANIM_MS + 'ms');

    // Limite le pan pour que le canvas zoomé ne s'éloigne jamais trop de sa fenêtre
    // (sinon un enfant peut "perdre" le dessin hors champ et ne plus savoir revenir —
    // le bouton "Vue normale" recentre de toute façon, mais autant éviter le besoin).
    // La borne se calcule sur la taille AFFICHÉE DU CANVAS, pas sur celle de la fenêtre.
    // Corrigé par l'orchestrateur 2026-09-08 : avec la borne calculée sur la fenêtre, le
    // bas du canvas restait 62 px hors champ une fois le pan poussé à fond (mesuré, canvas
    // 800x1028 dans une fenêtre 360x390). La bande du nom, ajoutée en bas du canvas par
    // HO-MJ-09, était donc INATTEIGNABLE en zoom — or colorier l'intérieur d'une petite
    // lettre est précisément l'usage qui justifie le zoom.
    // Principe : on autorise le déplacement jusqu'à ce que le bord du canvas affleure le
    // bord de la fenêtre, jamais au-delà (sinon l'enfant perd le dessin hors champ).
    // Si le canvas zoomé est plus petit que la fenêtre sur un axe, aucun déplacement n'est
    // utile sur cet axe : la borne vaut alors 0 et le dessin reste centré.
    function clampPan(wrap, x, y) {
      const rect = canvas.getBoundingClientRect(); // dimensions réellement affichées
      // getBoundingClientRect reflète déjà le scale courant ; on repart donc de la taille
      // NON transformée pour ne pas composer deux fois le facteur de zoom.
      const baseW = rect.width / (zoomed ? ZOOM_SCALE : 1);
      const baseH = rect.height / (zoomed ? ZOOM_SCALE : 1);
      const maxX = Math.max(0, (baseW * ZOOM_SCALE - wrap.clientWidth) / 2);
      const maxY = Math.max(0, (baseH * ZOOM_SCALE - wrap.clientHeight) / 2);
      return [Math.max(-maxX, Math.min(maxX, x)), Math.max(-maxY, Math.min(maxY, y))];
    }

    function applyCanvasTransform() {
      const scale = zoomed ? ZOOM_SCALE : 1;
      canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    }

    function enterZoom() {
      if (zoomed || !canvas) return;
      zoomed = true;
      panX = 0; panY = 0; // zoom centré (option a) : repart toujours du centre du canvas
      applyCanvasTransform();
      document.getElementById('zoomBtn').classList.add('hidden');
      document.getElementById('zoomOutBtn').classList.remove('hidden');
    }

    function exitZoom() {
      if (!zoomed) return;
      zoomed = false;
      panX = 0; panY = 0;
      applyCanvasTransform();
      document.getElementById('zoomOutBtn').classList.add('hidden');
      document.getElementById('zoomBtn').classList.remove('hidden');
      // Sortir du zoom ne touche jamais fillHistory/canvas : seule la transformation
      // CSS de présentation change, aucune couleur n'est modifiée (règle du handoff).
    }

    // Pan au doigt (glisser) quand zoomé : ne colorie PAS pendant le geste. Le
    // flood fill (handleTap) reste branché sur 'pointerdown' — pour ne pas déclencher
    // une couleur au moment même où le doigt se pose, on retarde la décision "est-ce
    // un tap ou un pan ?" jusqu'au pointerup (cf. PAN_TAP_THRESHOLD_PX).
    function onCanvasPointerDown(e) {
      if (!zoomed) return; // hors zoom, comportement historique (handleTap gère tout)
      panPointerId = e.pointerId;
      panStartClientX = e.clientX; panStartClientY = e.clientY;
      panStartX = panX; panStartY = panY;
      panMoved = false;
      canvas.classList.add('panning');
      // Capture du pointeur : sans elle, `pointermove` cesse d'être reçu dès que le doigt
      // sort du canvas, et le déplacement s'arrête en pleine course. Mesuré 2026-09-08 :
      // le bas du canvas restait alors 45 px hors champ, donc la bande du nom demeurait
      // inatteignable même avec la borne corrigée. Un doigt d'enfant sort très vite du
      // dessin sur un écran de 360 px de large.
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {
        // setPointerCapture échoue si le pointeur a déjà été relâché (course entre
        // événements). Le pan reste alors limité au canvas : dégradé, jamais cassé.
        console.warn('setPointerCapture indisponible pour ce pointeur :', err);
      }
    }

    function onCanvasPointerMove(e) {
      if (!zoomed || e.pointerId !== panPointerId) return;
      const dx = e.clientX - panStartClientX, dy = e.clientY - panStartClientY;
      if (Math.hypot(dx, dy) > PAN_TAP_THRESHOLD_PX) panMoved = true;
      if (!panMoved) return; // sous le seuil : on ne bouge pas encore la vue (évite le tremblé)
      const wrap = document.getElementById('canvasWrap');
      [panX, panY] = clampPan(wrap, panStartX + dx, panStartY + dy);
      applyCanvasTransform();
    }

    function onCanvasPointerUp(e) {
      if (!zoomed || e.pointerId !== panPointerId) return;
      canvas.classList.remove('panning');
      // Libère la capture posée au pointerdown, sinon le pointeur reste rattaché au canvas.
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {
        // Déjà relâchée (pointercancel, pointeur disparu) : sans conséquence ici.
        console.warn('releasePointerCapture sans effet :', err);
      }
      panPointerId = null;
      // Sous le seuil de mouvement : c'est un TAP, pas un déplacement → on colorie.
      // Au-delà : c'était un déplacement de vue, aucune couleur ne doit être posée.
      if (!panMoved) handleTap(e);
    }
    // Masque des contours figé (lineart original, jamais modifié après chargement).
    // Sert UNIQUEMENT à détecter "est-ce un trait de contour ?" — indépendant des
    // couleurs déjà posées par l'enfant (sinon une zone noircie redevient un "mur"
    // infranchissable pour le flood fill : bug "tête noire impossible à recolorier").
    let lineartData = null; // Uint8ClampedArray (RGBA) figée après chargement image

    // ─── Historique de coloriage (modèle JSON zones, PAS de bitmap compressé) ───
    // Chaque tap qui remplit une zone = 1 entrée {nx, ny, hex} en coordonnées
    // NORMALISÉES (0..1) — indépendantes de la résolution du canvas (qui varie
    // selon l'écran). À la réouverture : on recharge le lineart ORIGINAL (webp
    // vectoriel intact, contours nets) et on rejoue floodFill() dans l'ordre pour
    // chaque entrée → résultat pixel-identique, jamais de bavure ni de contour
    // qui prend la couleur du fond (cf. retour Papa Yann annotations Supabase).
    let fillHistory = [];

    // Masque de contour DILATÉ (rayon 2px) calculé UNE FOIS depuis le lineart vierge.
    // Retour PY 2026-08-10 (#6389) : « certains dessins ont des trous sur le contour,
    // colorier le fond = colorier une grosse partie du dino ». Cause : micro-trous de
    // 1-3px dans le trait (compression webp / anti-aliasing) → le flood fill fuit.
    // La dilation bouche ces trous ; le masque reste figé depuis le lineart original
    // (jamais recalculé depuis le canvas courant — règle 🔒 de la figée).
    let contourMask = null; // Uint8Array(w*h), 1 = mur infranchissable (dilaté)
    // Masque de la BANDE de dilatation (HO-MJ-08, 2026-09-08) : contourMask=1 mais le
    // lineart original y est CLAIR (lum >= LUM_SEUIL_TRAIT, donc PAS un vrai trait noir,
    // juste la marge de sécurité ajoutée par la dilatation R px). Sert uniquement à la
    // passe d'extension post-fill (extendFillIntoBand) — jamais à isContour()/canFill(),
    // qui continuent d'utiliser contourMask tel quel pour ne jamais rouvrir la fuite
    // fond→dino du Cryolophosaure (#6389). Précalculé une fois au chargement (pas par fill,
    // règle perf du handoff).
    let bandMask = null; // Uint8Array(w*h), 1 = pixel de bande (mur dilaté mais pas trait réel)
    // Masque du TRAIT RÉEL, non dilaté (lum < LUM_SEUIL_TRAIT dans le lineart original).
    // HO-MJ-08 correctif orchestrateur 2026-09-08 : la passe d'extension doit s'arrêter
    // sur le trait lui-même, pas seulement rester dans bandMask. Mesuré sur le Spinosaure :
    // le trait de la voile du dos fait 3 px de large (médiane, min 1 px) alors que la bande
    // de dilatation fait CONTOUR_DILATE_R = 7 px de chaque côté — la bande traverse donc
    // le trait de part en part, et sans cette garde la couleur ressortait de l'autre côté
    // (orange qui bavait dans la voile et sur la patte avant).
    let traitMask = null; // Uint8Array(w*h), 1 = pixel de trait réel, infranchissable

    const CONTOUR_DILATE_R = 7; // dilation : bouche les trous à l'échelle du canvas.
                 // Mesuré (#6389) : le Cryolophosaure a une VRAIE brèche blanche pure
                 // dans le trait du dos — le chemin de fuite passe à 5,4 px du mur,
                 // il faut donc R >= 6 (R=4 laissait le torse se remplir avec le fond).
                 // Le durable serait de patcher le lineart côté pôle dino.
    const LUM_SEUIL_TRAIT = 200; // seuil haut : certains traits sont du gris CLAIR (dino #10 :
                 // le contour du dos est gris pâle → invisible à 128, le fill traversait).
                 // Les intérieurs des coloriages sont quasi blancs purs, ce seuil ne crée
                 // pas de faux murs.

    // nameBandY (optionnel, HO-MJ-09) : à partir de cette ligne Y (le mur de
    // séparation dino/nom), utilise un rayon de dilatation RÉDUIT (voire nul)
    // au lieu de CONTOUR_DILATE_R. Bug trouvé en recette Playwright : les
    // intérieurs de lettres (le trou d'un R, d'un U...) rétrécissent beaucoup à
    // taille de police réduite (nom long sur 2 lignes) — avec R=7 des deux
    // côtés du trait, un trou de 30-35px de large se retrouve ENTIÈREMENT
    // walled off (14px de dilatation avalent tout l'intérieur), rendant la
    // lettre impossible à colorier alors qu'elle est visuellement bien creuse.
    // La dilation R=7 existe pour boucher les micro-trous de compression du
    // LINEART PALÉOART (webp, anti-aliasing) — un trait `strokeText` fraîchement
    // dessiné n'a AUCUN micro-trou, donc n'a besoin d'AUCUNE dilatation de
    // sécurité. Ne change rien à la zone dino (même R=7 qu'avant, aucune
    // régression sur l'anti-fuite Cryolophosaure #6389).
    const NAME_BAND_DILATE_R = 1; // quasi nul : juste de quoi absorber l'anti-aliasing du strokeText

    function buildContourMask(src, w, h, nameBandY) {
      const base = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const li = i * 4;
        const lum = 0.299*src[li] + 0.587*src[li+1] + 0.114*src[li+2];
        if (lum < LUM_SEUIL_TRAIT) base[i] = 1;
      }
      const R = CONTOUR_DILATE_R;
      const RBand = NAME_BAND_DILATE_R;
      const out = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        const r = (typeof nameBandY === 'number' && y >= nameBandY) ? RBand : R;
        for (let x = 0; x < w; x++) {
          if (!base[y*w+x]) continue;
          for (let dy = -r; dy <= r; dy++) {
            const yy = y + dy; if (yy < 0 || yy >= h) continue;
            for (let dx = -r; dx <= r; dx++) {
              const xx = x + dx; if (xx < 0 || xx >= w) continue;
              if (dx*dx + dy*dy <= r*r) out[yy*w+xx] = 1;
            }
          }
        }
      }
      // Bande = dilaté (out=1) MAIS pas un vrai trait (base=0). C'est cette zone,
      // et SEULEMENT elle, que la passe d'extension post-fill est autorisée à
      // recolorier — jamais un pixel où base=1 (trait réel, lum < seuil).
      const band = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        if (out[i] && !base[i]) band[i] = 1;
      }
      bandMask = band;
      traitMask = base; // trait réel non dilaté : mur dur de la passe d'extension
      return out;
    }

    // ═══════════════ ÉCRAN CHOIX ═══════════════
    // HO-MJ-11 : 71 dinos en une seule grille = trop long à parcourir pour un enfant
    // de 4 ans (retour Papa Yann). Niveau 1 = familles (DINO_FAMILLES, données
    // existantes, jamais réinventées) ; niveau 2 = dinos de la famille choisie,
    // même grille/cartes qu'avant. Une famille sans AUCUN coloriage disponible
    // (asset manquant) est retirée de la grille familles — jamais un écran vide
    // sans explication : voir markFamilyAvailability() plus bas.
    let currentFamilyId = null;

    function dinosOfFamily(familyId) {
      if (familyId === PLANTES_FAMILY_ID) {
        const plantes = (typeof DINO_PLANTES !== 'undefined' ? DINO_PLANTES : []);
        return plantes.map(p => Object.assign({}, p, { isPlante: true }));
      }
      return DINOS.filter(d => d.famille === familyId);
    }

    function buildGrid(familyId) {
      currentFamilyId = familyId;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      dinosOfFamily(familyId).forEach(d => {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        const src = assetDirFor(d) + baseName(d.png) + '_coloriage.webp';
        card.innerHTML = '<img loading="lazy" src="' + src + '" alt=""><div class="tname">' + d.name + '</div>';
        const img = card.querySelector('img');
        img.onerror = () => card.remove();
        card.onclick = () => openAtelier(d);
        grid.appendChild(card);
      });
    }

    function buildFamilyGrid() {
      const fgrid = document.getElementById('familyGrid');
      fgrid.innerHTML = '';
      DINO_FAMILLES.forEach(f => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'family-card';
        card.style.background = f.bg || f.color || '#555';
        card.dataset.familyId = f.id;
        card.innerHTML = '<span class="femoji">' + f.emoji + '</span><span class="flabel">' + f.label + '</span>';
        card.onclick = () => openFamily(f.id);
        fgrid.appendChild(card);
      });
      // Carte "Les plantes" (HO-MJ-12) : ajoutée ICI, jamais dans DINO_FAMILLES
      // (donnée canon du pôle DINO partagée par l'encyclopédie — la frontière
      // autoring/produit interdit d'y greffer une notion propre à ce mini-jeu).
      // Retirée automatiquement si aucun des 6 coloriages n'est disponible, comme
      // les familles de dinos (markFamilyAvailability).
      const plantCard = document.createElement('button');
      plantCard.type = 'button';
      plantCard.className = 'family-card';
      plantCard.style.background = 'linear-gradient(135deg,#1b5e20,#66bb6a)';
      plantCard.dataset.familyId = PLANTES_FAMILY_ID;
      plantCard.innerHTML = '<span class="femoji">🌿</span><span class="flabel">' + MJi18n.t('mj-32', 'lesPlantes', 'Les plantes') + '</span>';
      plantCard.onclick = () => openFamily(PLANTES_FAMILY_ID);
      fgrid.appendChild(plantCard);
      // Comptage réel des coloriages disponibles par famille (asynchrone, silencieux) :
      // une famille dont AUCUN dino n'a de coloriage est retirée de la grille. Optimiste
      // au premier rendu (toutes visibles), correction dès que le préchargement répond —
      // jamais de blocage de l'écran de choix pour ce test.
      markFamilyAvailability();
    }

    // Précharge (sans jamais afficher) le coloriage de chaque dino/plante pour savoir
    // quelles familles ont au moins 1 coloriage réel. `img.onerror` en grille dino fait
    // déjà ce travail visuellement (carte retirée) ; ici on le fait une fois en amont
    // pour ne jamais proposer une famille qui s'ouvrirait sur une grille vide.
    let familyAvailabilityChecked = false;
    function markFamilyAvailability() {
      if (familyAvailabilityChecked) return;
      familyAvailabilityChecked = true;
      const plantes = (typeof DINO_PLANTES !== 'undefined' ? DINO_PLANTES : []);
      const pending = DINOS.length + plantes.length;
      const okByFamily = {};
      let done = 0;
      function finalize() {
        DINO_FAMILLES.forEach(f => {
          const card = document.querySelector('.family-card[data-family-id="' + f.id + '"]');
          if (!card) return;
          if (!okByFamily[f.id]) card.remove();
        });
        const plantCard = document.querySelector('.family-card[data-family-id="' + PLANTES_FAMILY_ID + '"]');
        if (plantCard && !okByFamily[PLANTES_FAMILY_ID]) plantCard.remove();
      }
      if (pending === 0) { finalize(); return; }
      DINOS.forEach(d => {
        const probe = new Image();
        const src = COLORIAGE_DIR + baseName(d.png) + '_coloriage.webp';
        probe.onload = () => { okByFamily[d.famille] = true; if (++done === pending) finalize(); };
        probe.onerror = () => { if (++done === pending) finalize(); };
        probe.src = src;
      });
      plantes.forEach(p => {
        const probe = new Image();
        const src = PLANTES_DIR + baseName(p.png) + '_coloriage.webp';
        probe.onload = () => { okByFamily[PLANTES_FAMILY_ID] = true; if (++done === pending) finalize(); };
        probe.onerror = () => { if (++done === pending) finalize(); };
        probe.src = src;
      });
    }

    function openFamily(familyId) {
      currentFamilyId = familyId;
      buildGrid(familyId);
      document.getElementById('familyView').classList.add('hidden');
      document.getElementById('dinoView').classList.remove('hidden');
    }

    function backToFamilies() {
      document.getElementById('dinoView').classList.add('hidden');
      document.getElementById('familyView').classList.remove('hidden');
      currentFamilyId = null;
    }

    function openAtelier(dino, resumeFills, resumeDecorId) {
      currentDino = dino;
      document.getElementById('screenChoice').classList.add('hidden');
      document.getElementById('screenGallery').classList.add('hidden');
      document.getElementById('screenAtelier').classList.remove('hidden');
      document.getElementById('modelImg').src = modelDirFor(dino) + dino.png;
      currentDecorId = resumeDecorId || null;
      loadLineart(dino, resumeFills, currentDecorId);
    }

    // Décor actif de l'atelier courant (HO-MJ-09 chantier B) — null = aucun fond,
    // comportement historique inchangé (canvas carré, pas de composition). Suit
    // currentDino : remis à null/à la valeur reprise à chaque (ré)ouverture d'atelier
    // (openAtelier/resumePiece), jamais persistant entre deux dinos différents.
    let currentDecorId = null;

    // ═══════════════ ATELIER : canvas + flood fill ═══════════════
    // resumeFills (optionnel) : tableau [{nx,ny,hex}] d'une œuvre déjà coloriée
    // ("Reprendre en copie") — on repart TOUJOURS du lineart ORIGINAL (webp vierge,
    // contours intacts) puis on rejoue chaque flood fill dans l'ordre exact de la
    // sauvegarde. Jamais de dataURL bitmap comme point de départ : c'est la cause
    // du bavure/contour-qui-prend-la-couleur-du-fond signalée par Papa Yann
    // (recopier un JPEG dégradé au lieu de reconstruire depuis la source vectorielle).
    // decorId (optionnel, HO-MJ-09 chantier B) : fond de paysage à composer DERRIÈRE
    // le dino avant de figer le masque de contour — voir composeDecorAndDino ci-dessous
    // pour la décision de mise en page (canvas paysage vs carré recadré).
    function loadLineart(dino, resumeFills, decorId) {
      // Toute (ré)ouverture de l'atelier repart en vue normale (HO-MJ-10) : un zoom
      // resté actif d'une session précédente sur ce même <canvas> n'a aucun sens pour
      // un nouveau dino / une nouvelle réédition — sans ce reset la transformation CSS
      // et panX/panY de l'ancien dino resteraient collés au nouveau canvas.
      zoomed = false; panX = 0; panY = 0;
      canvas = document.getElementById('paintCanvas');
      canvas.classList.remove('panning');
      canvas.style.transform = '';
      const zb = document.getElementById('zoomBtn'), zob = document.getElementById('zoomOutBtn');
      if (zb) zb.classList.remove('hidden');
      if (zob) zob.classList.add('hidden');
      ctx = canvas.getContext('2d', { willReadFrequently: true });
      const lineSrc = assetDirFor(dino) + baseName(dino.png) + '_coloriage.webp';
      const decor = decorById(decorId);
      const img = new Image();
      img.onload = () => {
        if (decor) {
          const decorImg = new Image();
          decorImg.onload = () => composeAndFinish(img, decorImg, resumeFills, decorId);
          // Décor manquant/erreur réseau : on ne bloque jamais l'atelier — repli sur
          // le dino seul (comportement identique à decorId=null), currentDecorId remis
          // à null pour que la sauvegarde suivante ne mente pas sur ce qui est affiché.
          decorImg.onerror = () => { currentDecorId = null; composeAndFinish(img, null, resumeFills, null); };
          decorImg.src = COLORIAGE_DIR + decor.file;
        } else {
          composeAndFinish(img, null, resumeFills, null);
        }
      };
      img.onerror = () => {
        // Robustesse : fond blanc simple si l'image manque
        canvas.width = 800; canvas.height = 600;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 800, 600);
        lineartData = ctx.getImageData(0, 0, 800, 600).data.slice();
        contourMask = buildContourMask(lineartData, 800, 600);
        fillHistory = [];
      };
      img.src = lineSrc;
    }

    // Compose le canvas final (dino seul, ou dino + décor) puis fige contourMask et
    // rejoue resumeFills. Point commun aux deux chemins de loadLineart (avec/sans
    // décor) pour ne jamais dupliquer la logique de masque/rejeu (source d'un bug si
    // les deux chemins divergent un jour).
    function composeAndFinish(dinoImg, decorImg, resumeFills, decorId) {
      // Redimensionne le dino pour garder ses proportions, plafonné ~800px de côté —
      // inchangé du chantier A, c'est la taille de référence pour la police/le trait du nom.
      const maxSide = 800;
      let dw = dinoImg.naturalWidth, dh = dinoImg.naturalHeight;
      const dscale = Math.min(maxSide / dw, maxSide / dh, 1);
      dw = Math.round(dw * dscale) || maxSide;
      dh = Math.round(dh * dscale) || maxSide;

      // ─── Décision de composition (HO-MJ-09 chantier B) ───
      // Le fond est en paysage (1536x1024, ratio 1.5:1), le coloriage du dino est carré.
      // Piste retenue : le canvas devient PAYSAGE (largeur = celle du dino, hauteur =
      // largeur/1.5) et affiche le fond EN ENTIER, à pleine largeur — jamais recadré.
      // Le dino est composé PAR-DESSUS, réduit et centré horizontalement, sa base posée
      // sur la ligne d'horizon des lineart (mesurée visuellement sur les 5 fichiers :
      // le sol vide commence vers 55-65% de la hauteur du fond, cf. DECOR_DINO_BASE_RATIO).
      // Rejetée : recadrer le fond au carré du dino — les 5 fonds ont justement leur
      // grande zone à colorier (le ciel) en haut, un recadrage carré centré la coupe en
      // grande partie et perd la moitié de l'intérêt du chantier ("la grande surface à
      // remplir qui plaît", cf. handoff).
      // w/h ci-dessous désignent TOUJOURS les dimensions de la zone "dino + décor" du
      // canvas (avant la bande de nom, ajoutée ensuite comme au chantier A) : avec décor
      // c'est le paysage entier, sans décor c'est le carré du dino comme avant (aucune
      // régression sur les proportions historiques quand decorId est absent/null).
      let w, h, drawScene;
      if (decorImg) {
        w = dw;
        h = Math.round(w * DECOR_RATIO_H);
        const dinoW = Math.round(w * DECOR_DINO_WIDTH_RATIO);
        const dinoH = Math.round(dinoW * (dh / dw));
        const dinoX = Math.round((w - dinoW) / 2);
        const dinoY = Math.round(h * DECOR_DINO_BASE_RATIO - dinoH);
        drawScene = (c2d) => {
          c2d.drawImage(decorImg, 0, 0, w, h);
          // Le dino se dessine APRÈS le décor : là où les deux traits se croisent,
          // c'est le trait du dino qui reste visible par-dessus (règle du handoff —
          // sinon sa silhouette se perd dans le décor). drawImage écrase les pixels
          // du décor sous le rectangle du dino, contour dino compris.
          c2d.drawImage(dinoImg, dinoX, dinoY, dinoW, dinoH);
        };
      } else {
        w = dw; h = dh;
        drawScene = (c2d) => { c2d.drawImage(dinoImg, 0, 0, w, h); };
      }

      // HO-MJ-09 chantier A : mesure la bande de nom AVANT de fixer canvas.height
      // (measureText ne dépend pas des dimensions du canvas, seulement de ctx.font) —
      // on dimensionne le canvas une seule fois, pas de redraw après coup.
      canvas.width = w; // nécessaire pour que ctx soit lié à un canvas de la bonne largeur
      const dinoName = (currentDino && currentDino.name) || '';
      const bandH = dinoName ? measureNameBandHeight(ctx, dinoName, w) : 0;
      canvas.width = w;
      canvas.height = h + bandH;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h + bandH);
      drawScene(ctx);
      if (dinoName) {
        // Mur de séparation scène/bande de nom (bug trouvé en recette Playwright,
        // HO-MJ-09) : sans ce trait, le fond blanc de la scène et le fond blanc de
        // la bande de nom ne forment qu'UNE SEULE zone blanche continue pour le
        // flood fill — colorier n'importe quelle lettre remplissait TOUT le
        // dino/décor (et inversement). Un trait plein largeur, aussi épais que le
        // diamètre de dilatation du masque de contour (2×CONTOUR_DILATE_R),
        // fait de cette ligne un mur infranchissable même après dilation.
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = CONTOUR_DILATE_R * 2 + 2;
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(w, h);
        ctx.stroke();
        drawHollowName(ctx, dinoName, w, h, bandH);
      }
      // Fige le masque de contours APRÈS avoir dessiné le nom (et le décor) : tout
      // doit entrer dans le masque comme le reste du lineart (point clé du handoff —
      // dessiner après buildContourMask casserait le coloriage des lettres/du décor).
      // nameBandY=h : à partir du mur de séparation, dilatation réduite
      // (NAME_BAND_DILATE_R) — le mur reste un vrai mur (dessiné épais
      // directement, cf. plus haut), mais les intérieurs de lettres ne sont
      // plus avalés par une dilatation de 7px calibrée pour le lineart dino.
      lineartData = ctx.getImageData(0, 0, w, h + bandH).data.slice();
      contourMask = buildContourMask(lineartData, w, h + bandH, dinoName ? h : undefined);

      fillHistory = [];
      if (resumeFills && resumeFills.length) {
        resumeFills.forEach(f => {
          const x = Math.max(0, Math.min(w - 1, Math.round(f.nx * w)));
          const y = Math.max(0, Math.min(h + bandH - 1, Math.round(f.ny * (h + bandH))));
          if (floodFill(x, y, f.hex)) fillHistory.push({ nx: f.nx, ny: f.ny, hex: f.hex });
        });
      }
    }

    function hexToRgb(hex) {
      const c = hex.replace('#', '');
      return [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)];
    }

    // Flood fill scanline sur ImageData — la détection de "contour" se base TOUJOURS
    // sur le masque dilaté figé au chargement (contourMask, dérivé du lineart original),
    // jamais sur les couleurs déjà posées. Ça permet de recolorier une zone à l'infini,
    // y compris si elle a été remplie en noir : le noir posé par l'enfant n'est plus
    // confondu avec le trait de contour. La dilation bouche les micro-trous du trait
    // (fuite fond→dino, retour PY #6389).
    function isContour(li) {
      return contourMask[li >> 2] === 1;
    }

    function floodFill(startX, startY, fillHex) {
      const w = canvas.width, h = canvas.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const idx = (x, y) => (y * w + x) * 4;

      const si = idx(startX, startY);

      // Si on tape sur un trait de contour, on « aspire » le tap vers la zone
      // libre la plus proche (rayon 10px) — avec le masque dilaté, un tap imprécis
      // de tout-petit près d'un trait doit quand même colorier la zone visée.
      if (isContour(si)) {
        let found = null;
        outer:
        for (let r = 1; r <= 10; r++) {
          for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
              if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; // anneau courant seulement
              const nx = startX + dx, ny = startY + dy;
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              if (!isContour(idx(nx, ny))) { found = [nx, ny]; break outer; }
            }
          }
        }
        if (!found) return false;
        startX = found[0]; startY = found[1];
      }

      const startR = data[si], startG = data[si+1], startB = data[si+2];
      const [fr, fg, fb] = hexToRgb(fillHex);
      // Si déjà (quasi) la couleur cible, rien à faire
      if (Math.abs(startR-fr) < 6 && Math.abs(startG-fg) < 6 && Math.abs(startB-fb) < 6) return false;

      const TOL = 48; // tolérance anti-aliasing webp
      const visited = new Uint8Array(w * h);
      const stack = [[startX, startY]];
      // Bord de la zone remplie, collecté span par span PENDANT le flood fill (scanline) :
      // sert de source directe à l'extension dans la bande, sans devoir rescanner w*h
      // pixels après coup (perf — canvas 800×800, doit rester < 50ms, cf. handoff HO-MJ-08).
      const filledSpans = []; // [xl, xr, y, xl, xr, y, ...]

      while (stack.length) {
        let [x, y] = stack.pop();
        // Remonte à gauche jusqu'au bord de zone
        let xl = x;
        while (xl > 0 && canFill(data, idx(xl-1, y), startR, startG, startB, TOL)) xl--;
        let xr = x;
        while (xr < w-1 && canFill(data, idx(xr+1, y), startR, startG, startB, TOL)) xr++;
        filledSpans.push(xl, xr, y);

        let spanAbove = false, spanBelow = false;
        for (let xi = xl; xi <= xr; xi++) {
          const pi = idx(xi, y);
          if (!visited[y*w+xi] && canFill(data, pi, startR, startG, startB, TOL)) {
            data[pi] = fr; data[pi+1] = fg; data[pi+2] = fb; data[pi+3] = 255;
            visited[y*w+xi] = 1;
          }
          if (y > 0) {
            const pAbove = idx(xi, y-1);
            const okAbove = !visited[(y-1)*w+xi] && canFill(data, pAbove, startR, startG, startB, TOL);
            if (okAbove && !spanAbove) { stack.push([xi, y-1]); spanAbove = true; }
            else if (!okAbove) spanAbove = false;
          }
          if (y < h-1) {
            const pBelow = idx(xi, y+1);
            const okBelow = !visited[(y+1)*w+xi] && canFill(data, pBelow, startR, startG, startB, TOL);
            if (okBelow && !spanBelow) { stack.push([xi, y+1]); spanBelow = true; }
            else if (!okBelow) spanBelow = false;
          }
        }
      }
      extendFillIntoBand(data, w, h, idx, filledSpans, fr, fg, fb);
      ctx.putImageData(imgData, 0, 0);
      return true;
    }

    function canFill(data, pi, r0, g0, b0, tol) {
      if (isContour(pi)) return false; // jamais franchir un trait du dessin original
      const r = data[pi], g = data[pi+1], b = data[pi+2];
      return Math.abs(r-r0) <= tol && Math.abs(g-g0) <= tol && Math.abs(b-b0) <= tol;
    }

    // ─── Extension dans la bande de dilatation (HO-MJ-08, 2026-09-08) ───
    // Le flood fill principal s'arrête sur contourMask (masque DILATÉ de
    // CONTOUR_DILATE_R px) : nécessaire pour ne pas fuir à travers les micro-trous
    // du trait (#6389), mais ça laisse une bande blanche de ~R px entre la couleur
    // et le vrai trait noir — c'est le « halo blanc » signalé par Papa Yann.
    // Cette passe BFS multi-source part des pixels tout juste remplis (`visited`)
    // et avance UNIQUEMENT dans bandMask (dilaté mais lineart clair, PAS un vrai
    // trait) jusqu'à CONTOUR_DILATE_R itérations — donc jamais plus loin que la
    // largeur de la bande, jamais à travers un pixel où le lineart est sombre.
    // Effet de bord accepté (documenté dans le handoff) : au droit d'une VRAIE
    // brèche du trait (Cryolophosaure), la couleur peut baver de R px max de
    // l'autre côté — une tache, pas une fuite de zone entière.
    // Buffer de visite RÉUTILISÉ entre les appels (une passe = quelques dizaines de
    // milliers de marquages max sur un fond entier ; réallouer 640 000 octets par
    // clic était le principal coût mesuré). Un compteur de "génération" évite d'avoir
    // à le remettre à zéro entre deux fills : un pixel n'est "visité" que si sa valeur
    // stockée == la génération courante.
    let _bandVisitedGen = null;   // Uint32Array(w*h), lazy-créé à la taille du canvas courant
    let _bandVisitedTag = 0;
    let _bandFront = null;        // Int32Array(w*h*3), même principe : alloué une fois par taille de canvas
    function _ensureBandBuffers(w, h) {
      if (!_bandVisitedGen || _bandVisitedGen.length !== w * h) {
        _bandVisitedGen = new Uint32Array(w * h);
        _bandFront = new Int32Array(w * h * 3);
        _bandVisitedTag = 0;
      }
      _bandVisitedTag++;
    }

    function extendFillIntoBand(data, w, h, idx, filledSpans, fr, fg, fb) {
      if (!bandMask) return;
      _ensureBandBuffers(w, h);
      const bandVisited = _bandVisitedGen;
      const tag = _bandVisitedTag;
      const R = CONTOUR_DILATE_R;
      // Frontière typée réutilisée entre appels (allouée une fois par taille de
      // canvas, cf. _ensureBandBuffers) : au pire un pixel de bande entre 1 fois
      // (marqué par tag), donc w*h*3 borne large et sûre sans réallocation ni push().
      const front = _bandFront;
      let frontLen = 0;

      function tryAdd(nx, ny, dist) {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
        const ni = ny * w + nx;
        // Le trait réel est un mur DUR pour l'extension : sans ça, un trait plus fin
        // que la bande de dilatation (voile du Spinosaure : 3 px contre 7 px de bande)
        // est entièrement recouvert par la bande, la BFS le traverse et la couleur
        // ressort de l'autre côté. Mesuré et corrigé par l'orchestrateur (HO-MJ-08).
        if (traitMask && traitMask[ni]) return;
        if (bandMask[ni] && bandVisited[ni] !== tag) {
          bandVisited[ni] = tag;
          front[frontLen++] = nx; front[frontLen++] = ny; front[frontLen++] = dist;
        }
      }

      // Source multi-points : seuls les pixels de bande touchant le BORD de la
      // zone remplie (spans scanline du fill qui vient de tourner) amorcent la
      // BFS — jamais un scan w×h. `filledSpans` ne contient que les lignes
      // effectivement traversées par le fill, donc son coût est proportionnel
      // à la taille de la zone coloriée, pas à la taille du canvas.
      for (let s = 0; s < filledSpans.length; s += 3) {
        const xl = filledSpans[s], xr = filledSpans[s+1], y = filledSpans[s+2];
        tryAdd(xl - 1, y, 0);
        tryAdd(xr + 1, y, 0);
        for (let xi = xl; xi <= xr; xi++) {
          tryAdd(xi, y - 1, 0);
          tryAdd(xi, y + 1, 0);
        }
      }

      let head = 0;
      while (head < frontLen) {
        const x = front[head], y = front[head+1], dist = front[head+2];
        head += 3;
        const pi = idx(x, y);
        data[pi] = fr; data[pi+1] = fg; data[pi+2] = fb; data[pi+3] = 255;
        if (dist >= R) continue;
        tryAdd(x - 1, y, dist + 1);
        tryAdd(x + 1, y, dist + 1);
        tryAdd(x, y - 1, dist + 1);
        tryAdd(x, y + 1, dist + 1);
      }
    }

    function canvasPointFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      const x = Math.round(cx * (canvas.width / rect.width));
      const y = Math.round(cy * (canvas.height / rect.height));
      return [Math.max(0, Math.min(canvas.width-1, x)), Math.max(0, Math.min(canvas.height-1, y))];
    }

    function handleTap(e) {
      if (filling || !canvas) return;
      e.preventDefault();
      const [x, y] = canvasPointFromEvent(e);
      filling = true;
      const changed = floodFill(x, y, selectedColor);
      if (changed) {
        // Zone-JSON : on note SEULEMENT le point de départ normalisé + la couleur.
        // Rejouable à l'identique sur le lineart original (cf. loadLineart).
        fillHistory.push({ nx: x / canvas.width, ny: y / canvas.height, hex: selectedColor });
        if (typeof sndDing === 'function') sndDing();
      }
      filling = false;
    }

    function buildPalette() {
      const pal = document.getElementById('palette');
      pal.innerHTML = '';
      PALETTE.forEach((c, i) => {
        const sw = document.createElement('div');
        sw.className = 'swatch' + (i === 0 ? ' sel' : '');
        sw.style.background = c.hex;
        sw.dataset.hex = c.hex;
        sw.onclick = () => {
          selectedColor = c.hex;
          document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
          sw.classList.add('sel');
        };
        pal.appendChild(sw);
      });
      const eraser = document.createElement('div');
      eraser.className = 'swatch eraser';
      eraser.textContent = '🧽';
      eraser.onclick = () => {
        selectedColor = '#ffffff';
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
        eraser.classList.add('sel');
      };
      pal.appendChild(eraser);
    }

    // ═══════════════ Modèle (aperçu couleur 2s) ═══════════════
    function showModel() {
      const overlay = document.getElementById('modelOverlay');
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 2000);
    }

    // ═══════════════ Fini ! → sauvegarde galerie ═══════════════
    // Modèle de données : {dinoId, zones} en JSON — PAS un bitmap compressé.
    // "thumb" (dataURL basse résolution) sert UNIQUEMENT à afficher la vignette de
    // la grille galerie (perf : éviter de rejouer N flood fills pour chaque carte).
    // La RÉÉDITION ("Reprendre en copie") ignore totalement thumb : elle repart du
    // lineart original + fills (cf. resumePiece → loadLineart). Retour Papa Yann :
    // "on garde en json quelle couleur dans quelle zone" — jamais recopier un JPEG.
    function finishPainting() {
      const outW = 300;
      const outH = Math.round(canvas.height * (outW / canvas.width));
      const out = document.createElement('canvas');
      out.width = outW; out.height = outH;
      out.getContext('2d').drawImage(canvas, 0, 0, outW, outH);
      const thumb = out.toDataURL('image/jpeg', 0.72);

      saveToGallery({
        id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
        name: currentDino.name,
        png: currentDino.png,
        // isPlante (HO-MJ-12) : sauvegardé DANS l'œuvre pour que "Reprendre en copie"
        // retrouve le bon dossier d'assets (img/dinos/plantes/ vs paleoart/) sans avoir
        // à re-chercher le nom dans DINOS/DINO_PLANTES par coïncidence de basename png.
        isPlante: !!currentDino.isPlante,
        // decorId (HO-MJ-09 chantier B) : sauvegardé DANS l'œuvre, sinon la réédition
        // depuis la galerie ne retrouve pas le fond et le rejeu des fills (coordonnées
        // normalisées sur un canvas paysage) tombe à côté sur un canvas recomposé carré.
        // null si aucun décor choisi — comportement historique (canvas carré), et c'est
        // aussi ce que retrouvent les anciennes œuvres sans ce champ (cf. resumePiece).
        decorId: currentDecorId || null,
        fills: fillHistory.slice(),
        thumb,
        date: Date.now()
      });

      // Une seule voix à la fois (HO-MJ-08, retour Papa Yann : fanfare + voix MP3
      // du pool + TTS partaient ensemble, "pas clair"). Fanfare seule d'abord, PUIS
      // la phrase nominative (langue du site) une fois la fanfare terminée —
      // opts.voice:false coupe la voix MP3 du pool, opts.onFanfareEnd enchaîne le TTS.
      const direNom = () => {
        if (window.TTS && TTS.supported()) {
          TTS.speak(MJi18n.t('mj-32', 'magnifiqueNom', 'Magnifique ! Ton {nom} est superbe !', { nom: currentDino.name }), { pitch: 1.05, priority: true });
        }
      };
      if (typeof playEndSound === 'function') {
        playEndSound(1, 1, { voice: false, onFanfareEnd: direNom });
      } else {
        direNom();
      }
      if (window.MaxFX) MaxFX.finalStar(document.getElementById('screenAtelier'), {style:'breathe', label: MJi18n.t('mj-32', 'magnifique', 'Magnifique !')});

      setTimeout(() => openGallery(), 900);
    }

    function loadGallery() {
      try { return JSON.parse(localStorage.getItem(GALLERY_KEY)) || []; }
      catch (e) { return []; }
    }

    function saveToGallery(piece) {
      let list = loadGallery();
      list.push(piece);
      if (list.length > GALLERY_MAX) list = list.slice(list.length - GALLERY_MAX);
      persistGallery(list);
    }

    function persistGallery(list) {
      try {
        localStorage.setItem(GALLERY_KEY, JSON.stringify(list));
      } catch (e) {
        // QuotaExceededError → drop les plus vieux jusqu'à ce que ça rentre
        while (list.length > 1) {
          list = list.slice(1);
          try {
            localStorage.setItem(GALLERY_KEY, JSON.stringify(list));
            break;
          } catch (e2) { /* continue à réduire */ }
        }
      }
    }

    function deleteFromGallery(id) {
      const list = loadGallery().filter(p => p.id !== id);
      persistGallery(list);
    }

    // ═══════════════ Galerie ═══════════════
    function openGallery() {
      document.getElementById('screenChoice').classList.add('hidden');
      document.getElementById('screenAtelier').classList.add('hidden');
      document.getElementById('screenGallery').classList.remove('hidden');
      renderGallery();
    }

    const LONG_PRESS_MS = 600;
    let pendingDeleteId = null;

    function renderGallery() {
      const list = loadGallery();
      const grid = document.getElementById('galleryView');
      const empty = document.getElementById('galleryEmpty');
      grid.innerHTML = '';
      if (!list.length) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      [...list].reverse().forEach(piece => {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        // Vignette : thumb (nouveau modèle JSON) sinon img (migration ancien bitmap)
        const src = piece.thumb || piece.img || '';
        card.innerHTML = '<img class="piece" src="' + src + '" alt=""><div class="tname">' + piece.name + '</div>';

        let pressTimer = null;
        let longPressed = false;
        const startPress = () => {
          longPressed = false;
          pressTimer = setTimeout(() => { longPressed = true; askDelete(piece.id); }, LONG_PRESS_MS);
        };
        const cancelPress = () => { clearTimeout(pressTimer); };
        card.addEventListener('pointerdown', startPress);
        card.addEventListener('pointerup', cancelPress);
        card.addEventListener('pointerleave', cancelPress);
        card.addEventListener('pointercancel', cancelPress);
        card.onclick = () => { if (!longPressed) showBig(piece); };

        grid.appendChild(card);
      });
    }

    function showBig(piece) {
      document.getElementById('bigImg').src = piece.thumb || piece.img || '';
      document.getElementById('bigView').dataset.pieceId = piece.id;
      // "Reprendre en copie" n'a de sens QUE pour le modèle JSON zones (fills) —
      // les anciennes œuvres bitmap (migration, avant ce refactor) restent
      // consultables mais en lecture seule : pas de fills = pas de reprise fidèle
      // possible (on ne peut plus reconstruire les zones depuis un JPEG dégradé).
      const canResume = !!(piece.png && piece.fills && piece.fills.length);
      document.getElementById('resumeBtn').classList.toggle('hidden', !canResume);
      document.getElementById('bigView').classList.remove('hidden');
    }

    function closeBig() {
      document.getElementById('bigView').classList.add('hidden');
    }

    // "Reprendre en copie" : recharge l'œuvre comme point de départ d'un NOUVEAU
    // coloriage, en rejouant les fills JSON sur le lineart ORIGINAL (jamais un
    // bitmap). L'original en galerie n'est jamais modifié ni supprimé.
    function resumePiece() {
      const id = document.getElementById('bigView').dataset.pieceId;
      const piece = loadGallery().find(p => p.id === id);
      if (!piece || !piece.png || !piece.fills || !piece.fills.length) return;
      closeBig();
      // isPlante décide la source de recherche : une œuvre plante n'existe pas dans
      // DINOS, une œuvre dino n'a rien à faire dans DINO_PLANTES. Fallback {name,png}
      // pour les anciennes œuvres sauvegardées avant ce champ (migration douce, comme
      // pour fills/decorId), toujours cherché côté DINOS (comportement historique).
      const pool = piece.isPlante
        ? (typeof DINO_PLANTES !== 'undefined' ? DINO_PLANTES : [])
        : (typeof DINOS !== 'undefined' ? DINOS : []);
      const found = pool.find(d => d.png === piece.png);
      const dino = found
        ? Object.assign({}, found, { isPlante: !!piece.isPlante })
        : { name: piece.name, png: piece.png, isPlante: !!piece.isPlante };
      document.getElementById('screenChoice').classList.add('hidden');
      document.getElementById('screenGallery').classList.add('hidden');
      document.getElementById('screenAtelier').classList.remove('hidden');
      currentDino = dino;
      document.getElementById('modelImg').src = modelDirFor(dino) + dino.png;
      // decorId (HO-MJ-09 chantier B) : une œuvre sauvegardée AVANT ce chantier n'a
      // pas ce champ (piece.decorId undefined) → currentDecorId reste null, le canvas
      // recomposé est le carré historique (aucun fond) — comportement de migration
