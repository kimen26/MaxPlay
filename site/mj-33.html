<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-33 – Memory des ombres</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { background: linear-gradient(160deg,#241a3d,#140f24); }
    .instruction-text { text-align:center; font-size:1.15rem; font-weight:900; color:#ffe066; margin:8px 12px 2px; }

    .board {
      flex:1; display:grid; gap:10px; padding:10px;
      justify-content:center; align-content:center;
      max-width:640px; margin:0 auto; width:100%;
    }

    .card {
      width:100%; aspect-ratio:1/1; min-width:80px; min-height:80px;
      perspective:800px; cursor:pointer;
    }
    .card-inner {
      position:relative; width:100%; height:100%;
      transform-style:preserve-3d; transition:transform .4s;
    }
    .card.flipped .card-inner { transform:rotateY(180deg); }
    .card-face {
      position:absolute; inset:0; border-radius:16px;
      backface-visibility:hidden; display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 10px #0006;
    }
    .card-back {
      background:linear-gradient(135deg,#6a4fd6,#8a6ff0);
      font-size:2rem; border:3px solid #ffffff33;
    }
    .card-front {
      background:#fff; transform:rotateY(180deg); padding:8px; border:3px solid transparent;
      overflow:hidden;
    }
    .card-front img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
    .card.matched .card-front { border-color:#ffd633; box-shadow:0 0 16px #ffd63399; }
    .card.matched { cursor:default; }
    .card.matched .card-inner { animation:matchGlow .6s ease; }
    @keyframes matchGlow {
      0%   { filter:brightness(1); }
      40%  { filter:brightness(1.6) drop-shadow(0 0 12px #ffd633); }
      100% { filter:brightness(1); }
    }
    .card.shake .card-inner { animation:none; }

    .fait-toast {
      position:fixed; left:50%; bottom:14px; transform:translateX(-50%) translateY(20px);
      background:#111a; backdrop-filter:blur(4px); color:#fff; font-weight:700;
      font-size:.95rem; padding:10px 18px; border-radius:16px; max-width:90%;
      text-align:center; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none;
      border:1px solid #ffd63355;
    }
    .fait-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">&#8592;</a>
      <span class="htitle">🃏 Memory des ombres</span>
    </div>
    <div class="pips" id="pips"></div>

    <div class="instruction-text" id="instruction">Trouve l'ombre et son dino !</div>

    <div class="board" id="board"></div>
  </div>
  <div class="fait-toast" id="faitToast"></div>

  <script src="js/sounds.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/mj-golden.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/dinos-data.js"></script>
  <script src="js/dinos-i18n.js"></script>
  <script src="js/dinos-audio-manifest.js"></script>
  <script>
    // ─── MJ-33 — Memory des ombres : associe l'ombre au dino en couleur ───
    const G = Golden.setup('mj-33');
    const NPAIRS = G.totalQ; // 4 / 6 / 8 (standard golden)
    const level = G.level;

    // Familles "cousines" pour corser le niveau 2 (ombres proches = discrimination)
    const COUSIN_GROUPS = [
      ['triceratops', 'torosaurus', 'pentaceratops', 'centrosaurus'],
      ['velociraptor', 'deinonychus', 'utahraptor'],
      ['brachiosaurus', 'diplodocus', 'apatosaurus', 'camarasaurus'],
      ['tyrannosaurus', 'tarbosaurus', 'albertosaurus'],
      ['ankylosaurus', 'euoplocephalus', 'edmontonia'],
    ];

    // Dinos iconiques très différents pour L0 (silhouettes faciles à distinguer)
    const ICONIC = ['tyrannosaurus', 'triceratops', 'brachiosaurus', 'stegosaurus',
                     'pteranodon', 'ankylosaurus', 'velociraptor', 'spinosaurus'];

    // Plus d'exclusion : les 11 heros manquants ont ete promus depuis le staging (2026-07-05)
    const NO_ASSET = new Set();

    function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

    function shadowSrc(png) {
      return 'img/dinos/ombres/' + png.replace(/\.[a-z]+$/i, '') + '_ombre.png';
    }
    function colorSrc(png) {
      return 'img/dinos/' + png;
    }

    function pickDinos() {
      const byId = {};
      DINOS.forEach(d => byId[d.id] = d);
      const available = id => byId[id] && !NO_ASSET.has(id);

      if (level === 0) {
        return shuffle(ICONIC.filter(available)).slice(0, NPAIRS).map(id => byId[id]);
      }
      if (level === 1) {
        // mélange iconiques + quelques autres, sans cousins proches
        const pool = shuffle(DINOS.map(d => d.id).filter(available));
        return pool.slice(0, NPAIRS).map(id => byId[id]);
      }
      // level 2 : inclut 1 groupe de cousins (discrimination) + reste aléatoire
      const eligibleGroups = COUSIN_GROUPS.map(g => g.filter(available)).filter(g => g.length >= 2);
      const group = shuffle(eligibleGroups)[0] || [];
      const cousinPick = shuffle(group).slice(0, Math.min(3, group.length, NPAIRS));
      const rest = shuffle(DINOS.map(d => d.id).filter(id => available(id) && !cousinPick.includes(id)));
      const ids = [...cousinPick, ...rest].slice(0, NPAIRS);
      return ids.map(id => byId[id]);
    }

    let cards = [];
    let flipped = [];      // cartes actuellement retournées (0,1 ou 2)
    let matchedCount = 0;
    let lock = false;
    let attemptsSinceLastPair = 0; // flips ratés depuis la dernière paire trouvée
    let pairIndex = 0;
    let currentDinoAudio = null; // réf unique : stoppe le son en cours avant d'en jouer un nouveau

    // Stoppe l'audio nom en cours (s'il existe) puis joue le nouveau. Garde une seule réf.
    function playDinoNomExclusive(id, fallbackName, opts) {
      if (currentDinoAudio) {
        try { currentDinoAudio.pause(); currentDinoAudio.currentTime = 0; } catch (e) { /* noop */ }
      }
      currentDinoAudio = playDinoNom(id, fallbackName, opts);
    }

    function speak(t) { TTS.speak(t, { pitch: 1.05, priority: true, rate: 0.95 }); }

    function firstSentence(txt) {
      if (!txt) return '';
      const m = txt.match(/^[^.!?]+[.!?]/);
      return m ? m[0] : txt;
    }

    function showFait(dino) {
      const el = document.getElementById('faitToast');
      el.textContent = firstSentence(dino.fait);
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2600);
    }

    function buildBoard() {
      const dinos = pickDinos();
      const deck = [];
      dinos.forEach(d => {
        deck.push({ dinoId: d.id, kind: 'ombre' });
        deck.push({ dinoId: d.id, kind: 'couleur' });
      });
      cards = shuffle(deck);

      const board = document.getElementById('board');
      const cols = NPAIRS <= 4 ? 4 : (NPAIRS <= 6 ? 4 : 4);
      board.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
      board.innerHTML = '';

      cards.forEach((c, i) => {
        const d = dinos.find(x => x.id === c.dinoId);
        const btn = document.createElement('div');
        btn.className = 'card';
        btn.dataset.index = i;
        btn.dataset.dinoId = c.dinoId;
        btn.dataset.kind = c.kind;
        btn.innerHTML =
          '<div class="card-inner">' +
            '<div class="card-face card-back">🐾</div>' +
            '<div class="card-face card-front"><img src="' + (c.kind === 'ombre' ? shadowSrc(d.png) : colorSrc(d.png)) + '" alt=""></div>' +
          '</div>';
        btn.addEventListener('click', () => onCardClick(i));
        board.appendChild(btn);
      });
    }

    function cardEl(i) { return document.querySelector('.card[data-index="' + i + '"]'); }

    function onCardClick(i) {
      if (lock) return;
      const el = cardEl(i);
      if (!el || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      if (flipped.includes(i)) return;

      el.classList.add('flipped');
      flipped.push(i);

      const d = DINOS.find(x => x.id === cards[i].dinoId);
      playDinoNomExclusive(d.id, d.name);   // voix réelle narrateur, fallback TTS ; stoppe le son en cours

      if (flipped.length === 2) {
        lock = true;
        const [a, b] = flipped;
        const same = cards[a].dinoId === cards[b].dinoId;
        if (same) {
          setTimeout(() => resolveMatch(a, b), 350);
        } else {
          attemptsSinceLastPair++;
          setTimeout(() => resolveMismatch(a, b), 1000);
        }
      }
    }

    function resolveMatch(a, b) {
      const elA = cardEl(a), elB = cardEl(b);
      elA.classList.add('matched');
      elB.classList.add('matched');
      flipped = [];
      lock = false;
      matchedCount++;

      sndDing();
      const d = DINOS.find(x => x.id === cards[a].dinoId);

      // 1 fois sur 3 : mini-fait après le nom
      const wantsFait = Math.random() < (1 / 3) && d.fait;
      playDinoNomExclusive(d.id, 'Le ' + d.name + ' !', {
        then: wantsFait ? () => { showFait(d); speak(firstSentence(d.fait)); } : null,
      });

      // Perfect = 0 flip raté depuis la dernière paire, généreux au-delà
      const attempts = attemptsSinceLastPair === 0 ? 1
                      : attemptsSinceLastPair <= 2 ? 2
                      : attemptsSinceLastPair <= 4 ? 3 : 4;
      G.notePip(pairIndex, attempts);
      pairIndex++;
      attemptsSinceLastPair = 0;

      if (matchedCount >= NPAIRS) {
        setTimeout(showEnd, wantsFait ? 2200 : 700);
      }
    }

    function resolveMismatch(a, b) {
      cardEl(a).classList.remove('flipped');
      cardEl(b).classList.remove('flipped');
      flipped = [];
      lock = false;
    }

    function showEnd() {
      G.showEnd({ replayUrl: 'mj-33.html' });
    }

    function init() {
      G.buildPips();
      buildBoard();
    }

    init();
  </script>
  <script src="js/tracker.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/back-button.js"></script>
</body>
</html>
