<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-34 — Le dépôt bloqué</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* --- GABARIT DESIGN SYSTEM v1 (juillet 2026) ---
       Le header .hdr est stylé par mp-theme.css (compat) : NE PAS redéclarer
       .hdr/.htitle en local. NE PAS mettre de background sur body :
       le fond vient de l'AMBIANCE (data-ambiance posé par mp-theme.js). */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; color:var(--ink); display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    .stage {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:10px; min-height:0; position:relative;
    }
    .mission-banner {
      position:absolute; top:2px; left:50%; transform:translateX(-50%);
      background:var(--gold,#ffd166); color:#1a1a2e; font-weight:900; font-size:.85rem;
      padding:5px 14px; border-radius:0 0 10px 10px; z-index:15; text-align:center;
      box-shadow:0 3px 8px rgba(0,0,0,0.35); pointer-events:none;
      opacity:0; transition:opacity .3s;
    }
    .mission-banner.show { opacity:1; }
    #board {
      position:relative; background:rgba(0,0,0,0.35); border-radius:14px;
      box-shadow:inset 0 0 0 3px rgba(255,255,255,0.08);
      touch-action:none;
    }
    .cell-grid { position:absolute; inset:0; pointer-events:none; }
    .grid-line-v, .grid-line-h { position:absolute; background:rgba(255,255,255,0.06); }

    /* --- Mur du dépôt (enceinte) + porte de sortie --- */
    .depot-wall-seg {
      position:absolute; pointer-events:none; box-sizing:border-box;
      box-shadow:inset 0 0 0 3px #3a2c1e;
    }
    .depot-door {
      position:absolute; pointer-events:none;
      background:repeating-linear-gradient(45deg, #2a2a3a, #2a2a3a 8px, #1a1a26 8px, #1a1a26 16px);
      border-top:6px solid #5a4632; border-bottom:6px solid #5a4632;
    }
    .depot-door-post {
      position:absolute; width:8px; background:#8a6a44; pointer-events:none;
      box-shadow:inset 0 0 0 1px #5a4632;
    }
    /* Panneau SORTIE : VERT, posé DEVANT l'ouverture (retour PY 2026-07-27),
       pas au-dessus du mur — il flotte sur la porte, au-dessus du damier. */
    .depot-door-sign {
      position:absolute; display:flex; align-items:center; justify-content:center;
      background:#2e9e4f; color:#fff; font-weight:900; font-size:.78rem; text-align:center;
      border:2px solid #fff; border-radius:6px; pointer-events:none; line-height:1.05;
      box-shadow:0 3px 8px rgba(0,0,0,0.55); z-index:6; letter-spacing:.5px;
    }

    .exit-arrow {
      position:absolute; display:flex; align-items:center; justify-content:center;
      font-size:1.6rem; color:var(--gold,#ffd166); pointer-events:none; animation:arrowPulse 1s ease-in-out infinite;
    }
    @keyframes arrowPulse { 0%,100%{ transform:translateX(0); opacity:.7; } 50%{ transform:translateX(6px); opacity:1; } }

    .car.is-max.intro-blink { animation:maxIntroBlink .5s ease-in-out 2; }
    @keyframes maxIntroBlink { 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.9) drop-shadow(0 0 10px #ffd166); } }

    .other-bus.leaving { transition:left .5s cubic-bezier(.4,0,.2,1); }

    .car {
      position:absolute; cursor:grab; touch-action:none;
      filter:drop-shadow(0 3px 6px rgba(0,0,0,0.5));
      transition:left .18s ease, top .18s ease;
      will-change:left, top;
    }
    .car.dragging { cursor:grabbing; transition:none; z-index:20; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.7)); }
    .car.is-max svg { filter:drop-shadow(0 0 6px #ffd16688); }
    /* Retour PY 2026-07-19 : UN SEUL bus doit sortir → les autres sont « éteints » */
    .car.obstacle svg { filter:grayscale(.8) brightness(.55); }
    .car.obstacle.dragging svg, .car.obstacle:active svg { filter:grayscale(.55) brightness(.75); }
    .car svg { display:block; width:100%; height:100%; }
    .car.bounce { animation:bounceBack .22s ease; }
    @keyframes bounceBack { 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(var(--bx,0),var(--by,0)); } }
    .car.exiting { transition:left .55s cubic-bezier(.4,0,.2,1); }

  </style>
</head>
<body>
<div id="app">

  <!-- HEADER — copier tel quel, changer uniquement l'emoji et le titre -->
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🚧 Le dépôt bloqué</span>
  </div>

  <div class="pips" id="pips"></div>

  <div class="stage">
    <div class="mission-banner" id="missionBanner">🚌 Libère le bus jaune !</div>
    <div id="board"></div>
  </div>

</div>
  <script src="js/bus-svg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mj-shell.js"></script>
  <script>
  MJ.ready(function () {
    const shell = MJ.init({
      id: 'mj-34', emoji: '🚧', titre: 'Le dépôt bloqué',
      golden: true,
      consigne: false,
      regle: {
        picto: '🚌➡️🚪',
        texte: 'Fais glisser les bus pour libérer le bus jaune !',
        etapes: [
          { t: 'Je repère le bus jaune 🟡',
            d: 'Il clignote au début du niveau. Il doit sortir par la porte « SORTIE » à droite.' },
          { t: 'Je fais glisser les autres bus 👆',
            d: 'Chaque bus ne bouge que dans un sens (à plat ou debout). Je les pousse pour dégager le chemin.' },
          { t: 'Si un bus ne peut pas bouger, il rebondit doucement ↩️',
            d: 'Pas de souci : je réessaie dans l’autre sens, il n’y a jamais d’erreur qui compte contre moi.' },
          { t: 'Le bus jaune sort, puis tous les autres suivent 🎉',
            d: 'Plus de niveaux : la grille grandit (4×4 puis 5×5) et il y a plus de bus à déplacer. 3 niveaux gagnés = une étoile !' }
        ]
      }
    });
    // ═══════════════════════════════════════════════════════════════════
    // MJ-34 — Le dépôt bloqué (Rush Hour bus)
    // Grille 4×4 (★), 5×5 (★★/★★★). Bus de Max horizontal, sortie à droite.
    // Niveaux précalculés + vérifiés par solveur BFS (voir scratchpad session).
    // Zéro pénalité : bus bloqué = bounce doux, aucun son négatif.
    // ═══════════════════════════════════════════════════════════════════

    // ── Niveaux (cars[0] = TOUJOURS le bus de Max, horizontal, sortie ligne exitRow) ──
    // moves = nb de coups optimal vérifié par BFS (info interne, jamais affichée à Max)
    const LEVELS = {
      1: [ // ★ grille 4×4, 2-3 coups
        { N:4, moves:3, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:1 },
          { id:'A', horiz:false, len:2, x:3, y:1 },
          { id:'B', horiz:true,  len:2, x:0, y:3 },
        ]},
        { N:4, moves:3, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:2 },
          { id:'A', horiz:false, len:2, x:3, y:1 },
          { id:'B', horiz:true,  len:2, x:0, y:0 },
        ]},
        { N:4, moves:3, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:0 },
          { id:'A', horiz:false, len:2, x:2, y:0 },
          { id:'B', horiz:false, len:2, x:3, y:2 },
          { id:'C', horiz:true,  len:2, x:0, y:3 },
        ]},
      ],
      // Calibrage 2026-07-28 (retour PY passe complète : trop simple) — ★★ passe
      // de 3-4 à 5 coups, ★★★ de 5-6 à 7-8 coups. Tous vérifiés BFS (gen-rushhour.mjs).
      2: [ // ★★ grille 5×5, 5 coups
        { N:5, moves:5, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:1 },
          { id:'A', horiz:true,  len:2, x:0, y:0 },
          { id:'B', horiz:false, len:2, x:3, y:2 },
          { id:'C', horiz:true,  len:2, x:0, y:4 },
          { id:'D', horiz:false, len:2, x:2, y:0 },
        ]},
        { N:5, moves:5, cars:[
          { id:'X', horiz:true,  len:2, x:1, y:3 },
          { id:'A', horiz:false, len:2, x:4, y:3 },
          { id:'B', horiz:false, len:2, x:3, y:2 },
          { id:'C', horiz:true,  len:2, x:1, y:0 },
          { id:'D', horiz:false, len:2, x:0, y:1 },
        ]},
        { N:5, moves:5, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:2 },
          { id:'A', horiz:false, len:2, x:2, y:1 },
          { id:'B', horiz:true,  len:2, x:2, y:0 },
          { id:'C', horiz:false, len:2, x:4, y:0 },
          { id:'D', horiz:true,  len:2, x:0, y:1 },
        ]},
      ],
      3: [ // ★★★ grille 5×5, 7-8 coups
        { N:5, moves:7, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:3 },
          { id:'A', horiz:false, len:2, x:4, y:2 },
          { id:'B', horiz:true,  len:2, x:2, y:2 },
          { id:'C', horiz:false, len:2, x:2, y:0 },
          { id:'D', horiz:true,  len:2, x:0, y:0 },
          { id:'E', horiz:false, len:2, x:3, y:3 },
        ]},
        { N:5, moves:8, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:1 },
          { id:'A', horiz:true,  len:2, x:0, y:4 },
          { id:'B', horiz:false, len:2, x:2, y:0 },
          { id:'C', horiz:false, len:2, x:3, y:0 },
          { id:'D', horiz:false, len:2, x:4, y:1 },
          { id:'E', horiz:true,  len:2, x:2, y:4 },
        ]},
        { N:5, moves:8, cars:[
          { id:'X', horiz:true,  len:2, x:0, y:1 },
          { id:'A', horiz:false, len:2, x:1, y:3 },
          { id:'B', horiz:true,  len:2, x:3, y:2 },
          { id:'C', horiz:false, len:2, x:2, y:2 },
          { id:'D', horiz:false, len:2, x:4, y:3 },
          { id:'E', horiz:false, len:2, x:3, y:0 },
        ]},
      ],
    };

    // ── Sélection ligne bus de Max : jaune (ex M1) via LIGNES, jamais de hex en dur ──
    const MAX_LINE = LIGNES.find(l => l.num === 'M1') || LIGNES[0];
    // Couleurs distinctes pour les autres bus (obstacles)
    const OTHER_POOL = LIGNES.filter(l => l.num !== MAX_LINE.num);

    // ── État global ──
    Tracker.startSession('mj-34');
    // ── Avancement persistant (fix retour PY 2026-07-19 : « 3 niveaux puis ça repart à zéro ») ──
    // Le palier de départ suit les étoiles (1 étoile = tier 1 gagné → on reprend au tier 2),
    // et la position DANS le palier survit au rechargement (localStorage).
    const PROG_KEY = 'mj34_progress';
    const startTier = Math.min(3, (window.Stars ? Stars.get('mj-34') : 0) + 1);
    let tier = startTier;   // 1,2,3 (★, ★★, ★★★)
    let levelIdx = 0;       // 0,1,2 dans le tier courant
    try {
      const saved = JSON.parse(localStorage.getItem(PROG_KEY) || 'null');
      if (saved && saved.tier === startTier && saved.levelIdx > 0) levelIdx = Math.min(2, saved.levelIdx);
    } catch (e) {}
    function saveProg() {
      try { localStorage.setItem(PROG_KEY, JSON.stringify({ tier, levelIdx })); } catch (e) {}
    }
    let cars = [];          // état vivant (copie mutable des niveaux)
    let N = 4;
    let cellSize = 80;
    let boardPad = 8;
    let dragState = null;
    let obstacleColors = [];
    let locked = false;     // pendant animation de sortie / fin de palier

    const boardEl = document.getElementById('board');
    const G = shell.G;

    // 🔒 3 niveaux fixes par palier (indépendant du barème questions Golden 4/6/8)
    function buildLevelPips(){
      G.totalQ = LEVELS[tier].length;
      G.buildPips();
    }

    function computeCellSize(){
      const stageEl = document.querySelector('.stage');
      const availW = stageEl.clientWidth - 20;
      const availH = stageEl.clientHeight - 20;
      const maxBoard = Math.min(availW, availH, 560);
      cellSize = Math.floor((maxBoard - boardPad * 2) / N);
      cellSize = Math.max(70, cellSize); // min ~70px (proche règle 80px zone tap)
    }

    function loadLevel(){
      const def = LEVELS[tier][levelIdx];
      N = def.N;
      cars = def.cars.map(c => ({...c}));
      obstacleColors = selectDistinctColors(OTHER_POOL, cars.length - 1, 70);
      computeCellSize();
      renderBoard();
      buildLevelPips();
      playLevelIntro();
    }

    // ── Intro de niveau : bandeau mission + clignotement du bus de Max (aucun texte à lire) ──
    function playLevelIntro(){
      const banner = document.getElementById('missionBanner');
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 1800);

      const maxEl = boardEl.querySelector('.car.is-max');
      if (maxEl){
        maxEl.classList.add('intro-blink');
        setTimeout(() => maxEl.classList.remove('intro-blink'), 1000);
      }
    }

    function boardPx(){ return N * cellSize + boardPad * 2; }

    function renderBoard(){
      const size = boardPx();
      boardEl.style.width = size + 'px';
      boardEl.style.height = size + 'px';
      boardEl.innerHTML = '';

      // Grille visuelle
      const grid = document.createElement('div');
      grid.className = 'cell-grid';
      for (let i = 1; i < N; i++){
        const vline = document.createElement('div');
        vline.className = 'grid-line-v';
        vline.style.left = (boardPad + i * cellSize) + 'px';
        vline.style.top = '0'; vline.style.width = '2px'; vline.style.height = '100%';
        grid.appendChild(vline);
        const hline = document.createElement('div');
        hline.className = 'grid-line-h';
        hline.style.top = (boardPad + i * cellSize) + 'px';
        hline.style.left = '0'; hline.style.height = '2px'; hline.style.width = '100%';
        grid.appendChild(hline);
      }
      boardEl.appendChild(grid);

      const maxCar = cars[0];
      const doorTop = boardPad + maxCar.y * cellSize;
      const wallT = 10; // épaisseur du mur (doit matcher .depot-wall border-width)
      const boardSize = boardPx();

      // Mur d'enceinte du dépôt — tout le pourtour SAUF l'ouverture (porte) à droite,
      // construit en 3 segments (haut+gauche+bas fusionnés visuellement via 3 rects)
      // pour laisser un TROU net à la hauteur de la ligne de sortie.
      const wallTop = document.createElement('div');
      wallTop.className = 'depot-wall-seg';
      wallTop.style.left = '0'; wallTop.style.top = '0';
      wallTop.style.width = boardSize + 'px'; wallTop.style.height = doorTop + 'px';
      wallTop.style.borderTop = wallT + 'px solid #5a4632';
      wallTop.style.borderLeft = wallT + 'px solid #5a4632';
      wallTop.style.borderRight = wallT + 'px solid #5a4632';
      wallTop.style.borderTopRightRadius = '14px';
      wallTop.style.borderTopLeftRadius = '14px';
      boardEl.appendChild(wallTop);

      const wallBottom = document.createElement('div');
      wallBottom.className = 'depot-wall-seg';
      wallBottom.style.left = '0'; wallBottom.style.top = (doorTop + cellSize) + 'px';
      wallBottom.style.width = boardSize + 'px'; wallBottom.style.height = (boardSize - doorTop - cellSize) + 'px';
      wallBottom.style.borderBottom = wallT + 'px solid #5a4632';
      wallBottom.style.borderLeft = wallT + 'px solid #5a4632';
      wallBottom.style.borderRight = wallT + 'px solid #5a4632';
      wallBottom.style.borderBottomRightRadius = '14px';
      wallBottom.style.borderBottomLeftRadius = '14px';
      boardEl.appendChild(wallBottom);

      // Porte de sortie : ouverture franche DANS le mur droit (à l'intérieur du board),
      // damier au sol + montants + panneau SORTIE — tout reste visible dans les bornes du plateau.
      const door = document.createElement('div');
      door.className = 'depot-door';
      door.style.left = (boardSize - wallT - cellSize * 0.55) + 'px';
      door.style.top = doorTop + 'px';
      door.style.width = (cellSize * 0.55 + wallT) + 'px';
      door.style.height = cellSize + 'px';
      boardEl.appendChild(door);

      const postTop = document.createElement('div');
      postTop.className = 'depot-door-post';
      postTop.style.left = (boardSize - wallT - cellSize * 0.55) + 'px';
      postTop.style.top = (doorTop - wallT) + 'px';
      postTop.style.height = wallT + 'px';
      postTop.style.width = (cellSize * 0.55 + wallT) + 'px';
      boardEl.appendChild(postTop);

      const postBottom = document.createElement('div');
      postBottom.className = 'depot-door-post';
      postBottom.style.left = (boardSize - wallT - cellSize * 0.55) + 'px';
      postBottom.style.top = (doorTop + cellSize) + 'px';
      postBottom.style.height = wallT + 'px';
      postBottom.style.width = (cellSize * 0.55 + wallT) + 'px';
      boardEl.appendChild(postBottom);

      // Panneau DEVANT l'ouverture (centré sur la porte), en vert — retour PY 2026-07-27.
      const sign = document.createElement('div');
      sign.className = 'depot-door-sign';
      sign.textContent = 'SORTIE';
      sign.style.left = (boardSize - wallT - cellSize * 0.95) + 'px';
      sign.style.top = (doorTop + cellSize / 2 - 12) + 'px';
      sign.style.width = (cellSize * 0.95 + wallT) + 'px';
      sign.style.height = '24px';
      boardEl.appendChild(sign);

      // Flèche de sortie — part de l'avant du bus de Max vers la porte
      const arrow = document.createElement('div');
      arrow.className = 'exit-arrow';
      arrow.textContent = '➡️';
      // Flèche au-dessus du panneau (moitié haute de la porte) pour ne pas le couvrir
      arrow.style.width = (cellSize * 0.55) + 'px';
      arrow.style.height = (cellSize / 2 - 6) + 'px';
      arrow.style.left = (boardSize - wallT - cellSize * 0.55) + 'px';
      arrow.style.top = doorTop + 'px';
      boardEl.appendChild(arrow);

      // Bus — le SVG natif est toujours dessiné à l'horizontale (len*cellSize × cellSize),
      // puis pour les bus verticaux on l'enveloppe dans un conteneur pivoté 90° UNE SEULE FOIS
      // (footprint width=cellSize, height=len*cellSize — la place réellement occupée sur la grille).
      cars.forEach((c, idx) => {
        const el = document.createElement('div');
        el.className = 'car' + (idx === 0 ? ' is-max' : ' obstacle');
        el.dataset.idx = idx;
        positionCar(el, c);
        const natW = c.len * cellSize; // largeur "naturelle" du SVG (avant rotation éventuelle)
        const natH = cellSize;
        let svg;
        if (idx === 0){
          svg = busSVG(MAX_LINE.color, MAX_LINE.textColor, MAX_LINE.num, natW);
        } else {
          const col = obstacleColors[idx - 1] || OTHER_POOL[idx % OTHER_POOL.length];
          svg = busSVG(col.color, col.textColor, col.num, natW);
        }

        if (c.horiz){
          el.style.width = natW + 'px';
          el.style.height = natH + 'px';
          el.innerHTML = svg;
        } else {
          // Footprint occupé sur la grille (pivoté) : cellSize de large, len*cellSize de haut
          el.style.width = cellSize + 'px';
          el.style.height = (c.len * cellSize) + 'px';
          const wrap = document.createElement('div');
          wrap.style.width = natW + 'px';
          wrap.style.height = natH + 'px';
          wrap.style.transform = 'rotate(90deg) translate(0, -' + natH + 'px)';
          wrap.style.transformOrigin = 'top left';
          wrap.innerHTML = svg;
          el.appendChild(wrap);
        }
        el.addEventListener('pointerdown', (e) => onDragStart(e, idx));
        boardEl.appendChild(el);
      });
    }

    function positionCar(el, c){
      el.style.left = (boardPad + c.x * cellSize) + 'px';
      el.style.top = (boardPad + c.y * cellSize) + 'px';
    }

    // ── Grille d'occupation ──
    function occupiedGrid(){
      const g = Array.from({length:N}, () => Array(N).fill(-1));
      cars.forEach((c, idx) => {
        for (let k = 0; k < c.len; k++){
          if (c.horiz) g[c.y][c.x + k] = idx;
          else g[c.y + k][c.x] = idx;
        }
      });
      return g;
    }

    // ── Drag contraint sur l'axe (horiz ↔, vert ↕), snap case par case ──
    function onDragStart(e, idx){
      if (locked) return;
      const c = cars[idx];
      const el = boardEl.querySelector('.car[data-idx="' + idx + '"]');
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      dragState = {
        idx, el, startX: e.clientX, startY: e.clientY,
        origX: c.x, origY: c.y,
      };
      e.preventDefault();
    }

    document.addEventListener('pointermove', (e) => {
      if (!dragState || locked) return;
      const { idx, el, startX, startY, origX, origY } = dragState;
      const c = cars[idx];
      const dxPx = e.clientX - startX;
      const dyPx = e.clientY - startY;
      if (c.horiz){
        const deltaCells = dxPx / cellSize;
        let newX = origX + deltaCells;
        newX = clampAxisFloat(idx, newX, true);
        c._floatX = newX;
        el.style.left = (boardPad + newX * cellSize) + 'px';
      } else {
        const deltaCells = dyPx / cellSize;
        let newY = origY + deltaCells;
        newY = clampAxisFloat(idx, newY, false);
        c._floatY = newY;
        el.style.top = (boardPad + newY * cellSize) + 'px';
      }
    });

    document.addEventListener('pointerup', (e) => {
      if (!dragState || locked) return;
      const { idx, el } = dragState;
      el.classList.remove('dragging');
      const c = cars[idx];
      dragState = null;
      resolveDrop(idx, el, c);
    });

    document.addEventListener('pointercancel', () => {
      if (!dragState) return;
      const { idx, el } = dragState;
      el.classList.remove('dragging');
      const c = cars[idx];
      dragState = null;
      resolveDrop(idx, el, c);
    });

    // Limite le déplacement flottant aux cases libres (pas de collision pendant le drag)
    function clampAxisFloat(idx, val, horiz){
      const c = cars[idx];
      const g = occupiedGrid();
      // borne min : première case libre en remontant depuis la position actuelle
      let min = 0, max = N - c.len;
      // recherche du blocage le plus proche à gauche/en-haut
      for (let p = Math.floor((horiz ? c.x : c.y)); p >= 0; p--){
        const occ = horiz ? g[c.y][p] : g[p][c.x];
        if (occ !== -1 && occ !== idx){ min = p + 1; break; }
      }
      // recherche du blocage le plus proche à droite/en-bas
      for (let p = Math.ceil((horiz ? c.x : c.y)) + c.len; p < N; p++){
        const occ = horiz ? g[c.y][p] : g[p][c.x];
        if (occ !== -1 && occ !== idx){ max = p - c.len; break; }
      }
      return Math.max(min, Math.min(max, val));
    }

    function resolveDrop(idx, el, c){
      const target = c.horiz ? Math.round(c._floatX ?? c.x) : Math.round(c._floatY ?? c.y);
      const before = c.horiz ? c.x : c.y;
      const clamped = clampAxisFloat(idx, target, c.horiz);
      const snapped = Math.round(clamped);
      delete c._floatX; delete c._floatY;

      if (snapped === before){
        // Bounce doux, aucun son négatif
        el.classList.add('bounce');
        setTimeout(() => el.classList.remove('bounce'), 240);
        positionCar(el, c);
        return;
      }

      if (c.horiz) c.x = snapped; else c.y = snapped;
      sndTschh();
      positionCar(el, c);

      // Victoire : bus de Max touche le bord droit
      if (idx === 0 && c.x + c.len - 1 === N - 1){
        setTimeout(() => onLevelWon(), 160);
      }
    }

    // ── Victoire du niveau : le bus glisse hors de la grille, PUIS les autres bus
    // évacuent tout seuls à la queue leu leu (aucun gameplay) — le dépôt se vide. ──
    let evacuating = false; // exposé pour le harnais de test
    function onLevelWon(){
      locked = true;
      const maxEl = boardEl.querySelector('.car[data-idx="0"]');
      maxEl.classList.add('exiting');
      const exitX = boardPad + (N + 1.4) * cellSize;
      maxEl.style.left = exitX + 'px';
      sndKlaxon();
      G.notePip(levelIdx, 1, maxEl);
      setTimeout(() => {
        evacuateOtherBuses(() => {
          levelIdx++;
          saveProg();
          if (levelIdx >= LEVELS[tier].length){
            onTierWon();
          } else {
            locked = false;
            loadLevel();
          }
        });
      }, 620);
    }

    // Fait sortir les bus restants (idx 1..n) à la queue leu leu par la porte, en klaxonnant.
    // Aucun gameplay : animation automatique ~2s puis callback.
    function evacuateOtherBuses(done){
      evacuating = true;
      const others = cars.map((c, idx) => idx).filter(idx => idx !== 0);
      if (others.length === 0){ evacuating = false; done(); return; }

      others.forEach((idx, order) => {
        setTimeout(() => {
          const el = boardEl.querySelector('.car[data-idx="' + idx + '"]');
          if (!el) return;
          const c = cars[idx];
          el.classList.add('other-bus', 'leaving');
          sndKlaxon();
          if (c.horiz){
            el.style.left = (boardPad + (N + 1.4) * cellSize) + 'px';
          } else {
            // Bus vertical : glisse latéralement vers la sortie (à droite) pour rejoindre la porte
            el.style.transition = 'left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1)';
            el.style.left = (boardPad + (N + 1.4) * cellSize) + 'px';
          }
        }, order * 260);
      });

      const totalMs = others.length * 260 + 550;
      setTimeout(() => { evacuating = false; done(); }, totalMs);
    }

    // ── Palier (tier) complet → étoile via écran de fin golden. ──
    // Au replay, startTier (voir plus haut) relit Stars.get('mj-34') et reprend
    // directement au palier suivant — pas besoin de gérer la transition ici.
    function onTierWon(){
      if (tier < 3) { tier++; levelIdx = 0; } else { tier = 1; levelIdx = 0; }
      saveProg();
      G.showEnd({ replayUrl: 'mj-34.html' });
    }

    window.addEventListener('resize', () => { computeCellSize(); renderBoard(); });

    // ── API de test headless (Playwright) — expose l'état + un déplacement programmatique ──
    window.__mjTest = {
      state: () => ({ tier, levelIdx, N, cars: cars.map(c => ({...c})), evacuating }),
      // move(idx, deltaCells) : déplace le bus idx de deltaCells cases (signé) sur son axe, snap direct
      move(idx, deltaCells){
        const c = cars[idx];
        const el = boardEl.querySelector('.car[data-idx="' + idx + '"]');
        if (!el) return false;
        const axisVal = c.horiz ? c.x : c.y;
        const target = axisVal + deltaCells;
        const clamped = clampAxisFloat(idx, target, c.horiz);
        const snapped = Math.round(clamped);
        const before = axisVal;
        if (c.horiz) c._floatX = target; else c._floatY = target;
        resolveDrop(idx, el, c);
        return snapped !== before;
      },
    };

    loadLevel();
  });
  </script>
</body>
