<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-35 — Le jeu des graines</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    @font-face {
      font-family:'Fredoka One';
      src: local('Fredoka One');
    }

    #stars-badge {
      background:var(--gold-soft); color:var(--gold); font-weight:900;
      border-radius:16px; padding:4px 12px; font-size:0.9rem; flex-shrink:0;
    }

    #main {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:clamp(6px,1.5vmin,14px); padding:8px 4px; overflow:hidden; position:relative;
      width:100%; min-height:0;
    }

    #count-display {
      position:absolute; top:8px; left:50%; transform:translateX(-50%);
      font-size:clamp(1.6rem,6vmin,2.6rem); font-weight:900; color:#ffe066;
      text-shadow:0 3px 8px rgba(0,0,0,0.4);
      opacity:0; transition:opacity 0.15s;
      z-index:5; pointer-events:none;
    }
    #count-display.show { opacity:1; }

    #instruction {
      font-size:clamp(0.8rem,3vmin,1.1rem); font-weight:900; text-align:center; padding:0 8px;
      opacity:0.95; max-width:100%;
    }

    #pile-progress {
      font-size:clamp(0.75rem,2.6vmin,0.95rem); font-weight:900; opacity:0.8; color:#ffe066;
    }

    #board {
      display:flex; align-items:flex-end; justify-content:center;
      gap:clamp(2px,1.2vw,8px);
      padding:2px; width:100%; max-width:100%; position:relative;
      box-sizing:border-box;
    }

    .pit-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0; min-width:0; }

    .pit {
      width:clamp(34px,10.5vw,80px); height:clamp(34px,10.5vw,80px); border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #8d6e4a, #5c4326 70%);
      border:clamp(2px,0.8vw,5px) solid #3e2c17;
      box-shadow:inset 0 6px 14px rgba(0,0,0,0.55), 0 4px 6px rgba(0,0,0,0.3);
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:2px; padding:3px; cursor:pointer; position:relative;
      transition:transform 0.12s, box-shadow 0.2s;
    }
    .pit:active { transform:scale(0.94); }
    .pit.lit {
      box-shadow:inset 0 6px 14px rgba(0,0,0,0.4), 0 0 0 6px rgba(255,224,102,0.55);
    }
    .pit.disabled { cursor:default; opacity:0.55; }
    .pit.empty-hint { opacity:0.5; }

    .pit-label {
      font-size:0.62rem; font-weight:900; opacity:0.55;
      background:rgba(255,255,255,0.1); border-radius:8px; padding:1px 6px;
    }

    .seed {
      width:clamp(9px,2.4vmin,16px); height:clamp(9px,2.4vmin,16px); border-radius:50%;
      box-shadow:inset -2px -2px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.3);
    }

    .granary-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; margin-left:2px; flex-shrink:0; min-width:0; }
    #granary {
      width:clamp(40px,12vw,95px); height:clamp(48px,14.2vw,113px);
      border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
      background:radial-gradient(circle at 35% 25%, #a8814f, #6b4a24 75%);
      border:clamp(2px,1vw,6px) solid #40290f;
      box-shadow:inset 0 8px 16px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.35);
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:2px; padding:4px; position:relative; overflow:hidden;
    }
    #granary-count {
      position:absolute; bottom:4px; right:6px; font-size:clamp(0.8rem,2.4vmin,1.1rem); font-weight:900;
      color:#ffe066; text-shadow:0 2px 4px rgba(0,0,0,0.5);
    }

    /* flèche de sens du semis */
    #flow-arrow {
      position:absolute; top:-20px; left:0; right:0; height:18px;
      display:flex; align-items:center; justify-content:center;
      font-size:clamp(0.8rem,2.4vmin,1.1rem); opacity:0.35; letter-spacing:2px;
      pointer-events:none;
    }

    /* graine qui saute (animation) */
    .flying-seed {
      position:absolute; width:16px; height:16px; border-radius:50%;
      box-shadow:inset -2px -2px 3px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.4);
      z-index:10; pointer-events:none;
    }
    @keyframes seed-jump {
      0%   { transform:translate(0,0) scale(1); }
      50%  { transform:translate(var(--dx-mid), var(--dy-mid)) scale(1.15); }
      100% { transform:translate(var(--dx), var(--dy)) scale(1); }
    }

    #pile-fx {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none; z-index:20;
    }
    #pile-fx span {
      font-size:2.2rem; font-weight:900; color:#ff6ec7;
      text-shadow:0 0 12px #ffe066, 0 3px 8px rgba(0,0,0,0.5);
      opacity:0; animation:pile-pop 1.1s ease forwards;
    }
    @keyframes pile-pop {
      0%   { opacity:0; transform:scale(0.4) translateY(10px); }
      25%  { opacity:1; transform:scale(1.2) translateY(-10px); }
      45%  { transform:scale(1) translateY(-6px); }
      100% { opacity:0; transform:scale(1) translateY(-30px); }
    }

    #level-label {
      font-size:0.85rem; font-weight:900; opacity:0.65; text-align:center;
    }

    /* Écran de fin */
    #end-screen {
      display:none; position:absolute; inset:0;
      background:rgba(26,26,46,0.97);
      flex-direction:column; align-items:center; justify-content:center;
      gap:16px; z-index:30;
    }
    #end-screen.visible { display:flex; }
    #end-emoji { font-size:4.5rem; }
    #end-msg { font-size:1.4rem; font-weight:900; text-align:center; padding:0 24px; }
    #end-score { font-size:1rem; color:#ffe066; font-weight:900; }
    .end-btn {
      background:linear-gradient(135deg,#00c47a,#00906a); color:#fff;
      border:none; border-radius:20px; font-family:'Fredoka One',sans-serif; font-weight:900;
      font-size:1.1rem; padding:14px 38px; cursor:pointer; min-height:60px;
      box-shadow:0 4px 16px rgba(0,196,122,0.45);
    }
    .end-btn:active { transform:scale(0.95); }
  </style>
</head>
<body data-ambiance="jungle">
<div id="app">

  <!-- HEADER — copier tel quel, changer uniquement l'emoji et le titre -->
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🌱 Le jeu des graines</span>
    <span id="stars-badge">☆</span>
  </div>

  <div id="main">
    <div id="count-display">0</div>
    <div id="instruction">Touche une calebasse !</div>
    <div id="pile-progress"></div>
    <div id="level-label"></div>

    <div id="board">
      <div id="flow-arrow">→ → → →</div>
      <!-- 6 trous générés en JS -->
      <div class="granary-wrap">
        <div id="granary"></div>
        <div class="pit-label">Grenier <span id="granary-count">0</span></div>
      </div>
      <div id="pile-fx"></div>
    </div>
  </div>

  <!-- Fin de partie -->
  <div id="end-screen">
    <div id="end-emoji">🎉</div>
    <div id="end-msg"></div>
    <div id="end-score"></div>
    <button class="end-btn" id="btn-replay">Rejouer !</button>
    <a href="index.html" style="color:#ffe066;font-weight:900;font-size:0.95rem;margin-top:4px;">← Menu</a>
  </div>

</div>
  <script src="js/tracker.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/regle-info.js"></script>
  <script src="js/mp-theme.js"></script>
  <script src="js/celebrations.js"></script>
  <script>
    RegleInfo.init({ texte: "Trouve le trou qui remplit le grenier PILE-POIL !", picto: "🌱👉🏺" });
  </script>
  <script>
    // ═══════════════════════════════════════════════════════════════════════
    //  MJ-35 — Le jeu des graines (semailles mancala SOLO, coopératif)
    //  Spec : studio/minijeux/docs/jeux/mj-34-35-36-specs.md § MJ-35
    //  Kalah duel/IA NO-GO à 4 ans (décision game-conseiller) → version SOLO.
    // ═══════════════════════════════════════════════════════════════════════

    const NB_PITS = 6;
    const SEED_COLORS = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22'];
    const PILE_TARGET = 3; // nb de "PILE !" à réussir pour valider un palier

    // Paliers ★ : plage de graines à compter (cf spec game-conseiller).
    // Avec 6 trous, la distance max jusqu'au grenier est 6 → le trou PILE
    // (celui qui tombe pile dans le grenier) est toujours dans 1..6.
    // ★★★ "gros semis" : les trous VOISINS portent 8-12 graines (comptage
    // loin = passion Max) même si le trou PILE reste borné à 6 par la géométrie.
    const LEVELS = [
      { pileMin: 1, pileMax: 3,  decoyMax: 4,  label: 'Niveau 1' },               // ★
      { pileMin: 3, pileMax: 6,  decoyMax: 7,  label: 'Niveau 2' },               // ★★
      { pileMin: 4, pileMax: 6,  decoyMax: 12, label: 'Niveau 3 — gros tas !' },  // ★★★
    ];

    function getStarLevel() {
      try {
        const stats = Tracker.getStats();
        const g = stats.games && stats.games['mj-35'];
        if (!g) return 0;
        const rate = g.totalQuestions > 0 ? g.correctAnswers / g.totalQuestions : 0;
        if (g.plays >= 2 && rate >= 0.8) return 2;
        if (g.plays >= 1) return 1;
        return 0;
      } catch (e) { return 0; }
    }

    let level = getStarLevel();
    let pits = [];        // pits[i] = nb de graines
    let granary = 0;
    let pileCount = 0;    // nb de "PILE !" réussis sur le palier en cours
    let sowing = false;   // bloque les taps pendant l'animation
    let sessionScore = 0;

    // ── Génération du plateau ────────────────────────────────────────────────
    // Garantit qu'UN SEUL trou est "PILE-able" : son nb de graines == distance
    // exacte jusqu'au grenier (NB_PITS - i). L'enfant doit COMPTER avant de
    // taper pour le repérer — c'est le vrai défi cognitif (anticipation numérique).
    function buildBoard(cfg) {
      // Le trou PILE-able doit contenir EXACTEMENT sa distance au grenier
      // (sinon la dernière graine ne tombe pas pile dedans). On choisit donc
      // le trou en fonction de la distance voulue (pileMin..pileMax), puis
      // ses graines = cette distance, par définition.
      const lo = Math.max(1, Math.min(cfg.pileMin, NB_PITS));
      const hi = Math.max(lo, Math.min(cfg.pileMax, NB_PITS));
      const dist = lo + Math.floor(Math.random() * (hi - lo + 1)); // 1..NB_PITS
      const pileIdx = NB_PITS - dist;
      const pileSeeds = dist;
      const arr = new Array(NB_PITS).fill(0);
      for (let i = 0; i < NB_PITS; i++) {
        if (i === pileIdx) { arr[i] = pileSeeds; continue; }
        const otherDist = NB_PITS - i;
        // évite un 2e trou pile-able : tire un nb de graines != otherDist, borné à decoyMax
        let n;
        do { n = 1 + Math.floor(Math.random() * cfg.decoyMax); } while (n === otherDist);
        arr[i] = n;
      }
      return arr;
    }

    function initLevel() {
      pileCount = 0;
      newBoard();
      document.getElementById('level-label').textContent = LEVELS[level].label;
      document.getElementById('stars-badge').textContent = '★'.repeat(level) + '☆'.repeat(3 - level) || '☆';
      updatePileProgress();
    }

    function newBoard() {
      const cfg = LEVELS[level];
      pits = buildBoard(cfg);
      granary = 0;
      sowing = false;
      renderBoard();
      updateGranary();
      document.getElementById('instruction').textContent = 'Trouve le trou qui remplit PILE le grenier !';
    }

    function updatePileProgress() {
      document.getElementById('pile-progress').textContent = 'PILE ' + '✓'.repeat(pileCount) + '·'.repeat(PILE_TARGET - pileCount);
    }

    // ── Rendu ─────────────────────────────────────────────────────────────────
    function renderBoard() {
      const board = document.getElementById('board');
      // retire les anciens trous (garde flow-arrow, granary-wrap, pile-fx)
      board.querySelectorAll('.pit-wrap').forEach(el => el.remove());
      const granaryWrap = document.querySelector('.granary-wrap');

      for (let i = 0; i < NB_PITS; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'pit-wrap';
        wrap.innerHTML = `
          <div class="pit" id="pit-${i}" data-idx="${i}"></div>
          <div class="pit-label">${i + 1}</div>
        `;
        board.insertBefore(wrap, granaryWrap);
      }
      for (let i = 0; i < NB_PITS; i++) renderPitSeeds(i);

      document.querySelectorAll('.pit').forEach(el => {
        el.addEventListener('click', () => onPitTap(parseInt(el.dataset.idx, 10)));
      });
    }

    function renderPitSeeds(i) {
      const pitEl = document.getElementById('pit-' + i);
      if (!pitEl) return;
      pitEl.innerHTML = '';
      const n = pits[i];
      for (let s = 0; s < n; s++) {
        const seed = document.createElement('div');
        seed.className = 'seed';
        seed.style.background = SEED_COLORS[s % SEED_COLORS.length];
        pitEl.appendChild(seed);
      }
      pitEl.classList.toggle('empty-hint', n === 0);
    }

    function updateGranary() {
      const g = document.getElementById('granary');
      g.innerHTML = '';
      for (let s = 0; s < Math.min(granary, 40); s++) {
        const seed = document.createElement('div');
        seed.className = 'seed';
        seed.style.background = SEED_COLORS[s % SEED_COLORS.length];
        g.appendChild(seed);
      }
      document.getElementById('granary-count').textContent = granary;
    }

    // ── Semailles ────────────────────────────────────────────────────────────
    function onPitTap(i) {
      if (sowing) return;
      if (pits[i] === 0) return; // rien à semer, silence (pas de son négatif)
      sow(i);
    }

    async function sow(i) {
      sowing = true;
      document.getElementById('instruction').textContent = '';
      let nbSeeds = pits[i];
      pits[i] = 0;
      renderPitSeeds(i);

      const countDisplay = document.getElementById('count-display');
      countDisplay.classList.add('show');

      let landedInGranary = false;
      let currentPos = i;

      for (let k = 1; k <= nbSeeds; k++) {
        currentPos++;
        const isGranary = currentPos >= NB_PITS;

        // illumination séquentielle du trou suivant (lisibilité du sens)
        document.querySelectorAll('.pit').forEach(el => el.classList.remove('lit'));
        if (!isGranary) {
          const pitEl = document.getElementById('pit-' + currentPos);
          if (pitEl) pitEl.classList.add('lit');
        }

        countDisplay.textContent = k;
        sndCount();

        await sleep(260);

        if (isGranary) {
          granary++;
          landedInGranary = true;
          updateGranary();
          sndDing();
        } else {
          pits[currentPos]++;
          renderPitSeeds(currentPos);
        }
      }

      document.querySelectorAll('.pit').forEach(el => el.classList.remove('lit'));
      countDisplay.classList.remove('show');
      sowing = false;

      // "PILE !" : la dernière graine de ce semis est tombée pile dans le grenier
      const isPile = landedInGranary && (i + nbSeeds) === NB_PITS;

      if (isPile) {
        showPileFx();
        if (window.MaxFX) {
          const fromEl = document.getElementById('granary');
          const toEl = document.getElementById('pile-progress');
          MaxFX.markPoint(fromEl, toEl, { style: 'bounce', result: 'green' });
        }
        pileCount++;
        updatePileProgress();
        if (pileCount >= PILE_TARGET) {
          setTimeout(showVictory, 900);
        } else {
          setTimeout(newBoard, 900); // tableau suivant, palier pas fini
        }
      } else {
        // Mauvais trou : rien n'est perdu, aucun son négatif. On laisse voir
        // le compte (pédagogie) puis on réarrange doucement pour réessayer.
        setTimeout(() => {
          document.getElementById('instruction').textContent = 'Presque ! Compte bien, essaie encore.';
          setTimeout(newBoard, 700);
        }, 200);
      }
    }

    function showPileFx() {
      const fx = document.getElementById('pile-fx');
      const span = document.createElement('span');
      span.textContent = 'PILE ! ✨';
      fx.appendChild(span);
      sndBravo();
      setTimeout(() => span.remove(), 1100);
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ── Fin de niveau ───────────────────────────────────────────────────────
    function showVictory() {
      sessionScore++;
      if (typeof Tracker !== 'undefined') Tracker.logAnswer(true);
      const emoji = level === 2 ? '🏆' : '🎉';
      document.getElementById('end-emoji').textContent = emoji;
      document.getElementById('end-msg').textContent = 'Bravo ! 3 PILE réussis !';
      document.getElementById('end-score').textContent = `${PILE_TARGET} PILE trouvés`;
      document.getElementById('end-screen').classList.add('visible');
      playEndSound(1, 1);
      if (typeof Tracker !== 'undefined') Tracker.endSession(1, 1);
      if (window.MaxFX) MaxFX.finalStar(document.getElementById('app'), { style: 'breathe', label: 'BRAVO !' });
    }

    function replay() {
      stopEndSound();
      document.getElementById('end-screen').classList.remove('visible');
      level = getStarLevel();
      if (typeof Tracker !== 'undefined') Tracker.startSession('mj-35');
      initLevel();
    }

    document.getElementById('btn-replay').addEventListener('click', replay);

    // ── Démarrage ─────────────────────────────────────────────────────────────
    if (typeof Tracker !== 'undefined') Tracker.startSession('mj-35');
    initLevel();

    // ── Hook de test headless (EP-038) ──────────────────────────────────────
    window.__mjTest = {
      get state() {
        // trou "PILE-able" = celui dont le compte == distance exacte au grenier
        const pileIdx = pits.findIndex((n, i) => n > 0 && (i + n) === NB_PITS);
        return { pits: [...pits], granary, pileCount, pileTarget: PILE_TARGET, sowing, level, pileIdx };
      },
      sow(i) { return sow(i); },
    };
  </script>
</body>
</html>
