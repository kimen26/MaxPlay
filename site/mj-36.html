<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-36 — Le bon bus !</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* --- GABARIT HEADER CANONIQUE (ne pas inventer, copier tel quel) --- */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { background:#1a1a2e; font-family:'Fredoka One',sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }
    .hdr {
      display:flex; align-items:center; gap:10px;
      padding:6px 12px; flex-shrink:0;
      background:rgba(0,0,0,0.25);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .hdr a {
      color:#fff; text-decoration:none; font-size:1.3rem;
      background:rgba(255,255,255,0.12); border-radius:8px;
      padding:4px 10px; font-weight:900; flex-shrink:0;
    }
    .hdr a:active { background:rgba(255,255,255,0.25); }
    .htitle { flex:1; font-size:1rem; font-weight:900; }
    /* --- FIN GABARIT HEADER --- */

    #stage {
      flex:1; position:relative; overflow:hidden;
      background: linear-gradient(#1a1a2e 0%, #1a1a2e 55%, #2c2c44 55%, #2c2c44 100%);
      touch-action:none;
    }

    /* Progression (paliers étoiles) */
    #progress {
      flex-shrink:0; display:flex; align-items:center; justify-content:center;
      gap:10px; padding:8px 12px; background:rgba(0,0,0,0.25);
    }
    #progress .stars { display:flex; gap:4px; font-size:1.3rem; }
    #progress .star.off { opacity:0.25; }
    #progress .msg { font-size:0.85rem; font-weight:900; opacity:0.9; }

    /* Route + trottoir (décor v1 gardé) */
    .road {
      position:absolute; left:0; right:0; bottom:0; height:34%;
      background:#4a4a5e;
    }
    .road::before {
      content:''; position:absolute; top:50%; left:0; right:0; height:4px;
      transform:translateY(-50%);
      background-image:repeating-linear-gradient(to right, #ffd23f 0 26px, transparent 26px 52px);
      opacity:0.8;
    }

    /* Zone garage à gauche : 3 bus en attente */
    #garage {
      position:absolute; left:0; top:0; bottom:34%; width:38%;
      display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
      padding:6px 0;
    }
    .parkedBus {
      cursor:pointer; min-width:100px; min-height:100px;
      display:flex; align-items:center; justify-content:center;
      border-radius:14px; transition: transform 0.15s, background 0.15s;
      padding:4px;
    }
    .parkedBus svg { pointer-events:none; }
    .parkedBus.tap-good { background:rgba(255,255,255,0.25); transform:scale(1.06); }
    .parkedBus.tap-bad { animation: shakeBad 0.4s; }
    @keyframes shakeBad {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .parkedBus.gone { opacity:0; transform:translateX(120%) scale(0.8); pointer-events:none; }
    .parkedBus.arriving { animation: busIn 0.4s ease-out; }
    @keyframes busIn {
      0% { opacity:0; transform: translateY(-16px) scale(0.7); }
      100% { opacity:1; transform: translateY(0) scale(1); }
    }

    /* Bus roulant vers l'arrêt (clone animé) */
    #rollingBusWrap {
      position:absolute; top:0; bottom:34%; left:0;
      display:flex; align-items:center;
      transition: left 1s cubic-bezier(.4,0,.2,1);
      pointer-events:none;
      z-index:5;
    }
    #rollingBusWrap.hidden { display:none; }

    /* Arrêt de bus à droite */
    #busStopZone {
      position:absolute; right:2%; top:0; bottom:34%; width:56%;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    }
    #busStopZone .sign {
      width:34px; height:34px; border-radius:50%;
      background:#0064B1; border:3px solid #fff;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; margin-bottom:4px;
    }
    #busStopZone .pole { width:6px; height:40px; background:#c9c9c9; border-radius:2px; }

    /* Bulle de demande */
    #requestBubble {
      position:absolute; left:50%; top:6px; transform:translateX(-50%);
      background:#fff; color:#222; border-radius:16px;
      padding:6px 14px; font-size:0.85rem; font-weight:900;
      display:flex; align-items:center; gap:8px;
      box-shadow:0 3px 8px rgba(0,0,0,0.3);
      z-index:6;
    }
    #requestBubble::after {
      content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
      border:8px solid transparent; border-top-color:#fff;
    }
    #requestSwatch {
      width:22px; height:22px; border-radius:50%; border:2px solid #222;
      flex-shrink:0;
    }

    /* File de passagers */
    #queue {
      position:relative; display:flex; flex-direction:row-reverse; align-items:flex-end; gap:4px;
      padding-bottom:6px; min-height:70px;
    }
    .pax {
      width:26px; height:44px; position:relative;
      display:flex; flex-direction:column; align-items:center;
      transition: transform 0.5s ease-in, opacity 0.3s;
    }
    .pax .head { width:14px; height:14px; border-radius:50%; background:#f3c9a0; margin-bottom:1px; }
    .pax .body { width:20px; height:24px; border-radius:6px 6px 3px 3px; }
    .pax.boarding { transform: translateX(120px) scale(0.7); opacity:0; }

    #tapHint {
      position:absolute; top:6px; left:6px;
      font-size:0.75rem; opacity:0.65; pointer-events:none;
      max-width:34%;
    }

    /* Écran Bravo */
    #bravoScreen {
      position:absolute; inset:0; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:16px;
      background:rgba(20,20,40,0.94); z-index:20; text-align:center; padding:20px;
    }
    #bravoScreen.show { display:flex; }
    #bravoScreen h2 { font-size:2rem; }
    #bravoScreen .stars { font-size:2.4rem; }
    #bravoScreen .btns { display:flex; gap:14px; margin-top:10px; }
    .btn {
      font-family:'Fredoka One',sans-serif; font-size:1rem; font-weight:900;
      color:#fff; background:#0064B1; border:none; border-radius:14px;
      padding:14px 22px; min-width:110px; min-height:56px;
    }
    .btn:active { background:#004f8f; }
    .btn.secondary { background:#555; }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER — copier tel quel, changer uniquement l'emoji et le titre -->
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🚌 Le bon bus !</span>
  </div>

  <div id="stage">
    <div id="tapHint">👉 Tape le bus de la bonne couleur !</div>
    <div class="road"></div>
    <div id="garage"></div>
    <div id="rollingBusWrap" class="hidden"></div>
    <div id="busStopZone">
      <div id="requestBubble"><span id="requestSwatch"></span><span id="requestLabel">?</span></div>
      <div id="queue"></div>
      <div class="sign">🚏</div>
      <div class="pole"></div>
    </div>
  </div>

  <div id="progress">
    <div class="stars">
      <span class="star" id="st1">⭐</span>
      <span class="star off" id="st2">⭐</span>
      <span class="star off" id="st3">⭐</span>
    </div>
    <div class="msg" id="progressMsg">Trouve le bon bus !</div>
  </div>

  <div id="bravoScreen">
    <h2>🎉 Bravo !</h2>
    <div class="stars" id="bravoStars">⭐</div>
    <div class="btns">
      <button class="btn secondary" id="btnMenu">Menu</button>
      <button class="btn" id="btnReplay">Continuer</button>
    </div>
  </div>

</div>
  <script src="js/bus-svg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script src="js/regle-info.js"></script>
  <script>
    RegleInfo.init({ texte: "Tape le bus de la même couleur que les passagers !", picto: "🧍🟦→🚌🟦" });
  </script>
  <script>
  (function(){
    'use strict';
    Tracker.startSession('mj-36');

    const stage = document.getElementById('stage');
    const garage = document.getElementById('garage');
    const rollingBusWrap = document.getElementById('rollingBusWrap');
    const requestSwatch = document.getElementById('requestSwatch');
    const requestLabel = document.getElementById('requestLabel');
    const queueEl = document.getElementById('queue');
    const progressMsg = document.getElementById('progressMsg');
    const bravoScreen = document.getElementById('bravoScreen');
    const bravoStars = document.getElementById('bravoStars');

    const PARKED_W = 78; // largeur bus garés (px)
    const ROLLING_W = 130; // largeur bus roulant (px)

    // ── Paliers ★/★★/★★★ (v2 Bus Jam) ────────────────────────────────
    const PALIERS = [
      { key: 'star1', label: '★',   nColors: 2, totalPax: 8  },
      { key: 'star2', label: '★★',  nColors: 3, totalPax: 12 },
      { key: 'star3', label: '★★★', nColors: 3, totalPax: 16, fastAlternate: true },
    ];

    let palierIdx = 0;
    let colorLignes = [];   // lignes distinctes en jeu ce palier
    let queueGroups = [];   // [{color,textColor,num,count}, ...] groupes restants
    let parkedLignes = [];  // 3 lignes actuellement garées (dont au moins une == couleur demandée)
    let busy = false;       // anim en cours -> ignorer les taps
    let paxBoardedTotal = 0;
    let paxTargetTotal = 0;

    function currentColor() {
      return queueGroups.length ? queueGroups[0] : null;
    }

    function buildQueueGroups(nColors, totalPax, fastAlternate) {
      const groups = [];
      let remaining = totalPax;
      const minGroup = fastAlternate ? 2 : 3;
      const maxGroup = fastAlternate ? 3 : 4;
      let i = 0;
      while (remaining > 0) {
        const ligne = colorLignes[i % colorLignes.length];
        let size = Math.min(remaining, minGroup + Math.floor(Math.random() * (maxGroup - minGroup + 1)));
        if (remaining - size < 0) size = remaining;
        groups.push({ color: ligne.color, textColor: ligne.textColor, num: ligne.num, count: size });
        remaining -= size;
        i++;
      }
      return groups;
    }

    function renderQueue() {
      queueEl.innerHTML = '';
      queueGroups.forEach((g) => {
        for (let i = 0; i < g.count; i++) {
          const el = document.createElement('div');
          el.className = 'pax';
          el.dataset.color = g.color;
          el.innerHTML = `<div class="head"></div><div class="body" style="background:${g.color}"></div>`;
          queueEl.appendChild(el);
        }
      });
    }

    function updateRequestBubble() {
      const c = currentColor();
      if (!c) { requestSwatch.style.background = '#888'; requestLabel.textContent = '...'; return; }
      requestSwatch.style.background = c.color;
      requestLabel.textContent = c.num;
    }

    function renderParked() {
      garage.innerHTML = '';
      parkedLignes.forEach((ligne, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'parkedBus';
        wrap.dataset.idx = idx;
        wrap.dataset.color = ligne.color;
        wrap.innerHTML = busSVG(ligne.color, ligne.textColor, ligne.num, PARKED_W);
        wrap.addEventListener('pointerdown', () => onTapParked(idx));
        garage.appendChild(wrap);
      });
    }

    // Garantit qu'au moins un bus garé porte la couleur demandée courante.
    function refillParked() {
      const target = currentColor();
      const others = colorLignes.filter(l => !target || l.color !== target.color);
      const picks = [];
      if (target) picks.push(target);
      while (picks.length < 3) {
        const pool = others.length ? others : colorLignes;
        picks.push(pool[Math.floor(Math.random() * pool.length)]);
      }
      // mélange positions
      for (let i = picks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [picks[i], picks[j]] = [picks[j], picks[i]];
      }
      parkedLignes = picks;
      renderParked();
    }

    function updateProgressUI() {
      const remaining = paxTargetTotal - paxBoardedTotal;
      progressMsg.textContent = remaining > 0
        ? `${remaining} passager${remaining > 1 ? 's' : ''} à emmener`
        : 'Terminé !';
    }

    function markStarDone(idx) {
      const el = document.getElementById('st' + (idx + 1));
      if (el) el.classList.remove('off');
    }

    function startPalier() {
      const p = PALIERS[palierIdx];
      // Uniquement des bus (le décor/le nom du jeu parlent de bus) : exclut Métro/RER/Tram.
      const pool = LIGNES.filter(l => l.color && !/^(M\d|RER |T\d)/.test(l.num));
      colorLignes = selectDistinctColors(pool, p.nColors, 80);
      queueGroups = buildQueueGroups(p.nColors, p.totalPax, !!p.fastAlternate);
      paxBoardedTotal = 0;
      paxTargetTotal = p.totalPax;
      renderQueue();
      updateRequestBubble();
      refillParked();
      updateProgressUI();
    }
    startPalier();

    function onTapParked(idx) {
      if (busy) return;
      const ligne = parkedLignes[idx];
      const target = currentColor();
      const wrapEl = garage.children[idx];
      if (!target) return;

      if (ligne.color === target.color) {
        // BON BUS
        busy = true;
        wrapEl.classList.add('tap-good');
        sndDing();
        driveToStop(idx, ligne);
      } else {
        // MAUVAIS BUS — jamais de perte, feedback doux (klaxon interrogatif, pas de buzz négatif)
        wrapEl.classList.add('tap-bad');
        sndKlaxon();
        setTimeout(() => wrapEl.classList.remove('tap-bad'), 400);
      }
    }

    function driveToStop(idx, ligne) {
      const wrapEl = garage.children[idx];
      const garageBox = garage.getBoundingClientRect();
      const stageBox = stage.getBoundingClientRect();
      const startLeft = garageBox.left - stageBox.left + (garageBox.width - ROLLING_W) / 2;
      const busStopZone = document.getElementById('busStopZone');
      const stopBox = busStopZone.getBoundingClientRect();
      const endLeft = stopBox.left - stageBox.left + stopBox.width * 0.15;

      // masque le bus garé, affiche le clone roulant à sa place de départ
      wrapEl.classList.add('gone');
      rollingBusWrap.classList.remove('hidden');
      rollingBusWrap.style.transition = 'none';
      rollingBusWrap.style.left = startLeft + 'px';
      rollingBusWrap.innerHTML = busSVG(ligne.color, ligne.textColor, ligne.num, ROLLING_W);

      requestAnimationFrame(() => {
        rollingBusWrap.style.transition = 'left 1s cubic-bezier(.4,0,.2,1)';
        rollingBusWrap.style.left = endLeft + 'px';
      });

      setTimeout(() => boardPassengers(ligne), 1000);
    }

    function boardPassengers(ligne) {
      const group = queueGroups[0];
      const n = group ? group.count : 0;
      const paxEls = [...queueEl.querySelectorAll('.pax')].slice(0, n);

      let boarded = 0;
      paxEls.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add('boarding');
          sndCount();
          boarded++;
          paxBoardedTotal++;
          updateProgressUI();
          if (boarded === paxEls.length) {
            setTimeout(finishBoarding, 350);
          }
        }, i * 220);
      });
      if (n === 0) setTimeout(finishBoarding, 100);
    }

    function finishBoarding() {
      sndKlaxon();
      // le bus repart vers la droite (hors écran)
      const stageBox = stage.getBoundingClientRect();
      rollingBusWrap.style.left = (stageBox.width + 40) + 'px';

      queueGroups.shift();
      renderQueue();
      updateRequestBubble();

      setTimeout(() => {
        rollingBusWrap.classList.add('hidden');

        if (queueGroups.length === 0) {
          onPalierComplete();
          return;
        }

        // nouveau bus arrive au garage à la place libérée
        refillParked();
        [...garage.children].forEach(c => c.classList.add('arriving'));
        busy = false;
      }, 650);
    }

    function onPalierComplete() {
      markStarDone(palierIdx);
      Tracker.endSession(1, 1);
      const isLast = palierIdx >= PALIERS.length - 1;
      bravoStars.textContent = '⭐'.repeat(palierIdx + 1);
      document.getElementById('btnReplay').textContent = isLast ? 'Rejouer' : 'Continuer';
      bravoScreen.classList.add('show');
      SoundPool.play('victory', 0.85);
      busy = true;
    }

    document.getElementById('btnReplay').addEventListener('click', () => {
      bravoScreen.classList.remove('show');
      if (palierIdx < PALIERS.length - 1) {
        palierIdx++;
      } else {
        palierIdx = 0;
        document.querySelectorAll('.star').forEach(el => el.classList.add('off'));
      }
      Tracker.startSession('mj-36');
      busy = false;
      startPalier();
    });
    document.getElementById('btnMenu').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // ── Hook de test headless (EP-038) ──────────────────────────────
    window.__mjTest = {
      getState() {
        return {
          palierIdx, busy,
          paxBoardedTotal, paxTargetTotal,
          queueGroupsLen: queueGroups.length,
          currentColor: currentColor() ? currentColor().color : null,
          parkedColors: parkedLignes.map(l => l.color),
        };
      },
      // Tape le bus garé d'index idx (0,1,2)
      tapParked(idx) { onTapParked(idx); },
      // Trouve et tape le bon bus garé automatiquement
      tapGoodBus() {
        const target = currentColor();
        if (!target) return false;
        const idx = parkedLignes.findIndex(l => l.color === target.color);
        if (idx === -1) return false;
        onTapParked(idx);
        return true;
      },
      // Tape un mauvais bus (le premier différent de la couleur demandée)
      tapBadBus() {
        const target = currentColor();
        if (!target) return false;
        const idx = parkedLignes.findIndex(l => l.color !== target.color);
        if (idx === -1) return false;
        onTapParked(idx);
        return true;
      },
      isBravoShown() { return bravoScreen.classList.contains('show'); },
      isBusy() { return busy; },
    };
  })();
  </script>
</body>
</html>
