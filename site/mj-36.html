<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-36 — Arrête le bus !</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* --- GABARIT HEADER CANONIQUE (ne pas inventer, copier tel quel) --- */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { background:#1a1a2e; font-family:'Fredoka One',sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }
    .hdr {
      display:flex; align-items:center; gap:10px;
      padding:6px 12px; flex-shrink:0;
      background:rgba(0,0,0,0.25);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .hdr a {
      color:#fff; text-decoration:none; font-size:1.3rem;
      background:rgba(255,255,255,0.12); border-radius:8px;
      padding:4px 10px; font-weight:900; flex-shrink:0;
    }
    .hdr a:active { background:rgba(255,255,255,0.25); }
    .htitle { flex:1; font-size:1rem; font-weight:900; }
    /* --- FIN GABARIT HEADER --- */

    #stage {
      flex:1; position:relative; overflow:hidden;
      background: linear-gradient(#1a1a2e 0%, #1a1a2e 55%, #2c2c44 55%, #2c2c44 100%);
      touch-action:none;
    }

    /* Progression (paliers étoiles) */
    #progress {
      flex-shrink:0; display:flex; align-items:center; justify-content:center;
      gap:10px; padding:8px 12px; background:rgba(0,0,0,0.25);
    }
    #progress .stars { display:flex; gap:4px; font-size:1.3rem; }
    #progress .star.off { opacity:0.25; }
    #progress .msg { font-size:0.85rem; font-weight:900; opacity:0.9; }

    /* Route */
    .road {
      position:absolute; left:0; right:0; bottom:22%; height:30%;
      background:#4a4a5e;
    }
    .road::before {
      content:''; position:absolute; top:50%; left:0; right:0; height:4px;
      transform:translateY(-50%);
      background-image:repeating-linear-gradient(to right, #ffd23f 0 26px, transparent 26px 52px);
      opacity:0.8;
    }

    /* Trottoir */
    .sidewalk {
      position:absolute; left:0; right:0; bottom:0; height:22%;
      background:#8a8a9a;
      border-top:3px solid #6a6a7a;
    }

    /* Zone cible au sol (zébrures) */
    #targetZone {
      position:absolute; bottom:22%; height:30%;
      background-image:repeating-linear-gradient(
        135deg, rgba(255,255,255,0.55) 0 10px, rgba(255,255,255,0.15) 10px 20px
      );
      border-left:3px dashed #fff; border-right:3px dashed #fff;
      transition: left 0.3s, width 0.3s;
    }

    /* Poteau d'arrêt */
    #busStop {
      position:absolute; bottom:22%; display:flex; flex-direction:column; align-items:center;
      transform:translateX(-50%);
    }
    #busStop .sign {
      width:34px; height:34px; border-radius:50%;
      background:#0064B1; border:3px solid #fff;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem;
    }
    #busStop .pole { width:6px; height:70px; background:#c9c9c9; border-radius:2px; }

    /* Passagers */
    .passenger {
      position:absolute; bottom:22%; font-size:2rem;
      transition: left 1.1s ease-in-out;
    }

    /* Bus */
    #busWrap {
      position:absolute; bottom:26%; left:-220px;
      will-change: left;
    }
    #busWrap svg { display:block; }

    /* Sparkle bonus */
    .sparkle {
      position:absolute; font-size:2rem; pointer-events:none;
      animation: sparkleUp 0.9s ease-out forwards;
    }
    @keyframes sparkleUp {
      0%   { transform: translateY(0) scale(0.5); opacity:1; }
      60%  { transform: translateY(-40px) scale(1.3); opacity:1; }
      100% { transform: translateY(-70px) scale(1); opacity:0; }
    }

    #tapHint {
      position:absolute; top:10px; left:0; right:0; text-align:center;
      font-size:0.85rem; opacity:0.7; pointer-events:none;
    }

    /* Écran Bravo */
    #bravoScreen {
      position:absolute; inset:0; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:16px;
      background:rgba(20,20,40,0.94); z-index:20; text-align:center; padding:20px;
    }
    #bravoScreen.show { display:flex; }
    #bravoScreen h2 { font-size:2rem; }
    #bravoScreen .stars { font-size:2.4rem; }
    #bravoScreen .btns { display:flex; gap:14px; margin-top:10px; }
    .btn {
      font-family:'Fredoka One',sans-serif; font-size:1rem; font-weight:900;
      color:#fff; background:#0064B1; border:none; border-radius:14px;
      padding:14px 22px; min-width:110px; min-height:56px;
    }
    .btn:active { background:#004f8f; }
    .btn.secondary { background:#555; }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER — copier tel quel, changer uniquement l'emoji et le titre -->
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🛑 Arrête le bus !</span>
  </div>

  <div id="stage">
    <div class="road"></div>
    <div class="sidewalk"></div>
    <div id="targetZone"></div>
    <div id="busStop"><div class="sign">🚏</div><div class="pole"></div></div>
    <div id="busWrap"></div>
    <div id="tapHint">👉 Tape l'écran pour freiner !</div>
  </div>

  <div id="progress">
    <div class="stars">
      <span class="star" id="st1">⭐</span>
      <span class="star off" id="st2">⭐</span>
      <span class="star off" id="st3">⭐</span>
    </div>
    <div class="msg" id="progressMsg">Arrête le bus à l'arrêt !</div>
  </div>

  <div id="bravoScreen">
    <h2>🎉 Bravo !</h2>
    <div class="stars" id="bravoStars">⭐</div>
    <div class="btns">
      <button class="btn secondary" id="btnMenu">Menu</button>
      <button class="btn" id="btnReplay">Continuer</button>
    </div>
  </div>

</div>
  <script src="js/bus-svg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/victory-sounds.js"></script>
  <script>
  (function(){
    'use strict';
    Tracker.startSession('mj-36');

    const stage = document.getElementById('stage');
    const busWrap = document.getElementById('busWrap');
    const targetZone = document.getElementById('targetZone');
    const busStop = document.getElementById('busStop');
    const progressMsg = document.getElementById('progressMsg');
    const bravoScreen = document.getElementById('bravoScreen');
    const bravoStars = document.getElementById('bravoStars');

    // ── Paliers ★/★★/★★★ (spec MJ-36) ──────────────────────────────
    // Tolérance = fraction de la largeur du stage, jamais < 1 pare-chocs (BUS_W).
    const BUS_W = 200; // largeur du bus rendu (px)
    const PALIERS = [
      { key: 'star1', label: '★',   toleranceFrac: 0.40, speed: 130, need: 3 },
      { key: 'star2', label: '★★',  toleranceFrac: 0.24, speed: 160, need: 3 },
      { key: 'star3', label: '★★★', toleranceFrac: 0.14, speed: 190, need: 3 },
    ];
    const PILE_FRAC = 0.05; // "pile au milieu" = sparkle bonus, dans cette fraction autour du centre

    let palierIdx = 0;
    let successCount = 0; // réussites accumulées au palier courant
    let piles = 0;        // réussites "pile" comptées pour ★★★ (need réussites, pas piles strictes)

    // ── État physique du bus ────────────────────────────────────────
    let busX = -BUS_W;          // position gauche du bus (px)
    let speed = PALIERS[0].speed; // px/s
    let braking = false;
    let reversing = false;
    let running = true;
    let lastTs = null;
    let zoneCenter = 0, zoneHalfW = 0, stageW = 0;

    const DECEL = 220; // px/s² — décélération douce, constante par palier (prévisible)

    function pickLigne() {
      const pool = (window.LIGNES || []).length ? window.LIGNES : [{num:'162',color:'#0064B1',textColor:'#fff'}];
      return pool[Math.floor(Math.random() * pool.length)];
    }
    let ligne = pickLigne();

    function renderBus() {
      busWrap.innerHTML = busSVG(ligne.color, ligne.textColor, ligne.num, BUS_W);
    }
    renderBus();

    function layoutZone() {
      stageW = stage.clientWidth;
      const p = PALIERS[palierIdx];
      const zoneW = Math.max(stageW * p.toleranceFrac, BUS_W); // jamais < 1 pare-chocs
      zoneCenter = stageW * 0.72; // arrêt situé vers la droite
      zoneHalfW = zoneW / 2;
      targetZone.style.left = (zoneCenter - zoneHalfW) + 'px';
      targetZone.style.width = zoneW + 'px';
      busStop.style.left = zoneCenter + 'px';

      // passagers regroupés près du poteau
      document.querySelectorAll('.passenger').forEach(el => el.remove());
      const emojis = ['🧍', '🧍‍♀️', '🧒'];
      const n = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'passenger';
        el.textContent = emojis[i % emojis.length];
        el.style.left = (zoneCenter + 24 + i * 26) + 'px';
        el.dataset.baseLeft = (zoneCenter + 24 + i * 26);
        stage.appendChild(el);
      }
    }
    layoutZone();
    window.addEventListener('resize', layoutZone);

    function resetRun() {
      busX = -BUS_W;
      speed = PALIERS[palierIdx].speed;
      braking = false;
      reversing = false;
      ligne = pickLigne();
      renderBus();
    }

    function updateProgressUI() {
      const p = PALIERS[palierIdx];
      progressMsg.textContent = successCount === 0
        ? `Arrête le bus à l'arrêt ! (${p.label})`
        : `Encore ${p.need - successCount} !`;
    }
    updateProgressUI();

    function markStarDone(idx) {
      const el = document.getElementById('st' + (idx + 1));
      if (el) el.classList.remove('off');
    }

    function spawnSparkle(x) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = '✨';
      el.style.left = (x - 16) + 'px';
      el.style.bottom = '48%';
      stage.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function onSuccess(pile) {
      braking = false;
      reversing = false;
      running = false; // pause pendant la séquence de montée

      sndTschh();
      if (pile) spawnSparkle(busX + BUS_W / 2);

      // portes ouvertes -> passagers marchent vers le bus
      const doorX = busX + BUS_W * 0.35;
      document.querySelectorAll('.passenger').forEach((el, i) => {
        setTimeout(() => {
          el.style.left = doorX + (i * 4) + 'px';
        }, 120 + i * 80);
      });

      setTimeout(() => {
        sndPorte();
        SoundPool.play('success', 0.8);
      }, 700);

      setTimeout(() => {
        successCount++;
        const p = PALIERS[palierIdx];
        updateProgressUI();

        if (successCount >= p.need) {
          markStarDone(palierIdx);
          Tracker.endSession(1, 1);
          const isLast = palierIdx >= PALIERS.length - 1;
          bravoStars.textContent = '⭐'.repeat(palierIdx + 1);
          document.getElementById('btnReplay').textContent = isLast ? 'Rejouer' : 'Continuer';
          bravoScreen.classList.add('show');
          SoundPool.play('victory', 0.85);
        } else {
          resetRun();
          running = true;
          lastTs = null;
          requestAnimationFrame(tick);
        }
      }, 1500);
    }

    function onMiss() {
      // Demi-tour rigolo — JAMAIS un échec, jamais de son négatif.
      braking = false;
      reversing = true;
      speed = PALIERS[palierIdx].speed * 1.3;
      sndKlaxon();
    }

    let testMode = false; // désactive la boucle rAF réelle pendant l'avance manuelle (harnais)

    function tick(ts) {
      if (!running || testMode) return;
      if (lastTs == null) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;

      if (reversing) {
        busX -= speed * dt;
        if (busX <= -BUS_W - 20) {
          reversing = false;
          resetRun();
        }
      } else {
        if (braking) {
          speed = Math.max(0, speed - DECEL * dt);
        }
        busX += speed * dt;

        if (braking && speed <= 0.5) {
          // bus immobilisé — évalue la position
          const busCenter = busX + BUS_W / 2;
          const dist = Math.abs(busCenter - zoneCenter);
          if (dist <= zoneHalfW) {
            const pile = dist <= stageW * PILE_FRAC;
            onSuccess(pile);
          } else {
            onMiss();
          }
        } else if (busX > stageW + 20) {
          // dépassé sans avoir freiné à temps -> demi-tour aussi
          onMiss();
        }
      }

      busWrap.style.left = busX + 'px';
      if (running) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function brakeAt() {
      if (!running || reversing || braking) return;
      braking = true; // feedback immédiat (<100ms) : la décélération démarre dès la frame suivante
    }

    stage.addEventListener('pointerdown', brakeAt);

    // ── Écran Bravo — boutons ──────────────────────────────────────
    document.getElementById('btnReplay').addEventListener('click', () => {
      bravoScreen.classList.remove('show');
      if (palierIdx < PALIERS.length - 1) {
        palierIdx++;
      } else {
        palierIdx = 0;
        document.querySelectorAll('.star').forEach(el => el.classList.add('off'));
      }
      successCount = 0;
      layoutZone();
      updateProgressUI();
      Tracker.startSession('mj-36');
      running = true;
      lastTs = null;
      resetRun();
      requestAnimationFrame(tick);
    });
    document.getElementById('btnMenu').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // ── Hook de test headless (EP-038) ──────────────────────────────
    window.__mjTest = {
      getState() {
        return {
          busX, speed, braking, reversing, running,
          palierIdx, successCount, zoneCenter, zoneHalfW, stageW,
          need: PALIERS[palierIdx].need,
        };
      },
      // Simule un tap de frein maintenant
      brakeNow() { brakeAt(); },
      // Fait avancer la simulation de N millisecondes de jeu (pas de vraies rAF,
      // pilotage déterministe pour le harnais headless)
      advance(ms) {
        testMode = true; // sticky : une fois le harnais aux commandes, la vraie
                          // boucle rAF ne doit plus jamais reprendre la main
        const wasRunning = running;
        running = true;
        const steps = Math.ceil(ms / 16);
        let t = (lastTs == null ? performance.now() : lastTs);
        for (let i = 0; i < steps; i++) {
          t += 16;
          if (reversing) {
            busX -= speed * (16/1000);
            if (busX <= -BUS_W - 20) { reversing = false; resetRun(); }
          } else {
            if (braking) speed = Math.max(0, speed - DECEL * (16/1000));
            busX += speed * (16/1000);
            if (braking && speed <= 0.5) {
              const busCenter = busX + BUS_W / 2;
              const dist = Math.abs(busCenter - zoneCenter);
              if (dist <= zoneHalfW) onSuccess(dist <= stageW * PILE_FRAC);
              else onMiss();
            } else if (busX > stageW + 20) {
              onMiss();
            }
          }
          busWrap.style.left = busX + 'px';
        }
        lastTs = t;
        running = wasRunning;
        // testMode reste true : cf. commentaire ci-dessus
      },
      isBravoShown() { return bravoScreen.classList.contains('show'); },
      forceZoneCenter() { return zoneCenter; },
      forceBusX() { return busX; },
    };
  })();
  </script>
</body>
</html>
