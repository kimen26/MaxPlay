<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-38 — Saute-mouton !</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 14px; flex-shrink:0; }
    .lvl-label { font-size:0.85rem; color:var(--ink-3); }
    .btn-restart {
      background:rgba(255,255,255,0.12); border:2px solid var(--line);
      color:var(--ink); font-family:'Fredoka One',sans-serif; font-weight:900;
      border-radius:14px; padding:10px 16px; font-size:0.85rem; cursor:pointer;
      min-height:44px; min-width:44px;
    }
    .btn-restart:active { background:rgba(255,255,255,0.28); }

    .board-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:6px; min-height:0; }
    #board {
      position:relative;
      display:grid;
      grid-template-columns:repeat(5, var(--cell));
      grid-template-rows:repeat(5, var(--cell));
      gap:4px;
      border-radius:16px;
      background:rgba(255,255,255,0.05);
      padding:6px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
    }
    .cell {
      width:var(--cell); height:var(--cell);
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      position:relative;
      transition:background 0.15s, box-shadow 0.15s;
    }
    .cell.light { background:var(--card-2); }
    .cell.dark  { background:var(--card); }
    .cell.landable {
      box-shadow:0 0 0 4px var(--gold) inset, 0 0 18px 4px rgba(255,209,102,0.65);
      animation:landPulse 0.9s ease-in-out infinite alternate;
      cursor:pointer;
    }
    @keyframes landPulse {
      from { box-shadow:0 0 0 4px var(--gold) inset, 0 0 10px 2px rgba(255,209,102,0.4); }
      to   { box-shadow:0 0 0 4px #fff3b0 inset, 0 0 22px 8px rgba(255,209,102,0.85); }
    }

    .piece {
      width:82%; height:82%;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      position:relative;
      transition:transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .piece.max {
      background:radial-gradient(circle at 35% 30%, #ffd23f, #f5a623);
      box-shadow:0 4px 10px rgba(0,0,0,0.4);
      cursor:pointer;
      z-index:2;
      overflow:hidden;
    }
    .piece.max.selected { box-shadow:0 0 0 4px #fff, 0 4px 14px rgba(0,0,0,0.5); }
    .piece.max .face { font-size:calc(var(--cell) * 0.42); line-height:1; }
    .piece.max img.dino-face { width:100%; height:100%; object-fit:cover; object-position:50% 35%; border-radius:50%; }
    .piece.dodo {
      background:radial-gradient(circle at 35% 30%, #9aa3d9, #6b74b8);
      box-shadow:0 4px 10px rgba(0,0,0,0.35);
      overflow:hidden;
    }
    .piece.dodo .face { font-size:calc(var(--cell) * 0.4); line-height:1; }
    .piece.dodo img.dino-face { width:100%; height:100%; object-fit:cover; object-position:50% 35%; border-radius:50%; filter:brightness(0.72) saturate(0.7); }
    .dodo-zzz {
      position:absolute; top:-14px; right:-6px;
      font-size:calc(var(--cell) * 0.22);
      opacity:0.9;
      animation:zzzFloat 2s ease-in-out infinite;
    }
    @keyframes zzzFloat { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

    .piece.jumping { animation:jumpArc 0.42s ease-out; z-index:5; }
    @keyframes jumpArc {
      0%   { transform:translate(0,0) scale(1); }
      50%  { transform:translate(var(--jx,0), calc(var(--jy,0) - 34px)) scale(1.12); }
      100% { transform:translate(var(--jx,0), var(--jy,0)) scale(1); }
    }
    .piece.landed { animation:squash 0.28s ease-out; }
    @keyframes squash {
      0%   { transform:scale(1.12, 0.85); }
      60%  { transform:scale(0.92, 1.08); }
      100% { transform:scale(1,1); }
    }
    .piece.pouf {
      animation:poufOut 0.32s ease-in forwards;
    }
    @keyframes poufOut {
      0%   { transform:scale(1); opacity:1; }
      100% { transform:scale(1.6); opacity:0; }
    }

    .sparkle {
      position:absolute;
      font-size:1.4rem;
      pointer-events:none;
      animation:sparklePop 0.6s ease-out forwards;
      z-index:10;
    }
    @keyframes sparklePop {
      0%   { transform:scale(0.4) translateY(0); opacity:1; }
      100% { transform:scale(1.4) translateY(-30px); opacity:0; }
    }

    .msg-zone { min-height:32px; display:flex; align-items:center; justify-content:center; padding:2px 12px 8px; flex-shrink:0; text-align:center; }
    .msg { font-size:0.95rem; color:#ffe066; font-weight:900; }
    .msg.soft { color:#9aa3d9; font-size:0.85rem; }

  </style>
</head>
<body data-ambiance="nuit">
<div id="app">

  <!-- HEADER — copier tel quel, changer uniquement l'emoji et le titre -->
  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🐑 Saute-mouton !</span>
  </div>

  <div class="toolbar">
    <div class="lvl-label" id="lvl-label">Niveau 1</div>
    <button class="btn-restart" id="btn-restart" onclick="restartLevel()">&#8630; Recommencer</button>
  </div>
  <div class="pips" id="pips"></div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="msg-zone" id="msg-zone"></div>

</div>

<script src="js/dinos-assets.js"></script>
<!-- manifeste têtes de dinos (pions = bébés dinos, re-skin PY 2026-07-28) -->
<script src="js/mj-shell.js"></script>
<script>
MJ.ready(function () {

  const shell = MJ.init({
    id: 'mj-38', emoji: '🐑', titre: 'Saute-mouton !',
    golden: true,
    consigne: false, // msg-zone gère les messages contextuels (Combo/Coincé)
    regle: {
      texte: 'Saute par-dessus les pions dodo pour les faire disparaître !',
      picto: '🐑↷💤',
      etapes: [
        { t: 'Je tape mon mouton 😊', d: 'Il se met à briller : c’est lui que je vais faire sauter.' },
        { t: 'Je regarde les cases qui brillent en or ✨',
          d: 'Elles montrent où mon mouton peut atterrir en sautant par-dessus un dodo voisin 💤.' },
        { t: 'Je tape la case dorée : hop, il saute ! 🐑↷',
          d: 'Le mouton endormi qu’il a sauté disparaît en pouf. Je peux enchaîner plusieurs sauts d’affilée : combo ✨ !' },
        { t: 'Coincé ? Je recommence tranquille 🔄',
          d: 'Le bouton « Recommencer » remet le niveau à zéro, sans rien perdre. Tous les dodos envolés = niveau gagné !' }
      ]
    }
  });

// ── NIVEAUX (précalculés + vérifiés par solveur BFS jetable, voir PR MJ-38) ──
// Chaque niveau : { max:[r,c], dodos:[[r,c],...], tier:'★'|'★★'|'★★★' }
const LEVELS = [
  { tier:'★',   max:[3,3], dodos:[[3,2],[2,2]] },
  { tier:'★',   max:[3,1], dodos:[[2,2],[2,1],[3,2]] },
  { tier:'★',   max:[2,3], dodos:[[3,3],[3,2]] },
  { tier:'★★',  max:[2,3], dodos:[[2,2],[1,1],[1,2],[3,2]] },
  { tier:'★★',  max:[2,1], dodos:[[1,1],[1,2],[2,2],[3,1],[3,2]] },
  { tier:'★★',  max:[3,3], dodos:[[2,3],[1,2],[2,1],[3,2]] },
  { tier:'★★★', max:[2,1], dodos:[[1,1],[1,2],[3,2],[4,2],[2,2],[3,1]] },
  { tier:'★★★', max:[2,2], dodos:[[1,3],[0,3],[1,1],[3,2],[2,1],[1,2],[3,3]] },
  { tier:'★★★', max:[2,3], dodos:[[3,3],[4,2],[3,1],[1,1],[0,2],[1,2],[3,2]] },
];

const N = 5;
const DIRS = [];
for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) if (dr||dc) DIRS.push([dr,dc]);
function inb(r,c){ return r>=0 && r<N && c>=0 && c<N; }
function pk(r,c){ return r+','+c; }

const G = shell.G;
// 🔒 9 niveaux fixes (indépendant du barème questions Golden 4/6/8)
G.totalQ = LEVELS.length;
G.buildPips();

// Pions → bébés dinos (re-skin PY 2026-07-28, zéro impact règles) : Max =
// une tête (éveillée), dodo = têtes endormies (assombries en CSS). Tirées une
// fois par chargement de partie. Défensif : sans asset, fallback emoji 😊/😴.
const DINO_TETES_POOL = Object.keys(window.DINO_ASSETS || {})
  .map(k => window.DINO_ASSETS[k] && window.DINO_ASSETS[k].tete)
  .filter(Boolean);
function randomTete() {
  if (!DINO_TETES_POOL.length) return null;
  return DINO_TETES_POOL[Math.floor(Math.random() * DINO_TETES_POOL.length)];
}
let MAX_TETE = randomTete();
let DODO_TETE = randomTete();

// ── ÉTAT ──────────────────────────────────────────────────────────
let levelIdx = 0;
let maxPos = null;
let dodoSet = null; // Set de "r,c"
let selected = false;
let animating = false;
let comboCount = 0;

function loadLevel(idx) {
  const lv = LEVELS[idx];
  maxPos = [...lv.max];
  dodoSet = new Set(lv.dodos.map(([r,c]) => pk(r,c)));
  selected = false;
  animating = false;
  comboCount = 0;
  document.getElementById('lvl-label').textContent = `Niveau ${idx+1} / ${LEVELS.length}`;
  document.getElementById('msg-zone').innerHTML = '';
  renderBoard();
}

function cellSize() {
  const wrap = document.querySelector('.board-wrap');
  const avail = Math.min(wrap.clientWidth - 24, wrap.clientHeight - 24);
  return Math.max(70, Math.min(120, Math.floor(avail / 5) - 4));
}

function renderBoard() {
  const board = document.getElementById('board');
  const cs = cellSize();
  board.style.setProperty('--cell', cs + 'px');
  board.innerHTML = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r+c) % 2 === 0 ? 'light' : 'dark');
      cell.dataset.r = r; cell.dataset.c = c;
      cell.id = `cell-${r}-${c}`;
      cell.addEventListener('click', () => onCellClick(r, c));
      board.appendChild(cell);

      if (maxPos[0] === r && maxPos[1] === c) {
        cell.appendChild(makeMaxPiece());
      } else if (dodoSet.has(pk(r,c))) {
        cell.appendChild(makeDodoPiece());
      }
    }
  }
  updateLandable();
}

function makeMaxPiece() {
  const p = document.createElement('div');
  p.className = 'piece max' + (selected ? ' selected' : '');
  p.id = 'piece-max';
  p.innerHTML = MAX_TETE
    ? `<img class="dino-face" src="${MAX_TETE}" alt="">`
    : '<span class="face">&#128522;</span>';
  p.addEventListener('click', (e) => { e.stopPropagation(); onMaxClick(); });
  return p;
}

function makeDodoPiece() {
  const p = document.createElement('div');
  p.className = 'piece dodo';
  p.innerHTML = (DODO_TETE
    ? `<img class="dino-face" src="${DODO_TETE}" alt="">`
    : '<span class="face">&#128564;</span>') + '<span class="dodo-zzz">z<sup>z</sup></span>';
  return p;
}

function landingSpots() {
  const [mr, mc] = maxPos;
  const spots = [];
  for (const [dr, dc] of DIRS) {
    const orr = mr+dr, occ = mc+dc, tr = mr+2*dr, tc = mc+2*dc;
    if (!inb(orr,occ) || !inb(tr,tc)) continue;
    if (!dodoSet.has(pk(orr,occ))) continue;
    if (dodoSet.has(pk(tr,tc))) continue;
    spots.push({ over:[orr,occ], to:[tr,tc] });
  }
  return spots;
}

function updateLandable() {
  document.querySelectorAll('.cell.landable').forEach(el => el.classList.remove('landable'));
  if (!selected) return;
  for (const spot of landingSpots()) {
    const el = document.getElementById(`cell-${spot.to[0]}-${spot.to[1]}`);
    if (el) el.classList.add('landable');
  }
}

function onMaxClick() {
  if (animating) return;
  selected = !selected;
  renderBoard();
}

function onCellClick(r, c) {
  if (animating || !selected) return;
  const spot = landingSpots().find(s => s.to[0] === r && s.to[1] === c);
  if (!spot) return;
  doJump(spot);
}

function doJump(spot) {
  animating = true;
  const fromEl = document.getElementById('piece-max');
  const fromCell = document.getElementById(`cell-${maxPos[0]}-${maxPos[1]}`);
  const overCell = document.getElementById(`cell-${spot.over[0]}-${spot.over[1]}`);
  const toCell = document.getElementById(`cell-${spot.to[0]}-${spot.to[1]}`);

  const cs = cellSize() + 4;
  const dxCells = spot.to[1] - parseInt(fromCell.dataset.c, 10);
  const dyCells = spot.to[0] - parseInt(fromCell.dataset.r, 10);
  fromEl.style.setProperty('--jx', (dxCells * cs) + 'px');
  fromEl.style.setProperty('--jy', (dyCells * cs) + 'px');
  fromEl.classList.add('jumping');

  playHopSound();

  // La souris/pion sautée disparaît en "pouf" pendant l'arc
  const overPiece = overCell.querySelector('.piece.dodo');
  if (overPiece) overPiece.classList.add('pouf');

  setTimeout(() => {
    dodoSet.delete(pk(spot.over[0], spot.over[1]));
    maxPos = [spot.to[0], spot.to[1]];
    selected = false;
    comboCount++;
    renderBoard();
    const newPiece = document.getElementById('piece-max');
    if (newPiece) newPiece.classList.add('landed');
    const pipTarget = document.getElementById('pip' + levelIdx);
    if (window.MaxFX && newPiece && pipTarget) {
      MaxFX.markPoint(newPiece, pipTarget, { style: 'bounce', result: 'green' });
    }

    if (comboCount > 1) showCombo(toCell);

    animating = false;

    if (dodoSet.size === 0) {
      setTimeout(showWin, 350);
    } else if (landingSpots().length === 0 && !hasAnyJumpFromDodos()) {
      setTimeout(showStuck, 300);
    }
  }, 420);
}

// Vérifie s'il existe un saut possible depuis N'IMPORTE OÙ n'a pas de sens ici
// (Max est un pion unique) — on vérifie juste si Max peut sauter depuis sa
// position actuelle. Gardé en fonction séparée pour lisibilité du message.
function hasAnyJumpFromDodos() {
  return landingSpots().length > 0;
}

function showCombo(cellEl) {
  const rect = cellEl.getBoundingClientRect();
  const sp = document.createElement('div');
  sp.className = 'sparkle';
  sp.textContent = '✨';
  sp.style.left = (rect.left + rect.width/2 - 12) + 'px';
  sp.style.top = (rect.top) + 'px';
  sp.style.position = 'fixed';
  document.body.appendChild(sp);
  setTimeout(() => sp.remove(), 650);
  document.getElementById('msg-zone').innerHTML = '<span class="msg">✨ Combo !</span>';
}

function showStuck() {
  document.getElementById('msg-zone').innerHTML = '<span class="msg soft">Essaie encore ! Appuie sur Recommencer 🙂</span>';
}

function showWin() {
  G.notePip(levelIdx, 1);
  const isLast = levelIdx >= LEVELS.length - 1;
  if (isLast) {
    G.showEnd({ replayUrl: 'mj-38.html' });
    return;
  }
  if (typeof playEndSound === 'function') playEndSound(1, 1);
  animating = true; // bloque le plateau pendant la célébration inter-niveau
  const celebration = window.MaxFX
    ? MaxFX.finalStar(document.getElementById('app'), { style: 'breathe', label: 'BRAVO !' })
    : Promise.resolve();
  Promise.resolve(celebration).then(() => setTimeout(nextLevel, 400));
}

function nextLevel() {
  levelIdx++;
  animating = false;
  if (levelIdx >= LEVELS.length) return;
  loadLevel(levelIdx);
}

function restartLevel() {
  animating = false;
  loadLevel(levelIdx);
}

// ── SON saut (doux, pas violent) ────────────────────────────────────
function playHopSound() {
  try {
    if (typeof sndCount === 'function') { sndCount(); return; }
  } catch(e) {}
}

// ── INIT ──────────────────────────────────────────────────────────
if (typeof Tracker !== 'undefined') Tracker.startSession('mj-38');
loadLevel(levelIdx);
window.addEventListener('resize', renderBoard);

// Exposées sur window : appelées par les onclick="…" inline du HTML
// (piège connu — dans MJ.ready(), les function déclarées restent dans la
// closure et ne sont plus globales automatiquement).
window.restartLevel = restartLevel;
window.nextLevel = nextLevel;
});
</script>
</body>
</html>
