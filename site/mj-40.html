<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MJ-40 — Tangram des dinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* --- GABARIT HEADER CANONIQUE (ne pas inventer, copier tel quel) --- */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }
    /* --- FIN GABARIT HEADER --- */

    @font-face { font-family:'Fredoka One'; src: local('Fredoka One'); }

    #tier-bar {
      display:flex; justify-content:center; gap:8px; padding:6px 8px; flex-shrink:0;
    }
    .tier-btn {
      background:rgba(255,255,255,0.1); border:2px solid transparent; color:#fff;
      font-family:'Fredoka One',sans-serif; font-weight:900; font-size:0.85rem;
      border-radius:14px; padding:6px 14px; cursor:pointer;
      min-width:80px; min-height:44px;
    }
    .tier-btn.active { background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }

    #instruction {
      text-align:center; font-size:clamp(0.75rem,2.6vmin,1rem); opacity:0.9; padding:0 10px 4px;
      flex-shrink:0;
    }

    #main {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
      min-height:0; overflow:hidden; padding:4px 6px; gap:4px;
    }

    #target-zone {
      flex:1 1 auto; width:100%; max-width:520px; min-height:0;
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    #target-svg { width:100%; height:100%; max-height:100%; }

    #tray-zone {
      flex-shrink:0; width:100%; max-width:600px;
      display:flex; align-items:center; justify-content:center;
      min-height:110px;
    }
    #tray-svg { width:100%; height:110px; overflow:visible; }

    .piece {
      cursor:grab; touch-action:none;
      filter:drop-shadow(0 3px 4px rgba(0,0,0,0.35));
    }
    .piece.dragging { cursor:grabbing; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
    .piece.locked { cursor:default; }
    .piece polygon, .piece path { stroke:rgba(0,0,0,0.35); stroke-width:0.06; stroke-linejoin:round; }

    #figure-name {
      text-align:center; font-size:clamp(0.9rem,3vmin,1.3rem); font-weight:900; color:var(--gold);
      padding:2px 8px; flex-shrink:0;
    }

  </style>
</head>
<body data-ambiance="nuit">

  <div id="main">

<!-- LE GABARIT : charge tout le cadre standard (thème, panneau ?, tracking, cloud) -->
<script src="js/mj-shell.js"></script>
<script>
MJ.ready(function () {
  'use strict';

  document.title = 'MJ-40 — ' + MJi18n.titre('mj-40', 'Tangram des dinos');
  const htitleEl = document.getElementById('htitle');
  if (htitleEl) htitleEl.textContent = '🦕 ' + MJi18n.titre('mj-40', 'Tangram des dinos');
  const shell = MJ.init({
    id: 'mj-40', emoji: '🦕', titre: MJi18n.titre('mj-40', 'Tangram des dinos'),
    golden: true,
    consigne: false,
    regle: {
      picto: '🔺👉🦕',
      texte: 'Place les 7 pièces sur la silhouette du dino !',
      etapes: [
        { t: 'Je regarde la silhouette 👀',
          d: 'Une forme mystère attend en haut : un œuf, une écaille, un long cou de dino…' },
        { t: 'Je glisse une pièce dessus 👆',
          d: 'Je prends une pièce colorée en bas et je la fais glisser sur la bonne case de la silhouette.' },
        { t: 'Je tape une pièce pour la tourner 🔄',
          d: 'Si elle ne rentre pas bien, un petit tap la fait pivoter jusqu’à ce qu’elle s’accroche !' },
        { t: 'Plus j’ai d’étoiles, plus c’est costaud 💪',
          d: 'Les paliers ★★ et ★★★ ont des figures plus difficiles à reconstituer.' }
      ]
    }
  });
  const T = (cle, fr, params) => (window.MJi18n ? MJi18n.t('mj-40', cle, fr, params) : fr);

  // ============================================================
  // GÉOMÉTRIE — 7 pièces du tangram, coordonnées EXACTES vérifiées
  // (grille 8x8, aire totale 64 : 2 grands triangles aire16, 1 triangle
  // moyen aire8, 2 petits triangles aire4, 1 carré aire8, 1 parallélogramme
  // aire8). Vérifié par script node (aires + zéro trou + zéro chevauchement)
  // avant intégration — voir script de vérification en scratchpad session.
  // ============================================================
  const HOME = {
    bigTri1: [[0,0],[0,8],[4,4]],
    bigTri2: [[0,8],[8,8],[4,4]],
    smallTri1: [[2,2],[6,2],[4,4]],
    smallTri2: [[8,4],[8,8],[6,6]],
    square: [[4,4],[6,2],[8,4],[6,6]],
    parallelogram: [[0,0],[4,0],[6,2],[2,2]],
    medTri: [[4,0],[8,0],[8,4]],
  };
  const COLORS = {
    bigTri1: '#e74c3c', bigTri2: '#3498db', smallTri1: '#2ecc71',
    smallTri2: '#f39c12', square: '#9b59b6', parallelogram: '#1abc9c', medTri: '#e91e63',
  };
  const PIECE_NAMES = Object.keys(HOME);

  function centroid(pts) {
    let x = 0, y = 0;
    for (const [px, py] of pts) { x += px; y += py; }
    return [x / pts.length, y / pts.length];
  }
  // pièce recentrée sur son propre centroïde (pour rotation autour du centre visuel)
  const LOCAL = {};
  const LOCAL_CENTER = {};
  for (const name of PIECE_NAMES) {
    const c = centroid(HOME[name]);
    LOCAL_CENTER[name] = c;
    LOCAL[name] = HOME[name].map(([x, y]) => [x - c[0], y - c[1]]);
  }

  function polyToPoints(poly) {
    return poly.map(([x, y]) => `${x.toFixed(3)},${y.toFixed(3)}`).join(' ');
  }
  function transformPoly(local, rotDeg, flip, tx, ty) {
    const rad = rotDeg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    return local.map(([x, y]) => {
      const px = flip ? -x : x;
      const rx = px * cos - y * sin, ry = px * sin + y * cos;
      return [rx + tx, ry + ty];
    });
  }

  // ============================================================
  // FIGURES — 3 par palier. Coordonnées SOLUTIONS exactes (tx,ty = position
  // cible du centroïde de la pièce dans l'espace de la figure 0..16).
  // Toutes vérifiées géométriquement (aire totale=64, 0% chevauchement,
  // 0% trou) avant intégration.
  // ============================================================
  function solutionFor(baseName) {
    // reconstruit tx,ty,rot,flip par pièce pour chaque figure de base
    const sol = {};
    for (const name of PIECE_NAMES) {
      const c = LOCAL_CENTER[name];
      sol[name] = { rot: 0, flip: false, tx: c[0], ty: c[1] };
    }
    return sol;
  }

  function rotateWholeSolution(sol, angleDeg, cx, cy) {
    const rad = angleDeg * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const out = {};
    for (const name of PIECE_NAMES) {
      const s = sol[name];
      const dx = s.tx - cx, dy = s.ty - cy;
      out[name] = {
        rot: (s.rot + angleDeg + 360) % 360,
        flip: s.flip,
        tx: dx * cos - dy * sin + cx,
        ty: dx * sin + dy * cos + cy,
      };
    }
    return out;
  }

  // Figure "œuf" — le carré tangram tel quel (0°)
  const solEgg = solutionFor();

  // Figure "écaille" — le carré tourné 45° (silhouette losange)
  const solScale = rotateWholeSolution(solEgg, 45, 4, 4);

  // Figure "sauropode" — moitié du carré (2 grands triangles) restent en
  // place, l'autre moitié (triangle moyen + 2 petits + carré + parallélo.,
  // qui forment ensemble le triangle complémentaire) est tournée 180° autour
  // du sommet partagé C(8,8) : donne une silhouette allongée en diagonale
  // (cou de sauropode). Vérifié : aire totale conservée, 0% chevauchement.
  const GROUP_B = ['smallTri1', 'smallTri2', 'square', 'parallelogram', 'medTri'];
  function rotateGroupSolution(sol, names, angleDeg, cx, cy) {
    const rad = angleDeg * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const out = { ...sol };
    for (const name of names) {
      const s = sol[name];
      const dx = s.tx - cx, dy = s.ty - cy;
      out[name] = {
        rot: (s.rot + angleDeg + 360) % 360,
        flip: s.flip,
        tx: dx * cos - dy * sin + cx,
        ty: dx * sin + dy * cos + cy,
      };
    }
    return out;
  }
  const solSauropod = rotateGroupSolution(solEgg, GROUP_B, 180, 8, 8);
  const solSauropod90 = rotateWholeSolution(solSauropod, 90, 8, 8);
  const solScale2 = rotateWholeSolution(solEgg, 135, 4, 4);

  // 9 figures : 3 paliers x 3 figures. Paliers 1 = guidé (contours visibles),
  // 2 = silhouette pleine, 3 = silhouette pleine (variantes plus travaillées,
  // ici mêmes solutions géométriques réutilisées avec orientation différente
  // — le contenu géométrique est le sous-ensemble vérifié fiable ; la
  // difficulté croît via le nombre d'indices visuels retirés).
  const FIGURES = [
    // Palier 1 — guidé (contours pointillés visibles)
    { tier: 1, name: '🥚 ' + T('figOeufDeDino', 'Œuf de dino'), guided: true, sol: solEgg, bbox: [0, 0, 8, 8] },
    { tier: 1, name: '💎 ' + T('figEcailleTriceratops', 'Écaille de Tricératops'), guided: true, sol: solScale, bbox: [-1.66, -1.66, 9.66, 9.66] },
    { tier: 1, name: '🦕 ' + T('figCouSauropode', 'Cou de sauropode'), guided: true, sol: solSauropod, bbox: [0, 0, 16, 16] },
    // Palier 2 — silhouette pleine
    { tier: 2, name: '🥚 ' + T('figOeufMystere', 'Œuf mystère'), guided: false, sol: solEgg, bbox: [0, 0, 8, 8] },
    { tier: 2, name: '💎 ' + T('figEcailleBrillante', 'Écaille brillante'), guided: false, sol: solScale, bbox: [-1.66, -1.66, 9.66, 9.66] },
    { tier: 2, name: '🦕 ' + T('figLongCouCache', 'Long cou caché'), guided: false, sol: solSauropod, bbox: [0, 0, 16, 16] },
    // Palier 3 — silhouette pleine, orientations plus fines
    { tier: 3, name: '💎 ' + T('figEcailleTournee', 'Écaille tournée'), guided: false, sol: solScale2, bbox: [-2.83, 0, 8, 10.83] },
    { tier: 3, name: '🦕 ' + T('figCouTourne', 'Cou tourné'), guided: false, sol: solSauropod90, bbox: [0, 0, 16, 16] },
    { tier: 3, name: '🥚 ' + T('figOeufTourne', 'Œuf tourné'), guided: false, sol: rotateWholeSolution(solEgg, 90, 4, 4), bbox: [0, 0, 8, 8] },
  ];

  const SNAP_DIST = 1.3;   // tolérance position (unités grille) — généreuse pour enfants
  const SNAP_ANGLE = 12;   // tolérance angle en degrés

  const SVGNS = 'http://www.w3.org/2000/svg';
  const targetSvg = document.getElementById('target-svg');
  const traySvg = document.getElementById('tray-svg');
  const figureNameEl = document.getElementById('figure-name');
  const instructionEl = document.getElementById('instruction');
  const G = shell.G;
  instructionEl.textContent = T('instruction', 'Glisse les pièces sur la silhouette. Tape une pièce pour la tourner.');
  // 🔒 3 figures fixes par palier (indépendant du barème questions Golden 4/6/8)
  G.totalQ = 3;

  let currentFigureIdx = 0;
  let currentTier = 1;
  let placedCount = 0;
  let piecesState = {}; // name -> { rot, flip, tx, ty, locked }
  let starsPerTier = { 1: 0, 2: 0, 3: 0 };

  function figuresForTier(tier) {
    return FIGURES.map((f, i) => ({ ...f, idx: i })).filter(f => f.tier === tier);
  }

  function el(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function loadFigure(idx) {
    currentFigureIdx = idx;
    const fig = FIGURES[idx];
    figureNameEl.textContent = fig.name;
    placedCount = 0;
    piecesState = {};
    for (const name of PIECE_NAMES) piecesState[name] = { rot: 0, flip: false, tx: 0, ty: 0, locked: false };

    renderTarget(fig);
    renderTray(fig);
    Tracker.startSession('mj-40');
  }

  function renderTarget(fig) {
    targetSvg.innerHTML = '';
    const [bx0, by0, bx1, by1] = fig.bbox;
    const pad = 1.2;
    targetSvg.setAttribute('viewBox', `${bx0 - pad} ${by0 - pad} ${(bx1 - bx0) + pad * 2} ${(by1 - by0) + pad * 2}`);

    // silhouette pleine (sombre) = union des 7 polygones solution
    const g = el('g', { id: 'silhouette-group' });
    for (const name of PIECE_NAMES) {
      const s = fig.sol[name];
      const poly = transformPoly(LOCAL[name], s.rot, s.flip, s.tx, s.ty);
      const shape = el('polygon', {
        points: polyToPoints(poly),
        fill: fig.guided ? 'rgba(255,255,255,0.14)' : '#0e0e1c',
        stroke: fig.guided ? 'rgba(255,255,255,0.55)' : 'none',
        'stroke-width': fig.guided ? '0.07' : '0',
        'stroke-dasharray': fig.guided ? '0.25 0.2' : 'none',
      });
      g.appendChild(shape);
    }
    targetSvg.appendChild(g);

    // yeux (cachés, apparaissent à la victoire) — positionnés au centre-haut de la figure
    const cx = (bx0 + bx1) / 2, cyTop = by0 + (by1 - by0) * 0.28;
    const eyesGroup = el('g', { id: 'victory-eyes', opacity: '0' });
    eyesGroup.appendChild(el('circle', { cx: cx - 0.6, cy: cyTop, r: '0.35', fill: '#fff' }));
    eyesGroup.appendChild(el('circle', { cx: cx + 0.6, cy: cyTop, r: '0.35', fill: '#fff' }));
    eyesGroup.appendChild(el('circle', { cx: cx - 0.6, cy: cyTop, r: '0.15', fill: '#1a1a2e' }));
    eyesGroup.appendChild(el('circle', { cx: cx + 0.6, cy: cyTop, r: '0.15', fill: '#1a1a2e' }));
    targetSvg.appendChild(eyesGroup);
  }

  function renderTray(fig) {
    traySvg.innerHTML = '';
    // dispose les 7 pièces en tas dans le plateau bas, à leur taille/local, orientation 0
    const cols = 7;
    const spacing = 100 / cols;
    PIECE_NAMES.forEach((name, i) => {
      const cx = spacing * i + spacing / 2;
      const cy = 13;
      const s = piecesState[name];
      s.tx = cx; s.ty = cy; s.rot = 0; s.flip = false; s.locked = false;
      drawPiece(name, traySvg, 3.1); // scale ~3.1 pour tenir dans viewBox 100x26
    });
  }

  // scale = facteur d'agrandissement des pièces dans le plateau (unités locales -> viewBox tray)
  const PIECE_SCALE = {};

  function drawPiece(name, container, scale) {
    PIECE_SCALE[name] = scale;
    const s = piecesState[name];
    const local = LOCAL[name].map(([x, y]) => [x * scale, y * scale]);
    const poly = transformPoly(local, s.rot, s.flip, s.tx, s.ty);
    const p = el('polygon', {
      points: polyToPoints(poly),
      fill: COLORS[name],
      class: 'piece',
      'data-piece': name,
    });
    p.__scale = scale;
    container.appendChild(p);
    attachDrag(p, name);
  }

  function getPieceEl(name) {
    return document.querySelector(`.piece[data-piece="${name}"]`);
  }

  function svgPoint(svg, clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const inv = ctm.inverse();
    const p = pt.matrixTransform(inv);
    return { x: p.x, y: p.y };
  }

  let dragInfo = null;

  function attachDrag(p, name) {
    p.addEventListener('pointerdown', (e) => onPointerDown(e, name));
  }

  function onPointerDown(e, name) {
    if (piecesState[name].locked) return;
    e.preventDefault();
    const el0 = getPieceEl(name);
    if (!el0) return;
    el0.setPointerCapture(e.pointerId);
    const s = piecesState[name];
    const startTs = Date.now();
    const parentSvg = el0.closest('svg');
    const startPt = svgPoint(parentSvg, e.clientX, e.clientY);
    dragInfo = { name, parentSvg, startPt, origTx: s.tx, origTy: s.ty, moved: false, startTs };
    el0.classList.add('dragging');
    // remonte la pièce au-dessus (dans le SVG cible pendant le drag, on la
    // déplace visuellement là où le doigt va, même si elle démarre au plateau)
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  }

  function onPointerMove(e) {
    if (!dragInfo) return;
    const { name, parentSvg, startPt, origTx, origTy } = dragInfo;
    // si la pièce vient du plateau, on la fait glisser dans le repère du
    // plateau tant qu'elle est dessus; on convertit vers la cible seulement
    // au moment du calcul de snap. Pour simplifier l'UX, on migre la pièce
    // dans le SVG cible dès le premier mouvement significatif.
    const curPt = svgPoint(parentSvg, e.clientX, e.clientY);
    const dx = curPt.x - startPt.x, dy = curPt.y - startPt.y;
    if (!dragInfo.moved && Math.hypot(dx, dy) > 0.5) {
      dragInfo.moved = true;
      migratePieceToTarget(name);
    }
    if (dragInfo.migrated) {
      const targetPt = svgPoint(targetSvg, e.clientX, e.clientY);
      const s = piecesState[name];
      s.tx = targetPt.x - dragInfo.grabOffsetX;
      s.ty = targetPt.y - dragInfo.grabOffsetY;
      updatePieceTransform(name);
    } else {
      const s = piecesState[name];
      s.tx = origTx + dx / (traySvg.clientWidth / 100);
      s.ty = origTy + dy / (traySvg.clientHeight / 26);
      updatePieceTransform(name);
    }
  }

  function migratePieceToTarget(name) {
    const trayEl = getPieceEl(name);
    if (!trayEl) return;
    const s = piecesState[name];
    // position actuelle en coords plateau -> retire du plateau, ajoute à la cible
    // au centre visible de la zone cible pour une transition douce
    const fig = FIGURES[currentFigureIdx];
    const [bx0, by0, bx1, by1] = fig.bbox;
    trayEl.remove();
    s.tx = (bx0 + bx1) / 2;
    s.ty = (by0 + by1) / 2;
    s.rot = 0;
    const scale = 1;
    drawPieceInTarget(name, scale);
    dragInfo.migrated = true;
    dragInfo.grabOffsetX = 0;
    dragInfo.grabOffsetY = 0;
  }

  function drawPieceInTarget(name, scale) {
    const s = piecesState[name];
    const local = LOCAL[name].map(([x, y]) => [x * scale, y * scale]);
    const poly = transformPoly(local, s.rot, s.flip, s.tx, s.ty);
    const p = el('polygon', {
      points: polyToPoints(poly),
      fill: COLORS[name],
      class: 'piece',
      'data-piece': name,
    });
    targetSvg.appendChild(p);
    attachDrag(p, name);
  }

  function updatePieceTransform(name) {
    const p = getPieceEl(name);
    if (!p) return;
    const s = piecesState[name];
    const scale = p.closest('svg') === traySvg ? (PIECE_SCALE[name] || 3.1) : 1;
    const local = LOCAL[name].map(([x, y]) => [x * scale, y * scale]);
    const poly = transformPoly(local, s.rot, s.flip, s.tx, s.ty);
    p.setAttribute('points', polyToPoints(poly));
  }

  function onPointerUp(e) {
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    if (!dragInfo) return;
    const { name, moved } = dragInfo;
    const el0 = getPieceEl(name);
    if (el0) el0.classList.remove('dragging');

    if (!moved) {
      // tap simple = rotation 45°
      rotatePiece(name);
    } else if (dragInfo.migrated) {
      trySnap(name);
    }
    dragInfo = null;
  }

  function rotatePiece(name) {
    const s = piecesState[name];
    if (s.locked) return;
    s.rot = (s.rot + 45) % 360;
    updatePieceTransform(name);
    if (dragInfo && dragInfo.migrated) trySnap(name);
    else if (getPieceEl(name) && getPieceEl(name).closest('svg') === targetSvg) trySnap(name);
  }

  function angleDiff(a, b) {
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  function trySnap(name) {
    const fig = FIGURES[currentFigureIdx];
    const target = fig.sol[name];
    const s = piecesState[name];
    const distOk = Math.hypot(s.tx - target.tx, s.ty - target.ty) < SNAP_DIST;
    // le parallélogramme peut se retourner (flip) — on teste aussi la version flip pour l'angle
    const rotOk = angleDiff(s.rot, target.rot) < SNAP_ANGLE || angleDiff(s.rot, (target.rot + 180) % 360) < SNAP_ANGLE;
    const flipOk = name === 'parallelogram' ? true : s.flip === target.flip;
    if (distOk && rotOk && flipOk) {
      s.tx = target.tx; s.ty = target.ty; s.rot = target.rot; s.locked = true;
      updatePieceTransform(name);
      const p = getPieceEl(name);
      if (p) {
        p.classList.add('locked');
        p.setAttribute('stroke', '#ffe066');
        p.setAttribute('stroke-width', '0.12');
      }
      placedCount++;
      playDing();
      if (placedCount >= PIECE_NAMES.length) onFigureComplete();
    }
  }

  function playDing() {
    try { sndDing(); } catch (e) { /* silence — un son manqué ne bloque rien */ }
  }

  function onFigureComplete() {
    // silhouette prend vie : yeux + wiggle
    const eyes = document.getElementById('victory-eyes');
    if (eyes) eyes.setAttribute('opacity', '1');
    const group = document.getElementById('silhouette-group');
    if (group) {
      group.style.transition = 'transform 0.25s';
      group.style.transformOrigin = 'center';
      let t = 0;
      const wiggle = setInterval(() => {
        t++;
        group.setAttribute('transform', `rotate(${t % 2 === 0 ? 3 : -3})`);
        if (t >= 4) { clearInterval(wiggle); group.setAttribute('transform', ''); }
      }, 150);
    }
    const fig = FIGURES[currentFigureIdx];
    starsPerTier[fig.tier] = Math.min(3, (starsPerTier[fig.tier] || 0) + 1);

    const tierFigs = figuresForTier(currentTier);
    const posInTier = tierFigs.findIndex(f => f.idx === currentFigureIdx);
    G.notePip(posInTier, 1, document.getElementById('target-svg'));

    setTimeout(() => {
      if (posInTier < tierFigs.length - 1) {
        loadFigure(tierFigs[posInTier + 1].idx);
      } else {
        showEndScreen();
      }
    }, 1400);
  }

  function showEndScreen() {
    G.showEnd({ replayUrl: 'mj-40.html' });
  }

  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTier = parseInt(btn.dataset.tier, 10);
      G.buildPips();
      loadFigure(figuresForTier(currentTier)[0].idx);
    });
  });

  // ============================================================
  // Hook de test headless (Playwright) — expose l'état + une fonction pour
  // placer une pièce directement à sa position solution (chemin gagnant
  // scripté), sans dépendre du drag pointer réel.
  // ============================================================
  window.__mjTest = {
    get state() {
      return {
        currentFigureIdx,
        currentTier,
        placedCount,
        totalPieces: PIECE_NAMES.length,
        starsPerTier: { ...starsPerTier },
        pieceNames: PIECE_NAMES.slice(),
        piecesState: JSON.parse(JSON.stringify(piecesState)),
      };
    },
    place(name) {
      if (!PIECE_NAMES.includes(name)) return false;
      const s = piecesState[name];
      if (s.locked) return true;
      const trayEl = getPieceEl(name);
      if (trayEl && trayEl.closest('svg') === traySvg) {
        trayEl.remove();
        drawPieceInTarget(name, 1);
      }
      const fig = FIGURES[currentFigureIdx];
      const target = fig.sol[name];
      s.tx = target.tx; s.ty = target.ty; s.rot = target.rot; s.flip = target.flip; s.locked = true;
      updatePieceTransform(name);
      const p = getPieceEl(name);
      if (p) { p.classList.add('locked'); p.setAttribute('stroke', '#ffe066'); p.setAttribute('stroke-width', '0.12'); }
      placedCount++;
      if (placedCount >= PIECE_NAMES.length) onFigureComplete();
      return true;
    },
    placeAll() {
      for (const name of PIECE_NAMES) this.place(name);
    },
    goToTier(tier) {
      currentTier = tier;
      G.buildPips();
      loadFigure(figuresForTier(tier)[0].idx);
    },
  };

  // Démarrage
  G.buildPips();
  loadFigure(figuresForTier(1)[0].idx);
});
</script>
</body>
</html>
