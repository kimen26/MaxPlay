<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ-44 — La boîte à sons</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* --- GABARIT HEADER CANONIQUE (ne pas inventer, copier tel quel) --- */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; color:var(--ink); display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }
    .htitle { flex:1; font-size:1rem; font-weight:900; }
    /* --- FIN GABARIT HEADER --- */

    .stars { text-align:center; padding:3px 8px; font-size:1.1rem; flex-shrink:0; }
    .star { opacity:0.32; transition:opacity 0.25s, transform 0.25s; display:inline-block; }
    .star.on { opacity:1; transform:scale(1.18); }

    .banner {
      text-align:center; font-size:0.98rem; font-weight:900; padding:4px 12px;
      color:#fefefe; text-shadow:0 1px 3px rgba(0,0,0,0.45); flex-shrink:0; min-height:1.4em;
    }

    .stage {
      flex:1; position:relative; display:flex; flex-direction:column;
      align-items:center; justify-content:space-between; overflow:hidden;
      padding:6px 8px 10px;
    }

    /* ── Boîtes-sons ──────────────────────────────────────────── */
    .boxes { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; padding-top:4px; }
    .sbox {
      position:relative; border-radius:16px; border:4px solid rgba(255,255,255,0.85);
      width:150px; min-height:158px; padding:8px 6px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      box-shadow:0 5px 0 rgba(0,0,0,0.28); transition:transform 0.1s;
    }
    .sbox.c0 { background:linear-gradient(160deg,#43c07a,#2f9d5f); }
    .sbox.c1 { background:linear-gradient(160deg,#4f97e6,#2f6fc0); }
    .sbox.c2 { background:linear-gradient(160deg,#eea24f,#d67f2f); }
    .sbox.wiggle { animation:wiggle 0.32s ease; }
    @keyframes wiggle { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
    .sbox.pop { animation:boxPop 0.32s ease; }
    @keyframes boxPop { 40% { transform:scale(1.07); } }
    .sbox-star {
      position:absolute; top:-16px; right:-10px; font-size:1.9rem;
      text-shadow:0 2px 4px rgba(0,0,0,0.35); animation:starPop 0.45s ease;
    }
    @keyframes starPop { 0% { transform:scale(0.2); opacity:0; } 70% { transform:scale(1.25); } 100% { transform:scale(1); opacity:1; } }
    .fly-clone { position:fixed; margin:0; z-index:80; pointer-events:none;
                 transition:transform 0.28s cubic-bezier(.45,-0.15,.55,1.15), opacity 0.28s; }
    .sbox-son {
      background:#fff; color:#222; border-radius:12px; min-width:60px; height:56px;
      display:flex; align-items:center; justify-content:center; font-size:2.2rem; font-weight:900;
      padding:0 10px;
    }
    .sbox-son small { font-size:0.9rem; margin-left:2px; opacity:0.6; }
    .sbox-slots { flex:1; display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-content:flex-start; width:100%; min-height:40px; }

    /* ── Cartes-mots ──────────────────────────────────────────── */
    .tray-wrap { width:100%; }
    .tray-label { text-align:center; font-size:0.78rem; color:#e7ecff; opacity:0.9; margin-bottom:3px; }
    .tray { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:flex-end;
            background:rgba(0,0,0,0.18); border-top:4px solid rgba(255,255,255,0.15); border-radius:12px;
            padding:10px 8px; min-height:120px; width:100%; }

    .card {
      background:#fffdf7; border:3px solid #26305a; border-radius:14px;
      width:96px; padding:6px 4px 4px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:2px;
      box-shadow:0 3px 0 rgba(0,0,0,0.25); transition:transform 0.1s, box-shadow 0.1s;
    }
    .card:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }
    .card.sel { transform:translateY(-10px) scale(1.05); outline:4px solid #ffe27a; box-shadow:0 10px 0 rgba(0,0,0,0.25); }
    .card svg { display:block; }
    .card-mot { color:#26305a; font-size:1.15rem; font-weight:900; letter-spacing:0.5px; }

    /* chip mini dans la boîte */
    .chip { background:#fffdf7; border:2px solid #26305a; border-radius:9px; padding:2px 6px 1px;
            display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .chip .card-mot { font-size:0.72rem; }

    /* ── Overlay ──────────────────────────────────────────────── */
    #overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none;
               align-items:center; justify-content:center; z-index:50; flex-direction:column;
               gap:14px; text-align:center; padding:20px; }
    #overlay.show { display:flex; }
    #overlay h2 { font-size:1.6rem; text-shadow:0 2px 6px rgba(0,0,0,0.5); }
    #overlay p { font-size:1.05rem; color:#fff8e0; }
    #replay-btn { font-family:'Fredoka One',sans-serif; font-size:1.1rem; font-weight:900;
                  background:var(--gold); color:var(--gold-ink); border:none; border-radius:16px;
                  padding:16px 30px; min-height:80px; min-width:200px; cursor:pointer;
                  box-shadow:0 6px 0 #2f6fc0; }
    #replay-btn:active { transform:translateY(4px); box-shadow:0 2px 0 #2f6fc0; }
  </style>
</head>
<body data-ambiance="nuit">
<div id="app">

  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🔤 La boîte à sons</span>
  </div>

  <div class="stars" id="stars">
    <span class="star" data-s="1">⭐</span>
    <span class="star" data-s="2">⭐</span>
    <span class="star" data-s="3">⭐</span>
  </div>

  <div class="banner" id="banner">Range chaque mot dans la boîte du bon son !</div>

  <div class="stage">
    <div class="boxes" id="boxes"></div>
    <div class="tray-wrap">
      <div class="tray-label">👉 Tape un mot (il se lit), puis tape sa boîte</div>
      <div class="tray" id="tray"></div>
    </div>
  </div>

  <div id="overlay">
    <h2 id="overlay-title">🎉 Bravo Max ! 🎉</h2>
    <p id="overlay-text">Tu as trouvé tous les sons !</p>
    <button id="replay-btn">Encore ! 🔄</button>
  </div>

</div>
  <script src="js/bus-svg.js"></script>
  <script src="js/data.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
  MJ.ready(function(){
    'use strict';

    MJ.init({
      id: 'mj-44', emoji: '🔤', titre: 'La boîte à sons',
      golden: false,
      consigne: false,
      regle: {
        picto: '🔤➡️📦',
        texte: 'Tape un mot pour l’entendre, puis range-le dans la boîte qui a le bon son !',
        etapes: [
          { t: 'Je tape un mot pour l’écouter 👂',
            d: 'Une voix dit le mot en entier : « tomate », « lune »… J’écoute bien le début.' },
          { t: 'Je regarde et j’écoute les boîtes 📦',
            d: 'Chaque boîte a son propre son : « te », « me »… Je tape une boîte pour l’entendre.' },
          { t: 'Je range le mot dans la bonne boîte 👆',
            d: 'Si je me trompe, la boîte dit non tout doucement et le mot reste dans mes mains.' },
          { t: 'Plus j’ai d’étoiles, plus mon oreille doit être fine 💪',
            d: 'D’abord le début du mot, puis des sons qui se ressemblent (l/r), puis le son caché au milieu du mot.' }
        ]
      }
    });

    // ── Pictos SVG (flat cartoon, viewBox 0 0 100 100) ─────────────────────
    // Auto-suffisants (pas d'emoji, pas de CDN) → rendu stable + test local OK.
    const PICTOS = {
      table: `<rect x="16" y="40" width="68" height="13" rx="3" fill="#b5793e"/>
              <rect x="22" y="53" width="10" height="33" fill="#8a5a2b"/>
              <rect x="68" y="53" width="10" height="33" fill="#8a5a2b"/>`,
      tomate:`<circle cx="50" cy="60" r="28" fill="#e0392b"/>
              <ellipse cx="50" cy="58" rx="10" ry="7" fill="#f06a5e" opacity="0.5"/>
              <path d="M50 33 L42 24 M50 33 L58 24 M50 33 L50 22" stroke="#3aa66b" stroke-width="5" stroke-linecap="round"/>
              <circle cx="50" cy="34" r="6" fill="#3aa66b"/>`,
      tortue:`<ellipse cx="48" cy="58" rx="30" ry="20" fill="#4a9d5b"/>
              <path d="M30 52 q18 -12 36 0" stroke="#357a44" stroke-width="3" fill="none"/>
              <ellipse cx="82" cy="54" rx="10" ry="8" fill="#6bbf72"/>
              <circle cx="85" cy="52" r="2" fill="#222"/>
              <ellipse cx="30" cy="76" rx="7" ry="5" fill="#6bbf72"/>
              <ellipse cx="66" cy="76" rx="7" ry="5" fill="#6bbf72"/>`,
      maison:`<rect x="26" y="46" width="48" height="38" fill="#e8b45a"/>
              <path d="M18 48 L50 22 L82 48 Z" fill="#c0392b"/>
              <rect x="43" y="60" width="15" height="24" rx="1" fill="#7a4a1e"/>`,
      moto:  `<circle cx="30" cy="64" r="14" fill="#2f2f2f"/><circle cx="30" cy="64" r="5" fill="#888"/>
              <circle cx="72" cy="64" r="14" fill="#2f2f2f"/><circle cx="72" cy="64" r="5" fill="#888"/>
              <path d="M30 64 L52 64 L60 50 L72 64" stroke="#e0392b" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="56" y="44" width="18" height="6" rx="3" fill="#333"/>`,
      mouton:`<circle cx="42" cy="52" r="13" fill="#f4f4f4"/><circle cx="56" cy="50" r="13" fill="#f4f4f4"/>
              <circle cx="50" cy="62" r="14" fill="#f4f4f4"/><circle cx="64" cy="60" r="11" fill="#f4f4f4"/>
              <ellipse cx="70" cy="54" rx="9" ry="8" fill="#3a3a3a"/>
              <circle cx="73" cy="52" r="2" fill="#fff"/>
              <rect x="46" y="72" width="5" height="12" fill="#3a3a3a"/><rect x="60" y="72" width="5" height="12" fill="#3a3a3a"/>`,
      lune:  `<path d="M62 20 A34 34 0 1 0 62 82 A26 26 0 1 1 62 20 Z" fill="#f7d64a"/>
              <circle cx="41" cy="44" r="3" fill="#8a6d1f"/>
              <path d="M36 60 q6 6 12 2" stroke="#8a6d1f" stroke-width="3" fill="none" stroke-linecap="round"/>
              <circle cx="50" cy="30" r="3.5" fill="#e3c344"/><circle cx="44" cy="74" r="4" fill="#e3c344"/>`,
      loup:  `<path d="M28 40 L22 22 L40 34 Z" fill="#7d8794"/><path d="M72 40 L78 22 L60 34 Z" fill="#7d8794"/>
              <path d="M30 40 Q50 30 70 40 Q74 62 50 78 Q26 62 30 40 Z" fill="#9aa4b0"/>
              <circle cx="41" cy="52" r="3.5" fill="#222"/><circle cx="59" cy="52" r="3.5" fill="#222"/>
              <path d="M50 60 L45 66 L55 66 Z" fill="#4a4a4a"/>`,
      lit:   `<rect x="16" y="52" width="68" height="20" rx="3" fill="#c76b8e"/>
              <rect x="16" y="44" width="16" height="28" rx="3" fill="#9c4e6c"/>
              <rect x="34" y="46" width="30" height="10" rx="4" fill="#fff"/>
              <rect x="12" y="70" width="8" height="14" fill="#7a3d55"/><rect x="80" y="70" width="8" height="14" fill="#7a3d55"/>`,
      roue:  `<circle cx="50" cy="56" r="30" fill="#2f2f2f"/><circle cx="50" cy="56" r="19" fill="#c9c9c9"/>
              <circle cx="50" cy="56" r="7" fill="#555"/>
              <path d="M50 40 V72 M34 56 H66 M39 45 L61 67 M61 45 L39 67" stroke="#7a7a7a" stroke-width="4"/>`,
      robot: `<rect x="28" y="34" width="44" height="42" rx="8" fill="#9aa4b0"/>
              <rect x="46" y="20" width="8" height="12" fill="#7d8794"/><circle cx="50" cy="18" r="5" fill="#e0392b"/>
              <circle cx="41" cy="50" r="6" fill="#2b6fc0"/><circle cx="59" cy="50" r="6" fill="#2b6fc0"/>
              <rect x="40" y="62" width="20" height="6" rx="2" fill="#3a3a3a"/>`,
      rat:   `<ellipse cx="42" cy="62" rx="24" ry="15" fill="#9a9a9a"/>
              <path d="M58 50 L86 58 L60 68 Z" fill="#9a9a9a"/>
              <circle cx="85" cy="58" r="3" fill="#e087a8"/>
              <circle cx="58" cy="42" r="7" fill="#b8b8b8"/><circle cx="58" cy="42" r="3.5" fill="#e0a8c0"/>
              <circle cx="66" cy="55" r="2.5" fill="#222"/>
              <path d="M18 64 Q2 62 8 80" stroke="#e087a8" stroke-width="4" fill="none" stroke-linecap="round"/>`,
      hibou: `<ellipse cx="50" cy="56" rx="26" ry="30" fill="#8a5a34"/>
              <path d="M30 34 L26 22 L40 32 Z" fill="#6f4626"/><path d="M70 34 L74 22 L60 32 Z" fill="#6f4626"/>
              <circle cx="40" cy="50" r="11" fill="#fff"/><circle cx="60" cy="50" r="11" fill="#fff"/>
              <circle cx="40" cy="50" r="5" fill="#222"/><circle cx="60" cy="50" r="5" fill="#222"/>
              <path d="M50 58 L44 64 L56 64 Z" fill="#e8a24a"/>`,
      chat:  `<path d="M30 40 L24 24 L42 34 Z" fill="#e8944a"/><path d="M70 40 L76 24 L58 34 Z" fill="#e8944a"/>
              <ellipse cx="50" cy="56" rx="26" ry="24" fill="#f2a85e"/>
              <circle cx="41" cy="54" r="4" fill="#222"/><circle cx="59" cy="54" r="4" fill="#222"/>
              <path d="M50 62 l-4 4 M50 62 l4 4" stroke="#7a4a1e" stroke-width="3" stroke-linecap="round"/>
              <path d="M22 58 H38 M22 66 H38 M62 58 H78 M62 66 H78" stroke="#c97a3a" stroke-width="2.5"/>`,
      sac:   `<path d="M30 46 h40 l4 38 h-48 Z" fill="#c0392b"/>
              <path d="M38 46 a12 12 0 0 1 24 0" stroke="#7a2318" stroke-width="5" fill="none"/>
              <rect x="44" y="60" width="12" height="10" rx="2" fill="#fff" opacity="0.8"/>`,
      tasse: `<path d="M24 40 h40 v22 a14 14 0 0 1 -14 14 h-12 a14 14 0 0 1 -14 -14 Z" fill="#4f97e6"/>
              <path d="M64 46 h8 a8 8 0 0 1 0 16 h-8" stroke="#2f6fc0" stroke-width="5" fill="none"/>
              <path d="M34 32 q4 -8 0 -12 M50 32 q4 -8 0 -12" stroke="#9aa4b0" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      main:  `<rect x="33" y="46" width="35" height="35" rx="13" fill="#f2c29e"/>
              <rect x="33" y="27" width="8" height="26" rx="4" fill="#f2c29e"/>
              <rect x="42" y="20" width="8" height="33" rx="4" fill="#f2c29e"/>
              <rect x="51" y="22" width="8" height="31" rx="4" fill="#f2c29e"/>
              <rect x="60" y="28" width="8" height="25" rx="4" fill="#f2c29e"/>
              <rect x="21" y="52" width="16" height="9" rx="4.5" fill="#f2c29e" transform="rotate(-32 29 56)"/>`,
      livre: `<path d="M50 32 Q32 24 18 29 V71 Q32 66 50 73 Z" fill="#fdf6e3" stroke="#8a5a34" stroke-width="3"/>
              <path d="M50 32 Q68 24 82 29 V71 Q68 66 50 73 Z" fill="#fff" stroke="#8a5a34" stroke-width="3"/>
              <path d="M26 41 q11 -4 17 0 M26 51 q11 -4 17 0 M57 41 q11 -4 17 0 M57 51 q11 -4 17 0" stroke="#b8b8b8" stroke-width="2.5" fill="none"/>`,
      robe:  `<rect x="41" y="18" width="6" height="12" fill="#c76b8e"/><rect x="53" y="18" width="6" height="12" fill="#c76b8e"/>
              <path d="M39 28 h22 l3 16 h-28 Z" fill="#e087a8"/>
              <path d="M36 44 h28 l11 38 H25 Z" fill="#c76b8e"/>`,
      bouche:`<path d="M20 54 Q35 38 50 50 Q65 38 80 54 Q65 74 50 71 Q35 74 20 54 Z" fill="#e0392b"/>
              <path d="M20 54 Q50 59 80 54" stroke="#7a1f16" stroke-width="3" fill="none"/>`,
      banane:`<path d="M26 28 Q18 66 56 78 Q78 84 86 66 Q80 74 58 68 Q30 58 34 28 Z" fill="#f7d64a" stroke="#c9a63a" stroke-width="2.5"/>
              <rect x="24" y="24" width="9" height="9" rx="2" fill="#8a5a34"/>`,
    };

    function pictoSVG(id, px) {
      const inner = PICTOS[id] || '';
      return `<svg width="${px}" height="${px}" viewBox="0 0 100 100">${inner}</svg>`;
    }

    // ── Vocabulaire ─────────────────────────────────────────────────────────
    const MOTS = {
      table:{mot:'table',picto:'table'}, tomate:{mot:'tomate',picto:'tomate'}, tortue:{mot:'tortue',picto:'tortue'},
      tasse:{mot:'tasse',picto:'tasse'},
      maison:{mot:'maison',picto:'maison'}, moto:{mot:'moto',picto:'moto'}, mouton:{mot:'mouton',picto:'mouton'},
      main:{mot:'main',picto:'main'},
      lune:{mot:'lune',picto:'lune'}, loup:{mot:'loup',picto:'loup'}, lit:{mot:'lit',picto:'lit'},
      livre:{mot:'livre',picto:'livre'},
      roue:{mot:'roue',picto:'roue'}, robot:{mot:'robot',picto:'robot'}, rat:{mot:'rat',picto:'rat'},
      robe:{mot:'robe',picto:'robe'},
      hibou:{mot:'hibou',picto:'hibou'}, chat:{mot:'chat',picto:'chat'}, sac:{mot:'sac',picto:'sac'},
      bouche:{mot:'bouche',picto:'bouche'}, banane:{mot:'banane',picto:'banane'},
    };

    // ── Paliers (3 étoiles) : initial → initial proche → voyelle interne ─────
    // ★3 : hideWord — le mot écrit est masqué pour forcer l'ÉCOUTE (sinon Max,
    // lecteur alphabétique partiel, trie par la lettre initiale visuelle —
    // piège réel : « roue » et « rat » commencent tous deux par r).
    const PALIERS = [
      { stars:1, need:2, pick:2, banner:"Écoute le PREMIER son du mot !", slug:'ecoute-le-premier-son',
        boxes:[ {id:'t', label:'t', son:'te'}, {id:'m', label:'m', son:'me'} ],
        words:{ t:['table','tomate','tortue','tasse'], m:['maison','moto','mouton','main'] } },
      { stars:2, need:2, pick:2, banner:"Premier son : « l » ou « r » ?", slug:'premier-son-l-ou-r',
        boxes:[ {id:'l', label:'l', son:'le'}, {id:'r', label:'r', son:'re'} ],
        words:{ l:['lune','loup','lit','livre'], r:['roue','robot','rat','robe'] } },
      { stars:3, need:2, pick:3, hideWord:true, banner:'Le son qu’on ENTEND : « ou » ou « a » ?', slug:'le-son-quon-entend',
        boxes:[ {id:'ou', label:'ou', son:'ou'}, {id:'a', label:'a', son:'a'} ],
        words:{ ou:['loup','roue','hibou','bouche'], a:['chat','rat','sac','banane'] } },
    ];

    let paletteIdx = 0, roundsDone = 0;
    // cards[]: {id, mot, picto, boxId, loc:'tray'|<boxIdx>}
    // boxes[]: {id, label, son}
    let cards = [], boxes = [], selected = null, roundOver = false, testMode = false;
    let nextId = 0;

    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function samplePick(arr, n){ return shuffle(arr.slice()).slice(0, n); }

    function genRound() {
      const cfg = PALIERS[paletteIdx];
      boxes = cfg.boxes.map(b => ({ ...b }));
      cards = [];
      selected = null; roundOver = false;
      boxes.forEach(b => {
        samplePick(cfg.words[b.id], cfg.pick).forEach(key => {
          const m = MOTS[key];
          cards.push({ id: nextId++, mot: m.mot, picto: m.picto, boxId: b.id, loc:'tray' });
        });
      });
      shuffle(cards);
      const bEl = document.getElementById('banner');
      if (bEl.textContent !== cfg.banner) {
        bEl.textContent = cfg.banner;
        // Consigne parlée au changement de palier seulement (anti-répétition)
        if (cfg.slug && window.SoundPool) SoundPool.phrase(cfg.slug, cfg.banner);
      }
      render();
    }

    // ── Rendu ────────────────────────────────────────────────────────────────
    const boxesEl = document.getElementById('boxes');
    const trayEl = document.getElementById('tray');

    function render() {
      // ★3 : mot écrit masqué → seul le canal auditif permet de trier (anti-triche
      // par lettre initiale visuelle). Le tap sur la carte lit toujours le mot.
      const hideWord = !!PALIERS[paletteIdx].hideWord;

      boxesEl.innerHTML = '';
      boxes.forEach((b, bi) => {
        const div = document.createElement('div');
        div.className = 'sbox c' + (bi % 3);
        div.dataset.bid = bi;

        const son = document.createElement('div');
        son.className = 'sbox-son';
        son.textContent = b.label;
        div.appendChild(son);

        const slots = document.createElement('div');
        slots.className = 'sbox-slots';
        const mine = cards.filter(c => c.boxId === b.id);
        mine.filter(c => c.loc === bi).forEach(c => {
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.dataset.cid = c.id;
          chip.innerHTML = pictoSVG(c.picto, 30) + (hideWord ? '' : `<span class="card-mot">${c.mot}</span>`);
          chip.addEventListener('click', (e) => { e.stopPropagation(); returnToTray(c.id); });
          slots.appendChild(chip);
        });
        div.appendChild(slots);

        // Boîte complète (tous ses mots rangés) → étoile qui pop sur la boîte
        if (mine.length > 0 && mine.every(c => c.loc === bi)) {
          const st = document.createElement('div');
          st.className = 'sbox-star';
          st.textContent = '⭐';
          div.appendChild(st);
        }

        div.addEventListener('click', () => onBoxClick(bi));
        boxesEl.appendChild(div);
      });

      trayEl.innerHTML = '';
      cards.filter(c => c.loc === 'tray').forEach(c => {
        const card = document.createElement('div');
        card.className = 'card' + (selected === c.id ? ' sel' : '');
        card.dataset.cid = c.id;
        card.innerHTML = pictoSVG(c.picto, 62) + (hideWord ? '' : `<span class="card-mot">${c.mot}</span>`);
        card.addEventListener('click', () => onCardClick(c.id));
        trayEl.appendChild(card);
      });
    }

    // ── Interaction ───────────────────────────────────────────────────────────
    function onCardClick(id) {
      if (roundOver) return;
      const c = cards.find(x => x.id === id);
      if (!c) return;
      selected = (selected === id) ? null : id;
      speak(c.mot);
      render();
    }

    // ── Son des boîtes : MP3 ElevenLabs (voie par défaut), fallback TTS ─────
    // Le TTS navigateur rend « te/me/le/re » de façon imprévisible selon la voix
    // installée (« té », « teu »…) — les MP3 gravent le phonème exact.
    const PHONEME_SRC = { t:'son-te', m:'son-me', l:'son-le', r:'son-re', ou:'son-ou', a:'son-a' };
    const _audioCache = {};
    function playSon(box) {
      if (testMode) return;
      const key = PHONEME_SRC[box.id];
      if (key) {
        try {
          const a = _audioCache[key] || (_audioCache[key] = new Audio('sounds/phonemes/' + key + '.mp3'));
          a.currentTime = 0;
          a.play().catch(() => speak(box.son)); // 404 / autoplay bloqué → TTS
          return;
        } catch(e) {}
      }
      speak(box.son);
    }

    // ── Vol animé de la carte vers la boîte (causalité physique, 4 ans) ─────
    function flyCard(cid, bi, done) {
      const cardEl = trayEl.querySelector(`.card[data-cid="${cid}"]`);
      const boxEl = boxesEl.querySelector(`.sbox[data-bid="${bi}"]`);
      if (!cardEl || !boxEl || testMode) { done(); return; }
      const a = cardEl.getBoundingClientRect(), b = boxEl.getBoundingClientRect();
      const clone = cardEl.cloneNode(true);
      clone.classList.remove('sel');
      clone.classList.add('fly-clone');
      clone.style.left = a.left + 'px';
      clone.style.top = a.top + 'px';
      clone.style.width = a.width + 'px';
      document.body.appendChild(clone);
      cardEl.style.visibility = 'hidden';
      const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
      const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
      requestAnimationFrame(() => {
        clone.style.transform = `translate(${dx}px,${dy}px) scale(0.35)`;
        clone.style.opacity = '0.4';
      });
      setTimeout(() => { clone.remove(); done(); }, 300);
    }

    function popBox(bi) {
      const el = boxesEl.querySelector(`.sbox[data-bid="${bi}"]`);
      if (!el) return;
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 340);
    }

    function onBoxClick(bi) {
      if (roundOver) return;
      const box = boxes[bi];
      // Tap boîte sans sélection = exploration : on dit juste le son.
      if (selected === null) { playSon(box); return; }
      const c = cards.find(x => x.id === selected);
      if (!c || c.loc !== 'tray') { playSon(box); return; }

      playSon(box);
      if (c.boxId === box.id) {
        selected = null;
        flyCard(c.id, bi, () => {
          c.loc = bi;
          try { sndDing(); } catch(e) {}
          render();
          popBox(bi);
          checkRoundComplete();
        });
      } else {
        try { sndBuzz(); } catch(e) {}
        wiggleBox(bi);
      }
    }

    function returnToTray(id) {
      if (roundOver) return;
      const c = cards.find(x => x.id === id);
      if (!c || c.loc === 'tray') return;
      c.loc = 'tray';
      render();
    }

    function wiggleBox(bi) {
      const el = boxesEl.querySelector(`.sbox[data-bid="${bi}"]`);
      if (!el) return;
      el.classList.add('wiggle');
      setTimeout(() => el.classList.remove('wiggle'), 340);
    }

    function speak(txt) {
      if (testMode) return;
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'fr-FR'; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch(e) {}
    }

    // ── Fin de round / progression ─────────────────────────────────────────────
    function checkRoundComplete() {
      if (!cards.every(c => c.loc !== 'tray')) return;
      roundOver = true;
      try { sndVictory(); } catch(e) {}
      roundsDone++;
      if (roundsDone >= PALIERS[paletteIdx].need) {
        try { Tracker.endSession(1, 1); } catch(e) {}
        refreshStars(paletteIdx + 1);
        if (paletteIdx >= PALIERS.length - 1) { showOverlay(); return; }
        paletteIdx++; roundsDone = 0;
        try { Tracker.startSession('mj-44'); } catch(e) {}
        setTimeout(() => { if (!testMode) genRound(); }, 900);
      } else {
        setTimeout(() => { if (!testMode) genRound(); }, 900);
      }
    }

    function showOverlay() {
      document.getElementById('overlay-title').textContent = '🎉 Bravo Max ! 🎉';
      document.getElementById('overlay-text').textContent = 'Tu as rangé tous les mots. Quelle oreille !';
      document.getElementById('overlay').classList.add('show');
    }

    document.getElementById('replay-btn').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('show');
      startAll();
    });

    function refreshStars(n) {
      document.querySelectorAll('.star').forEach(s => s.classList.toggle('on', parseInt(s.dataset.s,10) <= n));
    }

    function startAll() {
      paletteIdx = 0; roundsDone = 0;
      refreshStars(0);
      try { Tracker.startSession('mj-44'); } catch(e) {}
      genRound();
    }

    startAll();

    // ── Harnais de test (Playwright) ────────────────────────────────────────────
    window.__mjTest = {
      get state() {
        return {
          paletteIdx, roundsDone, roundOver,
          boxes: boxes.map(b => ({ id:b.id, label:b.label })),
          cards: cards.map(c => ({ id:c.id, mot:c.mot, boxId:c.boxId, loc:c.loc })),
          trayCount: cards.filter(c => c.loc === 'tray').length,
          selected,
          hideWord: !!PALIERS[paletteIdx].hideWord,
          overlayShown: document.getElementById('overlay').classList.contains('show'),
          bannerText: document.getElementById('banner').textContent,
        };
      },
      phonemes: PHONEME_SRC,
      setTestMode(on){ testMode = !!on; },
      setDifficulty(stars){ paletteIdx = Math.max(0, Math.min(stars-1, PALIERS.length-1)); roundsDone = 0; genRound(); },
      newRound(){ genRound(); },
      boxIndexOf(id){ return boxes.findIndex(b => b.id === id); },
      select(id){ onCardClick(id); },
      place(id, bi){ selected = id; onBoxClick(bi); },
      remove(id){ returnToTray(id); },
      // Range chaque carte dans SA bonne boîte → complète le round.
      solveRound(){
        for (const c of cards.slice()) {
          if (c.loc === 'tray') { selected = c.id; onBoxClick(boxes.findIndex(b => b.id === c.boxId)); }
        }
      },
      replay(){ document.getElementById('replay-btn').click(); },
    };
  });
  </script>
</body>
</html>
