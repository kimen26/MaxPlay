<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-46 – Les œufs surprises</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    /* ─── Scène nid (fond sombre, thème nuit) ─── */
    .egg-scene {
      position: relative;
      margin: 4px 12px 8px;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(320px 150px at 82% 12%, rgba(255,120,60,.18), transparent 65%),
        linear-gradient(180deg, #241430 0%, #2e1a33 45%, #1c2b1a 80%, #12200f 100%);
      min-height: clamp(220px, 42vmin, 320px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .deco { position: absolute; pointer-events: none; }
    .deco.volcano { top: 6px; right: -18px; width: clamp(110px, 24vmin, 170px); opacity: .85; }
    .deco.fern { bottom: -4px; width: clamp(70px, 14vmin, 110px); opacity: .9; }
    .deco.fern.left { left: -14px; }
    .deco.fern.right { right: -14px; transform: scaleX(-1); }

    .nest {
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      width: 86%; max-width: 460px; height: 64px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 30%, #8a5a2b 0%, #6b421e 55%, #4a2c12 100%);
      box-shadow: 0 10px 24px rgba(0,0,0,.5), inset 0 8px 14px rgba(0,0,0,.45);
    }
    .nest::after {
      content: ''; position: absolute; inset: 8px 20px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #3c240e 0%, #59371a 70%, transparent 100%);
    }

    /* ─── Œufs tapotables (CSS pur, jamais d'emoji — design repris de design-compte/mockup-1) ─── */
    .eggs {
      position: absolute; inset: 6px 6px 20px; z-index: 3;
    }
    .slot {
      position: absolute;
      width: var(--egg, 60px); height: calc(var(--egg, 60px) * 1.55);
      display: flex; align-items: flex-end; justify-content: center;
      cursor: pointer; touch-action: manipulation;
      animation: eggPop .35s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes eggPop { from { transform: scale(0) translateY(12px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    .egg {
      position: relative;
      width: var(--egg, 60px); height: calc(var(--egg, 60px) * 1.28);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background:
        radial-gradient(circle at 30% 30%, rgba(176,116,52,.55) 0 7px, transparent 8px),
        radial-gradient(circle at 66% 52%, rgba(176,116,52,.45) 0 5px, transparent 6px),
        radial-gradient(circle at 44% 74%, rgba(176,116,52,.4) 0 6px, transparent 7px),
        radial-gradient(circle at 70% 82%, rgba(176,116,52,.35) 0 4px, transparent 5px),
        linear-gradient(160deg, #fff5da 0%, #f3d9a4 70%, #e6c282 100%);
      box-shadow: inset -6px -9px 14px rgba(120,70,20,.28), 0 6px 10px rgba(0,0,0,.35);
      transition: filter .12s;
    }
    .slot.hl .egg { filter: brightness(1.2); animation: eggBounce .4s ease; }
    @keyframes eggBounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
    .egg.shake { animation: eggShake .38s ease-in-out; }
    @keyframes eggShake {
      0%,100% { transform: rotate(0); } 20% { transform: rotate(-10deg) translateX(-3px); }
      45% { transform: rotate(9deg) translateX(3px); } 70% { transform: rotate(-7deg) translateX(-2px); } 88% { transform: rotate(5deg); }
    }
    /* Fissure légère quand l'œuf a été compté (tap) — consigne PY */
    .egg.cracked::after {
      content: ''; position: absolute; left: 14%; right: 14%; top: 30%; height: 24%;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 40'><path d='M2 18 L20 8 L36 26 L52 10 L68 28 L84 12 L98 22' fill='none' stroke='%237a4a1e' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat;
      opacity: .75; pointer-events: none;
    }

    /* Pastille jaune numérotée (POC-02) — posée sur l'œuf au tap */
    .pastille {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      min-width: 30px; height: 30px; padding: 0 6px;
      border-radius: 999px; background: #ffe066; color: #4a3005;
      border: 2px solid #fff; box-shadow: 0 3px 6px rgba(0,0,0,.4);
      font-family: 'Fredoka One', sans-serif; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      z-index: 4; pointer-events: none;
      animation: pastillePop .25s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes pastillePop { from { transform: translateX(-50%) scale(0); } to { transform: translateX(-50%) scale(1); } }

    /* Bébé dino qui surgit de l'œuf (éclosion) */
    .baby {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: calc(var(--egg, 60px) * 1.15); display: none;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.45));
      z-index: 3; pointer-events: none;
    }
    .baby.pop { display: block; animation: babyPop .5s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes babyPop { 0% { transform: translateX(-50%) scale(0) translateY(20px); } 70% { transform: translateX(-50%) scale(1.15) translateY(-6px); } 100% { transform: translateX(-50%) scale(1) translateY(0); } }

    /* Indice de méthode (aide, jamais la réponse) */
    .hint { text-align: center; font-weight: 800; color: var(--gold, #ffe066); font-size: 0.95rem; min-height: 1.3em; opacity: 0; transition: opacity .2s; padding: 2px 12px 0; }
    .hint.show { opacity: 1; }

    /* Gros boutons chiffres ≥ 92px (3 options, distracteurs proches) */
    .choices.qcm46 { display: flex; justify-content: center; gap: 14px; padding: 8px 12px 14px; min-height: 118px; }
    .choices.qcm46.hidden { visibility: hidden; }
    .choices.qcm46.pulse { animation: choicesPulse .6s ease; }
    @keyframes choicesPulse { 0%,100% { filter: none; } 50% { filter: brightness(1.35) drop-shadow(0 0 14px rgba(255,224,102,.6)); } }
    .choices.qcm46 .ch {
      min-width: 92px; min-height: 92px; font-size: 2rem;
      font-family: 'Fredoka One', sans-serif; border-radius: 22px;
    }
  </style>
</head>
<body data-ambiance="nuit">
  <div id="app">
    <div class="hdr">
      <a href="index.html" class="back">←</a>
      <span class="htitle">🥚 Les œufs surprises</span>
    </div>
    <div class="pips" id="pips"></div>

    <!-- Scène : nid + œufs tapotables sur fond sombre -->
    <div class="egg-scene" id="scene">
      <img class="deco volcano" src="img/decor/volcan_fumant.png" alt="">
      <img class="deco fern left" src="img/decor/fougere.png" alt="">
      <img class="deco fern right" src="img/decor/fougere.png" alt="">
      <div class="nest"></div>
      <div class="eggs" id="eggs"></div>
    </div>

    <div class="hint" id="hint"></div>
    <div class="choices qcm46 hidden" id="choices"></div>
  </div>

  <!-- moteur commun "Compte les …" (tirage palier + distracteurs proches + retry) -->
  <script src="js/avatars.js"></script>
  <script src="js/mj-compte.js"></script>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
    MJ.ready(function () {
    // ─── MJ-46 : Les œufs surprises — peau « œufs » du moteur mj-compte (spec S1) ───
    // QCM visible dès le début (réponse directe) ; le tap sur les œufs est une AIDE :
    // pastille jaune numérotée + fissure (correspondance un-à-un). Retour PY 2026-07-20.
    // Réussite : les œufs éclosent → bébés dinos (img/dinos/sprites/*_tete.png).
    const GAME_ID = 'mj-46';

    // Paliers spec S1 + retour PY 2026-07-20 (« plus que 2-3, direct 5-7 mini jusqu'à 20-22 »)
    const LEVELS = [
      { min: 2, max: 5  },  // N0 : 2→5 œufs
      { min: 5, max: 15 },  // N1 : 5→15
      { min: 7, max: 22 },  // N2 : 7→22
    ];

    // Bébés dinos qui éclosent = AVATARS low-poly (décision PY 2026-07-21 :
    // jamais de sprite réaliste dans une scène de jeu). Pool = créatures du
    // manifeste avatars.js, sans les éléments (volcan, lave, œuf…).
    const AV_EXCLUS = ['oeuf', 'vague', 'cendre', 'lave', 'meteorite', 'volcan'];
    const TETES = (window.MAXPLAY_AVATARS || [])
      .filter(a => AV_EXCLUS.indexOf(a.id) === -1 && a.moods && a.moods.joyeux && a.moods.joyeux.length)
      .map(a => (window.MAXPLAY_AVATARS_BASE || 'img/avatars/') + a.moods.joyeux[0]);

    const G = Golden.setup(GAME_ID);   // G.level = Math.min(2, étoiles) · G.totalQ = 4/6/8
    const MAX_Q = G.totalQ;
    const level = G.level;

    const _shuffle = (typeof shuffle === 'function')
      ? shuffle
      : (a) => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

    // Manche mixte (pattern mj-04) : moitié au niveau courant, moitié plus facile
    const qLevels = (function () {
      const hard = Math.ceil(MAX_Q / 2);
      const arr = [];
      for (let i = 0; i < hard; i++) arr.push(level);
      for (let i = hard; i < MAX_Q; i++) arr.push(level <= 0 ? 0 : Math.floor(Math.random() * level));
      return _shuffle(arr);
    })();

    let qCount = 0, qcm = null, correctAnswer = 0, tagged = 0, phase2 = false;

    const shell = MJ.init({
      id: GAME_ID, emoji: '🥚', titre: 'Les œufs surprises',
      golden: true, consigne: true,
      regle: {
        picto: '🥚🔢',
        texte: 'Compte les œufs du nid, puis touche le bon chiffre !',
        etapes: [
          { t: 'Je réponds direct si je sais ! 🔢',
            d: 'Je compte les œufs dans ma tête et je touche le bon chiffre.' },
          { t: 'Ou je tapote les œufs pour compter 👆',
            d: 'Une pastille jaune se pose dessus : 1, 2, 3… et l’œuf se fissure !' },
          { t: 'Le dernier chiffre dit le total 🗣️',
            d: 'Le chiffre du dernier œuf, c’est combien il y a d’œufs en tout !' },
          { t: 'Quand c’est juste… les œufs éclosent 🐣',
            d: 'Des bébés dinos sortent des œufs ! Plus j’ai d’étoiles, plus il y a d’œufs à compter.' }
        ]
      }
    });

    function sfx(src, vol) {
      try { const a = new Audio(src); a.volume = vol || 0.55; a.play().catch(() => {}); } catch (e) {}
    }

    function eggSize(n) { return n <= 6 ? 58 : (n <= 10 ? 50 : (n <= 14 ? 44 : 38)); }

    function init() {
      nextQuestion();   // la consigne « Compte les œufs ! » est posée (et dite) dans nextQuestion
    }

    function nextQuestion() {
      if (qCount >= MAX_Q) return showEnd();
      qCount++;
      qcm = MJCompte.beginQuestion();
      tagged = 0; phase2 = false;
      hideHint();

      const L = LEVELS[qLevels[qCount - 1] || 0];   // palier de CETTE question (manche mixte)
      correctAnswer = MJCompte.nextValue(L);

      // Consigne : le QCM est visible dès le début — tapoter les œufs est une AIDE (PY)
      shell.setConsigne('Combien d’œufs ?', qCount === 1);

      renderEggs(correctAnswer);

      // QCM affiché juste après l'apparition des œufs : qui sait compter répond direct
      setTimeout(showChoices, Math.min(correctAnswer * 80 + 350, 1300));
    }

    // Phase 1 : les œufs apparaissent en vrac (jamais cachés à +50 %), tapotables → pastille
    // Disposition : grille de cellules ≥ 1,15× l'œuf + jitter ±20 % + rotation ±12°
    // → épars MAIS le haut de chaque œuf (« la tête ») reste toujours visible.
    function renderEggs(total) {
      const box = document.getElementById('eggs');
      box.innerHTML = '';
      const W = box.clientWidth || 360, H = box.clientHeight || 220;
      let egg = eggSize(total);
      while (egg > 30) {                    // réduit jusqu'à ce que tout tienne
        const cell = egg * 1.15;
        const cols = Math.max(1, Math.floor(W / cell));
        if (Math.ceil(total / cols) * cell <= H) break;
        egg -= 4;
      }
      box.style.setProperty('--egg', egg + 'px');
      const cell = egg * 1.15;
      const cols = Math.max(1, Math.floor(W / cell));
      const rows = Math.ceil(total / cols);
      // aligné en BAS : les œufs sont posés dans le nid, pas flottants en haut
      const ox = (W - cols * cell) / 2, oy = H - rows * cell;
      const babies = _shuffle([...TETES]);
      const order = _shuffle([...Array(total).keys()]);   // apparition désordonnée, pas ligne par ligne
      for (let i = 0; i < total; i++) {
        const r = Math.floor(i / cols), c = i % cols;
        const jx = (Math.random() - 0.5) * cell * 0.3;
        const jy = (Math.random() - 0.5) * cell * 0.3;
        const rot = (Math.random() - 0.5) * 24;
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.style.left = (ox + c * cell + cell / 2 + jx - egg / 2) + 'px';
        slot.style.top = (oy + r * cell + cell / 2 + jy - egg * 1.05) + 'px';
        slot.style.animationDelay = `${order[i] * 0.08}s`;
        slot.innerHTML = `<div class="egg" style="transform:rotate(${rot.toFixed(1)}deg)"></div><img class="baby" src="${babies[i % babies.length]}" alt="bébé dino">`;
        slot.onclick = () => tapEgg(slot);
        box.appendChild(slot);
        setTimeout(() => { if (box.contains(slot)) sndCount(); }, order[i] * 80 + 60);
      }
    }

    function tapEgg(slot) {
      const egg = slot.querySelector('.egg');
      if (!egg || egg.style.visibility === 'hidden') return;
      if (slot.dataset.tagged) {
        // déjà compté : petit rebond doux, pas de nouvelle pastille
        slot.classList.remove('hl'); void slot.offsetWidth;
        slot.classList.add('hl');
        setTimeout(() => slot.classList.remove('hl'), 400);
        return;
      }
      slot.dataset.tagged = '1';
      tagged++;
      egg.classList.add('cracked');     // l'œuf se fissure quand on l'a compté (PY)
      const p = document.createElement('span');
      p.className = 'pastille';
      p.textContent = tagged;
      slot.appendChild(p);
      sndCount();                       // feedback immédiat (< 200 ms)
      if (tagged === correctAnswer) {   // tous comptés → petit rappel lumineux des choix
        const ch = document.getElementById('choices');
        ch.classList.remove('pulse'); void ch.offsetWidth;
        ch.classList.add('pulse');
      }
    }

    // Phase 2 : QCM « Combien d'œufs ? » — 3 gros boutons, distracteurs ±1..±2
    function showChoices() {
      if (phase2) return;
      phase2 = true;
      const ch = document.getElementById('choices');
      ch.innerHTML = '';
      const options = MJCompte.distractors(correctAnswer, { count: 3, min: 1, spread: 2 });
      options.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'ch';
        btn.textContent = num;
        if (num === correctAnswer) btn.dataset.correct = '1';
        btn.onclick = () => answer(num === correctAnswer, btn);
        ch.appendChild(btn);
      });
      ch.classList.remove('hidden');
    }

    function answer(isCorrect, btn) {
      if (btn.disabled) return;
      const res = MJCompte.answer(qcm, isCorrect);
      if (res.outcome === 'ignored') return;

      if (res.outcome === 'correct') {
        btn.classList.add('ok');
        sndDing();
        // Cardinalité : le total est dit ET affiché en gros
        shell.setConsigne(correctAnswer + ' œufs !');
        G.notePip(qCount - 1, res.attempts, btn);
        hatchAll(() => setTimeout(nextQuestion, 500));
      } else if (res.outcome === 'reveal') {
        btn.classList.add('ko'); btn.disabled = true;
        QcmRetry.revealCorrect(document.getElementById('choices'));
        sndBuzz();
        recountEggs();
        const okEl = document.querySelector('#choices .ch[data-correct="1"]');
        G.notePip(qCount - 1, 4, okEl);
        setTimeout(nextQuestion, 2200);
      } else {
        // mauvaise réponse, il reste des essais → on recompte ensemble + INDICE, jamais la réponse
        btn.classList.add('ko'); btn.disabled = true;
        sndBuzz();
        showHint('💡 Recomptons ensemble, un par un !');
        recountEggs();
      }
    }

    // Éclosion : chaque œuf tremble, craque (son), puis le bébé dino surgit
    function hatchAll(done) {
      const slots = [...document.querySelectorAll('#eggs .slot')];
      if (!slots.length) { done(); return; }
      slots.forEach((slot, i) => {
        setTimeout(() => {
          const egg = slot.querySelector('.egg');
          const baby = slot.querySelector('.baby');
          const pastille = slot.querySelector('.pastille');
          egg.classList.add('shake');
          sfx('sounds/fx/dino-oeuf-eclot.mp3', 0.4);
          setTimeout(() => {
            egg.style.visibility = 'hidden';
            if (pastille) pastille.style.display = 'none';
            baby.classList.add('pop');
            if (i === slots.length - 1) setTimeout(done, 650);
          }, 380);
        }, i * 300);
      });
    }

    // Recompte guidé : re-surligne les œufs un par un avec leur pastille (sur erreur)
    function recountEggs() {
      const slots = [...document.querySelectorAll('#eggs .slot')];
      slots.forEach((slot, i) => {
        setTimeout(() => {
          slot.classList.add('hl');
          sndCount();
          setTimeout(() => slot.classList.remove('hl'), 350);
        }, i * 220);
      });
    }

    function showHint(t) {
      const h = document.getElementById('hint');
      if (h) { h.textContent = t; h.classList.add('show'); }
    }
    function hideHint() { const h = document.getElementById('hint'); if (h) h.classList.remove('show'); }

    function showEnd() {
      G.showEnd({ replayUrl: 'mj-46.html' });
    }

    init();
    });
  </script>
</body>
</html>
