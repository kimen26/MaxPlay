<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-49 – Les barquettes de 10</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <link rel="stylesheet" href="css/mj-kit.css">
  <style>
    /* --- GABARIT HEADER CANONIQUE --- */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }

    .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; overflow:hidden; padding:2px 8px 10px; gap:4px; }

    /* ── La cible « remplis pour atteindre N » ── */
    .target-line {
      min-height:1.6em; font-size:1.25rem; color:#ffe9a0; font-weight:900; text-align:center;
      text-shadow:0 2px 4px rgba(0,0,0,.5);
    }
    .target-line b { font-size:1.7rem; color:var(--gold, #ffe066); }

    /* ── Les barquettes (boîtes de 10, 5×2) ── */
    .scene { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
    .barquettes { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
    .barquette {
      position:relative; display:flex; flex-direction:column; gap:6px;
      background:linear-gradient(160deg, #8a5a2b, #5d3a17);
      border:3px solid rgba(255,220,160,.4); border-radius:16px; padding:8px 9px;
      box-shadow:0 8px 20px rgba(0,0,0,.5), inset 0 4px 10px rgba(0,0,0,.35);
      transition:box-shadow .4s, transform .6s;
    }
    .barquette.pleine { box-shadow:0 0 24px rgba(255,224,102,.55), 0 8px 20px rgba(0,0,0,.5); border-color:var(--gold,#ffe066); }
    /* Tête de bébé dino qui pointe au-dessus d'une barquette pleine (substitution
       d'asset PY 2026-07-28 : les œufs existent déjà, on les fait éclore). */
    .b-dino {
      position:absolute; top:-38px; left:50%; transform:translateX(-50%) scale(0);
      width:56px; height:56px; border-radius:50%; object-fit:cover; object-position:50% 35%;
      background:radial-gradient(circle at 35% 30%, #fff5da, #e6c282);
      box-shadow:0 4px 10px rgba(0,0,0,.4), 0 0 0 3px rgba(255,255,255,.7);
      pointer-events:none; z-index:5;
    }
    .barquette.pleine .b-dino { animation:dinoPop .4s cubic-bezier(.34,1.56,.64,1) .15s both; }
    @keyframes dinoPop { from{transform:translateX(-50%) scale(0);} to{transform:translateX(-50%) scale(1);} }
    .barquette .b-dix {
      position:absolute; top:-13px; right:-9px; min-width:34px; height:30px; padding:0 8px;
      border-radius:999px; background:var(--gold,#ffe066); color:#4a3005; border:2px solid #fff;
      font-size:1.05rem; display:none; align-items:center; justify-content:center;
      box-shadow:0 3px 7px rgba(0,0,0,.4); z-index:4;
    }
    .barquette.pleine .b-dix { display:flex; animation:dixPop .3s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes dixPop { from{transform:scale(0)} to{transform:scale(1)} }
    .b-rangee { display:flex; gap:6px; }
    .cell {
      width:var(--cell, 44px); height:calc(var(--cell, 44px) * 1.18); border-radius:50% 50% 46% 46%/56% 56% 44% 44%;
      background:rgba(0,0,0,.28); border:2px dashed rgba(255,255,255,.25); position:relative;
      display:flex; align-items:flex-end; justify-content:center; cursor:pointer; touch-action:manipulation;
    }
    .cell.plein { border-style:solid; border-color:rgba(255,220,160,.35); }

    /* Œuf + pastille de comptage : mj-kit.css (.mjk-oeuf / .mjk-pastille) */
    .cell .mjk-oeuf, .vrac .mjk-oeuf { width:88%; height:92%; animation:oeufPop .3s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes oeufPop { from{transform:scale(0)} to{transform:scale(1)} }

    /* Œufs en vrac (à côté des barquettes) */
    .vrac { display:flex; align-items:flex-end; justify-content:center; gap:5px; flex-wrap:wrap; min-height:56px; max-width:96%; }
    .vrac .loose {
      position:relative; width:var(--cell, 44px); height:calc(var(--cell, 44px) * 1.18);
      display:flex; align-items:flex-end; justify-content:center; cursor:pointer; touch-action:manipulation;
    }
    .vrac .loose .mjk-oeuf { transform:rotate(var(--rot, 0deg)); }
    .stage { position:relative; } /* ancre des décors mj-kit */

    /* Célébration « bocal » (fin N2) : les paquets de 10 brillent et descendent */
    .bocal-out { animation:bocalOut 1.1s ease-in forwards; }
    @keyframes bocalOut {
      0% { transform:translateY(0); filter:brightness(1); }
      35% { filter:brightness(1.6) drop-shadow(0 0 18px rgba(255,224,102,.9)); }
      100% { transform:translateY(120vh); filter:brightness(1.4); }
    }

  </style>
</head>
<body data-ambiance="jungle">
<div id="app">

  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🥚 Les barquettes de 10</span>
  </div>

  <div class="stage">
    <div class="target-line" id="target-line"></div>
    <div class="scene">
      <div class="barquettes" id="barquettes"></div>
      <div class="vrac" id="vrac"></div>
    </div>
    <div id="calc-line"></div>
    <div class="mjk-choices hidden" id="choices"></div>
  </div>

</div>
  <!-- libs SPÉCIFIQUES au jeu -->
  <script src="js/mj-dice.js"></script>
  <script src="js/mj-kit.js"></script>
  <script src="js/say-nombres.js"></script>
  <script src="js/mj-compte.js"</script>
  <script src="js/dinos-assets.js"></script>
  <!-- manifeste têtes de bébés dinos (éclosion des barquettes pleines, PY 2026-07-28) -->
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
  MJ.ready(function () {
    'use strict';
    // ─── MJ-49 : Les barquettes de 10 — la dizaine (spec S4, absorbe mj-43 + ex-S5 bocal) ───
    // Barquette = boîte d'œufs 5×2. La dizaine devient un OBJET qu'on voit.
    // N0 : complète la barquette (combien il en manque ?) — compléments à 10
    // N1 : 10 + n (11→19) — lire la dizaine d'un coup
    // N2 : 2 barquettes (20 + n) · « remplis pour atteindre N » (le rendre-la-monnaie de PY)
    //      + célébration bocal : les paquets de 10 brillent et descendent (geste ex-S5).
    const GAME_ID = 'mj-49';

    const shell = MJ.init({
      id: GAME_ID, emoji: '🥚', titre: 'Les barquettes de 10',
      golden: true, consigne: true,
      regle: {
        picto: '🥚🔟',
        texte: 'Une barquette pleine, c’est 10 ! Avec elle, les grands nombres deviennent faciles.',
        etapes: [
          { t: 'Je regarde la barquette 👀',
            d: 'La boîte a 2 rangées de 5 : pleine, ça fait 10 œufs. Pas besoin de recompter !' },
          { t: 'Je réponds direct si je sais 🔢',
            d: 'Sinon je tapote les œufs (ou les trous !) pour compter : une pastille se pose dessus.' },
          { t: 'Le calcul s’affiche ✨',
            d: '« 10 et 4, ça fait 14 ! » — la barquette brille, et je vois la dizaine.' },
          { t: 'Plus j’ai d’étoiles, plus c’est grand 💪',
            d: 'D’abord une barquette, puis 10 et encore, puis DEUX barquettes : jusqu’à plus de 20 !' }
        ]
      }
    });
    const G = shell.G;

    const barquettesEl = document.getElementById('barquettes');
    const vracEl = document.getElementById('vrac');
    const targetEl = document.getElementById('target-line');
    const calcEl = document.getElementById('calc-line');
    const choicesEl = document.getElementById('choices');

    const rand = MJDice.randInt;
    function sfx(src, vol) { try { const a = new Audio(src); a.volume = vol || 0.5; a.play().catch(() => {}); } catch (e) {} }

    // Têtes de bébés dinos (éclosion des barquettes pleines) — clé = nom latin
    // capitalisé (norme dino), défensif si le manifeste ou l'asset manque.
    const DINO_TETES = Object.keys(window.DINO_ASSETS || {})
      .map(k => window.DINO_ASSETS[k] && window.DINO_ASSETS[k].tete)
      .filter(Boolean);
    function randomDinoTete() {
      if (!DINO_TETES.length) return null;
      return DINO_TETES[rand(0, DINO_TETES.length - 1)];
    }

    let qCount = 0, correctAnswer = 0, roundLock = false, tagged = 0;
    let curSub = 'manque', soundsOn = true, testMode = false, forcedLevel = null, forcedSub = null;
    function level() { return forcedLevel !== null ? forcedLevel : G.level; }

    // ── Rendu d'une barquette 5×2 avec f œufs dedans ──
    function barquetteHtml(filled, cellPx) {
      const b = document.createElement('div');
      const isFull = filled >= 10;
      b.className = 'barquette' + (isFull ? ' pleine' : '');
      b.style.setProperty('--cell', cellPx + 'px');
      b.innerHTML = '<span class="b-dix">10</span>';
      if (isFull) {
        const tete = randomDinoTete();
        if (tete) b.innerHTML += `<img class="b-dino" src="${tete}" alt="">`;
      }
      for (let r = 0; r < 2; r++) {
        const row = document.createElement('div');
        row.className = 'b-rangee';
        for (let c = 0; c < 5; c++) {
          const i = r * 5 + c;
          const cell = document.createElement('div');
          cell.className = 'cell' + (i < filled ? ' plein' : '');
          if (i < filled) cell.innerHTML = '<div class="mjk-oeuf"></div>';
          cell.addEventListener('click', () => tapCount(cell));
          row.appendChild(cell);
        }
        b.appendChild(row);
      }
      return b;
    }

    function looseHtml(n, cellPx) {
      vracEl.innerHTML = '';
      vracEl.style.setProperty('--cell', cellPx + 'px');
      for (let i = 0; i < n; i++) {
        const l = document.createElement('div');
        l.className = 'loose';
        l.style.setProperty('--rot', (rand(-14, 14)) + 'deg');
        l.innerHTML = '<div class="mjk-oeuf"></div>';
        l.addEventListener('click', () => tapCount(l));
        vracEl.appendChild(l);
      }
    }

    // Aide optionnelle : tapoter pose une pastille numérotée (jamais obligatoire).
    // N0 : on compte les TROUS (cases vides) · sinon : les œufs en vrac.
    function tapCount(el) {
      if (roundLock) return;
      const countable = (curSub === 'manque')
        ? (el.classList.contains('cell') && !el.classList.contains('plein'))
        : el.classList.contains('loose');
      if (!countable || el.dataset.tagged) return;
      el.dataset.tagged = '1';
      tagged++;
      el.appendChild(MJKit.pastille(tagged));
      if (soundsOn) try { sndCount(); } catch (e) {}
    }

    function clearScene() {
      barquettesEl.innerHTML = '';
      vracEl.innerHTML = '';
      targetEl.textContent = '';
      tagged = 0;
      MJKit.calcReset(calcEl);
      choicesEl.classList.add('hidden'); choicesEl.innerHTML = '';
    }

    // ── Une question ──
    function nextQuestion() {
      if (qCount >= G.totalQ) return endRound();
      qCount++;
      roundLock = false;
      clearScene();

      const lv = level();
      if (lv === 0) curSub = 'manque';
      else if (lv === 1) curSub = 'dix-plus';
      else curSub = forcedSub || (qCount % 2 === 0 ? 'atteindre' : 'deux-barquettes');
      if (forcedSub) curSub = forcedSub;

      if (curSub === 'manque') {
        // N0 : barquette à trous — compléments à 10. Les DEUX formulations de PY
        // (« il en manque » / « il en faut ») alternent dès le niveau 0
        // (retour passe complète 2026-07-27 : il ne voyait qu'une seule tournure).
        const filled = rand(5, 9);
        correctAnswer = 10 - filled;
        barquettesEl.appendChild(barquetteHtml(filled, 46));
        const consigneManque = (qCount % 2 === 0)
          ? 'Il en faut combien pour faire 10 ?'
          : 'Il en manque combien pour remplir la boîte ?';
        shell.setConsigne(consigneManque, qCount === 1 ? undefined : true);
        showChoices({ min: 1, max: 6 });

      } else if (curSub === 'dix-plus') {
        // N1 : une barquette PLEINE + n en vrac → 10 et n
        const n = rand(1, 9);
        correctAnswer = 10 + n;
        barquettesEl.appendChild(barquetteHtml(10, 40));
        looseHtml(n, 40);
        shell.setConsigne('Combien d’œufs en tout ?', qCount === 1 ? undefined : true);
        showChoices({ min: 10, max: 20 });

      } else if (curSub === 'deux-barquettes') {
        // N2a : deux barquettes pleines + n en vrac → 10, 20… et n
        const n = rand(0, 5);
        correctAnswer = 20 + n;
        barquettesEl.appendChild(barquetteHtml(10, 30));
        barquettesEl.appendChild(barquetteHtml(10, 30));
        looseHtml(n, 34);
        shell.setConsigne('Deux boîtes pleines… combien en tout ?', qCount === 1 ? undefined : true);
        showChoices({ min: 18, max: 28 });

      } else if (curSub === 'atteindre') {
        // N2b : « il me faut N » — barquette pleine, combien d'œufs encore ? (rendre la monnaie)
        const target = rand(12, 19);
        correctAnswer = target - 10;
        targetEl.innerHTML = 'Il me faut <b>' + target + '</b> œufs !';
        barquettesEl.appendChild(barquetteHtml(10, 40));
        shell.setConsigne('La boîte est pleine. Il faut encore combien d’œufs ?', qCount === 1 ? undefined : true);
        showChoices({ min: 1, max: 9 });
      }
    }

    // QCM = bibliothèque d'actions mj-kit (boutons + retry + révélation)
    function showChoices(range) {
      const opts = MJCompte.distractors(correctAnswer, { count: 3, min: range.min, max: range.max, spread: 2 });
      MJKit.qcm(choicesEl, {
        options: opts, correct: correctAnswer,
        onCorrect: (attempts, btn) => {
          roundLock = true;
          G.notePip(qCount - 1, attempts, btn);
          // Annonce de la réponse en vraie voix (banque nombres C6, gabarits complets)
          if (window.SayNombres && !testMode) {
            if (curSub === 'manque' || curSub === 'atteindre') SayNombres.manque(correctAnswer);
            else SayNombres.say(correctAnswer, { fete: true });
          }
          celebrateAnswer();
          setTimeout(nextQuestion, testMode ? 0 : 2700);
        },
        onReveal: (okEl) => {
          roundLock = true;
          G.notePip(qCount - 1, 4, okEl);
          celebrateAnswer();
          setTimeout(nextQuestion, testMode ? 0 : 2900);
        },
        onWrong: () => {
          shell.say(curSub === 'manque' ? 'Tapote les trous vides pour les compter !' : 'Tapote les œufs pour les compter !');
        },
      });
    }

    // ── La phrase du calcul + le geste visuel de la dizaine ──
    function celebrateAnswer() {
      let sentence = '';
      if (curSub === 'manque') {
        // les œufs manquants arrivent un par un → la boîte se remplit → « 10 ! »
        const holes = [...barquettesEl.querySelectorAll('.cell:not(.plein)')];
        holes.forEach((h, i) => {
          setTimeout(() => {
            h.classList.add('plein');
            h.querySelector('.mjk-pastille') && h.querySelector('.mjk-pastille').remove();
            h.innerHTML = '<div class="mjk-oeuf"></div>';
            if (soundsOn) try { sndCount(); } catch (e) {}
            if (i === holes.length - 1) {
              const b = barquettesEl.querySelector('.barquette');
              b.classList.add('pleine');
              const tete = randomDinoTete();
              if (tete && !b.querySelector('.b-dino')) b.innerHTML += `<img class="b-dino" src="${tete}" alt="">`;
            }
          }, testMode ? 0 : 350 + i * 320);
        });
        sentence = 'Il en manquait ' + correctAnswer + ' ! Et 10, la boîte est pleine !';
      } else if (curSub === 'dix-plus') {
        sentence = '10 et ' + (correctAnswer - 10) + ', ça fait ' + correctAnswer + ' !';
      } else if (curSub === 'deux-barquettes') {
        sentence = '10, 20' + (correctAnswer > 20 ? '… et ' + (correctAnswer - 20) : '') + ', ça fait ' + correctAnswer + ' !';
      } else if (curSub === 'atteindre') {
        looseHtml(correctAnswer, 40);
        sentence = '10 et ' + correctAnswer + ', ça fait ' + (10 + correctAnswer) + ' !';
      }
      MJKit.calcLine(calcEl, sentence);
    }

    // ── Fin de manche : célébration bocal au niveau 2 (les paquets de 10 descendent) ──
    function endRound() {
      if (level() === 2 && !testMode) {
        [...barquettesEl.querySelectorAll('.barquette')].forEach((b, i) => {
          setTimeout(() => b.classList.add('bocal-out'), i * 220);
        });
        sfx('sounds/fx/magie.mp3', 0.5);
        setTimeout(showEnd, 1400);
      } else {
        showEnd();
      }
    }
    function showEnd() { G.showEnd({ replayUrl: 'mj-49.html' }); }

    // ── Paramètres test/screenshot : ?level=N · ?sub=manque|dix-plus|deux-barquettes|atteindre ──
    const qs = new URLSearchParams(location.search);
    if (qs.get('level') !== null) forcedLevel = Math.max(0, Math.min(2, parseInt(qs.get('level'), 10) || 0));
    if (qs.get('sub')) forcedSub = qs.get('sub');
    if (qs.get('mute')) soundsOn = false;

    // ── Harnais Playwright ──
    window.__mjTest = {
      get state() {
        return {
          qCount, totalQ: G.totalQ, level: level(), sub: curSub, correctAnswer, roundLock, tagged,
          barquettes: barquettesEl.querySelectorAll('.barquette').length,
          pleines: barquettesEl.querySelectorAll('.barquette.pleine').length,
          loose: vracEl.querySelectorAll('.loose').length,
          choices: [...choicesEl.querySelectorAll('.mjk-choice')].map(b => b.textContent),
          calcText: calcEl.textContent,
        };
      },
      setTestMode(on) { testMode = !!on; },
      setDifficulty(lvl) { forcedLevel = Math.max(0, Math.min(2, lvl)); qCount = 0; nextQuestion(); },
      forceSub(s) { forcedSub = s; },
      answer(correct) {
        const btn = correct
          ? choicesEl.querySelector('[data-correct="1"]')
          : choicesEl.querySelector('.mjk-choice:not([data-correct="1"]):not(.ko)');
        if (btn) btn.click();
      },
      next() { nextQuestion(); },
    };

    MJKit.decor(document.querySelector('.stage'), ['fougere-g', 'fougere-d']);
    nextQuestion();
  });
  </script>
</body>
</html>
