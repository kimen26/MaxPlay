<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-58 – Dino Run</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mp-theme.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka One',sans-serif; color:#fff; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; width:100%; }
    .stage { flex:1; position:relative; overflow:hidden; padding:6px; display:flex; }
    #run-canvas { flex:1; width:100%; height:100%; border-radius:18px; touch-action:none; display:block; }
    .jalon-line { text-align:center; font-size:1.05rem; color:#ffe9a0; font-weight:900; min-height:1.4em; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  </style>
</head>
<body data-ambiance="jungle">
<div id="app">

  <div class="hdr">
    <a href="index.html">&#8592;</a>
    <span class="htitle">🏃 Dino Run</span>
  </div>

  <div class="jalon-line" id="jalon-line"></div>
  <div class="stage">
    <canvas id="run-canvas"></canvas>
  </div>

</div>
  <!-- LE GABARIT : charge tout le cadre standard (thème, golden, panneau ?, tracking, cloud) -->
  <script src="js/mj-shell.js"></script>
  <script>
  MJ.ready(function () {
    'use strict';
    // ─── MJ-58 : Dino Run — runner vue latérale, saut à hauteur variable ───
    // Tap court = petit saut · maintien pendant la montée = gravité ÷2 (grand saut).
    // Obstacles : cactus simple (N1+), cactus double (N2+), ptérodactyle bas (N3, NE PAS sauter).
    // Œufs bonus en arc. Collision AABB 70%. Trébucher = pause courte, JAMAIS game over.
    // 1 partie = 4 segments (jalons illustrés : fougère → rocher → volcan → sommet).
    const GAME_ID = 'mj-58';

    const shell = MJ.init({
      id: GAME_ID, emoji: '🏃', titre: 'Dino Run',
      golden: true, consigne: true,
      regle: {
        picto: '🦖🏃',
        texte: 'Rex court tout seul ! Tape pour sauter par-dessus les cactus.',
        etapes: [
          { t: 'Je tape pour sauter 👆',
            d: 'Un petit tap = petit saut. Je garde le doigt appuyé pour sauter plus haut !' },
          { t: 'Cactus simple = petit saut 🌵',
            d: 'Un tap rapide suffit pour passer par-dessus.' },
          { t: 'Cactus double = grand saut 🌵🌵',
            d: 'Je garde le doigt appuyé plus longtemps pour sauter plus haut.' },
          { t: 'Le ptérodactyle vole bas 🦅',
            d: 'Lui, il ne faut PAS sauter — je le laisse passer au-dessus de moi !' },
          { t: 'Si je trébuche, pas grave 🥚',
            d: 'Rex se relève tout de suite et on continue à courir !' }
        ]
      }
    });
    const G = shell.G;
    // 1 partie = 4 segments fixes (jalons), quel que soit le niveau golden.
    // Le niveau (0/1/2) pilote seulement la difficulté des obstacles.
    const TOTAL_SEGMENTS = 4;
    G.totalQ = TOTAL_SEGMENTS;
    G.buildPips();

    const canvas = document.getElementById('run-canvas');
    const ctx = canvas.getContext('2d');
    const jalonLine = document.getElementById('jalon-line');

    function sfx(src, vol) { try { const a = new Audio(src); a.volume = vol || 0.5; a.play().catch(() => {}); } catch (e) {} }

    // ── Dimensions canvas (résolution logique fixe, mise à l'échelle CSS) ──
    const LW = 900, LH = 380; // largeur/hauteur logiques
    function resize() {
      const r = canvas.parentElement.getBoundingClientRect();
      const scale = Math.min(r.width / LW, r.height / LH);
      canvas.style.width = (LW * scale) + 'px';
      canvas.style.height = (LH * scale) + 'px';
      canvas.width = LW; canvas.height = LH;
    }
    resize();
    window.addEventListener('resize', resize);

    const GROUND_Y = LH - 60;

    // ── Jalons illustrés (pas de chiffres) ──
    const JALONS = ['🌿 Fougère', '🪨 Rocher', '🌋 Volcan', '⛰️ Sommet'];

    // ── Niveau (0/1/2) : min(2, étoiles), sauf pilotes EP-112 (mj-58 non pilote) ──
    function level() { return forcedLevel !== null ? forcedLevel : G.level; }
    let forcedLevel = null;
    let testMode = false;

    // ── État de course ──
    const rex = { x: 90, y: GROUND_Y, vy: 0, w: 46, h: 52, onGround: true, stumble: 0 };
    const GRAVITY = 0.62;
    const GRAVITY_SLOW = GRAVITY / 2;
    const JUMP_VY = -12.5;

    let speed = 3.2;               // vitesse initiale LENTE
    const SPEED_CAP = 6.2;         // plafond (refus chrono-stress PY)
    const SPEED_STEP_DIST = 2600;  // palier d'accélération douce (px logiques parcourus)
    let distanceInSegment = 0;
    const SEGMENT_DISTANCE = 2200; // distance logique par segment

    let segIndex = 0;              // 0..3
    let segStumbled = false;       // au moins 1 trébuchement dans le segment courant
    let running = true;
    let paused = false;
    let obstacles = [];
    let eggs = [];
    let spawnCooldown = 0;
    let jumpHeld = false;
    let lastTs = 0;
    let finished = false;

    function setJalon() {
      jalonLine.textContent = JALONS[Math.min(segIndex, JALONS.length - 1)];
    }
    setJalon();
    shell.setConsigne('Tape pour sauter par-dessus les cactus !');

    // ── Obstacles : cactus simple / double / ptérodactyle ──
    function spawnObstacle() {
      const lv = level();
      const roll = Math.random();
      let type = 'cactus1';
      if (lv >= 2 && roll < 0.22) type = 'ptero';
      else if (lv >= 1 && roll < 0.55) type = 'cactus2';
      else type = 'cactus1';

      if (type === 'cactus1') {
        obstacles.push({ type, x: LW + 20, y: GROUND_Y - 34, w: 26, h: 34 });
      } else if (type === 'cactus2') {
        obstacles.push({ type, x: LW + 20, y: GROUND_Y - 46, w: 44, h: 46 });
      } else if (type === 'ptero') {
        obstacles.push({ type, x: LW + 20, y: GROUND_Y - 92, w: 46, h: 34 });
      }

      // Œuf bonus en arc au-dessus, ~50% de chance (jamais sur le ptéro pour rester lisible)
      if (type !== 'ptero' && Math.random() < 0.5) {
        eggs.push({ x: LW + 20 + 40, y: GROUND_Y - 90, w: 24, h: 28, taken: false, arcT: 0 });
      }
    }

    function resetSegmentObstacles() {
      obstacles = [];
      eggs = [];
      spawnCooldown = testMode ? 20 : 60;
      distanceInSegment = 0;
    }
    resetSegmentObstacles();

    // ── Entrée : pointerdown/pointerup sur tout le canvas ──
    let holdStart = 0;
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!running || paused || finished) return;
      jumpHeld = true;
      holdStart = performance.now();
      if (rex.onGround) {
        rex.vy = JUMP_VY;
        rex.onGround = false;
        sfx('sounds/ui/tap.mp3', 0.4);
      }
    }, { passive: false });
    canvas.addEventListener('pointerup', () => { jumpHeld = false; });
    canvas.addEventListener('pointercancel', () => { jumpHeld = false; });

    // ── Pause propre quand l'onglet est caché ──
    document.addEventListener('visibilitychange', () => {
      paused = document.hidden;
      if (!paused) lastTs = 0;
    });

    function aabbOverlap70(a, b) {
      // Boîtes réduites à 70% (indulgence) centrées sur chaque boîte.
      function shrink(o) {
        const sw = o.w * 0.7, sh = o.h * 0.7;
        return { x: o.x + (o.w - sw) / 2, y: o.y + (o.h - sh) / 2, w: sw, h: sh };
      }
      const A = shrink(a), B = shrink(b);
      return A.x < B.x + B.w && A.x + A.w > B.x && A.y < B.y + B.h && A.y + A.h > B.y;
    }

    function stumble() {
      segStumbled = true;
      rex.stumble = testMode ? 4 : 46; // frames de pause courte
      sfx('sounds/fx/boing.mp3', 0.45);
    }

    function endSegment() {
      const attempts = segStumbled ? 2 : 1;
      G.notePip(segIndex, attempts);
      segIndex++;
      segStumbled = false;
      if (segIndex >= TOTAL_SEGMENTS) {
        finished = true;
        running = false;
        setTimeout(() => { G.showEnd({ replayUrl: 'mj-58.html' }); }, testMode ? 0 : 900);
        return;
      }
      setJalon();
      resetSegmentObstacles();
      // Accélération douce par palier, plafonnée
      speed = Math.min(SPEED_CAP, speed + 0.35);
    }

    function update(dt) {
      if (rex.stumble > 0) {
        rex.stumble -= 1;
        if (rex.stumble === 0) {
          // reprise après la courte pause
        } else {
          return; // course en pause pendant le trébuchement
        }
      }

      // Physique du saut : maintien pendant la MONTÉE = gravité ÷2 (saut variable)
      if (!rex.onGround) {
        const g = (jumpHeld && rex.vy < 0) ? GRAVITY_SLOW : GRAVITY;
        rex.vy += g;
        rex.y += rex.vy;
        if (rex.y >= GROUND_Y) {
          rex.y = GROUND_Y;
          rex.vy = 0;
          rex.onGround = true;
        }
      }

      const dx = speed * dt;
      distanceInSegment += dx;

      // Spawn
      spawnCooldown -= dt;
      if (spawnCooldown <= 0) {
        spawnObstacle();
        const lv = level();
        const gapBase = lv >= 2 ? 46 : lv >= 1 ? 54 : 66; // densité un peu plus forte en N3, plafonnée
        spawnCooldown = testMode ? 18 : (gapBase + Math.random() * 20);
      }

      // Déplacement + collision obstacles
      const rexBox = { x: rex.x, y: rex.y - rex.h, w: rex.w, h: rex.h };
      obstacles.forEach(o => { o.x -= dx; });
      obstacles = obstacles.filter(o => {
        if (o.x + o.w < -10) return false;
        if (!o.hit && aabbOverlap70(rexBox, o)) {
          o.hit = true;
          stumble();
        }
        return true;
      });

      // Œufs bonus
      eggs.forEach(eg => { eg.x -= dx; eg.arcT += dt * 0.05; eg.y = GROUND_Y - 90 - Math.sin(Math.min(1, eg.arcT)) * 30; });
      eggs = eggs.filter(eg => {
        if (eg.x + eg.w < -10) return false;
        if (!eg.taken && aabbOverlap70(rexBox, eg)) {
          eg.taken = true;
          sfx('sounds/ui/tap.mp3', 0.3);
          return false;
        }
        return true;
      });

      if (distanceInSegment >= SEGMENT_DISTANCE) endSegment();
    }

    function draw() {
      ctx.clearRect(0, 0, LW, LH);
      // Ciel
      const g = ctx.createLinearGradient(0, 0, 0, LH);
      g.addColorStop(0, '#2b5876'); g.addColorStop(1, '#4e7a4e');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, LW, LH);
      // Sol
      ctx.fillStyle = '#3d5c2f';
      ctx.fillRect(0, GROUND_Y + 4, LW, LH - GROUND_Y - 4);
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 4); ctx.lineTo(LW, GROUND_Y + 4); ctx.stroke();

      ctx.font = '38px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

      // Obstacles
      obstacles.forEach(o => {
        const emoji = o.type === 'ptero' ? '🦅' : (o.type === 'cactus2' ? '🌵🌵' : '🌵');
        ctx.font = (o.type === 'ptero' ? '34px' : '30px') + ' sans-serif';
        ctx.fillText(emoji, o.x + o.w / 2, o.y + o.h);
      });

      // Œufs bonus
      ctx.font = '26px sans-serif';
      eggs.forEach(eg => { if (!eg.taken) ctx.fillText('🥚', eg.x + eg.w / 2, eg.y + eg.h); });

      // Rex — clignote légèrement pendant le trébuchement (feedback mignon, pas punitif).
      // Miroir horizontal : l'emoji 🦖 regarde à GAUCHE nativement, Rex court
      // vers la DROITE (retour playtest PY 2026-07-31 « mauvais sens »).
      ctx.save();
      if (rex.stumble > 0 && Math.floor(rex.stumble / 4) % 2 === 0) ctx.globalAlpha = 0.5;
      ctx.font = '46px sans-serif';
      ctx.translate(rex.x + rex.w / 2, rex.y);
      ctx.scale(-1, 1);
      ctx.fillText('🦖', 0, 0);
      ctx.restore();
      ctx.save();
      if (rex.stumble > 0) {
        ctx.font = '20px sans-serif';
        ctx.fillText('😅', rex.x + rex.w / 2 + 26, rex.y - 40);
      }
      ctx.restore();
    }

    function loop(ts) {
      if (!running) return;
      if (!lastTs) lastTs = ts;
      const dtMs = Math.min(48, ts - lastTs);
      lastTs = ts;
      if (!paused) {
        const dt = dtMs / 16.67; // normalisé ~60fps
        update(dt);
        draw();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ── Harnais Playwright : avance le temps de façon DÉTERMINISTE ──
    window.__mjTest = {
      get state() {
        return {
          segIndex, totalSegments: TOTAL_SEGMENTS, level: level(),
          speed, distanceInSegment, segmentDistance: SEGMENT_DISTANCE,
          finished, onGround: rex.onGround, stumbling: rex.stumble > 0,
          obstacles: obstacles.length, eggs: eggs.length,
        };
      },
      setTestMode(on) { testMode = !!on; },
      setDifficulty(lvl) { forcedLevel = Math.max(0, Math.min(2, lvl)); },
      // Avance N frames logiques sans dépendre de requestAnimationFrame (déterministe).
      tick(frames) {
        for (let i = 0; i < (frames || 1); i++) update(1);
      },
      // Force la fin d'un segment immédiatement (chemin gagnant scripté).
      forceEndSegment() {
        distanceInSegment = SEGMENT_DISTANCE;
        update(0.001);
      },
      jump() {
        if (rex.onGround) { rex.vy = JUMP_VY; rex.onGround = false; }
      },
      autoJump: true,
    };
  });
  </script>
</body>
</html>
