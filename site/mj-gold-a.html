<!DOCTYPE html>
<!--
  GOLDEN A - JEU DE REFERENCE STANDARD MAXPLAY
  Mecanique : touche le BUS de la bonne couleur. Celebration : etoile qui se remplit + Mario + confettis.
  Standard : studio/minijeux/docs/STANDARD-MJ.md
  PAR REPONSE : son discret (sndDing) + bille qui se colore. AUCUNE etoile, AUCUN overlay.
  Billes : vert 1er coup / jaune 2e / orange 3e / rouge au-dela.
  FIN SEULEMENT : etoile animee qui se remplit + son Mario power-up + confettis.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MJ-GOLD-A — Trouve le bus</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pips { display:flex; gap:6px; align-items:center; justify-content:center; padding:10px 12px 4px; flex-wrap:wrap; }
    .pip { width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.25); transition:background .3s, transform .2s; }
    .pip.cur { transform:scale(1.25); border-color:#fff; }
    .pip.v1 { background:#00c47a; border-color:#00c47a; }
    .pip.v2 { background:#ffe066; border-color:#ffe066; }
    .pip.v3 { background:#F58443; border-color:#F58443; }
    .pip.v4 { background:#ff4455; border-color:#ff4455; }
    .bus-choices { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:calc(100% - 24px); margin:0 12px; }
    .bus-pick { background:#ffffff10; border:3px solid transparent; border-radius:16px; padding:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; min-height:96px; transition:.12s; }
    .bus-pick:active { transform:scale(.96); }
    .bus-pick.ok { border-color:#00c47a; background:#00c47a22; }
    .bus-pick.ko { border-color:#ff4455; background:#ff445522; opacity:.6; }
    .bus-pick .bus-svg { width:120px; height:auto; pointer-events:none; }

    /* ===== CELEBRATION DE FIN : etoile qui se REMPLIT ===== */
    .end-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; text-align:center; padding:20px; }
    .star-stage { position:relative; width:160px; height:160px; margin-bottom:8px; }
    /* etoile grise (vide) au fond */
    .star-empty, .star-fill {
      position:absolute; inset:0; font-size:9rem; line-height:160px;
    }
    .star-empty { color:#ffffff22; }
    /* etoile doree qui se remplit de bas en haut via clip-path */
    .star-fill {
      color:#ffd633;
      filter:drop-shadow(0 0 14px #ffd63399);
      clip-path: inset(100% 0 0 0);            /* depart : vide */
      transition: clip-path 1.1s cubic-bezier(.2,.8,.2,1);
    }
    .star-fill.full { clip-path: inset(0 0 0 0); }   /* arrivee : pleine */
    .star-stage.pop { animation: starPop .5s ease-out .9s both; }
    @keyframes starPop {
      0%{transform:scale(1)} 40%{transform:scale(1.25) rotate(-6deg)} 70%{transform:scale(.95) rotate(4deg)} 100%{transform:scale(1)}
    }
    .end-title { font-size:2rem; color:var(--accent-gold); margin:6px 0 8px; opacity:0; animation: fadeUp .4s ease .9s forwards; }
    .end-sub { font-size:1.2rem; margin-bottom:24px; opacity:0; animation: fadeUp .4s ease 1.1s forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .end-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; opacity:0; animation: fadeUp .4s ease 1.3s forwards; }
    .end-btns a { padding:16px 30px; border-radius:30px; text-decoration:none; font-weight:900; min-height:56px; display:flex; align-items:center; color:#fff; }
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <a href="index.html" class="back">&#8592;</a>
    <span class="htitle">🚌 Trouve le bus</span>
  </div>
  <div class="pips" id="pips"></div>
  <div class="qbox">
    <div class="qtxt">Touche le bus&nbsp;:</div>
    <div class="qtxt" id="target" style="font-size:1.7rem;color:var(--accent-gold);margin-top:4px;">…</div>
  </div>
  <div class="bus-choices" id="choices"></div>
</div>

<script src="js/sounds.js"></script>
<script src="js/victory-sounds.js"></script>
<script src="js/feedback.js"></script>
<script src="js/bus-svg.js"></script>
<script src="js/data.js"></script>
<script src="js/qcm-retry.js"></script>
<script src="js/tracker.js"></script>
<script src="js/comments.js"></script>
<script src="js/back-button.js"></script>
<script>
  const GAME_ID = 'mj-gold-a';
  const TOTAL_Q = 8;

  const COLORS = [
    { nom:'rouge', hex:'#E2001A' }, { nom:'bleu', hex:'#0064B1' },
    { nom:'vert', hex:'#008C59' },  { nom:'jaune', hex:'#FFCD00' },
    { nom:'rose', hex:'#FF82B4' },  { nom:'orange', hex:'#F58443' },
    { nom:'violet', hex:'#B43C95' },{ nom:'marron', hex:'#8D653A' },
  ];

  let qIndex = 0, qcm = null;

  // Son Mario de victoire = MP3 REEL existant (on ne synthetise rien).
  function sndMarioStar() {
    try { const a = new Audio('sounds/victory-mario-series-hq-super-smash-bros.mp3'); a.volume = 0.85; a.play().catch(() => {}); } catch (e) {}
  }

  function buildPips() {
    const box = document.getElementById('pips'); box.innerHTML = '';
    for (let i = 0; i < TOTAL_Q; i++) {
      const d = document.createElement('div');
      d.className = 'pip' + (i === 0 ? ' cur' : ''); d.id = 'pip' + i;
      box.appendChild(d);
    }
  }
  function colorPip(i, attempts) {
    const p = document.getElementById('pip' + i); if (!p) return;
    p.classList.remove('cur'); p.classList.add('v' + Math.min(attempts, 4));
    const next = document.getElementById('pip' + (i + 1)); if (next) next.classList.add('cur');
  }

  function nextQuestion() {
    if (qIndex >= TOTAL_Q) return showEnd();
    qcm = QcmRetry.create();
    const pool = shuffle(COLORS);
    const target = pool[0];
    const opts = shuffle(pool.slice(0, 4));
    document.getElementById('target').textContent = target.nom.toUpperCase();
    const box = document.getElementById('choices'); box.innerHTML = '';
    opts.forEach(c => {
      const b = document.createElement('button');
      b.className = 'bus-pick';
      if (c.nom === target.nom) b.dataset.correct = '1';
      b.innerHTML = busSVG(c.hex, '#fff', '', 120);
      b.onclick = () => answer(c.nom === target.nom, b);
      box.appendChild(b);
    });
  }

  function answer(correct, btn) {
    const res = QcmRetry.handle(qcm, correct);
    if (res.outcome === 'ignored') return;
    if (typeof Tracker !== 'undefined' && (res.outcome === 'correct' || res.outcome === 'reveal'))
      Tracker.logAnswer(res.outcome === 'correct');

    if (res.outcome === 'correct') {
      btn.classList.add('ok');
      sndDing();                          // son DISCRET, PAS d'etoile/overlay
      colorPip(qIndex, res.attempts);     // la bille se colore = le feedback de progression
      qIndex++;
      setTimeout(nextQuestion, 950);
    } else if (res.outcome === 'reveal') {
      btn.classList.add('ko');
      QcmRetry.revealCorrect(document.getElementById('choices'), 'ok');
      sndBuzz();                          // raté doux, sans drame
      colorPip(qIndex, 4);
      qIndex++;
      setTimeout(nextQuestion, 1400);
    } else {
      btn.classList.add('ko'); btn.disabled = true;
      sndBuzz();                          // on laisse reessayer (zero penalite)
    }
  }

  // ===== PILIER 5 : CELEBRATION DE FIN (etoile qui se remplit + Mario + confettis) =====
  function showEnd() {
    if (typeof Tracker !== 'undefined') Tracker.endSession(TOTAL_Q, TOTAL_Q);
    document.getElementById('app').innerHTML =
      '<div class="end-wrap">'
      + '<div class="star-stage" id="starStage">'
      + '  <div class="star-empty">★</div>'
      + '  <div class="star-fill" id="starFill">★</div>'
      + '</div>'
      + '<div class="end-title">Bravo Max&nbsp;!</div>'
      + '<div class="end-sub">Tu as gagné une étoile&nbsp;!</div>'
      + '<div class="end-btns">'
      + '  <a href="mj-gold-a.html" style="background:var(--accent-success);">🔄 Rejouer</a>'
      + '  <a href="index.html" style="background:#ffffff22;">📋 Menu</a>'
      + '</div></div>';

    // L'etoile se REMPLIT, le son Mario monte EN MEME TEMPS, puis confettis.
    requestAnimationFrame(() => {
      setTimeout(() => {
        document.getElementById('starFill').classList.add('full');
        document.getElementById('starStage').classList.add('pop');
        sndMarioStar();
      }, 120);
      setTimeout(() => { confettiBurst(70); }, 1100);   // confettis quand l'etoile est pleine
    });
  }

  buildPips();
  nextQuestion();
</script>
</body>
</html>
