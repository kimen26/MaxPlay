<header>

    c.fillStyle = ember ? 'rgba(255,' + (120 + 60 * Math.sin(t * 4 + i)) + ',40,.9)' : (i % 2 ? '#2b2624' : '#6b625c');
    c.beginPath(); c.ellipse(px, py, r * 1.3, r, 0, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}
// Parapluie : fermé, tenu comme une canne à l'arrêt ; au départ il monte au-dessus de sa tête, il le prend à
// deux mains et il s'ouvre en hélice.
function drawUmbrella(c, B, k, cx, go, footY) {
  var U = KIT.acc.parapluie, P = KIT.prop; if (!U) return false;
  var u = Math.min(1, go * 2), e = u * u * (3 - 2 * u);
  var hand = [(B.hips[0][0] - cx) * k + B.u * k * 0.22, -tall(B) * k * 0.42];
  var uh = (footY - hand[1]) * 1.25, uw = uh * U.w / U.h;
  var topY = B.stick ? (B.stick[1] - B.bottom) * k : -tall(B) * k * 1.15, topX = B.stick ? (B.stick[0] - cx) * k : 0;
  var x = lerp(hand[0], topX, e) + Math.sin(e * Math.PI) * B.u * k * 0.3, y = lerp(footY - uh / 2 + uh * 0.05, topY - uh * 0.1, e);
  var flip = lerp(0, Math.PI, e);                         // il le retourne : la crosse en bas, dans les mains
  if (go < 0.55) {
    c.save(); c.translate(x, y); c.rotate(flip); c.drawImage(U.img, -uw / 2, -uh / 2, uw, uh); c.restore();
  }
  if (go > 0.45) {                                        // ouverture en hélice
    var o = Math.min(1, (go - 0.45) / 0.3), w = B.u * k * 0.8 * o, h = w * P.h / P.w;
    c.save(); c.translate(topX, topY); c.scale(Math.cos(NOW() * (10 + 20 * go)), 1);
    c.drawImage(P.img, -w / 2, -h / 2, w, h); c.restore();
  }
  return true;
}

// Dino complet. (x, y) = point au sol ; H = hauteur du corps en pixels ; ph = phase du cycle.
var MOUNTS = { meteorite: 1, nuage: 1, cendre: 1 }, FLY = { fusees: 1, helice: 1 };
function baseOf(f) { return f.replace(/[23]$/, ''); }
var SOLES = null, BASE = null, SOOT = false, SOOT_CACHE = {};   // propulseurs du dessin en cours (repère de l'appelant)
function goEase(g) { return 0.5 - 0.5 * Math.cos(Math.max(0, Math.min(1, g)) * Math.PI); }
function drawDino(c, x, y, H, ph, feet, go) {
  go = go === undefined ? 1 : goEase(go);
  var style = feet, ride = baseOf(feet);
  SOOT = ride === 'meteorite';
  // (style, ride définis en tête de fonction)
  if (MOUNTS[ride]) feet = 'nus'; else if (ride === 'fusees') feet = 'fusees';
  BASE = c.getTransform(); SOLES = ride === 'fusees' ? [] : null;
  var flying = (ride === 'fusees' || MOUNTS[ride]) && go > 0.4;
  var posed = state.body === POSED && state.head === POSED;   // poses dessinées pour le Tricératops entier seulement
  var B = (posed && feet === 'skate' && KIT.surf) ? KIT.surf : (posed && style === 'helice' && go > 0.5 && KIT.up) ? KIT.up : (posed && flying && KIT.vol) ? KIT.vol : KIT.bodies[state.body], k = H / (B.refH || B.h), legPx = H * LEG_H, s = legPx / legPiece('nus').h;
  var visible = legPx * (1 - TUCK);
  var bob = bodyBob(feet, ph), spring = feet === 'ressorts' ? 1 - bob.sq * 4 + Math.max(0, -bob.y) * 0.8 : 1;
  var skate = feet === 'skate' ? KIT.acc.skate : null, skH = skate ? B.u * k * 0.62 * skate.h / skate.w : 0;
  c.save();
  c.fillStyle = 'rgba(40,60,20,.18)';
  c.beginPath(); c.ellipse(x, y, B.u * k * 0.32, H * 0.05, 0, 0, Math.PI * 2); c.fill();
  if (RIDES[feet]) { drawRide(c, x, y, H, ph, feet, B, k); c.restore(); return; }
  if (ride === 'meteorite') drawGravel(c, x, y, H, 1 - go * 0.6);
  if (skate) c.drawImage(skate.img, x - B.u * k * 0.31, y - skH, B.u * k * 0.62, skH);
  // Contact au sol (vu à la pelure d'oignon 2026-10-24 : en appui, le pied s'enfonçait sous le sol puis
  // flottait). À chaque image on calcule où tombe le bout de chaque pied, et le corps se pose sur le plus
  // bas : le corps descend quand les jambes s'écartent, le pied d'appui reste collé au sol.
  var cx = (B.hips[0][0] + B.hips[1][0]) / 2, foot = legFoot(feet, s, spring), Lh = legPiece(feet === 'skate' ? 'nus' : feet).h;
  var legs = [[1, false], [0, true]].map(function (q) {
    var i = q[0], front = q[1], hp = B.hips[i], p = legPose(feet, ph + (front ? 0 : 0.5));
    if (ride === 'helice') p = { leg: 1, ang: style === 'helice' ? go * 10 * Math.sin(NOW() * 3 + (front ? 0 : 1.5)) : 0, lift: 0, fold: 1 };
    if (style === 'fusees') p = { leg: 1, ang: go * 3 * Math.sin(NOW() * 2 + (front ? 0 : 1.4)), lift: 0, fold: 1, flame: go };
    if (MOUNTS[ride]) p = { leg: 1, ang: 0, lift: 0, fold: ride === 'meteorite' ? 1 : 1 - 0.7 * go };
    if (feet === 'skate') p.ang = front ? 8 : -6;
    var hx = (hp[0] - cx) * k, hy = -legPx * (front ? TUCK_FRONT : TUCK_BACK) + (hp[1] - B.bottom) * k;
    var footY = hy - p.lift * Lh * s + foot * Math.cos(p.ang * Math.PI / 180) * (p.fold || 1);
    return { i: i, front: front, p: p, hx: hx, hy: hy, footY: footY };
  });
  var stand = legs.map(function (q) { return q.hy + foot; });
  var lowest = (MOUNTS[ride] || FLY[ride]) ? Math.max(stand[0], stand[1]) : Math.max(legs[0].footY, legs[1].footY);
  var A = KIT.acc, mW = B.u * k * (ride === 'meteorite' ? 0.62 : 0.92), mH = MOUNTS[ride] ? mW * A[ride].h / A[ride].w : 0;
  var mountLift = MOUNTS[ride] ? Math.max(H * 0.06, mH * 0.72 - lowest + H * 0.03) : 0;
  var walk = feet === 'nus' || feet === 'baskets';
  var hover = 0.015 * H * Math.sin(NOW() * 3);
  var fly = FLY[ride] ? go * (H * (style === 'helice' ? Math.max(0, go * 2 - 1) * 0.22 : ride === 'helice' ? 0.16 : style === 'fusees' ? 0.2 : 0.12) + hover) : MOUNTS[ride] ? (ride === 'meteorite' ? go * (mH * 0.86 + hover) : go * (mountLift + hover)) : 0;
  var groundUp = lowest + skH * 0.55 - (walk || MOUNTS[ride] || FLY[ride] ? 0 : bob.y * H) + fly;
  c.translate(x, y - groundUp);
  c.scale(1 + bob.sq * 0.6, 1 - bob.sq);
  function leg(i, front) {
    var L = legs.filter(function (q) { return q.front === front; })[0];
    drawLeg(c, L.hx, L.hy, s, L.p, feet, !front, spring);
  }
  leg(1, false);
  if (ride === 'nuage' || ride === 'cendre') drawFootClouds(c, B, k, go, false, mH, groundUp - fly, KIT.acc[ride]);
  var mo = bodyMotion(feet, ph);
  if (feet === 'skate') mo.rot = 4 * Math.sin(ph * Math.PI * 2);   // surfeur : il se balance sur la planche
  // Tête : celle du dessin distinctif de son dino, coupée au cou (NECKS). Poses surfeur, bras levés, vol : Tricératops
  // entier seulement (bras à faire en pièces).
  var Hd = (B.lego || B.nape) ? KIT.heads[state.head] : B;   // corps en pose : dessin entier, tête comprise
  c.save(); c.rotate(mo.rot * Math.PI / 180); drawBody(c, B, k, cx, mo, Hd); c.restore();
  leg(0, true);
  if (style === 'helice' && !drawUmbrella(c, B, k, cx, go, groundUp - fly)) drawPropClimb(c, B, k, cx, go, groundUp - fly, groundUp);
  var footY = groundUp - fly, meteorCy = footY + mH * 0.4;   // météorite : ses pieds posés sur le dessus
  if (MOUNTS[ride] && go > 0.01) drawMount(c, ride, mW, mH, go, B, k, go, ride === 'meteorite' ? meteorCy : undefined);
  if (ride === 'meteorite') drawPebbles(c, B, k, go, footY, meteorCy);
  if (ride === 'nuage' || ride === 'cendre') drawFootClouds(c, B, k, go, true, mH, groundUp - fly, KIT.acc[ride]);
  c.restore();
  c.save(); if (SOLES && SOLES.length) drawJetSmoke(c, y, H, go);
  c.restore();
}

function fit(cv, aspect) {
  var dpr = window.devicePixelRatio || 1, w = cv.clientWidth;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w / aspect * dpr); cv.style.height = (w / aspect) + 'px';
  var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return { c: c, w: w, h: w / aspect };
}
function drawPoses() {
  var N = 6, rowH = 110, cv = document.getElementById('poses'), f = fit(cv, cv.clientWidth / (rowH * FEET.length));
  var cw = f.w / N;
  f.c.clearRect(0, 0, f.w, f.h);
  FEET.forEach(function (ft, r) {
    f.c.fillStyle = r % 2 ? '#f3ecdc' : '#fbf6ea'; f.c.fillRect(0, r * rowH, f.w, rowH);
    for (var i = 0; i < N; i++) drawDino(f.c, cw * (i + 0.5), r * rowH + rowH - 10, rowH * 0.5, i / N, ft, (MOUNTS[baseOf(ft)] || FLY[baseOf(ft)]) ? [0, 0.3, 0.55, 0.8, 1, 1][i] : 1);
    f.c.font = '600 12px system-ui, sans-serif';
    var t = FEET_NAME[ft], tw = f.c.measureText(t).width + 10;
    f.c.fillStyle = 'rgba(255,255,255,.85)'; f.c.fillRect(2, r * rowH + 2, tw, 17);
    f.c.fillStyle = '#5e3b28'; f.c.fillText(t, 7, r * rowH + 15);
  });
}
function labels() {
  document.getElementById('b-head').textContent = 'Tête : ' + KIT.heads[state.head].name;
  document.getElementById('b-body').textContent = 'Corps : ' + KIT.bodies[state.body].name;
  document.getElementById('b-feet').textContent = 'Pieds : ' + FEET_NAME[state.feet];
}
document.getElementById('b-head').onclick = function () { state.head = (state.head + 1) % KIT.heads.length; labels(); drawPoses(); };
document.getElementById('b-body').onclick = function () { state.body = (state.body + 1) % KIT.bodies.length; labels(); drawPoses(); };
document.getElementById('b-feet').onclick = function () { state.feet = FEET[(FEET.indexOf(state.feet) + 1) % FEET.length]; labels(); };

var live;
Promise.all(KIT.heads.concat(KIT.bodies, KIT.surf ? [KIT.surf] : [], KIT.up ? [KIT.up] : [], KIT.vol ? [KIT.vol] : [], KIT.prop ? [KIT.prop] : [], KIT.legs, Object.keys(KIT.shod || {}).map(function (k) { return KIT.shod[k]; }), Object.keys(KIT.acc).map(function (k) { return KIT.acc[k]; })).map(load)).then(function () {
  labels(); drawPoses(); live = fit(document.getElementById('live'), 16 / 9);
  window.addEventListener('resize', function () { drawPoses(); live = fit(document.getElementById('live'), 16 / 9); });
  var dist = 0, lastT = 0;
  (function loop(ms) {
    var t = ms / 1000, c = live.c;
    c.fillStyle = '#d9eef6'; c.fillRect(0, 0, live.w, live.h);
    c.fillStyle = '#b9dc8f'; c.fillRect(0, live.h * 0.8, live.w, live.h * 0.2);
    // Sol qui défile vers l'arrière, à la vitesse du pied posé : le dino avance pour de vrai.
    // Rollers : cycle plus lent (longues glisses) mais sol plus rapide : il file.
    var rate = state.feet === 'rollers' ? 0.75 : 1.4, speed = state.feet === 'rollers' ? 2.2 : 1.4;
    var cyc = t % 5, go = (MOUNTS[baseOf(state.feet)] || FLY[baseOf(state.feet)]) ? (cyc < 1.4 ? 0 : cyc < 2 ? (cyc - 1.4) / 0.6 : cyc < 4.4 ? 1 : 1 - (cyc - 4.4) / 0.6) : 1;
    dist += (t - lastT) * speed * goEase(go); lastT = t;
    var H = live.h * 0.45, step = H * 0.62, x0 = -((dist * step) % (live.w / 5));
    c.fillStyle = '#9cc873';
    for (var gx = x0; gx < live.w + 20; gx += live.w / 5) { c.beginPath(); c.ellipse(gx, live.h * 0.9, live.w * 0.03, live.h * 0.015, 0, 0, Math.PI * 2); c.fill(); }
    drawDino(c, live.w / 2, live.h * 0.86, H, t * rate, state.feet, go);
    requestAnimationFrame(loop);
  })(0);
  window.__jambes = { state: state, drawPoses: drawPoses, draw: drawDino, ready: true };
});
})();
</script>
