<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 3 — Monte dans le Bus !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body {
    font-family:'Nunito',sans-serif; font-weight:700; color:#fff;
    min-height:100dvh; overflow-x:hidden;
    background:linear-gradient(180deg,#0a0e2a 0%, #141a3d 55%, #1d1440 100%);
    display:flex; justify-content:center;
  }
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star {
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:#fff; opacity:.7; animation:twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:.9} }
  .stage { position:relative; z-index:2; width:100%; max-width:520px; min-height:100dvh; padding:64px 16px 30px; display:flex; flex-direction:column; align-items:center; }

  .band {
    position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:60;
    display:flex; gap:10px; align-items:center; white-space:nowrap;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,209,102,.4); border-radius:999px;
    padding:6px 16px; font-size:12px; font-weight:900; color:#ffe066; backdrop-filter:blur(6px);
  }
  .band a { color:#ffd166; text-decoration:none; }

  .consigne {
    text-align:center; background:rgba(0,0,0,.45); border:2px solid rgba(255,209,102,.5);
    border-radius:22px; padding:14px 24px; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .consigne h1 { font-family:'Fredoka One',cursive; font-size:clamp(21px,5.8vw,29px); color:#ffe066; letter-spacing:1px; }
  .consigne p { font-size:15px; color:rgba(255,255,255,.85); margin-top:4px; }

  /* ── Affichage LED ── */
  .led {
    margin-top:20px; background:#050505; border:3px solid #333; border-radius:16px;
    padding:12px 30px; min-width:230px; text-align:center;
    box-shadow:0 0 0 4px rgba(0,0,0,.6), 0 0 30px rgba(255,209,102,.25), inset 0 0 22px rgba(0,0,0,.9);
  }
  .led .big {
    font-family:'Fredoka One',cursive; font-size:52px; line-height:1; color:#ffd166;
    text-shadow:0 0 8px rgba(255,209,102,.9), 0 0 22px rgba(255,209,102,.55);
    letter-spacing:2px; display:inline-block;
  }
  .led .big.tick { animation:ledTick .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes ledTick { 0%{transform:scale(1.6); opacity:.3} 100%{transform:scale(1); opacity:1} }
  .led .lbl {
    font-size:13px; font-weight:900; letter-spacing:4px; color:rgba(255,209,102,.75);
    text-shadow:0 0 8px rgba(255,209,102,.6); margin-top:2px;
  }

  /* ── Scène bus ── */
  .scene {
    position:relative; width:100%; max-width:470px; margin-top:16px;
    padding-top:8px;
  }
  .arret { position:absolute; left:-4px; bottom:66px; width:110px; z-index:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .bus-wrap {
    position:relative; width:340px; max-width:86%; margin-left:auto; z-index:3;
    transition:transform 2.4s cubic-bezier(.55,.06,.68,.19);
  }
  .bus-wrap.depart { transform:translateX(135vw); }
  .bus-wrap svg { width:100%; height:auto; display:block; filter:drop-shadow(0 10px 14px rgba(0,0,0,.55)); }
  .slots {
    position:absolute; left:5%; top:14%; width:46%; height:53%;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr; gap:5%;
    pointer-events:none;
  }
  .slot {
    border-radius:9px; background:rgba(30,60,90,.55); border:1.5px solid rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .slot img { width:92%; height:92%; object-fit:contain; border-radius:8px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .road {
    position:relative; height:74px; margin-top:-6px; border-radius:14px;
    background:linear-gradient(180deg,#3a3f4a 0%, #23262e 100%);
    box-shadow:inset 0 4px 8px rgba(0,0,0,.5); z-index:2;
    overflow:hidden;
  }
  .road::after {
    content:''; position:absolute; top:50%; left:0; right:0; height:4px;
    background:repeating-linear-gradient(90deg,#ffd166 0 26px, transparent 26px 52px);
    opacity:.55;
  }

  /* ── Passagers qui attendent ── */
  .waiting {
    display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; justify-content:center;
    min-height:96px; z-index:5;
  }
  .passenger {
    width:86px; height:86px; border-radius:22px; border:3px solid rgba(255,209,102,.55);
    background:linear-gradient(160deg,#2b2350,#1a1535); padding:6px; cursor:pointer;
    transition:transform .15s ease, box-shadow .2s;
    touch-action:manipulation;
    animation:bob 2.8s ease-in-out infinite;
  }
  .passenger:nth-child(2){animation-delay:-.6s} .passenger:nth-child(3){animation-delay:-1.2s}
  .passenger:nth-child(4){animation-delay:-1.8s} .passenger:nth-child(5){animation-delay:-2.2s}
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .passenger:active { transform:scale(.92); }
  .passenger img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .passenger.flying { animation:none; z-index:40; box-shadow:0 0 24px rgba(255,209,102,.7); }
  .passenger.in-bus {
    width:100%; height:100%; border:none; background:transparent;
    padding:0; cursor:default; animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }

  .go-btn {
    margin-top:20px; display:none; border:none; cursor:pointer;
    font-family:'Fredoka One',cursive; font-size:24px; letter-spacing:1px;
    color:#2a1c05; min-height:84px; padding:0 46px; border-radius:999px;
    background:linear-gradient(145deg,#7fe7c4,#2fbf8f);
    box-shadow:0 7px 0 #157a56, 0 14px 26px rgba(0,0,0,.45);
    animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  .go-btn.show { display:inline-block; }
  .go-btn:active { transform:scale(.92); }

  .message {
    min-height:34px; margin-top:16px; text-align:center;
    font-family:'Fredoka One',cursive; font-size:22px; color:#ffe066;
    opacity:0; transition:opacity .25s;
  }
  .message.show { opacity:1; animation:msgPop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes msgPop { from{transform:scale(.6)} to{transform:scale(1)} }
</style>
</head>
<body>
<div class="band">🎨 Maquette — Concept 3 <a href="index.html">← Sommaire</a></div>
<div class="stars" id="stars"></div>

<div class="stage">
  <div class="consigne">
    <h1>🦕 Fais monter les dinos !</h1>
    <p>Touche chaque dino pour le faire monter dans le bus.</p>
  </div>

  <div class="led">
    <span class="big" id="ledNum">0</span>
    <div class="lbl">PASSAGERS</div>
  </div>

  <div class="scene">
    <img class="arret" src="../img/decor/arret_bus.png" alt="arrêt de bus">
    <div class="bus-wrap" id="busWrap">
      <div id="busSvgHost"></div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="road"></div>
  </div>

  <div class="waiting" id="waiting"></div>

  <button class="go-btn" id="goBtn">C'est parti ! 🚀</button>
  <div class="message" id="message"></div>
</div>

<script src="../js/bus-svg.js"></script>
<script>
(function () {
  'use strict';
  var PASSENGERS = [
    '../img/avatars/allo_joyeux_1.png',
    '../img/avatars/anky_joyeux_4.png',
    '../img/avatars/velo_joyeux_1.png',
    '../img/avatars/galli_joyeux_1.png',
    '../img/avatars/cory_joyeux_1.png'
  ];
  var waiting = document.getElementById('waiting');
  var slotsEl = document.getElementById('slots');
  var ledNum = document.getElementById('ledNum');
  var goBtn = document.getElementById('goBtn');
  var msgEl = document.getElementById('message');
  var busWrap = document.getElementById('busWrap');
  var count = 0;
  var departed = false;

  // Bus canonique (ligne 162, fenêtre destination rouge IDFM)
  document.getElementById('busSvgHost').innerHTML = busSVG('#E2001A', '#fff', '162', 340);

  // Étoiles du ciel de nuit
  var starsEl = document.getElementById('stars');
  for (var s = 0; s < 40; s++) {
    var st = document.createElement('div');
    st.className = 'star';
    st.style.left = Math.random() * 100 + 'vw';
    st.style.top = Math.random() * 45 + 'vh';
    st.style.animationDelay = (Math.random() * 2.6) + 's';
    starsEl.appendChild(st);
  }

  PASSENGERS.forEach(function () {
    var slot = document.createElement('div');
    slot.className = 'slot';
    slotsEl.appendChild(slot);
  });

  function sfx(src) {
    try { var a = new Audio(src); a.volume = 0.55; a.play().catch(function () {}); } catch (e) {}
  }
  function say(text) {
    msgEl.textContent = text;
    msgEl.classList.remove('show');
    void msgEl.offsetWidth;
    msgEl.classList.add('show');
  }
  function tickLED() {
    ledNum.textContent = count;
    ledNum.classList.remove('tick');
    void ledNum.offsetWidth;
    ledNum.classList.add('tick');
  }

  PASSENGERS.forEach(function (src) {
    var p = document.createElement('div');
    p.className = 'passenger';
    p.innerHTML = '<img src="' + src + '" alt="dino passager">';
    p.addEventListener('click', function () { board(p); });
    waiting.appendChild(p);
  });

  function board(p) {
    if (departed || p.classList.contains('flying') || p.classList.contains('in-bus')) return;
    var slot = slotsEl.children[count];
    var r1 = p.getBoundingClientRect();
    var r2 = slot.getBoundingClientRect();
    var dx = (r2.left + r2.width / 2) - (r1.left + r1.width / 2);
    var dy = (r2.top + r2.height / 2) - (r1.top + r1.height / 2);
    p.classList.add('flying');
    p.style.transition = 'transform .65s cubic-bezier(.34,1.3,.64,1)';
    p.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.55)';
    sfx('../sounds/fx/boing.mp3');
    setTimeout(function () {
      slot.appendChild(p);
      p.style.transition = 'none';
      p.style.transform = '';
      p.classList.remove('flying');
      p.classList.add('in-bus');
      count++;
      tickLED();
      if (count === PASSENGERS.length) {
        say('Tout le monde est monté ! 🎉');
        goBtn.classList.add('show');
        sfx('../sounds/fx/waouh.mp3');
      } else {
        say(count === 1 ? '1 passager !' : count + ' passagers !');
      }
    }, 680);
  }

  goBtn.addEventListener('click', function () {
    if (departed) return;
    departed = true;
    goBtn.classList.remove('show');
    say('Le bus part avec ' + count + ' dinos ! Bravo ! 🦕🎉');
    sfx('../sounds/fx/demarrage-bus.mp3');
    busWrap.classList.add('depart');
  });
})();
</script>
</body>
</html>
