<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 13 — Mot → Image</title>
<link rel="stylesheet" href="../design-shared/mockup.css">
<style>
  /* ── Le mot à lire ── */
  .mot-affiche {
    margin-top:26px; display:flex; align-items:center; gap:16px;
    background:rgba(255,255,255,.04); border:2px solid rgba(255,209,102,.35);
    border-radius:26px; padding:18px 30px;
    box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 0 40px rgba(20,16,60,.6);
  }
  .mot-lu {
    font-size:88px; color:#ffe066;
    text-shadow:0 0 26px rgba(255,209,102,.8);
    line-height:1;
  }
  .btn-son {
    min-width:80px; min-height:80px; border:none; border-radius:50%; cursor:pointer;
    font-size:36px; background:linear-gradient(145deg,#ffe066,#f0b73f);
    box-shadow:0 5px 0 #b8860b; touch-action:manipulation;
  }
  .btn-son:active { transform:scale(.92); }
  .answers .card { min-width:130px; min-height:130px; }
  .img-choix { font-size:72px; line-height:1; }
</style>
</head>
<body>
<div class="band">🎨 Maquette — Concept 13 <a href="index.html">← Sommaire</a></div>

<div class="stage">
  <div class="consigne">
    <h1>📖 Lis le mot !</h1>
    <p>Lis le mot et tape la bonne image !</p>
  </div>

  <div class="mot-affiche">
    <div class="mot-lu cur" id="motLu">lune</div>
    <button class="btn-son" id="btnSon" aria-label="écouter le mot">🔊</button>
  </div>

  <div class="answers" id="choix">
    <button class="card" data-img="lune"><span class="img-choix">🌙</span></button>
    <button class="card" data-img="soleil"><span class="img-choix">🌞</span></button>
    <button class="card" data-img="etoile"><span class="img-choix">⭐</span></button>
  </div>

  <div class="message" id="message"></div>
</div>

<script src="../design-shared/mockup.js"></script>
<script>
/* NOTE : la banque de mots suivra les paliers graphémiques P2→P5
   (démo figée sur « lune » — données en dur). */
(function () {
  'use strict';
  MK.stars();

  var choix = document.getElementById('choix');
  var locked = false;

  function direMot() {
    MK.speak('lu… ne… lune !', { rate: 0.65 });
  }

  document.getElementById('btnSon').addEventListener('click', function () {
    MK.pop(document.getElementById('motLu'));
    direMot();
  });

  Array.prototype.forEach.call(choix.querySelectorAll('.card'), function (card) {
    card.addEventListener('click', function () {
      if (locked) return;
      if (card.dataset.img === 'lune') {
        locked = true;
        MK.win(card, choix);
        MK.speak('lune !', { rate: 0.75 });
        setTimeout(function () {
          MK.celebrate('BRAVO ! 🎉', 'tada.mp3');
          MK.say('Tu as lu le mot « lune » tout seul !');
        }, 900);
      } else {
        MK.non(card, 'Lis avec moi : lu… ne… lune ! La lune brille la nuit !');
        direMot();
      }
    });
  });

  /* Intro */
  setTimeout(function () {
    MK.say('Lis le mot et tape la bonne image !');
    direMot();
  }, 700);
})();
</script>
</body>
</html>
