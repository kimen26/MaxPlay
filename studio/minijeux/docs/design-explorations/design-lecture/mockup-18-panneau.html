<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 18 — Le Panneau du 185</title>
<link rel="stylesheet" href="../design-shared/mockup.css">
<style>
  /* ── Le poteau d'arrêt style RATP/IDFM ── */
  .arret { margin-top:26px; display:flex; flex-direction:column; align-items:center; }
  .panneau {
    width:100%; max-width:340px; border-radius:14px; overflow:hidden;
    border:3px solid #e8e8e8; box-shadow:0 14px 34px rgba(0,0,0,.55);
    font-family:'Nunito',sans-serif;
  }
  .bandeau-bus {
    background:#0055a4; color:#fff; text-align:center;
    font-weight:900; font-size:22px; letter-spacing:6px; padding:8px 0;
  }
  .corps { background:#1c2a4a; padding:16px 18px 18px; }
  .ligne-row { display:flex; align-items:center; gap:14px; }
  .pastille {
    flex:0 0 auto; min-width:74px; height:54px; border-radius:12px;
    background:#F58443; color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka One',cursive; font-size:30px;
    box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .direction { color:#fff; line-height:1.2; }
  .direction .mot-direction {
    display:block; font-weight:900; font-size:14px; letter-spacing:2px;
    color:rgba(255,255,255,.75);
  }
  .direction .mot-direction.clignote { animation:mk-clignote 1.1s ease-in-out 3; }
  @keyframes mk-clignote { 0%,100%{opacity:1} 50%{opacity:.25} }
  .direction .destination {
    display:block; font-weight:900; font-size:27px; letter-spacing:1px; padding:0 2px;
    border-radius:8px;
  }
  .direction .destination.surligne { background:rgba(245,132,67,.9); color:#fff; }
  .poteau {
    width:16px; height:120px;
    background:linear-gradient(90deg,#9a9a9a,#cfcfcf 45%,#8a8a8a);
    border-radius:6px 6px 0 0;
  }
  .trottoir {
    width:100%; max-width:340px; height:12px; border-radius:6px;
    background:repeating-linear-gradient(90deg,#3a3a55 0 30px,#2c2c44 30px 60px);
  }

  /* ── Choix en capitales (monde réel) ── */
  .choix-btn {
    min-width:230px; min-height:80px; border:none; border-radius:20px; cursor:pointer;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:23px; letter-spacing:1px;
    color:#2a1c05; background:linear-gradient(145deg,#ffe066,#f0b73f);
    box-shadow:0 6px 0 #b8860b, 0 12px 22px rgba(0,0,0,.45);
    transition:transform .12s ease; touch-action:manipulation; padding:10px 18px;
  }
  .choix-btn:active { transform:scale(.93); }
  .choix-btn.win {
    background:linear-gradient(145deg,#7fe7c4,#2fbf8f);
    box-shadow:0 6px 0 #157a56, 0 0 26px rgba(47,191,143,.7); color:#062e20;
  }

  /* ── Arrivée du bus ── */
  .bus-arrivee {
    margin-top:18px; width:100%; max-width:340px; min-height:90px; overflow:hidden;
    display:flex; align-items:center;
  }
  .bus-arrivee .bus-anim { transform:translateX(-120%); transition:transform 1.6s cubic-bezier(.2,.8,.3,1); }
  .bus-arrivee .bus-anim.arrive { transform:translateX(0); }

  .ecoute {
    border:none; border-radius:999px; cursor:pointer;
    min-width:80px; min-height:80px; font-size:34px;
    background:linear-gradient(145deg,#4a3f8f,#332a6b); box-shadow:0 5px 0 #241d4e;
    touch-action:manipulation;
  }
  .ecoute:active { transform:scale(.92); }
</style>
</head>
<body>
<div class="band">🎨 Maquette — Concept 18 <a href="index.html">← Sommaire</a></div>

<div class="stage">
  <div class="consigne">
    <h1>🚏 Le Panneau du 185</h1>
    <p>Où va le 185 ? <b>Lis le panneau !</b>
      <button class="ecoute" id="btnEcoute" aria-label="Écouter la consigne">🔊</button>
    </p>
  </div>

  <div class="arret">
    <div class="panneau">
      <div class="bandeau-bus">BUS</div>
      <div class="corps">
        <div class="ligne-row">
          <div class="pastille">185</div>
          <div class="direction">
            <span class="mot-direction" id="motDirection">DIRECTION</span>
            <span class="destination" id="destination">PORTE D'ITALIE</span>
          </div>
        </div>
      </div>
    </div>
    <div class="poteau"></div>
    <div class="trottoir"></div>
  </div>

  <div class="answers" id="choix" style="flex-direction:column; align-items:center;"></div>

  <div class="bus-arrivee" id="busArrivee"></div>
  <div class="message" id="message"></div>
</div>

<script src="../js/bus-svg.js"></script>
<script src="../design-shared/mockup.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   EXCEPTION CAPITALES (assumée) : contrairement à la règle d'or
   « tout texte lu par l'enfant en .cur », CE mockup met volontairement
   le texte en CAPITALES — c'est de la lecture utilitaire « monde réel » :
   les panneaux RATP/IDFM sont en capitales, et l'enfant apprend à les
   déchiffrer tels quels (pont vers la lecture hors du jeu).
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  MK.stars();

  var BONNE = "PORTE D'ITALIE";
  var choixEl = document.getElementById('choix');
  var destination = document.getElementById('destination');
  var motDirection = document.getElementById('motDirection');
  var busArrivee = document.getElementById('busArrivee');
  var locked = false;

  document.getElementById('btnEcoute').addEventListener('click', function () {
    MK.speak('Où va le cent quatre-vingt-cinq ? Lis le panneau !', { rate: 0.85 });
  });

  ["PORTE D'ITALIE", 'MONTPARNASSE', 'LOUIS ARAGON'].forEach(function (nom) {
    var b = document.createElement('button');
    b.className = 'choix-btn';
    b.textContent = nom;
    b.addEventListener('click', function () { onPick(nom, b); });
    choixEl.appendChild(b);
  });

  function onPick(nom, btn) {
    if (locked) return;
    if (nom !== BONNE) {
      MK.non(btn, 'Lis sur le panneau, là-haut !');
      /* Le mot DIRECTION clignote doucement pour guider le regard */
      motDirection.classList.remove('clignote'); void motDirection.offsetWidth;
      motDirection.classList.add('clignote');
      return;
    }
    locked = true;
    MK.win(btn, choixEl);
    /* Le texte du panneau se surligne : c'était écrit là ! */
    destination.classList.add('surligne');
    MK.sfx('bonne-reponse.mp3');
    /* Le bus 185 arrive (freinage) */
    setTimeout(busQuiArrive, 600);
  }

  function busQuiArrive() {
    var d = document.createElement('div');
    d.className = 'bus-anim';
    d.innerHTML = busSVG('#F58443', '#fff', '185', 280);
    busArrivee.appendChild(d);
    MK.sfx('frein-bus.mp3');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { d.classList.add('arrive'); });
    });
    MK.speak("Direction Porte d'Italie !", { rate: 0.85 });
    setTimeout(function () {
      MK.celebrate("Direction Porte d'Italie ! 🚏", 'tada.mp3');
    }, 1700);
  }
})();
</script>
</body>
</html>
