<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V5 « La Vallée » — P0 mockup v3 (spec Mur v2, 2026-07-29)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:'Nunito',sans-serif; background:#7ec8f2; }

  .poc-tag {
    position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:80;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); border-radius:999px;
    font:800 11px 'Nunito'; padding:4px 12px; color:#e8f2ff; white-space:nowrap;
  }
  .poc-tag a { color:#ffd166; text-decoration:none; }

  /* ── SCÈNE : remplit TOUT l'écran (pas de letterbox).
        Tailles en vmin (proportionnel au plus petit côté) + positions en % :
        la composition tient en paysage ET en portrait. ── */
  .stage { position:fixed; inset:0; overflow:hidden; }

  .ciel {
    position:absolute; inset:0 0 60% 0;
    background:linear-gradient(180deg,#8fd4ff 0%,#bfe8ff 70%,#d8f3ff 100%);
  }
  .colline {
    position:absolute; left:-10%; right:-10%; top:30%; height:34%;
    background:linear-gradient(180deg,#7cc46a,#5da84f);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .colline.c2 { top:44%; height:36%; background:linear-gradient(180deg,#6ab85a,#4e9a42); opacity:.9; }
  .sol {
    position:absolute; inset:58% 0 0 0;
    background:linear-gradient(180deg,#5da84f 0%,#4c9440 55%,#3f8038 100%);
  }
  .nuage { position:absolute; width:14vmin; opacity:.9; animation:drift 70s linear infinite; }
  .nuage.n2 { width:10vmin; top:6%; animation-duration:95s; animation-delay:-40s; }
  @keyframes drift { from { transform:translateX(-20vw); } to { transform:translateX(115vw); } }

  /* ── ROUTE + BUS (sur la route, rare, klaxonne au tap) ── */
  .route {
    position:absolute; left:-5%; right:-5%; bottom:2.5%; height:clamp(46px,8vh,62px);
    background:#8d8d94; border-top:5px solid #76767d; border-bottom:5px solid #76767d;
    transform:rotate(-1.2deg);
  }
  .route::after {
    content:''; position:absolute; left:0; right:0; top:50%; height:4px; margin-top:-2px;
    background:repeating-linear-gradient(90deg,#f5f5f0 0 34px,transparent 34px 62px);
    opacity:.85;
  }
  .bus {
    position:absolute; left:0; bottom:calc(2.5% + 6px); cursor:pointer; z-index:5;
    width:clamp(120px,22vmin,175px);
    transform:translateX(-40vw) rotate(-1.2deg); opacity:0;
  }
  .bus svg { width:100%; height:auto; display:block; }
  .bus.roule { transition:transform 9s linear, opacity .5s; transform:translateX(115vw) rotate(-1.2deg); opacity:1; }
  .bus.bip { animation:bip .35s ease-in-out 2; }
  @keyframes bip { 0%,100% { margin-bottom:0; } 50% { margin-bottom:10px; } }
  .arret { position:absolute; bottom:calc(2.5% + 60px); right:7%; width:clamp(36px,7vmin,52px); z-index:4; }

  /* ── DÉCOR (assets existants img/decor) ── */
  .decor { position:absolute; pointer-events:none; }
  .decor img { width:100%; display:block; filter:drop-shadow(0 8px 10px rgba(20,60,20,.28)); }
  .volcan { left:3%; top:17%; width:clamp(140px,29vmin,225px); }
  .sapin1 { left:57%; top:15%; width:clamp(76px,16vmin,125px); }
  .sapin2 { left:67%; top:20%; width:clamp(54px,11vmin,88px); }
  .fougere1 { left:40%; top:52%; width:clamp(66px,14vmin,108px); }
  .fougere2 { left:51%; top:57%; width:clamp(46px,10vmin,76px); }
  .rocher1 { left:6%; top:54%; width:clamp(84px,18vmin,138px); }
  .palmier { left:85%; top:20%; width:clamp(66px,14vmin,108px); }
  .mare {
    position:absolute; left:64%; top:45%; width:min(330px,32vw); height:min(180px,22vh);
    pointer-events:none;
    background:radial-gradient(ellipse at 45% 40%, #9fdcf5 0%, #5cb6e8 55%, #3f9ad4 100%);
    border-radius:48% 52% 55% 45% / 58% 60% 40% 42%;
    box-shadow:inset 0 -8px 18px rgba(20,80,140,.35), 0 6px 12px rgba(20,60,20,.22);
  }
  .mare::after {
    content:''; position:absolute; left:18%; top:24%; width:34%; height:16%;
    background:rgba(255,255,255,.5); border-radius:50%; filter:blur(4px);
    animation:reflet 5s ease-in-out infinite alternate;
  }
  @keyframes reflet { from { transform:translateX(0); opacity:.35; } to { transform:translateX(26px); opacity:.6; } }

  /* ── PERSONNAGES — échelle RESSERRÉE (tous lisibles, ratio max ~1.25) :
        T-Rex 150 · Spino 148 · Tritri 140 · Galli 128 · Volta 124 · Troudi 118 ── */
  .perso { position:absolute; cursor:pointer; z-index:10; }
  .perso img { width:100%; display:block; filter:drop-shadow(0 6px 6px rgba(20,50,20,.3)); transition:transform .15s; }
  .perso:active img { transform:scale(1.08); }
  .p-volta { left:19%; top:35%; width:clamp(70px,16vmin,124px); z-index:12; }
  .p-galli { left:62%; top:39%; width:clamp(74px,16.5vmin,128px); }
  .p-spino { left:62%; top:54%; width:clamp(92px,20vmin,148px); }
  .p-troudi { left:17%; top:67%; width:clamp(68px,15.5vmin,118px); }
  .p-tritri { left:43%; top:64%; width:clamp(84px,18.5vmin,140px); }
  .p-trex { left:77%; top:63%; width:clamp(92px,20.5vmin,150px); }
  .ombre-sol {
    position:absolute; left:14%; right:14%; bottom:-6px; height:16px; z-index:-1;
    background:radial-gradient(ellipse, rgba(15,45,15,.35), transparent 70%);
  }
  .etag {
    position:absolute; left:50%; transform:translateX(-50%); bottom:-22px;
    font:900 11px 'Nunito'; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);
    background:rgba(30,70,30,.45); border-radius:999px; padding:2px 9px; white-space:nowrap;
  }
  .p-volta .ombre-sol { bottom:-40px; transform:scale(.65); opacity:.5; }

  @keyframes flaner1 { 0%,18% { transform:translate(0,0); } 34%,52% { transform:translate(24px,-8px); } 68%,84% { transform:translate(-16px,6px); } 100% { transform:translate(0,0); } }
  @keyframes flaner2 { 0%,22% { transform:translate(0,0); } 40%,58% { transform:translate(-22px,-9px); } 76%,90% { transform:translate(15px,7px); } 100% { transform:translate(0,0); } }
  @keyframes flaner3 { 0%,26% { transform:translate(0,0); } 44%,60% { transform:translate(18px,9px); } 78%,92% { transform:translate(-20px,-6px); } 100% { transform:translate(0,0); } }
  @keyframes vol { 0%,20% { transform:translate(0,0); } 45%,60% { transform:translate(30px,-20px); } 82%,94% { transform:translate(-24px,-9px); } 100% { transform:translate(0,0); } }
  .perso .move { animation-duration:17s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
  .p-spino .move { animation-name:flaner1; }
  .p-galli .move { animation-name:flaner2; animation-duration:19s; }
  .p-troudi .move { animation-name:flaner3; animation-duration:15s; }
  .p-tritri .move { animation-name:flaner2; animation-duration:21s; animation-delay:-8s; }
  .p-volta .move { animation-name:vol; animation-duration:13s; }

  .p-trex .anneau {
    position:absolute; inset:-10px; border-radius:50%;
    border:3px solid rgba(255,209,102,.9);
    animation:pulse 2.2s ease-in-out infinite; pointer-events:none;
  }
  @keyframes pulse { 0%,100% { transform:scale(.96); opacity:.55; } 50% { transform:scale(1.06); opacity:1; } }
  .livre {
    position:absolute; right:-4px; bottom:8px; width:32px; height:24px;
    background:linear-gradient(90deg,#c0453e 0 48%,#a83732 52% 100%);
    border-radius:4px 4px 6px 6px; box-shadow:0 3px 5px rgba(0,0,0,.35);
  }
  .livre::after { content:''; position:absolute; left:48%; top:2px; bottom:2px; width:2px; background:#f3e9d2; }

  /* ── BULLES ── */
  .bulle {
    position:fixed; z-index:50; min-width:150px; max-width:230px;
    background:#fff; color:#233; border-radius:18px; padding:12px 16px;
    font-family:'Fredoka One'; font-size:17px; text-align:center; line-height:1.3;
    box-shadow:0 8px 22px rgba(0,0,0,.28); display:none;
  }
  .bulle::after {
    content:''; position:absolute; left:50%; bottom:-10px; margin-left:-10px;
    border:10px solid transparent; border-top-color:#fff; border-bottom:0;
  }
  .bulle .choix {
    display:block; margin-top:9px; background:#eef4ff; border:2px solid #cdd9f5;
    border-radius:12px; padding:10px 8px; font:900 14px 'Nunito'; color:#2a3f6e;
  }
  .bulle .choix + .choix { margin-top:7px; }

  .pensee {
    position:fixed; z-index:49; width:74px; height:60px; display:none;
    background:#fff; border-radius:50%; box-shadow:0 5px 14px rgba(0,0,0,.22);
    align-items:center; justify-content:center; cursor:pointer;
  }
  .pensee::before, .pensee::after {
    content:''; position:absolute; background:#fff; border-radius:50%;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  .pensee::before { width:16px; height:16px; left:2px; bottom:-14px; }
  .pensee::after { width:9px; height:9px; left:-6px; bottom:-26px; }
  .pensee .vig-oeufs { display:flex; gap:5px; }
  .pensee .vig-oeufs i { width:14px; height:18px; background:#ffd166; border-radius:50% 50% 46% 46%; box-shadow:inset 0 -3px 4px rgba(160,100,0,.35); }

  /* ── HEADER : identité seule ── */
  .hdr {
    position:absolute; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; gap:10px; padding:12px 16px;
  }
  .hdr .chip { position:relative; width:clamp(40px,8vmin,56px); height:clamp(40px,8vmin,56px); }
  .hdr .chip img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .hdr .who { display:flex; flex-direction:column; line-height:1.15; }
  .hdr .pseudo { font-family:'Fredoka One'; font-size:clamp(15px,2.6vmin,19px); color:#fff; text-shadow:0 2px 4px rgba(0,60,120,.4); }
  .hdr .stars { font:900 13px 'Nunito'; color:#7a5800; background:#ffd166; border-radius:999px; padding:2px 9px; width:max-content; box-shadow:0 2px 5px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="poc-tag">P0 mockup v3 — spec « La Vallée » · plein écran, portrait OK · <a href="index.html">← POCs</a></div>

<div class="stage" id="stage">
  <div class="ciel"></div>
  <img class="nuage" style="top:9%" src="../img/decor/nuage_blanc.png" alt="">
  <img class="nuage n2" src="../img/decor/nuage_blanc.png" alt="">
  <div class="colline"></div>
  <div class="colline c2"></div>
  <div class="sol"></div>

  <div class="decor volcan"><img src="../img/decor/volcan_fumant.png" alt=""></div>
  <div class="decor sapin1"><img src="../img/decor/sapin.png" alt=""></div>
  <div class="decor sapin2"><img src="../img/decor/sapin.png" alt=""></div>
  <div class="decor palmier"><img src="../img/decor/palmier.png" alt=""></div>
  <div class="decor fougere1"><img src="../img/decor/fougere.png" alt=""></div>
  <div class="decor fougere2"><img src="../img/decor/fougere.png" alt=""></div>
  <div class="decor rocher1"><img src="../img/decor/rocher.png" alt=""></div>
  <div class="mare"></div>

  <div class="route"></div>
  <div class="bus" id="bus"></div>
  <img class="arret" src="../img/decor/arret_bus.png" alt="">

  <div class="perso p-volta" data-nom="Volta" data-phrase="Ici, on voyage !">
    <div class="move"><img src="../img/avatars/ptero_joyeux_1.png" alt="Volta"></div>
    <div class="ombre-sol"></div><div class="etag">Volta · voyage</div>
  </div>
  <div class="perso p-galli" data-nom="Galli" data-phrase="Ici, on lit !">
    <div class="move"><img src="../img/avatars/galli_joyeux_1.png" alt="Galli"></div>
    <div class="ombre-sol"></div><div class="etag">Galli · lire</div>
  </div>
  <div class="perso p-spino" data-nom="Spino" data-phrase="Ici, on compte !">
    <div class="move"><img src="../img/avatars/spino_joyeux_1.png" alt="Spino"></div>
    <div class="ombre-sol"></div><div class="etag">Spino · compter</div>
  </div>
  <div class="perso p-troudi" data-nom="Troudi" data-phrase="Ici, on réfléchit !">
    <div class="move"><img src="../img/avatars/velo_joyeux_1.png" alt="Troudi"></div>
    <div class="ombre-sol"></div><div class="etag">Troudi · réfléchir</div>
  </div>
  <div class="perso p-tritri" data-nom="Tritri" data-phrase="Viens voir les dinos !">
    <div class="move"><img src="../img/avatars/tritri_joyeux_3.png" alt="Tritri"></div>
    <div class="ombre-sol"></div><div class="etag">Tritri · jeux dino</div>
  </div>
  <div class="perso p-trex" data-nom="Roi T-Rex">
    <div class="anneau"></div>
    <img src="../img/avatars/trex_joyeux_1.png" alt="Roi T-Rex">
    <div class="livre"></div>
    <div class="ombre-sol"></div><div class="etag">Roi T-Rex · monde dino</div>
  </div>

  <div class="pensee" id="pensee">
    <div class="vig-oeufs"><i></i><i></i><i></i></div>
  </div>

  <div class="bulle" id="bulle"></div>

  <div class="hdr">
    <div class="chip"><img src="../img/avatars/stego_joyeux_1.png" alt=""></div>
    <div class="who">
      <span class="pseudo">Max</span>
      <span class="stars">⭐ 12</span>
    </div>
  </div>
</div>

<script src="../js/bus-svg.js"></script>
<script>
  // ── bus 162 : roule SUR la route, rare (1re fois ~18s, puis ~60s),
  //    klaxonne et saute quand on le touche ──
  var bus = document.getElementById('bus');
  bus.innerHTML = busSVG('#E2001A', '#fff', '162', 175);

  var ac = null;
  function klaxon() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22].forEach(function (t) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = 392;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.18);
        o.connect(g).connect(ac.destination);
        o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.2);
      });
    } catch (e) {}
  }
  bus.addEventListener('pointerdown', function (ev) {
    ev.stopPropagation();
    klaxon();
    bus.classList.remove('bip'); void bus.offsetWidth; bus.classList.add('bip');
  });

  function passage() {
    bus.classList.remove('roule');
    void bus.offsetWidth; // reflow : retour hors champ, invisible
    bus.classList.add('roule');
    setTimeout(function () { bus.classList.remove('roule'); }, 9600);
  }
  setTimeout(function () { passage(); setInterval(passage, 60000); }, 18000);

  // ── bulles (repère écran direct, plus de facteur d'échelle) ──
  var stage = document.getElementById('stage');
  var bulle = document.getElementById('bulle');
  var pensee = document.getElementById('pensee');
  var ouvert = null;

  function fermer() { bulle.style.display = 'none'; ouvert = null; }

  function ouvrirBulle(perso) {
    var r = perso.getBoundingClientRect();
    var nom = perso.dataset.nom;
    if (nom === 'Roi T-Rex') {
      bulle.innerHTML = 'Je te raconte les dinos !' +
        '<span class="choix">📖 L\'encyclopédie</span>' +
        '<span class="choix">🥚 Le nid</span>' +
        '<span class="choix">🏞 Padidi</span>';
    } else {
      bulle.textContent = perso.dataset.phrase;
    }
    bulle.style.display = 'block';
    var bw = bulle.offsetWidth;
    var x = r.left + r.width / 2 - bw / 2;
    bulle.style.left = Math.max(8, Math.min(window.innerWidth - bw - 8, x)) + 'px';
    bulle.style.top = Math.max(64, r.top - bulle.offsetHeight - 14) + 'px';
    ouvert = perso;
  }

  stage.addEventListener('click', function (ev) {
    if (ev.target.closest('.bus')) return; // le bus klaxonne, il n'ouvre rien
    var p = ev.target.closest('.perso');
    if (p) {
      pensee.style.display = 'none';
      if (ouvert === p) { fermer(); return; }
      ouvrirBulle(p);
      return;
    }
    if (ev.target.closest('.pensee')) { pensee.style.display = 'none'; return; }
    if (!ev.target.closest('.bulle')) fermer();
  });

  // démo bulle-pensée : après 6s, Spino « pense » à un jeu (vignette, zéro texte)
  setTimeout(function () {
    if (ouvert) return;
    var r = document.querySelector('.p-spino').getBoundingClientRect();
    pensee.style.left = Math.min(r.right - 30, window.innerWidth - 84) + 'px';
    pensee.style.top = Math.max(48, r.top - 52) + 'px';
    pensee.style.display = 'flex';
  }, 6000);
</script>
</body>
</html>
