<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxPlay — Théropodes</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .page { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  /* GRILLE « A » validée : 3 colonnes, vignette ronde (ombre chinoise du dino) */
  .grille { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:6px 16px 16px; }
  .dino {
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:16px 8px;
  }
  .ombre {
    width:66px; height:66px; border-radius:50%;
    background:rgba(214,69,54,.12); /* teinte de la famille */
    display:flex; align-items:center; justify-content:center;
  }
  /* >>> remplacer l'émoji par les vraies ombres chinoises (img) <<< */
  .ombre span { font-size:38px; filter:grayscale(1) brightness(.4) contrast(2); opacity:.85; }
  .dino b { font-size:13px; text-align:center; line-height:1.2; }
</style>
</head>
<body data-ambiance="nuit">
<div class="page">
  <div class="mp-header">
    <button class="mp-back" onclick="location.href='dinos-familles.html'">←</button>
    <div class="mp-title"><span style="font-size:22px">🦖</span>Théropodes</div>
  </div>
  <div class="row" style="padding:0 18px 8px">
    <span class="muted">chasseurs à 2 pattes</span>
    <span style="color:#4a5670">•</span>
    <span style="color:#e0655a; font-weight:900; font-size:12.5px">13 dinos</span>
  </div>

  <div class="grille">
    <div class="dino" onclick="location.href='fiche-dino.html'"><div class="ombre"><span>🦖</span></div><b>T-Rex</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Vélociraptor</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Spinosaure</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Carcharodontosaure</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Allosaure</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Giganotosaure</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Carnotaure</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Dilophosaure</b></div>
    <div class="dino"><div class="ombre"><span>🦖</span></div><b>Compsognathus</b></div>
  </div>
</div>
</body>
</html>
