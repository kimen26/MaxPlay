<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxPlay — Le voyage du temps</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .page { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  .frise { position:relative; display:flex; flex-direction:column; gap:12px; padding:10px 16px 18px; }
  /* trait discret DERRIÈRE les cercles (validé : fin, 35% opacité) */
  .trait { position:absolute; left:44px; top:38px; bottom:38px; width:3px; border-radius:2px; opacity:.35; z-index:0;
           background:linear-gradient(180deg,#2fbf8f,#7fb4ff,#f2a25c,#e0655a,#8fa5cc); }
  .ere { display:flex; gap:12px; position:relative; }
  .rond { width:56px; height:56px; flex-shrink:0; border-radius:50%; background:var(--bg1); box-sizing:border-box;
          display:flex; align-items:center; justify-content:center; font-size:24px; z-index:1; }
  .fiche { flex:1; border-radius:var(--r-card); padding:11px 13px; display:flex; flex-direction:column; gap:4px;
           background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
  .fiche b { font-size:15px; } .fiche small { font-size:11px; color:var(--ink-3); font-weight:700; }
  .btn { border:0; border-radius:999px; padding:5px 12px; font-weight:900; font-size:11.5px; cursor:pointer;
         background:rgba(255,255,255,.12); color:var(--ink-2); font-family:'Nunito',sans-serif; }
</style>
</head>
<body data-ambiance="nuit">
<div class="page">
  <div class="mp-header">
    <button class="mp-back" onclick="location.href='dinos-familles.html'">←</button>
    <div class="mp-title"><span style="font-size:22px">⏳</span>Le voyage du temps</div>
    <button class="mp-hbtn">🔊</button>
  </div>

  <div class="frise">
    <div class="trait"></div>

    <!-- écouté -->
    <div class="ere">
      <div class="rond" style="border:3px solid #2fbf8f">🌱</div>
      <div class="fiche">
        <b>Le Trias <small>— il y a 250 M d'années</small></b>
        <div class="row"><button class="btn" style="background:#2fbf8f;color:#00301e">✓ Écouté</button><span style="font-size:16px">🦕</span></div>
      </div>
    </div>

    <!-- courant : accent + halo + « Continuer » -->
    <div class="ere">
      <div class="rond" style="border:3px solid #7fb4ff; box-shadow:0 0 16px rgba(127,180,255,.5)">🦕</div>
      <div class="fiche" style="background:rgba(127,180,255,.12); border:2px solid #7fb4ff">
        <b>Le Jurassique <small>— 150 M d'années</small></b>
        <div class="row"><button class="btn" style="background:var(--gold);color:var(--gold-ink)">▶ Continuer 👉</button><span style="font-size:16px">🦕🦕🦖</span></div>
      </div>
    </div>

    <!-- à venir -->
    <div class="ere" style="opacity:.75">
      <div class="rond" style="border:3px solid #f2a25c">🦖</div>
      <div class="fiche"><b>Le Crétacé <small>— 100 M d'années</small></b>
        <div class="row"><button class="btn">▶ Écouter</button><span style="font-size:16px">🦖🦕</span></div></div>
    </div>
    <div class="ere" style="opacity:.75">
      <div class="rond" style="border:3px solid #e0655a">☄️</div>
      <div class="fiche"><b>La météorite ! <small>— 66 M d'années</small></b>
        <div class="row"><button class="btn">▶ Écouter</button><span style="font-size:16px">💥</span></div></div>
    </div>
    <div class="ere" style="opacity:.75">
      <div class="rond" style="border:3px solid #8fa5cc">🐦</div>
      <div class="fiche"><b>Et aujourd'hui ? <small>— les oiseaux !</small></b>
        <div class="row"><button class="btn">▶ Écouter</button><span style="font-size:16px">🐔</span></div></div>
    </div>
  </div>
</div>
</body>
</html>
